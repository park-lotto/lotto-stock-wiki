<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제품 찾기 — 쇼핑쇼츠</title>
<style>
  :root{--bg:#0a0e14;--panel:#111722;--line:#1e2735;--txt:#e6edf3;--sub:#8b98a9;--accent:#2f81f7;--ok:#2ea043;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic',system-ui,sans-serif;display:flex;min-height:100vh}
  .sidebar{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:16px;flex-shrink:0}
  .sidebar h1{font-size:14px;color:var(--sub);margin-bottom:16px}
  .menu-item{padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:2px;cursor:pointer}
  .menu-item.active{background:linear-gradient(90deg,#153a6b,#0d2340);color:#7db4ff}
  .main{flex:1;padding:28px 36px;overflow:auto}
  .head h2{font-size:24px;margin-bottom:6px}
  .desc{color:var(--sub);font-size:13px;margin-bottom:18px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  input,select,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);padding:9px 14px;border-radius:8px;font-size:13px}
  input{flex:1;min-width:220px}
  button{cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .empty{color:var(--sub);text-align:center;padding:60px}

  .layout{display:flex;gap:20px;align-items:flex-start}
  .video-panel{width:280px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px;position:sticky;top:20px}
  .video-panel video{width:100%;border-radius:8px;background:#000;display:block}
  .video-panel .src-label{font-size:11px;color:var(--sub);margin-top:10px}
  .video-panel .src-link{font-size:12px;word-break:break-all;color:var(--accent);text-decoration:none;display:block;margin-top:2px}

  .info-panel{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px}
  .info-panel h3{font-size:18px;margin-bottom:8px}
  .category-badge{display:inline-block;background:#0d131c;border:1px solid var(--line);border-radius:20px;padding:4px 12px;font-size:12px;color:var(--sub);margin-bottom:14px}
  .section-label{font-size:12px;color:var(--sub);text-transform:uppercase;margin-bottom:8px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:6px}
  .chip{background:#0d131c;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--txt)}
  .hint{font-size:11px;color:var(--sub);margin-bottom:16px}
  .lens-row{margin:14px 0;font-size:13px}
  .lens-row a{color:var(--accent);text-decoration:none;margin-right:8px}

  .grid-table{width:100%;border-collapse:separate;border-spacing:0 8px}
  .grid-table td{vertical-align:top;padding:4px 8px 4px 0}
  .ch-cell{width:110px;white-space:nowrap;font-size:13px;font-weight:600;padding-top:10px}
  .link-cell{background:#0d131c;border:1px solid var(--line);border-radius:10px;padding:8px 10px;min-width:150px}
  .lang-row{display:flex;align-items:center;gap:6px;font-size:12px;padding:3px 0}
  .lang-row .flag{flex-shrink:0}
  .lang-row .kw-text{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:default}
  .lang-row .kw-text.muted{color:var(--sub);font-style:italic}
  .icon-btn{background:transparent;border:1px solid var(--line);border-radius:6px;padding:2px 6px;font-size:11px;color:var(--txt);cursor:pointer;flex-shrink:0;text-decoration:none;line-height:1.4}
  .icon-btn:hover{border-color:var(--accent);color:var(--accent)}
  .icon-btn.copied{border-color:var(--ok);color:var(--ok)}

  @media (max-width: 900px){
    .layout{flex-direction:column}
    .video-panel{width:100%;position:static}
  }
  @media (max-width: 768px){
    body{flex-direction:column;min-height:100vh}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px;
             display:flex;gap:6px;overflow-x:auto;align-items:center;white-space:nowrap}
    .sidebar h1{margin:0 8px 0 0;flex-shrink:0}
    .menu-item{margin:0;padding:6px 10px;flex-shrink:0;font-size:12px}
    .main{padding:16px 14px}
    .head h2{font-size:20px}
    .toolbar{gap:8px}
    .grid-table, .grid-table tbody, .grid-table tr, .grid-table td{display:block;width:100%}
    .ch-cell{padding-top:0}
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <h1>🛍️ 쇼핑쇼츠</h1>
    <div class="menu-item" onclick="location.href='/'">📊 레퍼런스 랭킹</div>
    <div class="menu-item active">🔍 제품 찾기</div>
    <div class="menu-item" onclick="location.href='/mix'">🎬 영상 믹싱</div>
    <div class="menu-item" onclick="location.href='/outreach'">💬 소통 큐</div>
  </aside>
  <main class="main">
    <div class="head"><h2>🔍 제품 찾기</h2></div>
    <div class="desc">레퍼런스 영상에서 실제로 파는 제품 소스를 찾습니다. 영상을 다운로드해 프레임을 추출하고 Gemini로 키워드를 분석한 뒤, 채널×언어별 검색 링크를 만들어줍니다 — 결과는 각 플랫폼 자체 검색으로 직접 이동해서 확인합니다(임베드 아님, 그래서 100% 정확).</div>
    <div class="toolbar">
      <input id="scInput" placeholder="분석할 항목의 shortcode 또는 레퍼런스에서 담기로 넘어옴">
      <button class="primary" onclick="doAnalyze()">분석</button>
    </div>
    <div id="result"><div class="empty">shortcode를 입력하고 분석을 눌러주세요.</div></div>
  </main>
<script>
const params = new URLSearchParams(location.search);
const AUTO_SC = params.get("shortcode");
let CUR_SC = null;  // 마지막으로 분석 완료된 shortcode

async function doAnalyze(){
  const sc = document.getElementById("scInput").value || AUTO_SC;
  if(!sc) return;
  CUR_SC = sc;
  document.getElementById("result").innerHTML = '<div class="empty">분석 중… (영상 다운로드+Gemini 분석, 수십 초 소요)</div>';
  try{
    const r = await fetch(`/api/find/analyze?shortcode=${encodeURIComponent(sc)}`, {method:"POST"});
    const d = await r.json();
    if(!d.ok){ document.getElementById("result").innerHTML = `<div class="empty">❌ ${d.error||"실패"}</div>`; return; }
    // 서버가 입력값(추적파라미터 등 포함 가능)을 정식 shortcode로 정규화해서
    // 돌려준다 — 이후 호출은 이 정식값으로 해야 같은 분석 결과를 참조한다.
    if(d.shortcode) CUR_SC = d.shortcode;
    renderResult(d);
  }catch(e){
    document.getElementById("result").innerHTML = `<div class="empty">❌ ${e.message}</div>`;
  }
}

const PLATFORM_LABEL = {youtube:"▶️ YouTube", tiktok:"🎵 TikTok", instagram:"📱 Instagram", xiaohongshu:"📕 샤오홍슈", douyin:"🎬 도우인"};
// 모든 플랫폼에 5개 언어(한/영/중/일/러) 전부 노출(2026-07-11, "언어설정이
// 지정 안됨" 피드백 대응 — 이전엔 플랫폼당 2개 언어만 하드코딩 노출이라
// 나머지 3개 언어 후보는 API가 만들어놔도 화면에 아예 안 보였음).
const PLATFORM_LANGS = {
  youtube: ["ko", "en", "zh", "ja", "ru"], tiktok: ["ko", "en", "zh", "ja", "ru"],
  instagram: ["ko", "en", "zh", "ja", "ru"], xiaohongshu: ["ko", "en", "zh", "ja", "ru"],
  douyin: ["ko", "en", "zh", "ja", "ru"],
};
const LANG_FLAG = {ko:"🇰🇷", en:"🌐", zh:"🇨🇳", ja:"🇯🇵", ru:"🇷🇺"};

function renderResult(d){
  const kwList = d.keywords.ko || [];
  const kw = kwList.map(k=>`<span class="chip">${k}</span>`).join("");
  const lensLinks = (d.lens_links||[]).map((u,i)=>`<a href="${u}" target="_blank">🔍 프레임${i+1}</a>`).join(" ");

  document.getElementById("result").innerHTML = `
    <div class="layout">
      <div class="video-panel">
        <video src="${d.video_url}" controls></video>
        <div class="src-label">입력 영상</div>
        <a class="src-link" href="${CUR_SC}" target="_blank">${CUR_SC}</a>
      </div>
      <div class="info-panel">
        <h3>${d.category || "제품 검색"}</h3>
        <div class="category-badge">${d.category || "-"}</div>
        <div class="section-label">키워드</div>
        <div class="chips">${kw}</div>
        <div class="hint">채널·언어별 검색어를 클릭하면 해당 플랫폼 자체 검색으로 바로 이동합니다 · 📋는 복사</div>
        ${renderLinkGrid(d.search_links)}
        <div class="lens-row"><b>Google Lens 역검색</b><br>${lensLinks}</div>
      </div>
    </div>
  `;
}

function renderLinkGrid(searchLinks){
  const rows = Object.keys(PLATFORM_LABEL).map(platform => {
    const byLang = searchLinks[platform] || {};
    const langs = PLATFORM_LANGS[platform];
    // 채널당 컬럼 수 = 그 채널의 기본언어 중 가장 후보가 많은 쪽 기준
    const colCount = Math.max(1, ...langs.map(l => (byLang[l] || []).length));
    const cells = Array.from({length: colCount}, (_, col) => `
      <td class="link-cell">
        ${langs.map(lang => renderLangRow(byLang[lang], col, lang)).join("")}
      </td>
    `).join("");
    return `<tr><td class="ch-cell">${PLATFORM_LABEL[platform]}</td>${cells}</tr>`;
  }).join("");
  return `<table class="grid-table"><tbody>${rows}</tbody></table>`;
}

function renderLangRow(items, col, lang){
  const item = (items || [])[col];
  if(!item){
    return `<div class="lang-row"><span class="flag">${LANG_FLAG[lang]}</span><span class="kw-text muted">번역 없음</span></div>`;
  }
  const safeKw = item.keyword.replace(/'/g, "&#39;");
  return `
    <div class="lang-row">
      <span class="flag">${LANG_FLAG[lang]}</span>
      <span class="kw-text" title="${item.keyword}">${item.keyword}</span>
      <a class="icon-btn" href="${item.url}" target="_blank" title="이 플랫폼에서 검색">🔗</a>
      <button class="icon-btn" onclick="copyKeyword('${safeKw}', this)" title="검색어 복사">📋</button>
    </div>
  `;
}

async function copyKeyword(text, btn){
  try{
    await navigator.clipboard.writeText(text);
    btn.classList.add("copied");
    btn.textContent = "✓";
    setTimeout(()=>{ btn.classList.remove("copied"); btn.textContent = "📋"; }, 1200);
  }catch(e){
    btn.textContent = "❌";
    setTimeout(()=>{ btn.textContent = "📋"; }, 1200);
  }
}

if(AUTO_SC){ document.getElementById("scInput").value = AUTO_SC; doAnalyze(); }
</script>
</body>
</html>
