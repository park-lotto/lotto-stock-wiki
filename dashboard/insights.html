<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>인사이트 허브 — 로또의 주식</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
:root {
  --gold: #d4af37; --gold-dim: #9a7d28; --bg: #0a0a0a;
  --card: #16161a; --line: #2a2a30; --txt: #e8e6e0; --muted: #8a8a92;
  --yt: #7c3aed; --yt-bg: #1a0e2e; --yt-line: #3d1f6b;
  --tg: #0891b2; --tg-bg: #0c1f25; --tg-line: #1a4a55;
  --rp: #d4af37; --rp-bg: #1a1608; --rp-line: #4a3d10;
  --bl: #22c55e; --bl-bg: #0c1f12; --bl-line: #1a4a2a;
  --nw: #f97316; --nw-bg: #1f1308; --nw-line: #4a2f10;
  --buy: #16a34a; --sell: #dc2626; --neutral: #6b7280;
  --bull: #16a34a; --bear: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--txt); font-family: 'Segoe UI','Malgun Gothic',sans-serif; min-height: 100vh; }

/* ── 네비 ── */
.topbar {
  height: 54px; background: var(--card); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; padding: 0 28px; gap: 6px;
  position: sticky; top: 0; z-index: 100;
}
.topbar .brand { font-size: .92rem; font-weight: 700; color: var(--gold); letter-spacing: .5px; margin-right: 20px; white-space: nowrap; }
.nav-link {
  padding: 6px 16px; border-radius: 7px; font-size: .84rem; color: var(--muted);
  text-decoration: none; transition: color .15s, background .15s; cursor: pointer; border: none; background: transparent; font-family: inherit;
}
.nav-link:hover { color: var(--txt); background: #1f1f26; }
.nav-link.active { color: var(--gold); border-bottom: 2px solid var(--gold); border-radius: 0; padding-bottom: 4px; }
.topbar .live { margin-left: auto; font-size: .72rem; color: var(--muted); }

/* ── 페이지 컨테이너 ── */
#app { max-width: 1400px; margin: 0 auto; padding: 0 28px 80px; }

/* ── 로딩/에러/빈상태 ── */
.state-box { text-align: center; padding: 80px 20px; color: var(--muted); }
.state-box .ico { font-size: 2.4rem; margin-bottom: 14px; }
.state-box .msg { font-size: .9rem; line-height: 1.6; }
.state-box .retry { margin-top: 16px; padding: 8px 20px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; color: var(--txt); cursor: pointer; font-size: .84rem; }
.spinner {
  width: 32px; height: 32px; border: 3px solid var(--line); border-top-color: var(--gold);
  border-radius: 50%; animation: spin .7s linear infinite; margin: 0 auto 14px;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ── 브레드크럼 ── */
.breadcrumb {
  display: flex; align-items: center; gap: 6px; padding: 18px 0 0;
  font-size: .78rem; color: var(--muted); flex-wrap: wrap;
}
.breadcrumb .crumb { cursor: pointer; color: var(--muted); transition: color .15s; }
.breadcrumb .crumb:hover { color: var(--gold); }
.breadcrumb .sep { color: #3a3a42; }
.breadcrumb .cur { color: var(--txt); }

/* ── L0 히어로 ── */
.hero { padding: 36px 0 28px; }
.hero h1 { font-size: 1.7rem; font-weight: 800; letter-spacing: -.5px; margin-bottom: 5px; }
.hero h1 .gold { color: var(--gold); }
.hero .sub { color: var(--muted); font-size: .85rem; margin-bottom: 24px; }
.search-wrap { position: relative; max-width: 680px; }
.search-wrap input {
  width: 100%; padding: 15px 50px 15px 20px; background: var(--card); border: 1px solid var(--line);
  border-radius: 12px; color: var(--txt); font-family: inherit; font-size: .95rem;
  transition: border-color .2s;
}
.search-wrap input:focus { outline: none; border-color: var(--gold-dim); }
.search-wrap input::placeholder { color: var(--muted); }
.search-wrap .search-btn {
  position: absolute; right: 12px; top: 50%; transform: translateY(-50%);
  background: transparent; border: none; cursor: pointer; font-size: 1.2rem; color: var(--muted);
  transition: color .15s;
}
.search-wrap .search-btn:hover { color: var(--gold); }

/* ── 첫화면 브리핑 바 ── */
.brief-bar { width: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 20px 24px; }
.brief-research.on { background: var(--bl-bg); border-color: #22c55e; color: #4ade80; }
.brief-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
.brief-row:last-of-type { margin-bottom: 0; }
.brief-lbl { font-size: .74rem; color: var(--muted); font-weight: 700; }
.brief-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.bchip { padding: 6px 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--muted); font-family: inherit; font-size: .82rem; cursor: pointer; transition: all .15s; }
.bchip.on { background: var(--rp-bg); border-color: var(--gold); color: var(--gold); }
.brief-sel { padding: 6px 10px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--txt); font-family: inherit; font-size: .82rem; }
.brief-input { flex: 1; min-width: 200px; padding: 11px 16px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--txt); font-family: inherit; font-size: .92rem; outline: none; }
.brief-input:focus { border-color: var(--gold-dim); }
.brief-go { padding: 11px 20px; border-radius: 10px; border: none; background: var(--gold); color: #0a0a0a; font-family: inherit; font-size: .88rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: filter .15s; }
.brief-go:hover { filter: brightness(1.1); }
.brief-hint { font-size: .74rem; color: var(--muted); margin-top: 10px; }

/* ── 메인 2단 레이아웃 (좌: 시그널 / 우: 라이브러리) ── */
.main-2col { display: grid; grid-template-columns: 1.7fr 1fr; gap: 22px; align-items: start; margin: 26px 0 8px; }
.side-title { font-size: .8rem; font-weight: 700; color: var(--muted); margin-bottom: 10px; text-transform: uppercase; letter-spacing: .5px; }
.cat-grid-side { display: grid; grid-template-columns: 1fr; gap: 10px; }
.cat-grid-side .cat-card { border-radius: 12px; }
.cat-grid-side .cat-card .body { padding: 12px 16px; }
.cat-grid-side .cat-card .divider, .cat-grid-side .cat-card .hot-label, .cat-grid-side .cat-card .hot-item, .cat-grid-side .cat-card .go-btn { display: none; }
.cat-grid-side .cat-card .meta { margin-bottom: 0; }
@media (max-width: 900px) { .main-2col { grid-template-columns: 1fr; } .cat-grid-side { grid-template-columns: repeat(auto-fit, minmax(220px,1fr)); } }

/* ── 🔥 오늘의 시그널 ── */
.signals-box { margin: 0; }
.sig-title { font-size: .88rem; font-weight: 700; color: var(--gold); margin-bottom: 12px; }
.sig-title small { color: var(--muted); font-weight: 400; font-size: .72rem; margin-left: 6px; }
.sig-grp { font-size: .74rem; font-weight: 700; color: var(--muted); margin: 14px 0 7px; }
.sig-grp small { color: var(--gold-dim); }
.sig-list { display: flex; flex-direction: column; gap: 5px; }
.sig-row { padding: 9px 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px; transition: border-color .15s, background .15s; }
.sig-row:hover { border-color: var(--gold-dim); background: #1c1c22; }
.sig-main { display: flex; align-items: center; gap: 12px; cursor: pointer; }
.sig-asset { font-size: .92rem; font-weight: 700; min-width: 120px; }
.sig-cnt { font-size: .78rem; color: var(--muted); white-space: nowrap; }
.sig-cnt b { color: var(--txt); }
.sig-trend { font-size: .78rem; min-width: 56px; }
.sig-up { color: #4ade80; } .sig-dn { color: #f87171; } .sig-flat { color: var(--muted); } .sig-new { color: var(--gold); font-weight: 700; }
.sig-cats { display: flex; gap: 3px; }
.sig-cat { font-size: .82rem; }
.sig-flags { display: flex; gap: 5px; flex: 1; }
.sig-badge { font-size: .66rem; padding: 2px 6px; border-radius: 6px; font-weight: 700; white-space: nowrap; }
.sig-badge.red { background: #2a0e0e; color: #f87171; border: 1px solid #5a1a1a; }
.sig-badge.warn { background: #2a220e; color: #fbbf24; border: 1px solid #5a4a1a; }
.sig-go { font-size: .74rem; color: var(--gold-dim); white-space: nowrap; }
.sig-row:hover .sig-go { color: var(--gold); }
.sig-sample { font-size: .77rem; color: var(--muted); margin-top: 5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-left: 2px; }
.sig-srcs { font-size: .7rem; color: var(--gold-dim); margin-top: 6px; display: flex; flex-wrap: wrap; gap: 5px; align-items: center; }
.sig-src { background: #16161c; border: 1px solid var(--line); border-radius: 6px; padding: 1px 7px; color: #cbd5c0; }
.sig-facts { margin-top: 7px; display: flex; flex-direction: column; gap: 7px; }
.sig-fact { border-left: 2px solid var(--gold-dim); padding: 3px 0 3px 10px; }
.sig-fact-txt { font-size: .8rem; color: #d7dbd0; line-height: 1.5; }
.sig-fact-meta { font-size: .68rem; color: var(--muted); margin-top: 3px; }
.sig-more { margin-top: 7px; background: none; border: none; color: var(--gold-dim); font-size: .72rem; cursor: pointer; padding: 2px 0; }
.sig-more:hover { color: var(--gold); }
/* 최근 브리핑 기록 */
.brief-hist { display: flex; flex-direction: column; gap: 6px; }
.bh-item { padding: 8px 11px; background: var(--card); border: 1px solid var(--line); border-radius: 9px; cursor: pointer; transition: border-color .15s, background .15s; }
.bh-item:hover { border-color: var(--gold-dim); background: #1c1c22; }
.bh-label { font-size: .82rem; font-weight: 600; color: var(--txt); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bh-meta { font-size: .68rem; color: var(--muted); margin-top: 3px; }
.bh-empty { font-size: .74rem; color: var(--muted); padding: 8px 2px; }

/* ── 브리핑 워크스페이스 (전체화면 2단) ── */
.ws-overlay { position: fixed; inset: 0; z-index: 600; background: var(--bg); display: none; flex-direction: column; }
.ws-overlay.open { display: flex; }
.ws-top { height: 58px; flex-shrink: 0; display: flex; align-items: center; gap: 16px; padding: 0 24px; background: var(--card); border-bottom: 1px solid var(--line); }
.ws-title { font-size: 1rem; font-weight: 700; color: var(--gold); white-space: nowrap; }
.ws-meta { font-size: .8rem; color: var(--muted); flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-meta b { color: var(--txt); }
.ws-close { padding: 7px 16px; border-radius: 8px; border: 1px solid var(--line); background: var(--bg); color: var(--txt); font-family: inherit; font-size: .82rem; cursor: pointer; white-space: nowrap; }
.ws-close:hover { border-color: var(--gold-dim); color: var(--gold); }
.ws-home { padding: 8px 16px; border-radius: 9px; border: 1px solid var(--gold-dim); background: var(--rp-bg); color: var(--gold); font-family: inherit; font-size: .84rem; font-weight: 700; cursor: pointer; white-space: nowrap; transition: background .15s; }
.ws-home:hover { background: #221c0a; }
.ws-body { flex: 1; display: flex; min-height: 0; }
.ws-left { width: 340px; flex-shrink: 0; border-right: 1px solid var(--line); padding: 18px; overflow-y: auto; display: flex; flex-direction: column; gap: 18px; background: var(--card); }
.ws-ai-box { background: var(--bg); border: 1px solid var(--line); border-radius: 11px; padding: 12px; }
.ws-ai-claude { border-color: #3d2f6b; background: #140e22; }
.ws-ai-gemini { border-color: #1a4a55; background: #0c1f25; }
.ws-src { margin-top: 10px; font-size: .74rem; color: var(--muted); }
.ws-src a { color: #67e8f9; }
.ws-sources .ws-act-label { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.ws-pull { margin-left: auto; padding: 3px 9px; border-radius: 6px; border: 1px solid var(--gold-dim); background: transparent; color: var(--gold); font-family: inherit; font-size: .68rem; cursor: pointer; }
.ws-pull:hover { background: var(--rp-bg); }
.ws-src-list { display: flex; flex-direction: column; gap: 3px; max-height: 130px; overflow-y: auto; }
.ws-src-item { font-size: .76rem; color: var(--txt); line-height: 1.5; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-merge-picker { margin-top: 8px; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); max-height: 220px; overflow-y: auto; }
.ws-merge-item { display: flex; align-items: center; gap: 6px; font-size: .78rem; padding: 4px 0; cursor: pointer; }
.ws-merge-item small { color: var(--muted); font-size: .68rem; }
.ws-resume {
  position: fixed; right: 24px; bottom: 24px; z-index: 550; display: none;
  padding: 12px 20px; border-radius: 12px; border: 1px solid var(--gold); background: var(--rp-bg);
  color: var(--gold); font-family: inherit; font-size: .88rem; font-weight: 700; cursor: pointer;
  box-shadow: 0 6px 24px rgba(0,0,0,.5);
}
.ws-resume.show { display: block; }
.ws-resume:hover { background: #221c0a; }
.ws-ai-label { font-size: .76rem; font-weight: 700; color: var(--txt); margin-bottom: 8px; display: flex; align-items: baseline; gap: 6px; }
.ws-ai-label small { font-weight: 400; color: var(--muted); font-size: .68rem; }
.ws-ask { display: flex; gap: 8px; }
.ws-q-input { flex: 1; padding: 10px 14px; border-radius: 9px; border: 1px solid var(--line); background: var(--bg); color: var(--txt); font-family: inherit; font-size: .86rem; outline: none; }
.ws-q-input:focus { border-color: var(--gold-dim); }
.ws-act-group { display: flex; flex-direction: column; gap: 8px; align-items: stretch; }
.ws-act-label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; font-weight: 700; }
.ws-act-group .nb-act { text-align: left; }
.ws-presets { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin-top: 8px; }
.ws-preset { padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--txt); font-family: inherit; font-size: .73rem; cursor: pointer; transition: border-color .15s, color .15s; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ws-preset:hover { border-color: var(--gold); color: var(--gold); }
.ws-spresets { display: grid; grid-template-columns: 1fr 1fr; gap: 5px; margin: 8px 0; }
.ws-img-attach { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
.ws-img-name { font-size: .72rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ws-right { flex: 1; min-width: 0; overflow-y: auto; padding: 22px 26px; }
.ws-canvas { max-width: 920px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
.ws-empty { text-align: center; color: var(--muted); padding: 80px 20px; font-size: .9rem; line-height: 1.9; }
.ws-empty .spinner { margin: 0 auto 14px; }
.ws-card { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.ws-card-h { padding: 12px 18px; font-size: .82rem; font-weight: 700; color: var(--gold); border-bottom: 1px solid var(--line); background: var(--rp-bg); }
.ws-card-b { padding: 18px; font-size: .9rem; line-height: 1.75; color: var(--txt); }
.ws-card-b .nb-qa-q { font-size: .86rem; font-weight: 700; color: var(--txt); margin-bottom: 10px; }
.ws-card-b .nb-qa-a h1, .ws-card-b .nb-qa-a h2, .ws-card-b .nb-qa-a h3 { font-size: 1rem; margin: 14px 0 6px; color: var(--gold); }
.ws-card-b .nb-qa-a strong { color: #fff; }
.ws-card-b .nb-qa-a ul, .ws-card-b .nb-qa-a ol { margin: 6px 0 6px 20px; }
.ws-art-tools { display: flex; gap: 12px; margin-bottom: 12px; }
@media (max-width: 820px) {
  .ws-body { flex-direction: column; }
  .ws-left { width: 100%; border-right: none; border-bottom: 1px solid var(--line); }
}

/* ── NotebookLM 다리 ── */
.nb-bar { display: flex; align-items: center; gap: 12px; margin: 14px 0 18px; flex-wrap: wrap; }
.nb-make-btn {
  padding: 9px 18px; border-radius: 9px; cursor: pointer; font-family: inherit;
  font-size: .84rem; font-weight: 700; color: #0a0a0a; background: var(--gold);
  border: none; transition: filter .15s, transform .15s;
}
.nb-make-btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
.nb-hint { font-size: .76rem; color: var(--muted); }
.nb-open {
  display: inline-block; padding: 9px 16px; border-radius: 9px; text-decoration: none;
  font-size: .84rem; font-weight: 700; color: var(--gold);
  background: var(--rp-bg); border: 1px solid var(--rp-line); transition: background .15s;
}
.nb-open:hover { background: #221c0a; }
.nb-actions { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.nb-actions-label { font-size: .68rem; color: var(--muted); text-transform: uppercase; letter-spacing: .8px; margin-bottom: 2px; }
.nb-act {
  padding: 8px 14px; border-radius: 8px; cursor: pointer; font-family: inherit;
  font-size: .82rem; font-weight: 600; color: var(--txt);
  background: var(--card); border: 1px solid var(--line); transition: border-color .15s, color .15s;
}
.nb-act:hover:not(:disabled) { border-color: var(--gold-dim); color: var(--gold); }
.nb-act:disabled { opacity: .7; cursor: default; }
.nb-act small { color: var(--muted); font-weight: 400; }
.nb-result { line-height: 1.6; }
.nb-sub { color: var(--muted); font-size: .84rem; margin-bottom: 16px; }
.nb-ask-row { display: flex; gap: 8px; margin-bottom: 10px; }
.nb-q-input {
  flex: 1; padding: 10px 14px; border-radius: 9px; font-family: inherit; font-size: .86rem;
  color: var(--txt); background: var(--bg); border: 1px solid var(--line); outline: none;
}
.nb-q-input:focus { border-color: var(--gold-dim); }
.nb-answer { max-height: 46vh; overflow-y: auto; }
.nb-loading { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: .82rem; padding: 10px 2px; }
.nb-qa { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; margin-bottom: 10px; }
.nb-qa-q { font-size: .82rem; font-weight: 700; color: var(--gold); margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
.nb-qa-a { font-size: .86rem; line-height: 1.7; color: var(--txt); }
.nb-qa-a h1, .nb-qa-a h2, .nb-qa-a h3 { font-size: .95rem; margin: 12px 0 6px; color: var(--gold); }
.nb-qa-a p { margin: 6px 0; }
.nb-qa-a ul, .nb-qa-a ol { margin: 6px 0 6px 18px; }
.nb-qa-a strong { color: #fff; }
.nb-act-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 10px; }
.nb-open-sm { font-size: .78rem; color: var(--gold-dim); text-decoration: none; margin-left: auto; }
.nb-open-sm:hover { color: var(--gold); }
.nb-opt-label { font-size: .72rem; color: var(--muted); text-transform: uppercase; letter-spacing: .6px; margin: 16px 0 8px; font-weight: 700; }
.nb-opt-cats { display: flex; flex-wrap: wrap; gap: 8px; }
.nb-cat-item { display: inline-flex; align-items: center; gap: 6px; padding: 7px 12px; border: 1px solid var(--line); border-radius: 9px; font-size: .84rem; cursor: pointer; background: var(--bg); }
.nb-cat-item b { color: var(--gold); font-size: .8rem; }
.nb-cat-item.off { opacity: .4; cursor: not-allowed; }
.nb-cat-item input { cursor: pointer; }
.nb-opt-period { display: flex; flex-wrap: wrap; gap: 8px; }
.nb-pchip { padding: 7px 14px; border: 1px solid var(--line); border-radius: 9px; background: var(--bg); color: var(--txt); font-family: inherit; font-size: .84rem; cursor: pointer; transition: border-color .15s, background .15s; }
.nb-pchip b { color: var(--muted); font-size: .78rem; font-weight: 400; }
.nb-pchip:hover { border-color: var(--gold-dim); }
.nb-pchip.active { background: var(--rp-bg); border-color: var(--gold); color: var(--gold); }
.nb-pchip.active b { color: var(--gold-dim); }
.nb-opt-row { display: flex; flex-wrap: wrap; gap: 16px; align-items: center; margin: 18px 0 14px; font-size: .84rem; color: var(--muted); }
.nb-opt-row label { display: inline-flex; align-items: center; gap: 6px; }
.nb-opt-row input[type=number] { width: 70px; padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--txt); font-family: inherit; }
.nb-opt-row select { padding: 6px 8px; border-radius: 7px; border: 1px solid var(--line); background: var(--bg); color: var(--txt); font-family: inherit; }
.nb-chk { cursor: pointer; }
.nb-studio-msg { margin-top: 8px; }
.nb-studio-ok { font-size: .82rem; color: var(--txt); background: var(--bl-bg); border: 1px solid var(--bl-line); border-radius: 9px; padding: 10px 14px; line-height: 1.6; }

<!-- 닫은 워크스페이스로 돌아가기 -->
<button class="ws-resume" id="ws-resume" onclick="reopenWorkspace()">🧠 <span id="ws-resume-label">브리핑</span> 이어보기 ▸</button>

<!-- 토스트 -->
<div class="toast" id="toast"></div>

<script>
marked.setOptions({ breaks: true, gfm: true });

// ── 상태 ──
const state = {
  breadcrumb: [], // [{label, fn}]
  currentView: null,
  docKey: null,
};

// ── 라우터 (브라우저 뒤로/앞으로 지원) ──
let _restoring = false;   // popstate 복원 중엔 새 히스토리 push 금지
function pushNav(viewObj) {
  if (_restoring) return;
  // 최초 진입은 replace, 이후는 push
  if (history.state == null) history.replaceState(viewObj, '');
  else history.pushState(viewObj, '');
}
function restoreNav(s) {
  _restoring = true;
  try {
    if (!s || s.view === 'L0') showL0();
    else if (s.view === 'L1') showL1(s.category);
    else if (s.view === 'L2') showL2(s.category, s.source);
    else if (s.view === 'L3') showL3(s.docKey);
    else if (s.view === 'search') showL0();  // 검색은 메인으로 복원
    else showL0();
  } finally {
    _restoring = false;
  }
}
window.addEventListener('popstate', e => restoreNav(e.state));

// ── 날짜 ──
document.getElementById('date-label').textContent = new Date().toLocaleDateString('ko-KR', {month:'numeric',day:'numeric',weekday:'short'});

// ── 유틸 ──
function qs(s) { return document.querySelector(s); }
function render(html) { qs('#view').innerHTML = ''; qs('#view').innerHTML = html; qs('#view').className = 'page'; }
function loading(msg) { render(`<div class="state-box"><div class="spinner"></div><div class="msg">${msg||'불러오는 중...'}</div></div>`); }
function err(msg, retryFn) {
  let btn = retryFn ? `<button class="retry" onclick="(${retryFn.toString()})()">다시 시도</button>` : '';
  render(`<div class="state-box"><div class="ico">⚠️</div><div class="msg">${msg||'오류가 발생했습니다.'}</div>${btn}</div>`);
}
function empty(msg) { render(`<div class="state-box"><div class="ico">📭</div><div class="msg">${msg||'데이터가 없습니다.'}</div></div>`); }

async function apiFetch(url, opts) {
  const res = await fetch(url, opts);
  if (!res.ok) { const t = await res.text().catch(()=>''); throw new Error(t || `HTTP ${res.status}`); }
  return res.json();
}

function toast(msg, isErr) {
  const el = qs('#toast');
  el.textContent = msg;
  el.className = 'toast' + (isErr ? ' err' : '') + ' show';
  clearTimeout(el._t);
  el._t = setTimeout(() => el.classList.remove('show'), 3200);
}

function bcHtml() {
  if (!state.breadcrumb.length) return '';
  const parts = ['<nav class="breadcrumb"><span class="crumb" onclick="showL0()">홈</span>'];
  state.breadcrumb.forEach((b, i) => {
    parts.push('<span class="sep">›</span>');
    if (i < state.breadcrumb.length - 1) {
      parts.push(`<span class="crumb" onclick="${b.fnStr}">${b.label}</span>`);
    } else {
      parts.push(`<span class="cur">${b.label}</span>`);
    }
  });
  parts.push('</nav>');
  return parts.join('');
}

// 카테고리 색/아이콘
const CAT = {
  youtube: { icon: '📺', label: '유튜브', cls: 'youtube' },
  telegram: { icon: '💬', label: '텔레그램', cls: 'telegram' },
  blog: { icon: '📝', label: '블로그', cls: 'blog' },
  report: { icon: '📰', label: '리포트', cls: 'report' },
  news: { icon: '🗞️', label: '뉴스', cls: 'news' },
};
function catCls(c) { return CAT[c] ? CAT[c].cls : ''; }
function catIcon(c) { return CAT[c] ? CAT[c].icon : '📄'; }
function catLabel(c) { return CAT[c] ? CAT[c].label : c; }

// ── L0 메인 ──
async function showL0() {
  state.breadcrumb = [];
  pushNav({ view: 'L0' });
  loading('인사이트 라이브러리 불러오는 중...');
  let data;
  try {
    data = await apiFetch('/api/insights/overview');
  } catch(e) {
    err(`서버에 연결할 수 없습니다.<br><small style="color:var(--muted)">${e.message}</small>`, showL0);
    return;
  }

  const cats = (data.categories || []);
  const feed = (data.feed || []);

  const catCards = cats.map(cat => {
    const cls = catCls(cat.id);
    const ico = catIcon(cat.id);
    const hotItems = (cat.hot || []).slice(0, 3).map(h =>
      `<div class="hot-item"><span class="arrow">▸</span>${escHtml(h.title||'')}</div>`
    ).join('');
    const todayBadge = (cat.today_new > 0) ? `<span class="new-badge">+${cat.today_new} 오늘</span>` : '';
    return `
    <div class="cat-card ${cls}" onclick="showL1('${cat.id}')">
      <div class="stripe"></div>
      <div class="body">
        <div class="header">
          <span class="ico">${ico}</span>
          <span class="ttl">${catLabel(cat.id)}${todayBadge}</span>
        </div>
        <div class="meta">
          <div class="meta-item"><span class="v">${cat.channels ?? cat.docs ?? 0}</span><span class="l">${cat.id === 'youtube' || cat.id === 'telegram' ? '채널' : '소스'}</span></div>
          <div class="meta-item"><span class="v">${cat.docs ?? 0}</span><span class="l">문서</span></div>
          <div class="meta-item"><span class="v">${cat.atoms ?? 0}</span><span class="l">발언</span></div>
        </div>
        ${hotItems ? `<hr class="divider"><div class="hot-label">최근 인사이트</div>${hotItems}` : ''}
      </div>
      <button class="go-btn">${catLabel(cat.id)} 전체 보기 →</button>
    </div>`;
  }).join('');

  const feedRows = feed.length ? feed.map(f => `
    <div class="feed-row" onclick="showL3('${escAttr(f.doc_key)}')">
      <span class="cat-chip ${catCls(f.category)}">${catIcon(f.category)}</span>
      <span class="title">${escHtml(f.title||'(제목 없음)')}</span>
      <span class="source">${escHtml(f.source||'')}</span>
      <span class="atoms">발언 ${f.atoms ?? 0}</span>
      <span class="date">${fmtDate(f.date)}</span>
      <span class="sum-badge ${f.has_summary ? 'yes' : 'no'}">${f.has_summary ? '요약✓' : '요약 '}</span>
    </div>`).join('') : '<div style="color:var(--muted);font-size:.83rem;padding:20px 0;text-align:center">최근 문서가 없습니다.</div>';

  render(`
    <div class="hero">
      <h1>📚 인사이트 <span class="gold">라이브러리</span></h1>
      <p class="sub">크롤링된 모든 소스를, 이것만 보면 되게 · ${data.today || ''}</p>
      <div class="brief-bar">
        <div class="brief-row">
          <span class="brief-lbl">소스</span>
          <div class="brief-chips" id="brief-cats">
            <button type="button" class="bchip on" data-c="telegram" onclick="toggleBChip(this)">💬 텔레</button>
            <button type="button" class="bchip on" data-c="youtube" onclick="toggleBChip(this)">📺 유튜브</button>
            <button type="button" class="bchip on" data-c="report" onclick="toggleBChip(this)">📰 리포트</button>
            <button type="button" class="bchip on" data-c="news" onclick="toggleBChip(this)">🗞️ 뉴스</button>
            <button type="button" class="bchip on" data-c="blog" onclick="toggleBChip(this)">📝 블로그</button>
          </div>
          <button type="button" class="bchip brief-research" id="brief-research" onclick="this.classList.toggle('on')" title="웹 리서치: NotebookLM이 웹에서 자료를 찾아 답합니다 (내 소스 없어도 됨)">🔎 리서치</button>
          <span class="brief-lbl">기간</span>
          <select id="brief-period" class="brief-sel">
            <option value="all">전체</option>
            <option value="today">오늘</option>
            <option value="d3">최근 3일</option>
            <option value="d7">최근 7일</option>
          </select>
        </div>
        <div class="brief-row">
          <input type="text" id="brief-q" class="brief-input" placeholder="무엇을 정리·분석할까요?  (예: 오늘 블로그 중요내용 정리해줘 · 삼성전자 분석)" onkeydown="if(event.key==='Enter')startBriefing()">
          <button class="brief-go" onclick="startBriefing()">🧠 브리핑 시작</button>
        </div>
        <div class="brief-hint">선택한 소스로 노트북을 만들고, 입력한 문구를 워크스페이스에서 자동으로 질문합니다. (키워드면 그 키워드로 좁히고, 요청문이면 소스 전체를 정리) <button class="ws-pull" style="margin-left:8px" onclick="nlmRelogin(this)">🔄 nlm 재로그인</button> <span style="color:var(--gold-dim)">· 서버가 25분마다 자동 유지</span></div>
      </div>
    </div>
    <div class="main-2col">
      <div class="main-left">
        <div id="signals-box" class="signals-box"></div>
      </div>
      <div class="main-right">
        <div class="side-title">📖 최근 브리핑 기록 <small style="color:var(--gold-dim);font-weight:400">클릭하면 그때 본 화면 그대로</small></div>
        <div id="brief-history" class="brief-hist">불러오는 중…</div>
        <div class="side-title" style="margin-top:18px">📚 소스 라이브러리</div>
        <div class="cat-grid-side">${catCards || '<div style="color:var(--muted)">카테고리 없음</div>'}</div>
      </div>
    </div>
    <div class="feed-section">
      <div class="section-title">최근 추가된 인사이트</div>
      ${feedRows}
    </div>
  `);
  loadSignals();
  loadBriefHistory();
}
async function loadBriefHistory() {
  const box = qs('#brief-history'); if (!box) return;
  try {
    const res = await apiFetch('/api/insights/notebooks');
    const nbs = res.notebooks || [];
    if (!nbs.length) { box.innerHTML = '<div class="bh-empty">아직 기록이 없습니다. 위에서 브리핑을 시작하면 여기에 쌓입니다.</div>'; return; }
    box.innerHTML = nbs.map(n =>
      `<div class="bh-item" onclick="openBriefFromHistory('${escAttr(n.id)}','${escAttr(n.label)}','${escAttr(n.url||'')}')">
        <div class="bh-label">🧠 ${escHtml(n.label)}</div>
        <div class="bh-meta">${escHtml(n.date||'')} · ${n.atoms||0}발언 · 다시보기 →</div>
      </div>`).join('');
  } catch(e) { box.innerHTML = '<div class="bh-empty">기록을 불러오지 못했습니다.</div>'; }
}

// ── 🔥 오늘의 시그널 ──
const SIG_CATICON = { youtube: '📺', telegram: '💬', report: '📰', news: '🗞️', blog: '📝' };
const SIG_CATNAME = { youtube: '유튜브', telegram: '텔레', report: '리포트', news: '뉴스', blog: '블로그' };
const SIG_STANCE = { bullish: '🟢강세', bearish: '🔴약세', neutral: '⚪중립' };
let _sigId = 0;
function sigRow(s) {
  const trend = s.is_new ? '<span class="sig-new">🆕</span>'
    : (s.spike > 0 ? `<span class="sig-up">▲${s.spike}</span>`
      : (s.spike < 0 ? `<span class="sig-dn">▼${Math.abs(s.spike)}</span>` : '<span class="sig-flat">=</span>'));
  const consensus = s.n_cats >= 3 ? '<span class="sig-badge red">🔴다채널</span>' : '';
  const conflict = (s.bull > 0 && s.bear > 0) ? '<span class="sig-badge warn">⚠️충돌</span>' : '';
  // 어디서 언급됐는지 — 출처 이름 칩
  const srcChips = (s.sources || []).map(x =>
    `<span class="sig-src">${SIG_CATICON[x.cat] || '·'} ${escHtml(x.name)}</span>`).join('');
  // 팩트 목록(지어내지 않고 원자 본문 그대로)
  const facts = s.facts || [];
  const fid = 'sf' + (++_sigId);
  const factHtml = facts.map(f => `
    <div class="sig-fact">
      <div class="sig-fact-txt">${escHtml(f.content)}</div>
      <div class="sig-fact-meta">${SIG_CATICON[f.cat] || '·'} ${escHtml(f.source)} · ${escHtml(f.date)}${f.stance && SIG_STANCE[f.stance] ? ' · ' + SIG_STANCE[f.stance] : ''}</div>
    </div>`).join('');
  const more = facts.length > 1
    ? `<button class="sig-more" onclick="event.stopPropagation();sigToggle('${fid}',this)">▾ 언급 ${facts.length}건 펼치기</button>`
    : '';
  return `<div class="sig-row">
    <div class="sig-main" onclick="sigBrief('${escAttr(s.asset)}')">
      <span class="sig-asset">${escHtml(s.asset)}</span>
      <span class="sig-cnt">오늘 <b>${s.today}</b> <small>(평균 ${s.prior_avg})</small></span>
      <span class="sig-trend">${trend}</span>
      <span class="sig-flags">${consensus}${conflict}</span>
      <span class="sig-go">브리핑 →</span>
    </div>
    ${srcChips ? `<div class="sig-srcs">언급: ${srcChips}</div>` : ''}
    ${s.sample ? `<div class="sig-sample" id="${fid}-s">${escHtml(s.sample)}${facts.length > 1 ? ' …' : ''}</div>` : ''}
    ${facts.length ? `<div class="sig-facts" id="${fid}" style="display:none">${factHtml}</div>` : ''}
    ${more}
  </div>`;
}
function sigToggle(fid, btn) {
  const box = qs('#' + fid), prev = qs('#' + fid + '-s');
  if (!box) return;
  const open = box.style.display === 'none';
  box.style.display = open ? 'block' : 'none';
  if (prev) prev.style.display = open ? 'none' : 'block';
  btn.textContent = open ? '▴ 접기' : `▾ 언급 ${box.children.length}건 펼치기`;
}
async function loadSignals() {
  const box = qs('#signals-box'); if (!box) return;
  box.innerHTML = '<div class="sig-title">🔥 오늘의 시그널 <small>불러오는 중…</small></div>';
  let data;
  try { data = await apiFetch('/api/insights/signals'); } catch(e) { box.innerHTML = ''; return; }
  const stocks = data.stocks || [], macro = data.macro || [];
  if (!stocks.length && !macro.length) { box.innerHTML = '<div class="sig-title">🔥 오늘의 시그널 <small>오늘 집계 없음(크롤 대기)</small></div>'; return; }
  const grp = (t, arr) => arr.length ? `<div class="sig-grp">${t} <small>${arr.length}</small></div><div class="sig-list">${arr.map(sigRow).join('')}</div>` : '';
  box.innerHTML = `<div class="sig-title">🔥 오늘의 시그널 <small>${data.today} · 클릭하면 그 종목 브리핑</small></div>
    ${grp('📈 종목', stocks)}
    ${grp('🌐 매크로·이슈', macro)}`;
}
function sigBrief(asset) {
  const inp = qs('#brief-q'); if (inp) inp.value = `${asset} 오늘 핵심 정리해줘`;
  // 소스 전체 켠 상태로 브리핑
  document.querySelectorAll('#brief-cats .bchip').forEach(b => b.classList.add('on'));
  startBriefing();
}

// ── L1 소스 목록 ──
async function showL1(category) {
  state.breadcrumb = [{ label: `${catIcon(category)} ${catLabel(category)}`, fnStr: `showL1('${category}')` }];
  pushNav({ view: 'L1', category });
  loading('소스 목록 불러오는 중...');
  let data;
  try {
    data = await apiFetch(`/api/insights/sources?category=${encodeURIComponent(category)}`);
  } catch(e) {
    err(`소스 목록을 불러올 수 없습니다.<br><small>${e.message}</small>`, () => showL1(category));
    return;
  }
  const sources = data.sources || [];
  if (!sources.length) { render(bcHtml() + '<div style="margin-top:24px"></div>'); empty('등록된 소스가 없습니다.'); return; }

  const rows = sources.map(s => `
    <tr onclick="showL2('${category}','${escAttr(s.name)}')">
      <td class="name">${escHtml(s.name)}</td>
      <td>${s.docs ?? 0}</td>
      <td>${s.atoms ?? 0}</td>
      <td class="last-date">${fmtDate(s.last_date)}</td>
      <td><button class="open-btn">열기 →</button></td>
    </tr>`).join('');

  render(`
    ${bcHtml()}
    <div class="list-header">
      <h2>${catIcon(category)} ${catLabel(category)} 채널/소스</h2>
      <span class="count">총 ${sources.length}개</span>
    </div>
    <div class="source-table">
      <table>
        <thead><tr><th>이름</th><th>문서</th><th>발언</th><th>최근</th><th></th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
  `);
}

// ── L2 문서 목록 ──
async function showL2(category, source) {
  state.breadcrumb = [
    { label: `${catIcon(category)} ${catLabel(category)}`, fnStr: `showL1('${category}')` },
    { label: escHtml(source), fnStr: `showL2('${category}','${escAttr(source)}')` },
  ];
  pushNav({ view: 'L2', category, source });
  loading('문서 목록 불러오는 중...');
  let data;
  try {
    data = await apiFetch(`/api/insights/docs?category=${encodeURIComponent(category)}&source=${encodeURIComponent(source)}`);
  } catch(e) {
    err(`문서 목록을 불러올 수 없습니다.<br><small>${e.message}</small>`, () => showL2(category, source));
    return;
  }
  const docs = data.docs || [];
  if (!docs.length) { render(bcHtml() + '<div style="margin-top:24px"></div>'); empty('문서가 없습니다.'); return; }

  const rows = docs.map(d => `
    <div class="doc-row" onclick="showL3('${escAttr(d.doc_key)}')">
      <span class="date-badge">${fmtDate(d.date)}</span>
      <span class="title">${escHtml(d.title||'(제목 없음)')}</span>
      <span class="atoms">발언 ${d.atoms ?? 0}</span>
      <span class="sum-badge ${d.has_summary ? 'yes' : 'no'}">${d.has_summary ? '요약✓' : '요약 '}</span>
      <button class="view-btn">보기 →</button>
    </div>`).join('');

  render(`
    ${bcHtml()}
    <div class="list-header">
      <h2>${escHtml(source)}</h2>
      <span class="count">문서 ${docs.length}개</span>
    </div>
    ${rows}
  `);
}

// ── L3 상세 ──
async function showL3(docKey) {
  state.docKey = docKey;
  // 브레드크럼 유지(이미 있으면 마지막만 교체)
  if (state.breadcrumb.length >= 2) {
    state.breadcrumb[2] = { label: '상세', fnStr: `showL3('${escAttr(docKey)}')` };
  } else if (state.breadcrumb.length === 1) {
    state.breadcrumb[1] = { label: '상세', fnStr: `showL3('${escAttr(docKey)}')` };
  } else {
    state.breadcrumb = [{ label: '상세', fnStr: `showL3('${escAttr(docKey)}')` }];
  }
  pushNav({ view: 'L3', docKey });
  loading('상세 불러오는 중...');
  let data;
  try {
    data = await apiFetch(`/api/insights/doc?doc_key=${encodeURIComponent(docKey)}`);
  } catch(e) {
    err(`문서를 불러올 수 없습니다.<br><small>${e.message}</small>`, () => showL3(docKey));
    return;
  }
  renderL3(data);
}

function renderL3(data) {
  const dk = data.doc_key || '';
  const sum = data.summary;
  const atoms = data.atoms || [];
  const catC = catCls(data.category);
  const catI = catIcon(data.category);

  // 액션 버튼
  const videoBtn = data.video_url
    ? `<a class="action-btn" href="${escAttr(data.video_url)}" target="_blank">▶ 영상</a>`
    : '';
  const srcBtn = `<button class="action-btn" onclick="actionYt('${escAttr(dk)}')">🎬 소재화</button>`;
  const wikiBtn = `<button class="action-btn" onclick="actionWiki('${escAttr(dk)}')">📚 위키</button>`;
  const regenBtn = data.summary ? `<button class="action-btn" onclick="generateSummary('${escAttr(dk)}', true)">🔄 요약 재생성</button>` : '';

  // 요약 블록
  let summaryHtml;
  if (sum) {
    const mv = sum.market_view || 'neutral';
    const mvLabel = mv === 'bullish' ? '강세 🟢' : mv === 'bearish' ? '약세 🔴' : '중립 ⚪';
    const s3 = Array.isArray(sum.summary3) ? sum.summary3 : (sum.summary3 || '').split('\n').filter(Boolean);
    const s3Html = s3.map((s,i) => `<div class="summary3-item"><span class="summary3-num">${i+1}.</span>${escHtml(s)}</div>`).join('');
    const stocks = Array.isArray(sum.stocks) ? sum.stocks : [];
    const stanceHtml = stocks.map(s => {
      const sc = stanceCls(s.stance);
      const stanceLabel = s.stance || '중립';
      return `<span class="stance-chip ${sc}" title="${escAttr(s.reason||'')}">${escHtml(s.name)} <span class="label">${stanceLabel}</span></span>`;
    }).join('');
    const highlights = Array.isArray(sum.highlights) ? sum.highlights : [];
    const hlHtml = highlights.map(h => `
      <div class="hl-item">
        <div class="hl-topic">${escHtml(h.topic||'')}</div>
        <div class="hl-detail">${escHtml(h.detail||'')}</div>
      </div>`).join('');

    summaryHtml = `
    <div class="summary-card">
      <div class="tldr-block">
        <div class="tldr-label">🎯 핵심 한 줄</div>
        <div class="tldr-text">${escHtml(sum.tldr||'')}</div>
      </div>
      <div class="body-grid">
        <div class="summary3-block">
          <div class="summary3-label">💬 핵심 요약 (${s3.length})</div>
          ${s3Html || '<div style="color:var(--muted);font-size:.8rem">요약 없음</div>'}
        </div>
        <div class="market-block">
          <div class="market-label">📊 시장관</div>
          <div class="market-view-badge ${mv}">${mvLabel}</div>
          <div class="market-reason">${escHtml(sum.market_reason||'')}</div>
        </div>
      </div>
    </div>
    ${highlights.length ? `<div class="highlights-card"><div class="card-label">🔑 놓치면 안 되는 포인트 (${highlights.length})</div><div class="hl-list">${hlHtml}</div></div>` : ''}
    ${stocks.length ? `<div class="stocks-card"><div class="card-label">🏷 언급 종목 (${stocks.length})</div><div class="stance-chips">${stanceHtml}</div></div>` : ''}`;
  } else {
    summaryHtml = `
    <div class="gen-summary-box" id="gen-box">
      <div class="msg">AI 요약이 아직 없습니다.<br>생성하면 이 화면에 바로 채워집니다 (수십 초 소요).</div>
      <button class="gen-summary-btn" id="gen-btn" onclick="generateSummary('${escAttr(dk)}')">✨ AI 요약 생성하기</button>
    </div>`;
  }

  // 타임라인 (날짜+시간 명시)
  const tlRows = atoms.map(a => {
    const sig = (a.signal || a.stance || 'default').toLowerCase();
    const hasVideoTs = a.timestamp && /\d/.test(a.timestamp);
    const deeplink = a.deeplink || (data.video_url && hasVideoTs ? `${data.video_url}&t=${a.seconds||0}` : null);
    // 영상이면 ▶시각(클릭→점프), 아니면 날짜/시간 칩
    const tsHtml = hasVideoTs
      ? (deeplink
          ? `<a class="tl-ts" href="${escAttr(deeplink)}" target="_blank" title="영상으로 이동">▶ ${escHtml(a.timestamp)}</a>`
          : `<span class="tl-ts" style="cursor:default">▶ ${escHtml(a.timestamp)}</span>`)
      : `<span class="tl-when">${escHtml(a.when || a.date || '')}</span>`;
    const whenSub = hasVideoTs && a.date ? `<span class="tl-date-sub">${escHtml(a.date)}</span>` : '';
    const tags = [a.asset, a.sector].filter(Boolean).map(t => `<span class="tl-tag">${escHtml(t)}</span>`).join('');
    const speakerHtml = a.speaker ? `<span style="color:var(--muted);font-size:.72rem;margin-right:6px">${escHtml(a.speaker)}</span>` : '';
    return `
    <div class="tl-row">
      <div class="tl-left">${tsHtml}${whenSub}</div>
      <span class="signal-badge ${sig}">${sigLabel(sig)}</span>
      <div class="tl-content">
        ${speakerHtml}${escHtml(a.content||'')}
        ${tags ? `<div class="tl-tags">${tags}</div>` : ''}
      </div>
    </div>`;
  }).join('');

  const tlSection = atoms.length
    ? `<div class="timeline-card">
        <div class="tl-header"><span class="tl-title">📺 발언 타임라인</span><span class="tl-count">${atoms.length}개</span></div>
        ${tlRows}
      </div>`
    : `<div class="state-box"><div class="ico">📭</div><div class="msg">발언 원자가 없습니다.</div></div>`;

  render(`
    ${bcHtml()}
    <div class="detail-header">
      <div class="title-block">
        <div style="display:flex;align-items:center;gap:8px;margin-bottom:8px">
          <span class="cat-chip ${catC}">${catI} ${catLabel(data.category)}</span>
          <span style="color:var(--muted);font-size:.78rem">${escHtml(data.source||'')} · ${fmtDate(data.date)}</span>
        </div>
        <h2>${escHtml(data.title||'(제목 없음)')}</h2>
      </div>
      <div class="action-row">${videoBtn}${regenBtn}${srcBtn}${wikiBtn}</div>
    </div>
    ${summaryHtml}
    ${tlSection}
  `);
}

// ── 요약 생성 ──
async function generateSummary(docKey, force) {
  const btn = qs('#gen-btn');
  const box = qs('#gen-box');
  if (btn) { btn.disabled = true; btn.textContent = '⏳ 생성 중... (수십 초 소요)'; }
  if (box) {
    box.innerHTML += `<div style="margin-top:14px"><div class="spinner"></div><div style="font-size:.78rem;color:var(--muted);margin-top:8px">Claude가 발언을 분석하는 중입니다</div></div>`;
  }
  if (force) toast('요약을 다시 생성하는 중... (수십 초 소요)');
  try {
    const res = await apiFetch('/api/insights/summarize', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ doc_key: docKey, force: !!force })
    });
    toast(force ? '요약을 새로 생성했습니다!' : 'AI 요약이 생성되었습니다!');
    // 페이지 다시 렌더
    const data = await apiFetch(`/api/insights/doc?doc_key=${encodeURIComponent(docKey)}`);
    renderL3(data);
  } catch(e) {
    toast(`요약 생성 실패: ${e.message}`, true);
    if (btn) { btn.disabled = false; btn.textContent = '✨ AI 요약 생성하기'; }
  }
}

// ── 검색 ──
async function doSearch() {
  const q = (qs('#search-input') || { value: '' }).value.trim();
  if (!q) return;
  state.breadcrumb = [{ label: `🔍 "${q}"`, fnStr: `doSearch()` }];
  pushNav({ view: 'search', q });
  loading(`"${q}" 검색 중...`);
  let data;
  try {
    data = await apiFetch(`/api/insights/search?q=${encodeURIComponent(q)}`);
  } catch(e) {
    err(`검색 실패: ${e.message}`, doSearch);
    return;
  }
  const hits = data.hits || [];
  const totalHtml = `<div class="search-header"><h2>🔍 "<span class="q">${escHtml(q)}</span>"</h2><div class="total">총 ${data.total ?? hits.length}건</div></div>`;

  if (!hits.length) {
    render(bcHtml() + totalHtml + '<div style="text-align:center;color:var(--muted);padding:40px 0;font-size:.85rem">검색 결과가 없습니다.</div>');
    return;
  }

  const rows = hits.map(h => {
    const catC = catCls(h.category);
    const catI = catIcon(h.category);
    const stanceC = stanceCls(h.stance);
    return `
    <div class="hit-row" onclick="showL3('${escAttr(h.doc_key)}')">
      <div class="hit-body">
        <div class="hit-source">
          <span class="cat-chip ${catC}">${catI}</span>
          <span>${escHtml(h.source||'')} · ${fmtDate(h.date)}</span>
          ${h.stance ? `<span class="stance-chip ${stanceC}" style="font-size:.66rem;padding:1px 8px">${h.stance}</span>` : ''}
        </div>
        <div style="font-size:.78rem;color:var(--muted);margin-bottom:3px">${escHtml(h.title||'')}</div>
        <div class="hit-content">${escHtml(h.content||'')}</div>
      </div>
      ${h.timestamp ? `<span class="hit-ts">▶ ${h.timestamp}</span>` : ''}
    </div>`;
  }).join('');

  const nbBar = `<div class="nb-bar">
    <button class="nb-make-btn" onclick="openNotebookOptions('${escAttr(q)}')">📒 이 검색을 NotebookLM 노트북으로</button>
    <span class="nb-hint">소스·기간 골라서 노트북 생성 → 바로 질문·리포트·인포그래픽</span>
  </div>`;
  render(bcHtml() + totalHtml + nbBar + rows);
}

// ── NotebookLM 다리: 옵션 패널 ──
const NB_CATS = [
  { id: 'youtube', icon: '📺', label: '유튜브' },
  { id: 'telegram', icon: '💬', label: '텔레그램' },
  { id: 'report', icon: '📰', label: '리포트' },
  { id: 'news', icon: '🗞️', label: '뉴스' },
  { id: 'blog', icon: '📝', label: '블로그' },
];

async function openNotebookOptions(q) {
  openModal('📒 노트북 만들기 — 옵션 선택',
    `<div class="state-box"><div class="spinner"></div><div class="msg">"${escHtml(q)}" 집계 중...</div></div>`);
  let pv;
  try {
    pv = await apiFetch(`/api/insights/notebook_preview?q=${encodeURIComponent(q)}`);
    if (pv.error) throw new Error(pv.error);
  } catch(e) {
    qs('#modal-content').innerHTML = `<div style="color:#e88;padding:8px">집계 실패: ${escHtml(e.message)}</div>`;
    return;
  }
  window._nbOpt = { q, pv };
  const catsHtml = NB_CATS.map(c => {
    const n = (pv.cats && pv.cats[c.id]) || 0;
    const dis = n === 0 ? 'disabled' : '';
    const chk = n === 0 ? '' : 'checked';
    return `<label class="nb-cat-item ${dis?'off':''}"><input type="checkbox" class="nb-cat" value="${c.id}" ${chk} ${dis}> ${c.icon} ${c.label} <b>${n}</b></label>`;
  }).join('');
  const per = pv.periods || {};
  const pBtn = (p, t) => `<button type="button" class="nb-pchip ${p==='all'?'active':''}" data-p="${p}" onclick="setNbPeriod(this)">${t} <b>${per[p]??0}</b></button>`;
  qs('#modal-title').textContent = `📒 노트북 만들기 — "${q}"`;
  qs('#modal-content').innerHTML = `
    <div class="nb-opt">
      <div class="nb-sub">매칭 ${pv.total}건 · 기간 ${pv.dates?.min||'?'} ~ ${pv.dates?.max||'?'} <span style="color:var(--gold-dim)">(건수는 전체 기준)</span></div>

      <div class="nb-opt-label">소스 선택</div>
      <div class="nb-opt-cats">${catsHtml}</div>

      <div class="nb-opt-label">기간</div>
      <div class="nb-opt-period">
        ${pBtn('all','전체')} ${pBtn('today','오늘')} ${pBtn('d3','최근 3일')} ${pBtn('d7','최근 7일')}
      </div>

      <div class="nb-opt-row">
        <label>발언 최대 <input type="number" id="nb-limit" value="200" min="10" max="500" step="10"></label>
        <label>소스 구성
          <select id="nb-split"><option value="0">한 묶음(.md 1개)</option><option value="1">카테고리별 분리</option></select>
        </label>
        <label class="nb-chk"><input type="checkbox" id="nb-urls" checked> 원본 링크(유튜브·웹) 포함</label>
      </div>

      <button class="nb-make-btn" style="margin-top:6px" onclick="createNotebookFromPanel()">📒 노트북 만들기</button>
    </div>`;
}

function setNbPeriod(btn) {
  document.querySelectorAll('#modal .nb-pchip').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

function createNotebookFromPanel() {
  const opt = window._nbOpt; if (!opt) return;
  const cats = Array.from(document.querySelectorAll('#modal .nb-cat:checked')).map(c => c.value);
  if (!cats.length) { toast('소스를 1개 이상 선택하세요', true); return; }
  const pchip = qs('#modal .nb-pchip.active');
  const period = pchip ? pchip.getAttribute('data-p') : 'all';
  const limit = parseInt((qs('#nb-limit') || {}).value || '200', 10);
  const split = (qs('#nb-split') || {}).value === '1';
  const include_urls = !!(qs('#nb-urls') || {}).checked;
  runCreateNotebook(opt.q, { cats, period, limit, split, include_urls });
}

async function runCreateNotebook(q, opts, autoQ) {
  opts = opts || {};
  openWorkspaceLoading(q);
  try {
    const res = await apiFetch('/api/insights/to_notebook', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(Object.assign({ q }, opts))
    });
    if (res.error) throw new Error(res.error);
    openWorkspace(res, q, autoQ);
  } catch(e) {
    closeWorkspace();
    toast('노트북 생성 실패: ' + e.message, true);
  }
}

    if (res.error) throw new Error(res.error);
    toast('✅ nlm 재로그인 완료 — 이제 브리핑 됩니다');
  } catch(e) { toast('재로그인 실패: ' + e.message, true); }
  finally { if (btn) { btn.disabled = false; btn.innerHTML = orig; } }
}
function startBriefing() {
  const q = ((qs('#brief-q') || {}).value || '').trim();
  if (!q) { toast('무엇을 정리·분석할지 입력하세요', true); return; }
  const cats = Array.from(document.querySelectorAll('#brief-cats .bchip.on')).map(b => b.getAttribute('data-c'));
  const research = !!(qs('#brief-research') && qs('#brief-research').classList.contains('on'));
  if (!cats.length && !research) { toast('소스를 1개 이상 고르거나 🔎리서치를 켜세요', true); return; }
  const period = (qs('#brief-period') || {}).value || 'all';
  // 박스 문구를 그대로 워크스페이스 첫 질문으로 자동 실행
  runCreateNotebook(q, { cats, period, limit: 200, split: false, include_urls: true, research }, q);
}

// ── 브리핑 워크스페이스 ──
function closeWorkspace() {
  qs('#nbws').classList.remove('open');

// ── 캔버스 스냅샷 저장(다시보기용) ──
function wsScheduleSave() {
  clearTimeout(window._wsSaveTimer);
  window._wsSaveTimer = setTimeout(() => {
    const ws = window._ws; if (!ws) return;
    const c = qs('#ws-canvas'); if (!c) return;
    if (c.querySelector('.ws-empty') && c.children.length <= 1) return;  // 빈 캔버스
    const html = c.innerHTML;
    if (!html || html.length < 40) return;
    apiFetch('/api/insights/history_save', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notebook_id: ws.id, label: ws.label, html })
    }).catch(() => {});
  }, 1600);
}
function wsAttachObserver() {
  const canvas = qs('#ws-canvas'); if (!canvas) return;
  if (!window._wsObs) window._wsObs = new MutationObserver(wsScheduleSave);
  window._wsObs.disconnect();
  window._wsObs.observe(canvas, { childList: true, subtree: true, characterData: true });
}

  qs('#ws-title').textContent = `🧠 ${label} 브리핑`;

async function loadWsSources() {
  const ws = window._ws; if (!ws) return;
  const list = qs('#ws-src-list'); const cnt = qs('#ws-src-count');

async function doMerge() {

  box.innerHTML = '<div class="ws-src-item"><div class="spinner" style="width:16px;height:16px;margin:4px"></div> 자료 합치는 중…</div>';

function wsAddCard(headHtml, bodyHtml) {

  div.innerHTML = `<div class="ws-card-h">${headHtml}</div><div class="ws-card-b">${bodyHtml}</div>`;
  c.insertBefore(div, c.firstChild);
  return div;
}
function wsLoading(t) { return `<div class="nb-loading"><div class="spinner" style="width:18px;height:18px;margin:0"></div> ${t}</div>`; }

    data = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(f); });

      method: 'POST', headers: { 'Content-Type': 'application/json' },

  const focus = ((qs('#ws-studio-prompt') || {}).value || '').trim();
  const head = (labels[kind] || kind) + (focus ? ` <small style="color:var(--muted);font-weight:400">— ${escHtml(focus)}</small>` : '');
  const card = wsAddCard(head, wsLoading(slow ? '생성 중… 완료까지 1~3분, 끝나면 여기 표시됩니다' : '시작 중…'));
  const body = card.querySelector('.ws-card-b');
  try {
    const res = await apiFetch('/api/insights/notebook_studio', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notebook_id: ws.id, kind, focus })
    });
    btn.disabled = false; btn.innerHTML = orig;
    if (res.error) throw new Error(res.error);
    if (res.show && res.artifact_id) {
      await wsStudioPoll(ws.id, res, body);   // 완료까지 폴링 → 인라인 표시
    } else {
      body.innerHTML = `<div class="nb-studio-ok">🎨 <b>${escHtml(res.label)}</b> 생성을 시작했습니다 (${escHtml(res.eta)}). 완료되면 <a href="${ws.url}" target="_blank">원본 스튜디오</a>에서 확인하세요.</div>`;
    }
  } catch(e) { btn.disabled = false; btn.innerHTML = orig; body.innerHTML = `<div style="color:#e88">실패: ${escHtml(e.message)}</div>`; }
}

async function wsGeminiInfo(btn) {
  const ws = window._ws; if (!ws) return;
  const orig = btn.innerHTML; btn.disabled = true; btn.innerHTML = '생성 중…';
  const prompt = ((qs('#ws-studio-prompt') || {}).value || '').trim();
  const head = '🍌 Gemini 인포그래픽' + (prompt ? ` <small style="color:var(--muted);font-weight:400">— ${escHtml(prompt)}</small>` : '');
  const card = wsAddCard(head, wsLoading('나노바나나2로 생성 중… (~20초)'));
  const body = card.querySelector('.ws-card-b');
  try {
    const res = await apiFetch('/api/insights/gemini_infographic', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notebook_id: ws.id, prompt })
    });
    btn.disabled = false; btn.innerHTML = orig;
    if (res.error) throw new Error(res.error);
    body.innerHTML = `<div class="ws-art-tools"><a href="${res.file_url}" download class="nb-open-sm">↓ 저장</a> <a href="${res.file_url}" target="_blank" class="nb-open-sm">↗ 원본</a></div><img class="nb-art-img" src="${res.file_url}">`;
  } catch(e) { btn.disabled = false; btn.innerHTML = orig; body.innerHTML = `<div style="color:#e88">실패: ${escHtml(e.message)}</div>`; }
}

async function wsStudioPoll(nbId, res, body) {
  const maxTries = (res.kind === 'slides' || res.kind === 'video') ? 75 : 32;   // 슬라이드/영상은 길게(~10분)
  for (let i = 0; i < maxTries; i++) {   // 8s 간격
    await new Promise(r => setTimeout(r, 8000));
    let p;
    try {
      p = await apiFetch(`/api/insights/studio_poll?notebook_id=${encodeURIComponent(nbId)}&artifact_id=${encodeURIComponent(res.artifact_id)}&kind=${encodeURIComponent(res.kind)}`);
    } catch(e) { continue; }
    if (p && p.ready && p.file_url) {
      if (p.media === 'image') {
        body.innerHTML = `<div class="ws-art-tools"><a href="${p.file_url}" download class="nb-open-sm">↓ 저장</a> <a href="${p.file_url}" target="_blank" class="nb-open-sm">↗ 원본</a></div><img class="nb-art-img" src="${p.file_url}">`;
      } else if (p.media === 'pdf') {
        body.innerHTML = `<div class="ws-art-tools"><a href="${p.file_url}" target="_blank" class="nb-open-sm">↗ 새 탭</a> <a href="${p.file_url}" download class="nb-open-sm">↓ 저장</a></div><iframe class="nb-art-pdf" src="${p.file_url}"></iframe>`;
      }
      return;
    }
  }
  body.innerHTML = `<div class="nb-studio-ok">🎨 생성이 예상보다 오래 걸립니다. 완료되면 <a href="${res.url}" target="_blank">원본 스튜디오</a>에서 확인하거나 잠시 후 다시 시도하세요.</div>`;
}

async function askNotebook() {
  const nb = window._lastNb;
  if (!nb) return;
  const input = qs('#nb-q');
  const question = (input.value || '').trim();
  if (!question) return;
  const out = qs('#nb-answer');
  const prev = out.innerHTML;
  out.innerHTML = '<div class="nb-loading"><div class="spinner" style="width:18px;height:18px;margin:0"></div> 답변 생성 중... (~20초)</div>' + prev;
  input.value = '';
  try {
    const res = await apiFetch('/api/insights/notebook_query', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notebook_id: nb.id, question, conversation_id: nb.conv || '' })
    });
    if (res.error) throw new Error(res.error);
    if (res.conversation_id) window._lastNb.conv = res.conversation_id;
    const card = `<div class="nb-qa"><div class="nb-qa-q">Q. ${escHtml(question)}</div><div class="nb-qa-a">${marked.parse(res.answer || '(빈 응답)')}</div></div>`;
    out.innerHTML = card + prev;
  } catch(e) {
    out.innerHTML = `<div style="color:#e88;padding:6px">질문 실패: ${escHtml(e.message)}</div>` + prev;
  }
}

async function nbAction(btn, kind) {
  const nb = window._lastNb;
  if (!nb) return;
  const orig = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '처리 중... <small>잠시만</small>';
  try {
    if (kind === 'research') {
      const res = await apiFetch('/api/insights/notebook_research', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notebook_id: nb.id, q: nb.q, mode: 'fast' })
      });
      if (res.error) throw new Error(res.error);
      btn.innerHTML = `✅ 새 소스 ${res.added}건 (총 ${res.total_sources})`;
    } else {
      const res = await apiFetch('/api/insights/notebook_card', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ notebook_id: nb.id, format: 'Briefing Doc' })
      });
      if (res.error) throw new Error(res.error);
      btn.innerHTML = '✅ 리포트 생성됨';
      const cardOut = qs('#nb-card');
      cardOut.innerHTML = res.markdown
        ? `<div class="nb-qa"><div class="nb-qa-q">🎴 브리핑 리포트</div><div class="nb-qa-a">${marked.parse(res.markdown)}</div></div>`
        : `<div style="color:var(--muted);font-size:.8rem;padding:6px">리포트 생성됨 — 노트북에서 확인하세요.</div>`;
    }
  } catch(e) {
    btn.disabled = false; btn.innerHTML = orig;
    toast(`실패: ${e.message}`, true);
  }
}

async function nbStudio(btn, kind) {
  const nb = window._lastNb;
  if (!nb) return;
  const orig = btn.innerHTML;
  btn.disabled = true; btn.innerHTML = '생성 중...';
  const msg = qs('#nb-studio-msg');
  const waitNote = (kind === 'infographic' || kind === 'slides')
    ? '생성→완료까지 최대 2~3분, 끝나면 여기 바로 표시됩니다' : '시작 중...';
  if (msg) msg.innerHTML = `<div class="nb-loading"><div class="spinner" style="width:18px;height:18px;margin:0"></div> ${escHtml(orig.replace(/<[^>]+>/g,'').trim())} ${waitNote}</div>`;
  try {
    const res = await apiFetch('/api/insights/notebook_studio', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ notebook_id: nb.id, kind })
    });
    if (res.error) throw new Error(res.error);
    btn.innerHTML = `✅ ${res.label}`;
    const link = nb.url || res.url;
    let html = '';
    if (res.ready && res.file_url) {
      if (res.media === 'image') {
        html = `<div class="nb-art"><div class="nb-art-head">🖼️ ${escHtml(res.label)} <a href="${res.file_url}" download class="nb-open-sm">↓ 저장</a> <a href="${res.file_url}" target="_blank" class="nb-open-sm">↗ 원본</a></div><img class="nb-art-img" src="${res.file_url}" alt="${escHtml(res.label)}"></div>`;
      } else if (res.media === 'pdf') {
        html = `<div class="nb-art"><div class="nb-art-head">📑 ${escHtml(res.label)} <a href="${res.file_url}" target="_blank" class="nb-open-sm">↗ 새 탭</a> <a href="${res.file_url}" download class="nb-open-sm">↓ 저장</a></div><iframe class="nb-art-pdf" src="${res.file_url}"></iframe></div>`;
      }
    }
    if (!html) {
      html = `<div class="nb-studio-ok">🎨 <b>${escHtml(res.label)}</b> 생성을 시작했습니다 (${escHtml(res.eta)}). 완료되면 <a href="${link}" target="_blank">원본 스튜디오</a>에서 확인하세요.${(kind==='infographic'||kind==='slides')?' (시간이 더 걸려 표시는 못 했지만 곧 완성됩니다)':''}</div>`;
    }
    if (msg) msg.innerHTML = html;
  } catch(e) {
    btn.disabled = false; btn.innerHTML = orig;
    if (msg) msg.innerHTML = '';
    toast(`실패: ${e.message}`, true);
  }
}

// ── 모달 ──
function openModal(title, html) {
  qs('#modal-title').textContent = title;
  qs('#modal-content').innerHTML = html;
  const box = qs('#modal .modal-box');
  if (box) box.style.transform = '';   // 드래그 위치 초기화(중앙)
  qs('#modal').classList.add('open');
}
function closeModal() { qs('#modal').classList.remove('open'); }
// 바깥(어두운 영역) 클릭으로는 닫히지 않게 — 실수로 닫혀 작업 잃는 것 방지. ✕로만 닫음.

// 모달 헤더 잡고 드래그 이동 (transition 끄고 rAF로 부드럽게)
(function makeModalDraggable() {
  const header = qs('#modal .modal-header');
  const box = qs('#modal .modal-box');
  if (!header || !box) return;
  header.style.cursor = 'move';
  let drag = false, sx = 0, sy = 0, ox = 0, oy = 0, tx = 0, ty = 0, raf = null;
  function apply() { box.style.transform = `translate(${tx}px, ${ty}px)`; raf = null; }
  header.addEventListener('mousedown', e => {
    if (e.target.closest('.close')) return;
    drag = true; sx = e.clientX; sy = e.clientY;
    const m = (box.style.transform || '').match(/translate\(([-\d.]+)px,\s*([-\d.]+)px\)/);
    ox = m ? parseFloat(m[1]) : 0; oy = m ? parseFloat(m[2]) : 0;
    tx = ox; ty = oy;
    box.style.transition = 'none';      // .2s 트랜지션이 드래그를 끌리게 함 → 끔
    box.style.willChange = 'transform';
    document.body.style.userSelect = 'none';
    e.preventDefault();
  });
  window.addEventListener('mousemove', e => {
    if (!drag) return;
    tx = ox + e.clientX - sx; ty = oy + e.clientY - sy;
    if (!raf) raf = requestAnimationFrame(apply);
  });
  window.addEventListener('mouseup', () => {
    if (!drag) return;
    drag = false;
    box.style.transition = ''; box.style.willChange = '';
    document.body.style.userSelect = '';
  });
})();

// ── 헬퍼 ──
function escHtml(s) {
  if (s == null) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function escAttr(s) {
  if (s == null) return '';
  return String(s).replace(/'/g, "\\'").replace(/"/g,'&quot;');
}
function fmtDate(d) {
  if (!d) return '';
  const m = String(d).match(/\d{4}-(\d{2})-(\d{2})/);
  return m ? `${parseInt(m[1])}/${parseInt(m[2])}` : d;
}
function stanceCls(stance) {
  if (!stance) return 'neutral';
  const s = stance.toLowerCase();
  if (s === '매수' || s === 'buy' || s === 'bullish') return 'buy';
  if (s === '매도' || s === 'sell' || s === 'bearish') return 'sell';
  return 'neutral';
}
function sigLabel(sig) {
  const map = { bullish: '강세', bearish: '약세', neutral: '중립', buy: '매수', sell: '매도', risk: '리스크', default: '-' };
  return map[sig] || sig;
}
