<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="brand/gsap.min.js"></script>
<style>
@font-face { font-family: "PXB"; src: url("brand/Pretendard-ExtraBold.otf"); }
@font-face { font-family: "PSB"; src: url("brand/Pretendard-SemiBold.otf"); }
@font-face { font-family: "MONO"; src: url("brand/JBMono.ttf"); font-weight: 100 900; }
:root { --navy:#0a1423; --yellow:#e8c114; --blue:#1d6bb1; --light:#ebeef2; --dblue:#14315a; }
html,body{margin:0;background:var(--navy)}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;background:var(--navy);font-family:"PSB",sans-serif}
.abs{position:absolute}
.hud{position:absolute;font-family:"MONO";font-size:16px;letter-spacing:.14em;color:rgba(235,238,242,.55)}
.corner{position:absolute;width:26px;height:26px;border:2px solid rgba(235,238,242,.4)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.14;mix-blend-mode:overlay}
</style></head><body>
<div id="stage" data-composition-id="memoryreel" data-start="0" data-duration="8" data-width="1920" data-height="1080">
  <div class="corner" style="left:30px;top:30px;border-right:0;border-bottom:0"></div><div class="corner" style="right:30px;top:30px;border-left:0;border-bottom:0"></div>
  <div class="corner" style="left:30px;bottom:30px;border-right:0;border-top:0"></div><div class="corner" style="right:30px;bottom:30px;border-left:0;border-top:0"></div>
  <div class="hud" style="left:64px;top:56px">SHORTCLE · DAILY</div>
  <div class="hud" style="right:64px;top:56px">ORIGIN CHANNELS</div>
  <div class="abs" style="left:64px;bottom:50px;width:300px;height:3px;background:rgba(235,238,242,.2)"><div id="prog" style="height:3px;width:0;background:var(--yellow)"></div></div>
  <div class="abs" id="num" style="left:90px;top:80px;font-family:PXB;font-size:300px;line-height:300px;color:var(--yellow);letter-spacing:-.01em;white-space:nowrap"></div>
  <div class="abs" id="word" style="left:760px;top:190px;font-family:PXB;font-size:120px;line-height:130px;color:var(--light);white-space:nowrap">원본 채널</div>
  <div class="abs" id="grid" style="left:90px;top:400px;width:1740px;height:560px"></div>
  <div class="abs" id="sub" style="left:0;width:1920px;text-align:center;top:988px;font-size:40px;color:var(--light);letter-spacing:.01em">판정한 영상 208편 · 원본 확보 27편 · 10월 27일 장부 기준</div>
  <svg id="grain" width="1920" height="1080"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency=".8" numOctaves="2" seed="3"/></filter><rect width="1920" height="1080" filter="url(#n)"/></svg>
</div>
<script>
(() => {
  const D=8,$=id=>document.getElementById(id);
  const clamp=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),seg=(t,a,b)=>clamp((t-a)/(b-a));
  const e5=p=>1-Math.pow(1-p,5),e3=p=>1-Math.pow(1-p,3);
  const back=p=>{const c=1.8;return 1+(c+1)*Math.pow(p-1,3)+c*Math.pow(p-1,2)};
  const rnd=i=>{const x=Math.sin(i*127.1+311.7)*43758.5453;return x-Math.floor(x)};
  const COLS=29,ROWS=12,N=348; // 29*12 = 348 칸 = 값 348
  // 노랑 27칸(원본 확보 27편) 고정 위치
  const Y=new Set();let q=0;while(Y.size<27){Y.add(Math.floor(rnd(q++)*N));}
  let h="";for(let i=0;i<N;i++){const r=Math.floor(i/COLS),c=i%COLS;h+=`<div class="abs" style="left:${c*60}px;top:${r*47}px;width:50px;height:38px;border-radius:4px"></div>`;}
  $("grid").innerHTML=h;const cells=[...$("grid").children];
  function render(t){
    $("prog").style.width=(t/D)*300+"px";
    const p=e3(seg(t,0.15,2.6)),v=Math.round(348*p);
    const s=String(v).padStart(3,"0");
    $("num").innerHTML=p<1?`<span style="filter:blur(${(1-p)*5}px)">${s}</span>`:s;
    const w=e5(seg(t,0.5,1.1));$("word").style.opacity=w;$("word").style.transform=`translateX(${(1-w)*-40}px)`;
    cells.forEach((el,i)=>{const at=0.5+(i/N)*2.6,on=t>at;const yel=Y.has(i);
      const flash=on&&t<at+0.3?1:0;
      el.style.background=on?(yel&&t>3.4?"var(--yellow)":(rnd(i)>0.35?"var(--blue)":"var(--dblue)")):"transparent";
      if(on&&!yel&&flash)el.style.background="var(--yellow)";
      el.style.transform=`scale(${on?back(seg(t,at,at+0.3)):0})`;});
    // 노랑 27칸이 차례로 켜짐(3.4~4.4)
    const sb=e5(seg(t,3.6,4.4));$("sub").style.opacity=sb;$("sub").style.transform=`translateY(${(1-sb)*24}px)`;
  }
  window.__timelines=window.__timelines||{};
  Promise.all([document.fonts.load('80px "PXB"'),document.fonts.load('40px "PSB"'),document.fonts.load('12px "MONO"')]).then(()=>document.fonts.ready).then(()=>{
    const tl=gsap.timeline({paused:true});const P={t:0};
    tl.to(P,{t:D,duration:D,ease:"none",onUpdate:()=>render(P.t)});render(0);window.__timelines["memoryreel"]=tl;});
  render(0);
})();
</script></body></html>
