<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1기 챌린지 — 관리</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* ★팔레트는 index.html과 같은 토큰(실측 index.html:12-27).
     theme.css엔 --bg/--txt/--panel/--line이 없다 — 페이지가 직접 선언한다. */
  :root{--bg:#0a0f0d;--panel:#101815;--line:#1e2b26;--txt:#eaf3f0;--sub:#8fa1a0;
    --accent:#37e0bd;--accent2:#1f9e7a;--fire:#ff6b6b;--ok:#37e0bd;--gold:#f0c453;
    --inset:#0c1412;--hover:#131d19;--shorts-ar:9/16;color-scheme:dark;
    --chal-0-bg:#3a1a1a;--chal-0-fg:#ff8a80;
    --chal-1-bg:#3a3018;--chal-1-fg:#e9b45c;
    --chal-2-bg:#12312a;--chal-2-fg:#5fd1a9;}
  :root[data-theme="light"]{--bg:#f4faf7;--panel:#ffffff;--line:#d5e6df;--txt:#0f1a16;--sub:#5c726d;
    --accent:#12b886;--accent2:#0ca678;--fire:#e0524a;--ok:#12b886;--gold:#b8860b;
    --inset:#eef7f3;--hover:#eef7f3;color-scheme:light;
    --chal-0-bg:#fdeaea;--chal-0-fg:#b3261e;
    --chal-1-bg:#fdf2df;--chal-1-fg:#8a6100;
    --chal-2-bg:#e1f3ec;--chal-2-fg:#0a7d66;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:'IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif;
       display:flex;min-height:100vh}
  .main{flex:1;min-width:0}
  .wrap{max-width:1400px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 14px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;
       border:0;background:none;color:var(--sub);border-bottom:2px solid transparent;
       font-family:inherit}
  .tab.on{color:var(--txt);border-bottom-color:var(--accent)}
  .pane{display:none} .pane.on{display:block}

  .gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
  th,td{padding:7px 9px;white-space:nowrap;border-bottom:1px solid var(--line)}
  thead th{position:sticky;top:0;background:var(--panel);z-index:2;font-size:12px}
  .who{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;
       min-width:150px;font-weight:600}
  thead .who{z-index:3}
  .cell{width:34px;text-align:center;font-weight:700;border-radius:5px}
  /* 달성 칸 색 — 토큰으로 둔다(라이트 모드에서 어두운 하드코딩 색은 안 읽힌다). */
  .c0{background:var(--chal-0-bg);color:var(--chal-0-fg)}
  .c1{background:var(--chal-1-bg);color:var(--chal-1-fg)}
  .c2{background:var(--chal-2-bg);color:var(--chal-2-fg)}
  .rate{text-align:right;color:var(--sub)}

  .bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;
       color:var(--sub);font-size:13px}
  select{padding:8px 10px;font-size:13px;border-radius:8px;
       border:1px solid var(--line);background:var(--inset);color:inherit;font-family:inherit}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);
        border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
        text-decoration:none;color:inherit;position:relative}
  .card .th{aspect-ratio:var(--shorts-ar);width:100%;object-fit:cover;display:block;
            background:var(--inset)}
  .card .no-th{aspect-ratio:var(--shorts-ar);display:flex;align-items:center;
               justify-content:center;font-size:28px;color:var(--sub);background:var(--inset)}
  .card .t{font-size:12px;padding:6px 9px 4px;line-height:1.4;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .m{font-size:11px;color:var(--sub);padding:0 9px 0;margin-top:auto}
  /* 등록 시각 — submit_day(어느 칸)와 다르면 .late 로 갈라 보여준다(2026-08-29) */
  .card .when{font-size:11px;color:var(--sub);padding:3px 9px 9px}
  .card .when.late{color:var(--gold)}
  .card .del{position:absolute;top:6px;right:6px;width:24px;height:24px;border:0;
             border-radius:50%;background:rgba(0,0,0,.62);color:#fff;font-size:13px;
             line-height:1;cursor:pointer;opacity:0;transition:opacity .15s;z-index:3}
  .card:hover .del,.card:focus-within .del{opacity:1}
  @media(hover:none){.card .del{opacity:1}}   /* 모바일엔 hover가 없다 */
  .who-tag{font-size:11px;color:var(--accent);padding:8px 9px 0;font-weight:600}
  .empty{color:var(--sub);padding:40px 0;text-align:center;font-size:14px}
  .btn{padding:8px 14px;border:1px solid var(--line);border-radius:8px;cursor:pointer;
       background:var(--inset);color:var(--txt);font-size:13px;font-weight:600}
  .btn:hover{border-color:var(--accent)}
  #mgrid td,#mgrid th{padding:7px 10px;border-bottom:1px solid var(--line);
       white-space:nowrap;text-align:left}
  #mgrid th{position:sticky;top:0;background:var(--panel);z-index:2;font-size:12px;color:var(--sub)}
  .chal-on{color:var(--accent);font-weight:700}
  /* 재생 모달 — 나가지 않고 100명 영상을 훑는다 */
  .pl{display:none;position:fixed;inset:0;background:rgba(0,0,0,.86);z-index:99;
      align-items:center;justify-content:center}
  .pl.on{display:flex}
  .plbox{position:relative;width:min(420px,94vw)}
  .plframe{aspect-ratio:9/16;max-height:82vh;background:#000;border-radius:12px;
           overflow:hidden}
  .plframe iframe{width:100%;height:100%;border:0}
  .plinfo{color:#fff;font-size:13px;padding:10px 2px;line-height:1.5}
  .plinfo a{color:var(--accent)}
  .plclose{position:absolute;top:-38px;right:0;background:none;border:0;color:#fff;
           font-size:24px;cursor:pointer}
  .plnav{position:absolute;top:50%;transform:translateY(-50%);background:rgba(0,0,0,.5);
         border:0;color:#fff;font-size:34px;cursor:pointer;padding:14px 10px;
         border-radius:8px;line-height:1}
  .plnav:hover{background:rgba(0,0,0,.8)}
</style>
<div class="main">
<div class="wrap">
  <h1>🔥 1기 챌린지 관리</h1>
  <div class="tabs">
    <button class="tab on" data-p="board">달성현황</button>
    <button class="tab" data-p="videos">영상</button>
    <button class="tab" data-p="members">참가자</button>
  </div>

  <div class="pane on" id="p-board">
    <div class="bar" id="boardInfo"></div>
    <div class="gridwrap"><table id="grid"></table></div>
  </div>

  <div class="pane" id="p-videos">
    <div class="bar">
      <select id="sort">
        <option value="recent">최신순</option>
        <option value="views">조회수순</option>
      </select>
      <select id="member"><option value="0">전체 멤버</option></select>
      <select id="platform">
        <option value="">전체 플랫폼</option>
        <option value="instagram">인스타</option>
        <option value="youtube">유튜브</option>
        <option value="tiktok">틱톡</option>
        <option value="naverclip">네이버클립</option>
      </select>
      <span id="vcount"></span>
      <span id="vmsg" style="font-size:12px;margin-left:10px"></span>
    </div>
    <div id="cards"><div class="empty">불러오는 중…</div></div>
  </div>

  <div class="pane" id="p-members">
    <div class="bar">
      <input id="msearch" placeholder="이름·이메일 검색" style="flex:1;min-width:180px;
        padding:8px 10px;border:1px solid var(--line);border-radius:8px;
        background:var(--inset);color:var(--txt);font-size:13px">
      <label style="font-size:13px;display:flex;align-items:center;gap:5px;cursor:pointer">
        <input type="checkbox" id="monly"> 참가자만</label>
      <button id="mAdd" class="btn">✅ 선택 참가</button>
      <button id="mDel" class="btn">해제</button>
      <span id="mcount"></span>
    </div>
    <div class="gridwrap" style="max-height:70vh">
      <table id="mgrid"></table>
    </div>
  </div>
</div>
</div>

<div id="player" class="pl"><div class="plbox">
  <button class="plclose" id="plX">✕</button>
  <button class="plnav" id="plPrev" style="left:8px">‹</button>
  <button class="plnav" id="plNext" style="right:8px">›</button>
  <div class="plframe" id="plFrame"></div>
  <div class="plinfo" id="plInfo"></div>
</div></div>
<script src="/sidebar.js?v=2"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dayRange(start, end, today) {
  // 시작~오늘(또는 종료일 중 이른 쪽)까지의 날짜 목록. 미래 칸은 그리지 않는다.
  const last = (end && end < today) ? end : today;
  if (!start || start > last) return [today];
  const out = [], d = new Date(start + 'T00:00:00Z');
  const stop = new Date(last + 'T00:00:00Z');
  while (d <= stop && out.length < 400) {
    out.push(d.toISOString().slice(0, 10));
    d.setUTCDate(d.getUTCDate() + 1);
  }
  return out;
}

async function loadBoard() {
  let d;
  try {
    const r = await fetch('/api/challenge/board');
    if (r.status === 403) {
      $('#grid').innerHTML = '<tr><td class="empty">관리자만 볼 수 있어요</td></tr>';
      return;
    }
    if (!r.ok) throw new Error('bad status ' + r.status);
    d = await r.json();
  } catch (e) {
    $('#grid').innerHTML = '<tr><td class="empty">불러오지 못했어요</td></tr>';
    return;
  }
  const goal = d.goal || 2;
  const days = dayRange(d.start, d.end, d.today);
  const members = d.members || [];
  $('#boardInfo').textContent =
    `참가자 ${members.length}명 · 목표 하루 ${goal}개`
    + ((d.start || d.end) ? ` · ${d.start || ''} ~ ${d.end || ''}` : ' · 기간 미설정');

  const head = '<thead><tr><th class="who">멤버</th>'
    + days.map(x => `<th>${esc(x.slice(5))}</th>`).join('')
    + '<th class="rate">달성</th></tr></thead>';
  const body = members.map(m => {
    const cells = days.map(day => {
      const n = (m.by_day || {})[day] || 0;
      const cls = n >= goal ? 'c2' : (n > 0 ? 'c1' : 'c0');
      return `<td class="cell ${cls}">${n}</td>`;
    }).join('');
    const pct = days.length ? Math.round(m.done_days / days.length * 100) : 0;
    return `<tr><td class="who">${esc(m.name)}</td>${cells}`
      + `<td class="rate">${m.done_days}/${days.length} (${pct}%)</td></tr>`;
  }).join('');
  $('#grid').innerHTML = head + '<tbody>'
    + (body || `<tr><td class="empty" colspan="${days.length + 2}">참가자가 없어요</td></tr>`)
    + '</tbody>';

  // 영상 탭의 멤버 필터도 같이 채운다.
  const sel = $('#member');
  if (sel.options.length <= 1) {
    members.forEach(m => {
      const o = document.createElement('option');
      o.value = m.customer_id; o.textContent = m.name;
      sel.appendChild(o);
    });
  }
}

function cardHtml(it, idx) {
  // ★썸네일 프록시 파라미터는 ?url= 이다(app.py:5579). ?u=로 쓰면 422.
  const th = it.thumb
    ? `<img class="th" src="/api/thumb?url=${encodeURIComponent(it.thumb)}" alt="">`
    : `<div class="no-th">🎬</div>`;
  let meta;
  if (it.fetch_status === 'ok' && (it.views || it.views === 0)) {
    meta = `조회 ${Number(it.views).toLocaleString()}`;
  } else if (it.platform === 'tiktok') {
    meta = '틱톡';
  } else if (it.platform === 'naverclip') {
    meta = '네이버클립';
  } else if (it.fetch_status === 'failed') {
    meta = '정보 없음';
  } else {
    meta = '수집 중';
  }
  // ★임베드가 있으면 화면 안에서 재생(탭이 100개 열리지 않게), 없으면 원래대로 링크.
  const inner = `${th}
    <div class="who-tag">${esc(it.member_name || '')}</div>
    <div class="t">${esc(it.title || it.url)}</div>
    <div class="m">${esc(it.submit_day)} · ${esc(meta)}</div>
    ${whenHtml(it)}`;
  // 지우기 버튼은 카드 밖(형제)에 두지 않는다 — 카드 안이지만 클릭이 재생으로
  // 새지 않게 data-del을 먼저 잡아 처리한다(아래 위임 핸들러).
  const del = `<button class="del" data-del="${it.id}" title="지우기" aria-label="지우기">✕</button>`;
  return it.embed
    ? `<div class="card" data-i="${idx}" style="cursor:pointer">${del}${inner}</div>`
    : `<a class="card" href="${esc(it.url)}" target="_blank" rel="noopener">${del}${inner}</a>`;
}

/* ★사장님이 '그날 올린 사람'과 '나중에 몰아 채운 사람'을 구별하실 수 있어야 한다
   (2026-08-29 지시). submit_day(어느 칸)와 submitted_at(실제로 누른 시각)이
   다르면 ⏰로 갈라 표시한다. 판정 규칙은 멤버 화면(challenge.html)과 같다. */
function kstParts(iso) {
  const raw = iso || '';
  const t = Date.parse(/[zZ]|[+-]\d\d:?\d\d$/.test(raw) ? raw : raw + 'Z');
  if (!Number.isFinite(t)) return null;
  const d = new Date(t + 9 * 3600 * 1000);
  const p = n => String(n).padStart(2, '0');
  return {
    day: d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()),
    md: p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate()),
    hm: p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()),
    full: d.getUTCFullYear() + '-' + p(d.getUTCMonth() + 1) + '-' + p(d.getUTCDate())
        + ' ' + p(d.getUTCHours()) + ':' + p(d.getUTCMinutes()) + ':' + p(d.getUTCSeconds())
  };
}

function whenHtml(it) {
  const k = kstParts(it.submitted_at);
  if (!k) return '';
  const late = k.day !== it.submit_day;
  return `<div class="when${late ? ' late' : ''}" title="${esc(k.full)} 등록">`
       + `${late ? '⏰' : '🕓'} ${k.md} ${k.hm}${late ? ' 등록 (늦게)' : ''}</div>`;
}

function vsay(text, ok) {
  const el = $('#vmsg');
  if (!el) return;
  el.textContent = text;
  el.style.color = ok ? 'var(--accent)' : 'var(--fire)';
}

async function delVideo(id) {
  // alert/confirm을 쓰지 않는다 — 화면이 멈추고 100명을 훑는 흐름이 끊긴다(2026-08-25 결정).
  try {
    const r = await fetch('/api/challenge/submission/' + encodeURIComponent(id),
                          { method: 'DELETE' });
    const d = await r.json().catch(() => ({}));
    if (!r.ok) { vsay(d.error || '지우지 못했어요', false); return; }
    vsay('지웠어요', true);
    loadVideos();
  } catch (e) {
    vsay('지우지 못했어요 — 잠시 후 다시 시도해주세요', false);
  }
}

async function loadVideos() {
  const q = new URLSearchParams({
    sort: $('#sort').value,
    member: $('#member').value,
    platform: $('#platform').value,
  });
  try {
    const r = await fetch('/api/challenge/videos?' + q);
    if (r.status === 403) {
      $('#cards').innerHTML = '<div class="empty">관리자만 볼 수 있어요</div>';
      return;
    }
    if (!r.ok) throw new Error('bad status ' + r.status);
    const d = await r.json();
    const items = d.items || [];
    $('#vcount').textContent = `${items.length}개`;
    VIDS = items;   // 모달이 ←→로 넘어다니려면 목록을 들고 있어야 한다
    $('#cards').innerHTML = items.length
      ? '<div class="cards">' + items.map(cardHtml).join('') + '</div>'
      : '<div class="empty">제출된 영상이 없어요</div>';
    // 클릭 위임 하나로 처리한다 — 카드마다 리스너를 다는 방식이면 카드 안의
    // 지우기 버튼 클릭이 부모까지 올라가 재생 모달이 같이 열린다.
    // (위임은 목록을 다시 그려도 리스너가 살아 있어 중복 등록도 안 생긴다)
  } catch (e) {
    $('#cards').innerHTML = '<div class="empty">불러오지 못했어요</div>';
  }
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    $('#p-' + t.dataset.p).classList.add('on');
    if (t.dataset.p === 'videos') loadVideos();
    if (t.dataset.p === 'members') loadMembers();
  });
});
['#sort', '#member', '#platform'].forEach(s =>
  $(s).addEventListener('change', loadVideos));

// ───────── 재생 모달 ─────────
let VIDS = [], PL = -1;

function openPlayer(i) {
  if (i < 0 || i >= VIDS.length) return;
  PL = i;
  const it = VIDS[i];
  // ★iframe을 매번 새로 만든다 — src만 바꾸면 앞 영상 소리가 남는 브라우저가 있다.
  $('#plFrame').innerHTML =
    `<iframe src="${esc(it.embed)}" allow="autoplay; encrypted-media"
             allowfullscreen referrerpolicy="origin"></iframe>`;
  $('#plInfo').innerHTML =
    `<b>${esc(it.member_name || '')}</b> · ${esc(it.submit_day)}<br>` +
    `${esc(it.title || '')}<br>` +
    `<a href="${esc(it.url)}" target="_blank" rel="noopener">원본 열기 ↗</a>` +
    `<span style="float:right;color:#999">${i + 1} / ${VIDS.length}</span>`;
  $('#player').classList.add('on');
}
function closePlayer() {
  $('#player').classList.remove('on');
  $('#plFrame').innerHTML = '';   // 재생 중단 — 안 지우면 뒤에서 계속 돈다
  PL = -1;
}
/* ★카드 클릭 위임. 지우기(data-del)를 **먼저** 잡아 재생으로 새지 않게 한다.
   임베드 카드는 <div data-i>, 임베드 없는 카드는 <a href>라 후자는 기본동작으로
   원본이 열린다 — 지우기 버튼일 때만 preventDefault로 그걸 막는다. */
$('#cards').addEventListener('click', e => {
  const d = e.target.closest('[data-del]');
  if (d) {
    e.preventDefault();
    e.stopPropagation();
    delVideo(d.dataset.del);
    return;
  }
  const c = e.target.closest('.card[data-i]');
  if (c) openPlayer(+c.dataset.i);
});

$('#plX').addEventListener('click', closePlayer);
$('#plPrev').addEventListener('click', () => openPlayer(PL - 1));
$('#plNext').addEventListener('click', () => openPlayer(PL + 1));
$('#player').addEventListener('click', e => { if (e.target.id === 'player') closePlayer(); });
document.addEventListener('keydown', e => {
  if (!$('#player').classList.contains('on')) return;
  if (e.key === 'Escape') closePlayer();
  if (e.key === 'ArrowLeft') openPlayer(PL - 1);
  if (e.key === 'ArrowRight') openPlayer(PL + 1);
});

// ───────── 참가자 탭 ─────────
let CUSTS = [];

async function loadMembers() {
  $('#mgrid').innerHTML = '<tr><td class="empty">불러오는 중…</td></tr>';
  try {
    const r = await fetch('/api/admin/customers');
    if (!r.ok) throw new Error('bad status ' + r.status);
    const d = await r.json();
    CUSTS = d.customers || d.items || [];
    renderMembers();
  } catch (e) {
    $('#mgrid').innerHTML = '<tr><td class="empty">불러오지 못했어요</td></tr>';
  }
}

function renderMembers() {
  const q = ($('#msearch').value || '').trim().toLowerCase();
  const only = $('#monly').checked;
  const rows = CUSTS.filter(c => {
    if (only && !c.challenge) return false;
    if (!q) return true;
    return String(c.name || '').toLowerCase().includes(q)
        || String(c.email || '').toLowerCase().includes(q);
  });
  $('#mcount').textContent =
    `${rows.length}명 표시 · 참가자 ${CUSTS.filter(c => c.challenge).length}명`;
  $('#mgrid').innerHTML =
    '<tr><th><input type="checkbox" id="mAll"></th><th>이름</th><th>이메일</th>'
    + '<th>챌린지</th></tr>'
    + (rows.map(c => `<tr>
        <td><input type="checkbox" class="mchk" value="${c.id}"></td>
        <td>${esc(c.name || ('#' + c.id))}</td>
        <td>${esc(c.email || '')}</td>
        <td class="${c.challenge ? 'chal-on' : ''}">${c.challenge ? '🔥 참가중' : '—'}</td>
      </tr>`).join('')
      || '<tr><td class="empty" colspan="4">해당하는 고객이 없어요</td></tr>');
  const all = $('#mAll');
  if (all) all.addEventListener('change', () =>
    document.querySelectorAll('.mchk').forEach(x => { x.checked = all.checked; }));
}

// ★alert()를 쓰지 않는다 — 모달이 뜨는 동안 화면이 통째로 멈추고,
//   100명을 훑는 작업에서 매번 확인을 눌러야 해서 오히려 손이 더 간다.
function mNote(msg, bad) {
  const el = $('#mcount');
  el.textContent = msg;
  el.style.color = bad ? '#e66' : 'var(--accent)';
  setTimeout(renderMembers, 2500);   // 잠시 뒤 원래 집계로 되돌린다
}

async function bulkMembers(active) {
  const ids = [...document.querySelectorAll('.mchk:checked')].map(x => +x.value);
  if (!ids.length) { mNote('선택된 고객이 없어요', true); return; }
  try {
    const r = await fetch('/api/challenge/members/bulk', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ ids, active: active ? 1 : 0 }),
    });
    if (!r.ok) throw new Error('bad status ' + r.status);
    const d = await r.json();
    // 화면을 서버 사실로 다시 맞춘다 — 로컬에서 짐작해 칠하지 않는다
    await loadMembers();
    mNote(`${d.count}명 ${active ? '참가 처리' : '해제'}했어요`);
  } catch (e) {
    mNote('실패했어요 — 다시 시도해 주세요', true);
  }
}

$('#mAdd').addEventListener('click', () => bulkMembers(true));
$('#mDel').addEventListener('click', () => bulkMembers(false));
$('#msearch').addEventListener('input', renderMembers);
$('#monly').addEventListener('change', renderMembers);

loadBoard();
</script>
