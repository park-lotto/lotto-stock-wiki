<script>
const {Scene,person,robot,smooth,ell,cloud,poly,rr,ln,pl,tube,mk,INK,ORG,SKIN,SHIRT,HAIR,BEIGE,SKY,PINK,eo,seg,clamp,qo,J,f} = HQ;
document.fonts.load('40px "NP"').then(()=>document.fonts.load('40px "GB"')).then(()=>document.fonts.load('800 40px "PB"')).then(()=>document.fonts.ready).then(()=>{
const S = new Scene(22.7);
// 4회차 장면 s06 — 저도 막혔다 → 직접 만들었다 (22.7초) · 문장 시각 = py ink/times.py s06 · 숫자: 커밋 3,926건 실측('삼천구백 건이 넘는다')
// 0.37 저도 막혔다 / 3.39 직접 만들었다 / 5.35 하루아침 아님 / 8.31 시간·에너지 / 13.27 숏템메이커부터 고친 기록 / 18.18 전부 이 안에
const Y = "#F4E28A", CL = "#D97757";
// ===== 컷1 막힘 → 직접 만듦 (−1 ~ 5.35) =====
const c1 = cutL(S, -1, 5.35, { push: [1.0, 1.04], ox: 960, oy: 540 });
for (let r = 0; r < 5; r++) for (let k = 0; k < 4; k++) {
  const x = 140 + k * 160 + (r % 2) * 80, y = 300 + r * 100, b = rr(x, y, 150, 90, 6), t = 0.4 + (r * 4 + k) * 0.03;
  c1.fill(b, "#E7C9A9", t, 0.6, 0.2); c1.line(b, t, 0.12, { w: 5, pen: false });
}
c1.text("저도 처음엔", { x: 1000, y: 330, size: 110, s: 0.4, gap: 0.06 });
const st = c1.text("똑같이 막혔습니다", { x: 1000, y: 500, size: 120, s: 1.1, gap: 0.05 });
c1.underline(st.box(4, 7), 2.3, 0.3);
const mk2 = c1.text("그래서 직접 만들었다", { x: 1000, y: 780, size: 110, s: 3.4, gap: 0.05, c: "#D9622B" });
c1.circleMark(mk2.box(4, 5), 4.6, 0.4);
// ===== 컷2 하루아침 아님 → 시간·에너지 (5.35 ~ 13.27) =====
const c2 = cutL(S, 5.35, 13.27, { pan: [20, -20] });
art(c2, "prop.calendar", { x: 420, y: 640, sc: 2.0, s: 5.4 });
const ha = c2.text("하루아침에", { x: 420, y: 800, size: 100, s: 5.9, gap: 0.05, anchor: "c" });
c2.text("나온 게 아니다", { x: 420, y: 930, size: 100, s: 6.6, gap: 0.05, anchor: "c" });
c2.line(ln(ha.x - 20, ha.y + 20, ha.x + ha.w + 20, ha.y + 120), 7.2, 0.2, { c: ORG, w: 12 });
art(c2, "prop.clock", { x: 1280, y: 520, sc: 1.9, s: 8.35 });
const te = c2.text("시간 + 에너지", { x: 1280, y: 720, size: 130, s: 8.9, gap: 0.06, anchor: "c" });
c2.text("갈아 넣어 만든 프로그램", { x: 1280, y: 890, size: 96, font: "gae", s: 10.0, gap: 0.05, anchor: "c", c: "#D9622B" });
c2.underline(te.box(), 11.5, 0.3);
// ===== 컷3 숏템메이커부터 고친 기록 (13.27 ~ 18.18) =====
const c3 = cutL(S, 13.27, 18.18, { push: [1.0, 1.04], ox: 960, oy: 540 });
c3.line(pl([[200, 330], [1720, 330]]), 13.3, 0.6, { w: 10 }); c3.line(pl([[1680, 300], [1730, 330], [1680, 360]]), 13.9, 0.15, { w: 10 });
[[200, "숏템메이커", 13.4], [1720, "숏클", 14.6]].forEach(([x, s, t]) => {
  c3.fill(ell(x, 330, 26, 26, { n: 14 }), CL, t, 0.95, 0.15);
  c3.text(s, { x, y: 230, size: 90, s: t + 0.1, gap: 0.05, anchor: "c" });
});
for (let k = 0; k < 24; k++) c3.line(ln(260 + k * 60, 315, 260 + k * 60, 345), 13.5 + k * 0.025, 0.05, { w: 4, pen: false });
c3.text("고친 기록", { x: 960, y: 560, size: 110, font: "gae", s: 15.0, gap: 0.05, anchor: "c" });
const n = c3.text("3,900건+", { x: 960, y: 820, size: 230, font: "num", s: 15.6, gap: 0.08, anchor: "c" });
c3.underline(n.box(), 16.8, 0.35);
// ===== 컷4 전부 이 안에 (18.18 ~) =====
const c4 = cutL(S, 18.18, 1e9, { push: [1.04, 1.0], ox: 960, oy: 540 });
const st4 = stageN(c4);
st4.fill(ell(1480, 620, 440, 450, { n: 30 }), SKY, -99, 0.35);
INKHERO.put(c4, "g_o_hope", { x: 1480, y: 400, sc: 1.8, s: 18.2, dur: 1.0 });
const box = rr(200, 420, 640, 460, 30); c4.fill(box, CL, 18.3, 0.3, 0.25); c4.line(box, 18.2, 0.5, { w: 10 });
c4.text("숏클", { x: 520, y: 680, size: 170, s: 18.6, gap: 0.08, anchor: "c" });
[["시행착오", 240, 18.9], ["함정", 520, 19.4], ["노하우", 800, 19.9]].forEach(([s, x, t]) => {
  c4.text(s, { x, y: 190, size: 70, font: "gae", s: t, gap: 0.04, anchor: "c" });
  c4.line(pl([[x, 240], [520 + (x - 520) * 0.5, 400]]), t + 0.3, 0.25, { w: 7 });
});
c4.text("회원은 다시 안 겪게", { x: 1480, y: 1010, size: 90, font: "gae", s: 20.6, gap: 0.05, anchor: "c", c: "#D9622B" });

S.start();
});
