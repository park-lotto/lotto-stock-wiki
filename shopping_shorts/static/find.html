<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>제품 찾기 — 쇼핑쇼츠</title>
<style>
  :root{--bg:#0a0e14;--panel:#111722;--line:#1e2735;--txt:#e6edf3;--sub:#8b98a9;--accent:#2f81f7;--ok:#2ea043;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic',system-ui,sans-serif;display:flex;min-height:100vh}
  .sidebar{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:16px;flex-shrink:0}
  .sidebar h1{font-size:14px;color:var(--sub);margin-bottom:16px}
  .menu-item{padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:2px;cursor:pointer}
  .menu-item.active{background:linear-gradient(90deg,#153a6b,#0d2340);color:#7db4ff}
  .main{flex:1;padding:28px 36px;overflow:auto}
  .head h2{font-size:24px;margin-bottom:6px}
  .desc{color:var(--sub);font-size:13px;margin-bottom:18px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  input,select,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);padding:9px 14px;border-radius:8px;font-size:13px}
  input{flex:1;min-width:220px}
  button{cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-bottom:16px}
  .frames{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
  .frames img{width:100px;height:100px;object-fit:cover;border-radius:8px;border:1px solid var(--line);background:#000}
  .section-label{font-size:12px;color:var(--sub);text-transform:uppercase;margin-bottom:8px}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{background:#0d131c;border:1px solid var(--line);border-radius:20px;padding:5px 12px;font-size:12px;color:var(--txt)}
  .chip.selectable{cursor:pointer;user-select:none}
  .chip.selectable.active{background:var(--accent);border-color:var(--accent);color:#fff}
  .category{font-size:13px;color:var(--sub);margin-bottom:14px}
  .lens-row{margin-top:10px;font-size:13px}
  .lens-row a{color:var(--accent);text-decoration:none;margin-right:8px}
  .empty{color:var(--sub);text-align:center;padding:60px}
  .preview-row{margin-bottom:20px}
  .preview-row-head{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .preview-row-head b{font-size:13px;min-width:110px}
  .preview-row-head select{padding:5px 8px;font-size:12px}
  .preview-row-head a.view-all{color:var(--accent);text-decoration:none;font-size:12px;margin-left:auto}
  .preview-row-status{font-size:12px;color:var(--sub)}
  .preview-thumbs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
  .preview-thumbs .card{background:#0d131c;border:1px solid var(--line);border-radius:10px;overflow:hidden;padding:0}
  .preview-thumbs .card img{width:100%;height:100px;object-fit:cover;background:#000}
  .preview-thumbs .card .body{padding:6px}
  .preview-thumbs .card .title{font-size:11px;max-height:28px;overflow:hidden;margin-bottom:4px}
  .preview-thumbs .card .row{display:flex;gap:4px}
  .preview-thumbs .card .row a,.preview-thumbs .card .row button{flex:1;text-align:center;font-size:10px;padding:4px 2px}
  @media (max-width: 900px){ .preview-thumbs{grid-template-columns:repeat(3,1fr)} }
  @media (max-width: 768px){
    body{flex-direction:column;min-height:100vh}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px;
             display:flex;gap:6px;overflow-x:auto;align-items:center;white-space:nowrap}
    .sidebar h1{margin:0 8px 0 0;flex-shrink:0}
    .menu-item{margin:0;padding:6px 10px;flex-shrink:0;font-size:12px}
    .main{padding:16px 14px}
    .head h2{font-size:20px}
    .toolbar{gap:8px}
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <h1>🛍️ 쇼핑쇼츠</h1>
    <div class="menu-item" onclick="location.href='/'">📊 레퍼런스 랭킹</div>
    <div class="menu-item active">🔍 제품 찾기</div>
    <div class="menu-item" onclick="location.href='/outreach.html'">💬 소통 큐</div>
  </aside>
  <main class="main">
    <div class="head"><h2>🔍 제품 찾기</h2></div>
    <div class="desc">레퍼런스 영상에서 실제로 파는 제품 소스를 찾습니다. 영상을 다운로드해 프레임을 추출하고 Gemini로 키워드를 분석한 뒤, 플랫폼별 검색 링크와 Google Lens 역검색 링크를 만들어줍니다.</div>
    <div class="toolbar">
      <input id="scInput" placeholder="분석할 항목의 shortcode 또는 레퍼런스에서 담기로 넘어옴">
      <button class="primary" onclick="doAnalyze()">분석</button>
    </div>
    <div id="result"><div class="empty">shortcode를 입력하고 분석을 눌러주세요.</div></div>
    <div id="previewRows"></div>
  </main>
<script>
const params = new URLSearchParams(location.search);
const AUTO_SC = params.get("shortcode");
let CUR_SC = null;  // 마지막으로 분석 완료된 shortcode — 수집/담기 API에 사용

async function doAnalyze(){
  const sc = document.getElementById("scInput").value || AUTO_SC;
  if(!sc) return;
  CUR_SC = sc;
  document.getElementById("previewRows").innerHTML = "";
  document.getElementById("result").innerHTML = '<div class="empty">분석 중… (영상 다운로드+Gemini 분석, 수십 초 소요)</div>';
  try{
    const r = await fetch(`/api/find/analyze?shortcode=${encodeURIComponent(sc)}`, {method:"POST"});
    const d = await r.json();
    if(!d.ok){ document.getElementById("result").innerHTML = `<div class="empty">❌ ${d.error||"실패"}</div>`; return; }
    // 서버가 입력값(추적파라미터 등 포함 가능)을 정식 shortcode로 정규화해서
    // 돌려준다 — 이후 수집/담기 호출은 이 정식값으로 해야 같은 분석 결과를 참조한다.
    if(d.shortcode) CUR_SC = d.shortcode;
    renderResult(d);
  }catch(e){
    document.getElementById("result").innerHTML = `<div class="empty">❌ ${e.message}</div>`;
  }
}

const LANG_LABEL = {ko:"🇰🇷 한국어", en:"🌐 영어", zh:"🇨🇳 중국어", ja:"🇯🇵 일본어", ru:"🇷🇺 러시아어"};
const PLATFORM_LABEL = {youtube:"▶️ YouTube", tiktok:"🎵 TikTok", instagram:"📱 Instagram", xiaohongshu:"📕 샤오홍슈", douyin:"🎬 도우인"};
let CUR_SEARCH_LINKS = {};
let CUR_KEYWORD_INDEX = 0;  // 사용자가 고른 키워드 후보 순번(키워드 칩 클릭으로 변경)
const ROW_LANG = {};  // 플랫폼별 현재 선택된 언어(줄마다 독립적으로 유지)

function renderResult(d){
  const frames = d.frame_urls.map(u=>`<img src="${u}" loading="lazy">`).join("");
  CUR_KEYWORD_INDEX = 0;
  const kwList = d.keywords.ko || [];
  const kw = kwList.map((k,i)=>`<span class="chip selectable${i===0?' active':''}" data-idx="${i}" onclick="selectKeyword(${i})">${k}</span>`).join("");
  const lensLinks = (d.lens_links||[]).map((u,i)=>`<a href="${u}" target="_blank">🔍 프레임${i+1}</a>`).join(" ");
  CUR_SEARCH_LINKS = d.search_links || {};
  document.getElementById("result").innerHTML = `
    <div class="card">
      <div class="section-label">추출 프레임</div>
      <div class="frames">${frames}</div>
      <div class="section-label">키워드 ${kwList.length>1?'(클릭해서 검색 기준 변경 — 제품이 확실하면 첫번째 그대로 둬도 됨)':''}</div>
      <div class="chips">${kw}</div>
      <div class="category">카테고리: ${d.category||'-'}</div>
      <div class="lens-row"><b>Google Lens 역검색</b><br>${lensLinks}</div>
    </div>
  `;
  renderPreviewRows();
}

function selectKeyword(idx){
  CUR_KEYWORD_INDEX = idx;
  document.querySelectorAll('#result .chip.selectable').forEach(el=>{
    el.classList.toggle('active', Number(el.dataset.idx) === idx);
  });
  Object.keys(PLATFORM_LABEL).forEach(platform => fetchPreviewRow(platform, ROW_LANG[platform] || "ko"));
}

// 실수집(플랫폼×5언어 전부 검색+Gemini 채점)은 느리고("분석 3분+수집 3분")
// 부정확해서("실수집 결과는 의미 없다") 제거 — 대신 분석 끝나자마자 5개
// 플랫폼을 기본 한국어로 병렬 미리보기(채점 없이 6개씩, 빠름)하고, 줄마다
// 언어를 바꿔 그 줄만 재검색할 수 있게 한다(2026-07-10). 키워드가 여러 개면
// 위 키워드 칩을 클릭해 검색 기준 자체를 바꿀 수 있다(2026-07-10 추가).
function renderPreviewRows(){
  const box = document.getElementById("previewRows");
  Object.keys(PLATFORM_LABEL).forEach(platform => { ROW_LANG[platform] = "ko"; });
  box.innerHTML = Object.keys(PLATFORM_LABEL).map(platform => `
    <div class="preview-row" id="row-${platform}">
      <div class="preview-row-head">
        <b>${PLATFORM_LABEL[platform]}</b>
        <select onchange="fetchPreviewRow('${platform}', this.value)">
          ${Object.keys(LANG_LABEL).map(l=>`<option value="${l}">${LANG_LABEL[l]}</option>`).join("")}
        </select>
        <span class="preview-row-status" id="status-${platform}">불러오는 중…</span>
        <a class="view-all" href="#" target="_blank" id="viewall-${platform}">전체보기 →</a>
      </div>
      <div class="preview-thumbs" id="thumbs-${platform}"></div>
    </div>
  `).join("");
  Object.keys(PLATFORM_LABEL).forEach(platform => fetchPreviewRow(platform, "ko"));
}

async function fetchPreviewRow(platform, lang){
  if(!CUR_SC) return;
  ROW_LANG[platform] = lang;
  const status = document.getElementById(`status-${platform}`);
  const thumbs = document.getElementById(`thumbs-${platform}`);
  const viewAll = document.getElementById(`viewall-${platform}`);
  const viewAllUrl = (CUR_SEARCH_LINKS[platform] || {})[lang];
  if(viewAll) viewAll.href = viewAllUrl || "#";
  if(status) status.textContent = "불러오는 중…";
  thumbs.innerHTML = "";
  try{
    const r = await fetch(`/api/find/preview?shortcode=${encodeURIComponent(CUR_SC)}&platform=${encodeURIComponent(platform)}&lang=${encodeURIComponent(lang)}&keyword_index=${CUR_KEYWORD_INDEX}`);
    const d = await r.json();
    if(!d.ok){ if(status) status.textContent = `❌ ${d.error||"실패"}`; return; }
    if(!d.items.length){ if(status) status.textContent = "결과 없음"; return; }
    status.textContent = "";
    thumbs.innerHTML = d.items.map(it => `
      <div class="card">
        <img src="${it.thumbnail||''}" loading="lazy" onerror="this.style.visibility='hidden'">
        <div class="body">
          <div class="title">${(it.title||'').slice(0,40)}</div>
          <div class="row">
            <a href="${it.url}" target="_blank">열기</a>
            <button onclick="doSave(${it.id}, this)">＋담기</button>
          </div>
        </div>
      </div>
    `).join("");
  }catch(e){
    if(status) status.textContent = `❌ ${e.message}`;
  }
}

async function doSave(candidateId, btn){
  if(!CUR_SC) return;
  if(btn){ btn.disabled = true; btn.textContent = "담는 중…"; }
  try{
    const r = await fetch(`/api/find/save?candidate_id=${candidateId}&shortcode=${encodeURIComponent(CUR_SC)}`, {method:"POST"});
    const d = await r.json();
    if(btn) btn.textContent = d.ok ? "담음✓" : "❌ 실패";
  }catch(e){
    if(btn){ btn.textContent = "❌ 실패"; btn.disabled = false; }
  }
}

if(AUTO_SC){ document.getElementById("scInput").value = AUTO_SC; doAnalyze(); }
</script>
</body>
</html>
