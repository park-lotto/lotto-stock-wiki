<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>대표 지시함 · 회사 운영실</title><link rel="stylesheet" href="directives.css"></head>
<body><header><strong>COMPANY OS <span>대표 지시함</span></strong><a href="/">기존 업무 원장 ↗</a></header>
<main><div class="heading"><div><small>첫 연결 단계</small><h1>지시가 기록되는 곳.</h1></div><span class="badge">로컬 저장 연결 · AI 실행 미연결</span></div>
<div class="layout"><section><h2>새 지시</h2><form id="form"><label>회사<select id="company" required disabled></select></label><label>받을 팀<select id="team" required disabled></select></label><p id="routing" class="notice">담당 배정 기준을 불러오는 중입니다.</p><label>업무 제목<input id="title" required maxlength="120" placeholder="예: 장면 편집 오류의 원인을 확인해 주세요"></label><label>지시 내용 · 완료 기준<textarea id="description" required maxlength="4000" rows="6" placeholder="무엇을 해결해야 하는지, 어떤 결과를 원하는지 적어주세요."></textarea></label><p class="muted">선택한 팀의 기획 책임 역할에 접수 배정을 저장합니다. 실제 팀장의 수신 확인·업무 분할·AI 실행은 아직 연결되지 않았습니다.</p><button id="submit" type="submit" disabled>지시 저장 · 담당 배정</button></form><p id="message" role="status" aria-live="polite"></p></section>
<section><div class="section-head"><h2>접수된 업무</h2><button id="refresh" type="button" class="secondary">새로고침</button></div><p class="muted">선택한 회사의 기존 업무와 새 지시를 함께 표시합니다.</p><p id="sync" class="muted" role="status"></p><div id="list"></div></section>
<aside><small>선택한 업무</small><div id="detail"><h2>접수 내용을 확인하세요</h2><p class="muted">지시를 저장하거나 목록에서 업무를 선택하면 담당 배정과 저장된 이력이 표시됩니다.</p></div></aside></div></main><script src="directives.js"></script></body></html>
