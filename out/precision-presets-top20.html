<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>장면꾸미기 · 조회수 검증 정밀 프리셋 20</title>
<style>
@font-face{font-family:Pretendard;src:url('../shopping_shorts/static/fonts/Pretendard-Regular.otf')}
@font-face{font-family:Pretendard;src:url('../shopping_shorts/static/fonts/Pretendard-ExtraBold.otf');font-weight:800 950}
@font-face{font-family:Tmon;src:url('../shopping_shorts/static/fonts/TmonMonsori.ttf');font-weight:900}
:root{--bg:#07131c;--panel:#0c1a24;--panel2:#101f2a;--line:#1d3442;--muted:#8298a7;--text:#f2f7f9;--mint:#42e2b4;--cyan:#70d9ff;--yellow:#ffe235}
*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden;background:radial-gradient(circle at 54% -20%,#173247 0,transparent 38%),var(--bg);color:var(--text);font-family:Pretendard,system-ui,sans-serif}
button,input{font:inherit}.top{height:64px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line);background:rgba(6,16,24,.9);backdrop-filter:blur(16px)}
.brand{font-weight:900;font-size:18px}.brand em{color:var(--mint);font-style:normal}.desc{font-size:12px;color:var(--muted);margin-left:14px}.top .spacer{flex:1}.stat{padding:8px 12px;border:1px solid #235140;border-radius:10px;background:#0d2a22;color:#86f8d5;font-size:12px;font-weight:800}
.layout{height:calc(100vh - 64px);display:grid;grid-template-columns:350px minmax(430px,1fr) 360px;gap:1px;background:var(--line)}.pane{background:rgba(7,19,28,.97);min-width:0}
.left{padding:16px 12px;display:flex;flex-direction:column;overflow:hidden}.section-title{display:flex;align-items:end;gap:8px;padding:0 4px 11px;font-weight:900}.section-title small{font-size:11px;color:var(--muted);font-weight:600}.search{border:1px solid var(--line);background:#0b1821;border-radius:10px;padding:10px 12px;color:var(--text);outline:none;width:100%;margin-bottom:12px}.search:focus{border-color:var(--mint)}
.grid{overflow:auto;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:1px 4px 18px}.grid::-webkit-scrollbar,.controls::-webkit-scrollbar{width:6px}.grid::-webkit-scrollbar-thumb,.controls::-webkit-scrollbar-thumb{background:#29404e;border-radius:8px}
.preset{border:1px solid var(--line);background:#0c1a24;border-radius:12px;padding:7px;cursor:pointer;transition:.15s;position:relative}.preset:hover{transform:translateY(-2px);border-color:#38566a}.preset.on{border:2px solid var(--mint);padding:6px;box-shadow:0 0 0 3px rgba(66,226,180,.08)}
.thumbs{height:184px;display:flex;gap:4px;overflow:hidden;border-radius:7px;background:#03080b}.thumbs img{width:50%;object-fit:cover;object-position:top}.pmeta{padding:7px 2px 1px}.pname{font-size:12px;font-weight:900;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.pview{font-size:10px;color:var(--muted);margin-top:2px}.rank{position:absolute;left:3px;top:3px;z-index:2;padding:3px 6px;border-radius:0 0 7px 0;background:rgba(0,0,0,.78);font-size:9px;font-weight:900;color:#fff}.must{position:absolute;right:4px;top:4px;z-index:2;padding:3px 6px;border-radius:7px;background:var(--yellow);color:#191400;font-size:9px;font-weight:900}
.center{display:flex;flex-direction:column;padding:14px 18px;overflow:hidden}.center-head{height:43px;display:flex;align-items:center}.now-name{font-weight:900;font-size:16px}.proof{margin-left:9px;font-size:10px;color:#8ff7d7;border:1px solid #245d4d;background:#0c2a22;padding:4px 7px;border-radius:20px}.switch{margin-left:auto;display:flex;background:#09151d;border:1px solid var(--line);padding:3px;border-radius:10px}.switch button{border:0;background:transparent;color:var(--muted);padding:7px 18px;border-radius:7px;font-size:12px;font-weight:800;cursor:pointer}.switch button.on{background:#173142;color:#fff;box-shadow:0 1px 5px #0008}
.preview-wrap{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;position:relative}.phone{height:min(72vh,760px);aspect-ratio:9/16;background:#000;border-radius:13px;overflow:hidden;border:1px solid #324858;box-shadow:0 24px 65px #000b;position:relative}.phone>img{width:100%;height:100%;display:block;object-fit:cover}.edit-layer{position:absolute;inset:0;display:none;pointer-events:none}.phone.edited .edit-layer{display:block}.edit-head{position:absolute;left:0;right:0;top:0;height:34%;display:flex;flex-direction:column;text-align:center;overflow:hidden}.channel{height:27%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:900;letter-spacing:.08em}.headline{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:2% 4%;font-family:Tmon,Pretendard,sans-serif;font-weight:900;line-height:1.08;letter-spacing:-.055em}.headline span{display:block}.support{height:20%;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;padding:0 4%;font-size:14px;font-weight:900;line-height:1.1;box-shadow:0 3px 7px #0007}.edited-label{position:absolute;right:8px;bottom:8px;background:#000c;border:1px solid #ffffff30;color:#fff;border-radius:20px;padding:5px 8px;font-size:9px;font-weight:800}
.timeline{height:48px;display:flex;align-items:center;gap:10px;max-width:470px;width:100%;margin:auto}.play{width:34px;height:34px;border-radius:50%;border:0;background:white;color:#07131c}.track{height:4px;flex:1;background:#314552;border-radius:5px;overflow:hidden}.track:before{content:"";display:block;width:38%;height:100%;background:var(--mint)}.time{font-size:11px;color:var(--muted)}
.right{display:flex;flex-direction:column;overflow:hidden}.tabs{height:58px;display:flex;border-bottom:1px solid var(--line)}.tabs button{flex:1;border:0;background:transparent;color:var(--muted);font-size:12px;font-weight:900;position:relative}.tabs button.on{color:var(--mint)}.tabs button.on:after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:2px;background:var(--mint)}
.controls{overflow:auto;padding:14px 16px 24px}.notice{background:#0c2a22;border:1px solid #225746;color:#8cf5d4;padding:10px 11px;border-radius:10px;font-size:11px;line-height:1.5;margin-bottom:14px}.label{display:flex;color:#aab9c3;font-size:11px;font-weight:800;margin:12px 1px 6px}.label span:last-child{margin-left:auto;color:#627987;font-weight:600}.field{width:100%;border:1px solid var(--line);background:#09151d;color:white;border-radius:9px;padding:11px 12px;outline:0;font-size:13px;font-weight:700}.field:focus{border-color:var(--mint);box-shadow:0 0 0 3px rgba(66,226,180,.07)}
.palette{display:flex;align-items:center;gap:7px;margin:14px 0}.swatch{width:25px;height:25px;border-radius:50%;border:2px solid #ffffff30;box-shadow:0 2px 6px #000}.rgb{font:11px ui-monospace,monospace;color:var(--muted)}.action{width:100%;border:0;border-radius:10px;padding:13px;background:linear-gradient(135deg,#42e2b4,#50d5c9);color:#061d17;font-weight:950;margin-top:8px;cursor:pointer}.secondary{width:100%;border:1px solid var(--line);background:transparent;color:#c2d0d8;border-radius:10px;padding:11px;font-weight:800;margin-top:8px}.details{border:1px solid var(--line);border-radius:10px;margin-top:10px;padding:10px 11px;color:var(--muted);font-size:11px}.details summary{font-weight:800;color:#adbec8;cursor:pointer}.source{display:flex;gap:7px;margin-top:10px}.source b{color:var(--cyan)}
@media(max-width:1150px){.layout{grid-template-columns:290px 1fr 330px}.phone{height:min(68vh,650px)}}
</style>
</head>
<body>
<header class="top"><div class="brand">장면꾸미기 <em>Precision 20</em></div><div class="desc">조회수 검증 훅 + 본문 세트 · 원본 프레임 기준</div><div class="spacer"></div><div class="stat">✓ 20세트 · 40장 구성</div></header>
<main class="layout">
  <section class="pane left"><div class="section-title">템플릿 선택 <small>시청 반응 + 시인성 우선</small></div><input id="search" class="search" placeholder="채널명으로 찾기"><div id="grid" class="grid"></div></section>
  <section class="pane center"><div class="center-head"><div id="nowName" class="now-name"></div><span id="proof" class="proof"></span><div class="switch"><button id="hookBtn" class="on">훅</button><button id="bodyBtn">본문</button></div></div><div class="preview-wrap"><div id="phone" class="phone"><img id="preview"><div class="edit-layer"><div id="editHead" class="edit-head"><div id="channel" class="channel"></div><div id="headline" class="headline"><span id="line1"></span><span id="line2"></span></div><div id="support" class="support"></div></div><div class="edited-label">수정 레이어 미리보기</div></div></div></div><div class="timeline"><button class="play">▶</button><span class="time">00:00</span><div class="track"></div><span class="time">00:28</span></div></section>
  <aside class="pane right"><div class="tabs"><button class="on">문구/텍스트</button><button>미디어</button><button>스타일</button></div><div class="controls"><div class="notice"><b>원본 정밀 프리셋</b><br>처음에는 캡처 원본을 그대로 표시합니다. 글자를 수정하면 측정한 RGB·구조로 편집 레이어가 켜집니다.</div><label class="label"><span>채널명</span><span id="cc0"></span></label><input id="f0" class="field"><label class="label"><span>제목 1</span><span id="cc1"></span></label><input id="f1" class="field"><label class="label"><span>제목 2</span><span id="cc2"></span></label><input id="f2" class="field"><label class="label"><span>보조 제목 / 현재 자막</span><span id="cc3"></span></label><input id="f3" class="field"><div class="palette"><span id="sw1" class="swatch"></span><span id="sw2" class="swatch"></span><span id="rgb" class="rgb"></span></div><button id="apply" class="action">이 프리셋 적용</button><button class="secondary">내 프리셋으로 저장</button><details class="details"><summary>고급 설정 · 위치, 폰트, 효과</summary><div class="source"><b>폰트</b><span>Tmon + Pretendard ExtraBold</span></div><div class="source"><b>음영</b><span>실측 외곽선과 상단 명도 유지</span></div><div class="source"><b>원칙</b><span>빈 항목은 임의 생성하지 않음</span></div></details></div></aside>
</main>
<script>
const root='장면꾸미기_작업대/스타일수집/';
const rows=[
['01','활용정점.',12139793,'t01','#D64F42','#FFFFFF','#5EEAD4','코스트코 본사도 몰랐던','천재 아이디어'],
['02','살림킹왕짱',10500577,'t02','#F87E7F','#111111','#111111','개발자도 예상 못한','미친 사용법'],
['03','썰칩12',4153755,'t03','#514D3D','#FFFFFF','#4ADE80','다이소도 감탄한','반전의 스티커'],
['04','방구석꿀템',2632668,'t04','#FF5D5E','#111111','#22C55E','다이소 덕후들의','천재적인 활용법'],
['05','럭키박스',2462198,'t05','#7C3E41','#FFFFFF','#FF5C8A','목수보다 음대생들이','더 많이 쓰는 연필'],
['06','쇼핑 치트키',2191265,'t06','#54673F','#FFFFFF','#FF3B30','부모들 오열하게 만든','다이소 제품'],
['07','공가미',1656963,'t07','#242424','#FFFFFF','#5EEAD4','커피 박람회에서 난리 난','돌덩이의 정체'],
['08','코어장바구니',1223987,'t08','#4A1C1E','#FFFFFF','#FFE500','전 세계가 감탄한','승무원의 셔츠핏 비밀'],
['09','살림장착',1042893,'t09','#17181B','#FFFFFF','#FF7AB6','의사도 예상 못한','한국 엄마의 활용법'],
['10','쇼핑천재',1037885,'t10','#000000','#FFE600','#FFFFFF','일본이 세계에서','제일 잘 만드는 것'],
['11','이븐쇼핑',885414,'t11','#212121','#FFFFFF','#00F9ED','건망증 환자를 살려낸','일본 천재의 발명품'],
['12','이거였네',852645,'t12','#002D3A','#FFFFFF','#66E0FF','이케아도 예상 못한','미친 활용법'],
['13','달래샵',690236,'t13','#000000','#FFFFFF','#FFE600','폭우에도 끄떡없는','독일 천재의 발명품'],
['14','꿀팁꿀템',550893,'t14','#000000','#FFFFFF','#5EEAD4','제조사도 당황한','뜻밖의 활용법'],
['15','다있슈',475420,'t15','#416562','#FFFFFF','#5EEAD4','사무용품 제작사도','놀란 미친 활용법'],
['16','인생갓템',469962,'t16','#665D44','#FFFFFF','#FFE600','낚시에 미친 일본천재가','만든 제품'],
['17','나만또모르고있었지',455207,'t17','#010101','#111111','#FF4D6D','이케아의 실수','뒤집어서 찾은 활용법'],
['18','숏템 · 시인성 픽',0,'local101','#1F1C17','#FFFFFF','#FFE500','이케아도 놀랄','한국 천재 발명품'],
['19','무슨템',395739,'t19','#000000','#FFFFFF','#FFE600','다이소도 놀란','뜻밖의 이유'],
['20','헤븐쇼핑 · 구조 픽',0,'local056','#17120D','#FFFFFF','#FFCC30','주부들이 열광한','반전의 생활템']
].map((x,i)=>({rank:x[0],name:x[1],views:x[2],key:x[3],bar:x[4],c1:x[5],c2:x[6],l1:x[7],l2:x[8],featured:i===10}));
function asset(p,kind){if(p.key==='local101')return root+'프레임/s0101_숏템_'+kind+'.png';if(p.key==='local056')return root+'프레임/s0056_헤븐쇼핑_'+kind+'.png';return root+'top20_views/'+p.key+'_'+(kind==='훅'?'hook':'body')+'.png'}
let current=10,kind='훅',dirty=false;
const $=x=>document.getElementById(x),fmt=n=>n?new Intl.NumberFormat('ko-KR',{notation:n>=1e6?'compact':'standard',maximumFractionDigits:1}).format(n)+'회':'시인성 선별';
function drawGrid(){let q=$('search').value.trim();$('grid').innerHTML=rows.map((p,i)=>!q||p.name.includes(q)?`<article class="preset ${i===current?'on':''}" data-i="${i}"><span class="rank">${p.rank}</span>${p.featured?'<span class="must">필수</span>':''}<div class="thumbs"><img src="${asset(p,'훅')}"><img src="${asset(p,'본문')}"></div><div class="pmeta"><div class="pname">${p.name}</div><div class="pview">${fmt(p.views)} · 훅+본문</div></div></article>`:'').join('');document.querySelectorAll('.preset').forEach(x=>x.onclick=()=>select(+x.dataset.i))}
function select(i){current=i;dirty=false;let p=rows[i];$('f0').value=p.name.replace(/ ·.*$/,'');$('f1').value=p.l1;$('f2').value=p.l2;$('f3').value=p.l1+' '+p.l2;render();drawGrid()}
function render(){let p=rows[current];$('nowName').textContent=`${p.rank}. ${p.name}`;$('proof').textContent=p.views?`조회수 ${fmt(p.views)} 검증`:'시인성·구조 선별';$('preview').src=asset(p,kind);$('phone').classList.toggle('edited',dirty);$('editHead').style.background=p.bar;$('channel').textContent=$('f0').value;$('line1').textContent=$('f1').value;$('line2').textContent=$('f2').value;$('support').textContent=$('f3').value;$('line1').style.color=p.c1;$('line2').style.color=p.c2;$('headline').style.fontSize=p.name==='이븐쇼핑'?'clamp(22px,2vw,34px)':'clamp(20px,2.2vw,37px)';$('sw1').style.background=p.c1;$('sw2').style.background=p.c2;$('rgb').textContent=`배경 ${p.bar} · 제목 ${p.c1} / ${p.c2}`;['f0','f1','f2','f3'].forEach((id,i)=>$('cc'+i).textContent=$(''+id).value.length+'/'+(i===3?30:20));$('hookBtn').classList.toggle('on',kind==='훅');$('bodyBtn').classList.toggle('on',kind==='본문')}
['f0','f1','f2','f3'].forEach(id=>$(id).addEventListener('input',()=>{dirty=true;render()}));$('hookBtn').onclick=()=>{kind='훅';dirty=false;render()};$('bodyBtn').onclick=()=>{kind='본문';dirty=false;render()};$('search').oninput=drawGrid;$('apply').onclick=()=>{$('apply').textContent='✓ 적용 완료';setTimeout(()=>$('apply').textContent='이 프리셋 적용',1000)};select(10);
</script>
</body>
</html>
