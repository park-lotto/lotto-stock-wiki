<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>로로 · 첫 보고 연결</title><style>
*{box-sizing:border-box}body{margin:0;background:#102330;color:#e2eef0;font-family:'Segoe UI','Malgun Gothic',sans-serif}main{max-width:1050px;margin:40px auto;padding:24px}header{display:flex;align-items:center;gap:20px;border-bottom:1px solid #345261;padding-bottom:24px}.avatar{width:64px;height:64px;border:2px solid #7acaba;border-radius:20px;display:grid;place-items:center;background:#24505b;font-size:22px;color:#a0e4d8}h1{font-size:25px;margin:5px 0}small,p{color:#aec5ce;line-height:1.8}.badge{color:#e7c18a;font-size:12px}button,a{display:inline-block;padding:13px 18px;border:1px solid #71b9b2;border-radius:8px;background:#255d65;color:#edfcf7;font:inherit;cursor:pointer;text-decoration:none}button:disabled{opacity:.5;cursor:wait}#download{margin-left:8px}#status{padding:18px 0;min-height:60px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#172f3e;border:1px solid #375465;border-radius:12px;padding:22px;font:13px/1.9 'Malgun Gothic',sans-serif;max-height:65vh;overflow:auto}[hidden]{display:none!important}.limits{padding:14px;border-left:3px solid #b89459;background:#29333a;font-size:12px;margin:23px 0}@media(max-width:600px){main{margin:0;padding:18px}h1{font-size:20px}button,a{font-size:12px}#download{margin:10px 0}pre{padding:12px;font-size:11px}}
</style></head><body><main><header><div class="avatar" aria-hidden="true">로로</div><div><small>MAKERS LAB / 신규 프로젝트 팀장 연결 준비</small><h1>로로 · 작업 기록 보고</h1><span class="badge">기록 취합 기능 · AI 모델·음성 미연결</span></div></header>
<p>첫 연결은 정해진 보고 요청만 지원합니다. 실제 저장소의 기록을 읽고, 출처와 함께 파일로 정리합니다.</p><div class="limits">이 보고는 최근 기록의 원문 발췌입니다. 회사 전체의 실시간 진행 상황이나 AI 팀장의 판단 보고가 아닙니다. 기록에 “완료”가 있어도 현재 완료 여부는 미확인입니다.</div>
<button id="request">로로야, 작업 기록 정리해서 보고해</button><a id="download" hidden>보고서 파일 받기 ↓</a><div id="status" role="status" aria-live="polite">보고 요청을 기다리고 있습니다.</div><pre id="report" hidden></pre>
</main><script>
document.querySelector('#request').onclick=async()=>{const button=document.querySelector('#request'),status=document.querySelector('#status'),report=document.querySelector('#report'),link=document.querySelector('#download');button.disabled=true;report.hidden=true;link.hidden=true;status.textContent='저장소 기록을 읽어 보고서 파일을 생성하고 있습니다.';try{const response=await fetch('/api/rolo/reports',{method:'POST',headers:{'Content-Type':'application/json'},body:'{}'});const data=await response.json();if(!response.ok)throw new Error(data.detail||'보고 생성 실패');report.textContent=data.content;report.hidden=false;link.href=data.download;link.hidden=false;status.textContent='기록 취합 파일을 만들었습니다. 현재 실행 상태는 별도 확인이 필요합니다.';}catch(error){status.textContent='보고하지 못했습니다: '+error.message;}finally{button.disabled=false;}};
</script></body></html>
