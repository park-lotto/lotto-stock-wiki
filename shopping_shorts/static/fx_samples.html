<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>효과 견본 · 숏템메이커</title>
<style>
  :root{
    --bg:#0a0f0d; --panel:#0f1512; --line:#1e2a24;
    --txt:#e6efe9; --sub:#8fa39a; --accent:#37e0bd; --warn:#e0b23a;
    --t-lay:#ffd84a; --t-text:#7ad1ff; --t-video:#ff8fb1;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;line-height:1.5}
  .wrap{max-width:1600px;margin:0 auto;padding:28px 20px 80px}
  h1{font-size:26px;margin:0 0 4px;background:linear-gradient(90deg,#dff7f0,var(--accent));
    -webkit-background-clip:text;background-clip:text;color:transparent}
  .lead{color:var(--sub);font-size:13.5px;margin:0 0 14px}
  .legend{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 14px;font-size:12px;color:var(--sub)}
  .tag{display:inline-block;padding:1px 9px;border-radius:99px;font-size:11.5px;font-weight:700;color:#111}
  .tag.lay{background:var(--t-lay)} .tag.text{background:var(--t-text)} .tag.video{background:var(--t-video)}
  nav{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
    padding:10px 0;display:flex;gap:8px;flex-wrap:wrap}
  nav a{color:var(--txt);text-decoration:none;font-size:13px;padding:4px 11px;border:1px solid var(--line);
    border-radius:99px;background:var(--panel)}
  nav a:hover{border-color:var(--accent)}
  section{padding:22px 0 4px;scroll-margin-top:64px}
  h2{margin:0;font-size:19px}
  h2 small{color:var(--sub);font-weight:400;font-size:13px;margin-left:8px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(168px,1fr));gap:12px;margin-top:12px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .card video{display:block;width:100%;aspect-ratio:9/16;background:#000;cursor:pointer}
  .card .meta{padding:8px 10px 10px;font-size:13px}
  .card b{display:block;font-weight:600}
  .card .id{color:var(--sub);font-size:12px;margin-right:6px}
  .card .note{color:var(--warn);font-size:12px;display:block}
  .empty{color:var(--sub);padding:40px 0;text-align:center}
  /* 판정 달기(관제 125) */
  .bar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin:0 0 10px;font-size:12.5px;color:var(--sub)}
  .bar b{color:var(--txt);font-weight:600;margin-right:2px}
  .chip{font:inherit;font-size:12px;padding:3px 10px;border-radius:99px;border:1px solid var(--line);
    background:var(--panel);color:var(--txt);cursor:pointer}
  .chip.on{border-color:var(--accent);background:#123a31;color:#dff7f0}
  .vd{display:flex;gap:4px;margin-top:6px}
  .vd button{flex:1;font:inherit;font-size:12px;padding:3px 0;border-radius:6px;border:1px solid var(--line);
    background:#0b110e;color:var(--sub);cursor:pointer}
  .vd button.on.use{background:#1f5c3a;color:#fff;border-color:#2f8a57}
  .vd button.on.hold{background:#5c4b1f;color:#fff;border-color:#8a722f}
  .vd button.on.no{background:#5c1f2a;color:#fff;border-color:#8a2f3f}
  .mo{display:flex;gap:3px;flex-wrap:wrap;margin-top:6px}
  .mo .chip{font-size:11px;padding:1px 7px}
  .memo{width:100%;margin-top:6px;font:inherit;font-size:12px;padding:4px 6px;border-radius:6px;
    border:1px solid var(--line);background:#0b110e;color:var(--txt)}
  .card.v-use{border-color:#2f8a57} .card.v-no{opacity:.55}
  .saved{color:var(--accent);font-size:11px;margin-left:4px}
</style>
</head>
<body>
<div class="wrap">
  <h1>효과 견본</h1>
  <p class="lead" id="lead">에펙으로 만든 효과 견본입니다. 영상을 누르면 크게 봅니다. (관리자 전용)</p>
  <div class="legend">
    <span><span class="tag lay">얹기</span> 에펙 결과물 그대로 얹기</span>
    <span><span class="tag text">글자</span> 편집기 코드로 옮김</span>
    <span><span class="tag video">영상</span> 서버 영상 처리로 옮김</span>
  </div>
  <div class="bar" id="filters"></div>
  <div class="bar" id="mfilters"></div>
  <nav id="nav"></nav>
  <div id="body"><div class="empty">불러오는 중…</div></div>
</div>
<script src="/sidebar.js"></script>
<script>
const TAG = {lay:'얹기', text:'글자', video:'영상'};
function el(tag, cls, text){ const e=document.createElement(tag); if(cls) e.className=cls; if(text!=null) e.textContent=text; return e; }
const io = new IntersectionObserver(es => es.forEach(e => {
  const v = e.target;
  if (e.isIntersecting) { if (!v.src) v.src = v.dataset.src; v.play().catch(()=>{}); } else v.pause();
}), {rootMargin:'200px'});

// 판정 달기(2026-10-05, 관제 125) — 판정·쓰는 순간 이름표는 서버가 내려준다(app.py _FX_VERDICTS·_FX_MOMENTS 한 곳).
let DATA = null, FILTER = 'all', MFILTER = '';
function vOf(id){ return (DATA.verdicts || {})[id] || {verdict:'', moments:[], memo:''}; }
function shown(id){
  const v = vOf(id);
  if (FILTER === 'none' && v.verdict) return false;
  if (FILTER !== 'all' && FILTER !== 'none' && v.verdict !== FILTER) return false;
  if (MFILTER && !(v.moments || []).includes(MFILTER)) return false;
  return true;
}
function saveVerdict(id, patch, card){
  const cur = vOf(id), body = {id, verdict: cur.verdict || '', moments: cur.moments || [], memo: cur.memo || '', ...patch};
  return fetch('/api/admin/fx_samples/verdict', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(body)})
    .then(r => r.json().then(j => { if (!r.ok || !j.ok) throw new Error(j.error || ('저장 실패 ' + r.status)); return j; }))
    .then(j => {
      if (j.verdict) DATA.verdicts[id] = j.verdict; else delete DATA.verdicts[id];
      paintCard(card, id); drawFilters();
      const s = card.querySelector('.saved'); s.textContent = '저장됨'; setTimeout(() => { s.textContent = ''; }, 1200);
    })
    .catch(e => alert(id + ' ' + e.message));
}
function paintCard(card, id){
  const v = vOf(id);
  card.className = 'card' + (v.verdict ? ' v-' + v.verdict : '');
  card.querySelectorAll('.vd button').forEach(b => b.classList.toggle('on', b.dataset.k === v.verdict));
  card.querySelectorAll('.mo .chip').forEach(b => b.classList.toggle('on', (v.moments || []).includes(b.dataset.k)));
  const m = card.querySelector('.memo'); if (document.activeElement !== m) m.value = v.memo || '';
}
function verdictUI(card, id){
  const vd = el('div','vd');
  (DATA.verdict_kinds || []).forEach(k => {
    const b = el('button', k.key, k.label); b.dataset.k = k.key;
    b.onclick = () => saveVerdict(id, {verdict: vOf(id).verdict === k.key ? '' : k.key}, card);
    vd.appendChild(b);
  });
  const mo = el('div','mo');
  (DATA.moments || []).forEach(k => {
    const b = el('button','chip', k.label); b.dataset.k = k.key;
    b.onclick = () => { const ms = new Set(vOf(id).moments || []); ms.has(k.key) ? ms.delete(k.key) : ms.add(k.key); saveVerdict(id, {moments:[...ms]}, card); };
    mo.appendChild(b);
  });
  const memo = el('input','memo'); memo.placeholder = '메모 (어디에 좋은지·흠)'; memo.maxLength = 500;
  memo.onchange = () => saveVerdict(id, {memo: memo.value.trim()}, card);
  const meta = card.querySelector('.meta');
  meta.querySelector('b').appendChild(el('span','saved'));
  meta.appendChild(vd); meta.appendChild(mo); meta.appendChild(memo);
  paintCard(card, id);
}
function drawFilters(){
  const all = []; (DATA.groups || []).forEach(g => g.items.forEach(it => all.push(it.id)));
  const cnt = k => all.filter(id => { const v = vOf(id).verdict; return k === 'all' ? true : k === 'none' ? !v : v === k; }).length;
  const f = document.getElementById('filters'); f.textContent = ''; f.appendChild(el('b', null, '판정'));
  [{key:'all',label:'전체'},{key:'none',label:'미판정'}].concat(DATA.verdict_kinds || []).forEach(k => {
    const c = el('button','chip' + (FILTER === k.key ? ' on' : ''), k.label + ' ' + cnt(k.key));
    c.onclick = () => { FILTER = k.key; applyFilter(); }; f.appendChild(c);
  });
  const mf = document.getElementById('mfilters'); mf.textContent = ''; mf.appendChild(el('b', null, '쓰는 순간'));
  [{key:'',label:'전부'}].concat(DATA.moments || []).forEach(k => {
    const n = k.key ? all.filter(id => (vOf(id).moments || []).includes(k.key)).length : null;
    const c = el('button','chip' + (MFILTER === k.key ? ' on' : ''), k.label + (n == null ? '' : ' ' + n));
    c.onclick = () => { MFILTER = k.key; applyFilter(); }; mf.appendChild(c);
  });
}
function applyFilter(){
  drawFilters();
  document.querySelectorAll('section').forEach(sec => {
    let n = 0;
    sec.querySelectorAll('.card').forEach(c => { const ok = shown(c.dataset.id); c.style.display = ok ? '' : 'none'; if (ok) n++; });
    sec.style.display = n ? '' : 'none';
  });
}

function render(d){
  DATA = d; DATA.verdicts = d.verdicts || {};
  const nav = document.getElementById('nav'), body = document.getElementById('body');
  nav.textContent = ''; body.textContent = '';
  const groups = d.groups || [];
  if (!groups.length) { body.appendChild(el('div','empty', d.note || '아직 올린 견본이 없습니다')); return; }
  let total = 0;
  groups.forEach((g, i) => {
    const a = el('a', null, g.name + ' ' + g.items.length); a.href = '#g' + i; nav.appendChild(a);
    const sec = el('section'); sec.id = 'g' + i;
    const h = el('h2', null, g.name); h.appendChild(el('small', null, (g.desc ? g.desc + ' · ' : '') + g.items.length + '개'));
    sec.appendChild(h);
    const grid = el('div','grid');
    g.items.forEach(it => {
      total++;
      const card = el('div','card'), v = el('video');
      v.dataset.src = '/api/admin/fx_samples/video/' + encodeURIComponent(it.id) + '.mp4';
      v.loop = true; v.muted = true; v.playsInline = true; v.preload = 'none';
      v.addEventListener('click', () => { if (document.fullscreenElement) document.exitFullscreen(); else v.requestFullscreen(); });
      io.observe(v);
      const meta = el('div','meta'), b = el('b');
      b.appendChild(el('span','id', it.id)); b.appendChild(document.createTextNode(it.title));
      meta.appendChild(b);
      if (TAG[it.tag]) meta.appendChild(el('span','tag ' + it.tag, TAG[it.tag]));
      if (it.note) meta.appendChild(el('span','note', it.note));
      card.dataset.id = it.id;
      card.appendChild(v); card.appendChild(meta); grid.appendChild(card);
      verdictUI(card, it.id);
    });
    sec.appendChild(grid); body.appendChild(sec);
  });
  drawFilters();
  document.getElementById('lead').textContent =
    '에펙으로 만든 효과 견본 ' + total + '개입니다. 영상을 누르면 크게 봅니다. (관리자 전용' + (d.updated ? ' · 올린 날 ' + d.updated : '') + ')';
}

fetch('/api/admin/fx_samples', {headers:{'Accept':'application/json'}})
  .then(r => { if (!r.ok) throw new Error(r.status === 403 ? '관리자 전용 화면입니다' : '목록을 불러오지 못했습니다 (' + r.status + ')'); return r.json(); })
  .then(render)
  .catch(e => { const b = document.getElementById('body'); b.textContent = ''; b.appendChild(el('div','empty', e.message)); });
</script>
</body>
</html>
