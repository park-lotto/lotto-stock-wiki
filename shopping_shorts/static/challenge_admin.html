<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1기 챌린지 — 관리</title>
<link rel="stylesheet" href="/theme.css">
<style>
  /* ★팔레트는 index.html과 같은 토큰(실측 index.html:12-27).
     theme.css엔 --bg/--txt/--panel/--line이 없다 — 페이지가 직접 선언한다. */
  :root{--bg:#0a0f0d;--panel:#101815;--line:#1e2b26;--txt:#eaf3f0;--sub:#8fa1a0;
    --accent:#37e0bd;--accent2:#1f9e7a;--fire:#ff6b6b;--ok:#37e0bd;--gold:#f0c453;
    --inset:#0c1412;--hover:#131d19;--shorts-ar:9/16;color-scheme:dark;
    --chal-0-bg:#3a1a1a;--chal-0-fg:#ff8a80;
    --chal-1-bg:#3a3018;--chal-1-fg:#e9b45c;
    --chal-2-bg:#12312a;--chal-2-fg:#5fd1a9;}
  :root[data-theme="light"]{--bg:#f4faf7;--panel:#ffffff;--line:#d5e6df;--txt:#0f1a16;--sub:#5c726d;
    --accent:#12b886;--accent2:#0ca678;--fire:#e0524a;--ok:#12b886;--gold:#b8860b;
    --inset:#eef7f3;--hover:#eef7f3;color-scheme:light;
    --chal-0-bg:#fdeaea;--chal-0-fg:#b3261e;
    --chal-1-bg:#fdf2df;--chal-1-fg:#8a6100;
    --chal-2-bg:#e1f3ec;--chal-2-fg:#0a7d66;}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
       font-family:'IBM Plex Sans KR','Malgun Gothic',system-ui,sans-serif;
       display:flex;min-height:100vh}
  .main{flex:1;min-width:0}
  .wrap{max-width:1400px;margin:0 auto;padding:20px 16px 60px}
  h1{font-size:20px;margin:0 0 14px}
  .tabs{display:flex;gap:6px;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .tab{padding:10px 18px;font-size:14px;font-weight:700;cursor:pointer;
       border:0;background:none;color:var(--sub);border-bottom:2px solid transparent;
       font-family:inherit}
  .tab.on{color:var(--txt);border-bottom-color:var(--accent)}
  .pane{display:none} .pane.on{display:block}

  .gridwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
  table{border-collapse:separate;border-spacing:0;font-size:13px;width:max-content;min-width:100%}
  th,td{padding:7px 9px;white-space:nowrap;border-bottom:1px solid var(--line)}
  thead th{position:sticky;top:0;background:var(--panel);z-index:2;font-size:12px}
  .who{position:sticky;left:0;background:var(--panel);z-index:1;text-align:left;
       min-width:150px;font-weight:600}
  thead .who{z-index:3}
  .cell{width:34px;text-align:center;font-weight:700;border-radius:5px}
  /* 달성 칸 색 — 토큰으로 둔다(라이트 모드에서 어두운 하드코딩 색은 안 읽힌다). */
  .c0{background:var(--chal-0-bg);color:var(--chal-0-fg)}
  .c1{background:var(--chal-1-bg);color:var(--chal-1-fg)}
  .c2{background:var(--chal-2-bg);color:var(--chal-2-fg)}
  .rate{text-align:right;color:var(--sub)}

  .bar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap;
       color:var(--sub);font-size:13px}
  select{padding:8px 10px;font-size:13px;border-radius:8px;
       border:1px solid var(--line);background:var(--inset);color:inherit;font-family:inherit}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);
        border-radius:12px;overflow:hidden;display:flex;flex-direction:column;
        text-decoration:none;color:inherit}
  .card .th{aspect-ratio:var(--shorts-ar);width:100%;object-fit:cover;display:block;
            background:var(--inset)}
  .card .no-th{aspect-ratio:var(--shorts-ar);display:flex;align-items:center;
               justify-content:center;font-size:28px;color:var(--sub);background:var(--inset)}
  .card .t{font-size:12px;padding:6px 9px 4px;line-height:1.4;
           display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card .m{font-size:11px;color:var(--sub);padding:0 9px 9px;margin-top:auto}
  .who-tag{font-size:11px;color:var(--accent);padding:8px 9px 0;font-weight:600}
  .empty{color:var(--sub);padding:40px 0;text-align:center;font-size:14px}
</style>
<div class="main">
<div class="wrap">
  <h1>🔥 1기 챌린지 관리</h1>
  <div class="tabs">
    <button class="tab on" data-p="board">달성현황</button>
    <button class="tab" data-p="videos">영상</button>
  </div>

  <div class="pane on" id="p-board">
    <div class="bar" id="boardInfo"></div>
    <div class="gridwrap"><table id="grid"></table></div>
  </div>

  <div class="pane" id="p-videos">
    <div class="bar">
      <select id="sort">
        <option value="recent">최신순</option>
        <option value="views">조회수순</option>
      </select>
      <select id="member"><option value="0">전체 멤버</option></select>
      <select id="platform">
        <option value="">전체 플랫폼</option>
        <option value="instagram">인스타</option>
        <option value="youtube">유튜브</option>
        <option value="tiktok">틱톡</option>
      </select>
      <span id="vcount"></span>
    </div>
    <div id="cards"><div class="empty">불러오는 중…</div></div>
  </div>
</div>
</div>
<script src="/sidebar.js?v=2"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g,
  c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function dayRange(start, end, today) {
  // 시작~오늘(또는 종료일 중 이른 쪽)까지의 날짜 목록. 미래 칸은 그리지 않는다.
  const last = (end && end < today) ? end : today;
  if (!start || start > last) return [today];
  const out = [], d = new Date(start + 'T00:00:00Z');
  const stop = new Date(last + 'T00:00:00Z');
  while (d <= stop && out.length < 400) {
    out.push(d.toISOString().slice(0, 10));
    d.setUTCDate(d.getUTCDate() + 1);
  }
  return out;
}

async function loadBoard() {
  let d;
  try {
    const r = await fetch('/api/challenge/board');
    if (r.status === 403) {
      $('#grid').innerHTML = '<tr><td class="empty">관리자만 볼 수 있어요</td></tr>';
      return;
    }
    if (!r.ok) throw new Error('bad status ' + r.status);
    d = await r.json();
  } catch (e) {
    $('#grid').innerHTML = '<tr><td class="empty">불러오지 못했어요</td></tr>';
    return;
  }
  const goal = d.goal || 2;
  const days = dayRange(d.start, d.end, d.today);
  const members = d.members || [];
  $('#boardInfo').textContent =
    `참가자 ${members.length}명 · 목표 하루 ${goal}개`
    + ((d.start || d.end) ? ` · ${d.start || ''} ~ ${d.end || ''}` : ' · 기간 미설정');

  const head = '<thead><tr><th class="who">멤버</th>'
    + days.map(x => `<th>${esc(x.slice(5))}</th>`).join('')
    + '<th class="rate">달성</th></tr></thead>';
  const body = members.map(m => {
    const cells = days.map(day => {
      const n = (m.by_day || {})[day] || 0;
      const cls = n >= goal ? 'c2' : (n > 0 ? 'c1' : 'c0');
      return `<td class="cell ${cls}">${n}</td>`;
    }).join('');
    const pct = days.length ? Math.round(m.done_days / days.length * 100) : 0;
    return `<tr><td class="who">${esc(m.name)}</td>${cells}`
      + `<td class="rate">${m.done_days}/${days.length} (${pct}%)</td></tr>`;
  }).join('');
  $('#grid').innerHTML = head + '<tbody>'
    + (body || `<tr><td class="empty" colspan="${days.length + 2}">참가자가 없어요</td></tr>`)
    + '</tbody>';

  // 영상 탭의 멤버 필터도 같이 채운다.
  const sel = $('#member');
  if (sel.options.length <= 1) {
    members.forEach(m => {
      const o = document.createElement('option');
      o.value = m.customer_id; o.textContent = m.name;
      sel.appendChild(o);
    });
  }
}

function cardHtml(it) {
  // ★썸네일 프록시 파라미터는 ?url= 이다(app.py:5579). ?u=로 쓰면 422.
  const th = it.thumb
    ? `<img class="th" src="/api/thumb?url=${encodeURIComponent(it.thumb)}" alt="" loading="lazy">`
    : `<div class="no-th">🎬</div>`;
  let meta;
  if (it.fetch_status === 'ok' && (it.views || it.views === 0)) {
    meta = `조회 ${Number(it.views).toLocaleString()}`;
  } else if (it.platform === 'tiktok') {
    meta = '틱톡';
  } else if (it.fetch_status === 'failed') {
    meta = '정보 없음';
  } else {
    meta = '수집 중';
  }
  return `<a class="card" href="${esc(it.url)}" target="_blank" rel="noopener">
    ${th}
    <div class="who-tag">${esc(it.member_name || '')}</div>
    <div class="t">${esc(it.title || it.url)}</div>
    <div class="m">${esc(it.submit_day)} · ${esc(meta)}</div>
  </a>`;
}

async function loadVideos() {
  const q = new URLSearchParams({
    sort: $('#sort').value,
    member: $('#member').value,
    platform: $('#platform').value,
  });
  try {
    const r = await fetch('/api/challenge/videos?' + q);
    if (r.status === 403) {
      $('#cards').innerHTML = '<div class="empty">관리자만 볼 수 있어요</div>';
      return;
    }
    if (!r.ok) throw new Error('bad status ' + r.status);
    const d = await r.json();
    const items = d.items || [];
    $('#vcount').textContent = `${items.length}개`;
    $('#cards').innerHTML = items.length
      ? '<div class="cards">' + items.map(cardHtml).join('') + '</div>'
      : '<div class="empty">제출된 영상이 없어요</div>';
  } catch (e) {
    $('#cards').innerHTML = '<div class="empty">불러오지 못했어요</div>';
  }
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('on'));
    document.querySelectorAll('.pane').forEach(x => x.classList.remove('on'));
    t.classList.add('on');
    $('#p-' + t.dataset.p).classList.add('on');
    if (t.dataset.p === 'videos') loadVideos();
  });
});
['#sort', '#member', '#platform'].forEach(s =>
  $(s).addEventListener('change', loadVideos));

loadBoard();
</script>
