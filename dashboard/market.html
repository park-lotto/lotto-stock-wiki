<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>섹터 히트맵 — STOCK BRAIN</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0b0e;--panel:#131318;--line:#222228;--gold:#d4af37;--up1:#c0392b;--up2:#e74c3c;--up3:#f19090;--dn1:#1a5276;--dn2:#2471a3;--dn3:#7fb3d3;--neu:#2a2a35;}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;}
body{background:var(--bg);color:#eee;min-height:100vh;}

/* ── 상단 바 ── */
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--line);
        display:flex;align-items:center;padding:0 24px;gap:16px;}
.topbar .logo{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:1px;}
.topbar .time{margin-left:auto;font-size:13px;color:#888;}
.topbar .badge{font-size:12px;padding:3px 10px;border-radius:20px;background:#1e3a1e;color:#4ade80;}
.nav{display:flex;gap:2px;margin-left:20px;}
.nav a{padding:6px 14px;border-radius:6px;font-size:13px;color:#888;text-decoration:none;transition:background .15s;}
.nav a:hover,.nav a.active{background:var(--line);color:#eee;}

/* ── ETF 상단 바 ── */
.etf-bar{background:var(--panel);border-bottom:1px solid var(--line);
         overflow-x:auto;white-space:nowrap;padding:0 16px;scrollbar-width:none;}
.etf-bar::-webkit-scrollbar{display:none;}
.etf-chip{display:inline-flex;flex-direction:column;gap:2px;padding:8px 14px;
          border-right:1px solid var(--line);min-width:120px;cursor:default;
          vertical-align:top;transition:background .15s;}
.etf-chip:hover{background:rgba(255,255,255,.04);}
.etf-chip .etf-name{font-size:11px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
.etf-chip .etf-rate{font-size:14px;font-weight:700;}
.etf-chip .etf-rate.up{color:#e74c3c;} .etf-chip .etf-rate.dn{color:#3498db;} .etf-chip .etf-rate.neu{color:#888;}
.etf-chip svg{display:block;}
.blink-dot{animation:blink 1.4s ease-in-out infinite;}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.15;}}

/* ── 탭 바 ── */
.tab-bar{display:flex;background:var(--bg);border-bottom:2px solid var(--line);
         overflow-x:auto;scrollbar-width:none;padding:0 8px;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab{background:transparent;border:none;padding:11px 18px;font-size:13px;font-weight:700;
     color:#555;cursor:pointer;white-space:nowrap;font-family:inherit;
     border-bottom:2px solid transparent;margin-bottom:-2px;
     transition:color .15s,border-color .15s;}
.tab:hover{color:#aaa;}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ── 메인 ── */
.main{padding:20px 24px;}
.subbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.subbar h1{font-size:17px;font-weight:700;color:#fff;}
.subbar .snap-date{font-size:12px;color:#555;}
.tab-desc{font-size:12px;color:#666;margin-left:4px;}
.subbar .right{display:flex;align-items:center;gap:6px;margin-left:auto;}
.subbar .refresh-btn{padding:6px 14px;border:1px solid var(--gold);
  border-radius:8px;background:transparent;color:var(--gold);font-size:13px;cursor:pointer;transition:background .15s;}
.subbar .refresh-btn:hover{background:rgba(212,175,55,.12);}
.subbar .refresh-btn:disabled{opacity:.4;cursor:wait;}
.interval-btn{padding:5px 10px;border:1px solid #333;border-radius:6px;
  background:transparent;color:#666;font-size:12px;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;white-space:nowrap;}
.interval-btn:hover{border-color:#555;color:#aaa;}
.interval-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.08);}

/* ── 4카드 패널 (코스피/코스닥/미국선물/야간선물) ── */
.mkt-card{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:10px 12px;min-width:0;display:flex;flex-direction:column;gap:7px;
  scrollbar-width:thin;scrollbar-color:#222 transparent;}
.mkt-card::-webkit-scrollbar{width:3px;}
.mkt-card::-webkit-scrollbar-thumb{background:#333;border-radius:2px;}
.mkt-hdr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.mkt-name{font-size:11px;font-weight:700;color:#888;white-space:nowrap;}
.mkt-price{font-size:18px;font-weight:800;color:#fff;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.mkt-rate{font-size:12px;font-weight:700;}
.mkt-rate.up{color:var(--up1);}
.mkt-rate.dn{color:var(--dn1);}
.mkt-rate.neu{color:#666;}
.mkt-sec-label{font-size:9px;color:#444;letter-spacing:.5px;margin-bottom:2px;
  display:flex;justify-content:space-between;align-items:center;}
/* 투자자 발산 바 */
.inv-grid{display:grid;grid-template-columns:26px 1fr 52px;gap:2px 5px;align-items:center;}
.inv-lbl{font-size:10px;color:#777;}
.div-bar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:#1a1a1a;}
.div-neg{flex:1;display:flex;align-items:stretch;justify-content:flex-end;}
.div-neg-fill{border-radius:3px 0 0 3px;transition:width .5s;}
.div-pos{flex:1;display:flex;align-items:stretch;}
.div-pos-fill{border-radius:0 3px 3px 0;transition:width .5s;}
.inv-num{font-size:10px;font-variant-numeric:tabular-nums;text-align:right;}
.inv-num.up{color:var(--up1);}
.inv-num.dn{color:var(--dn1);}
/* 프로그램 */
.prog-row{display:flex;align-items:center;gap:8px;}
.prog-total{font-size:15px;font-weight:800;font-variant-numeric:tabular-nums;}
.prog-total.up{color:var(--up1);}
.prog-total.dn{color:var(--dn1);}
.prog-detail{font-size:9px;color:#555;line-height:1.5;}
.mkt-ts{font-size:9px;color:#333;text-align:right;}
/* 글로벌 지표 카드 */
.global-row{display:grid;grid-template-columns:90px 1fr auto;gap:4px 8px;align-items:center;margin-bottom:3px;}
.global-name{font-size:10px;color:#888;white-space:nowrap;}
.global-price{font-size:13px;font-weight:700;color:#ddd;font-variant-numeric:tabular-nums;text-align:right;}
.global-rate{font-size:11px;font-weight:700;text-align:right;white-space:nowrap;}
.global-rate.up{color:var(--up1);} .global-rate.dn{color:var(--dn1);} .global-rate.neu{color:#888;}
/* 미국시장 카드 */
.us-row{display:flex;justify-content:space-between;align-items:center;height:36px;padding:0 2px;border-bottom:1px solid #1a1a1a;box-sizing:border-box;}
.us-row:last-child{border-bottom:none;}
.us-label{font-size:10px;color:#888;display:block;}
.us-sym{font-size:11px;font-weight:700;color:#ccc;}
.us-vals{text-align:right;}
.us-price{font-size:13px;font-weight:700;color:#ddd;display:block;font-variant-numeric:tabular-nums;}
.us-rate{font-size:11px;font-weight:700;}
.us-rate.up{color:var(--up1);} .us-rate.dn{color:var(--dn1);} .us-rate.neu{color:#888;}

.legend{display:flex;gap:8px;margin-bottom:16px;align-items:center;font-size:12px;color:#666;}
.legend .bar{height:12px;width:80px;border-radius:4px;
  background:linear-gradient(to right,var(--dn1),var(--neu),var(--up1));}

/* ── 즐겨찾기 버튼 ── */
.fav-btn{position:absolute;top:5px;right:5px;background:none;border:none;cursor:pointer;
  font-size:14px;color:#333;line-height:1;padding:2px;transition:color .15s;z-index:2;}
.fav-btn:hover,.fav-btn.on{color:#f5c518;}
.tile{position:relative;}

/* ── 히트맵 그리드 ── */
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:600px){.grid{grid-template-columns:repeat(2,1fr);}}

.tile{border-radius:12px;padding:14px;min-height:120px;display:flex;flex-direction:column;
      gap:8px;transition:transform .15s,box-shadow .15s;cursor:default;position:relative;overflow:hidden;}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.5);}
.tile .sec-name{font-size:12px;font-weight:700;color:rgba(255,255,255,.9);line-height:1.3;}
.tile .avg-rate{font-size:24px;font-weight:900;line-height:1;}
.tile .stocks{display:flex;flex-direction:column;gap:3px;margin-top:auto;}
.tile .stock-row{display:flex;justify-content:space-between;align-items:center;font-size:11px;color:rgba(255,255,255,.75);}
.tile .stock-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:68%;}
.tile .stock-rate{font-weight:700;white-space:nowrap;}
.tile .stock-more{font-size:10px;color:rgba(255,255,255,.4);margin-top:2px;}
.parent-badge{display:inline-block;font-size:10px;color:rgba(255,255,255,.45);font-weight:400;
              background:rgba(0,0,0,.35);padding:1px 6px;border-radius:10px;
              margin-left:4px;vertical-align:middle;}

.tile.up3{background:linear-gradient(135deg,#7b1c1c,#a93226);}
.tile.up2{background:linear-gradient(135deg,#922b21,#c0392b);}
.tile.up1{background:linear-gradient(135deg,#6b2020,#8b2f2f);}
.tile.neu{background:var(--panel);border:1px solid var(--line);}
.tile.dn1{background:linear-gradient(135deg,#1b2a6b,#1a5276);}
.tile.dn2{background:linear-gradient(135deg,#1a4066,#1f618d);}
.tile.dn3{background:linear-gradient(135deg,#0e2440,#154360);}
.tile.empty{background:var(--panel);border:1px dashed var(--line);opacity:.5;}

.loading{text-align:center;padding:80px;color:#555;font-size:18px;grid-column:1/-1;}
.error{text-align:center;padding:60px;color:#e74c3c;grid-column:1/-1;}

/* ── 편집 탭 ── */
.edit-panel{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:800px){.edit-panel{grid-template-columns:1fr;}}
.edit-section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;}
.edit-section h2{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:12px;letter-spacing:.3px;}
.edit-input{width:100%;background:#1a1a22;border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;color:#eee;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;}
.edit-input:focus{border-color:var(--gold);}
.sector-list{margin-top:8px;max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;
  scrollbar-width:thin;scrollbar-color:#333 transparent;}
.sector-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;transition:background .1s;}
.sector-item:hover{background:rgba(255,255,255,.04);}
.sector-item input[type=checkbox]{accent-color:#c0392b;width:15px;height:15px;cursor:pointer;flex-shrink:0;}
.sector-item label{font-size:12px;color:#ccc;flex:1;cursor:pointer;line-height:1.3;}
.sector-item.hidden label{color:#555;text-decoration:line-through;}
.edit-label{font-size:11px;color:#666;margin-bottom:5px;margin-top:10px;display:block;}
.sector-select{width:100%;background:#1a1a22;border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;color:#eee;font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;}
.sector-select:focus{border-color:var(--gold);}
.tag-row{display:flex;flex-wrap:wrap;gap:5px;min-height:22px;}
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;
  background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.3);
  border-radius:20px;font-size:11px;color:var(--gold);}
.tag .x{cursor:pointer;color:#888;font-size:10px;margin-left:2px;}
.tag .x:hover{color:#e74c3c;}
.autocomplete-wrap{position:relative;}
.autocomplete-list{position:absolute;top:calc(100% + 2px);left:0;right:0;background:#1e1e28;
  border:1px solid var(--line);border-radius:8px;max-height:160px;overflow-y:auto;
  z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.6);}
.autocomplete-item{padding:7px 12px;font-size:12px;color:#ccc;cursor:pointer;}
.autocomplete-item:hover{background:rgba(212,175,55,.1);color:var(--gold);}
.custom-sector-list{display:flex;flex-direction:column;gap:6px;}
.custom-sector-row{display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;background:rgba(255,255,255,.03);border-radius:8px;}
.custom-sector-name{font-size:12px;color:#ddd;font-weight:700;}
.custom-sector-stocks{font-size:10px;color:#555;margin-top:2px;}
.del-btn{background:none;border:none;color:#555;cursor:pointer;font-size:13px;padding:2px 6px;line-height:1;}
.del-btn:hover{color:#e74c3c;}
.save-bar{margin-top:14px;display:flex;justify-content:flex-end;gap:8px;}
.btn-save{padding:9px 24px;background:var(--gold);color:#111;border:none;border-radius:8px;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.btn-save:hover{opacity:.85;}
.btn-save:disabled{opacity:.5;cursor:wait;}
.btn-reset{padding:9px 16px;background:none;border:1px solid #444;color:#777;
  border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s;}
.btn-reset:hover{border-color:#aaa;color:#ccc;}
#toast{position:fixed;bottom:24px;right:24px;padding:11px 18px;border-radius:10px;
  font-size:13px;z-index:9999;pointer-events:none;transition:opacity .4s;}
</style>
</head>
<body>
<div class="topbar">
  <span class="logo">⚡ STOCK BRAIN</span>
  <nav class="nav">
    <a href="/">장전</a>
    <a href="/studio">스튜디오</a>
    <a href="/market" class="active">히트맵</a>
    <a href="/insights">인사이트</a>
  </nav>
  <span class="badge" id="mkt-status">장중</span>
  <span class="time" id="clock"></span>
</div>

<!-- ETF 상단 바 -->
<div class="etf-bar" id="etf-bar">
  <span style="color:#555;font-size:12px;padding:12px 0;display:inline-block;">ETF 로딩중…</span>
</div>

<!-- 코스피/코스닥 패널 -->
<div id="mkt-panel" style="display:flex;gap:12px;padding:12px 24px 0;align-items:stretch;"></div>

<!-- 탭 바 -->
<div class="tab-bar" id="tab-bar">
  <button class="tab" data-tab="fav">⭐ 즐겨찾기</button>
  <button class="tab active" data-tab="all">전체</button>
  <button class="tab" data-tab="semi">반도체</button>
  <button class="tab" data-tab="ship">조선/LNG</button>
  <button class="tab" data-tab="def">방산/우주</button>
  <button class="tab" data-tab="robot">로봇</button>
  <button class="tab" data-tab="bio">바이오</button>
  <button class="tab" data-tab="battery">이차전지</button>
  <button class="tab" data-tab="energy">에너지</button>
  <button class="tab" data-tab="beauty">뷰티</button>
  <button class="tab" data-tab="ai">AI</button>
  <button class="tab" data-tab="auto">자동차</button>
  <button class="tab" data-tab="theme">테마</button>
  <button class="tab" data-tab="edit" style="margin-left:auto;color:#888">⚙️ 편집</button>
</div>

<div class="main">
  <div class="subbar">
    <h1 id="main-title">섹터 히트맵</h1>
    <span class="snap-date" id="snap-date"></span>
    <div class="right">
      <button class="interval-btn active" id="iv-600" onclick="setIntervalSec(600)">10분</button>
      <button class="interval-btn" id="iv-300" onclick="setIntervalSec(300)">5분</button>
      <button class="interval-btn" id="iv-30"  onclick="setIntervalSec(30)">30초</button>
      <button class="refresh-btn" id="refresh-btn" onclick="refresh()">↻ 새로고침</button>
    </div>
  </div>
  <div class="legend">
    <div class="bar"></div>
    <span>하락 ← 보합 → 상승</span>
  </div>
  <div class="grid" id="grid"><div class="loading">📡 데이터 불러오는 중…</div></div>
</div>

<script>
// ── 유틸 ──────────────────────────────────────────────────
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function rateToBg(r){
  if(r>=3)return"up3";if(r>=1)return"up2";if(r>=0.5)return"up1";
  if(r<=-3)return"dn3";if(r<=-1)return"dn2";if(r<=-0.5)return"dn1";
  return"neu";
}
function rateStr(r){
  if(r==null||r===0)return"±0.00%";
  return(r>0?"+":"")+r.toFixed(2)+"%";
}

// ── 시계 ─────────────────────────────────────────────────
setInterval(()=>{
  const now=new Date();
  document.getElementById("clock").textContent=now.toLocaleTimeString("ko-KR");
  const h=now.getHours(),m=now.getMinutes();
  const isMarket=(h>9||(h===9&&m>=0));
  const isClose=(h>=15&&m>=30);
  const badge=document.getElementById("mkt-status");
  if(isClose){badge.textContent="장마감";badge.style.background="#2a1a1a";badge.style.color="#e74c3c";}
  else if(isMarket){badge.textContent="장중";badge.style.background="#1e3a1e";badge.style.color="#4ade80";}
  else{badge.textContent="장전";badge.style.background="#1a1a2e";badge.style.color="#aaa";}
},1000);

// ── 탭 상태 ──────────────────────────────────────────────
let activeTab="all";

document.getElementById("tab-bar").addEventListener("click",e=>{
  const btn=e.target.closest(".tab");
  if(!btn)return;
  const tab=btn.dataset.tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===tab));
  activeTab=tab;
  loadActive();
});

// ★ 클릭 이벤트 위임
document.getElementById("grid").addEventListener("click",e=>{
  const btn=e.target.closest(".fav-btn");
  if(!btn)return;
  e.stopPropagation();
  const name=btn.dataset.sector;
  toggleFav(name);
  // 즐겨찾기 탭이면 재렌더(전체 캐시 기준), 아니면 버튼만 토글
  if(activeTab==="fav"){ renderGrid(_allTiles); }
  else { btn.classList.toggle("on"); }
});

function loadActive(){
  if(activeTab==="fav"){
    if(_allTiles.length>0) renderGrid(_allTiles);
    else loadOverview();
  }
  else if(activeTab==="all") loadOverview();
  else if(activeTab==="edit") loadEditTab();
  else loadTab(activeTab);
}

// ── 클라이언트 탭 캐시 (세션 내 즉시 렌더) ──────────────────
const _tabCache={};  // {key: {data, ts}}
const _TAB_TTL=180*1000;  // 3분

function _fromCache(key){ const e=_tabCache[key]; return(e&&Date.now()-e.ts<_TAB_TTL)?e.data:null; }
function _toCache(key,data){ _tabCache[key]={data,ts:Date.now()}; }
function _clearCache(key){ delete _tabCache[key]; }

// ── 전체 탭 ──────────────────────────────────────────────
async function loadOverview(force=false){
  if(!force){
    const cached=_fromCache("all");
    if(cached){ renderOverview(cached); return; }
  }
  const btn=document.getElementById("refresh-btn");
  btn.disabled=true; btn.textContent="로딩중…";
  document.getElementById("main-title").textContent="섹터 히트맵 — 전체";
  const grid=document.getElementById("grid");
  grid.innerHTML='<div class="loading">📡 섹터 데이터 불러오는 중…</div>';
  try{
    const url=force?"/api/heatmap/refresh":"/api/heatmap";
    const r=await fetch(url);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const data=await r.json();
    if(data.error)throw new Error(data.error);
    _toCache("all",data);
    renderOverview(data);
  }catch(e){
    grid.innerHTML=`<div class="error">❌ ${esc(e.message)}<br><small>장외시간이면 한투 API가 응답하지 않을 수 있습니다</small></div>`;
  }finally{btn.disabled=false;btn.textContent="↻ 새로고침";}
}

function renderOverview(data){
  _allTiles=data.sectors||[];
  _lastTiles=_allTiles;
  if(activeTab==="edit") return;  // 편집탭 중 race condition 방지
  document.getElementById("snap-date").textContent=`업데이트 ${data.updated_at||""}`;
  document.getElementById("grid").style.display="";
  renderGrid(_lastTiles);
}

// ── 세부 탭 ──────────────────────────────────────────────
const TAB_LABELS={
  semi:"반도체",ship:"조선/LNG",def:"방산/우주",robot:"로봇",bio:"바이오",
  battery:"이차전지",energy:"에너지",beauty:"뷰티",ai:"AI",auto:"자동차",theme:"테마"
};

async function loadTab(tabId,force=false){
  if(!force){
    const cached=_fromCache(tabId);
    if(cached){ renderTab(cached); return; }
  }
  const btn=document.getElementById("refresh-btn");
  btn.disabled=true; btn.textContent="로딩중…";
  const label=TAB_LABELS[tabId]||tabId;
  document.getElementById("main-title").textContent=`섹터 히트맵 — ${label}`;
  const grid=document.getElementById("grid");
  grid.innerHTML=`<div class="loading">📡 ${label} 세부 데이터 불러오는 중…<br><small style="color:#444">병렬 조회 중 (수~십 초 소요)</small></div>`;
  try{
    const url=force?`/api/heatmap_tab/refresh?id=${tabId}`:`/api/heatmap_tab?id=${tabId}`;
    const r=await fetch(url);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const data=await r.json();
    if(data.error)throw new Error(data.error);
    _toCache(tabId,data);
    renderTab(data);
  }catch(e){
    grid.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`;
  }finally{btn.disabled=false;btn.textContent="↻ 새로고침";}
}

// ── 즐겨찾기 관리 ──────────────────────────────────────────
function getFavs(){ try{ return JSON.parse(localStorage.getItem("favSectors")||"[]"); }catch{ return []; } }
function setFavs(arr){ localStorage.setItem("favSectors", JSON.stringify(arr)); }

// 타일 데이터 캐시 (새로고침 후에도 즐겨찾기 복원용)
function getFavCache(){ try{ return JSON.parse(localStorage.getItem("favTileCache")||"{}"); }catch{ return {}; } }
function setFavCache(obj){ localStorage.setItem("favTileCache", JSON.stringify(obj)); }

function toggleFav(name){
  const favs=getFavs();
  const cache=getFavCache();
  const idx=favs.indexOf(name);
  if(idx>=0){
    favs.splice(idx,1);
    delete cache[name];
  } else {
    favs.push(name);
    // 현재 로드된 타일에서 데이터 찾아 캐시
    const tileData=[..._allTiles,..._lastTiles].find(t=>t.name===name);
    if(tileData) cache[name]=tileData;
  }
  setFavs(favs);
  setFavCache(cache);
}

let _lastTiles=[];
let _allTiles=[];   // 전체 탭 캐시 — 즐겨찾기 소스는 항상 이걸 씀

function renderTab(data){
  _lastTiles=data.tiles||[];
  const seen=new Set(_allTiles.map(t=>t.name));
  _lastTiles.forEach(t=>{ if(!seen.has(t.name)){ _allTiles.push(t); seen.add(t.name); } });
  if(activeTab==="edit") return;  // 편집탭 중 race condition 방지
  document.getElementById("snap-date").textContent=`업데이트 ${data.updated_at||""}`;
  document.getElementById("grid").style.display="";
  renderGrid(_lastTiles);
}

function renderGrid(tiles){
  const grid=document.getElementById("grid");
  const favs=getFavs();
  const isFavTab=(activeTab==="fav");
  // 즐겨찾기 탭: _allTiles에서 필터 + 없으면 localStorage 캐시로 보완
  let toShow;
  if(isFavTab){
    const cache=getFavCache();
    toShow=favs.map(name=>_allTiles.find(t=>t.name===name)||cache[name]).filter(Boolean);
  } else {
    toShow=tiles;
  }

  // 섹터 타일: 등락률 내림차순 정렬 (데이터 없는 것은 맨 뒤)
  toShow=[...toShow].sort((a,b)=>{
    const ae=a.stocks.length===0, be=b.stocks.length===0;
    if(ae&&be) return 0;
    if(ae) return 1;
    if(be) return -1;
    return b.avg_rate - a.avg_rate;
  });

  grid.innerHTML="";
  if(isFavTab && toShow.length===0){
    grid.innerHTML=`<div style="grid-column:1/-1;padding:40px;text-align:center;color:#555;font-size:14px">
      ⭐ 섹터 타일의 ★을 클릭하면 즐겨찾기에 추가됩니다
    </div>`;
    return;
  }
  for(const tile of toShow){
    const cls=tile.stocks.length===0?"empty":rateToBg(tile.avg_rate);
    const avgStr=tile.stocks.length===0?"데이터없음":rateStr(tile.avg_rate);
    const parentHtml=tile.parent?`<span class="parent-badge">${esc(tile.parent)}</span>`:"";
    const isFav=favs.includes(tile.name);
    // 섹터 내 종목 등락률 내림차순, 상위 3개만 표시
    const sortedStocks=[...tile.stocks].sort((a,b)=>b.change_rate-a.change_rate);
    const topStocks=sortedStocks.slice(0,3);
    const moreCount=sortedStocks.length-3;
    const stocksHtml=topStocks.map(s=>
      `<div class="stock-row">
         <span class="stock-name">${esc(s.name)}</span>
         <span class="stock-rate">${rateStr(s.change_rate)}</span>
       </div>`).join("")
      +(moreCount>0?`<div class="stock-more">+${moreCount}개</div>`:"")
    const el=document.createElement("div");
    el.className=`tile ${cls}`;
    el.innerHTML=`<button class="fav-btn${isFav?" on":""}" data-sector="${esc(tile.name)}" title="즐겨찾기">★</button>
      <div class="sec-name">${esc(tile.name)}${parentHtml}</div>
      <div class="avg-rate">${avgStr}</div>
      <div class="stocks">${stocksHtml}</div>`;
    grid.appendChild(el);
  }
}

// ── ETF 바 ────────────────────────────────────────────────
function sparkline(bars,rate){
  const W=64,H=28;
  const pts_data = (bars && bars.length>=2) ? bars : null;
  if(!pts_data)return`<svg width="${W}" height="${H}"></svg>`;
  const mn=Math.min(...pts_data),mx=Math.max(...pts_data);
  const range=mx-mn||1;
  const xs=pts_data.map((_,i)=>Math.round(i*(W-4)/(pts_data.length-1))+2);
  const ys=pts_data.map(v=>Math.round(H-4-((v-mn)/range)*(H-8))+2);
  const pts=xs.map((x,i)=>`${x},${ys[i]}`).join(" ");
  const col=rate>0?"#e74c3c":rate<0?"#3498db":"#666";
  const lx=xs[xs.length-1],ly=ys[ys.length-1];
  return`<svg width="${W}" height="${H}" style="overflow:visible">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle class="blink-dot" cx="${lx}" cy="${ly}" r="2.5" fill="${col}"/>
  </svg>`;
}
function shortETFName(n){
  return n.replace("KODEX ","").replace("TIGER ","").replace("HANARO ","")
          .replace("액티브","").replace("iSelect","").trim();
}
const _ETF_CACHE_KEY="etf_cache_v2";
const _ETF_CACHE_TTL=300000;

function _renderEtfBar(etfs){
  if(!Array.isArray(etfs)||etfs.length===0)return;
  document.getElementById("etf-bar").innerHTML=etfs.map(e=>{
    const rc=e.change_rate>0?"up":e.change_rate<0?"dn":"neu";
    const rs=(e.change_rate>0?"+":"")+(e.change_rate||0).toFixed(2)+"%";
    return`<div class="etf-chip">
      <span class="etf-name">${esc(shortETFName(e.name))}</span>
      <span class="etf-rate ${rc}">${rs}</span>
      ${sparkline(e.bars,e.change_rate)}
    </div>`;
  }).join("");
}
async function loadEtfBar(){
  // B: localStorage 캐시 즉시 표시
  try{
    const raw=localStorage.getItem(_ETF_CACHE_KEY);
    if(raw){const {ts,data}=JSON.parse(raw);if(Date.now()-ts<_ETF_CACHE_TTL){_renderEtfBar(data);}}
  }catch(_){}
  try{
    const r=await fetch("/api/etf_bar");
    const etfs=await r.json();
    _renderEtfBar(etfs);
    try{localStorage.setItem(_ETF_CACHE_KEY,JSON.stringify({ts:Date.now(),data:etfs}));}catch(_){}
  }catch(e){
    document.getElementById("etf-bar").innerHTML=
      `<span style="color:#555;font-size:12px;padding:12px 0;display:inline-block;">ETF 바 오류: ${esc(e.message)}</span>`;
  }
}

function fmtAuk(v){
  // v 단위: 백만원 → 억원 표시
  const bok=v/100;  // 100백만=1억
  const abs=Math.abs(bok);
  if(abs>=10000) return (bok/10000).toFixed(1)+"조";
  if(abs>=1000)  return Math.round(bok/100)*100+"억";
  if(abs>=100)   return Math.round(bok/10)*10+"억";
  if(abs>=1)     return Math.round(bok)+"억";
  return Math.round(v)+"백만";
}

function miniLine(bars, rate, w, h){
  w=w||240; h=h||42;
  if(!bars||bars.length<2){
    return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;width:100%;height:${h}px">
      <text x="${w/2}" y="${h/2+4}" fill="#333" font-size="10" text-anchor="middle">장 외 시간</text>
    </svg>`;
  }
  const mn=Math.min(...bars),mx=Math.max(...bars),range=mx-mn||1;
  const xs=bars.map((_,i)=>Math.round(2+i*(w-4)/(bars.length-1)));
  const ys=bars.map(v=>Math.round(2+(1-((v-mn)/range))*(h-4)));
  const pts=xs.map((x,i)=>`${x},${ys[i]}`).join(" ");
  const col=rate>0?"#e74c3c":rate<0?"#3498db":"#666";
  const fillPts=`${xs[0]},${h} ${pts} ${xs[xs.length-1]},${h}`;
  return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;width:100%;height:${h}px;border-radius:4px;overflow:hidden">
    <polygon points="${fillPts}" fill="${col}" opacity="0.07"/>
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>
  </svg>`;
}

function divBar(val, maxAbs){
  const pct=maxAbs>0?Math.min(97,Math.abs(val)/maxAbs*100):0;
  const isUp=val>0;
  const negW=isUp?0:pct, posW=isUp?pct:0;
  return`<div class="div-bar">
    <div class="div-neg"><div class="div-neg-fill" style="width:${negW}%;background:#3498db"></div></div>
    <div style="width:1px;background:#333;flex-shrink:0"></div>
    <div class="div-pos"><div class="div-pos-fill" style="width:${posW}%;background:#e74c3c"></div></div>
  </div>`;
}

function invHistoryChart(history, w, h){
  if(!history||history.length<1) return "";
  if(history.length===1) history=[history[0],history[0]]; // 단일 포인트 → 수평선
  w=w||240; h=h||44;
  const keys=["외인","기관","개인"];
  const cols={"외인":"#e8a030","기관":"#2ecc71","개인":"#888"};
  const lines=keys.map(key=>{
    const vals=history.map(r=>Number(r[key]||0));
    const mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
    const xs=vals.map((_,i)=>Math.round(2+i*(w-4)/(vals.length-1)));
    const ys=vals.map(v=>Math.round(2+(1-((v-mn)/range))*(h-4)));
    const pts=xs.map((x,i)=>`${x},${ys[i]}`).join(" ");
    return`<polyline points="${pts}" fill="none" stroke="${cols[key]}" stroke-width="1.4" opacity=".9"/>`;
  }).join("");
  // 레전드는 SVG 밖 HTML로 (SVG stretch 시 텍스트 찌그러짐 방지)
  const legendHtml=keys.map(k=>`<span style="display:inline-flex;align-items:center;gap:3px">
    <span style="display:inline-block;width:10px;height:2px;background:${cols[k]};border-radius:1px;vertical-align:middle"></span>
    <span style="font-size:9px;color:${cols[k]}">${k}</span>
  </span>`).join("");
  return`<div>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;width:100%;height:${h}px">
      <rect width="${w}" height="${h}" fill="#0e0e0e" rx="3"/>
      ${lines}
    </svg>
    <div style="display:flex;gap:10px;margin-top:3px">${legendHtml}</div>
  </div>`;
}

function _makeSampleHistory(initVals, trends, n=14){
  // initVals: {외인,기관,개인} or {합계,차익,비차익}
  // trends: 각 키 per-step 증분 범위 [min,max]
  const keys=Object.keys(initVals);
  const result=[];
  const cur={...initVals};
  const times=[];
  for(let h=9,m=30;times.length<n;){m+=15;if(m>=60){m-=60;h++;}times.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`)}
  for(let i=0;i<n;i++){
    const snap={ts:times[i]};
    keys.forEach(k=>{
      const [lo,hi]=trends[k];
      cur[k]+=Math.round(lo+(hi-lo)*Math.random());
      snap[k]=cur[k];
    });
    result.push(snap);
  }
  return result;
}

function loadMarketFlowSample(){
  // 코스피 시나리오: 외인 강매수, 기관 약매도, 개인 매도 / 프로그램 매도 누적
  const kosp_inv_hist=_makeSampleHistory(
    {외인:20000,기관:-5000,개인:-15000},
    {외인:[8000,15000],기관:[-6000,2000],개인:[-5000,1000]}
  );
  const kosp_prog_hist=_makeSampleHistory(
    {합계:-8000,차익:-3000,비차익:-5000},
    {합계:[-5000,-500],차익:[-2000,500],비차익:[-3000,-200]}
  );
  const last_kosp=kosp_inv_hist[kosp_inv_hist.length-1];
  const last_kosp_prog=kosp_prog_hist[kosp_prog_hist.length-1];

  // 코스닥 시나리오: 외인 매도, 기관 약매수, 개인 매수 / 프로그램 매수 전환
  const kosq_inv_hist=_makeSampleHistory(
    {외인:-5000,기관:2000,개인:3000},
    {외인:[-4000,1000],기관:[-1000,3000],개인:[500,3000]}
  );
  const kosq_prog_hist=_makeSampleHistory(
    {합계:2000,차익:500,비차익:1500},
    {합계:[300,2000],차익:[100,800],비차익:[200,1200]}
  );
  const last_kosq=kosq_inv_hist[kosq_inv_hist.length-1];
  const last_kosq_prog=kosq_prog_hist[kosq_prog_hist.length-1];

  // 지수 15분봉 (26봉, 09:00~15:30)
  function makeBars(start, end, n=26){
    const bars=[start];
    const step=(end-start)/n;
    for(let i=1;i<n;i++){
      const prev=bars[bars.length-1];
      bars.push(Math.round((prev+step+(Math.random()-0.45)*Math.abs(step)*4)*100)/100);
    }
    return bars;
  }

  const sample={
    "0001":{
      label:"코스피",price:2848.11,change_rate:1.23,
      bars:makeBars(2814,2848),
      investor_now:{...last_kosp},
      investor_history:kosp_inv_hist,
      program_now:{...last_kosp_prog},
      program_history:kosp_prog_hist,
    },
    "1001":{
      label:"코스닥",price:723.45,change_rate:-0.47,
      bars:makeBars(730,723),
      investor_now:{...last_kosq},
      investor_history:kosq_inv_hist,
      program_now:{...last_kosq_prog},
      program_history:kosq_prog_hist,
    },
    "global":{
      label:"글로벌 지표",
      items:[
        {name:"미국선물(SPY)",  price:587.32,  change_rate:0.34,  bars:makeBars(575,587)},
        {name:"코스피선물", price:365.45,  change_rate:1.15,  bars:makeBars(356,365)},
        {name:"원달러환율",     price:1384.50, change_rate:-0.12, bars:[]},
        {name:"국제유가(WTI)", price:78.42,   change_rate:0.89,  bars:[]},
      ],
    },
    "rank_popular":{label:"실시간 인기검색",stocks:[{rank:1,name:"삼성전자",price:80400,change_rate:1.52}]},
    "rank_amt":{label:"거래대금 상위",    stocks:[{rank:1,name:"SK하이닉스",price:198500,change_rate:2.35}]},
  };
  renderMarketFlow(sample);
}

const ETF_KEYWORDS=["KODEX","TIGER","KINDEX","SOL","ARIRANG","HANARO","ACE","PLUS","KBSTAR","TIMEFOLIO","KOSEF","TREX","RISE","ETN","인버스","레버리지","선물인버스","선물레버리지"];
let _rankPopStocks=[];
let _rankAmtStocks=[];
let _rankEtfFilter=true;
let _rankPopN=5;
let _rankAmtN=5;

function _filterRank(stocks){
  return _rankEtfFilter
    ?stocks.filter(s=>!ETF_KEYWORDS.some(k=>s.name.toUpperCase().includes(k.toUpperCase())))
    :stocks;
}

function _rankRows(stocks, maxN){
  return _filterRank(stocks).slice(0,maxN).map((s,i)=>{
    const rc=s.change_rate>0?"up":s.change_rate<0?"dn":"neu";
    const rs=(s.change_rate>0?"+":"")+Number(s.change_rate).toFixed(2)+"%";
    const ps=Math.abs(Number(s.price)).toLocaleString("ko-KR");
    return`<div class="us-row">
      <div style="display:flex;align-items:center;gap:6px">
        <span style="font-size:10px;color:#444;min-width:14px;text-align:right">${i+1}</span>
        <span class="us-sym">${esc(s.name)}</span>
      </div>
      <div class="us-vals">
        <span class="us-price">${ps}</span>
        <span class="us-rate ${rc}">${rs}</span>
      </div>
    </div>`;
  }).join("");
}

function _reRenderRankCard(){
  const btn=document.getElementById("etf-toggle");
  if(btn) btn.closest(".mkt-card").outerHTML=renderRankCard();
}

function rankWheel(e, type){
  e.preventDefault();
  const delta=e.deltaY>0?5:-5;
  if(type==="pop") _rankPopN=Math.min(20,Math.max(5,_rankPopN+delta));
  else             _rankAmtN=Math.min(20,Math.max(5,_rankAmtN+delta));
  _reRenderRankCard();
}

function renderRankCard(){
  const on=_rankEtfFilter;
  const btnStyle=on
    ?"background:rgba(212,175,55,.25);color:var(--gold);border:1px solid rgba(212,175,55,.5)"
    :"background:rgba(255,255,255,.05);color:#555;border:1px solid #333";
  const btnLabel=on?"ETF·ETN 제외중":"ETF·ETN 포함";
  const wheelHint="font-size:9px;color:#333;margin-left:4px";
  const secLabel=(icon,label,n,type)=>`
    <div onwheel="rankWheel(event,'${type}')"
         style="display:flex;align-items:center;font-size:10px;font-weight:600;color:#666;
                letter-spacing:0.3px;margin:6px 0 3px;border-top:1px solid #1c1c1c;
                padding-top:5px;cursor:ns-resize;user-select:none"
         title="휠로 개수 조절 (5~20)">
      <span style="flex:1">${icon} ${label} ${n}</span>
      <span style="${wheelHint}">↕</span>
    </div>`;
  return`<div class="mkt-card">
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:2px">
      <span style="font-size:11px;font-weight:700;color:#aaa;letter-spacing:0.3px;flex:1">순위</span>
      <button id="etf-toggle" onclick="toggleEtfFilter()" style="font-size:10px;padding:2px 7px;border-radius:10px;cursor:pointer;font-family:inherit;${btnStyle}">${btnLabel}</button>
    </div>
    ${secLabel("🔥","실시간 인기검색",_rankPopN,"pop")}
    ${_rankRows(_rankPopStocks,_rankPopN)}
    ${secLabel("💰","거래대금 상위",_rankAmtN,"amt")}
    ${_rankRows(_rankAmtStocks,_rankAmtN)}
  </div>`;
}

function toggleEtfFilter(){
  _rankEtfFilter=!_rankEtfFilter;
  _reRenderRankCard();
}

function renderMarketFlow(d){
  try{
    const panel=document.getElementById("mkt-panel");
    panel.innerHTML=["0001","1001","global","rank_popular"].map(code=>{
      const m=d[code]; if(!m)return"";

      // ── 글로벌 지표 카드 ──
      if(code==="global"){
        // 차트 있는 항목(선물)은 flex:3, 숫자만(환율/유가)은 flex:1.5
        const total=m.items?.length||4;
        const rows=(m.items||[]).map((it,idx)=>{
          const noData=(!it.price&&!it.change_rate);
          const rc=noData?"neu":it.change_rate>0?"up":it.change_rate<0?"dn":"neu";
          const rs=noData?"—":(it.change_rate>0?"▲ +":it.change_rate<0?"▼ ":"")+Number(it.change_rate).toFixed(2)+"%";
          const ps=noData?"—":Number(it.price).toLocaleString("ko-KR",{maximumFractionDigits:2});
          const hasChart=it.bars&&it.bars.length>=2;
          const borderB=idx<total-1?"border-bottom:1px solid #1a1a1a;":"";
          if(hasChart){
            const svgLine=(()=>{
              const bars=it.bars; const rate=it.change_rate;
              const W=240,H=32;
              const vals=bars.map(b=>typeof b==="number"?b:(b.close||b.price||0));
              const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
              const pts=vals.map((v,i)=>`${Math.round(i/(vals.length-1)*(W-2)+1)},${Math.round((1-(v-mn)/rng)*(H-4)+2)}`).join(" ");
              const col=rate>0?"var(--up1)":rate<0?"var(--dn1)":"#888";
              return`<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;width:100%;height:${H}px;overflow:visible">
                <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/>
              </svg>`;
            })();
            return`<div style="flex:3;min-height:0;display:flex;flex-direction:column;${borderB}padding:4px 0 3px;">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px">
                <span class="global-name">${esc(it.name)}</span>
                <div style="text-align:right"><div class="global-price">${ps}</div><div class="global-rate ${rc}">${rs}</div></div>
              </div>
              <div style="flex:1;min-height:0">${svgLine}</div>
            </div>`;
          } else {
            return`<div style="flex:1.5;min-height:0;display:flex;align-items:center;justify-content:space-between;${borderB}padding:3px 0;">
              <span class="global-name">${esc(it.name)}</span>
              <div style="text-align:right"><div class="global-price">${ps}</div><div class="global-rate ${rc}">${rs}</div></div>
            </div>`;
          }
        }).join("");
        return`<div class="mkt-card">
          <div style="font-size:11px;font-weight:700;color:#aaa;margin-bottom:4px;letter-spacing:0.3px">글로벌 지표</div>
          <div style="flex:1;min-height:0;display:flex;flex-direction:column">${rows}</div>
        </div>`;
      }

      // ── 순위 카드 (인기검색 + 거래대금) ──
      if(code==="rank_popular"){
        _rankPopStocks=m.stocks||[];
        _rankAmtStocks=(d["rank_amt"]||{}).stocks||[];
        return renderRankCard();
      }

      // ── 코스피 / 코스닥 풀 카드 ──
      const noIndex=(!m.price);
      const rc=noIndex?"neu":m.change_rate>0?"up":m.change_rate<0?"dn":"neu";
      const rateStr=noIndex?"—":(m.change_rate>0?"▲ +":m.change_rate<0?"▼ ":"")
                   +Number(m.change_rate).toFixed(2)+"%";
      const priceStr=noIndex?"—":Number(m.price).toLocaleString("ko-KR",{maximumFractionDigits:2});

      const barSection=`<div>
        <div class="mkt-sec-label">15분봉</div>
        ${miniLine(m.bars,m.change_rate,240,70)}
      </div>`;

      // 코스피 / 코스닥 — 풀 카드
      const inv=m.investor_now||{외인:0,기관:0,개인:0};
      const invAllZero=!inv.외인&&!inv.기관&&!inv.개인;
      const maxAbs=Math.max(1,Math.abs(inv.외인),Math.abs(inv.기관),Math.abs(inv.개인));
      const invRows=["외인","기관","개인"].map(k=>{
          const v=inv[k]||0;
          const vc=invAllZero?"neu":(v>0?"up":v<0?"dn":"neu");
          const vs=invAllZero?"—":(v>0?"+":"")+fmtAuk(v);
          return`<span class="inv-lbl">${k}</span>
                 ${invAllZero?`<span style="flex:1"></span>`:divBar(v,maxAbs)}
                 <span class="inv-num ${vc}">${vs}</span>`;
        }).join("")
        +(invAllZero?`<span style="font-size:9px;color:#333;display:block;margin-top:2px">KIS API 미구독</span>`:"");

      const hist=m.investor_history||[];
      const histSvg=hist.length>=1?`
        <div class="mkt-sec-label" style="margin-top:2px">누적 추이 (외인/기관/개인)</div>
        ${invHistoryChart(hist,240,80)}`:"";

      const prog=m.program_now||{합계:0,차익:0,비차익:0};
      const progAllZero=!prog.합계&&!prog.차익&&!prog.비차익;
      const pc=prog.합계>0?"up":prog.합계<0?"dn":"neu";
      const ps=progAllZero?"—":(prog.합계>0?"+":"")+fmtAuk(prog.합계);
      const ts=m.investor_now?.ts||"—";

      // 프로그램 차트: program_series(ka90005 시간대별) — 합계 라인만
      const progSeries=m.program_series||[];
      const progHist=m.program_history||[];
      let progSource=progSeries.length>=1?progSeries:progHist;
      if(progSource.length===1) progSource=[progSource[0],progSource[0]];
      let progChart="";
      if(progSource.length>=2){
        const W=240,H=80;
        const vals=progSource.map(r=>Number(r["합계"]||0));
        const mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
        const xs=progSource.map((_,i)=>Math.round(2+i*(W-4)/(progSource.length-1)));
        const ys=vals.map(v=>Math.round(2+(1-((v-mn)/range))*(H-4)));
        const pts=xs.map((x,i)=>`${x},${ys[i]}`).join(" ");
        const col=prog.합계>=0?"#e74c3c":"#3498db";
        const zeroY=Math.round(2+(1-((0-mn)/range))*(H-4));
        const zeroLine=zeroY>=2&&zeroY<=H-2
          ?`<line x1="0" y1="${zeroY}" x2="${W}" y2="${zeroY}" stroke="#333" stroke-width="1" stroke-dasharray="3,3"/>`:"";
        const latestT=progSeries.length>=2?(progSeries[progSeries.length-1].t||"").replace(/(\d{2})(\d{2}).*/,"$1:$2"):"";
        progChart=`
          <div class="mkt-sec-label" style="margin-top:2px;display:flex;justify-content:space-between;align-items:center">
            <span>프로그램 순매수${latestT?" ("+latestT+"기준)":""}</span>
            <span style="color:${col};font-weight:700">${ps}</span>
          </div>
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;width:100%;height:${H}px;border-radius:4px;overflow:hidden">
            <rect width="${W}" height="${H}" fill="#0e0e0e" rx="3"/>
            ${zeroLine}
            <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
          </svg>`;
      }

      return`<div class="mkt-card">
        <div class="mkt-hdr">
          <span class="mkt-name">${esc(m.label)}</span>
          <span class="mkt-price">${priceStr}</span>
          <span class="mkt-rate ${rc}">${rateStr}</span>
        </div>
        ${barSection}
        <div>
          <div class="mkt-sec-label">투자자 순매수 (오늘 누적)</div>
          <div class="inv-grid">${invRows}</div>
          ${histSvg}
        </div>
        <div>
          <div class="mkt-sec-label">프로그램 순매수</div>
          ${progChart}
        </div>
        <div class="mkt-ts">${ts} 기준</div>
      </div>`;
    }).join("");
  // 렌더 후 높이 균일화: 4번(순위) 자연 높이 기준 → 나머지 space-between으로 채움
  requestAnimationFrame(()=>{
    const cards=[...document.querySelectorAll('#mkt-panel .mkt-card')];
    if(cards.length<4) return;
    cards.forEach(c=>{ c.style.height=''; c.style.overflowY=''; c.style.justifyContent=''; });
    const refH=Math.max(cards[2].offsetHeight, cards[3].offsetHeight);
    cards.forEach((c,i)=>{
      const nat=c.offsetHeight;
      c.style.height=refH+'px';
      if(i<2){
        if(nat>refH) c.style.overflowY='auto';       // 내용이 넘치면 스크롤
        else c.style.justifyContent='space-between';  // 짧으면 균등 분산
      } else {
        c.style.justifyContent='space-between';
      }
    });
  });
  }catch(e){
    console.error("market_flow 오류",e);
  }
}

// 세부 탭 백그라운드 프리패치 (전체 로드 완료 후 순차 실행)
async function prefetchTabs(){
  const ids=Object.keys(TAB_LABELS);
  for(const id of ids){
    if(_fromCache(id)) continue;          // 이미 캐시됨
    if(activeTab===id) continue;          // 현재 보고 있는 탭은 건너뜀 (이미 로딩 중)
    try{
      const r=await fetch(`/api/heatmap_tab?id=${id}`);
      if(r.ok){
        const data=await r.json();
        if(data&&!data.error) _toCache(id,data);
      }
    }catch(e){}
    // 탭 하나 완료 후 잠깐 대기 (KIS API 부하 분산)
    await new Promise(r=>setTimeout(r,300));
  }
}

  document.getElementById("snap-date").textContent="";
  const grid=document.getElementById("grid");
  grid.innerHTML='<div class="loading">⚙️ 편집 설정 불러오는 중…</div>';
  grid.style.display="block";
  try{
    const [resp, nr]=await Promise.all([
      fetch("/api/sector_custom"),
      fetch("/api/sector_names"),

        <select class="sector-select" onchange="selectEditSector(this.value)">

          <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px">
            <label class="edit-label" style="margin:0">등록 종목</label>
            <span style="font-size:10px;color:#555">흰색=기본 / 금색=추가</span>
          </div>
          <div class="tag-row" id="stock-manage-row">${stocksHtml}</div>
          <label class="edit-label">종목 추가 검색</label>
          <div class="autocomplete-wrap">

                   oninput="searchStock(this.value,'extra-stock-list','extra')" autocomplete="off">

function filterSectorList(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll(".sector-item").forEach(el=>{
    const lbl=el.querySelector("label");
    el.style.display=(!q||lbl.textContent.toLowerCase().includes(q))?"":"none";
  });
}

function toggleHideSector(cb,name){
  const h=_editState.hidden_sectors||[];
  const idx=h.indexOf(name);
  if(cb.checked){ if(idx<0)h.push(name); }
  else { if(idx>=0)h.splice(idx,1); }
  _editState.hidden_sectors=h;
  const item=cb.closest(".sector-item");
  if(item)item.classList.toggle("hidden",cb.checked);
}

async function selectEditSector(name){
  _editSector=name;
  _editSectorStocks={base:[],extra:[],removed:[]};
  if(name){
    try{
      const r=await fetch(`/api/sector_stocks?sector=${encodeURIComponent(name)}`);
      const d=await r.json();
      _editSectorStocks={base:d.base||[],extra:d.extra||[],removed:d.removed||[]};
    }catch(e){}
  }
  renderEditUI();
}

function _refreshStockManageRow(){
  const row=document.getElementById("stock-manage-row");
  if(!row)return;
  const removedSet=new Set((_editState.removed_stocks||{})[_editSector]||[]);
  const html=[
    ..._editSectorStocks.base.filter(s=>!removedSet.has(s.code)).map(s=>
      `<span class="tag" style="background:rgba(255,255,255,.06);border-color:#333">${esc(s.name)}<span class="x" onclick="removeBaseStock('${esc(_editSector)}','${esc(s.code)}')">×</span></span>`
    ),
    ...(_editSectorStocks.extra||[]).map(s=>
      `<span class="tag">${esc(s.name)}<span class="x" onclick="removeExtraStock('${esc(_editSector)}','${esc(s.code)}')">×</span></span>`
    ),
  ].join("")||'<span style="font-size:11px;color:#444">종목 없음</span>';
  row.innerHTML=html;
}

function removeBaseStock(sector,code){
  const rm=_editState.removed_stocks||{};
  if(!rm[sector])rm[sector]=[];
  if(!rm[sector].includes(code))rm[sector].push(code);
  _editState.removed_stocks=rm;
  _refreshStockManageRow();
}

function removeExtraStock(sector,code){
  const ex=_editState.extra_stocks||{};
  if(!ex[sector])return;
  ex[sector]=ex[sector].filter(s=>s.code!==code);
  if(!ex[sector].length)delete ex[sector];
  _editState.extra_stocks=ex;
  _editSectorStocks.extra=(_editSectorStocks.extra||[]).filter(s=>s.code!==code);
  _refreshStockManageRow();
}

function addExtraStock(name,code){
  if(!_editSector)return;
  const ex=_editState.extra_stocks||{};
  if(!ex[_editSector])ex[_editSector]=[];
  if(!ex[_editSector].find(s=>s.code===code)){
    ex[_editSector].push({name,code});
    _editSectorStocks.extra=ex[_editSector];
  }
  _editState.extra_stocks=ex;
  const inp=document.getElementById("extra-stock-input");
  if(inp)inp.value="";
  const lst=document.getElementById("extra-stock-list");
  if(lst)lst.style.display="none";
  _refreshStockManageRow();
}

function addNewCtStock(name,code){
  if(!_newCtStocks.find(s=>s.code===code))_newCtStocks.push({name,code});
  const inp=document.getElementById("new-ct-input");
  if(inp)inp.value="";
  const lst=document.getElementById("new-ct-list");
  if(lst)lst.style.display="none";
  _renderNewCtTags();
}

function removeNewCtStock(code){
  _newCtStocks=_newCtStocks.filter(s=>s.code!==code);
  _renderNewCtTags();
}

function _renderNewCtTags(){
  const row=document.getElementById("new-ct-tags");
  if(!row)return;
  row.innerHTML=_newCtStocks.map(s=>`<span class="tag">${esc(s.name)}<span class="x" onclick="removeNewCtStock('${esc(s.code)}')">×</span></span>`).join("");
}

function addCustomTile(){
  const nameEl=document.getElementById("new-ct-name");
  const name=(nameEl?nameEl.value:"").trim();
  if(!name){showToast("섹터 이름을 입력하세요","err");return;}
  if(!_newCtStocks.length){showToast("종목을 하나 이상 추가하세요","err");return;}
  const ct=_editState.custom_tiles||[];
  if(ct.find(c=>c.name===name)){showToast("이미 존재하는 섹터 이름입니다","err");return;}
  ct.push({name,stocks:[..._newCtStocks]});
  _editState.custom_tiles=ct;
  _newCtStocks=[];
  renderEditUI();
}

function deleteCustomTile(idx){
  const ct=_editState.custom_tiles||[];
  ct.splice(idx,1);
  _editState.custom_tiles=ct;
  renderEditUI();
}

function searchStock(q,listId,target){
  clearTimeout(_stockSearchTimer);
  const lst=document.getElementById(listId);
  if(!q.trim()){if(lst)lst.style.display="none";return;}
  _stockSearchTimer=setTimeout(async()=>{
    try{
      const r=await fetch(`/api/stock_search?q=${encodeURIComponent(q.trim())}`);
      const res=await r.json();
      const el=document.getElementById(listId);
      if(!el)return;
      if(!res.length){el.style.display="none";return;}
      el.innerHTML=res.map(s=>`<div class="autocomplete-item"
        onclick="handleStockSelect('${target}','${esc(s.name)}','${esc(s.code)}')">${esc(s.name)}
        <span style="color:#555;font-size:10px;margin-left:4px">${s.code}</span></div>`).join("");
      el.style.display="block";
    }catch(e){}
  },250);
}

function handleStockSelect(target,name,code){
  if(target==="extra")addExtraStock(name,code);
  else addNewCtStock(name,code);
  // 자동완성 리스트 닫기
  const listId=target==="extra"?"extra-stock-list":"new-ct-list";
  const el=document.getElementById(listId);
  if(el)el.style.display="none";
}

async function saveEdit(){
  const btn=document.getElementById("edit-save-btn");
  if(btn){btn.disabled=true;btn.textContent="저장 중…";}
  try{
    const r=await fetch("/api/sector_custom",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(_editState),
    });
    const res=await r.json();
    if(res.ok){
      // 클라이언트 히트맵 캐시 초기화
      Object.keys(_tabCache).forEach(k=>delete _tabCache[k]);
      showToast("✅ 저장 완료. 다음 로드 시 적용됩니다");
    } else {
      showToast("❌ 저장 실패: "+(res.error||"오류"),"err");
    }
  }catch(e){
    showToast("❌ 저장 실패: "+e.message,"err");
  }finally{
    if(btn){btn.disabled=false;btn.textContent="💾 저장";}
  }
}

async function resetEditState(){
  _editState={hidden_sectors:[],extra_stocks:{},removed_stocks:{},custom_tiles:[]};
  _editSector="";
  _editSectorStocks={base:[],extra:[],removed:[]};
  _newCtStocks=[];
  await saveEdit();
  renderEditUI();
}

function showToast(msg,type="ok"){
  let el=document.getElementById("toast");
  if(!el){el=document.createElement("div");el.id="toast";document.body.appendChild(el);}
  el.textContent=msg;
  const isOk=type==="ok";
  el.style.cssText=`position:fixed;bottom:24px;right:24px;padding:10px 18px;border-radius:10px;
    font-size:13px;z-index:9999;pointer-events:none;opacity:1;transition:opacity .4s;
    background:${isOk?"#1a3a1a":"#3a1a1a"};color:${isOk?"#4ade80":"#f87171"};
    border:1px solid ${isOk?"#166534":"#991b1b"}`;
  clearTimeout(el._timer);
  el._timer=setTimeout(()=>{el.style.opacity="0";},2800);
}

async function initLoad(){
  await loadOverview();
  prefetchTabs();
}

initLoad();
loadEtfBar();
loadMarketFlowSample();   // 즉시 샘플 표시 (빈화면 방지)
loadMarketFlow();          // 실제 API 데이터로 즉시 교체
setInterval(loadEtfBar,   600000);
setInterval(loadMarketFlow,900000);
</script>
