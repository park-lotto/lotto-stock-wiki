<script>
const {Scene,person,robot,smooth,ell,cloud,poly,rr,ln,pl,tube,mk,INK,ORG,SKIN,SHIRT,HAIR,BEIGE,SKY,PINK,eo,seg,clamp,qo,J,f} = HQ;
document.fonts.load('40px "NP"').then(()=>document.fonts.load('40px "GB"')).then(()=>document.fonts.load('800 40px "PB"')).then(()=>document.fonts.ready).then(()=>{
const S = new Scene(14.2);
// 4회차 장면 s07 — 전부 클로드가 만든 영상 (14.2초) · 문장 시각 = py ink/times.py s07 · 칸 속 실제 영상 = tiles.json(ov.py)
// 0.35 전부 클로드가 만든 영상 / 3.73 스타일이 다 다르죠 / 5.24 스타일 고르고 → 만들어 달라 → 원본은 클로드가 → 그 채널 방식대로 (★확인 안 된 대사: 고르는 실제 방식)
const Y = "#F4E28A", CL = "#D97757";
function phone(L, x, y, w, h, t) { const fr = rr(x - 16, y - 16, w + 32, h + 32, 30); L.fill(fr, "#1F1D1A", t, 0.9, 0.2); L.line(fr, t, 0.4, { w: 8 }); }
// ===== 컷1 영상 넷 (−1 ~ 5.24) =====
const c1 = cutL(S, -1, 5.24);
c1.text("전부 클로드가 만든 영상", { x: 960, y: 140, size: 110, s: 0.35, gap: 0.05, anchor: "c" });
[[150, 0.4], [600, 0.6], [1050, 0.8], [1500, 1.0]].forEach(([x, t]) => phone(c1, x, 250, 300, 533, t));
const df = c1.text("스타일이 다 다르다", { x: 960, y: 960, size: 110, s: 3.75, gap: 0.05, anchor: "c", c: "#D9622B" });
c1.underline(df.box(0, 2), 4.6, 0.3);
// ===== 컷2 고르고 → 만들어 달라 → 원본 찾아옴 → 그 방식대로 (5.24 ~) =====
const c2 = cutL(S, 5.24, 1e9);
[["스타일 고르기", 5.3, Y], ["“이 스타일로 만들어 줘”", 7.2, "#FFFFFF"], ["원본은 클로드가 찾아옴", 9.1, SKY], ["후킹·흐름은 그 채널 방식대로", 11.0, PINK]].forEach(([s, t, col], i) => {
  const y = 150 + i * 205, b = rr(100, y, 1060, 160, 22);
  c2.fill(b, col, t, 0.6, 0.2); c2.line(b, t, 0.4, { w: 7 });
  c2.text(s, { x: 630, y: y + 105, size: 84, s: t + 0.15, gap: 0.04, anchor: "c" });
  if (i < 3) c2.line(pl([[630, y + 165], [630, y + 200]]), t + 1.2, 0.15, { w: 7 });
});
phone(c2, 1390, 220, 360, 640, 12.2);
c2.text("쇼츠 완성", { x: 1570, y: 1000, size: 96, s: 12.5, gap: 0.05, anchor: "c", c: CL });

S.start();
});
