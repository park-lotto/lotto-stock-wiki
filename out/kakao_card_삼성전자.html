<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');
  @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@900&display=swap');
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    width: 1080px; height: 1080px;
    background: radial-gradient(ellipse at top right, #102530 0%, #0a0f14 50%, #050a0e 100%);
    color: #e8f4f1;
    font-family: 'Pretendard', 'Noto Sans KR', sans-serif;
    font-weight: 700;
    overflow: hidden;
    position: relative;
    -webkit-font-smoothing: antialiased;
  }
  .glow-mint {
    position: absolute; top: -150px; right: -150px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(94,234,212,0.22) 0%, transparent 65%);
    filter: blur(20px);
  }
  .glow-amber {
    position: absolute; bottom: -150px; left: -150px;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(251,191,36,0.12) 0%, transparent 65%);
    filter: blur(20px);
  }
  .card {
    padding: 64px 70px;
    position: relative; z-index: 2;
    height: 100%;
    display: flex; flex-direction: column;
  }

  /* HEADER */
  .header {
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 42px;
  }
  .tag {
    display: inline-flex; align-items: center; gap: 10px;
    padding: 14px 30px;
    background: linear-gradient(90deg, #dc2626, #ef4444);
    color: #fff; border-radius: 999px;
    font-size: 26px; font-weight: 900; letter-spacing: 0.5px;
    box-shadow: 0 12px 36px rgba(220,38,38,0.4);
  }
  .brand {
    font-size: 20px; color: #5eead4; letter-spacing: 4px; font-weight: 900;
    opacity: 0.7;
  }

  /* NAME */
  .name {
    font-size: 145px; font-weight: 900;
    background: linear-gradient(135deg, #5eead4 0%, #38bdf8 50%, #818cf8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    letter-spacing: -5px;
    line-height: 1;
    filter: drop-shadow(0 8px 30px rgba(94,234,212,0.35));
  }
  .meta-row {
    margin-top: 16px;
    display: flex; align-items: center; gap: 16px;
  }
  .code { font-size: 36px; color: #94a3b8; font-weight: 800; letter-spacing: 2px; }
  .sector {
    font-size: 24px; color: #5eead4; font-weight: 800;
    padding: 6px 18px;
    background: rgba(94,234,212,0.1);
    border-radius: 999px;
    border: 1px solid rgba(94,234,212,0.3);
  }

  /* SCORE */
  .score-block {
    margin-top: 42px;
    padding: 36px 42px;
    background: linear-gradient(135deg, rgba(94,234,212,0.08) 0%, rgba(251,191,36,0.05) 100%);
    border: 2px solid rgba(94,234,212,0.25);
    border-radius: 26px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .score-num {
    font-size: 130px; font-weight: 900; color: #fbbf24;
    letter-spacing: -3px; line-height: 0.9;
    text-shadow: 0 0 60px rgba(251,191,36,0.4);
  }
  .score-num small { font-size: 58px; opacity: 0.5; }
  .score-meta { text-align: right; }
  .score-meta .lab { font-size: 22px; color: #94a3b8; font-weight: 800; letter-spacing: 1px; }
  .score-meta .val { font-size: 38px; color: #5eead4; font-weight: 900; margin-top: 8px; }

  /* CONSENSUS TOP3 */
  .consensus {
    margin-top: 40px;
    padding: 32px 36px;
    background: rgba(15,24,32,0.6);
    border-radius: 24px;
    border: 1px solid rgba(94,234,212,0.15);
  }
  .consensus-title {
    font-size: 22px; color: #94a3b8; font-weight: 900;
    letter-spacing: 3px;
    margin-bottom: 22px;
  }
  .crow {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 0;
    border-bottom: 1px dashed rgba(94,234,212,0.1);
    font-size: 32px;
  }
  .crow:last-child { border-bottom: none; }
  .rank {
    display: inline-block;
    width: 32px; height: 32px; border-radius: 50%;
    background: linear-gradient(135deg, #fbbf24, #f59e0b);
    color: #0a0f14; font-size: 18px; font-weight: 900;
    text-align: center; line-height: 32px;
    margin-right: 14px;
  }
  .firm { color: #cbd5e1; font-weight: 800; }
  .tp { color: #5eead4; font-weight: 900; }
  .tp-up { color: #fbbf24; font-weight: 900; font-size: 22px; margin-left: 12px; }

  /* FOOTER */
  .footer {
    margin-top: auto;
    text-align: center;
    font-size: 20px; color: #475569;
    letter-spacing: 4px;
    font-weight: 800;
    padding-top: 28px;
    border-top: 1px solid rgba(94,234,212,0.08);
  }
</style>
</head>
<body>
<div class="glow-mint"></div>
<div class="glow-amber"></div>
<div class="card">

  <div class="header">
    <span class="tag">🔴 오늘의 탑픽</span>
    <span class="brand">STOCK BRAIN</span>
  </div>

  <div class="name">삼성전자</div>
  <div class="meta-row">
    <span class="code">005930</span>
    <span class="sector">반도체 #1</span>
  </div>

  <div class="score-block">
    <div class="score-num">8<small>/9</small></div>
    <div class="score-meta">
      <div class="lab">탑픽 스코어</div>
      <div class="val">TP 39~55만원</div>
    </div>
  </div>

  <div class="consensus">
    <div class="consensus-title">증권사 컨센서스 TOP 3</div>
    <div class="crow"><span><span class="rank">1</span><span class="firm">미래에셋</span></span><span><span class="tp">550,000원</span><span class="tp-up">↑+14.6%</span></span></div>
    <div class="crow"><span><span class="rank">2</span><span class="firm">SK · 전진투자</span></span><span><span class="tp">500,000원</span></span></div>
    <div class="crow"><span><span class="rank">3</span><span class="firm">NH투자</span></span><span><span class="tp">490,000원</span><span class="tp-up">↑+58.1%</span></span></div>
  </div>

  <div class="footer">2026-05-28 · 로또의 주식인사이트</div>
</div>
</body>
</html>
