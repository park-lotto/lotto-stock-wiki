<!doctype html>
<meta charset="utf-8">
<title>장면 라이브러리</title>
<style>
  :root{--bg:#0a0e14;--panel:#111722;--line:#1e2735;--txt:#e6edf3;--sub:#8b98a9;--accent:#2f81f7;--gold:#ffd76b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic',system-ui,sans-serif;display:flex;min-height:100vh}
  .main{flex:1;padding:28px 36px;overflow:auto}
  .head{display:flex;justify-content:space-between;align-items:center}
  .head h2{font-size:24px}
  .desc{color:var(--sub);font-size:13px;margin:6px 0 20px;line-height:1.6}
  .filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px;align-items:center}
  select,input,textarea{background:#0d1420;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
  button{background:#1b2534;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 12px;font:inherit;font-size:13px;cursor:pointer}
  button:hover{border-color:var(--accent)}
  button.primary{background:var(--accent);border-color:var(--accent)}
  /* library.html은 .cards가 세로 flex 스택이지만, 장면 자산은 썸네일 타일이 맞다 */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .card .thumb{width:100%;aspect-ratio:9/16;background:#060a10;object-fit:cover;display:block;cursor:pointer}
  .card .sfx-thumb{width:100%;aspect-ratio:9/16;display:flex;align-items:center;justify-content:center;font-size:40px;background:#060a10;cursor:pointer}
  .card .info{padding:10px;display:flex;flex-direction:column;gap:6px}
  .card .t{font-size:13px;font-weight:700;line-height:1.3}
  .card .m{font-size:11px;color:var(--sub);line-height:1.5}
  .badge{display:inline-block;font-size:10px;padding:2px 6px;border-radius:5px;font-weight:700}
  .b-replace{background:#123d24;color:#5ddb8e}
  .b-cutaway{background:#3d2b12;color:#e0a45e}
  .b-sfx{background:#2b1a3d;color:#b98ee0}
  .b-overlay{background:#122b3d;color:#5eb0e0}
  .card .acts{display:flex;gap:6px;margin-top:2px}
  .card .acts button{flex:1;padding:5px;font-size:11px}
  .empty{color:var(--sub);font-size:13px;padding:40px;text-align:center;grid-column:1/-1}
  /* 모달 — library.html의 .open 토글 패턴 */
  .m-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
  .m-bg.open{display:flex}
  .m-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(560px,100%);display:flex;flex-direction:column;max-height:92vh}
  .m-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
  .m-head b{font-size:15px}
  .m-head .x{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer}
  .m-body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
  .fld{display:flex;flex-direction:column;gap:4px}
  .fld label{font-size:12px;color:var(--sub)}
  .fld .hint{font-size:11px;color:var(--sub);opacity:.8}
  .m-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
</style>

<main class="main">
  <div class="head">
    <h2>🎞️ 장면 라이브러리</h2>
    <button class="primary" onclick="document.getElementById('upModal').classList.add('open')">⬆ 파일 업로드</button>
  </div>
  <div class="desc" id="desc">
    자주 쓰는 후킹 장면·효과음·오버레이를 모아두는 <b>재사용 짤 뱅크</b>입니다.
    믹스할 때 AI가 대본 비트에 맞는 걸 자동 배치합니다(페이즈2).
    <b style="color:var(--gold)">태그가 정확할수록 배치가 정확해집니다</b> — 특히 <b>소재</b>는 "한 스푼" 같은 모호한 말 대신 가루/액체/세제처럼 구분되게 쓰세요.
  </div>
  <div class="filters">
    <select id="fType" onchange="loadScenes()">
      <option value="">전체 타입</option>
      <option value="clip">화면짤</option>
      <option value="sfx">효과음</option>
      <option value="overlay">오버레이</option>
    </select>
    <select id="fCat" onchange="loadScenes()">
      <option value="">전체 카테고리</option>
    </select>
    <select id="fRole" onchange="loadScenes()">
      <option value="">전체 역할</option>
      <option>훅</option><option>반전</option><option>CTA</option><option>비법공개</option>
      <option>반응</option><option>전환</option><option>본문</option>
    </select>
  </div>
  <div class="cards" id="cards"><div class="empty">불러오는 중…</div></div>
</main>

<!-- 태그 편집 모달 -->
<div class="m-bg" id="editModal">
  <div class="m-box">
    <div class="m-head"><b>장면 태그 편집</b><button class="x" onclick="closeEdit()">✕</button></div>
    <div class="m-body">
      <div class="fld"><label>이름</label><input id="eTitle" placeholder="가루 한스푼"></div>
      <div class="fld"><label>화면 설명</label>
        <textarea id="eDesc" rows="2" placeholder="흰 가루를 숟가락으로 떠 그릇에 넣음"></textarea>
        <div class="hint">보이는 것만. 해석·추측 금지.</div></div>
      <div class="fld"><label>소재(가장 중요)</label>
        <input id="eSubject" placeholder="가루(밀가루·설탕류)">
        <div class="hint">이게 모호하면 세제 짤이 요리 영상에 들어갑니다.</div></div>
      <div class="fld"><label>역할</label>
        <select id="eRole">
          <option value="">(없음)</option>
          <option>훅</option><option>반전</option><option>CTA</option><option>비법공개</option>
          <option>반응</option><option>전환</option><option>본문</option>
        </select></div>
      <div class="fld"><label>카테고리</label>
        <select id="eCat">
          <option value="">(없음)</option>
          <option>레시피</option><option>생활용품</option><option>인테리어</option><option>가전</option>
        </select></div>
      <div class="fld"><label>분위기</label><input id="eTone" placeholder="비밀스러운·궁금"></div>
      <div class="fld"><label>키워드(콤마 구분)</label><input id="eKw" placeholder="숟가락, 가루, 클로즈업"></div>
      <div class="fld" id="eModeWrap"><label>화면짤 사용 방식</label>
        <select id="eMode">
          <option value="cutaway">컷어웨이(삽입 — 타임라인이 늘어남)</option>
          <option value="replace">화면교체(그 비트 화면을 이걸로)</option>
        </select></div>
      <div class="fld" id="eAudioWrap"><label><input type="checkbox" id="eAudio"> 원본 소리 살리기</label></div>
    </div>
    <div class="m-foot"><button onclick="closeEdit()">취소</button><button class="primary" onclick="saveEdit()">저장</button></div>
  </div>
</div>

<!-- 업로드 모달 -->
<div class="m-bg" id="upModal">
  <div class="m-box">
    <div class="m-head"><b>파일 업로드</b><button class="x" onclick="document.getElementById('upModal').classList.remove('open')">✕</button></div>
    <div class="m-body">
      <div class="fld"><label>타입</label>
        <select id="uType">
          <option value="sfx">효과음 (mp3/wav/m4a/aac)</option>
          <option value="overlay">오버레이 (png/jpg/webp/gif)</option>
        </select></div>
      <div class="fld"><label>이름</label><input id="uTitle" placeholder="띠용 효과음"></div>
      <div class="fld"><label>카테고리</label>
        <select id="uCat"><option value="">(없음 — 범용)</option></select>
        <div class="hint">페이즈2 매칭이 같은 카테고리 자산만 1차 후보로 본다. 나중에 편집에서도 바꿀 수 있다.</div></div>
      <div class="fld"><label>파일</label><input type="file" id="uFile"></div>
    </div>
    <div class="m-foot"><button class="primary" onclick="doUpload()">업로드</button></div>
  </div>
</div>

<script>
function esc(s){ return (s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

var SCENES = [];

// 필터(#fCat)·업로드(#uCat)가 같은 카테고리 목록을 쓴다 — 두 벌 하드코딩하면 어긋난다
// (리뷰 Important I-2 권고).
const SCENE_CATEGORIES = ['레시피','생활용품','인테리어','가전'];
(function populateCategorySelects(){
  const opts = SCENE_CATEGORIES.map(c=>`<option>${c}</option>`).join('');
  document.getElementById('fCat').insertAdjacentHTML('beforeend', opts);
  document.getElementById('uCat').insertAdjacentHTML('beforeend', opts);
})();

function badge(a){
  if(a.asset_type==='sfx') return '<span class="badge b-sfx">효과음</span>';
  if(a.asset_type==='overlay') return '<span class="badge b-overlay">오버레이</span>';
  return a.render_mode==='replace'
    ? '<span class="badge b-replace">화면교체</span>'
    : '<span class="badge b-cutaway">컷어웨이</span>';
}

function renderCard(a){
  const thumb = a.asset_type==='sfx'
    ? `<div class="sfx-thumb" onclick="preview(${a.id},'sfx')">🔊</div>`
    : `<img class="thumb" src="/api/scene/${a.id}/poster" loading="lazy"
            onclick="preview(${a.id},'${esc(a.asset_type)}')"
            onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'sfx-thumb',textContent:'🎞'}))">`;
  const meta = [a.category, a.role, a.subject].filter(Boolean).map(esc).join(' · ');
  return `<div class="card" data-id="${a.id}">
    ${thumb}
    <div class="info">
      <div class="t">${esc(a.title||'(이름 없음)')}</div>
      <div>${badge(a)} <span class="m">${a.duration?a.duration.toFixed(1)+'초':''}</span></div>
      <div class="m">${meta||'<i>태그 없음 — 편집하세요</i>'}</div>
      <div class="acts">
        <button onclick="openEdit(${a.id})">✏ 편집</button>
        <button onclick="removeScene(${a.id}, this)">삭제</button>
      </div>
    </div>
  </div>`;
}

function preview(id, type){
  const url = `/api/scene/${id}/media`;
  if(type==='sfx'){ new Audio(url).play(); return; }
  window.open(url, '_blank');
}

async function loadScenes(){
  const el = document.getElementById('cards');
  const q = new URLSearchParams({
    type: document.getElementById('fType').value,
    category: document.getElementById('fCat').value,
    role: document.getElementById('fRole').value,
  });
  try{
    const d = await (await fetch('/api/scene/list?'+q)).json();
    SCENES = d.items||[];
    if(!SCENES.length){ el.innerHTML='<div class="empty">아직 저장한 장면이 없습니다.<br>레퍼런스 랭킹·영상 제작소에서 구간을 잘라 담아보세요.</div>'; return; }
    el.innerHTML = SCENES.map(renderCard).join('');
  }catch(e){ el.innerHTML='<div class="empty">불러오기 실패 — 새로고침 해주세요.</div>'; }
}

function openEdit(id){
  const a = SCENES.find(x=>x.id===id);
  if(!a) return;
  window._editId = id;
  document.getElementById('eTitle').value = a.title||'';
  document.getElementById('eDesc').value = a.scene_desc||'';
  document.getElementById('eSubject').value = a.subject||'';
  document.getElementById('eRole').value = a.role||'';
  document.getElementById('eCat').value = a.category||'';
  document.getElementById('eTone').value = a.tone||'';
  document.getElementById('eKw').value = (a.keywords||[]).join(', ');
  document.getElementById('eMode').value = a.render_mode||'cutaway';
  document.getElementById('eAudio').checked = !!a.keep_original_audio;
  const isClip = a.asset_type==='clip';
  document.getElementById('eModeWrap').style.display = isClip?'':'none';
  document.getElementById('eAudioWrap').style.display = isClip?'':'none';
  document.getElementById('editModal').classList.add('open');
}

function closeEdit(){ document.getElementById('editModal').classList.remove('open'); }

async function saveEdit(){
  const id = window._editId;
  const body = {
    title: document.getElementById('eTitle').value.trim(),
    scene_desc: document.getElementById('eDesc').value.trim(),
    subject: document.getElementById('eSubject').value.trim(),
    role: document.getElementById('eRole').value,
    category: document.getElementById('eCat').value,
    tone: document.getElementById('eTone').value.trim(),
    keywords: document.getElementById('eKw').value.split(',').map(s=>s.trim()).filter(Boolean),
  };
  // render_mode/keep_original_audio는 clip 전용 — non-clip(sfx/overlay)에도 실어보내면
  // 백엔드가 지키는 "render_mode는 clip에서만" 불변식이 오염된다(NULL -> 'cutaway').
  const a = SCENES.find(x=>x.id===id);
  if(a && a.asset_type==='clip'){
    body.render_mode = document.getElementById('eMode').value;
    body.keep_original_audio = document.getElementById('eAudio').checked?1:0;
  }
  if(!body.title){ alert('이름은 필수입니다.'); return; }
  try{
    const d = await (await fetch(`/api/scene/${id}/update`,{method:'POST',
      headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)})).json();
    if(!d.ok){ alert(d.error||'저장 실패'); return; }
    closeEdit(); loadScenes();
  }catch(e){ alert('네트워크 오류'); }
}

async function removeScene(id, btn){
  if(!confirm('이 장면을 라이브러리에서 지울까요?')) return;
  try{
    const d = await (await fetch(`/api/scene/${id}/delete`,{method:'POST'})).json();
    if(!d.ok){ alert(d.error||'삭제 실패'); return; }
    btn.closest('.card').remove();
  }catch(e){ alert('네트워크 오류'); }
}

async function doUpload(){
  const f = document.getElementById('uFile').files[0];
  const title = document.getElementById('uTitle').value.trim();
  if(!f){ alert('파일을 골라주세요.'); return; }
  if(!title){ alert('이름을 입력해주세요.'); return; }
  const fd = new FormData();
  fd.append('asset_type', document.getElementById('uType').value);
  fd.append('title', title);
  fd.append('category', document.getElementById('uCat').value);
  fd.append('file', f);
  try{
    const res = await fetch('/api/scene/upload',{method:'POST', body:fd});
    if(res.status===413){ alert('파일이 너무 큽니다(최대 20MB).'); return; }
    const d = await res.json();
    if(!d.ok){ alert(d.error||'업로드 실패'); return; }
    document.getElementById('upModal').classList.remove('open');
    document.getElementById('uTitle').value=''; document.getElementById('uFile').value='';
    document.getElementById('uCat').value='';
    loadScenes();
  }catch(e){ alert('네트워크 오류'); }
}

loadScenes();
</script>
<script src="/sidebar.js?v=2"></script>
