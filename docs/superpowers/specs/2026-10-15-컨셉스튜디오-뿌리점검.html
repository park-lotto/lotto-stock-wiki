<style>body{margin:0;background:#f6f7f9;color:#1d2330;font:15px/1.65 "Malgun Gothic",sans-serif}#c{max-width:1000px;margin:0 auto;padding:24px 16px 60px}

<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>document.getElementById("c").innerHTML=marked.parse("# 컨셉 스튜디오 Claude형 — 뿌리 점검 (2026-10-15, 관제 213)\n\n사장님: \"계속 고치고 다시 하지 말고 근본 뿌리 설계 점검해야 되는 거 아니야? 이러면 일 못 해.\"\n→ 땜질 중단. 오늘 터진 것을 전부 모아 **같은 뿌리끼리 묶고**, 뿌리마다 설계를 다시 정한다.\n\n## 1. 오늘 사장님 화면에서 터진 것 (전수, 시간순)\n| # | 증상 | 내가 한 땜질 | 뿌리 |\n|---|---|---|---|\n| 1 | MCP 연결 끊기면 작업 프로세스가 같이 죽음 | WMI 로 앱 밖에서 띄움 | **A** |\n| 2 | 데스크톱에서 작업 시작 3번 실패(코드 8) | 앱 안이면 그냥 띄움 | **A** |\n| 3 | 허용 창이 계속 뜸 | 호출 수 줄이기(studio_make) | **B** |\n| 4 | 같은 작업에 프로세스 2개 | 숨쉬기·겹침 거절 | **A·B** |\n| 5 | 영상 17초로 잘림 | 배경음 240초로 늘림 | **D** |\n| 6 | 다시 돌리기가 다른 채널 단계표로 깨짐 | reset_to 에 채널 지정 | **D** |\n| 7 | 예약 작업이 계속 생김(허용 창) | 지시문 \"예약 금지\" → 안 먹힘 | **B** |\n| 8 | \"review.png 확인해 주세요\" 떠넘김 | studio_result | **B** |\n| 9 | 한 번 명령에 완성 안 됨 | studio_wait 지시 | **B** |\n| 10 | 인물형을 그림 생성으로 오해, 도구 안 부름 | 설명·메뉴 버튼 | **B** |\n| 11 | 22분 \"멈춤\" 오판 → 재시작 제안 | 진행 표시 | **B·C** |\n| 12 | 소재 수집 20~40분 | (안 고침) | **C** |\n\n## 2. 뿌리 넷\n**A. 작업의 '몸'이 없다.** 렌더는 20~40분짜리 일인데, 그 일을 맡을 고객 PC 쪽 상주 프로그램이 없다.\nMCP 서버(대화용 부속)의 자식으로 붙여 띄우다 보니 MCP 수명·스토어판 가상 폴더·작업 개체에 휘둘렸다(#1 #2 #4).\n→ 띄우는 방법을 세 번 바꿨고 세 번 다 다른 곳이 깨졌다.\n\n**B. 대화 Claude 에게 공장 감독을 시켰다.** 대화 AI 는 '한 차례 답하고 끝내는' 물건이다.\n20~40분 일을 지켜보고·기다리고·멈췄는지 판정하고·결과를 확인하게 하니, 지시문으로 행동을 묶으려다\n매번 어긋났다(#3 #7 #8 #9 #10 #11). 지시문은 강제가 아니다 — 예약 금지가 실제로 안 먹혔다(#7).\n\n**C. 엔진이 고객 PC 용으로 설계되지 않았다.** 뜨거운사람들 엔진은 우리가 원본을 재현하려 만든 실험 엔진이다.\n소재 영상을 통째로(편당 최대 53MB) 받고 영상 전체를 얼굴 분석 → 한 편 20~40분(#12).\n먼 중계 화면이 많이 뽑힌다(김연경 편 실측). 고객 상품 속도·품질 기준이 정의돼 있지 않다.\n\n**D. 엔진을 바깥에서 덧대 썼다.** 엔진의 판단(배경음 고르기·단계표)을 컨셉 스튜디오가 밖에서 갈아 끼웠다\n→ 엔진 내부 약속(곡 길이 = 영상 길이, 채널별 단계표)을 몰라 깨졌다(#5 #6). 0순위-B(\"같은 판단 두 곳\") 위반.\n\n그리고 **내 검증 방식**: 데스크톱과 같은 조건(스토어판·앱 수명·대화 Claude)의 시험대 없이 내 하네스로 부분만 재고\n\"됐다\"에 가깝게 보고했다 → 문제가 사장님 화면에서 하나씩 나왔다.\n\n## 3. 다시 정할 설계 (뿌리마다 하나)\n**A → '숏템 작업기'(고객 PC 상주 프로그램) 하나를 둔다.**\n설치팩이 깔 때 함께 등록(윈도우 로그인 시 자동 시작·트레이 아이콘). 작업 줄·실행·재시작·완료 알림을 전부 작업기가 한다.\nMCP·웹 스튜디오는 작업기에 \"이거 해 줘\"만 넣는다. Claude 데스크톱을 꺼도 작업은 계속된다. 띄우는 방식 고민이 없어진다.\n\n**B → 대화 Claude 의 일은 '대본'과 '대본 확인' 둘뿐.**\n대본 확정 순간 대화는 끝난다(\"완성되면 알림이 갑니다\"). 기다리기·멈춤 판정·결과 확인은 작업기가 한다.\n완성 알림 = 윈도우 알림 + 웹 컨셉 스튜디오 '내 작업'에 영상·검수 결과. 예약·폴링·studio_wait 가 필요 없어진다.\n첫 진입은 메뉴 버튼(숏템 시작)으로 못 박는다 — 말로만 하면 오해할 수 있다(#10).\n\n**C → 고객용 속도·품질 기준을 먼저 숫자로 정하고 엔진을 거기 맞춘다.**\n예) 한 편 10분 안 · 주인공 얼굴 컷 ≥ 70% · 먼 중계 컷 ≤ 20%. 소재는 필요한 구간만 저화질로 받고 프레임은 띄엄띄엄 본다.\n이건 엔진(칼카피 트랙) 일이다 — 기준표를 넘겨 그쪽에서 한다.\n\n**D → 엔진에 '갈아 끼울 자리'를 정식으로 만든다.**\n배경음·글꼴·효과음을 **엔진이 받는 입력**(설정 한 장)으로 만들고, 컨셉 스튜디오는 그 설정만 넘긴다. 밖에서 함수 바꿔치기 금지.\n\n**검증 → 데스크톱과 같은 조건의 시험대를 먼저 만든다.**\n스토어판 경로·앱 종료·대화 Claude 자리를 흉내 내는 자동 시험 하나로, 사장님께 넘기기 전에 처음부터 끝까지 돈다.\n\n## 4. 순서 제안\n1. 이 점검 사장님 확인 (방향 A·B 가 맞는지)\n2. 작업기 설계 한 장(주인 함수·결과물 검사) → 만들기 → 시험대로 끝까지\n3. 엔진 기준표 → 칼카피 트랙에 넘김(속도·품질)\n4. 그 뒤에 고객 공개 논의\n");</script></body></html>
