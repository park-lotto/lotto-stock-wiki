<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>장면꾸미기 실데이터 시험</title>
  <style>
    :root{color-scheme:dark;font-family:Pretendard,system-ui,sans-serif;background:#071118;color:#eaf7f6}
    *{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:1500px;margin:auto}
    header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}
    h1{font-size:24px;margin:0}p{margin:5px 0;color:#9bb8b8}.lab{color:#61f2d0;font-weight:800}
    .toolbar,.checks{background:#0e2029;border:1px solid #294550;border-radius:14px;padding:14px;margin-bottom:14px}
    .toolbar{display:flex;gap:10px;align-items:center}.toolbar select{flex:1}
    select,button{min-height:42px;border-radius:9px;border:1px solid #3b5e68;background:#132b35;color:#fff;padding:8px 12px}
    button{background:#00b894;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
    .checks{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:8px}.check{background:#112933;padding:10px;border-radius:9px}
    .check b{display:block;color:#66e6c9;margin-bottom:4px}.error{color:#ff8c96;white-space:pre-wrap}
    iframe{width:100%;height:76vh;border:1px solid #294550;border-radius:14px;background:#08151d}
    .actions{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.actions a{color:#06130f;background:#61f2d0;text-decoration:none;padding:11px 14px;border-radius:9px;font-weight:800}
    .compare{width:100%;border-collapse:collapse;margin:12px 0;background:#0e2029}.compare th,.compare td{border:1px solid #294550;padding:9px;text-align:center}.compare th:first-child{text-align:left}.pass{color:#61f2d0}.fail{color:#ff8c96}.pending{color:#9bb8b8}
    #resultVideo{display:block;width:min(360px,100%);max-height:64vh;margin:12px auto;border-radius:12px;background:#000}
    [hidden]{display:none!important}
    html.embedded-tab,html.embedded-tab body{height:100%;overflow:hidden}
    html.embedded-tab body{padding:0}
    html.embedded-tab main{width:100%;max-width:none;height:100%;margin:0}
    html.embedded-tab header,html.embedded-tab .toolbar,html.embedded-tab .checks,
    html.embedded-tab #outputs,html.embedded-tab #error{display:none!important}
    html.embedded-tab #editor{display:block;width:100%;height:100%;border:0;border-radius:0}
    html.embedded-tab:not(.editor-ready) #editor{visibility:hidden}
    html.embedded-tab:not(.editor-ready) main::after{content:'안전한 시험 복사본을 여는 중…';position:fixed;inset:0;display:grid;place-items:center;color:#61f2d0;font-weight:800;background:#071118}
  </style>
</head>
<body>
<main>
  <header><div><h1>장면꾸미기 실데이터 시험 <span class="lab">LAB</span></h1><p>원본 작업은 읽기만 하고 시험 복사본에만 저장합니다.</p></div><strong id="status">작업 불러오는 중…</strong></header>
  <section class="toolbar"><select id="job" aria-label="시험할 작업"></select><button id="clone" disabled>시험 복사본 만들기</button></section>
  <section class="checks" id="checks"></section>
  <p class="error" id="error"></p>
  <section id="outputs" hidden>
    <div class="actions"><button id="render">시험 MP4 만들기</button><button id="capcut">CapCut 시험 초안 보내기</button><a id="landing" target="_blank" rel="noopener">시험 랜딩 열기</a></div>
    <table class="compare" aria-label="네 출구 비교">
      <thead><tr><th>검사항목</th><th>미리보기</th><th>MP4</th><th>CapCut</th><th>랜딩</th></tr></thead>
      <tbody id="compare"><tr><th>훅 자막</th></tr><tr><th>본문 첫 시작</th></tr><tr><th>청소본</th></tr><tr><th>위치</th></tr></tbody>
    </table>
    <video id="resultVideo" controls playsinline hidden></video>
  </section>
  <iframe id="editor" title="장면꾸미기 편집기" hidden></iframe>
</main>
<script src="/scene-style-lab.js"></script>
</body>
</html>
