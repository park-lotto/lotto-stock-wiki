<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 4회차 세로 쇼츠(11-04) — 나레이션 sh01 카드. 문장 시각 = voice/sh01.mp3 무음 실측(py ink/times.py sh01) -->
<style>
@font-face{font-family:Pre;src:url("fonts/Pretendard-Black.otf");font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#faf6ee;font-family:Pre,"Malgun Gothic",sans-serif;color:#1f1e1d}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:-2px;line-height:1.15}
.chip{position:absolute;left:50%;background:#1f1e1d;color:#fff;font-weight:900;border-radius:22px;padding:22px 40px;font-size:66px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.chip b{color:#f0a37f}
.org{color:#d97757}
.panel{position:absolute;left:40px;right:40px;border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.panel img{width:100%;height:100%;object-fit:cover;display:block}
.bub{position:absolute;left:50%;background:#f0eee6;border:3px solid #e1ddd0;border-radius:44px;padding:44px 50px;font-family:'Malgun Gothic',sans-serif;font-size:62px;white-space:nowrap;box-shadow:0 18px 50px rgba(0,0,0,.12)}
.hl{position:absolute;background:rgba(255,214,0,.45);border-radius:6px}
.row{position:absolute;left:140px;right:140px;height:150px;background:#fff;border:4px solid #1f1e1d;border-radius:26px;display:flex;align-items:center;padding-left:40px;font-size:76px;font-weight:900}
.row .ck{margin-left:auto;margin-right:40px;width:84px;height:84px;border-radius:50%;background:#2e9e5b;color:#fff;font-size:60px;display:flex;align-items:center;justify-content:center}
</style></head>
<body>
<!-- A 사람이 친 건 딱 한 줄 -->
<div class="sc" id="A"><img class="full" src="hk/sent.png" style="filter:blur(8px) brightness(.97);transform:scale(1.2)"><div style="position:absolute;inset:0;background:rgba(250,246,238,.6)"></div>
  <div class="big" id="A0" style="top:380px;font-size:96px">방금 보신 거</div>
  <div class="bub" id="Ab" style="top:700px"><span style="position:relative"><span class="hl" id="Ahl" style="left:-8px;top:46px;height:32px"></span><span style="position:relative">외국인 한국화장품 영상 만들어줘..</span></span></div>
  <div class="chip" id="Ac" style="top:1060px">사람이 친 건 <b>딱 한 줄</b></div></div>
<!-- B 원본 찾기부터 대본·장면·자막까지 전부 클로드 -->
<div class="sc" id="B"><div class="big" id="Bt" style="top:200px;font-size:92px">나머지는?</div>
  <div class="row" id="b1" style="top:420px">원본 찾기<span class="ck">✓</span></div>
  <div class="row" id="b2" style="top:610px">대본<span class="ck">✓</span></div>
  <div class="row" id="b3" style="top:800px">장면<span class="ck">✓</span></div>
  <div class="row" id="b4" style="top:990px">자막<span class="ck">✓</span></div>
  <div class="big" id="Bz" style="top:1290px;font-size:130px">전부 <span class="org">클로드가</span></div></div>
<!-- C 잘된 채널을 뜯어보고 그 채널처럼 -->
<div class="sc" id="C"><div class="big" id="Ct" style="top:230px;font-size:104px">잘된 채널을<br><span class="org">뜯어보고</span></div>
  <div class="panel" id="Cp" style="top:620px;height:560px"><img id="Cimg"></div>
  <div class="big" id="C2" style="top:1300px;font-size:104px">그 채널처럼<br>만듭니다</div></div>
<!-- D 채널 하나만 할 이유가 없다 -->
<div class="sc" id="D"><img class="full" id="Dimg" style="object-position:30% 50%"><div style="position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.55),transparent 35%,transparent 55%,rgba(0,0,0,.75))"></div>
  <div class="big" id="Dt" style="top:230px;font-size:110px;color:#fff">채널을 하나만?</div>
  <div class="big" id="D2" style="bottom:260px;font-size:110px;color:#fff">할 이유가 <span style="color:#f0a37f">없다</span></div></div>
<!-- E 나도 될까? 키보드로 한 줄 -->
<div class="sc" id="E"><div class="big" id="Et" style="top:330px;font-size:190px">나도 <span class="org">될까?</span></div>
  <div id="Ebox" style="position:absolute;left:70px;right:70px;top:820px;height:240px;background:#fff;border:5px solid #1f1e1d;border-radius:40px;display:flex;align-items:center;padding:0 50px;font-family:'Malgun Gothic',sans-serif;font-size:62px"><span id="Etx"></span><span id="Ecur" style="display:inline-block;width:5px;height:70px;background:#1f1e1d;margin-left:6px"></span>
    <span style="margin-left:auto;width:110px;height:110px;border-radius:24px;background:#d97757;color:#fff;font-size:70px;display:flex;align-items:center;justify-content:center">↑</span></div>
  <div class="big" id="E2" style="top:1240px;font-size:104px">키보드로 <span class="org">한 줄</span><br>칠 수 있으면 됩니다</div></div>
<!-- F 본편에서 끝까지 -->
<div class="sc" id="F"><div class="big" id="Ft" style="top:480px;font-size:110px">어떻게 하는지</div>
  <div class="big" id="F2" style="top:720px;font-size:150px"><span class="org">본편</span>에서<br>끝까지</div>
  <div class="chip" id="Fc" style="top:1280px">▶ 아래 <b>본편 보기</b></div></div>
<script>
var T = {A: 0, B: 3.0, B1: 3.3, B2: 3.75, B3: 4.3, B4: 4.9, BZ: 5.6, C: 7.1, C2: 8.6, D: 10.45, D2: 11.2, E: 12.3, EK: 13.3, F: 15.1, F2: 15.9, FC: 16.9, END: 19.0};
var N = {ph1: 126, ph2: 84, en1: 117, en2: 84};
function fr(d, t) { var i = Math.min(N[d], Math.max(1, Math.floor(t * 30) + 1)); return "hk/" + d + "/" + ("00" + i).slice(-3) + ".jpg"; }
function $(id) { return document.getElementById(id); }
function show(id, a, b, t) { var on = t >= a && t < b; $(id).style.display = on ? 'block' : 'none'; return on; }
function pop(e, t0, t, base) { var p = Math.max(0, Math.min(1, (t - t0) / 0.25)); var s = p < 1 ? 0.6 + 0.55 * p - 0.15 * Math.sin(p * Math.PI) : 1; e.style.opacity = p; e.style.transform = (base || '') + ' scale(' + s + ')'; }
var LINE = "외국인 한국화장품 영상 만들어줘..";
function render(t) {
  if (show('A', T.A, T.B, t)) { pop($('A0'), 0, t); pop($('Ab'), 0.15, t, 'translateX(-50%)');
    $('Ahl').style.width = (Math.max(0, Math.min(1, (t - 0.9) / 0.6)) * 980) + 'px';
    var c = $('Ac'); c.style.display = t >= 1.3 ? 'block' : 'none'; pop(c, 1.3, t, 'translateX(-50%)'); }
  if (show('B', T.B, T.C, t)) { pop($('Bt'), T.B, t); [['b1', T.B1], ['b2', T.B2], ['b3', T.B3], ['b4', T.B4]].forEach(function (r) { pop($(r[0]), r[1], t); });
    var z = $('Bz'); z.style.display = t >= T.BZ ? 'block' : 'none'; pop(z, T.BZ, t); }
  if (show('C', T.C, T.D, t)) { pop($('Ct'), T.C, t); $('Cimg').src = fr('en1', t - T.C + 1.5); $('Cp').style.transform = 'scale(' + (1 + 0.02 * (t - T.C)) + ')';
    var c2 = $('C2'); c2.style.display = t >= T.C2 ? 'block' : 'none'; pop(c2, T.C2, t); }
  if (show('D', T.D, T.E, t)) { $('Dimg').src = fr('ph2', t - T.D); $('Dimg').style.transform = 'scale(' + (1.1 + 0.05 * (t - T.D)) + ')'; pop($('Dt'), T.D, t);
    var d2 = $('D2'); d2.style.display = t >= T.D2 ? 'block' : 'none'; pop(d2, T.D2, t); }
  if (show('E', T.E, T.F, t)) { pop($('Et'), T.E, t); pop($('Ebox'), T.E + 0.4, t);
    var n = Math.max(0, Math.min(LINE.length, Math.floor((t - T.EK) / 0.07))); $('Etx').textContent = LINE.slice(0, n);
    $('Ecur').style.opacity = (Math.floor(t * 2) % 2) ? 1 : 0.15;
    var e2 = $('E2'); e2.style.display = t >= T.EK ? 'block' : 'none'; pop(e2, T.EK, t); }
  if (show('F', T.F, 1e9, t)) { pop($('Ft'), T.F, t); var f2 = $('F2'); f2.style.display = t >= T.F2 ? 'block' : 'none'; pop(f2, T.F2, t);
    var fc = $('Fc'); fc.style.display = t >= T.FC ? 'block' : 'none'; pop(fc, T.FC, t, 'translateX(-50%)'); }
}
window.HT = T; window.render = render; render(0);
</script>
</body></html>
