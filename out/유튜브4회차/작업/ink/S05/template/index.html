<script>
const {Scene,person,robot,smooth,ell,cloud,poly,rr,ln,pl,tube,mk,INK,ORG,SKIN,SHIRT,HAIR,BEIGE,SKY,PINK,eo,seg,clamp,qo,J,f} = HQ;
document.fonts.load('40px "NP"').then(()=>document.fonts.load('40px "GB"')).then(()=>document.fonts.load('800 40px "PB"')).then(()=>document.fonts.ready).then(()=>{
const S = new Scene(24.0);
// 4회차 장면 s05 — 다른 길 셋 다 내 손 (24.0초) · 문장 시각 = py ink/times.py s05
// 0.23 다른 길 / 1.22 생각해 보셨죠 / 3.88 강의 더 / 5.13 손편집만 / 7.46 앱 바꾸기 / 9.03 여전히 내 손 / 12.20 편집자 / 12.91 비용 늘어남
// 15.86 셋 다 내 손 / 17.68 저희 방에선 / 19.58 바보 소리
const Y = "#F4E28A";
// ===== 컷1 다른 길 (−1 ~ 3.88) =====
const c1 = cutL(S, -1, 3.88, { push: [1.0, 1.04], ox: 960, oy: 600 });
c1.text("다른 길도 있죠", { x: 960, y: 200, size: 150, s: 0.25, gap: 0.07, anchor: "c" });
c1.line(pl([[960, 1000], [960, 640]]), 1.2, 0.35, { w: 12 });
c1.line(pl([[960, 640], [520, 380]]), 1.55, 0.3, { w: 12 }); c1.line(pl([[960, 640], [960, 360]]), 1.7, 0.3, { w: 12 }); c1.line(pl([[960, 640], [1400, 380]]), 1.85, 0.3, { w: 12 });
[[520, 380, "1", 2.1], [960, 360, "2", 2.3], [1400, 380, "3", 2.5]].forEach(([x, y, n, t]) => {
  c1.fill(ell(x, y, 70, 70, { n: 18 }), Y, t, 0.7, 0.2); c1.line(ell(x, y, 70, 70, { n: 18 }), t, 0.3, { w: 7 });
  c1.text(n, { x, y: y + 20, size: 90, font: "num", s: t + 0.1, anchor: "c" });
});
// ===== 컷2 세 갈래 (3.88 ~ 17.68) =====
const c2 = cutL(S, 3.88, 17.68);
[[120, "강의 더 듣기", "손편집만 늘 뿐", 3.9, 5.2, SKY, "prop.laptop"], [700, "편집 앱 바꾸기", "누르는 건 내 손", 7.5, 9.1, PINK, "prop.app_edit"], [1280, "편집자 맡기기", "채널 늘면 비용도", 12.2, 13.0, Y, "hand.point"]].forEach(([x, a, b, t, t2, col, pr]) => {
  const card = rr(x, 160, 520, 720, 26); c2.fill(card, col, t, 0.45, 0.25); c2.line(card, t, 0.45, { w: 8 });
  c2.text(a, { x: x + 260, y: 270, size: 80, s: t + 0.2, gap: 0.05, anchor: "c" });
  art(c2, pr, { x: x + 260 + (pr === "hand.point" ? -40 : 0), y: pr === "hand.point" ? 520 : 640, sc: pr === "hand.point" ? 2.2 : 1.2, s: t + 0.5 });
  c2.text(b, { x: x + 260, y: 790, size: 76, font: "gae", s: t2, gap: 0.05, anchor: "c", c: "#D9622B" });
});
const all = c2.text("셋 다 = 내 손", { x: 960, y: 1000, size: 120, s: 15.9, gap: 0.07, anchor: "c" });
c2.circleMark(all.box(5, 7), 16.8, 0.4, 40, 18);
// ===== 컷3 저희 방에선 → 바보 소리 (17.68 ~) =====
const c3 = cutL(S, 17.68, 1e9, { push: [1.0, 1.05], ox: 500, oy: 500 });
const st3 = stageN(c3);
st3.fill(ell(480, 620, 500, 480, { n: 30 }), "#D9D4CC", -99, 0.35);
INKHERO.put(c3, "g_o_laptop_blank", { x: 480, y: 410, sc: 1.85, s: 17.7, dur: 1.1 });
c3.text("저희 방에서는", { x: 1000, y: 200, size: 100, font: "gae", s: 17.8, gap: 0.05 });
const bub = smooth([[960, 300], [1820, 300], [1840, 700], [1260, 720], [1120, 830], [1150, 720], [970, 700], [960, 300]], true);
c3.fill(bub, "#FFFFFF", 18.6, 0.95, 0.2); c3.line(bub, 18.5, 0.5, { w: 8 });
c3.text("아직도 편집 앱 붙잡고", { x: 1400, y: 430, size: 86, s: 19.6, gap: 0.05, anchor: "c" });
c3.text("손으로 자르고 있으면?", { x: 1400, y: 560, size: 86, s: 20.7, gap: 0.05, anchor: "c" });
const fool = c3.text("바보 소리 듣는다", { x: 1400, y: 930, size: 140, s: 22.0, gap: 0.06, anchor: "c", c: "#D9622B" });
c3.underline(fool.box(0, 4), 23.2, 0.3);

S.start();
});
