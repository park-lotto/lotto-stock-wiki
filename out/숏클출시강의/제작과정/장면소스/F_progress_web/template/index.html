<!doctype html>
<html lang="ko"><head><meta charset="UTF-8" />
<meta name="viewport" content="width=1920, height=1080" />
<script src="brand/gsap.min.js"></script>
<style>
@font-face { font-family: "PS"; src: url("brand/Pretendard-SemiBold.otf"); font-weight: 600; }
@font-face { font-family: "PS"; src: url("brand/Pretendard-ExtraBold.otf"); font-weight: 800; }
html,body{margin:0;background:#f4e6dc}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:"PS",sans-serif;font-weight:600}
#wall{position:absolute;inset:-300px;background:
 radial-gradient(ellipse 1000px 450px at 12% 85%,rgba(255,196,170,.95),transparent 70%),
 radial-gradient(ellipse 1100px 400px at 12% 90%,rgba(255,236,160,.85),transparent 60%),
 radial-gradient(ellipse 800px 260px at 98% 40%,rgba(170,232,214,.95),transparent 70%),
 radial-gradient(ellipse 1000px 380px at 92% 62%,rgba(196,242,226,.85),transparent 60%),
 radial-gradient(ellipse 1100px 420px at 70% 98%,rgba(255,228,150,.8),transparent 60%),
 linear-gradient(180deg,#fbeee6 0%,#f6efe0 50%,#e8f5ee 100%)}
#cam{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
#win{position:absolute;left:90px;top:60px;width:1740px;height:960px;background:#fff;border-radius:20px;overflow:hidden;box-shadow:0 40px 110px rgba(80,50,30,.28);color:#2a2622}
#tb{position:absolute;left:0;right:0;top:0;height:56px;background:#f6f3ee}
#tb i{position:absolute;top:19px;width:18px;height:18px;border-radius:50%}
#hd{position:absolute;left:0;right:0;top:56px;height:94px;border-bottom:2px solid #eee8df;display:flex;align-items:center;padding-left:44px;font-size:48px;font-weight:800;color:#1c1916}
#hd span{margin-left:auto;margin-right:44px;background:#ffe9a8;border-radius:40px;padding:8px 28px;font-size:32px;color:#6a4a00}
#side{position:absolute;left:0;top:150px;bottom:0;width:420px;background:#faf7f2;border-right:2px solid #eee8df}
.si{position:absolute;left:18px;right:18px;height:66px;border-radius:16px;display:flex;align-items:center;padding-left:78px;font-size:36px;color:#9a928a}
.si::before{content:"";position:absolute;left:20px;top:17px;width:30px;height:30px;border-radius:50%;border:3px solid #cfc7bd;box-sizing:border-box;text-align:center;font-size:20px;line-height:24px;color:#fff}
.si.done{color:#2a2622}
.si.done::before{content:"✓";background:#3cc19a;border-color:#3cc19a}
.si.now{background:#ffe27a;color:#1c1916;font-weight:800}
.si.now::before{border-color:#c79a00;background:#fff}
#main{position:absolute;left:420px;top:150px;width:760px;bottom:0}
#log{position:absolute;left:1180px;top:150px;right:0;bottom:0;background:#fffdf8;border-left:2px solid #eee8df}
#logh{position:absolute;left:34px;top:22px;font-size:34px;font-weight:800;color:#1c1916}
#logw{position:absolute;left:34px;right:30px;top:84px;bottom:20px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end}
.lg{display:none;font-size:30px;line-height:1.35;margin-top:16px;padding:14px 18px;border-radius:14px;background:#f6f0e6;color:#3a342d}
.lg.hi{background:#dff5ec}
.pg{position:absolute;left:0;top:0;right:0;bottom:0;display:none}
.h1{position:absolute;left:36px;top:22px;font-size:44px;font-weight:800;color:#1c1916}
.sub{position:absolute;left:36px;top:84px;font-size:30px;color:#8a8279}
.card{position:absolute;left:30px;width:700px;height:190px;border:3px solid #eee8df;border-radius:24px;background:#fff;box-sizing:border-box}
.card.sel{border-color:#f2c200;background:#fffbe6}
.th{position:absolute;left:22px;top:19px;width:146px;height:146px;border-radius:18px}
.ct{position:absolute;left:196px;top:34px;font-size:38px;font-weight:800;color:#1c1916}
.cs{position:absolute;left:196px;top:96px;font-size:30px;color:#8a8279}
.btn{position:absolute;background:#ffd21f;color:#1c1916;font-weight:800;text-align:center;border-radius:18px;box-shadow:0 5px 0 #d9ac00}
.cb{right:24px;top:56px;width:170px;height:74px;line-height:74px;font-size:36px}
.sl{position:absolute;left:30px;width:700px;height:112px;border-radius:20px;background:#faf7f2;font-size:34px;font-weight:800;color:#1c1916;display:flex;align-items:center;padding-left:34px;box-sizing:border-box}
.sl em{font-style:normal;font-weight:600;color:#8a8279;font-size:30px;margin-left:18px}
#cur{position:absolute;left:0;top:0;width:52px;height:60px;z-index:9;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
</style></head><body>
<div id="stage" data-composition-id="shortcl_progress" data-start="0" data-duration="12" data-width="1920" data-height="1080">
<div id="wall"></div>
<div id="cam"><div id="win">
 <div id="tb"><i style="left:26px;background:#ff8a7a"></i><i style="left:58px;background:#ffd36a"></i><i style="left:90px;background:#6fd6a8"></i></div>
 <div id="hd">숏클메이커 · 진행판<span>해외 화장품</span></div>
 <div id="side"></div>
 <div id="main"><div class="pg" id="p1"></div><div class="pg" id="p2"></div></div>
 <div id="log"><div id="logh">진행 기록</div><div id="logw"></div></div>
</div>
<svg id="cur" viewBox="0 0 26 30"><path d="M3 2 L3 22 L8.5 17 L12 25 L15 23.7 L11.7 16 L18.5 16 Z" fill="#fff" stroke="#000" stroke-width="1.4"/></svg>
</div>
</div>
<script>
(()=>{
const D=12,$=id=>document.getElementById(id),cl=(v,a=0,b=1)=>Math.min(b,Math.max(a,v)),E=p=>{p=cl(p);return p<.5?4*p*p*p:1-Math.pow(-2*p+2,3)/2};
const STEPS=['준비 확인','소재 확인','제품 확인','자료조사','재료 영상','대본','장면 맞추기','목소리','렌더','점검'];
const DONE=[.3,.7,4.4,5.1,5.8,9.2,9.9,10.6,11.3,99];
$('side').innerHTML=STEPS.map((n,i)=>`<div class="si" id="si${i}" style="top:${16+i*76}px">${n}</div>`).join('');
const LOGS=[[.3,'준비 확인 — 도구와 키가 모두 연결됐습니다'],[.8,'소재 확인 — 해외 화장품 프리셋으로 시작'],[1.5,'원본을 찾았습니다 — 같은 사람·같은 장면 확인',1],[2.3,'후보 3개를 추렸습니다 — 직접 고르는 단계'],[4.5,'제품 확정 — 후보 2번으로 진행'],[5.2,'자료조사 — 같은 소재의 반응 글을 모았습니다'],[5.9,'재료 영상 — 장면 재료를 내려받았습니다'],[6.8,'대본: 터진 채널의 틀로 썼습니다',1],[9.3,'장면 맞추기 — 줄마다 어울리는 컷을 붙입니다'],[10.4,'목소리 — 대본을 읽어 음성으로 만듭니다'],[11.3,'렌더 — 영상을 합치는 중']];
$('logw').innerHTML=LOGS.map(([t,s,h],i)=>`<div class="lg ${h?'hi':''}" id="lg${i}">${s}</div>`).join('');
const TH=['linear-gradient(135deg,#ffd3bd,#ffe9a8)','linear-gradient(135deg,#bfeedd,#ffe9a8)','linear-gradient(135deg,#ffd0dc,#c9ece0)'];
let p1=`<div class="h1">후보 고르기</div><div class="sub">마음에 드는 후보를 하나 고르세요</div>`;
[1,2,3].forEach((n,i)=>{p1+=`<div class="card" id="c${n}" style="top:${140+i*212}px"><div class="th" style="background:${TH[i]}"></div><div class="ct">해외 화장품 · 후보 ${n}</div><div class="cs">원본 확인 완료</div><div class="btn cb" id="b${n}">이걸로</div></div>`});
$('p1').innerHTML=p1;
let p2=`<div class="h1">대본 미리보기</div><div class="sub">후보 2번 · 터진 채널의 틀</div>`;
[['1','시작','보는 사람을 붙잡는 첫 줄'],['2','전개','제품이 쓰이는 장면'],['3','반응','놀라는 순간'],['4','마무리','한 줄 정리']].forEach(([n,a,b],i)=>{p2+=`<div class="sl" style="top:${140+i*128}px">${n}. ${a}<em>${b}</em></div>`});
p2+=`<div class="btn" id="nx" style="left:500px;top:660px;width:230px;height:76px;line-height:76px;font-size:36px">다음 단계</div>`;
$('p2').innerHTML=p2;
const CUR=[[0,1500,330],[1.6,1500,330],[3.4,1135,640],[4.6,1150,650],[5.6,1150,650],[8.7,1110,935],[12,1110,935]];
const CAM=[[0,1,0,0],[2.0,1,0,0],[2.8,1.3,-640,-230],[5.0,1.3,-640,-230],[5.7,1,0,0],[7.6,1,0,0],[8.2,1.3,-760,-660],[10.4,1.3,-760,-660],[11.1,1,0,0],[12,1,0,0]];
const CLICK=[4.2,9.2];
const interp=(K,t,n)=>{let i=0;while(i<K.length-1&&K[i+1][0]<=t)i++;const a=K[i],b=K[Math.min(i+1,K.length-1)];const p=b[0]>a[0]?E((t-a[0])/(b[0]-a[0])):0;const o=[];for(let k=1;k<=n;k++)o.push(a[k]+(b[k]-a[k])*p);return o};
function render(t){
 const pg=t>=4.6?2:1,pt=pg==2?4.6:0,u=t-pt;
 $('p1').style.display=pg==1?'block':'none';$('p2').style.display=pg==2?'block':'none';
 const P=$('p'+pg);P.style.opacity=cl(u/.2);P.style.transform=`translateY(${(1-E(u/.3))*10}px)`;
 const cur=STEPS.findIndex((_,i)=>t<DONE[i]);
 STEPS.forEach((_,i)=>{$('si'+i).className='si'+(t>=DONE[i]?' done':(i===cur?' now':''))});
 LOGS.forEach(([lt],i)=>{const e=$('lg'+i);e.style.display=t>=lt?'block':'none';e.style.opacity=cl((t-lt)/.25)});
 [1,2,3].forEach((n,i)=>{const e=$('c'+n);e.className='card'+(n==2&&t>=4.2?' sel':'');e.style.opacity=cl((t-.9-i*.18)/.35);e.style.transform=`translateY(${(1-E((t-.9-i*.18)/.4))*14}px)`;});
 if(pg==2){P.querySelectorAll('.sl').forEach((e,i)=>{const p=E((u-.3-i*.35)/.4);e.style.opacity=p;e.style.transform=`translateX(${(1-p)*-16}px)`})}
 const [s,x,y]=interp(CAM,t,3);$('cam').style.transform=`translate(${x}px,${y}px) scale(${s})`;
 const [cx,cy]=interp(CUR,t,2);let pr=0;for(const c of CLICK)if(t>=c&&t<c+.18)pr=1;
 $('cur').style.transform=`translate(${cx-8}px,${cy-6}px) scale(${pr?.85:1})`;
 $('b2').style.transform=(pr&&t<5)?'translateY(4px)':'';
 $('nx').style.transform=(pr&&t>5)?'translateY(4px)':'';
}
window.__timelines=window.__timelines||{};
const tl2=gsap.timeline({paused:true});const S={t:0};tl2.to(S,{t:D,duration:D,ease:'none',onUpdate:()=>render(S.t)});window.__timelines['shortcl_progress']=tl2;render(0);
})();
</script></body></html>
