<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>인사이트 — v6 촉매 캘린더</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#ffffff; --bg-2:#f5f5f7; --card:#ffffff;
    --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b;
    --hair:#e5e5e7; --hair-2:#d2d2d7;
    --blue:#0066cc; --up:#1d8a3f; --down:#d70015; --amber:#b25e00;
    --shadow:0 4px 24px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);
    font-family:'Pretendard',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;font-feature-settings:"tnum"}
  a{color:inherit;text-decoration:none}
  ::selection{background:rgba(0,102,204,.14)}
  .reveal{opacity:0;transform:translateY(18px);animation:rise .7s cubic-bezier(.2,.7,.2,1) forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  .nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:28px;height:48px;padding:0 32px;
    background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(20px);
    -webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair)}
  .brand{font-size:14px;font-weight:700;letter-spacing:-.01em;display:flex;align-items:center;gap:7px}
  .brand .dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}
  .nav .lnk{color:var(--ink-2);font-size:13px;font-weight:500;transition:color .18s}
  .nav .lnk:hover,.nav .lnk.on{color:var(--ink)}
  .nav .ver{margin-left:auto;font-size:12px;color:var(--ink-3)}

  .wrap{max-width:1120px;margin:0 auto;padding:0 32px}

  .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:56px 0 26px;flex-wrap:wrap}
  .hero h1{font-size:clamp(40px,6vw,66px);font-weight:800;letter-spacing:-.04em;line-height:.98}
  .hero .tag{font-size:clamp(15px,2vw,18px);color:var(--ink-2);font-weight:500;padding-bottom:6px}
  .hero .tag b{color:var(--ink);font-weight:700}

  /* watchlist bar */
  .wl{background:var(--bg-2);border-radius:22px;padding:20px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .wl-lbl{font-size:13px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:6px}
  .wl-chip{display:inline-flex;align-items:center;gap:7px;padding:8px 10px 8px 14px;border-radius:980px;
    background:#fff;border:1px solid var(--hair-2);font-size:13.5px;font-weight:600}
  .wl-chip .x{width:16px;height:16px;border-radius:50%;background:var(--bg-2);color:var(--ink-3);
    display:grid;place-items:center;font-size:11px;cursor:pointer;transition:.15s}
  .wl-chip .x:hover{background:var(--down);color:#fff}
  .wl-add{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:980px;
    background:#fff;border:1px dashed var(--hair-2);font-size:13px;font-weight:600;color:var(--ink-2);cursor:pointer;transition:.15s}
  .wl-add:hover{border-color:var(--ink);color:var(--ink)}
  .wl-addbox{display:none;align-items:center;gap:6px}
  .wl-addbox.on{display:inline-flex}
  .wl-addbox input{font-family:inherit;font-size:13px;padding:8px 12px;border-radius:980px;border:1px solid var(--ink);outline:none;width:130px}

  /* catalyst section */
  .cat-sec{padding:40px 0 20px}
  .cat-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:6px}
  .cat-head h2{font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.02em}
  .cat-head .g{color:var(--ink-3);font-size:14px;font-weight:600}
  .cat-sub{font-size:14px;color:var(--ink-3);margin-bottom:18px}
  .cat-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
  .cat-tab{font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink-2);background:#fff;
    border:1px solid var(--hair-2);border-radius:980px;padding:8px 16px;cursor:pointer;transition:.15s}
  .cat-tab:hover{border-color:var(--ink-3)}
  .cat-tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .cat-grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.cat-grid{grid-template-columns:1fr}}
  .panel{background:var(--bg-2);border-radius:22px;padding:22px 24px}
  .panel h3{font-size:15px;font-weight:700;margin-bottom:4px;display:flex;align-items:center;gap:7px}
  .panel .ph-sub{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}

  .ev{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;padding:13px 4px;border-top:1px solid var(--hair-2);cursor:pointer;transition:padding-left .15s}
  .ev:first-of-type{border-top:none}
  .ev:hover{padding-left:6px}
  .dday{font-size:12px;font-weight:800;text-align:center;border-radius:8px;padding:5px 0;letter-spacing:-.02em}
  .dday.soon{background:rgba(215,0,21,.1);color:var(--down)}
  .dday.near{background:rgba(178,94,0,.12);color:var(--amber)}
  .dday.far{background:#fff;color:var(--ink-3);border:1px solid var(--hair-2)}
  .ev .mid .nm{font-size:14.5px;font-weight:600}
  .ev .mid .meta{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .flag{font-size:12px}
  .kind{font-size:11px;font-weight:700;color:var(--ink-2);background:#fff;border:1px solid var(--hair-2);border-radius:5px;padding:1px 6px}
  .conf{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700}
  .conf .d{width:9px;height:9px;border-radius:50%}
  .conf.c1 .d{background:var(--ink)} .conf.c1{color:var(--ink)}
  .conf.c2 .d{background:linear-gradient(90deg,var(--ink) 50%,#fff 50%);border:1px solid var(--ink-3)} .conf.c2{color:var(--ink-2)}
  .conf.c3 .d{background:#fff;border:1.5px solid var(--ink-3)} .conf.c3{color:var(--ink-3)}

  /* saga cards */
  .saga{background:#fff;border:1px solid var(--hair);border-radius:16px;padding:18px;margin-top:12px;cursor:pointer;transition:.2s;box-shadow:var(--shadow)}
  .saga:first-of-type{margin-top:0}
  .saga:hover{transform:translateY(-3px);box-shadow:0 10px 30px rgba(0,0,0,.09)}
  .saga-top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
  .saga-top .t{font-size:15.5px;font-weight:700}
  .saga-top .st{margin-left:auto;font-size:11px;font-weight:700;color:var(--amber);background:rgba(178,94,0,.1);border-radius:6px;padding:2px 8px}
  .saga .now{font-size:13px;color:var(--ink-2);margin-bottom:4px}
  .saga .nx{font-size:13px;font-weight:600}
  .saga .nx b{color:var(--down)}
  .saga .ben{font-size:12px;color:var(--ink-3);margin-top:8px}
  .saga .ben b{color:var(--ink);font-weight:600}
  .tl{display:flex;align-items:center;gap:0;margin-top:12px}
  .tl .node{flex:1;text-align:center;position:relative;font-size:10px;color:var(--ink-3)}
  .tl .node::before{content:'';position:absolute;top:5px;left:-50%;width:100%;height:2px;background:var(--hair-2)}
  .tl .node:first-child::before{display:none}
  .tl .node .dot{width:11px;height:11px;border-radius:50%;background:var(--hair-2);margin:0 auto 5px;position:relative;z-index:1}
  .tl .node.done .dot{background:var(--ink)} .tl .node.done{color:var(--ink)}
  .tl .node.next .dot{background:var(--down);box-shadow:0 0 0 3px rgba(215,0,21,.15)} .tl .node.next{color:var(--down);font-weight:700}

  /* signal cards with D-badge */
  .sec{padding:44px 0 64px}
  .sec-head{font-size:clamp(24px,4vw,34px);font-weight:700;letter-spacing:-.02em;margin-bottom:6px}
  .sec-head .g{color:var(--ink-3)}
  .sec-sub{font-size:14px;color:var(--ink-3);margin-bottom:20px}
  .rail{display:flex;gap:18px;overflow-x:auto;padding:6px 4px 16px;scroll-snap-type:x mandatory;scrollbar-width:none}
  .rail::-webkit-scrollbar{display:none}
  .scard{flex:0 0 280px;scroll-snap-align:start;background:var(--card);border-radius:20px;box-shadow:var(--shadow);
    overflow:hidden;display:flex;flex-direction:column;min-height:300px;cursor:pointer;transition:.2s;position:relative;padding:22px 22px 0}
  .scard:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(0,0,0,.11)}
  .tagchip{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:980px}
  .tagchip.u{color:var(--up);background:rgba(29,138,63,.1)} .tagchip.d{color:var(--down);background:rgba(215,0,21,.08)}
  .scard h3{font-size:24px;font-weight:700;letter-spacing:-.02em;margin-top:11px}
  .scard .delta{font-size:26px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:6px}
  .up{color:var(--up)} .down{color:var(--down)}
  .cat-badge{margin-top:14px;display:inline-flex;align-items:center;gap:7px;background:var(--bg-2);border-radius:10px;padding:9px 12px;font-size:12.5px;font-weight:600}
  .cat-badge .dd{font-weight:800;color:var(--down)}
  .cat-badge.none{color:var(--ink-3);font-weight:500}
  .scard .spark{margin:auto -22px 0;width:calc(100% + 44px);height:80px;display:block}

  .foot{padding:28px 0 56px;border-top:1px solid var(--hair);color:var(--ink-3);font-size:12px;text-align:center}
  .toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);
    background:rgba(29,29,31,.96);color:#fff;padding:13px 20px;border-radius:14px;font-size:14px;font-weight:500;
    opacity:0;pointer-events:none;transition:.3s;z-index:99;max-width:88vw}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  @media(max-width:720px){.hero{padding:40px 0 20px}.wrap{padding:0 20px}.nav{padding:0 20px;gap:16px}.nav .lnk:not(.on){display:none}}
  @media(prefers-reduced-motion:reduce){.reveal{animation:none;opacity:1;transform:none}*{transition:none!important}}
</style>
</head>
<body>
  <nav class="nav">
    <span class="brand"><span class="dot"></span>로또의 주식</span>
    <a class="lnk" href="#">딸깍</a><a class="lnk" href="#">섹터맵</a>
    <a class="lnk on" href="#">인사이트</a><a class="lnk" href="#">소스</a>
    <span class="ver">v7.4</span>
  </nav>

  <div class="wrap">
    <section class="hero reveal">
      <h1>다가오는 촉매.</h1>
      <div class="tag">내 종목·섹터의 일정과 트리거를, <b>열자마자 차려놓게.</b></div>
    </section>

    <!-- WATCHLIST -->
    <section class="wl reveal" style="animation-delay:.04s">
      <span class="wl-lbl">⭐ 내 종목</span>
      <span id="wlChips" style="display:flex;gap:8px;flex-wrap:wrap"></span>
      <span class="wl-add" id="wlAdd">+ 종목 추가</span>
      <span class="wl-addbox" id="wlAddBox"><input id="wlInput" placeholder="종목명 입력 후 Enter"></span>
    </section>

    <!-- CATALYST CALENDAR -->
    <section class="cat-sec">
      <div class="cat-head reveal">
        <h2>📅 다가오는 촉매</h2>
        <span class="g" id="catCount"></span>
      </div>
      <div class="cat-sub reveal">어디서도 한 번에 못 보는 국내·해외·정책 일정을 종목에 연결해 정리했어요.</div>
      <div class="cat-tabs reveal" id="catTabs"></div>
      <div class="cat-grid">
        <div class="panel reveal">
          <h3>🗓️ 확정 일정 · 트리거</h3>
          <div class="ph-sub">D-정렬 · 확정도 표시</div>
          <div id="evList"></div>
        </div>
        <div class="panel reveal" style="animation-delay:.05s">
          <h3>🌀 진행형 사가</h3>
          <div class="ph-sub">일정이 계속 바뀌는 장기 사업 — 현재 단계·다음 촉매 추적</div>
          <div id="sagaList"></div>
        </div>
      </div>
    </section>

    <!-- SIGNALS with D-badge -->
    <section class="sec">
      <h2 class="sec-head reveal">오늘의 신호. <span class="g">촉매까지 붙여서.</span></h2>
      <div class="sec-sub reveal">각 카드에 다음 촉매가 D-배지로 붙어요. 누르면 브리핑.</div>
      <div class="rail" id="rail"></div>
    </section>
  </div>

  <div class="foot">로또의 주식 · 인사이트 — v6 촉매 캘린더</div>
  <div class="toast" id="toast"></div>

<script>
  const toast=document.getElementById('toast');
  function showToast(m){toast.textContent=m;toast.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>toast.classList.remove('show'),2600);}

  // ---- watchlist ----
  let watch=['삼성전자','SK하이닉스','한화오션','알테오젠'];
  function renderWatch(){
    document.getElementById('wlChips').innerHTML=watch.map(n=>
      `<span class="wl-chip">${n}<span class="x" data-x="${n}">✕</span></span>`).join('');
    document.querySelectorAll('.wl-chip .x').forEach(x=>x.addEventListener('click',()=>{watch=watch.filter(w=>w!==x.dataset.x);renderWatch();renderCat();}));
  }
  document.getElementById('wlAdd').addEventListener('click',()=>{document.getElementById('wlAddBox').classList.add('on');document.getElementById('wlInput').focus();});
  document.getElementById('wlInput').addEventListener('keydown',e=>{
    if(e.key==='Enter'&&e.target.value.trim()){watch.push(e.target.value.trim());e.target.value='';document.getElementById('wlAddBox').classList.remove('on');renderWatch();renderCat();showToast('내 종목에 추가됐어요 · 촉매를 다시 정리했어요');}});

  // ---- events data (point events + triggers) ----
  // conf: 1=확정 2=높음 3=관측 ; flag optional ; stocks=영향 국내종목
  const EVENTS=[
    {dd:4,date:'07-08',nm:'삼성전자 2Q 잠정실적',kind:'실적발표',conf:1,sector:'반도체',stocks:['삼성전자'],dir:'관망'},
    {dd:6,date:'07-10',nm:'7월물 옵션만기',kind:'옵션만기',conf:1,sector:'매크로',stocks:[],dir:'변동성'},
    {dd:7,date:'07-11',nm:'ADA 학회 GLP-1 데이터',kind:'트리거',conf:2,sector:'바이오',stocks:['알테오젠'],dir:'기대'},
    {dd:13,date:'07-17',nm:'TSMC 2Q 실적',kind:'해외실적',conf:1,flag:'🇹🇼',sector:'반도체',stocks:['삼성전자','SK하이닉스'],dir:'선행지표'},
    {dd:14,date:'07-18',nm:'금융통화위원회',kind:'정책',conf:1,sector:'매크로',stocks:[],dir:'관망'},
    {dd:20,date:'07-24',nm:'SK하이닉스 2Q 실적',kind:'실적발표',conf:1,sector:'반도체',stocks:['SK하이닉스'],dir:'관망'},
    {dd:20,date:'07-24',nm:'인텔 2Q 실적',kind:'해외실적',conf:1,flag:'🇺🇸',sector:'반도체',stocks:['삼성전자'],dir:'파운드리'},
    {dd:21,date:'07-25',nm:'HD현대중공업 2Q 실적',kind:'실적발표',conf:1,sector:'조선',stocks:['HD현대중공업'],dir:'관망'},
    {dd:28,date:'08-01',nm:'미 대중 반도체 수출규제 개정 시한',kind:'정책',conf:3,flag:'🇺🇸',sector:'반도체',stocks:['삼성전자','SK하이닉스'],dir:'리스크'}
  ];
  const SAGAS=[
    {flag:'🇨🇦',t:'캐나다 잠수함 (CPSP)',st:'◐ 높음',sector:'조선',stocks:['한화오션','HD현대중공업'],
      now:'현재: 3사 숏리스트 → 우선협상 4Q26 예상',nx:'다음 촉매: 캐나다 국방부 RFP 회신 · <b>~D-45</b>',ben:['한화오션','HD현대중공업'],
      tl:[['숏리스트','done'],['RFP 회신','next'],['우선협상',''],['계약','']]},
    {flag:'🇵🇱',t:'폴란드 오르카 잠수함',st:'○ 관측',sector:'조선',stocks:['한화오션'],
      now:'현재: 협상 진행 중',nx:'다음 촉매: 연내 결정설 · <b>미정</b>',ben:['한화오션'],
      tl:[['제안서','done'],['협상','next'],['결정','']]}
  ];

  const SECTORS=['내 종목','반도체','조선','바이오','매크로','전체'];
  let curTab='내 종목';
  document.getElementById('catTabs').innerHTML=SECTORS.map(s=>`<button class="cat-tab ${s===curTab?'on':''}" data-t="${s}">${s}</button>`).join('');
  document.querySelectorAll('.cat-tab').forEach(b=>b.addEventListener('click',()=>{
    curTab=b.dataset.t;document.querySelectorAll('.cat-tab').forEach(x=>x.classList.toggle('on',x===b));renderCat();}));

  function match(item){
    if(curTab==='전체')return true;
    if(curTab==='내 종목')return item.stocks.some(s=>watch.includes(s));
    return item.sector===curTab;
  }
  function ddClass(d){return d<=3?'soon':d<=7?'near':'far';}
  function confInfo(c){return c===1?['c1','● 확정']:c===2?['c2','◐ 높음']:['c3','○ 관측'];}
  function renderCat(){
    const evs=EVENTS.filter(match), sgs=SAGAS.filter(match);
    document.getElementById('catCount').textContent=(curTab==='내 종목'?'내 종목 기준 ':curTab+' ')+ '· '+(evs.length+sgs.length)+'건';
    document.getElementById('evList').innerHTML= evs.length? evs.map(e=>{
      const[cc,ct]=confInfo(e.conf);
      return `<div class="ev" data-brief="${e.nm}">
        <div class="dday ${ddClass(e.dd)}">D-${e.dd}</div>
        <div class="mid"><div class="nm">${e.flag?e.flag+' ':''}${e.nm}</div>
          <div class="meta"><span>${e.date}</span><span class="kind">${e.kind}</span><span class="conf ${cc}"><span class="d"></span>${ct.split(' ')[1]}</span></div></div>
        <div style="font-size:12px;color:var(--ink-3);font-weight:600">${e.dir}</div></div>`;}).join('')
      : `<div style="color:var(--ink-3);font-size:14px;padding:14px 4px">이 조건에 예정된 일정이 없어요.</div>`;
    document.querySelectorAll('#evList .ev').forEach(el=>el.addEventListener('click',()=>showToast('“'+el.dataset.brief+'” 자세히 — 브리핑 생성 중…')));
    document.getElementById('sagaList').innerHTML= sgs.length? sgs.map(s=>`
      <div class="saga" data-brief="${s.t} 현황">
        <div class="saga-top"><span class="flag">${s.flag}</span><span class="t">${s.t}</span><span class="st">${s.st}</span></div>
        <div class="now">${s.now}</div><div class="nx">${s.nx}</div>
        <div class="ben">수혜: ${s.ben.map(b=>`<b>${b}</b>`).join(' · ')}</div>
        <div class="tl">${s.tl.map(([l,st])=>`<div class="node ${st}"><div class="dot"></div>${l}</div>`).join('')}</div>
      </div>`).join('')
      : `<div style="color:var(--ink-3);font-size:14px;padding:14px 4px">이 조건에 진행형 사가가 없어요.</div>`;
    document.querySelectorAll('#sagaList .saga').forEach(el=>el.addEventListener('click',()=>showToast('“'+el.dataset.brief+'” — 타임라인 브리핑 생성 중…')));
  }

  // ---- signal cards with D-badge ----
  function spark(vals,color){
    const w=280,h=80,pad=6,max=Math.max(...vals),min=Math.min(...vals),rng=(max-min)||1;
    const pts=vals.map((v,i)=>[pad+i*(w-2*pad)/(vals.length-1), h-pad-((v-min)/rng)*(h-2*pad)]);
    const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+','+p[1].toFixed(1)).join(' ');
    const id='g'+Math.floor(vals[0]*997+color.length*13);
    return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none">
      <defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${color}" stop-opacity=".2"/><stop offset="1" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>
      <path d="${line} L${w-pad},${h} L${pad},${h} Z" fill="url(#${id})"/>
      <path d="${line}" fill="none" stroke="${color}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  }
  const cards=[
    {n:'삼성전자',up:false,tag:'약세',d:'▼6.9',cat:'D-4 실적발표',v:[30,29,28,26,25,24,23,22],c:'#d70015'},
    {n:'SK하이닉스',up:false,tag:'약세',d:'▼14.1',cat:'D-20 실적발표',v:[18,17,15,14,12,11,10,9],c:'#d70015'},
    {n:'한화오션',up:true,tag:'상승세',d:'▲1.0',cat:'🇨🇦 캐나다 잠수함 D-45',v:[4,5,6,6,7,8,9,10],c:'#1d8a3f'},
    {n:'알테오젠',up:true,tag:'반등',d:'▲1.5',cat:'D-7 ADA 학회',v:[1,1,2,2,3,3,3,4],c:'#1d8a3f'}
  ];
  document.getElementById('rail').innerHTML=cards.map((s,i)=>`
    <div class="scard reveal" data-brief="${s.n}" style="animation-delay:${.05*i}s">
      <span class="tagchip ${s.up?'u':'d'}">${s.up?'▲':'▼'} ${s.tag}</span>
      <h3>${s.n}</h3><div class="delta ${s.up?'up':'down'}">${s.d}</div>
      <div class="cat-badge"><span class="dd">◆</span>다음 촉매 · ${s.cat}</div>
      ${spark(s.v,s.c)}</div>`).join('');
  document.querySelectorAll('.scard').forEach(c=>c.addEventListener('click',()=>showToast('“'+c.dataset.brief+'” 오늘 핵심 — 브리핑 생성 중…')));

  renderWatch();renderCat();
</script>
</body>
</html>
