<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:BHS;src:url('../../shopping_shorts/static/fonts/BlackHanSans.ttf')}
@font-face{font-family:PT;src:url('../../shopping_shorts/static/fonts/Pretendard-ExtraBold.otf')}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;background:transparent}
.wrap{position:relative;width:1080px;height:1920px;font-family:BHS,PT,sans-serif}
/* 검은 영역은 제목에 딱 맞춘다 — 빈 검정을 없앤다 */
.head{position:absolute;left:0;top:0;width:100%;padding:96px 0 34px;background:#000;text-align:center}
.ad{position:absolute;right:40px;top:34px;color:#fff;font-family:PT;font-size:32px;font-weight:700;opacity:.85;z-index:2}
/* 폭을 꽉 채운다 — 좌우 여백 3% */
.l1,.l2{display:block;padding:0 3%;line-height:1.02;letter-spacing:-5px;
  -webkit-text-stroke:14px #000;paint-order:stroke fill;text-shadow:0 10px 0 #000;
  transform:scaleX(0.94) skewX(-7deg);white-space:nowrap}
.l1{color:#FFE600;font-size:126px}
.l2{color:#fff;font-size:126px;margin-top:14px}
.bar{position:absolute;left:0;width:100%;background:#fff;display:flex;align-items:center;justify-content:center}
.bar span{font-family:PT;font-weight:900;color:#111;letter-spacing:-2px;font-size:46px;white-space:nowrap;padding:0 4%}
</style></head><body>
<div class="wrap">
  <div class="ad">[광고]</div>
  <div class="head" id="h">
    <span class="l1">역발상으로 돈방석앉은</span>
    <span class="l2">육아천재의 발명품</span>
  </div>
  <div class="bar" id="b"><span>역발상으로 돈방석앉은 육아천재의 발명품</span></div>
</div>
<script>
// 검은 영역 높이만큼 흰 바를 바로 아래 붙인다 — 빈 검정이 안 생긴다
const h=document.getElementById('h'), b=document.getElementById('b');
b.style.top=h.offsetHeight+'px'; b.style.height='128px';
// 글자가 화면을 넘치면 넘치지 않을 때까지 줄인다(폭을 꽉 채우되 잘리지 않게)
for(const el of [document.querySelector('.l1'),document.querySelector('.l2')]){
  let s=parseInt(getComputedStyle(el).fontSize);
  while(el.scrollWidth>1080 && s>40){ s-=2; el.style.fontSize=s+'px'; }
}
b.style.top=h.offsetHeight+'px';
</script>
</body></html>
