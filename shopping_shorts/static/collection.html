<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>영상 즐겨찾기 · 숏템메이커</title>
<script>(function(){try{var t=localStorage.getItem('ssTheme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  /* 스탁브레인 민트-블랙 투톤(다크 기본). produce.html과 동일 토큰. */
:root{--bg:#0a0f0d;--panel:#101815;--line:#1e2b26;--txt:#eaf3f0;--sub:#8fa1a0;--accent:#37e0bd;--accent2:#1f9e7a;--fire:#ff6b6b;--ok:#37e0bd;--gold:#f0c453;--inset:#0c1412;--sel-bg:linear-gradient(90deg,#123a30,#0c221c);--sel-fg:#6ff0d6;--grad:linear-gradient(135deg,#6ff0d6,#1f9e7a);--hover:#131d19;color-scheme:dark;}
:root[data-theme="light"]{--bg:#f4faf7;--panel:#ffffff;--line:#d5e6df;--txt:#0f1a16;--sub:#5c726d;--accent:#12b886;--accent2:#0ca678;--fire:#e0524a;--ok:#12b886;--gold:#b8860b;--inset:#eef7f3;--sel-bg:linear-gradient(90deg,#d8f2ea,#eafaf5);--sel-fg:#0a7d66;--grad:linear-gradient(135deg,#19c9ab,#0a8f79);--hover:#eef7f3;color-scheme:light;}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic',system-ui,sans-serif;margin:0;min-height:100vh}
  .main{flex:1;padding:24px 32px;overflow:auto}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .head h2{margin:0;font-size:22px}
  .head .desc{color:var(--sub);font-size:13px;margin-top:4px}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .toolbar button{font-family:inherit;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;font-size:13px}
  .btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--txt)}
  .btn-send{background:linear-gradient(90deg,var(--accent2),#8b5cf6);color:#fff}
  .btn-send:disabled{opacity:.4;cursor:default}
  #selCount{font-size:12px;color:var(--sub)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:default}
  .card.sel{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(109,59,239,.35)}
  /* ★min-height 필수(2026-08-17 사장님 "미리보기 재생하면 화면 안 나온다").
     .thumb의 높이는 안쪽 img(220px)에서만 나왔다 → 재생 시 img를 지우고 <video>를
     position:absolute로 얹으면 상자가 0px로 접혀 영상이 아예 안 보였다.
     썸네일이 없는 카드(도우인)도 같은 이유로 ▶ 버튼조차 안 보였다(.card는 overflow:hidden). */
  .thumb{position:relative;cursor:pointer;background:#000;min-height:220px}
  .thumb img{width:100%;height:220px;object-fit:cover;display:block}
  .thumb .chk{position:absolute;top:8px;left:8px;font-size:18px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}
  .body{padding:12px;flex:1;display:flex;flex-direction:column}
  .rank{font-size:13px;color:var(--txt)}
  .btns{display:flex;gap:6px;margin-top:auto;padding-top:10px}
  .btns button{flex:1;font-size:11px;padding:7px 4px;border-radius:7px;border:1px solid var(--line);background:var(--inset);color:var(--txt);cursor:pointer}
  .btns button.view{border-color:var(--accent);color:var(--sel-fg)}
  .empty{color:var(--sub);text-align:center;padding:60px;grid-column:1/-1}
</style>
</head>
<body>
<main class="main">
  <div class="head">
    <div>
      <h2>⭐ 영상 즐겨찾기</h2>
      <div class="desc">담아둔 레퍼런스 영상을 모아보고, 고른 것만 영상 제작으로 보냅니다.</div>
    </div>
    <div class="toolbar">
      <span id="selCount"></span>
      <button class="btn-ghost" onclick="selectAll()">전체선택</button>
      <button class="btn-ghost" onclick="selectNone()">선택해제</button>
      <button class="btn-ghost" onclick="selectAnalyzed()" title="분석이 끝난 것만 골라줍니다">✅ 분석완료만 선택</button>
      <button class="btn-ghost" onclick="analyzeSelected()" title="고른 영상을 미리 분석해 둡니다(천천히 돌아갑니다)">🔎 분석 시작</button>
      <button class="btn-send" onclick="sendToProduce()">🎬 영상제작으로 보내기</button>
    </div>
  </div>
  <div class="cards" id="cards"></div>
</main>
<script>
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
let ITEMS=[];
const SELECTED=new Set();
async function loadItems(){
  try{
    const d=await (await fetch('/api/mix/basket')).json();
    ITEMS=(d.items||[]).slice().reverse();   // 최근에 담은 게 맨 위로
  }catch(e){ ITEMS=[]; }
  render();                 // 목록부터 즉시 그리고(신호등은 잠깐 '분석 전'),
  await loadAnalysis();     // 상태가 오면 다시 그린다 — 목록이 늦게 뜨는 걸 막는다.
  render();
}
function toggleSelect(sc){
  SELECTED.has(sc)?SELECTED.delete(sc):SELECTED.add(sc);
  render();
}

// ── 분석 신호등(2026-08-18 사장님: "즐겨찾기에 미리 담아두면 천천히 되니까") ──────
// 담아두기만 해도 서버가 알아서 예열하지만, 화면에 아무 표시가 없어 "된 건지" 알 수 없었다.
// 여기서 상태만 읽어 보여주고(비용 0원), 안 된 것은 버튼으로 다시 걸 수 있게 한다.
// 판정은 서버 _analysis_state 한 곳이 한다 — 제작소 1단계 카드와 같은 답을 쓴다.
let ANALYSIS={};          // shortcode -> {state:'done'|'pending'|'gave_up', reason}
let _pollTimer=null;
async function loadAnalysis(){
  const codes=ITEMS.map(i=>i.shortcode).filter(Boolean);
  if(!codes.length){ ANALYSIS={}; return; }
  try{
    const d=await (await fetch('/api/basket/analysis_status?shortcodes='+
      encodeURIComponent(codes.join(',')))).json();
    if(d && d.ok) ANALYSIS=d.items||{};
  }catch(e){}
  // 도는 중인 게 남아 있으면 20초마다 다시 본다(다 끝나면 폴링을 멈춘다 — 서버 부담 0).
  const pending=codes.some(c=>(ANALYSIS[c]||{}).state==='pending');
  clearTimeout(_pollTimer);
  if(pending) _pollTimer=setTimeout(()=>loadAnalysis().then(render), 20000);
}
// 다른 페이지에 갔다 와도 진행 상태가 살아 있어야 한다(2026-08-18 사장님 요청).
// ★분석 자체는 서버 대기줄(job_queue)에서 도니까 창을 닫아도 계속된다 — 화면이 할 일은
//   돌아왔을 때 **서버 상태를 다시 읽는 것**뿐이다. 탭을 다시 보는 순간 갱신한다.
document.addEventListener('visibilitychange',()=>{
  if(!document.hidden) loadAnalysis().then(render);
});
window.addEventListener('focus',()=>{ loadAnalysis().then(render); });
function analysisBadge(sc){
  const st=(ANALYSIS[sc]||{}).state;
  if(st==='done')    return `<span style="background:#1f9d55;color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px">✅ 분석완료</span>`;
  if(st==='pending') return `<span style="background:#8a6d3b;color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px">⏳ 분석 중</span>`;
  if(st==='gave_up') return `<span title="${esc((ANALYSIS[sc]||{}).reason||'')}" style="background:#a03c2a;color:#fff;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px">⚠ 분석 실패</span>`;
  return `<span style="background:#3a3a3a;color:#bbb;font-size:11px;font-weight:800;padding:2px 8px;border-radius:10px">· 분석 전</span>`;
}
async function analyzeCodes(codes){
  codes=(codes||[]).filter(Boolean);
  if(!codes.length){ alert('분석할 항목을 먼저 선택하세요'); return; }
  codes.forEach(c=>{ ANALYSIS[c]={state:'pending',reason:''}; });   // 누른 즉시 표시
  render();
  try{
    await fetch('/api/basket/analyze',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({shortcodes:codes})});
  }catch(e){}
  await loadAnalysis(); render();
}
function analyzeSelected(){ analyzeCodes([...SELECTED]); }
function analyzeOne(sc){ analyzeCodes([sc]); }
function selectAnalyzed(){
  SELECTED.clear();
  ITEMS.forEach(i=>{ if((ANALYSIS[i.shortcode]||{}).state==='done') SELECTED.add(i.shortcode); });
  render();
}
function selectAll(){ ITEMS.forEach(i=>SELECTED.add(i.shortcode)); render(); }
function selectNone(){ SELECTED.clear(); render(); }
async function removeItem(sc){
  try{ await fetch('/api/mix/basket/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shortcode:sc})}); }catch(e){}
  SELECTED.delete(sc);
  loadItems();
}
// ── 어디로 보낼지 고른다(2026-08-18 사장님: "만들던 곳에 합쳐지는 걸 막아야 해") ──
// 종전엔 제작소가 **진행 중 작업에 무조건 이어 붙였다**(랭킹에서 두 번 보내면 앞 것이
// 지워지던 2026-07-18 버그의 처방). 그 규칙 자체는 맞지만, 즐겨찾기에서 새 영상 묶음을
// 보낼 때까지 옛 작업에 섞여 "만들던 영상에 엉뚱한 소스"가 들어갔다.
// → 기본을 **새 작업**으로 바꾸고, 이어서 하고 싶을 때만 작업을 골라 보낸다.
let _pendingPicks = null;
async function _openSendModal(picks){
  _pendingPicks = picks;
  let works = [];
  try{
    const d = await (await fetch('/api/produce/works')).json();
    works = (d && d.works) ? d.works.slice(0, 12) : [];   // 응답 키는 works다(제작소 모달과 동일)
  }catch(e){}
  const rows = works.map(w=>{
    const name = esc((w.title && w.title.trim()) ? w.title.trim() : '제목 없음 (대본 미작성)');
    const step = (typeof w.step === 'number') ? (w.step + 1) : 1;
    const when = esc((w.updated_at || '').slice(5, 16).replace('T', ' '));
    return `<div onclick="_doSend('${esc(w.work_id)}')" style="padding:10px 12px;border:1px solid #444;border-radius:8px;margin-top:6px;cursor:pointer;display:flex;justify-content:space-between;gap:10px;align-items:center">
      <span style="font-weight:700">${name}</span>
      <span style="color:#999;font-size:12px;white-space:nowrap">${when} · 단계 ${step}/8</span></div>`;
  }).join('');
  _overlay(
    `<div style="font-weight:800;font-size:16px;margin-bottom:4px">🎬 어디로 보낼까요?</div>
     <div style="color:#aaa;font-size:13px;margin-bottom:12px">영상 ${picks.length}개</div>
     <button onclick="_doSend('new')" style="width:100%;padding:12px;background:#1f6feb;color:#fff;border:none;border-radius:10px;font-weight:800;font-size:15px;cursor:pointer">➕ 새 작업으로 보내기</button>
     <div style="color:#888;font-size:12px;margin:14px 0 2px">만들던 작업에 이어서 넣기</div>
     ${rows || '<div style="color:#777;font-size:13px;padding:8px 0">진행 중인 작업이 없습니다</div>'}`);
}
function _doSend(target){
  const picks = _pendingPicks || [];
  if(!picks.length) return;
  sessionStorage.setItem('produce_handoff', JSON.stringify(picks));
  sessionStorage.setItem('produce_mix_urls', JSON.stringify(picks.map(p=>p.url).filter(Boolean)));
  _closeOverlay();
  // 새 작업은 ?new=1(직전 작업을 안 불러온다), 이어서는 ?work=<id> — 둘 다 이미 있는 길이다.
  location.href = (target === 'new') ? '/produce?new=1'
                                     : '/produce?work=' + encodeURIComponent(target);
}
function sendToProduce(){
  // 영상당 역할(대본용/화면용)을 제작소에서 배정하려면 url뿐 아니라 shortcode·name·
  // thumbnail·caption도 넘겨야 한다(대본 추출은 shortcode로). 최대 5개(2단계 입력 상한).
  const picks=ITEMS.filter(i=>SELECTED.has(i.shortcode)).slice(0,5).map(i=>({
    url:i.url||'', shortcode:i.shortcode||'', name:i.name||'',
    thumbnail:i.thumbnail||'', caption:i.caption||'', play_url:i.play_url||''}));
  if(!picks.length){ alert('보낼 항목을 먼저 선택하세요'); return; }
  _openSendModal(picks);   // 어디로 보낼지 고른 뒤 _doSend가 저장·이동한다
}
// 썸네일 소스: 렌즈 결과(gstatic)는 /api/thumb 프록시가 허용호스트가 아니라 400을
// 주므로(검게 나옴) referrerpolicy=no-referrer로 직접 로드. 인스타·틱톡·유튜브 CDN은
// 핫링크 차단이 있어 프록시 경유해야 뜬다(2026-07-14 버그수정).
function thumbSrc(u){
  if(!u) return '';
  // gstatic(구글렌즈)·중국 CDN(샤오홍슈 xhscdn·도우인 douyinpic)은 핫링크 제한이 없어
  // no-referrer로 직접 로드한다. /api/thumb 프록시는 인스타 referer를 붙여 중국 CDN에서
  // 오히려 400/검게 나오므로 프록시를 태우지 않는다(2026-07-18 모음집 검은썸네일 수정).
  if(/gstatic\.com|xhscdn\.com|douyinpic\.com|xhslink\.com/.test(u)) return u;
  return '/api/thumb?url='+encodeURIComponent(u);
}
function _fmtCount(n){
  if(n==null||isNaN(n)) return '';
  n=Number(n);
  if(n>=100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'억';
  if(n>=10000) return (n/10000).toFixed(1).replace(/\.0$/,'')+'만';
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'천';
  return String(n);
}
function _fmtDur(s){
  if(s==null||isNaN(s)) return '';
  s=Math.round(Number(s)); const m=Math.floor(s/60);
  return m+':'+String(s%60).padStart(2,'0');
}
// 속도(시간당) = 댓글수 ÷ 업로드 후 경과시간(시간). ts(업로드 unixtime) 있어야 계산.
function _speed(comments, ts){
  if(comments==null || !ts) return null;
  const hrs=(Date.now()/1000 - Number(ts))/3600;
  return hrs>0 ? comments/hrs : null;
}
// 레퍼런스 랭킹처럼 영상정보 블록(조회수·좋아요·댓글·팔로워·속도·참여밀도·길이) — 담기 보강메타(m).
// ※가속은 시계열 2회 스냅샷이 필요해 일회성 담기론 불가. 팔로워·참여밀도는 플랫폼이 팔로워를
//   줄 때만(틱톡은 안 줌). 조회수·댓글·좋아요·속도·길이는 대부분 나온다.
function metaLine(m){
  if(!m) return '';
  const row=(label,val)=> (val!=null&&val!=='')
    ? `<div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--sub)">${label}</span><b>${val}</b></div>` : '';
  const sp=_speed(m.comments, m.ts);
  const body=[
    m.channel?`<div style="opacity:.85;margin-bottom:2px">👤 ${esc(String(m.channel).slice(0,22))}</div>`:'',
    m.followers?row('팔로워', Number(m.followers).toLocaleString()):'',
    row('조회수', m.views!=null?Number(m.views).toLocaleString():''),
    row('좋아요', m.likes!=null?Number(m.likes).toLocaleString():''),
    row('댓글', m.comments!=null?Number(m.comments).toLocaleString():''),
    sp!=null?row('속도(시간당)', sp.toFixed(1)):'',
    (m.followers&&m.comments!=null)?row('참여밀도', (m.comments/m.followers*100).toFixed(2)+'%'):'',
    m.duration!=null?row('길이', _fmtDur(m.duration)):''
  ].filter(Boolean).join('');
  return body?`<div style="font-size:11px;margin:2px 0 6px;display:flex;flex-direction:column;gap:1px">${body}</div>`:'';
}
// 썸네일 ▶ 재생 — 유튜브·틱톡은 임베드, 인스타는 /api/media로 mp4 즉석 해석해
// 인앱 재생(레퍼런스랭킹과 동일 경로, 2026-08-03 이식 — 사장님 '즐겨찾기도 랭킹처럼').
// 해석 실패·샤오홍슈·도우인은 원본 새탭(로그인벽이라 embed 불가).
function _ytId(u){ const m=String(u||'').match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{6,})/); return m?m[1]:''; }
function _ttId(u){ const m=String(u||'').match(/tiktok\.com\/.*\/video\/(\d{6,})/); return m?m[1]:''; }
function _titleBar(i){ return `<div style="margin-bottom:8px;font-size:13px">${esc((i.name||'').slice(0,80))}</div>`; }
function _overlayVideo(i, src){
  _overlay(_titleBar(i)+
    `<video src="${esc(src)}" controls autoplay playsinline style="width:100%;max-height:70vh;border-radius:8px;background:#000"></video>`);
}
// 카드 안 인라인 재생(2026-08-09 사장님 "새창 하나뜸" — 히트작 playArch와 동일 UX).
// 오버레이 모달은 걷어내고 .thumb 안의 img를 <video>/<iframe>으로 바꾼다.
// ★.thumb의 onclick(선택토글)이 재생 컨트롤 클릭까지 먹지 않게 stopPropagation.
async function playPreview(el, sc){
  const i=ITEMS.find(x=>x.shortcode===sc); if(!i||!i.url) return;
  const box=el&&el.closest?el.closest('.thumb'):null;
  if(!box){ window.open(i.url,'_blank'); return; }
  const mount=n=>{
    n.style.cssText+=';position:absolute;inset:0;width:100%;height:100%;background:#000;border:0';
    n.onclick=e=>e.stopPropagation();
    if(getComputedStyle(box).position==='static') box.style.position='relative';
    box.querySelectorAll('img,video,iframe').forEach(x=>x.remove());
    el.remove(); box.appendChild(n);
  };
  const yid=_ytId(i.url);
  if(yid){ const f=document.createElement('iframe');
    f.src=`https://www.youtube.com/embed/${yid}?autoplay=1&playsinline=1`;
    f.allow='autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen=true; mount(f); return; }
  const tid=_ttId(i.url);
  if(tid){ const f=document.createElement('iframe');
    f.src=`https://www.tiktok.com/embed/v2/${tid}`;
    f.allow='autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen=true; mount(f); return; }
  if(/instagram\.com/.test(i.url)){
    let src=i.play_url||'';
    if(!src){
      el.textContent='⏳';
      try{
        const d=await (await fetch(`/api/media?platform=instagram&id=${encodeURIComponent(i.shortcode)}`)).json();
        if(d.ok && d.url) src=d.url;
      }catch(e){}
      el.textContent='▶';
    }
    if(src){ const v=document.createElement('video');
      v.src=src; v.controls=true; v.autoplay=true; v.playsInline=true;
      v.setAttribute('playsinline',''); v.style.objectFit='cover'; mount(v); return; }
  }
  window.open(i.url,'_blank');   // 샤오홍슈·도우인·해석실패는 원본 탭에서 재생
}
function _overlay(html){
  let o=document.getElementById('collOverlay');
  if(!o){ o=document.createElement('div'); o.id='collOverlay';
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px';
    o.addEventListener('click',e=>{ if(e.target===o) _closeOverlay(); }); document.body.appendChild(o); }
  o.innerHTML=`<div style="background:#171717;border:1px solid #333;border-radius:12px;padding:14px;max-width:820px;width:100%;position:relative">`+
    `<button onclick="_closeOverlay()" style="position:absolute;top:2px;right:10px;background:none;border:none;color:#fff;font-size:22px;cursor:pointer">✕</button>${html}</div>`;
  o.style.display='flex';
}
function _closeOverlay(){ const o=document.getElementById('collOverlay'); if(o){ o.innerHTML=''; o.style.display='none'; } }
// 이 영상 하나만 바로 제작소로 (선택 안 해도 카드에서 바로).
function sendOneToProduce(sc){
  const i=ITEMS.find(x=>x.shortcode===sc); if(!i) return;
  const picks=[{url:i.url||'', shortcode:i.shortcode||'', name:i.name||'',
                thumbnail:i.thumbnail||'', caption:i.caption||'', play_url:i.play_url||''}];
  _openSendModal(picks);   // 한 개를 보낼 때도 어디로 갈지 고른다(같은 길)
}
// 플랫폼 배지 — URL 호스트로 판별(app.py _GRAB_DOMAINS와 같은 도메인). 재생 로직이
// 이미 URL로 플랫폼을 구분하고 있어(playPreview) 같은 판별을 배지로도 보여준다.
function platformBadge(url){
  const h=(String(url||'').match(/^https?:\/\/([^/]+)/)||[])[1]||'';
  const P=[['youtu','▶️','YT','#cc0000'],['tiktok.com','🎵','TikTok','#111'],
    ['instagram.com','📷','인스타','#c13584'],
    ['xiaohongshu','📕','샤오훙슈','#ff2442'],['xhslink','📕','샤오훙슈','#ff2442'],
    ['rednote','📕','샤오훙슈','#ff2442'],['douyin','🎬','도우인','#111'],
    ['iesdouyin','🎬','도우인','#111']];
  for(const [k,emo,lab,bg] of P) if(h.includes(k))
    return `<span style="position:absolute;top:6px;right:6px;z-index:2;background:${bg};color:#fff;font-size:10px;font-weight:700;padding:2px 6px;border-radius:6px">${emo} ${lab}</span>`;
  return '';
}
// 보강메타 없는 카드 재수집(2026-07-21) — 담을 때 메타가 안 왔거나 서버 probe 실패한
// 항목만. 자동재수집은 비용이라 버튼으로만.
async function reprobeMeta(sc, btn){
  if(btn){ btn.disabled=true; btn.textContent='수집 중…'; }
  try{
    const r=await fetch('/api/mix/basket/reprobe',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({shortcode:sc})});
    const j=await r.json();
    if(!j.ok){ if(btn){ btn.disabled=false; btn.textContent='🔄 정보 새로고침'; } return; }
    setTimeout(loadItems, 1600);   // 백그라운드 보강이 끝날 즈음 새로고침
  }catch(e){ if(btn){ btn.disabled=false; btn.textContent='🔄 정보 새로고침'; } }
}
function render(){
  const el=document.getElementById('cards');
  document.getElementById('selCount').textContent = SELECTED.size ? `${SELECTED.size}개 선택` : '';
  if(!ITEMS.length){
    el.innerHTML='<div class="empty">담아둔 영상이 없습니다.<br><small>레퍼런스 랭킹이나 렌즈 결과에서 📥담기를 눌러보세요.</small></div>';
    return;
  }
  el.innerHTML = ITEMS.map(i=>{
    const sel = SELECTED.has(i.shortcode);
    const ml = metaLine(i.meta);
    // 메타가 하나도 없을 때만 재수집 버튼(있으면 굳이 비용 쓸 이유 없음).
    const reprobeBtn = ml ? '' : `<button onclick="reprobeMeta('${i.shortcode}',this)" style="width:100%;margin:2px 0 4px;padding:5px;background:#2d333b;color:#adbac7;border:1px solid #444;border-radius:6px;font-size:11px;cursor:pointer">🔄 정보 새로고침</button>`;
    return `
    <div class="card ${sel?'sel':''}">
      <div class="thumb" onclick="toggleSelect('${i.shortcode}')" title="클릭하면 선택/해제 (▶ 는 미리보기 재생)" style="position:relative;cursor:pointer">
        ${platformBadge(i.url)}
        <span class="chk" onclick="event.stopPropagation();toggleSelect('${i.shortcode}')" style="cursor:pointer;position:absolute;top:6px;left:6px;z-index:2">${sel?'✅':'⬜'}</span>
        ${i.thumbnail?`<img src="${thumbSrc(i.thumbnail)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.visibility='hidden'" style="cursor:pointer">`:''}
        ${i.duration!=null?`<span style="position:absolute;left:6px;bottom:6px;z-index:2;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 7px;border-radius:10px">⏱ ${_fmtDur(i.duration)}</span>`:''}
        <span onclick="event.stopPropagation();playPreview(this,'${i.shortcode}')" title="미리보기 재생" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:3;background:rgba(0,0,0,.55);color:#fff;width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:20px;cursor:pointer">▶</span>
      </div>
      <div class="body">
        <div style="margin-bottom:5px">${analysisBadge(i.shortcode)}</div>
        <div class="rank" style="white-space:normal;line-height:1.4;min-height:2.6em">${esc((i.name||i.caption||'').slice(0,60))}</div>
        ${ml}
        ${reprobeBtn}
        <div class="btns">
          <button class="view" onclick="window.open('${esc(i.url||'#')}','_blank')">👁 보기</button>
          <button onclick="removeItem('${i.shortcode}')">🗑 빼기</button>
        </div>
        ${(ANALYSIS[i.shortcode]||{}).state==='done' ? '' :
          `<button onclick="analyzeOne('${i.shortcode}')" style="width:100%;margin-top:6px;padding:7px;background:#2d333b;color:#adbac7;border:1px solid #555;border-radius:8px;font-weight:700;cursor:pointer">🔎 ${(ANALYSIS[i.shortcode]||{}).state==='gave_up'?'다시 분석':'분석'}</button>`}
        <button onclick="sendOneToProduce('${i.shortcode}')" style="width:100%;margin-top:6px;padding:8px;background:#1f6feb;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">🎬 제작소로 보내기</button>
      </div>
    </div>`;
  }).join('');
}
loadItems();
</script>
<script src="/sidebar.js?v=2"></script>
</body>
</html>
