<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>다가오는 이벤트 · 로또의 주식</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
  :root{
    --bg:#fff; --bg-2:#f5f5f7; --ink:#1d1d1f; --ink-2:#6e6e73; --ink-3:#86868b;
    --hair:#e5e5e7; --hair-2:#d2d2d7; --blue:#0066cc; --up:#1d8a3f; --down:#d70015; --amber:#b25e00;
    --shadow:0 4px 24px rgba(0,0,0,.06);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Pretendard',-apple-system,'Segoe UI',sans-serif;
    -webkit-font-smoothing:antialiased;line-height:1.5;font-feature-settings:"tnum"}
  a{color:inherit;text-decoration:none}
  .nav{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:26px;height:48px;padding:0 32px;
    background:rgba(255,255,255,.72);backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid var(--hair)}
  .brand{font-size:14px;font-weight:700;display:flex;align-items:center;gap:7px}
  .brand .dot{width:6px;height:6px;border-radius:50%;background:var(--ink)}
  .nav a.lnk{color:var(--ink-2);font-size:13px;font-weight:500}
  .nav a.lnk:hover,.nav a.lnk.on{color:var(--ink)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 32px}
  .hero{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;padding:56px 0 22px;flex-wrap:wrap}
  .hero h1{font-size:clamp(40px,6vw,66px);font-weight:800;letter-spacing:-.04em;line-height:.98}
  .hero .tag{font-size:clamp(15px,2vw,18px);color:var(--ink-2);font-weight:500;padding-bottom:6px}
  .hero .tag b{color:var(--ink);font-weight:700}

  .wl{background:var(--bg-2);border-radius:22px;padding:18px 24px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .wl-lbl{font-size:13px;font-weight:700;display:flex;align-items:center;gap:6px}
  .wl-chip{padding:8px 14px;border-radius:980px;background:#fff;border:1px solid var(--hair-2);font-size:13.5px;font-weight:600}
  .wl-manage{margin-left:auto;font-size:13px;font-weight:600;color:var(--blue)}
  .wl-empty{font-size:13px;color:var(--ink-3)}

  .sec{padding:36px 0 20px}
  .sec-head{display:flex;align-items:baseline;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:4px}
  .sec-head h2{font-size:clamp(26px,4vw,36px);font-weight:700;letter-spacing:-.02em}
  .sec-head .cnt{color:var(--ink-3);font-size:14px;font-weight:600}
  .sec-sub{font-size:14px;color:var(--ink-3);margin-bottom:18px}
  .tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:20px}
  .tab{font-family:inherit;font-size:13.5px;font-weight:600;color:var(--ink-2);background:#fff;
    border:1px solid var(--hair-2);border-radius:980px;padding:8px 16px;cursor:pointer;transition:.15s}
  .tab:hover{border-color:var(--ink-3)} .tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}

  .grid{display:grid;grid-template-columns:1.3fr 1fr;gap:20px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}
  .panel{background:var(--bg-2);border-radius:22px;padding:22px 24px}
  .panel h3{font-size:15px;font-weight:700;margin-bottom:4px}
  .panel .ph-sub{font-size:12.5px;color:var(--ink-3);margin-bottom:12px}

  .ev{display:grid;grid-template-columns:56px 1fr auto;align-items:center;gap:12px;padding:13px 4px;border-top:1px solid var(--hair-2)}
  .ev:first-of-type{border-top:none}
  .dday{font-size:12px;font-weight:800;text-align:center;border-radius:8px;padding:5px 0}
  .dday.soon{background:rgba(215,0,21,.1);color:var(--down)}
  .dday.near{background:rgba(178,94,0,.12);color:var(--amber)}
  .dday.far{background:#fff;color:var(--ink-3);border:1px solid var(--hair-2)}
  .ev .nm{font-size:14.5px;font-weight:600}
  .ev .meta{font-size:12px;color:var(--ink-3);margin-top:2px;display:flex;gap:7px;align-items:center;flex-wrap:wrap}
  .kind{font-size:11px;font-weight:700;color:var(--ink-2);background:#fff;border:1px solid var(--hair-2);border-radius:5px;padding:1px 6px}
  .conf{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700}
  .conf .d{width:9px;height:9px;border-radius:50%}
  .conf.c1 .d{background:var(--ink)} .conf.c1{color:var(--ink)}
  .conf.c2 .d{background:linear-gradient(90deg,var(--ink) 50%,#fff 50%);border:1px solid var(--ink-3)} .conf.c2{color:var(--ink-2)}
  .conf.c3 .d,.conf.c4 .d{background:#fff;border:1.5px solid var(--ink-3)} .conf.c3,.conf.c4{color:var(--ink-3)}
  .scope{font-size:11px;font-weight:600;color:var(--ink-3)}
  .empty{color:var(--ink-3);font-size:14px;padding:24px 4px;text-align:center}
  .soon-box{color:var(--ink-3);font-size:13px;padding:14px 4px}
  .loading{color:var(--ink-3);font-size:14px;padding:24px 4px;text-align:center}
  .foot{padding:30px 0 60px;border-top:1px solid var(--hair);color:var(--ink-3);font-size:12px;text-align:center;margin-top:24px}
</style>
</head>
<body>
  <nav class="nav">
    <span class="brand"><span class="dot"></span>로또의 주식</span>
    <a class="lnk" href="/">딸깍</a><a class="lnk" href="/market">섹터맵</a>
    <a class="lnk" href="/">인사이트</a><a class="lnk on" href="/catalysts">이벤트</a>
  </nav>

  <div class="wrap">
    <section class="hero">
      <h1>다가오는 이벤트.</h1>
      <div class="tag">내 종목·섹터의 일정과 트리거를, <b>열자마자 차려놓게.</b></div>
    </section>

    <section class="wl">
      <span class="wl-lbl">⭐ 내 종목</span>
      <span id="wlChips" style="display:flex;gap:8px;flex-wrap:wrap"><span class="wl-empty">불러오는 중…</span></span>
      <a class="wl-manage" href="/market">관심종목 관리 →</a>
    </section>

    <section class="sec">
      <div class="sec-head"><h2>📅 다가오는 이벤트</h2><span class="cnt" id="catCount"></span></div>
      <div class="sec-sub">국내·해외·정책 일정을 종목에 연결해 D-정렬로 정리했어요. 향후 30일.</div>
      <div class="tabs" id="tabs"></div>
      <div class="grid">
        <div class="panel">
          <h3>🗓️ 확정 일정 · 트리거</h3>
          <div class="ph-sub">D-정렬 · 확정도 표시</div>
          <div id="evList"><div class="loading">불러오는 중…</div></div>
        </div>
        <div class="panel">
          <h3>🌀 진행형 사가</h3>
          <div class="ph-sub">일정이 계속 바뀌는 장기 사업 추적</div>
          <div class="soon-box">곧 제공돼요 — 캐나다 잠수함처럼 진행형 사업의 마일스톤 타임라인 추적(Phase 3).</div>
        </div>
      </div>
    </section>
  </div>
  <div class="foot">로또의 주식 · 다가오는 이벤트</div>

<script>
  const TABS = [["내 종목", {mine:1}], ["반도체", {mine:0, sector:"반도체"}], ["조선", {mine:0, sector:"조선"}],
                ["바이오", {mine:0, sector:"바이오"}], ["매크로", {mine:0, sector:"매크로"}], ["전체", {mine:0}]];
  let cur = 0;
  const SCOPE_FLAG = {foreign:"🌏 해외", policy:"🏛 정책", domestic:""};

  document.getElementById("tabs").innerHTML = TABS.map((t,i)=>
    `<button class="tab ${i===cur?'on':''}" data-i="${i}">${t[0]}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b=>b.addEventListener("click",()=>{
    cur=+b.dataset.i; document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b)); loadCatalysts();
  }));

  function ddClass(d){return d<=3?"soon":d<=7?"near":"far";}
  function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

  async function loadWatchlist(){
    try{
      const r = await fetch("/api/watchlist?flow=0"); const j = await r.json();
      const names = (j.items||[]).map(it=>it.name).filter(Boolean);
      document.getElementById("wlChips").innerHTML = names.length
        ? names.map(n=>`<span class="wl-chip">${esc(n)}</span>`).join("")
        : `<span class="wl-empty">아직 관심종목이 없어요 · 오른쪽에서 추가</span>`;
    }catch(e){ document.getElementById("wlChips").innerHTML = `<span class="wl-empty">불러오기 실패</span>`; }
  }

  async function loadCatalysts(){
    const q = TABS[cur][1];
    const params = new URLSearchParams({mine:q.mine, days:30});
    if(q.sector) params.set("sector", q.sector);
    const el = document.getElementById("evList");
    el.innerHTML = `<div class="loading">불러오는 중…</div>`;
    try{
      const r = await fetch("/api/catalysts?"+params.toString()); const j = await r.json();
      document.getElementById("catCount").textContent =
        (cur===0?"내 종목 기준 · ":TABS[cur][0]+" · ") + j.count + "건";
      if(!j.events || !j.events.length){
        el.innerHTML = `<div class="empty">예정된 이벤트가 없어요.<br><span style="font-size:12px">(오늘 캘린더 수집분이 비어있어요 — 데일리 수집 후 채워져요)</span></div>`;
        return;
      }
      el.innerHTML = j.events.map(e=>{
        const cc = "c"+(e.confidence||4);
        const ct = {1:"확정",2:"높음",3:"관측",4:"추정"}[e.confidence||4];
        const flag = SCOPE_FLAG[e.entity_scope]||"";
        return `<div class="ev">
          <div class="dday ${ddClass(e.dday)}">D-${e.dday}</div>
          <div><div class="nm">${esc(e.asset)}</div>
            <div class="meta"><span>${esc(e.event_date)}</span>
              <span class="kind">${esc(e.event_kind)}</span>
              <span class="conf ${cc}"><span class="d"></span>${ct}</span>
              ${flag?`<span class="scope">${flag}</span>`:""}</div></div>
          <div style="font-size:12px;color:var(--ink-3);max-width:220px;text-align:right">${esc(e.content)}</div>
        </div>`;
      }).join("");
    }catch(e){ el.innerHTML = `<div class="empty">불러오기 실패</div>`; }
  }

  loadWatchlist(); loadCatalysts();
</script>
</body>
</html>
