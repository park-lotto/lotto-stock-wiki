<!doctype html><meta charset="utf-8"><title>릴리리아 자막 프리셋</title>
<style>

  .nav{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:26px}

  .card{background:#1a1a1a;border-radius:12px;overflow:hidden}
  .card video{width:100%;aspect-ratio:1080/520;object-fit:cover;background:#000;display:block}
  .card .b{padding:9px 12px}
  .card .n{font-weight:700;font-size:14px}
  .card .m{color:#9ab;font-size:12px;margin-top:3px;line-height:1.4}
  .card .src{color:#667;font-size:11px;margin-top:4px}

  .dash .big small{font-size:14px;color:#7f95a8;font-weight:400}
  .bars{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px 20px;margin-top:6px}
  .bar{font-size:12px}
  .bar .lab{display:flex;justify-content:space-between;margin-bottom:3px;color:#cbd}
  .bar .lab .num{color:#7f95a8}
  .bar .track{height:7px;background:#242424;border-radius:4px;overflow:hidden}
  .bar .fill{height:100%;background:linear-gradient(90deg,#2f7d46,#4bbf6b);border-radius:4px}
  .bar.new .fill{background:linear-gradient(90deg,#7a5a1e,#c99a3a)}
  .bar.new .lab .tag{color:#c99a3a;font-size:10px;margin-left:4px}

// 각 카테고리 현재 보유 수
const countOf = id => items.filter(it => it.cat === id).length;

// ── 진척 대시보드 ──
const totalNow = items.length;
const totalTarget = CATS.reduce((s,c)=>s+c.target,0);
const pct = Math.round(totalNow/totalTarget*100);
let barsHtml = '';
for (const cat of CATS) {
  const now = countOf(cat.id);
  const p = Math.min(100, Math.round(now/cat.target*100));
  barsHtml += `<div class="bar ${cat.planned?'new':''}">
    <div class="lab"><span>${cat.icon} ${cat.name.split(' · ')[0]}${cat.planned?'<span class="tag">예정</span>':''}</span><span class="num">${now}/${cat.target}</span></div>
    <div class="track"><div class="fill" style="width:${p}%"></div></div></div>`;
}

  `<h3>유료급 라이브러리 진척</h3>
   <div class="goal">목표: 숏츠 제작 시 컷 성격마다 골라 쓰는 프로급 자막·효과 풀세트 (13 카테고리)</div>
   <div class="big">${totalNow}<small> / ${totalTarget}종 · ${pct}%</small></div>
   <div class="bars">${barsHtml}</div>`;

// ── 카테고리 섹션 ──

const cats = document.getElementById('cats');

  const list = items.filter(it => it.cat === cat.id);
  const a = document.createElement('a'); a.href = '#'+cat.id;
  a.innerHTML = `${cat.icon} ${cat.name}<span class="cnt">${list.length}/${cat.target}</span>`;
  if (cat.planned) a.style.opacity = .6;
  nav.appendChild(a);

  const sec = document.createElement('section'); sec.id = cat.id;
  const head = `<div class="sechead"><h2>${cat.icon} ${cat.name}</h2><span class="cnt">${list.length}/${cat.target}종</span></div>
    <p class="when">이럴 때 → ${cat.when}</p>`;
  if (!list.length) {
    // 아직 카드 없는 신규 카테고리 = 예정 안내
    sec.innerHTML = head + `<p class="when" style="color:#c99a3a;background:#231e16;border-left-color:#7a5a1e">🚧 제작 예정 — 목표 ${cat.target}종. 컴포넌트 설계 후 채운다.</p>`;
    cats.appendChild(sec); continue;
  }
  sec.innerHTML = head + `<div class="grid"></div>`;
  const g = sec.querySelector('.grid');
  for (const it of list) {
    const c = document.createElement('div'); c.className='card';
    c.innerHTML = `<video muted loop playsinline preload="metadata" poster="media/${it.file}.png" src="media/${it.file}.mp4"></video>
    <div class="b"><div class="n">${it.name}</div><div class="m">${it.desc}</div><div class="src">원본 ${it.src}</div></div>`;
    const v = c.querySelector('video');
    c.addEventListener('mouseenter',()=>v.play().catch(()=>{}));
    c.addEventListener('mouseleave',()=>{v.pause();});
    g.appendChild(c);
  }
  cats.appendChild(sec);
}

// note
document.getElementById('note').innerHTML =
  `<b>지금 ${totalNow}종 / 목표 ${totalTarget}종 · 13 카테고리</b><br>`+
  `계획 문서: <code>docs/superpowers/specs/2026-09-13-자막효과-라이브러리-로드맵.md</code><br>`+
  `한 컴포넌트에 색·문구만 바꾸면 계열 변형이 무한히 나온다 — 위 카드는 각 스타일의 대표 샘플이다. `+
  `우선순위: ① 말하는자막·리액션·로워서드 보강 → ② 타이틀·구독·수치 신규 → ③ 밈·질문·전환 → ④ 테마·대화·색변형.`;

// 화면에 보이면 자동재생
const io = new IntersectionObserver(es=>es.forEach(e=>{const v=e.target;e.isIntersecting?v.play().catch(()=>{}):v.pause();}),{threshold:0.25});
document.querySelectorAll('video').forEach(v=>io.observe(v));
</script>
