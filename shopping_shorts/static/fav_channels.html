<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>볼채널등록 · 숏템메이커</title>
<script>(function(){try{var t=localStorage.getItem('ssTheme');if(t)document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<style>
  /* collection.html과 같은 토큰 — 두 즐겨찾기 화면이 한 벌로 보여야 한다. */
:root{--bg:#0a0f0d;--panel:#101815;--line:#1e2b26;--txt:#eaf3f0;--sub:#8fa1a0;--accent:#37e0bd;--accent2:#1f9e7a;--fire:#ff6b6b;--ok:#37e0bd;--gold:#f0c453;--inset:#0c1412;--sel-fg:#6ff0d6;--hover:#131d19;color-scheme:dark;}
:root[data-theme="light"]{--bg:#f4faf7;--panel:#ffffff;--line:#d5e6df;--txt:#0f1a16;--sub:#5c726d;--accent:#12b886;--accent2:#0ca678;--fire:#e0524a;--ok:#12b886;--gold:#b8860b;--inset:#eef7f3;--sel-fg:#0a7d66;--hover:#eef7f3;color-scheme:light;}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic',system-ui,sans-serif;margin:0;min-height:100vh}
  .main{flex:1;padding:24px 32px;overflow:auto}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .head h2{margin:0;font-size:22px}
  .head .desc{color:var(--sub);font-size:13px;margin-top:4px;line-height:1.6}
  .addbar{display:flex;gap:8px;margin:0 0 18px;flex-wrap:wrap}
  .addbar input{flex:1;min-width:280px;background:var(--inset);border:1px solid var(--line);color:var(--txt);
    border-radius:10px;padding:11px 14px;font-size:13.5px;font-family:inherit}
  .addbar input:focus{outline:none;border-color:var(--accent)}
  .addbar button{border:0;border-radius:10px;padding:11px 20px;cursor:pointer;font-size:13px;font-weight:700;
    background:var(--accent2);color:#fff;font-family:inherit}
  #addMsg{font-size:12.5px;color:var(--sub);align-self:center}
  .cap{font-size:12px;color:var(--sub)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  /* 썸네일 상자는 min-height로 세운다 — 안쪽 img에만 높이를 주면 그림이 없는 채널에서
     상자가 0px로 접혀 카드가 무너진다(collection.html이 같은 이유로 겪은 실사고). */
  .thumb{position:relative;background:#000;min-height:200px;display:flex;align-items:center;justify-content:center}
  .thumb img{width:100%;height:200px;object-fit:cover;display:block}
  .thumb .none{color:#4a5a56;font-size:12px;text-align:center;padding:0 12px;line-height:1.7}
  .plat{position:absolute;top:8px;left:8px;font-size:11px;font-weight:800;padding:3px 8px;border-radius:20px;
    background:rgba(0,0,0,.62);color:#fff}
  .body{padding:12px;flex:1;display:flex;flex-direction:column;gap:6px}
  .nm{font-size:14px;font-weight:700;line-height:1.35;word-break:break-all}
  .id{font-size:11.5px;color:var(--sub);word-break:break-all}
  .fol{font-size:11.5px;color:var(--gold)}
  .btns{display:flex;gap:6px;margin-top:auto;padding-top:10px}
  /* ★nowrap 필수 — 카드 폭(210px)에 버튼 3개라 글자가 줄바꿈돼 "원본 열 기"처럼
     깨진다(2026-09-02 브라우저 실측). 라벨도 짧게 줄여 두 줄이 나올 여지를 없앤다. */
  .btns a,.btns button{flex:1;font-size:11px;padding:7px 2px;border-radius:7px;border:1px solid var(--line);
    background:var(--inset);color:var(--txt);cursor:pointer;text-align:center;text-decoration:none;
    font-family:inherit;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .btns a.view{border-color:var(--accent);color:var(--sel-fg)}
  .btns button.del:hover{border-color:var(--fire);color:var(--fire)}
  .empty{color:var(--sub);text-align:center;padding:60px 20px;grid-column:1/-1;line-height:1.9}
</style>
</head>
<body>
<main class="main">
  <div class="head">
    <div>
      <h2>⭐ 볼채널등록</h2>
      <div class="desc">눈여겨보는 채널을 모아둡니다. 인스타·틱톡·유튜브 화면에서 <b>⭐ 볼채널등록</b> 버튼으로 바로 담을 수 있어요.<br>
        여기 담아도 수집이 늘지 않습니다 — 순수 북마크입니다.</div>
    </div>
    <div class="cap" id="capMsg"></div>
  </div>
  <div class="addbar">
    <input id="addUrl" type="text" placeholder="🔗 채널(프로필) 주소 붙여넣기 — instagram.com/아이디 · tiktok.com/@아이디 · youtube.com/@채널"
           onkeydown="if(event.key==='Enter')addChannel()"/>
    <button onclick="addChannel()">담기</button>
    <span id="addMsg"></span>
  </div>
  <div class="cards" id="cards"></div>
</main>
<script>
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
const PLAT_LABEL={instagram:"인스타",tiktok:"틱톡",youtube:"유튜브",threads:"쓰레드",xiaohongshu:"샤오홍슈",douyin:"도우인"};
let ITEMS=[], CAP=50;

// ★열 때 1회만 갱신한다(사장님 확정 2026-09-02). 목록은 먼저 그리고, 갱신 결과가
//   오면 다시 그린다 — 갱신을 기다리느라 빈 화면을 보여주지 않는다.
//   갱신이 실패해도 옛 값으로 계속 보인다(서버가 실패를 삼킨다).
async function load(){
  try{
    const d=await (await fetch('/api/fav_channel/list')).json();
    ITEMS=(d.items||[]).slice().reverse();   // 최근에 담은 게 맨 위
    if(d.cap) CAP=d.cap;
  }catch(e){ ITEMS=[]; }
  render();
  try{
    const r=await (await fetch('/api/fav_channel/refresh',{method:'POST'})).json();
    if(r && r.ok && r.items){ ITEMS=r.items.slice().reverse(); render(); }
  }catch(e){}
}
function fmtFollowers(n){
  if(n==null||n==='') return '';
  n=Number(n)||0;
  return n>=10000 ? '팔로워 '+(n/10000).toFixed(1)+'만' : '팔로워 '+n.toLocaleString();
}
function render(){
  const wrap=document.getElementById('cards');
  document.getElementById('capMsg').textContent=ITEMS.length+' / '+CAP+'개';
  if(!ITEMS.length){
    wrap.innerHTML='<div class="empty">아직 담은 채널이 없습니다.<br>'+
      '위에 채널 주소를 붙여넣거나, 인스타·틱톡·유튜브 화면의 <b>⭐ 볼채널등록</b> 버튼을 눌러보세요.</div>';
    return;
  }
  wrap.innerHTML=ITEMS.map(card).join('');
  // 만료된 썸네일(인스타 CDN은 며칠이면 403)을 검은 칸으로 두지 않는다 —
  // onerror 속성 대신 여기서 걸어 따옴표 중첩(HTML 문자열 안의 JS) 함정을 피한다.
  wrap.querySelectorAll('img[data-thumb]').forEach(function(img){
    img.addEventListener('error', function(){
      img.style.display='none';
      const box=img.parentNode;
      if(box && !box.querySelector('.none')){
        const d=document.createElement('div');
        d.className='none'; d.textContent='이미지가 만료됐어요';
        box.appendChild(d);
      }
    });
  });
}
function card(it){
  const thumb=it.last_video_thumb||it.avatar||'';
  const inner = thumb
    ? '<img data-thumb="1" src="'+esc(thumb)+'">'
    : '<div class="none">아직 받아온 그림이 없어요<br>수집된 영상이 생기면 채워집니다</div>';
  return '<div class="card">'+
    '<div class="thumb">'+inner+'<span class="plat">'+esc(PLAT_LABEL[it.platform]||it.platform||'')+'</span></div>'+
    '<div class="body">'+
      '<div class="nm">'+esc(it.name||it.channel_id||'')+'</div>'+
      '<div class="id">@'+esc(it.channel_id||'')+'</div>'+
      (it.followers?'<div class="fol">'+esc(fmtFollowers(it.followers))+'</div>':'')+
      '<div class="btns">'+
        '<a class="view" href="/?q='+encodeURIComponent(it.channel_id||'')+'">채널 보기</a>'+
        (it.url?'<a href="'+esc(it.url)+'" target="_blank" rel="noopener">원본</a>':'')+
        '<button class="del" data-plat="'+esc(it.platform||'')+'" data-cid="'+esc(it.channel_id||'')+'" '+
          'onclick="removeChannel(this)">빼기</button>'+
      '</div>'+
    '</div></div>';
}
async function addChannel(){
  const box=document.getElementById('addUrl'), msg=document.getElementById('addMsg');
  const v=(box.value||'').trim();
  if(!v){ msg.textContent='채널 주소를 넣어주세요'; return; }
  msg.textContent='담는 중…';
  try{
    const d=await (await fetch('/api/fav_channel/add',{method:'POST',
      headers:{'Content-Type':'application/json'},body:JSON.stringify({url:v})})).json();
    if(d.ok){ msg.textContent=d.added?'✅ 담았어요':'✔ 이미 담겨 있어요'; box.value=''; await load(); }
    else { msg.textContent='⚠ '+(d.error||'실패'); }
  }catch(e){ msg.textContent='⚠ 통신 오류'; }
}
async function removeChannel(btn){
  try{
    await fetch('/api/fav_channel/remove',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({platform:btn.getAttribute('data-plat'),
                           channel_id:btn.getAttribute('data-cid')})});
  }catch(e){}
  await load();
}
load();
</script>
<script src="/sidebar.js?v=2"></script>
</body>
</html>
