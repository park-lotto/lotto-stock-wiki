<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑쇼츠 레퍼런스 랭킹</title>
<style>
  :root{--bg:#0a0e14;--panel:#111722;--line:#1e2735;--txt:#e6edf3;--sub:#8b98a9;--accent:#2f81f7;--fire:#ff6b35;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic',system-ui,sans-serif;display:flex;min-height:100vh}
  .sidebar{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:16px;flex-shrink:0}
  .sidebar h1{font-size:14px;color:var(--sub);margin-bottom:16px}
  .menu-group{margin-bottom:18px}
  .menu-group .label{font-size:11px;color:var(--sub);text-transform:uppercase;margin-bottom:8px}
  .menu-item{padding:8px 12px;border-radius:8px;font-size:13px;color:var(--txt);cursor:default;margin-bottom:2px}
  .menu-item.active{background:linear-gradient(90deg,#153a6b,#0d2340);color:#7db4ff}
  .main{flex:1;padding:28px 36px;overflow:auto}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .head h2{font-size:24px}
  .desc{color:var(--sub);font-size:13px;margin-bottom:20px}
  .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  button{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:13px;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  .tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab{padding:10px 16px;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--txt);border-bottom-color:var(--accent)}
  .ctypes{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  .ctype{padding:9px 16px;border:1px solid var(--line);border-radius:10px;font-size:13px;font-weight:600;color:var(--sub);cursor:pointer;background:#0d131c}
  .ctype:hover{border-color:var(--accent);color:#7db4ff}
  .ctype.active{background:linear-gradient(90deg,#153a6b,#0d2340);color:#7db4ff;border-color:var(--accent)}
  .cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;min-height:0}
  .cats:empty{margin-bottom:0}
  .cat{padding:6px 12px;border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--sub);cursor:pointer}
  .cat.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .card img{width:100%;height:220px;object-fit:cover;background:#000}
  .thumb{position:relative;cursor:pointer}
  .thumb-video{width:100%;height:220px;object-fit:cover;background:#000;display:block}
  .play-badge{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
              width:52px;height:52px;border-radius:50%;background:rgba(0,0,0,.5);color:#fff;
              font-size:20px;display:flex;align-items:center;justify-content:center;
              pointer-events:none;border:2px solid rgba(255,255,255,.85)}
  .card .body{padding:12px;flex:1;display:flex;flex-direction:column}
  .card .rank{font-size:12px;color:var(--sub)}
  .card .ch{font-weight:600;font-size:14px;margin:4px 0;display:flex;align-items:center;justify-content:space-between;gap:6px}
  .card .ch .chname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .copy{flex-shrink:0;background:#0d131c;border:1px solid var(--line);color:var(--sub);font-size:12px;padding:4px 7px;border-radius:6px;cursor:pointer;line-height:1}
  .copy:hover{color:#7db4ff;border-color:#2f81f7}
  .copy.copied{background:#2ea043;border-color:#2ea043;color:#fff}
  .stat{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:4px}
  .stat b{color:var(--txt)}
  .grade{font-size:14px}
  .delta-up{color:var(--fire)}
  .links{display:flex;gap:8px;margin-top:10px}
  .links a{font-size:12px;color:var(--accent);text-decoration:none}
  .empty{color:var(--sub);text-align:center;padding:60px;grid-column:1/-1}
  .btns{display:flex;gap:6px;margin-top:auto;padding-top:10px}
  .btns button{flex:1;font-size:11px;padding:7px 4px;border-radius:7px;border:1px solid var(--line);background:#0d131c;color:var(--txt);cursor:pointer}
  .btns button.view{border-color:#2f81f7;color:#7db4ff}
  .btns button.comment{background:linear-gradient(90deg,#7b2ff7,#c22ed0);border:none;color:#fff}
  .btns button.save.saved{background:#2ea043;border-color:#2ea043;color:#fff}
  .script-btn{width:100%;margin-top:6px;padding:8px;border-radius:7px;border:1px solid #b8860b;
              background:linear-gradient(90deg,#3a2f0d,#2a2408);color:#ffd76b;font-size:12px;cursor:pointer}
  .script-btn:hover{background:linear-gradient(90deg,#4a3d10,#352d0a)}
  .script-btn:disabled{opacity:.6;cursor:wait}
  /* 대본 모달 */
  /* 화면을 막지 않는 이동식(플로팅) 창 — 컨테이너는 클릭 통과, 박스만 잡힘 */
  .modal-bg{display:none;position:fixed;inset:0;z-index:100;pointer-events:none}
  .modal-bg.open{display:block}
  .modal-box{position:absolute;top:14px;left:50%;transform:translateX(-50%);pointer-events:auto;
             background:var(--panel);border:1px solid var(--line);border-radius:14px;
             width:min(720px,94vw);max-height:80vh;display:flex;flex-direction:column;overflow:hidden;
             box-shadow:0 10px 44px rgba(0,0,0,.6)}
  .modal-head{display:flex;align-items:center;justify-content:space-between;gap:8px;
              padding:14px 18px;border-bottom:1px solid var(--line);cursor:move;user-select:none}
  .modal-head b{font-size:15px}
  .modal-head .x{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer;padding:0 4px}
  .modal-body{padding:16px 18px;overflow:auto}
  .sm-full{background:#0d131c;border:1px solid var(--line);border-radius:8px;padding:12px;
           font-size:14px;line-height:1.7;white-space:pre-wrap;color:var(--txt)}
  .sm-sec{display:flex;align-items:center;justify-content:space-between;margin:18px 0 8px}
  .sm-sec b{font-size:13px;color:var(--sub)}
  .sm-copy{background:#0d131c;border:1px solid var(--line);color:var(--sub);font-size:12px;
           padding:5px 10px;border-radius:6px;cursor:pointer}
  .sm-copy:hover{color:#7db4ff;border-color:var(--accent)}
  .sm-copy.done{background:#2ea043;border-color:#2ea043;color:#fff}
  .wiki-save{background:linear-gradient(90deg,#3a2f0d,#2a2408);border:1px solid #b8860b;color:#ffd76b;
             font-size:12px;padding:5px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
  .wiki-save:hover{background:linear-gradient(90deg,#4a3d10,#352d0a)}
  .wiki-save:disabled{opacity:.7;cursor:wait}
  .wiki-save.done{background:#2ea043;border-color:#2ea043;color:#fff}
  .sm-seg{border-left:2px solid var(--line);padding:6px 0 6px 12px;margin-bottom:10px}
  .sm-seg .t{font-size:11px;color:var(--accent);margin-bottom:2px}
  .sm-seg .txt{font-size:13px;line-height:1.5}
  .sm-seg .scene{font-size:11px;color:var(--sub);margin-top:2px}
  .sm-loading{text-align:center;padding:40px;color:var(--sub);font-size:14px}
  .sm-err{padding:24px;color:#ff9b9b;font-size:14px;text-align:center}
  @media (max-width: 768px){
    body{flex-direction:column;min-height:100vh}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px;
             display:flex;gap:6px;overflow-x:auto;align-items:center;white-space:nowrap}
    .sidebar h1{margin:0 8px 0 0;flex-shrink:0}
    .sidebar .menu-group{margin:0;display:flex;gap:6px;align-items:center}
    .sidebar .menu-group .label{display:none}
    .menu-item{margin:0;padding:6px 10px;flex-shrink:0;font-size:12px}
    .main{padding:16px 14px}
    .cards{grid-template-columns:repeat(2,1fr);gap:10px}
    .head h2{font-size:20px}
    .toolbar{gap:8px}
    .tabs{overflow-x:auto}
    .cats{overflow-x:auto;flex-wrap:nowrap}
    .progress-wrap{max-width:100%}
  }
  @media (max-width: 420px){
    .cards{grid-template-columns:repeat(2,1fr);gap:8px}
    .card .body{padding:8px}
    .stat{font-size:11px}
    .btns button{font-size:10px;padding:6px 2px}
  }
</style>
</head>
<body>
  <main class="main">
    <div class="head">
      <h2>📊 레퍼런스 랭킹</h2>
    </div>
    <div class="desc">443개 레퍼런스 채널의 48시간 이내 릴스를 강도별로 랭킹합니다.</div>
    <div class="ctypes" id="platformTabs" style="margin-bottom:12px">
      <div class="ctype active" data-platform="instagram" onclick="switchPlatform('instagram',this)">📷 인스타</div>
      <div class="ctype" data-platform="youtube" onclick="switchPlatform('youtube',this)">▶️ 유튜브</div>
      <div class="ctype" data-platform="tiktok" onclick="switchPlatform('tiktok',this)">🎵 틱톡</div>
    </div>
    <div id="seedPanel" style="display:none;margin-bottom:12px">
      <div id="ttMode" style="display:none;margin-bottom:6px">
        <label style="font-size:12px;color:var(--sub);cursor:pointer"><input type="radio" name="ttmode" value="keyword" checked onclick="ttModeChange()"> 🔎 키워드 검색발굴</label>
        <label style="font-size:12px;color:var(--sub);cursor:pointer;margin-left:12px"><input type="radio" name="ttmode" value="account" onclick="ttModeChange()"> 🎵 계정 시드</label>
      </div>
      <input id="seedInput" type="text" placeholder="검색 키워드 (예: 살림꿀팁)" style="padding:8px;border-radius:6px;border:1px solid var(--line);background:#0d131c;color:var(--txt)">
      <select id="seedLang" title="검색 언어(지역) — 한국어면 국내영상, 다른 언어면 그 나라 영상 발굴" style="padding:8px;border-radius:6px;border:1px solid var(--line);background:#0d131c;color:var(--txt)">
        <option value="ko">🇰🇷 한국어</option><option value="en">🇺🇸 영어</option>
        <option value="ja">🇯🇵 일본어</option><option value="zh">🇹🇼 중국어</option><option value="ru">🇷🇺 러시아어</option>
      </select>
      <button onclick="addSeed()">+ 키워드</button>
      <span id="seedHint" style="font-size:11px;color:var(--sub)">한국어 외 언어 선택 시 자동 번역해 등록</span>
      <div id="seedList" style="margin-top:6px;font-size:12px;color:var(--sub)"></div>
      <div id="ttPanel" style="display:none;margin-top:10px;padding:10px;border:1px solid var(--line);border-radius:8px;background:#0d131c">
        <div style="font-size:12px;color:var(--sub);margin-bottom:8px">⚙️ 틱톡 키워드검색 설정 <span style="font-size:11px">— Apify 유료($1.70/1,000건). 선택 언어로 검색, 부족하면 다른 언어로 확장</span></div>
        <label style="font-size:12px;color:var(--sub)">언어당 개수 <input id="ttCount" type="number" min="10" max="200" style="width:64px;padding:4px;border-radius:6px;border:1px solid var(--line);background:#0d131c;color:var(--txt)"></label>
        <label style="font-size:12px;color:var(--sub);margin-left:10px">하루 수집횟수 <input id="ttDaily" type="number" min="1" max="100" style="width:56px;padding:4px;border-radius:6px;border:1px solid var(--line);background:#0d131c;color:var(--txt)"></label>
        <label style="font-size:12px;color:var(--sub);margin-left:10px">월 예산($) <input id="ttBudget" type="number" min="0" step="0.5" style="width:64px;padding:4px;border-radius:6px;border:1px solid var(--line);background:#0d131c;color:var(--txt)"></label>
        <button onclick="saveTtSettings()" style="margin-left:8px">저장</button>
        <div id="ttStatus" style="margin-top:6px;font-size:11px;color:var(--sub)"></div>
      </div>
    </div>
    <div class="toolbar">
      <button id="collectBtn" onclick="doCollect()">⚡ 지금 수집</button>
      <span id="status" style="color:var(--sub);font-size:12px"></span>
    </div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="comments" title="댓글 수 그대로 정렬">📊 전체</div>
      <div class="tab" data-tab="speed" title="댓글수 ÷ 경과시간(시간) — 시간당 댓글이 얼마나 빨리 쌓이는지">⚡ 속도</div>
      <div class="tab" data-tab="accel" title="이번 수집 Δ(댓글 증가분) − 직전 수집 Δ — 증가세 자체가 빨라지고 있는지(가속도)">📈 가속</div>
      <div class="tab" data-tab="density" title="댓글수 ÷ 팔로워수 — 팔로워 규모 대비 반응이 얼마나 뜨거운지(작은 채널도 상위권 가능)">💥 참여밀도</div>
    </div>
    <div class="ctypes" id="ctypes"></div>
    <div class="cats" id="cats"></div>
    <div class="cards" id="cards">
      <div class="empty">「지금 수집」을 눌러 시작하세요.</div>
    </div>
  </main>
  <div class="modal-bg" id="scriptModal">
    <div class="modal-box">
      <div class="modal-head" onpointerdown="startDrag(event)"><b id="modalTitle">📝 대본 추출 <span style="font-size:11px;color:var(--sub);font-weight:400">— 잡고 이동</span></b><button class="x" onclick="closeScript()">✕</button></div>
      <div class="modal-body" id="scriptBody"></div>
    </div>
  </div>
<script>
// 유형(제작·수익화 방식) = 초보자 탐색 1차축. topics = 그 유형의 세부주제(2차축).
const CTYPES = [
  {key:"전체",  label:"✨ 전체",       topics:[]},
  {key:"비법형", label:"🔥 비법·꿀팁형", topics:["인테리어","레시피"]},
  {key:"제품형", label:"🛒 제품추천형",  topics:["생활용품","가전"]},
  {key:"혼합형", label:"💄 뷰티(혼합)",  topics:["뷰티"]},
];
const TOPIC_CTYPE = {인테리어:"비법형",레시피:"비법형",생활용품:"제품형",가전:"제품형",뷰티:"혼합형",기타:"기타"};
let STATE = {items:[], tab:"comments", ctype:"전체", cat:"전체"};
let PLATFORM='instagram';
function ttMode(){ const r=document.querySelector('input[name="ttmode"]:checked'); return r?r.value:'keyword'; }
function switchPlatform(p, el){
  PLATFORM=p;
  document.querySelectorAll('#platformTabs .ctype').forEach(x=>x.classList.remove('active'));
  el.classList.add('active');
  document.getElementById('seedPanel').style.display = (p==='instagram')?'none':'block';
  document.getElementById('ttMode').style.display = (p==='tiktok')?'block':'none';
  document.getElementById('ttPanel').style.display = (p==='tiktok' && ttMode()==='keyword')?'block':'none';
  if(p==='tiktok') loadTtSettings();
  ttModeChange();       // 입력 placeholder·언어선택기·설정패널 표시 갱신
  if(p!=='instagram') loadSeeds();
  loadLast();          // 기존 초기 로드 함수 — platform 반영하도록 아래 수정
}
const TT_LANG_KINDS=['ko','en','ja','zh','ru'];   // 틱톡 키워드 시드의 언어코드
function ttKeywordMode(){ return PLATFORM==='tiktok' && ttMode()==='keyword'; }
function ttModeChange(){
  const si=document.getElementById('seedInput');
  if(PLATFORM==='tiktok'){
    const kw = ttMode()==='keyword';
    if(si) si.placeholder = kw ? '틱톡 검색 키워드 (예: 곰팡이 제거)' : '틱톡 계정 (예: @salim__mami)';
    document.getElementById('ttPanel').style.display = kw?'block':'none';
    // 키워드 모드면 언어 선택기 노출(선택 언어로 검색·확장), 계정 모드면 숨김
    document.getElementById('seedLang').style.display = kw?'':'none';
    document.getElementById('seedHint').style.display = kw?'':'none';
    if(kw) document.getElementById('seedHint').textContent='선택 언어로 검색 — 한국어가 부족하면 영어 등 다른 언어로 확장';
  } else if(si){
    si.placeholder = '검색 키워드 (예: 살림꿀팁)';
  }
}
const LANGLABEL={ko:'🇰🇷',en:'🇺🇸',ja:'🇯🇵',zh:'🇹🇼',ru:'🇷🇺',keyword:'🇰🇷',account:'🎵'};
async function loadSeeds(){
  const d=await (await fetch('/api/seeds?platform='+PLATFORM)).json();
  const el=document.getElementById('seedList');
  const items=d.items||[];
  el.innerHTML = items.length ? items.map(s=>{
    const isLang = TT_LANG_KINDS.includes(s.kind);   // 틱톡 언어 시드 = 비용 대상
    return `<span class="${(PLATFORM==='tiktok'&&isLang)?'ttkw':''}" style="display:inline-block;background:#1a2230;border-radius:12px;padding:2px 8px;margin:2px 4px 0 0">
       ${LANGLABEL[s.kind]||''} ${s.value}
       <span style="cursor:pointer;color:#e0623d" onclick="removeSeed('${s.value.replace(/'/g,"\\'")}')">✕</span>
     </span>`;
  }).join('') : '키워드 없음';
  if(PLATFORM==='tiktok') renderTtStatus();
  // 유튜브 + 틱톡 키워드모드에서 언어 선택기 노출(계정 모드는 ttModeChange가 숨김)
  const showLang = (PLATFORM==='youtube') || ttKeywordMode();
  document.getElementById('seedLang').style.display = showLang?'':'none';
  document.getElementById('seedHint').style.display = showLang?'':'none';
}
async function addSeed(){
  const raw=document.getElementById('seedInput').value.trim(); if(!raw) return;
  if(PLATFORM==='tiktok' && ttMode()==='account'){
    await fetch('/api/seeds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:'tiktok',kind:'account',value:raw})});
    document.getElementById('seedInput').value=''; return loadSeeds();
  }
  // 유튜브 + 틱톡 키워드모드 공통: 선택 언어로 저장(비한국어는 번역), kind=언어코드
  const lang=document.getElementById('seedLang').value;
  let value=raw;
  if(lang!=='ko'){
    try{
      const t=await (await fetch('/api/find/translate_keyword',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({keyword:raw})})).json();
      value = (t.keywords && t.keywords[lang]) ? t.keywords[lang] : raw;   // 번역실패시 원문
    }catch(e){}
  }
  await fetch('/api/seeds',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:PLATFORM,kind:lang,value})});
  document.getElementById('seedInput').value=''; loadSeeds();
}
async function removeSeed(v){
  await fetch('/api/seeds',{method:'DELETE',headers:{'Content-Type':'application/json'},body:JSON.stringify({platform:PLATFORM,value:v})});
  loadSeeds();
}
let TT_KNOBS={search_count:50,daily_limit:10,month_budget:5.0};
async function loadTtSettings(){
  try{
    const d=await (await fetch('/api/tiktok/settings')).json();
    if(!d.ok) return;
    TT_KNOBS=d;
    document.getElementById('ttCount').value=d.search_count;
    document.getElementById('ttDaily').value=d.daily_limit;
    document.getElementById('ttBudget').value=d.month_budget;
    renderTtStatus();
  }catch(e){}
}
function renderTtStatus(){
  const el=document.getElementById('ttStatus'); if(!el) return;
  const nlang = document.querySelectorAll('#seedList .ttkw').length;   // 언어 시드 수 = 검색 횟수
  // 언어 시드 1개 = 1회 검색(검색개수개). 지출 = 언어시드수 × 검색개수 × $0.0017
  const est = (nlang * TT_KNOBS.search_count * 0.0017);
  const rem = (TT_KNOBS.remaining_today!=null) ? TT_KNOBS.remaining_today : TT_KNOBS.daily_limit;
  const spent = Number(TT_KNOBS.month_spend||0);

function fmtTime(iso){
  // collected_at은 UTC로 저장됨 — 브라우저 로컬시간(한국이면 KST)으로 변환해 표시
  // (그냥 슬라이스하면 UTC 그대로 떠서 실제 시각보다 9시간 늦게 보이던 문제, 2026-07-09)
  if(!iso) return '-';
  const d = new Date(iso);
  if(isNaN(d)) return iso.slice(0,16);
  return d.toLocaleString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}

      const label = d.error_code==='budget_exceeded' ? '💰 월 예산 초과' : '🚫 오늘 한도 초과';

let _sdrag=null;
function startDrag(e){
  if(e.target.closest('.x')) return;                 // X 버튼은 드래그 시작 안 함
  const box=document.querySelector('#scriptModal .modal-box');
  const r=box.getBoundingClientRect();
  box.style.transform='none'; box.style.left=r.left+'px'; box.style.top=r.top+'px';
  _sdrag={dx:e.clientX-r.left, dy:e.clientY-r.top, box};
  window.addEventListener('pointermove',_onDrag);
  window.addEventListener('pointerup',_endDrag);
  e.preventDefault();
}
function _onDrag(e){
  if(!_sdrag) return;
  const w=_sdrag.box.offsetWidth;
  const x=Math.max(120-w, Math.min(e.clientX-_sdrag.dx, window.innerWidth-120));
  const y=Math.max(0, Math.min(e.clientY-_sdrag.dy, window.innerHeight-44));
  _sdrag.box.style.left=x+'px'; _sdrag.box.style.top=y+'px';
}
function _endDrag(){ _sdrag=null; window.removeEventListener('pointermove',_onDrag); window.removeEventListener('pointerup',_endDrag); }
// 썸네일 클릭 → 인라인 재생(보기 안 눌러도 됨). URL 만료 시 안내.
function playInline(img){
  const url=img.dataset.vurl;
  if(!url) return;
  const badge=img.parentElement && img.parentElement.querySelector('.play-badge');
  if(badge) badge.remove();
  const v=document.createElement('video');
  v.src=url; v.controls=true; v.autoplay=true; v.playsInline=true; v.setAttribute('playsinline','');
  v.className='thumb-video';
  v.onerror=()=>{ v.replaceWith(img); img.title='영상 URL 만료 — 「지금 수집」 후 재생 가능'; };
  img.replaceWith(v);
}
// 유튜브/틱톡: 우리가 뽑은 mp4 direct URL로 재생(same-origin canvas 캡처 가능).
// mp4 확보 실패(비공개·지역차단) 시 기존 embed(iframe)로 폴백 — 재생은 되게(캡처만 불가).
async function _playViaMedia(img, videoId, platform, embedFn){
  if(!videoId) return;
  const box=img.parentElement;
  const badge=box && box.querySelector('.play-badge'); if(badge) badge.remove();
  try{
    const d=await (await fetch(`/api/media?platform=${platform}&id=${encodeURIComponent(videoId)}`)).json();
    if(d.ok && d.url){
      const v=document.createElement('video');
      v.src=d.url; v.controls=true; v.autoplay=true; v.playsInline=true;
      v.setAttribute('playsinline',''); v.setAttribute('crossorigin','anonymous');
      v.className='thumb-video';
      v.onerror=()=>embedFn(v, videoId);   // mp4 재생 실패 시 embed 폴백
      img.replaceWith(v); return;
    }
  }catch(e){}
  embedFn(img, videoId);
}
function _embedYoutube(el, videoId){
  const f=document.createElement('iframe');
  f.src='https://www.youtube.com/embed/'+encodeURIComponent(videoId)+'?autoplay=1&playsinline=1';
  f.style.cssText='width:100%;height:220px;border:0;display:block;background:#000';
  f.allow='autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen=true;
  el.replaceWith(f);
}
function _embedTiktok(el, videoId){
  const f=document.createElement('iframe');
  f.src='https://www.tiktok.com/embed/v2/'+encodeURIComponent(videoId);
  f.style.cssText='width:100%;height:220px;border:0;display:block;background:#000';
  f.allow='autoplay; encrypted-media; picture-in-picture'; f.allowFullscreen=true;
  el.replaceWith(f);
}
function playYoutube(img, videoId){ _playViaMedia(img, videoId, 'youtube', _embedYoutube); }
function playTiktok(img, videoId){ _playViaMedia(img, videoId, 'tiktok', _embedTiktok); }

// 재생중/멈춘 <video>의 현재 프레임을 canvas 캡처 → 구글렌즈 → 5플랫폼 유사영상.
const LENS_PLATFORMS=[
  {k:'youtube',label:'▶️ 유튜브'},{k:'tiktok',label:'🎵 틱톡'},
  {k:'instagram',label:'📷 인스타'},{k:'xiaohongshu',label:'📕 샤오홍슈'},
  {k:'douyin',label:'🎶 도우인'}];
let LENS_STATE={};   // shortcode → {items, on:Set}

// 카드의 재생중/멈춘 <video> 프레임을 canvas 캡처. 카드는 담기 버튼(save_${sc})으로 특정.
function _captureFrame(shortcode){
  const anchor=document.getElementById('save_'+shortcode);
  const card=anchor && anchor.closest('.card');
  const v=card && card.querySelector('video.thumb-video');
  if(!v || v.readyState<2) return null;
  const cv=document.createElement('canvas');
  cv.width=v.videoWidth; cv.height=v.videoHeight;
  cv.getContext('2d').drawImage(v,0,0);
  return cv;
}
async function lensSearch(btn, shortcode){
  const cv=_captureFrame(shortcode);
  if(!cv){ openScript('<div style="padding:10px;color:var(--sub)">▶ 미리보기를 재생하고 원하는 장면에서 멈춘 뒤 눌러주세요.</div>','🔍 렌즈 유사영상'); return; }

  const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
  const fd=new FormData(); fd.append('frame', blob, 'f.jpg');
  try{
    const r=await fetch('/api/lens/search',{method:'POST',body:fd});
    const body=document.getElementById('scriptBody');
    if(r.status===429){ const d=await r.json(); body.innerHTML=`<div style="padding:10px;color:#e0623d">💰 ${d.error||'이번 달 렌즈 한도 초과'}</div>`; return; }
    const d=await r.json();

    LENS_STATE[shortcode]={items:d.items, on:new Set(LENS_PLATFORMS.map(p=>p.k))};

  }catch(e){ document.getElementById('scriptBody').innerHTML='<div style="padding:10px;color:#e0623d">❌ '+e.message+'</div>'; }
}

    h += segs.map(s=>`<div class="sm-seg"><div class="t">${(+s.start).toFixed(1)}s ~ ${(+s.end).toFixed(1)}s</div>`
        + `<div class="txt">${esc(s.text)}</div>`
        + (s.scene_desc?`<div class="scene">🎬 ${esc(s.scene_desc)}</div>`:'')+`</div>`).join('');
  }
  openScript(h);
}
async function saveToWiki(btn){
  const sc = window._curSC; if(!sc) return;
  btn.disabled=true; btn.textContent='⏳ 저장·구조분석 중…';
  try{
    const r = await fetch('/api/wiki/save?shortcode='+encodeURIComponent(sc), {method:'POST'});
    const d = await r.json();
    if(!d.ok){ btn.disabled=false; btn.textContent='⭐ S급 위키 저장'; alert('저장 실패: '+(d.error||'')); return; }
    btn.textContent='✓ 위키에 저장됨'; btn.classList.add('done');
  }catch(e){ btn.disabled=false; btn.textContent='⭐ S급 위키 저장'; alert('네트워크 오류'); }
}
async function copyFullText(btn){
  const full = (document.querySelector('#scriptBody .sm-full')||{}).innerText || '';
  try{ await navigator.clipboard.writeText(full); }
  catch(e){ const t=document.createElement('textarea'); t.value=full; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  btn.textContent='✓ 복사됨'; btn.classList.add('done');
  setTimeout(()=>{ btn.textContent='📋 전체 복사'; btn.classList.remove('done'); }, 1200);
}
// 담기 = 영상 믹싱 바구니 토글(서버 저장, 모든 PC 공유). 한 번 더 누르면 담기취소.
async function toggleMix(sc, btn){
  const it = STATE.items.find(x=>x.shortcode===sc) || {};
  try{
    const r = await fetch('/api/mix/basket/toggle', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({shortcode: sc, url: it.url||'', thumbnail: it.thumbnail||'',
                            name: it.name||it.username||'', caption: it.caption||''})
    });
    const d = await r.json();
    setMixBtn(btn, d.in);
    const st = document.getElementById("status");
    if(st) st.textContent = d.in ? `🎬 영상 믹싱에 담김 (총 ${d.count}개)` : `담기취소됨 (총 ${d.count}개)`;
  }catch(e){ /* 무시 */ }
}
function setMixBtn(btn, inBasket){
  if(!btn) return;
  if(inBasket){ btn.textContent='🎬 담김✓'; btn.classList.add('saved'); }
  else { btn.textContent='📥 담기'; btn.classList.remove('saved'); }
}
// 렌더 후 바구니에 담긴 카드 버튼을 담김 상태로 표시
async function markSavedButtons(){
  try{
    const d = await (await fetch('/api/mix/basket')).json();
    (d.shortcodes||[]).forEach(sc=>setMixBtn(document.getElementById('save_'+sc), true));
  }catch(e){}
}
renderCtypes(); renderCats(); loadLast();
