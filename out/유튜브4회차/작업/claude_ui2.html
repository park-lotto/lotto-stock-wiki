<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:Pre;src:url("fonts/Pretendard-Black.otf");font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1536px;height:864px;overflow:hidden;background:#faf9f5;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;color:#1f1e1d}
.app{display:flex;height:100%}
.side{width:260px;background:#f3f1ea;border-right:1px solid #e6e2d6;padding:22px 16px;display:flex;flex-direction:column;gap:6px}
.brand{font-family:Georgia,"Times New Roman",serif;font-size:30px;color:#3d3929;margin:4px 8px 22px}
.newc{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:10px;font-size:18px;color:#3d3929}
.newc b{display:inline-flex;width:26px;height:26px;border-radius:50%;background:#d97757;color:#fff;align-items:center;justify-content:center;font-size:20px}
.sec{font-size:14px;color:#8a8577;margin:20px 12px 6px}
.item{padding:9px 12px;border-radius:8px;font-size:16.5px;color:#3d3929;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.on{background:#e8e5da}
.main{flex:1;display:flex;flex-direction:column;position:relative}
.top{height:64px;display:flex;align-items:center;justify-content:center;font-size:17px;color:#5e5a4e;border-bottom:1px solid #eeebe2}
.chat{flex:1;overflow:hidden;display:flex;flex-direction:column;align-items:center;padding-top:34px}
.col{width:860px;display:flex;flex-direction:column;gap:22px}
.user{align-self:flex-end;background:#f0eee6;border-radius:18px;padding:14px 20px;font-size:22px;max-width:640px;display:none}
.bot{font-size:21px;line-height:1.65;display:none}
.tool{border:1px solid #e3dfd2;border-radius:14px;background:#fff;padding:16px 20px;display:none}
.tool .hd{display:flex;align-items:center;gap:10px;font-size:17px;color:#5e5a4e;margin-bottom:10px}
.tool .hd .dot{width:10px;height:10px;border-radius:50%;background:#d97757}
.tool .hd .sp{margin-left:auto;background:#1f1e1d;color:#fff;border-radius:6px;padding:2px 9px;font-size:14px;font-weight:700}
.st{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:repeat(7,auto);grid-auto-flow:column;gap:6px 26px}
.st div{font-size:18px;color:#b9b4a6;display:flex;gap:10px;align-items:center}
.st div i{font-style:normal;width:22px;text-align:center}
.st div.done{color:#2c2b28}.st div.done i{color:#2f9e6e}
.st div.cur{color:#d97757;font-weight:700}
.card{display:none;border:1px solid #e3dfd2;border-radius:14px;background:#fff;padding:14px;gap:18px;align-items:center;width:560px}
.card img{width:120px;height:213px;object-fit:cover;border-radius:10px}
.card .t1{font-size:21px;font-weight:700}.card .t2{font-size:16px;color:#8a8577;margin-top:6px}
.card .pl{margin-top:14px;display:inline-block;background:#d97757;color:#fff;border-radius:8px;padding:8px 16px;font-size:17px;font-weight:700}
.inbar{position:absolute;left:50%;bottom:44px;transform:translateX(-50%);width:860px;background:#fff;border:1px solid #dcd7c9;border-radius:22px;box-shadow:0 4px 18px rgba(0,0,0,.05);padding:20px 22px 62px;font-size:23px;min-height:120px}
.ph{color:#a39e90}
.caret{display:inline-block;width:2px;height:28px;background:#1f1e1d;vertical-align:-5px;margin-left:1px}
.send{position:absolute;right:16px;bottom:14px;width:40px;height:40px;border-radius:10px;background:#d6d1c4;display:flex;align-items:center;justify-content:center;color:#fff;font-size:22px}
.send.on{background:#d97757}
.tools{position:absolute;left:18px;bottom:16px;font-size:15px;color:#8a8577;border:1px solid #e3dfd2;border-radius:8px;padding:4px 10px}

.col{position:relative;transition:none}
.msg{font-size:19px;line-height:1.6;color:#2c2b28;display:none}
.msg b{color:#d97757}
.call{display:none;border:1px solid #e3dfd2;border-radius:12px;background:#fff;overflow:hidden}
.call .h{display:flex;align-items:center;gap:10px;padding:10px 16px;font-size:16px;color:#5e5a4e;background:#fbfaf7}
.call .h .ic{width:20px;height:20px;border-radius:5px;background:#d97757;color:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;font-weight:700}
.call .h .nm{font-family:Consolas,monospace;font-size:15px;color:#8a8577}
.call .h .ok{margin-left:auto;font-size:15px}
.call .h .ok.run{color:#d97757}.call .h .ok.done{color:#2f9e6e}
.call .bd{padding:12px 16px;border-top:1px solid #f0ede4;font-size:16px;color:#3d3929}
.chips span{display:inline-block;border:1px solid #e3dfd2;border-radius:8px;padding:4px 10px;margin:0 8px 6px 0;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:6px;margin-top:8px}
.grid img{width:100%;aspect-ratio:81/100;object-fit:cover;border-radius:5px;opacity:0;transform:scale(.6);border:3px solid transparent}
.grid img.on{opacity:1;transform:scale(1)}.grid img.pick{border-color:#d97757}
.grid img.dim{opacity:.35}
.strip{display:flex;gap:4px;margin-top:6px}.strip img{height:96px;border-radius:4px;opacity:0}.strip img.on{opacity:1}
.wave{display:flex;gap:3px;align-items:center;height:56px;margin-top:6px}.wave i{width:5px;background:#d97757;border-radius:3px;opacity:.85}
.lines div{font-size:17px;padding:2px 0;opacity:0}.lines div.on{opacity:1}
.lines div::before{content:"▸ ";color:#d97757}
.match{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:6px}
.match div{display:flex;gap:8px;align-items:center;font-size:14px;opacity:0}.match div.on{opacity:1}
.match img{width:62px;height:78px;object-fit:cover;border-radius:4px}
.bar{height:12px;border-radius:6px;background:#efece4;overflow:hidden;margin-top:8px}.bar i{display:block;height:100%;background:#d97757;width:0}
.prog{display:flex;gap:14px;align-items:center}.prog img{width:78px;height:96px;object-fit:cover;border-radius:6px}
.prog .pc{font-family:Consolas,monospace;font-size:18px;color:#d97757;font-weight:700}
.chk div{font-size:16px;padding:2px 0;opacity:0}.chk div.on{opacity:1}.chk div::before{content:"✓ ";color:#2f9e6e;font-weight:700}
#ff{position:absolute;right:28px;top:84px;display:none;align-items:center;gap:10px;background:#1f1e1d;color:#fff;border-radius:12px;padding:10px 18px;font-size:26px;font-weight:900;font-family:Pre,sans-serif;letter-spacing:1px;z-index:5;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#ff .tri{color:#d97757;font-size:24px}
#ffline{position:absolute;left:0;top:64px;height:4px;background:#d97757;z-index:5;width:0}
#cur{position:absolute;width:26px;height:26px;z-index:9;display:none;pointer-events:none}
#clickfx{position:absolute;width:60px;height:60px;border-radius:50%;border:4px solid #d97757;z-index:8;display:none;transform:translate(-50%,-50%)}
.card{display:none}
</style></head>
<body>
<div class="app">
  <div class="side">
    <div class="brand">Claude</div>
    <div class="newc"><b>+</b>새 채팅</div>
    <div class="sec">최근</div>
    <div class="item on">외국인 한국화장품 영상</div>
    <div class="item">썰템쇼 스타일 초코무스</div>
    <div class="item">레고 이름 유래 쇼츠</div>
    <div class="item">한국 선크림 백탁 쇼츠</div>
    <div class="item">오뚜기 숨은 제품</div>
  </div>
  <div class="main" id="main">
    <div class="top">외국인 한국화장품 영상</div>
    <div id="ffline"></div>
    <div id="ff"><span class="tri">▶▶</span>8배속</div>
    <div class="chat" id="chat"><div class="col" id="col">
      <div class="user" id="u"></div>
      <div class="bot" id="b"></div>
    </div></div>
    <div class="inbar"><span id="in"></span><span class="caret" id="caret"></span><span class="tools">⚙ 숏클 연결됨</span><div class="send" id="send">↑</div></div>
  </div>
</div>
<svg id="cur" viewBox="0 0 24 24"><path d="M3 2l16 9-7 2-3 7z" fill="#1f1e1d" stroke="#fff" stroke-width="1.5"/></svg>
<div id="clickfx"></div>
<script src="claude_ui2.js"></script>
</body></html>
