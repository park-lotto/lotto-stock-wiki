<!doctype html>

<style>

<script>
const {Scene,person,robot,smooth,ell,cloud,poly,rr,ln,pl,tube,mk,INK,ORG,SKIN,SHIRT,HAIR,BEIGE,SKY,PINK,eo,seg,clamp,qo,J,f} = HQ;
document.fonts.load('40px "NP"').then(()=>document.fonts.load('40px "GB"')).then(()=>document.fonts.load('800 40px "PB"')).then(()=>document.fonts.ready).then(()=>{
const S = new Scene(30.6);
// 4회차 장면 s01 — 50대 회원 (30.6초) · 대본 v6 음성 voice/s01.mp3(30.27초) 무음 실측 시각
// 0.37 쉰 살 / 3.30 컴퓨터=이메일 / 6.17 부업·비싼 강의 두 개 / 11.36 결국 손편집 강의 / 16.22 자르고 17.65 자막 18.85 목소리
// 19.85 몇 달 뒤 0 / 23.05 여러분 얘기? / 25.19 게을러서? / 26.67 아닙니다 / 27.75 솔직해집시다 / 28.85 시대가 아니잖아요
// 금액 금지선: 이전 샘플의 '₩·수백만 원' 그림 빼고 '비싼 강의 x 2'
// ================= 컷1: 쉰 살 넘은 회원 → 이메일이 전부 (0 ~ 6.17) =================
const c1 = cutL(S, -1, 6.17, { push: [1.0, 1.05], ox: 620, oy: 480 });
const st1 = stageN(c1);
st1.fill(ell(620, 640, 560, 520, { n: 30 }), SKY, -99, 0.38);
heroSeq(c1, [["g_o_hope", 0], ["g_o_laptop_blank", 3.30]], { x: 620, y: 400, sc: 2.0, s: 0.05, dur: 1.15 });
const t1 = win(c1.sub(), -1, 3.30, 0.12);
t1.text("쉰 살이 넘은", { x: 1110, y: 360, size: 120, s: 0.6, gap: 0.06 });
const r1 = t1.text("회원님", { x: 1110, y: 560, size: 170, s: 1.35, gap: 0.08 });
t1.underline(r1.box(), 2.0, 0.35);
const t2 = win(c1.sub(), 3.30, 6.17, 0.12);
const env = rr(1130, 250, 300, 200, 14);
t2.fill(env, BEIGE, 3.35, 0.6, 0.25); t2.line(env, 3.35, 0.4, { w: 7 });
t2.line(pl([[1130, 255], [1280, 360], [1430, 255]]), 3.7, 0.3, { w: 6 });
t2.text("컴퓨터 =", { x: 1110, y: 590, size: 110, s: 3.9, gap: 0.06 });
const r2 = t2.text("이메일이 전부", { x: 1110, y: 760, size: 130, s: 4.4, gap: 0.07 });
t2.circleMark(r2.box(0, 2), 5.3, 0.5);

// ================= 컷2: 쇼츠 부업 → 비싼 강의 두 개 (6.17 ~ 11.36) =================
const c2 = cutL(S, 6.17, 11.36, { pan: [30, -30] });
const st2 = stageN(c2);
st2.fill(ell(1400, 600, 560, 520, { n: 30 }), "#F4E28A", -99, 0.33);
INKHERO.put(c2, "g_o_phone_wow", { x: 1400, y: 390, sc: 1.9, s: 6.2, dur: 1.1 });
const ph = rr(300, 150, 300, 330, 26);
c2.fill(ph, "#FFFFFF", 6.3, 0.9, 0.2); c2.line(ph, 6.3, 0.45, { w: 7 });
c2.text("쇼츠로", { x: 450, y: 270, size: 80, font: "gae", s: 6.8, anchor: "c" });
c2.text("부업!", { x: 450, y: 380, size: 96, font: "gae", s: 7.1, anchor: "c", c: "#D9622B" });
[[150, 600], [520, 600]].forEach(([x, y], i) => {
  const card = rr(x, y, 330, 210, 16), s0 = 8.2 + i * 0.7;
  c2.fill(card, i ? PINK : BEIGE, s0, 0.55, 0.25); c2.line(card, s0, 0.4, { w: 7 });
  c2.text(`강의 ${i + 1}`, { x: x + 30, y: y + 70, size: 66, font: "gae", s: s0 + 0.3 });
  const tri = pl([[x + 140, y + 105], [x + 140, y + 185], [x + 205, y + 145], [x + 140, y + 105]]);
  c2.fill(tri, ORG, s0 + 0.45, 0.85, 0.2); c2.line(tri, s0 + 0.45, 0.25, { w: 6 });
});
const won = c2.text("비싼 강의 x 2", { x: 480, y: 960, size: 110, s: 9.7, gap: 0.06, anchor: "c" });
c2.underline(won.box(0, 2), 10.4, 0.35);

// ================= 컷3: 결국 손편집 강의 → 자르고·자막·목소리 (11.36 ~ 19.85) =================
const c3 = cutL(S, 11.36, 19.85, { push: [1.04, 1.0], ox: 960, oy: 540 });
const st3 = stageN(c3);
st3.fill(rr(0, 960, 1920, 120, 0), BEIGE, -99, 0.5); st3.line(ln(0, 960, 1920, 960), -99, 0.1, { w: 5, pen: false });
INKHERO.put(c3, "g_o_laptop_tired", { x: 470, y: 430, sc: 1.85, s: 11.4, dur: 1.1 });
const mon = rr(930, 140, 900, 470, 18);
c3.fill(mon, "#FFFFFF", 11.7, 0.9, 0.2); c3.line(mon, 11.7, 0.5, { w: 8 });
c3.line(ln(1380, 610, 1380, 680), 12.1, 0.15, { w: 8 }); c3.line(ln(1250, 690, 1510, 690), 12.2, 0.2, { w: 8 });
[[0, 300, SKY], [1, 520, PINK], [2, 230, "#F4E28A"], [3, 610, SKY]].forEach(([k, w, col]) => {
  const bar = rr(980 + (k % 2) * 40, 230 + k * 85, w, 46, 8); c3.fill(bar, col, 12.3 + k * 0.15, 0.7, 0.2); c3.line(bar, 12.3 + k * 0.15, 0.2, { w: 5, pen: false });
});
const hd = c3.text("결국 손편집 강의", { x: 1380, y: 735, size: 110, s: 13.9, gap: 0.06, anchor: "c" });
c3.underline(hd.box(3, 5), 15.0, 0.35);
const tk = win(c3.sub(), 16.2, 1e9, 0.12);
[["장면 자르고", 16.25], ["자막 하나하나", 17.65], ["목소리 맞추고", 18.85]].forEach(([s, t], i) => {
  const cx = 1060 + i * 330;
  tk.fill(ell(cx, 845, 36, 36, { n: 14 }), ORG, t, 0.55, 0.2); tk.line(ell(cx, 845, 36, 36, { n: 14 }), t, 0.25, { w: 5 });
  tk.text(String(i + 1), { x: cx, y: 852, size: 52, font: "num", s: t + 0.05, anchor: "c" });
  tk.text(s, { x: cx, y: 935, size: 46, font: "gae", s: t + 0.15, gap: 0.04, anchor: "c" });
});

// ================= 컷4: 몇 달이 지나도 → 올린 영상 0 (19.85 ~ 23.05) =================
const c4 = cutL(S, 19.85, 23.05, { push: [1.0, 1.06], ox: 1400, oy: 450 });
const st4 = stageN(c4);
st4.fill(ell(1400, 620, 520, 500, { n: 30 }), "#D9D4CC", -99, 0.35);
INKHERO.put(c4, "g_o_frustr_head", { x: 1400, y: 400, sc: 1.85, s: 19.9, dur: 1.0 });
for (let i = 2; i >= 0; i--) {
  const pg = rr(170 + i * 26, 170 - i * 22, 640, 520, 14);
  c4.fill(pg, "#FFFFFF", 19.95 + (2 - i) * 0.12, 0.92, 0.15); c4.line(pg, 19.95 + (2 - i) * 0.12, 0.3, { w: 6 });
}
c4.line(ln(170, 270, 810, 270), 20.45, 0.25, { w: 6 });
for (let k = 1; k < 7; k++) c4.line(ln(170 + k * 91, 270, 170 + k * 91, 690), 20.5 + k * 0.04, 0.12, { w: 3, pen: false });
for (let k = 1; k < 4; k++) c4.line(ln(170, 270 + k * 105, 810, 270 + k * 105), 20.7 + k * 0.04, 0.12, { w: 3, pen: false });
c4.text("몇 달 뒤...", { x: 490, y: 225, size: 70, font: "gae", s: 20.1, anchor: "c" });
const z = c4.text("올린 영상 = 0", { x: 490, y: 880, size: 130, s: 20.9, gap: 0.07, anchor: "c" });
c4.circleMark(z.box(7, 7), 22.0, 0.45, 40, 20);

// ================= 컷5: 게을러서? → 아닙니다 → 솔직해집시다 → 시대가 아니잖아요 (23.05 ~ 27) =================
const c5 = cutL(S, 23.05, 1e9, { push: [1.04, 1.0], ox: 960, oy: 540 });
const st5 = stageN(c5);
st5.fill(rr(0, 1000, 1920, 80, 0), BEIGE, -99, 0.5); st5.line(ln(0, 1000, 1920, 1000), -99, 0.1, { w: 5, pen: false });
st5.fill(ell(470, 620, 440, 460, { n: 30 }), SKY, -99, 0.35);
heroSeq(c5, [["g_o_laptop_tired", 23.05], ["g_o_hope", 28.85]], { x: 470, y: 400, sc: 1.85, stat: true });
const yq = win(c5.sub(), 23.05, 25.19, 0.12);
yq.text("어떠세요,", { x: 1000, y: 380, size: 110, font: "gae", s: 23.1, gap: 0.05 });
const yq2 = yq.text("여러분 얘기 같지 않나요?", { x: 1000, y: 600, size: 110, s: 23.7, gap: 0.05 });
yq.underline(yq2.box(0, 5), 24.5, 0.3);
const c5b = win(c5.sub(), 25.19, 1e9, 0.12);
const q = c5b.text("이분이 게을러서?", { x: 1000, y: 260, size: 130, s: 25.2, gap: 0.06 });
c5b.line(ln(980, 170, 1860, 330), 26.68, 0.2, { c: ORG, w: 14 }); c5b.line(ln(980, 330, 1860, 170), 26.8, 0.2, { c: ORG, w: 14 });
c5b.text("아닙니다", { x: 1000, y: 410, size: 100, font: "gae", s: 26.85, gap: 0.04, c: "#D9622B" });
c5b.text("솔직해집시다", { x: 1000, y: 580, size: 120, s: 27.78, gap: 0.05 });
const era1 = c5b.text("이제 그런 시대가", { x: 1000, y: 760, size: 120, s: 28.88, gap: 0.05 });
const era2 = c5b.text("아니잖아요", { x: 1000, y: 915, size: 150, s: 29.3, gap: 0.06 });
c5b.underline(era2.box(), 30.0, 0.35);

S.start();
});
