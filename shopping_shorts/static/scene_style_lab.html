<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>장면꾸미기 실데이터 시험</title>
  <style>
    :root{color-scheme:dark;font-family:Pretendard,system-ui,sans-serif;background:#071118;color:#eaf7f6}
    *{box-sizing:border-box}body{margin:0;padding:20px}main{max-width:1500px;margin:auto}
    header{display:flex;align-items:end;justify-content:space-between;gap:16px;margin-bottom:16px}
    h1{font-size:24px;margin:0}p{margin:5px 0;color:#9bb8b8}.lab{color:#61f2d0;font-weight:800}
    .toolbar,.checks{background:#0e2029;border:1px solid #294550;border-radius:14px;padding:14px;margin-bottom:14px}
    .toolbar{display:flex;gap:10px;align-items:center}.toolbar select{flex:1}
    select,button{min-height:42px;border-radius:9px;border:1px solid #3b5e68;background:#132b35;color:#fff;padding:8px 12px}
    button{background:#00b894;border:0;font-weight:800;cursor:pointer}button:disabled{opacity:.45;cursor:not-allowed}
    .checks{display:grid;grid-template-columns:repeat(4,minmax(130px,1fr));gap:8px}.check{background:#112933;padding:10px;border-radius:9px}
    .check b{display:block;color:#66e6c9;margin-bottom:4px}.error{color:#ff8c96;white-space:pre-wrap}
    iframe{width:100%;height:76vh;border:1px solid #294550;border-radius:14px;background:#08151d}
    [hidden]{display:none!important}
  </style>
</head>
<body>
<main>
  <header><div><h1>장면꾸미기 실데이터 시험 <span class="lab">LAB</span></h1><p>원본 작업은 읽기만 하고 시험 복사본에만 저장합니다.</p></div><strong id="status">작업 불러오는 중…</strong></header>
  <section class="toolbar"><select id="job" aria-label="시험할 작업"></select><button id="clone" disabled>시험 복사본 만들기</button></section>
  <section class="checks" id="checks"></section>
  <p class="error" id="error"></p>
  <iframe id="editor" title="장면꾸미기 편집기" hidden></iframe>
</main>
<script src="/scene-style-lab.js"></script>
</body>
</html>
