<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>결제하기 · 숏템탑스</title>
<style>
  :root{
    --bg:#f4f5f7; --card:#fff; --ink:#16181d; --sub:#6b7280;
    --line:#e5e7eb; --brand:#2563eb; --brand-d:#1d4ed8; --ok:#059669;
    --radius:14px;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Pretendard','Malgun Gothic',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:28px 18px 60px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:22px}
  .logo{width:32px;height:32px;border-radius:9px;background:var(--brand);
    color:#fff;display:grid;place-items:center;font-weight:800;font-size:15px}
  .brand{font-weight:700;font-size:17px}
  .secure{margin-left:auto;font-size:12.5px;color:var(--ok);font-weight:600}

  .grid{display:grid;grid-template-columns:1fr 340px;gap:20px;align-items:start}
  @media(max-width:820px){.grid{grid-template-columns:1fr}}

  .box{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:22px;box-shadow:0 1px 2px rgba(16,24,40,.04)}
  .box + .box{margin-top:16px}
  h2{font-size:15px;margin:0 0 16px;font-weight:700}
  .step{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;
    background:var(--ink);color:#fff;font-size:11px;margin-right:7px;vertical-align:1px}

  label{display:block;font-size:12.5px;color:var(--sub);font-weight:600;margin:0 0 6px}
  input,select{width:100%;height:44px;padding:0 12px;border:1px solid var(--line);
    border-radius:10px;font-size:14.5px;font-family:inherit;background:#fff;color:var(--ink);
    outline:none;transition:border-color .15s,box-shadow .15s}
  input:focus,select:focus{border-color:var(--brand);box-shadow:0 0 0 3px rgba(37,99,235,.12)}
  input::placeholder{color:#b6bcc7}
  .field{margin-bottom:14px}
  .row{display:grid;gap:12px}
  .row.c2{grid-template-columns:1fr 1fr}
  .row.c3{grid-template-columns:1fr 1fr 1fr}

  .cardnum{position:relative}
  .cardnum input{padding-right:62px;letter-spacing:.06em}
  .brandmark{position:absolute;right:12px;top:33px;font-size:11px;font-weight:800;
    color:#9aa1ad;letter-spacing:.04em}

  .pays{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:20px}
  .pay{border:1.5px solid var(--line);border-radius:11px;padding:13px 8px;text-align:center;
    font-size:13px;font-weight:600;cursor:pointer;background:#fff;transition:.15s}
  .pay:hover{border-color:#c3cbd8}
  .pay.on{border-color:var(--brand);background:#f5f8ff;color:var(--brand-d)}

  .chk{display:flex;gap:9px;align-items:flex-start;font-size:13px;color:#4b5563;margin-top:10px}
  .chk input{width:16px;height:16px;flex:none;margin-top:1px;accent-color:var(--brand)}
  .chk a{color:var(--sub)}

  aside .box{position:sticky;top:20px}
  .prod{display:flex;gap:12px;padding-bottom:16px;border-bottom:1px dashed var(--line)}
  .thumb{width:52px;height:52px;border-radius:11px;flex:none;
    background:linear-gradient(135deg,#2563eb,#7c3aed)}
  .prod b{display:block;font-size:14px;margin-bottom:3px}
  .prod span{font-size:12.5px;color:var(--sub)}
  .li{display:flex;justify-content:space-between;font-size:13.5px;color:#4b5563;margin-top:11px}
  .li.total{margin-top:16px;padding-top:14px;border-top:1px solid var(--line);
    font-size:16px;font-weight:800;color:var(--ink)}
  .li.total b{font-size:19px}
  .disc{color:var(--ok);font-weight:600}

  .btn{margin-top:18px;width:100%;height:52px;border:0;border-radius:11px;background:var(--brand);
    color:#fff;font-size:16px;font-weight:700;font-family:inherit;cursor:pointer;transition:.15s}
  .btn:hover{background:var(--brand-d)}
  .note{margin-top:11px;font-size:11.5px;color:#9aa1ad;line-height:1.6;text-align:center}
  .badge{display:inline-block;background:#eef2ff;color:var(--brand-d);font-size:11px;
    font-weight:700;padding:3px 8px;border-radius:6px;margin-left:6px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">S</div>
    <div class="brand">숏템탑스</div>
    <div class="secure">🔒 SSL 보안 결제</div>
  </header>

  <div class="grid">
    <main>
      <div class="box">
        <h2><span class="step">1</span>결제 수단</h2>
        <div class="pays">
          <div class="pay on">💳 신용/체크카드</div>
          <div class="pay">🏦 계좌이체</div>
          <div class="pay">📱 간편결제</div>
        </div>

        <div class="field cardnum">
          <label>카드 번호</label>
          <input placeholder="1234  5678  9012  3456" maxlength="19">
          <div class="brandmark">CARD</div>
        </div>

        <div class="row c3" style="margin-bottom:14px">
          <div><label>유효기간</label><input placeholder="MM / YY"></div>
          <div><label>CVC</label><input placeholder="•••" maxlength="3"></div>
          <div><label>할부</label>
            <select><option>일시불</option><option>2개월</option><option>3개월 무이자</option><option>6개월</option></select>
          </div>
        </div>

        <div class="field">
          <label>카드 소유자명</label>
          <input placeholder="홍길동">
        </div>
      </div>

      <div class="box">
        <h2><span class="step">2</span>결제자 정보</h2>
        <div class="row c2" style="margin-bottom:14px">
          <div><label>이름</label><input placeholder="홍길동"></div>
          <div><label>휴대폰</label><input placeholder="010-0000-0000"></div>
        </div>
        <div class="field">
          <label>이메일 (영수증 수신)</label>
          <input placeholder="you@example.com">
        </div>
        <label class="chk"><input type="checkbox" checked><span>결제 정보를 다음 결제에 사용하도록 저장합니다.</span></label>
      </div>

      <div class="box">
        <h2><span class="step">3</span>약관 동의</h2>
        <label class="chk"><input type="checkbox" checked><span><b>[필수]</b> 서비스 이용약관 및 결제 진행에 동의합니다. <a href="#">보기</a></span></label>
        <label class="chk"><input type="checkbox" checked><span><b>[필수]</b> 개인정보 수집·이용에 동의합니다. <a href="#">보기</a></span></label>
        <label class="chk"><input type="checkbox"><span>[선택] 혜택·이벤트 정보 수신에 동의합니다.</span></label>
      </div>
    </main>

    <aside>
      <div class="box">
        <h2>주문 요약</h2>
        <div class="prod">
          <div class="thumb"></div>
          <div>
            <b>숏템탑스 PRO<span class="badge">월간</span></b>
            <span>영상 100편 / 월 · 자동 갱신</span>
          </div>
        </div>
        <div class="li"><span>상품 금액</span><span>49,000원</span></div>
        <div class="li"><span>첫 달 할인</span><span class="disc">-10,000원</span></div>
        <div class="li"><span>부가세 (10%)</span><span>3,900원</span></div>
        <div class="li total"><span>총 결제금액</span><b>42,900원</b></div>

        <button class="btn">42,900원 결제하기</button>
        <p class="note">※ 디자인 확인용 목업입니다 — 실제 결제는 이루어지지 않습니다.<br>언제든 마이페이지에서 해지할 수 있습니다.</p>
      </div>
    </aside>
  </div>
</div>

<script>
  document.querySelectorAll('.pay').forEach(function (p) {
    p.addEventListener('click', function () {
      document.querySelectorAll('.pay').forEach(function (x) { x.classList.remove('on'); });
      p.classList.add('on');
    });
  });

  var ci = document.querySelector('.cardnum input');
  var bm = document.querySelector('.brandmark');
  ci.addEventListener('input', function () {
    var v = ci.value.replace(/\D/g, '').slice(0, 16);
    ci.value = v.replace(/(.{4})/g, '$1 ').trim();
    bm.textContent = v.charAt(0) === '4' ? 'VISA'
                   : v.charAt(0) === '5' ? 'MASTER'
                   : v.charAt(0) === '3' ? 'AMEX' : 'CARD';
  });

  document.querySelector('.btn').addEventListener('click', function () {
    var b = this;
    b.textContent = '결제 처리 중…';
    b.style.background = '#94a3b8';
    setTimeout(function () {
      b.textContent = '✓ 결제 완료 (목업)';
      b.style.background = '#059669';
    }, 1200);
  });
</script>
</body>
</html>
