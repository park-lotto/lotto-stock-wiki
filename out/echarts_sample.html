<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=800">
<title>ECharts 샘플 — STOCK BRAIN</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5/dist/echarts.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#03030c;
    background-image:
      linear-gradient(rgba(0,255,208,0.022) 1px,transparent 1px),
      linear-gradient(90deg,rgba(0,255,208,0.022) 1px,transparent 1px);
    background-size:48px 48px;
    font-family:'Noto Sans KR',sans-serif;
    width:800px; margin:0 auto; padding:20px;
    color:#fff;
  }
  .title {
    font-size:11px; font-weight:900; letter-spacing:5px;
    color:#00FFD0; margin-bottom:6px;
  }
  .section-title {
    font-size:11px; font-weight:900; color:#444;
    letter-spacing:2px; margin:20px 0 10px;
  }
  .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .grid3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:12px; }
  .card {
    background:rgba(255,255,255,0.02);
    border:1px solid rgba(0,255,208,0.1);
    border-radius:14px; padding:14px;
  }
  .card-title {
    font-size:10px; color:#555; font-weight:700;
    margin-bottom:8px; letter-spacing:1px;
  }
</style>
</head>
<body>

<div class="title">◆ STOCK BRAIN — ECharts 샘플</div>
<div style="font-size:22px;font-weight:900;color:#fff;margin-bottom:4px;">
  차트 컴포넌트 <span style="color:#00FFD0;">미리보기</span>
</div>
<div style="font-size:12px;color:#555;margin-bottom:4px;">2026-05-28 · 실제 데이터 기반</div>

<!-- ① 섹터 RS 수평 바차트 -->
<div class="section-title">① 전일 한국장 섹터 등락 바차트</div>
<div class="card">
  <div class="card-title">KR 섹터 ETF 전일 등락률</div>
  <div id="chart-sector" style="height:220px;"></div>
</div>

<!-- ② 미국 지수 + 필라반 -->
<div class="section-title">② 미국 지수 & 필라반</div>
<div class="card">
  <div class="card-title">전일 미국 지수 등락률</div>
  <div id="chart-us" style="height:180px;"></div>
</div>

<!-- ③ VIX 게이지 + 매크로 -->
<div class="section-title">③ VIX 공포지수 게이지 + 매크로 지표</div>
<div class="grid2">
  <div class="card">
    <div class="card-title">VIX 공포지수</div>
    <div id="chart-vix" style="height:180px;"></div>
  </div>
  <div class="card">
    <div class="card-title">매크로 지표 레이더</div>
    <div id="chart-radar" style="height:180px;"></div>
  </div>
</div>

<!-- ④ 미니 지수 스파크라인 (5일) -->
<div class="section-title">④ 주요 지수 미니 스파크라인 (5일)</div>
<div class="grid3">
  <div class="card">
    <div class="card-title">S&P500</div>
    <div id="spark-sp" style="height:80px;"></div>
    <div style="font-size:16px;font-weight:900;margin-top:6px;">7,520.36</div>
    <div style="font-size:12px;color:#00FFD0;font-weight:700;">▲0.02%</div>
  </div>
  <div class="card">
    <div class="card-title">나스닥</div>
    <div id="spark-nq" style="height:80px;"></div>
    <div style="font-size:16px;font-weight:900;margin-top:6px;">26,674.73</div>
    <div style="font-size:12px;color:#00FFD0;font-weight:700;">▲0.07%</div>
  </div>
  <div class="card">
    <div class="card-title">필라반</div>
    <div id="spark-phlx" style="height:80px;"></div>
    <div style="font-size:16px;font-weight:900;margin-top:6px;">12,702.19</div>
    <div style="font-size:12px;color:#FF4455;font-weight:700;">▼1.36%</div>
  </div>
</div>

<!-- ⑤ 섹터 히트맵 온도계 -->
<div class="section-title">⑤ 섹터 온도 히트맵</div>
<div class="card">
  <div class="card-title">섹터별 신호 강도 (오늘 기준)</div>
  <div id="chart-heatmap" style="height:120px;"></div>
</div>

<script>
const MINT   = '#00FFD0';
const RED    = '#FF4455';
const YELLOW = '#FFD600';
const DARK   = '#0d0d1c';
const GRAY   = '#333';

// ① 섹터 바차트
const sectorChart = echarts.init(document.getElementById('chart-sector'));
const sectorData = [
  { name:'2차전지', value: 4.65 },
  { name:'방산',    value: 0.01 },
  { name:'코스피',  value:-0.62 },
  { name:'코스닥',  value:-1.72 },
  { name:'반도체',  value:-1.83 },
  { name:'조선',    value:-5.63 },
].sort((a,b) => a.value - b.value);

sectorChart.setOption({
  backgroundColor:'transparent',
  grid:{ left:70, right:60, top:8, bottom:8 },
  xAxis:{
    type:'value',
    axisLabel:{ color:'#555', fontSize:10, formatter:v=>v+'%' },
    splitLine:{ lineStyle:{ color:'rgba(255,255,255,0.04)' } },
    axisLine:{ lineStyle:{ color:'rgba(255,255,255,0.1)' } },
  },
  yAxis:{
    type:'category',
    data: sectorData.map(d=>d.name),
    axisLabel:{ color:'#aaa', fontSize:11, fontWeight:700 },
    axisLine:{ show:false }, axisTick:{ show:false },
  },
  series:[{
    type:'bar', barMaxWidth:18,
    data: sectorData.map(d=>({
      value: d.value,
      itemStyle:{
        color: d.value >= 0
          ? new echarts.graphic.LinearGradient(0,0,1,0,[
              {offset:0,color:'rgba(0,255,208,0.3)'},{offset:1,color:MINT}])
          : new echarts.graphic.LinearGradient(0,0,1,0,[
              {offset:0,color:RED},{offset:1,color:'rgba(255,68,85,0.3)'}]),
        borderRadius: d.value >= 0 ? [0,4,4,0] : [4,0,0,4],
      }
    })),
    label:{
      show:true, position: d => d.value >= 0 ? 'right' : 'left',
      formatter: p => (p.value>=0?'+':'')+p.value.toFixed(2)+'%',
      color:'#aaa', fontSize:10,
    },
    markLine:{
      symbol:'none',
      data:[{xAxis:0, lineStyle:{color:'rgba(255,255,255,0.15)',width:1}}]
    }
  }]
});

// ② 미국 지수 바차트
const usChart = echarts.init(document.getElementById('chart-us'));
const usData = [
  { name:'다우',    value: 0.36 },
  { name:'S&P500', value: 0.02 },
  { name:'나스닥',  value: 0.07 },
  { name:'러셀2000',value:-0.02 },
  { name:'필라반',  value:-1.36 },
];

usChart.setOption({
  backgroundColor:'transparent',
  grid:{ left:75, right:60, top:8, bottom:8 },
  xAxis:{
    type:'value',
    axisLabel:{ color:'#555', fontSize:10, formatter:v=>v+'%' },
    splitLine:{ lineStyle:{ color:'rgba(255,255,255,0.04)' } },
    axisLine:{ lineStyle:{ color:'rgba(255,255,255,0.1)' } },
  },
  yAxis:{
    type:'category',
    data: usData.map(d=>d.name),
    axisLabel:{ color:'#aaa', fontSize:11, fontWeight:700 },
    axisLine:{ show:false }, axisTick:{ show:false },
  },
  series:[{
    type:'bar', barMaxWidth:18,
    data: usData.map(d=>({
      value: d.value,
      itemStyle:{
        color: d.value >= 0
          ? new echarts.graphic.LinearGradient(0,0,1,0,[
              {offset:0,color:'rgba(0,255,208,0.2)'},{offset:1,color:MINT}])
          : new echarts.graphic.LinearGradient(0,0,1,0,[
              {offset:0,color:RED},{offset:1,color:'rgba(255,68,85,0.2)'}]),
        borderRadius: d.value >= 0 ? [0,4,4,0] : [4,0,0,4],
      }
    })),
    label:{
      show:true, position: d => d.value >= 0 ? 'right' : 'left',
      formatter: p => (p.value>=0?'+':'')+p.value.toFixed(2)+'%',
      color:'#aaa', fontSize:10,
    },
    markLine:{
      symbol:'none',
      data:[{xAxis:0, lineStyle:{color:'rgba(255,255,255,0.15)',width:1}}]
    }
  }]
});

// ③ VIX 게이지
const vixChart = echarts.init(document.getElementById('chart-vix'));
vixChart.setOption({
  backgroundColor:'transparent',
  series:[{
    type:'gauge',
    startAngle:200, endAngle:-20,
    min:0, max:50,
    radius:'90%', center:['50%','62%'],
    axisLine:{
      lineStyle:{
        width:12,
        color:[
          [0.3, MINT],
          [0.5, YELLOW],
          [0.7, '#FF8C00'],
          [1.0, RED]
        ]
      }
    },
    pointer:{ itemStyle:{ color:'#fff' }, length:'65%', width:4 },
    axisTick:{ show:false },
    splitLine:{ show:false },
    axisLabel:{
      color:'#555', fontSize:9,
      formatter: v => v===0?'안정':v===25?'경계':v===50?'공포':'',
    },
    detail:{
      formatter: v => v.toFixed(1),
      color:'#fff', fontSize:22, fontWeight:900,
      offsetCenter:[0, '20%'],
    },
    data:[{ value:16.29, name:'VIX' }],
    title:{ color:'#555', fontSize:10, offsetCenter:[0,'38%'] },
  }]
});

// ③ 매크로 레이더
const radarChart = echarts.init(document.getElementById('chart-radar'));
radarChart.setOption({
  backgroundColor:'transparent',
  radar:{
    indicator:[
      { name:'달러(역)', max:10 },
      { name:'금리(역)', max:10 },
      { name:'유가(역)', max:10 },
      { name:'VIX(역)',  max:10 },
      { name:'원화',     max:10 },
    ],
    shape:'polygon',
    axisLine:{ lineStyle:{ color:'rgba(255,255,255,0.1)' } },
    splitLine:{ lineStyle:{ color:'rgba(255,255,255,0.06)' } },
    splitArea:{ show:false },
    axisName:{ color:'#666', fontSize:10 },
    radius:'65%', center:['50%','52%'],
  },
  series:[{
    type:'radar',
    data:[{
      value:[7, 5, 4, 8, 5],  // DXY 우호, 금리 중립, 유가 부담, VIX 안정, 원화 보통
      name:'매크로 환경',
      areaStyle:{ color:'rgba(0,255,208,0.12)' },
      lineStyle:{ color:MINT, width:2 },
      itemStyle:{ color:MINT },
    }],
  }]
});

// ④ 스파크라인 (가상 5일 데이터)
function makeSpark(id, data, color) {
  const c = echarts.init(document.getElementById(id));
  c.setOption({
    backgroundColor:'transparent',
    grid:{ left:0, right:0, top:4, bottom:0 },
    xAxis:{ type:'category', show:false },
    yAxis:{ type:'value', show:false, scale:true },
    series:[{
      type:'line', data, smooth:true,
      symbol:'none',
      lineStyle:{ color, width:2 },
      areaStyle:{ color: new echarts.graphic.LinearGradient(0,0,0,1,[
        {offset:0, color:color+'44'},
        {offset:1, color:color+'00'},
      ])},
    }]
  });
}
makeSpark('spark-sp',   [7450,7490,7510,7505,7520], MINT);
makeSpark('spark-nq',   [26500,26580,26640,26620,26675], MINT);
makeSpark('spark-phlx', [12900,12850,12820,12780,12702], RED);

// ⑤ 히트맵
const hmChart = echarts.init(document.getElementById('chart-heatmap'));
const hmData = [
  ['반도체',    '미국커플링', 5],
  ['이차전지',  '미국커플링', 8],
  ['바이오',    '미국커플링', 4],
  ['조선',      '미국커플링', 3],
  ['전력기기',  '미국커플링', 6],
  ['방산',      '미국커플링', 4],
  ['반도체',    '수급빈집',   6],
  ['이차전지',  '수급빈집',   7],
  ['바이오',    '수급빈집',   5],
  ['조선',      '수급빈집',   8],
  ['전력기기',  '수급빈집',   7],
  ['방산',      '수급빈집',   9],
  ['반도체',    '수출신호',   8],
  ['이차전지',  '수출신호',   6],
  ['바이오',    '수출신호',   3],
  ['조선',      '수출신호',   7],
  ['전력기기',  '수출신호',   5],
  ['방산',      '수출신호',   4],
].map(d => [d[0], d[1], d[2]]);

const sectors  = ['반도체','이차전지','바이오','조선','전력기기','방산'];
const criteria = ['미국커플링','수급빈집','수출신호'];

hmChart.setOption({
  backgroundColor:'transparent',
  grid:{ left:70, right:10, top:8, bottom:30 },
  xAxis:{
    type:'category', data:sectors,
    axisLabel:{ color:'#aaa', fontSize:11, fontWeight:700 },
    axisLine:{ show:false }, axisTick:{ show:false },
    splitArea:{ show:true, areaStyle:{
      color:['rgba(255,255,255,0.01)','rgba(255,255,255,0.025)']
    }}
  },
  yAxis:{
    type:'category', data:criteria,
    axisLabel:{ color:'#666', fontSize:10 },
    axisLine:{ show:false }, axisTick:{ show:false },
  },
  visualMap:{
    min:0, max:10, show:false,
    inRange:{ color:['#0d1f1a','#00664d','#00FFD0'] }
  },
  series:[{
    type:'heatmap',
    data: hmData.map(d=>[sectors.indexOf(d[0]), criteria.indexOf(d[1]), d[2]]),
    label:{ show:true, color:'#fff', fontSize:11, fontWeight:700 },
    emphasis:{ itemStyle:{ shadowBlur:10, shadowColor:MINT } },
    itemStyle:{ borderColor:'rgba(0,0,0,0.3)', borderWidth:2, borderRadius:4 },
  }]
});
</script>
</body>
</html>
