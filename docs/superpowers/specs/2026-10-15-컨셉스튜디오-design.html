<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<script>const MD="# 컨셉 스튜디오 — 설계 (2026-10-15, 관제 213, 트랙 `컨셉스튜디오`)\n\n## 0. 사장님 확정 사항\n- 숏템메이커 안의 새 페이지 + 별도 상품. 컨셉(정치·연예인·뷰티·픽션 썰…)은 **우리가 프리셋으로 세팅**해 계속 늘린다.\n- 고객은 웹 스튜디오에서 **컨셉 고르기 + 내 팩 저장**. 사람 확인은 **대본 1회**뿐.\n- 실행 방식 두 가지:\n  - **Claude형** — 고객 Claude 데스크톱 + 설치팩. 렌더·AI 전부 고객 PC/고객 구독. 우리 서버는 설정·지시만.\n  - **버텍스형** — 우리 서버 렌더 + **고객 제미니 키**. 우리는 **서버비 편당 1,000원**만 받는다.\n- TTS·이미지 검색 키는 **키 등록 페이지**에서 고객이 넣는다.\n- 칼카피(채널 분석 → 프리셋 한 장)는 다른 창(트랙 `칼카피숏템엔진`, 관제 097). 두 창은 **프리셋 한 장**으로만 만난다.\n\n## 1. 확인된 근거 (2026-10-15 실측·문서)\n| 항목 | 근거 |\n|---|---|\n| 고객 Max를 우리 웹이 대신 쓰기 = 금지 | code.claude.com/docs/en/legal-and-compliance \"route requests through Free, Pro, or Max plan credentials on behalf of their users\" 금지 |\n| 고객 Claude가 우리 MCP를 부르기 = 표준 방식 | 커스텀 커넥터(원격 MCP)는 Free·Pro·Max·Team·Enterprise 모두 (support.claude.com 11175166) |\n| 설치팩 한 파일 | Claude 데스크톱 확장 `.mcpb` — Node.js·Python·바이너리 MCP 서버를 의존성째 묶어 클릭 설치 (anthropic.com/engineering/desktop-extensions) |\n| 지금 라이브 제작은 Claude 없이 돈다 | `shopping_shorts`에서 claude 호출은 트랙 전용 `channelkit/providers.py`·`channelkit/make.py`·`hotpeople/make.py` 3곳뿐 |\n| 계정별 저장 자리 있음 | `app.py:17866` `_PRESET_KINDS = (hc_my_presets, fr_my_templates, cap_presets)` · 글꼴 즐겨찾기 `app.py:17793` |\n| 최근 14일 제작량·AI비 | 887건 · 590,788원 (작업 표시 누락 96% → 편당 30~666원 범위) · 서버 16코어/30GB, 평균 부하 2.9 |\n\n## 2. 전체 구조\n```\n[웹: 컨셉 스튜디오]  컨셉 진열 · 내 팩 · 키 등록 · 작업 목록\n        │  (서버 = 설정 보관 + 단계 지시 + 버텍스형 렌더)\n        ├─────────────── Claude형 ────────────────┐\n        │  고객 Claude 데스크톱 + 설치팩(.mcpb)       │\n        │  \"스튜디오 설정대로 정치 한 편\"              │\n        │  설치팩 = 지휘 도구(MCP) + 실행기(렌더)      │\n        │  대본 = 고객 Claude, 렌더 = 고객 PC         │\n        │                                          │\n        └─────────────── 버텍스형 ─────────────────┘\n           웹 [만들기] → 우리 서버 대기열 → 렌더\n           대본·판정 = 고객 제미니 키, 서버비 1,000원 차감\n```\n\n## 3. 판단의 주인 (0순위-C — 한 판단 = 한 함수)\n| 판단 | 주인 | 부르는 곳 |\n|---|---|---|\n| 컨셉 정의 읽기·검증 | `shopping_shorts/concept_studio.py:load_concept` | 웹·MCP·서버 렌더·설치팩 |\n| 고객 설정 합치기 (컨셉 기본값 ⊕ 내 팩) | `concept_studio.resolve_settings` | 같음 |\n| 다음 단계 결정 | `concept_studio.next_step` | MCP 지시·서버 대기열 둘 다 |\n| 대본 검사 (반려 기준) | 컨셉 프리셋의 검사 규칙 → `concept_studio.check_script` | 두 방식 |\n| 완성본 검사 (내용 관문) | `channelkit/review.content_gate` 재사용 | 두 방식 |\n| 편당 1,000원 차감·환불 | `concept_studio.charge_render` (버텍스형만) | 서버 대기열 |\n| 고객 키 보관·조회 | `concept_studio.customer_keys` (암호화, 끝 4자만 표시) | 서버 렌더·설치팩 내려받기 |\n\n★ Claude형과 버텍스형이 **같은 함수를 부른다.** 다른 것은 \"대본을 누가 쓰나 / 렌더를 어디서 하나\" 두 가지뿐.\n\n## 4. 컨셉 프리셋 한 장 (칼카피 창이 채우는 형식)\n```\nconcept_presets/<이름>/concept.json\n  id, 이름, 설명, 견본영상, 공개여부, 상품(구매자만)\n  source_kind: product_url | person | news_url\n  steps: [seed, script, confirm_script, footage, voice, decorate, render, review]\n  script: {writer: claude|gemini, rules: [...], length, 말투}\n  footage: {where: shopping|broadcast|news_image, 검사: {...}}\n  defaults: {frame, headcopy, caption, voices{나레,배역…}, sfx_pack, meme_pack, bgm}\n  customer_can_change: [frame, headcopy, caption, voices, sfx_pack, meme_pack, bgm]\n  review: {content_gate 기준 숫자}\n  keys_needed: [typecast, naver_hub_id, …]\n```\n1호 = 픽션 썰(제품 링크형), 2호 = 뜨거운사람들(인물형). 칼카피 창은 이 형식으로 프리셋을 넘긴다.\n\n## 5. 사람 확인 자리\n- **대본 확정 1회** (두 방식 공통, `confirm_script` 단계에서 멈춤)\n- 자동 검사 실패 → 사람 대신 **멈춤** + 이유 표시 (완성본 안 만듦)\n\n## 6. 결과물 검사 (이 기능과 같은 커밋에 들어간다)\n| 무엇 | 어떻게 |\n|---|---|\n| Claude형 | 이 PC Claude 데스크톱에 `.mcpb` 설치 → \"설정대로 한 편\" → 고객 PC 폴더에 mp4 생성, ffprobe 길이·해상도, 프레임 시트로 팩(틀·자막) 반영 확인 |\n| 버텍스형 | 관리자 계정으로 웹 [만들기] → 완성본 mp4 + 고객 키 사용 기록(`gemini_usage.auth=customer`) + 1,000원 차감 행 |\n| 같은 설정 = 같은 결과 | 같은 컨셉·팩으로 두 방식을 돌려 틀·자막·목소리가 같은지 프레임 대조 |\n\n## 7. 단계\n| # | 할 일 | 됐다의 기준 | 상태 |\n|---|---|---|---|\n| P0 | **관문 시험**: 최소 `.mcpb`(Python) 하나로 Claude 데스크톱에서 ffmpeg 렌더 + 우리 서버 설정 1건 읽기 | 이 PC에서 mp4 생성 실측 | 다음 |\n| P1 | `concept_studio.py` (load/resolve/next_step/check_script) + 픽션 썰 프리셋 1호 | 단위 테스트 + 1호로 서버 렌더 1편 | |\n| P2 | 버텍스형: 고객 키 보관·키 등록 페이지·1,000원 차감 (**승인 필요**) | 관리자 계정 실측 | |\n| P3 | Claude형: 설치팩(지휘 도구 + 실행기 + 팩 받기·버전) + 서버 지시 API | 이 PC 실측 | |\n| P4 | 웹 컨셉 스튜디오 화면(관리자만) — 진열·내 팩·키·작업 목록 | 라이브에서 직접 눌러 완성본 | |\n| P5 | 2호 뜨거운사람들 · 칼카피 창 프리셋 받기 | 컨셉별 견본 3편 | |\n| P6 | 상품 분리·고객 공개 | **사장님 승인** | |\n\n## 8. 위험·미확인\n- `.mcpb` 실행기에서 ffmpeg 같은 무거운 바이너리를 묶는 크기·백신 경고 — P0에서 잰다.\n- Claude 데스크톱 MCP 도구 호출 시간 제한 — 렌더(수 분)는 백그라운드로 돌리고 상태 조회 도구로 나눈다(볼케이노의 run/status/deliver 와 같은 꼴).\n- 고객 Claude 사용량 한도 — 대본 단계에 몇 번 호출하는지 재서 컨셉 설명에 적는다.\n- 정치·연예인 방송 영상 저작권 — 상품 공개 전 정리.\n- 실행기 코드는 고객 PC에 남는다 → 컨셉 규칙은 서버 `next_step`이 단계마다 내려준다.\n- 서버 월 요금은 미확인 → 손익분기 = 월 서버비 ÷ 1,000원.\n";document.getElementById("c").innerHTML=marked.parse(MD);</script></body></html>
