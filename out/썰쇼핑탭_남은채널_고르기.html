<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1c2330;--sub:#5d6778;--line:#e3e7ee;--accent:#2563eb;--on:#e8f0ff}
@media (prefers-color-scheme:dark){:root{--bg:#12151b;--card:#1b2029;--ink:#e8ecf3;--sub:#9aa5b8;--line:#2c3442;--accent:#7aa7ff;--on:#1d2b47}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Pretendard","Malgun Gothic",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px}
.wrap{max-width:1900px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px}
.meta{color:var(--sub);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:10px}
input[type=search],select{font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink)}
input[type=search]{flex:1;min-width:160px}
button{font:inherit;padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--ink);cursor:pointer}
button.main{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700}
label.chk{font-size:13px;color:var(--sub);display:flex;gap:4px;align-items:center}
#cnt{font-weight:700;color:var(--accent)}
main{max-width:1900px;margin:0 auto;padding:12px 16px 80px}
#list{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:14px}
.row{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:12px;cursor:pointer}
.row.on{background:var(--on);border-color:var(--accent)}
.top{display:flex;gap:10px;align-items:center;margin-bottom:10px}
.top input{width:24px;height:24px;flex:none}
.top .who{flex:1;min-width:0}
.name{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.name a{color:inherit;text-decoration:none}
.name a:hover{text-decoration:underline}
.small{color:var(--sub);font-size:12px}
.nums{display:flex;gap:14px;font-variant-numeric:tabular-nums;font-size:13px;color:var(--sub);flex:none}
.nums b{color:var(--ink);font-size:15px;display:block;text-align:right}
.thumbs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.th{position:relative;aspect-ratio:9/16;border-radius:8px;overflow:hidden;background:var(--line)}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th span{position:absolute;left:0;right:0;bottom:0;padding:14px 6px 4px;color:#fff;font-size:13px;font-weight:700;background:linear-gradient(transparent,rgba(0,0,0,.75))}
.none{grid-column:1/-1;color:var(--sub);font-size:13px;padding:24px 0;text-align:center}
@media (max-width:520px){#list{grid-template-columns:1fr}.nums{gap:8px}}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#111;color:#fff;padding:10px 16px;border-radius:8px;display:none}
textarea{width:100%;height:90px;margin-top:8px;display:none;font:13px monospace}
</style></head><body>

const KEY = "sul_left_pick_v1";
let picked = new Set();
try{ picked = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); }catch(e){}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify([...picked])); }catch(e){} };
const n = v => v ? (v >= 10000 ? (v/10000).toFixed(v >= 100000 ? 0 : 1) + "만" : v.toLocaleString()) : "-";
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const $ = id => document.getElementById(id);
function render(){
  const q = $("q").value.trim().toLowerCase(), s = $("sort").value;
  let rows = DATA.filter(c => (!q || c.title.toLowerCase().includes(q)) && (!$("onlyOn").checked || picked.has(c.id)) && (!$("onlyRec").checked || c.n > 0));
  rows.sort((a,b) => s === "title" ? a.title.localeCompare(b.title, "ko") : (b[s]||0) - (a[s]||0));
  $("list").innerHTML = rows.map(c => `<div class="row ${picked.has(c.id) ? "on" : ""}" data-id="${c.id}">
    <div class="top"><input type="checkbox" ${picked.has(c.id) ? "checked" : ""}>
      <div class="who"><div class="name"><a href="https://www.youtube.com/channel/${c.id}/shorts" target="_blank" rel="noopener">${esc(c.title || c.id)}</a></div>
        <div class="small">${c.n ? "지금 랭킹에 있는 영상 " + c.n + "편 중 조회수 상위" : (c.v.length ? "쌓인 기록 없음 · 최근 영상 중 조회수 상위" : "쌓인 기록 없음")}</div></div>
      <div class="nums"><div><b>${n(c.subs)}</b>구독자</div><div><b>${n(c.med)}</b>평소</div><div><b>${n(c.max)}</b>최고</div></div></div>
    <div class="thumbs">${c.v.length ? c.v.map(v => `<a class="th" href="https://www.youtube.com/shorts/${v[0]}" target="_blank" rel="noopener"><img loading="lazy" src="https://i.ytimg.com/vi/${v[0]}/oardefault.jpg" alt=""><span>${n(v[1])}</span></a>`).join("") : `<div class="none">영상을 못 찾았습니다(채널이 없어졌을 수 있음)</div>`}</div></div>`).join("");
  $("cnt").textContent = picked.size;
}
$("list").addEventListener("click", e => {
  if(e.target.closest("a")) return;
  const row = e.target.closest(".row"); if(!row) return;
  const id = row.dataset.id;
  picked.has(id) ? picked.delete(id) : picked.add(id);
  save();
  row.classList.toggle("on", picked.has(id));
  row.querySelector(".top input").checked = picked.has(id);
  $("cnt").textContent = picked.size;
});
["q","sort","onlyOn","onlyRec"].forEach(id => $(id).addEventListener("input", render));
$("clr").onclick = () => { if(picked.size && !$("clr").dataset.arm){ $("clr").dataset.arm = 1; $("clr").textContent = "한 번 더 누르면 해제"; setTimeout(() => { delete $("clr").dataset.arm; $("clr").textContent = "전부 해제"; }, 3000); return; }
  picked.clear(); save(); delete $("clr").dataset.arm; $("clr").textContent = "전부 해제"; render(); };
$("copy").onclick = async () => {
  const txt = "썰쇼핑 탭에 남은 채널 선택 " + picked.size + "개\n" + DATA.filter(c => picked.has(c.id)).map(c => c.title + "\t" + c.id).join("\n");
  const t = $("toast"), o = $("out");
  try{ await navigator.clipboard.writeText(txt); t.textContent = picked.size + "개 복사됨 — 대화창에 붙여 넣어 주세요"; }
  catch(e){ o.style.display = "block"; o.value = txt; o.select(); t.textContent = "아래 칸 내용을 복사해 주세요"; }
  t.style.display = "block"; setTimeout(() => t.style.display = "none", 2500);
};
render();
</script></body></html>
