<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; padding: 40px; }
  h2 { color: #888; font-size: 14px; letter-spacing: 4px; margin-bottom: 16px; margin-top: 48px; }
  h2:first-child { margin-top: 0; }

  .thumb {
    width: 1280px;
    height: 720px;
    position: relative;
    overflow: hidden;
    border-radius: 8px;
    transform-origin: top left;
    transform: scale(0.65);
    margin-bottom: -252px;
  }

  /* ══════════════════ A안 ══════════════════ */
  .a {
    background: #080c14;
    display: flex;
  }

  /* 왼쪽: 얼굴 자리 */
  .a .face-area {
    width: 480px;
    height: 100%;
    flex-shrink: 0;
    position: relative;
    background: linear-gradient(135deg, #0d1520 0%, #080c14 100%);
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 16px;
  }
  .a .face-placeholder {
    width: 320px; height: 380px;
    border: 2px dashed #333;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 12px;
    color: #444; font-size: 15px;
  }
  .a .face-placeholder .emoji { font-size: 80px; }
  .a .face-label {
    color: #444; font-size: 13px; letter-spacing: 2px; margin-top: 8px;
  }

  /* 오른쪽: 텍스트 */
  .a .text-area {
    flex: 1;
    padding: 48px 52px 48px 44px;
    display: flex; flex-direction: column; justify-content: center; gap: 20px;
    position: relative;
  }
  .a .badge {
    display: inline-block;
    background: #FF4757;
    color: #fff; font-size: 20px; font-weight: 900; letter-spacing: 2px;
    padding: 6px 20px; border-radius: 6px;
    width: fit-content;
  }
  .a .main-top {
    font-size: 56px; font-weight: 900; color: #e5e7eb; line-height: 1.15;
  }
  .a .main-top span { color: #00FFD0; text-shadow: 0 0 20px rgba(0,255,208,0.6); }
  .a .main-mid {
    font-size: 80px; font-weight: 900; color: #fff; line-height: 1;
    text-shadow: 0 0 30px rgba(255,255,255,0.15);
  }
  .a .main-mid .num { color: #00FFD0; text-shadow: 0 0 30px rgba(0,255,208,0.8); }
  .a .sub-row {
    display: flex; align-items: center; gap: 20px;
  }
  .a .sub-row .strike {
    font-size: 36px; font-weight: 700; color: #6b7280;
    text-decoration: line-through; text-decoration-color: #FF4757;
  }
  .a .sub-row .zero {
    font-size: 48px; font-weight: 900; color: #00FFD0;
    text-shadow: 0 0 20px rgba(0,255,208,0.7);
  }
  .a .bottom-tag {
    font-size: 22px; color: #4b5563; font-weight: 700; letter-spacing: 2px;
    border-top: 1px solid #1f2937; padding-top: 16px;
  }

  /* 배경 글로우 */
  .a .glow {
    position: absolute; right: -60px; top: 50%; transform: translateY(-50%);
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(0,255,208,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .a .glow2 {
    position: absolute; left: 0; top: 0;
    width: 480px; height: 100%;
    background: linear-gradient(to right, transparent 70%, #080c14 100%);
    pointer-events: none;
  }

  /* ══════════════════ B안 ══════════════════ */
  .b {
    background: #080c14;
    display: flex; align-items: stretch;
  }
  .b .left {
    width: 50%; position: relative;
    background: linear-gradient(135deg, #1a0a0a 0%, #0d0808 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 20px; padding: 48px;
    border-right: 3px solid #1f2937;
  }
  .b .left::before {
    content: 'BEFORE';
    position: absolute; top: 24px; left: 32px;
    color: #6b7280; font-size: 14px; font-weight: 700; letter-spacing: 6px;
  }
  .b .left .icon-big { font-size: 100px; }
  .b .left .label {
    font-size: 36px; font-weight: 900; color: #9ca3af; line-height: 1.2; text-align: center;
  }
  .b .left .hours {
    font-size: 64px; font-weight: 900; color: #FF4757;
    font-family: 'Consolas', monospace;
    text-shadow: 0 0 20px rgba(255,71,87,0.5);
  }
  .b .left .hours-sub { font-size: 22px; color: #6b7280; font-weight: 700; }

  .b .right {
    width: 50%; position: relative;
    background: linear-gradient(135deg, #041212 0%, #080c14 100%);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 16px; padding: 48px;
  }
  .b .right::before {
    content: 'AFTER';
    position: absolute; top: 24px; right: 32px;
    color: #00FFD0; font-size: 14px; font-weight: 700; letter-spacing: 6px;
  }
  .b .workers {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px;
  }
  .b .worker {
    width: 76px; height: 76px; border-radius: 12px;
    background: rgba(0,255,208,0.08); border: 1.5px solid rgba(0,255,208,0.25);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    font-size: 28px;
  }
  .b .worker-label { font-size: 9px; color: #00FFD0; font-weight: 700; }
  .b .right .big-num {
    font-size: 90px; font-weight: 900; color: #00FFD0; line-height: 1;
    text-shadow: 0 0 30px rgba(0,255,208,0.8);
    font-family: 'Consolas', monospace;
  }
  .b .right .big-label {
    font-size: 38px; font-weight: 900; color: #fff; letter-spacing: 2px;
  }
  .b .right .cost {
    font-size: 22px; font-weight: 700; color: #4b5563;
    border: 1.5px solid #1f2937; padding: 6px 24px; border-radius: 20px;
  }
  .b .right .cost span { color: #00FFD0; }

  /* 중앙 화살표 */
  .b .arrow {
    position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
    width: 60px; height: 60px; border-radius: 50%;
    background: #080c14; border: 2px solid #1f2937;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; z-index: 10;
  }

  /* ══════════════════ C안 ══════════════════ */
  .c {
    background: #080c14;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; position: relative;
  }
  .c .bg-glow {
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 45%, rgba(0,255,208,0.14) 0%, transparent 65%);
    pointer-events: none;
  }
  .c .top-badge {
    position: absolute; top: 36px;
    display: flex; gap: 16px;
  }
  .c .top-badge span {
    padding: 6px 22px; border-radius: 20px; font-size: 17px; font-weight: 800;
  }
  .c .tag-red { background: rgba(255,71,87,0.18); border: 1.5px solid rgba(255,71,87,0.4); color: #FF4757; }
  .c .tag-mint { background: rgba(0,255,208,0.12); border: 1.5px solid rgba(0,255,208,0.35); color: #00FFD0; }

  .c .center {
    text-align: center; position: relative; z-index: 2;
  }
  .c .line1 {
    font-size: 52px; font-weight: 900; color: #6b7280; letter-spacing: 2px;
    margin-bottom: 4px;
  }
  .c .line1 em { color: #e5e7eb; font-style: normal; }
  .c .line2 {
    font-size: 110px; font-weight: 900; color: #fff; line-height: 1;
    letter-spacing: -2px;
  }
  .c .line2 .stock { color: #00FFD0; text-shadow: 0 0 40px rgba(0,255,208,0.9); }
  .c .line3 {
    font-size: 54px; font-weight: 900; color: #e5e7eb; margin-top: 8px;
  }
  .c .workers-row {
    display: flex; gap: 14px; justify-content: center; margin-top: 28px;
  }
  .c .w-icon {
    width: 80px; height: 80px; border-radius: 50%;
    background: rgba(0,255,208,0.08); border: 2px solid rgba(0,255,208,0.3);
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    box-shadow: 0 0 16px rgba(0,255,208,0.2);
  }

  .c .bottom-bar {
    position: absolute; bottom: 0; left: 0; right: 0;
    background: rgba(0,255,208,1);
    padding: 18px 60px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .c .bottom-bar .left-text {
    font-size: 28px; font-weight: 900; color: #080c14; letter-spacing: 1px;
  }
  .c .bottom-bar .right-text {
    font-size: 22px; font-weight: 800; color: rgba(8,12,20,0.7);
  }
</style>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #111; font-family: 'Apple SD Gothic Neo', 'Noto Sans KR', sans-serif; }
  .thumb { transform: none !important; margin-bottom: 0 !important; width: 1280px; height: 720px; border-radius: 0; }
</style>
</head>
<body>
<div class="thumb" style="background:#080c14; display:flex; flex-direction:column; align-items:center; justify-content:space-between;">

  <!-- ══ 배경: 왼쪽 밤 / 오른쪽 아침 ══ -->
  <div style="position:absolute; inset:0; overflow:hidden; pointer-events:none;">

    <!-- 왼쪽: 밤 -->
    <div style="position:absolute; left:0; top:0; width:50%; height:100%;
      background:linear-gradient(160deg, #0a0d1f 0%, #060912 60%, #080c14 100%);">
    </div>
    <!-- 달 -->
    <div style="position:absolute; left:80px; top:60px; font-size:72px; opacity:0.55;">🌙</div>
    <!-- 별들 -->
    <svg style="position:absolute; left:0; top:0; width:640px; height:720px;" opacity="0.5">
      <circle cx="160" cy="90"  r="2.5" fill="#fff"/>
      <circle cx="240" cy="45"  r="1.5" fill="#fff"/>
      <circle cx="310" cy="120" r="2"   fill="#fff"/>
      <circle cx="420" cy="55"  r="1.5" fill="#aef"/>
      <circle cx="500" cy="100" r="2"   fill="#fff"/>
      <circle cx="100" cy="200" r="1.5" fill="#aef"/>
      <circle cx="370" cy="180" r="2"   fill="#fff"/>
      <circle cx="200" cy="280" r="1.5" fill="#fff"/>
      <circle cx="490" cy="240" r="2"   fill="#aef"/>
      <circle cx="130" cy="360" r="1.5" fill="#fff"/>
      <circle cx="320" cy="340" r="2"   fill="#fff"/>
      <circle cx="60"  cy="450" r="1.5" fill="#aef"/>
      <circle cx="450" cy="420" r="2"   fill="#fff"/>
      <circle cx="260" cy="500" r="1.5" fill="#fff"/>
      <circle cx="570" cy="380" r="2"   fill="#aef"/>
      <circle cx="90"  cy="580" r="1.5" fill="#fff"/>
      <circle cx="400" cy="560" r="2"   fill="#fff"/>
    </svg>
    <!-- zZz -->
    <div style="position:absolute; left:170px; top:300px; color:rgba(170,220,255,0.35); font-size:52px; font-weight:900; font-style:italic; letter-spacing:6px;">zZz</div>

    <!-- 왼쪽/오른쪽 블렌드 그라디언트 (중앙 페이드) -->
    <div style="position:absolute; left:380px; top:0; width:260px; height:100%;
      background:linear-gradient(to right, transparent 0%, rgba(8,12,20,0.7) 100%); pointer-events:none;"></div>

    <!-- 오른쪽: 아침 하늘 — 오른쪽 끝만 밝고 중앙쪽은 어둡게 -->
    <div style="position:absolute; right:0; top:0; width:50%; height:100%;
      background:linear-gradient(to left, #FF9500 0%, #C85000 25%, #5a1800 55%, #0d0400 100%);">
    </div>
    <!-- 해 (우측 상단 고정) -->
    <div style="position:absolute; right:80px; top:32px; font-size:96px; opacity:0.95; filter:drop-shadow(0 0 30px #FFD700) drop-shadow(0 0 60px #FF8C00);">☀️</div>
    <!-- 햇살: 오른쪽 상단 코너에서만 발산 -->
    <svg style="position:absolute; right:0; top:0; width:640px; height:720px;" opacity="0.5">
      <defs>
        <radialGradient id="sunGlow3" cx="100%" cy="0%" r="55%">
          <stop offset="0%"   stop-color="#FFE57F"/>
          <stop offset="45%"  stop-color="#FF8C00" stop-opacity="0.4"/>
          <stop offset="100%" stop-color="transparent"/>
        </radialGradient>
      </defs>
      <rect x="0" y="0" width="640" height="720" fill="url(#sunGlow3)"/>
    </svg>
    <!-- 오른쪽/왼쪽 블렌드 -->
    <div style="position:absolute; right:380px; top:0; width:260px; height:100%;
      background:linear-gradient(to left, transparent 0%, rgba(8,12,20,0.7) 100%); pointer-events:none;"></div>

    <!-- 중앙 수직 구분선 -->
    <div style="position:absolute; left:50%; top:10%; bottom:10%; width:1.5px; background:linear-gradient(to bottom, transparent, rgba(255,255,255,0.12) 30%, rgba(255,255,255,0.12) 70%, transparent);"></div>

  </div>


  <!-- ══ 상단 뱃지 2개 (가운데 정렬 · 크게) ══ -->
  <div style="position:relative; z-index:2; display:flex; gap:20px; padding-top:32px; justify-content:center;">
    <div style="background:#C8002A; border-radius:10px; padding:14px 44px; box-shadow:0 4px 0 #8a0018;">
      <span style="color:#fff; font-size:30px; font-weight:900; letter-spacing:1px;">💰 월급 0원</span>
    </div>
    <div style="background:#C8002A; border-radius:10px; padding:14px 44px; box-shadow:0 4px 0 #8a0018;">
      <span style="color:#fff; font-size:30px; font-weight:900; letter-spacing:1px;">노조 없음 😂</span>
    </div>
  </div>

  <!-- ══ 메인 텍스트 (가운데 정렬) ══ -->
  <div style="position:relative; z-index:2; text-align:center; padding:0 60px; flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; text-shadow: 0 3px 18px rgba(0,0,0,0.95), 0 1px 6px rgba(0,0,0,0.9);">

    <!-- "제가 자는동안" 강조 -->
    <div style="font-size:84px; font-weight:900; color:#00FFD0; letter-spacing:-1px; line-height:1;">
      제가 자는동안
    </div>

    <!-- 메인 카피 -->
    <div style="font-size:104px; font-weight:900; color:#FFFFFF; letter-spacing:-3px; line-height:0.95;">
      모든 주식분석을
    </div>
    <div style="font-size:104px; font-weight:900; color:#FFFFFF; letter-spacing:-3px; line-height:0.95;">
      끝냈습니다.
    </div>

    <!-- 서브: 박스 강조 -->
    <div style="margin-top:22px; border:3px solid #00FFD0; border-radius:14px; padding:20px 52px; background:rgba(0,255,208,0.07); display:inline-flex; align-items:center; gap:20px;">
      <span style="color:#ffffff; font-size:40px; font-weight:900; letter-spacing:0px;">24시간 일하는 AI 전담직원</span>
      <span style="color:#00FFD0; font-size:56px; font-weight:900; line-height:1;">10명</span>
    </div>
  </div>

  <!-- ══ 하단 라인 + STOCK BRAIN ══ -->
  <div style="position:relative; z-index:2; width:100%; border-top:2px solid #1e2d3d; padding:18px 56px; display:flex; align-items:center; justify-content:space-between; background:rgba(0,0,0,0.4);">
    <div style="display:flex; align-items:center; gap:16px;">
      <div style="width:36px; height:36px; border-radius:8px; background:#00FFD0; display:flex; align-items:center; justify-content:center; font-size:20px;">🧠</div>
      <span style="color:#00FFD0; font-size:28px; font-weight:900; letter-spacing:3px;">STOCK BRAIN</span>
    </div>
    <span style="color:#4b5563; font-size:17px; font-weight:600; letter-spacing:2px;">로또의 주식인사이트</span>
  </div>

</div>
</body>
</html>
