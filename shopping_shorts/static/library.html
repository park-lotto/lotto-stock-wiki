<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대본 위키(도서관) — 쇼핑쇼츠</title>
<style>
  :root{--bg:#0a0e14;--panel:#111722;--line:#1e2735;--txt:#e6edf3;--sub:#8b98a9;--accent:#2f81f7;--gold:#ffd76b;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic',system-ui,sans-serif;display:flex;min-height:100vh}
  .sidebar{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:16px;flex-shrink:0}
  .sidebar h1{font-size:14px;color:var(--sub);margin-bottom:16px}
  .menu-group{margin-bottom:18px}
  .menu-group .label{font-size:11px;color:var(--sub);text-transform:uppercase;margin-bottom:8px}
  .menu-item{padding:8px 12px;border-radius:8px;font-size:13px;color:var(--txt);cursor:pointer;margin-bottom:2px}
  .menu-item.active{background:linear-gradient(90deg,#153a6b,#0d2340);color:#7db4ff}
  .main{flex:1;padding:28px 36px;overflow:auto}
  .head h2{font-size:24px}
  .desc{color:var(--sub);font-size:13px;margin:6px 0 20px;line-height:1.6}
  .cards{display:flex;flex-direction:column;gap:18px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;display:flex;gap:18px}
  .vid{width:260px;flex-shrink:0;display:flex;flex-direction:column;gap:8px}
  .vid video{width:100%;border-radius:10px;background:#000;max-height:440px}
  .vid .novid{width:100%;aspect-ratio:9/16;border-radius:10px;background:#0d131c;border:1px dashed var(--line);
              display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:12px;text-align:center;padding:14px}
  .vid a{font-size:12px;color:var(--accent);text-decoration:none;text-align:center}
  .body{flex:1;min-width:0;display:flex;flex-direction:column;gap:10px}
  .ch{font-weight:600;font-size:15px;display:flex;justify-content:space-between;align-items:flex-start;gap:8px}
  .ch .rm{background:none;border:1px solid var(--line);color:var(--sub);font-size:11px;border-radius:6px;padding:3px 8px;cursor:pointer;flex-shrink:0}
  .ch .rm:hover{color:#ff9b9b;border-color:#ff9b9b}
  .meta{font-size:11px;color:var(--sub)}
  .hook{background:#0d131c;border:1px solid var(--line);border-radius:8px;padding:10px}
  .hook .type{display:inline-block;background:linear-gradient(90deg,#3a2f0d,#2a2408);border:1px solid #b8860b;color:var(--gold);font-size:11px;padding:2px 8px;border-radius:12px;margin-bottom:6px}
  .hook .line{font-size:14px;font-weight:600;line-height:1.5}
  .why{font-size:12px;color:#9fd0ff;background:#0d1b2e;border-left:2px solid var(--accent);padding:7px 10px;border-radius:4px;line-height:1.5}
  .tagrow{display:flex;flex-wrap:wrap;gap:6px}
  .tag{font-size:11px;border:1px solid var(--line);border-radius:6px;padding:3px 9px;color:var(--txt)}
  .tag b{color:var(--sub);font-weight:400;margin-right:4px}
  .chars{background:#12100a;border:1px solid #4a3d10;border-radius:8px;padding:10px}
  .chars .t{font-size:11px;color:var(--gold);margin-bottom:6px}
  .chars li{list-style:none;font-size:12px;padding:3px 0;line-height:1.5}
  .chars .who{color:var(--gold);font-weight:600}
  .story{font-size:12.5px;line-height:1.6;color:var(--txt)}
  .sec-t{font-size:11px;color:var(--sub);text-transform:uppercase;margin-top:2px}
  .beats{list-style:none;font-size:12px}
  .beats li{padding:5px 0 5px 10px;border-left:2px solid var(--line);margin-bottom:5px}
  .beats .lb{color:var(--accent);font-weight:600;font-size:11px}
  .beats .sc{color:var(--sub);font-size:10px;margin-left:4px}
  .devices{display:flex;flex-wrap:wrap;gap:5px}
  .devices span{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:12px;padding:2px 8px}
  details summary{cursor:pointer;font-size:12px;color:var(--accent);list-style:none}
  details .full{background:#0d131c;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;line-height:1.7;white-space:pre-wrap;margin-top:8px}
  .row{display:flex;gap:8px;margin-top:2px}
  .row button{font-size:12px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:5px 10px;cursor:pointer}
  .row button:hover{border-color:var(--accent)}
  .empty{color:var(--sub);text-align:center;padding:80px 20px;line-height:1.8}
  .gen-btn{background:linear-gradient(90deg,#153a6b,#0d2340)!important;border-color:var(--accent)!important;color:#7db4ff!important;font-weight:600}
  .send-btn.sent{background:linear-gradient(90deg,#1c5a2e,#0d3a1c)!important;border-color:#2ea043!important;color:#7ee0a0!important}
  /* 생성 모달 */
  .gen-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:200;align-items:flex-start;justify-content:center;padding:24px;overflow:auto}
  .gen-bg.open{display:flex}
  .gen-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;width:min(760px,100%);display:flex;flex-direction:column;max-height:92vh}
  .gen-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line)}
  .gen-head b{font-size:15px}
  .gen-head .x{background:none;border:none;color:var(--sub);font-size:20px;cursor:pointer}
  .gen-body{padding:16px 18px;overflow:auto}
  .gen-sec{font-size:12px;color:var(--sub);margin:12px 0 8px;text-transform:uppercase}
  .toggles{display:flex;flex-wrap:wrap;gap:8px}
  .elem-row{display:flex;align-items:center;gap:6px}
  .elem-mode{background:#0d131c;border:1px solid var(--line);border-radius:6px;color:var(--txt);font-size:12px;padding:4px 6px}
  .toggles label{display:flex;align-items:center;gap:6px;font-size:13px;background:#0d131c;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
  .toggles input{accent-color:var(--accent)}
  .modes{display:flex;flex-direction:column;gap:6px;font-size:13px}
  .modes label{display:flex;align-items:center;gap:6px;cursor:pointer}
  #genTopic{width:100%;margin-top:8px;background:#0d131c;border:1px solid var(--line);border-radius:8px;padding:9px 12px;color:var(--txt);font-size:13px}
  .gen-run{margin-top:16px;width:100%;background:linear-gradient(90deg,#153a6b,#0d2340);border:1px solid var(--accent);color:#7db4ff;font-weight:600;font-size:14px;padding:11px;border-radius:9px;cursor:pointer}
  .gen-run:disabled{opacity:.6;cursor:wait}
  .gen-results{margin-top:8px}
  .draft{background:#0d131c;border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:12px}
  .draft .dh{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:6px}
  .draft .ds{font-size:13.5px;line-height:1.7;white-space:pre-wrap}
  .draft .da{font-size:11px;color:var(--sub);margin-top:8px;border-top:1px solid var(--line);padding-top:6px}
  .draft .dcopy{margin-top:8px;font-size:12px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:4px 10px;cursor:pointer}
  .draft .dtext{width:100%;min-height:90px;background:#0a0e14;border:1px solid var(--line);border-radius:8px;
                color:var(--txt);font-size:13.5px;line-height:1.7;padding:10px;font-family:inherit;resize:vertical}
  .draft .refine-row{display:flex;gap:6px;margin-top:8px}
  .draft .refine-row input{flex:1;background:#0d131c;border:1px solid var(--line);border-radius:6px;color:var(--txt);padding:7px 10px;font-size:12.5px}
  .draft .refine-row button{font-size:12px;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer;white-space:nowrap}
  .draft .hist{margin-top:8px;font-size:11.5px;color:var(--sub);cursor:pointer}
  .draft .hist-list{display:none;margin-top:6px;background:#0a0e14;border:1px solid var(--line);border-radius:6px;padding:6px}
  .draft .hist-list.open{display:block}
  .draft .hist-item{padding:5px 6px;font-size:12px;cursor:pointer;border-radius:4px}
  .draft .hist-item:hover{background:#161d2b}
  .gen-load{text-align:center;color:var(--sub);padding:30px;font-size:14px}
  .gen-err{color:#ff9b9b;padding:16px;font-size:13px;text-align:center}
  @media(max-width:768px){.sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line)}.main{padding:16px 14px}.card{flex-direction:column}.vid{width:100%;max-width:280px}}
</style>
</head>
<body>
  <main class="main">
    <div class="head"><h2>📚 대본 위키(도서관)</h2></div>
    <div class="desc" id="desc">S급 대본을 <b>원본 영상 + 구조 분석</b>을 나란히 보며 학습합니다. 랭킹에서 <b>📝 대본 추출 → ⭐ S급 위키 저장</b>으로 담으세요.</div>
    <div class="cards" id="cards"><div class="empty">불러오는 중…</div></div>
  </main>
  <div class="gen-bg" id="genModal">
    <div class="gen-box">
      <div class="gen-head"><b>🎬 이 구조로 대본 생성</b><button class="x" onclick="closeGen()">✕</button></div>
      <div class="gen-body">
        <div class="gen-sec">유지할 요소 (체크=원본유지 / 해제 시 아래에서 선택)</div>
        <div class="toggles" id="genToggles">
          <div class="elem-row" data-k="characters"><label><input type="checkbox" data-k="characters" checked onchange="onElemToggle(this)"> 👥 주변인물</label><select class="elem-mode" style="display:none"></select></div>
          <div class="elem-row" data-k="twist"><label><input type="checkbox" data-k="twist" checked onchange="onElemToggle(this)"> ✨ 발상전환</label><select class="elem-mode" style="display:none"></select></div>
          <div class="elem-row" data-k="development"><label><input type="checkbox" data-k="development" checked onchange="onElemToggle(this)"> 🎬 전개방식</label><select class="elem-mode" style="display:none"></select></div>
          <div class="elem-row" data-k="hook"><label><input type="checkbox" data-k="hook" checked onchange="onElemToggle(this)"> 🎣 훅</label><select class="elem-mode" style="display:none"></select></div>
          <div class="elem-row" data-k="appeal"><label><input type="checkbox" data-k="appeal" checked onchange="onElemToggle(this)"> 🎯 어필포인트</label><select class="elem-mode" style="display:none"></select></div>
          <div class="elem-row" data-k="tone"><label><input type="checkbox" data-k="tone" checked onchange="onElemToggle(this)"> 🗣 말투/어미</label><select class="elem-mode" style="display:none"></select></div>
        </div>
        <div class="gen-sec">주제</div>
        <div class="modes">
          <label><input type="radio" name="genmode" value="A" checked onchange="toggleTopic()"> 같은 주제로 신선하게 변주</label>
          <label><input type="radio" name="genmode" value="B" onchange="toggleTopic()"> 내 주제/제품으로 이식 (구조만 빌림)</label>
          <input id="genTopic" placeholder="예: 무선 가습기 / 여름 결로 방지 커튼" style="display:none">
        </div>
        <button class="gen-run" id="genRun" onclick="runGen()">✨ 초안 생성 (10~20초)</button>
        <div class="gen-results" id="genResults"></div>
      </div>
    </div>
  </div>
<script>
function esc(s){ return (s||'').replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function videoFallback(v){
  const div=document.createElement('div'); div.className='novid';
  const a=document.createElement('a'); a.href=v.dataset.src||'#'; a.target='_blank'; a.textContent='인스타 원본 ↗';
  div.append('원본 영상 없음 (저장 당시 URL 만료)', document.createElement('br'), a);
  v.replaceWith(div);
}
async function load(){
  const el=document.getElementById('cards');
  try{
    const d=await (await fetch('/api/wiki/list')).json();
    const items=d.items||[];
    document.getElementById('desc').innerHTML += ` <b style="color:var(--gold)">· ${items.length}개 보관 중</b>`;
    if(!items.length){ el.innerHTML='<div class="empty">아직 담은 S급 대본이 없습니다.<br>레퍼런스 랭킹에서 마음에 드는 영상의 <b>📝 대본 추출 → ⭐ S급 위키 저장</b>을 눌러 채워보세요.</div>'; return; }
    el.innerHTML=items.map(render).join('');
    markPicked();
  }catch(e){ el.innerHTML='<div class="empty">불러오기 실패 — 새로고침 해주세요.</div>'; }
}
async function markPicked(){
  try{
    const d=await (await fetch('/api/produce/picks')).json();
    const set=new Set(d.shortcodes||[]);
    document.querySelectorAll('.send-btn').forEach(b=>{
      if(set.has(b.dataset.sc)){ b.textContent='✓ 영상제작에 담김'; b.classList.add('sent'); }
    });
  }catch(e){}
}
function tag(label,val){ return val?`<span class="tag"><b>${label}</b>${esc(val)}</span>`:''; }
function render(i){
  const s=i.structure||{};
  const sc=esc(i.shortcode);
  const vurl='/api/wiki/video?shortcode='+encodeURIComponent(i.shortcode);
  const video=`<video src="${vurl}" controls playsinline preload="metadata" data-src="${esc(i.source_url||'')}" onerror="videoFallback(this)"></video>`;
  const chars=(s.characters||[]).map(c=>`<li><span class="who">${esc(c.who)}</span> — ${esc(c.role)}</li>`).join('');
  const beats=(s.beats||[]).map(b=>`<li><span class="lb">${esc(b.label)}</span><span class="sc">${esc(b.approx_sec||'')}</span><br>${esc(b.desc||'')}</li>`).join('');
  const devs=(s.devices||[]).map(d=>`<span>${esc(d)}</span>`).join('');
  return `<div class="card">
    <div class="vid">${video}</div>
    <div class="body">
      <div class="ch"><span>${esc(i.name||'')} <span class="meta">· ${esc(i.category||'')}</span></span>
        <button class="rm" onclick="removeItem('${sc}', this)">삭제</button></div>
      <div class="meta">팔로워 ${(i.followers||0).toLocaleString()} · 댓글 ${(i.comments||0).toLocaleString()} · 참여밀도 ${((i.density||0)*100).toFixed(2)}%</div>
      ${s.hook_type?`<div class="hook"><span class="type">🎣 ${esc(s.hook_type)}</span><div class="line">${esc(s.hook_line||'')}</div></div>`:''}
      ${s.one_line_why?`<div class="why">💡 ${esc(s.one_line_why)}</div>`:''}
      <div class="tagrow">${tag('🎙 화자',s.narrator)}${tag('🎬 전개',s.development)}${tag('🎯 어필포인트',s.appeal)}${tag('🗣 말투',s.tone)}${tag('⏱',s.target_seconds?s.target_seconds+'초':'')}</div>
      ${chars?`<div class="chars"><div class="t">👥 등장 주변인물 (스토리텔링 핵심 기법)</div><ul>${chars}</ul></div>`:''}
      ${s.storyline?`<div><div class="sec-t">스토리라인</div><div class="story">${esc(s.storyline)}</div></div>`:''}
      ${s.twist?`<div><div class="sec-t">✨ 발상전환</div><div class="story">${esc(s.twist)}</div></div>`:''}
      ${beats?`<div class="sec-t">비트 구조</div><ul class="beats">${beats}</ul>`:''}
      ${devs?`<div class="sec-t">설득 장치</div><div class="devices">${devs}</div>`:''}
      <details><summary>전체 대본 보기</summary><div class="full">${esc(i.full_text||'(대본 없음)')}</div></details>
      <div class="row"><button class="gen-btn" onclick="openGen('${sc}')">🎬 이 구조로 생성</button><button onclick="copyFull(this)">📋 대본 복사</button><button class="send-btn" data-sc="${sc}" onclick="sendToProduce('${sc}', this)">🎬 영상제작으로 보내기</button></div>
    </div>
  </div>`;
}
async function sendToProduce(sc, btn){
  try{
    const d=await (await fetch('/api/produce/picks/toggle',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shortcode:sc})})).json();
    if(!d.ok){ alert(d.error||'실패'); return; }
    btn.textContent = d.picked ? '✓ 영상제작에 담김' : '🎬 영상제작으로 보내기';
    btn.classList.toggle('sent', d.picked);
  }catch(e){ alert('네트워크 오류'); }
}
async function removeItem(sc, btn){
  if(!confirm('위키에서 제거할까요?')) return;
  await fetch('/api/wiki/remove?shortcode='+encodeURIComponent(sc), {method:'POST'});
  btn.closest('.card').remove();
}
async function copyFull(btn){
  const full=((btn.closest('.card').querySelector('.full'))||{}).innerText||'';
  try{ await navigator.clipboard.writeText(full); }catch(e){ const t=document.createElement('textarea'); t.value=full; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  const o=btn.textContent; btn.textContent='✓ 복사됨'; setTimeout(()=>btn.textContent=o,1200);
}
// ── 생성(적용) ──
async function openGen(sc){
  window._genSC=sc; document.getElementById('genResults').innerHTML='';
  document.getElementById('genModal').classList.add('open');
  const card = document.querySelector(`[onclick="openGen('${sc}')"]`)?.closest('.card');
  const category = card?.querySelector('.meta')?.textContent?.split('·')[1]?.trim() || '';
  window._genOptions = {};
  try{
    const d = await (await fetch('/api/wiki/element_options?category='+encodeURIComponent(category))).json();
    window._genOptions = d.options || {};
  }catch(e){}
  document.querySelectorAll('#genToggles .elem-row').forEach(row=>{
    const key = row.dataset.k;
    const opts = window._genOptions[key] || [];
    const sel = row.querySelector('.elem-mode');
    sel.innerHTML = '<option value="random">🎲 랜덤</option>'
      + opts.map(o=>`<option value="category:${o.label}">${o.label}</option>`).join('')
      + '<option value="free">✨ AI 자유즉흥</option>';
  });
}
function onElemToggle(cb){
  const sel = cb.closest('.elem-row').querySelector('.elem-mode');
  sel.style.display = cb.checked ? 'none' : 'inline-block';
}
function closeGen(){ document.getElementById('genModal').classList.remove('open'); }
function toggleTopic(){ const b=document.querySelector('input[name=genmode]:checked').value==='B'; document.getElementById('genTopic').style.display=b?'block':'none'; }
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeGen(); });
async function runGen(){
  const btn=document.getElementById('genRun'); const res=document.getElementById('genResults');
  const elemModes = {};
  document.querySelectorAll('#genToggles .elem-row').forEach(row=>{
    const key = row.dataset.k;
    const cb = row.querySelector('input[type=checkbox]');
    elemModes[key] = cb.checked ? 'keep' : row.querySelector('.elem-mode').value;
  });
  const mode=document.querySelector('input[name=genmode]:checked').value;
  const topic=document.getElementById('genTopic').value.trim();
  if(mode==='B' && !topic){ res.innerHTML='<div class="gen-err">내 주제/제품을 입력하세요.</div>'; return; }
  btn.disabled=true; btn.textContent='⏳ 생성 중…'; res.innerHTML='<div class="gen-load">✨ S급 구조를 빌려 초안 만드는 중… (10~20초)</div>';
  try{
    const d=await (await fetch('/api/wiki/generate?shortcode='+encodeURIComponent(window._genSC), {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({mode, my_topic: topic, n: 3, elem_modes: elemModes}),
    })).json();
    if(!d.ok){ res.innerHTML='<div class="gen-err">⚠️ '+esc(d.error||'생성 실패')+'</div>'; return; }
    res.innerHTML=(d.drafts||[]).map((dr,i)=>`<div class="draft" data-draft-id="${dr.draft_id}">
      <div class="dh">초안 ${i+1} · ${esc(dr.hook||'')}</div>
      <textarea class="dtext" onblur="onDraftEdit(this)">${esc(dr.script||'')}</textarea>
      <div class="da">🔧 ${esc(dr.applied||'')}</div>
      <div class="refine-row">
        <input type="text" class="refine-inst" placeholder="지시문 (예: 더 유머러스하게)">
        <button onclick="refineDraft(this,'rewrite')">전체 재작성</button>
        <button onclick="refineDraft(this,'partial')">선택 부분만 수정</button>
      </div>
      <button class="dcopy" onclick="copyDraft(this)">📋 복사</button>
      <div class="hist" onclick="toggleHistory(this)">📜 버전 이력 보기 ▾</div>
      <div class="hist-list"></div>
    </div>`).join('')
      || '<div class="gen-err">생성 결과가 비었습니다 — 다시 시도해주세요.</div>';
  }catch(e){ res.innerHTML='<div class="gen-err">⚠️ 네트워크 오류 — 잠시 후 재시도</div>'; }
  finally{ btn.disabled=false; btn.textContent='✨ 초안 생성 (10~20초)'; }
}
async function copyDraft(btn){
  const s=((btn.closest('.draft').querySelector('.dtext'))||{}).value||'';
  try{ await navigator.clipboard.writeText(s); }catch(e){ const t=document.createElement('textarea'); t.value=s; document.body.appendChild(t); t.select(); document.execCommand('copy'); t.remove(); }
  const o=btn.textContent; btn.textContent='✓ 복사됨'; setTimeout(()=>btn.textContent=o,1200);
}
async function onDraftEdit(textarea){
  const card = textarea.closest('.draft');
  const draftId = card.dataset.draftId;
  const text = textarea.value;
  try{
    const d = await (await fetch('/api/wiki/draft/edit', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({draft_id: draftId, script_text: text}),
    })).json();
    if(d.ok) card.dataset.draftId = d.draft_id;
  }catch(e){}
}

async function refineDraft(btn, mode){
  const card = btn.closest('.draft');
  const draftId = card.dataset.draftId;
  const textarea = card.querySelector('.dtext');
  const instruction = card.querySelector('.refine-inst').value.trim();
  if(!instruction){ alert('지시문을 입력하세요.'); return; }
  let selectedText = '';
  if(mode === 'partial'){
    selectedText = textarea.value.substring(textarea.selectionStart, textarea.selectionEnd).trim();
    if(!selectedText){ alert('수정할 부분을 텍스트박스에서 드래그로 선택하세요.'); return; }
  }
  btn.disabled = true; const orig = btn.textContent; btn.textContent = '⏳ 생성 중…';
  try{
    const body = {draft_id: draftId, mode, instruction};
    if(mode === 'partial') body.selected_text = selectedText;
    const d = await (await fetch('/api/wiki/draft/refine', {
      method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify(body),
    })).json();
    if(!d.ok){ alert(d.error || '재생성 실패'); return; }
    textarea.value = d.script_text;
    card.dataset.draftId = d.draft_id;
    card.querySelector('.refine-inst').value = '';
  }catch(e){ alert('네트워크 오류'); }
  finally{ btn.disabled = false; btn.textContent = orig; }
}

async function toggleHistory(el){
  const card = el.closest('.draft');
  const list = card.querySelector('.hist-list');
  if(list.classList.contains('open')){ list.classList.remove('open'); return; }
  try{
    const d = await (await fetch('/api/wiki/draft/history?draft_id=' + encodeURIComponent(card.dataset.draftId))).json();
    list.innerHTML = (d.history || []).map((h, i) =>
      `<div class="hist-item" onclick="restoreVersion(this,'${h.draft_id}')">v${i+1}${h.edit_instruction ? ' · '+esc(h.edit_instruction) : ''} — ${esc((h.script_text||'').slice(0,40))}…</div>`
    ).join('') || '<div class="hist-item">이력 없음</div>';
  }catch(e){}
  list.classList.add('open');
}

function restoreVersion(el, draftId){
  const card = el.closest('.draft');
  fetch('/api/wiki/draft/history?draft_id=' + encodeURIComponent(card.dataset.draftId))
    .then(r => r.json())
    .then(d => {
      const found = (d.history || []).find(h => h.draft_id === draftId);
      if(found){ card.querySelector('.dtext').value = found.script_text; }
    });
}
load();
</script>
