<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>영상 믹싱 · 숏템메이커</title>
  <style>
    body{margin:0;font-family:system-ui,sans-serif;background:#0d0d10;color:#eee}
    .wrap{max-width:1100px;margin:0 auto;padding:24px}
    h2{margin:0 0 16px}
    .row{display:flex;gap:8px;margin:6px 0}
    input[type=text]{flex:1;background:#1a1a20;border:1px solid #333;color:#eee;padding:10px;border-radius:8px}
    button{background:#6d3bef;color:#fff;border:0;padding:10px 16px;border-radius:8px;cursor:pointer}
    button.ghost{background:#26262e}
    .beat{border:1px solid #333;border-radius:10px;padding:12px;margin:10px 0;display:flex;gap:12px;align-items:flex-start}
    .beat .role{font-size:12px;background:#6d3bef;padding:2px 8px;border-radius:10px}
    .beat.flag{border-color:#e0623d}
    .warn{color:#e0623d;font-size:12px}
    select{background:#1a1a20;color:#eee;border:1px solid #333;border-radius:6px;padding:6px}
    #status{margin:12px 0;color:#9a9aa5}
    video{max-width:100%;border-radius:10px}
  </style>
</head>
<body>
<div class="wrap">
  <h2>🎬 영상 믹싱</h2>
  <div id="inputPanel">
    <div id="basketWrap" style="margin-bottom:10px">
      <div style="font-size:13px;color:#9a9aa5;margin-bottom:6px">🧺 담은 영상 (레퍼런스 랭킹에서 📥담기)</div>
      <div id="basket"></div>
    </div>
    <details style="margin-bottom:8px">
      <summary style="cursor:pointer;color:#9a9aa5;font-size:13px">＋ URL 직접 추가</summary>
      <div id="urls" style="margin-top:8px">
        <div class="row"><input type="text" placeholder="레퍼런스 URL"/></div>
      </div>
      <div class="row">
        <button class="ghost" onclick="addUrl()">+ 소스 추가</button>
      </div>
    </details>
    <div class="row">
      목표 길이 <input id="target" type="range" min="10" max="90" value="30" oninput="tv.textContent=this.value"/>
      <span id="tv">30</span>초
      · 구조
      <select id="structure"><option value="template">템플릿(훅→페인→반전→실용→CTA)</option><option value="free">자유</option></select>
    </div>
    <div class="row" style="align-items:center">
      <label style="display:flex;align-items:center;gap:8px;cursor:pointer">
        <input type="checkbox" id="subtitleRemoval"/> 원본 자막 제거 (VMake)
      </label>
    </div>
    <div class="row" style="align-items:center;flex-wrap:wrap">
      <input type="password" id="vmakeKey" autocomplete="off" placeholder="vmake.ai 개인 API 키 (app_key:secret)" style="flex:1;min-width:220px"/>
      <button class="ghost" onclick="saveVmakeKey()">키 저장</button>
      <span id="vmakeKeyState" style="font-size:12px;color:#9a9aa5"></span>
    </div>
    <div class="row"><button onclick="startMix()">믹스 시작</button></div>
  </div>

  <div id="status"></div>
  <div id="review"></div>
  <div id="done"></div>
</div>

<script>
let JOB=null, POLL=null;
function escapeHtml(s){
  // 대본(narration)·video_id/seg_id 등은 외부 영상에서 추출된 텍스트라 <, &, >
  // 등이 그대로 들어있을 수 있다 — innerHTML/속성에 그대로 꽂으면 마크업으로
  // 해석돼 XSS로 이어짐(outreach.html의 escapeHtml과 동일 패턴, 2026-07-12).
  return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}
function addUrl(){
  if(document.querySelectorAll('#urls input').length>=5) return;
  const d=document.createElement('div'); d.className='row';
  d.innerHTML='<input type="text" placeholder="레퍼런스 URL"/>';
  document.getElementById('urls').appendChild(d);
}
let BASKET=[];   // [{shortcode,url,thumbnail,name}]
async function loadBasket(){
  try{
    const d=await (await fetch('/api/mix/basket')).json();
    BASKET=d.items||[];
  }catch(e){ BASKET=[]; }
  const el=document.getElementById('basket');
  if(!BASKET.length){ el.innerHTML='<div style="font-size:12px;color:#6a6a75">담은 영상이 없습니다. 레퍼런스 랭킹에서 📥담기를 누르면 여기에 순서대로 쌓입니다.</div>'; return; }
  el.innerHTML=BASKET.map((it,i)=>`
    <div class="row" style="align-items:center;gap:8px;background:#1a1a20;border-radius:8px;padding:6px 8px;margin-bottom:6px">
      <span style="color:#6a6a75;width:18px">${i+1}</span>
      ${it.thumbnail?`<img src="/api/thumb?url=${encodeURIComponent(it.thumbnail)}" style="width:40px;height:52px;object-fit:cover;border-radius:4px" onerror="this.style.visibility='hidden'">`:''}
      <span style="flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${escapeHtml(it.name||it.shortcode)}</span>
      <a href="${escapeHtml(it.url||'#')}" target="_blank" style="color:#6ab0ff;font-size:12px;text-decoration:none">↗</a>
      <button class="ghost" style="padding:2px 8px" onclick="removeFromBasket('${escapeHtml(it.shortcode)}')">🗑 삭제</button>
    </div>`).join('');
}
async function removeFromBasket(sc){
  try{ await fetch('/api/mix/basket/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shortcode:sc})}); }catch(e){}
  loadBasket();
}
async function startMix(){
  const manual=[...document.querySelectorAll('#urls input')].map(i=>i.value.trim()).filter(Boolean);
  const basketUrls=BASKET.map(it=>it.url).filter(Boolean);
  const seen=new Set(); const urls=[...basketUrls, ...manual].filter(u=>!seen.has(u)&&seen.add(u));
  if(urls.length<2){ alert('영상 2개 이상 필요 — 랭킹에서 담기하거나 URL 직접 추가'); return; }
  const body={urls, target_seconds:+document.getElementById('target').value, structure:document.getElementById('structure').value, subtitle_removal:document.getElementById('subtitleRemoval').checked};
  const r=await fetch('/api/mix/start',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const d=await r.json(); if(!d.ok){ alert(d.error); return; }
  JOB=d.job_id; document.getElementById('inputPanel').style.display='none';
  POLL=setInterval(poll,2500); poll();
}
const LABEL={downloading:'영상 다운로드 중…',extracting:'대본 추출 중…',planning:'편집안 생성 중…',tts:'음성 생성 중…',ready_for_review:'검토 준비 완료',rendering:'최종 렌더 중…',done:'완료',failed:'실패'};
async function poll(){
  const r=await fetch('/api/mix/status/'+JOB); const d=await r.json();
  if(!d.ok){
    document.getElementById('status').textContent='상태 조회 실패'+(d.error?(' — '+d.error):'');
    clearInterval(POLL);
    return;
  }
  document.getElementById('status').textContent='상태: '+(LABEL[d.status]||d.status)+(d.error?(' — '+d.error):'');
  if(d.status==='ready_for_review'){ clearInterval(POLL); loadReview(); }
  if(d.status==='done'){ clearInterval(POLL); loadDone(); }
  if(d.status==='failed'){ clearInterval(POLL); }
}
async function loadReview(){
  const r=await fetch('/api/mix/result/'+JOB); const d=await r.json();
  if(!d.ok){ console.warn('mix result 실패', d.error); document.getElementById('status').textContent='편집안 로드 실패'+(d.error?(' — '+d.error):''); return; }
  const el=document.getElementById('review');
  // 감지된 영상 유형(방식3: 자동감지+확인) — 틀리면 드롭다운으로 바꿔 재생성
  const typeOpts=(d.video_types||[]).map(t=>
    `<option value="${escapeHtml(t.key)}" ${t.key===d.detected_type?'selected':''}>${escapeHtml(t.label)}</option>`).join('');
  const typeBar=`<div class="row" style="align-items:center;gap:8px;margin-bottom:6px">
      <b>영상 유형</b>
      <select onchange="retype(this.value)">${typeOpts}</select>
      <span style="font-size:12px;color:#9a9aa5">자동 감지됨 — 틀리면 바꿔서 다시 생성</span>
    </div>`+
    (d.affiliate_target?`<div class="row" style="font-size:13px;color:#9a9aa5;margin-bottom:10px">🔗 쿠팡 연결 대상: <b style="color:#e6edf3">${escapeHtml(d.affiliate_target)}</b></div>`:'');
  el.innerHTML='<h3>편집안 검토</h3>'+typeBar+d.beats.map(b=>`
    <div class="beat ${b.plagiarism_flag?'flag':''}">
      <span class="role">${escapeHtml(b.role)}</span>
      <div style="flex:1">
        <div>${escapeHtml(b.narration)}</div>
        <div style="font-size:12px;color:#9a9aa5">${escapeHtml(b.primary.video_id)} · ${b.primary.start}s~${b.primary.end}s · ${b.target_seconds}s</div>
        ${b.plagiarism_flag?'<div class="warn">⚠️ 원문과 유사 — 재작성 권장</div>':''}
        ${b.alternates.length?`<div class="row">대체:
          <select onchange="adjust(${b.beat_idx}, this.value)">
            <option value="${escapeHtml(b.primary.video_id)}|${escapeHtml(b.primary.seg_id)}">현재: ${escapeHtml(b.primary.seg_id)}</option>
            ${b.alternates.map(a=>`<option value="${escapeHtml(a.video_id)}|${escapeHtml(a.seg_id)}">${escapeHtml(a.seg_id)} (${a.start}~${a.end}s)</option>`).join('')}
          </select></div>`:''}
        <audio controls src="${escapeHtml(b.tts_preview_url)}" style="height:28px"></audio>
      </div>
    </div>`).join('')+'<div class="row"><button onclick="render()">최종 렌더</button></div>';
}
async function adjust(beat_idx, val){
  const [video_id, seg_id]=val.split('|');
  const r=await fetch('/api/mix/adjust',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:JOB,beat_idx,video_id,seg_id})});
  const d=await r.json().catch(()=>({ok:false}));
  if(!r.ok || !d.ok){ console.warn('adjust 실패', d.error); alert('대체 적용 실패'+(d.error?(': '+d.error):'')); }
}
async function retype(video_type){
  // 유형 변경 → 저장된 대본으로 EDL+TTS 재생성(재다운로드 없음). 진행 폴링 후 새 편집안 로드.
  const r=await fetch('/api/mix/retype',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:JOB,video_type})});
  const d=await r.json().catch(()=>({ok:false}));
  if(!r.ok || !d.ok){ console.warn('retype 실패', d.error); alert('유형 변경 실패'+(d.error?(': '+d.error):'')); return; }
  document.getElementById('review').innerHTML='';
  POLL=setInterval(poll,2500); poll();
}
async function render(){
  const r=await fetch('/api/mix/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_id:JOB})});
  const d=await r.json().catch(()=>({ok:false}));
  if(!r.ok || !d.ok){ console.warn('render 시작 실패', d.error); alert('렌더 시작 실패'+(d.error?(': '+d.error):'')); return; }
  document.getElementById('review').innerHTML='';
  POLL=setInterval(poll,3000); poll();
}
function loadDone(){
  document.getElementById('done').innerHTML=`<h3>완성</h3><video controls src="/api/mix/video/${escapeHtml(JOB)}"></video>
    <div class="row"><a href="/api/mix/video/${escapeHtml(JOB)}" download><button>다운로드</button></a></div>`;
}
async function saveVmakeKey(){
  const key=document.getElementById('vmakeKey').value.trim();
  try{
    const r=await fetch('/api/settings/vmake_key',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({key})});
    const d=await r.json().catch(()=>({ok:r.ok}));
    const ok=(r.ok&&d.ok!==false);
    if(ok){ document.getElementById('vmakeKey').value=''; }   // 저장 후 화면에서 키 지움(노출방지)
    document.getElementById('vmakeKeyState').textContent=ok?'등록됨':'실패';
  }catch(e){ document.getElementById('vmakeKeyState').textContent='실패'; }
}
async function loadVmakeKeyState(){
  try{
    const j=await (await fetch('/api/settings/vmake_key')).json();
    document.getElementById('vmakeKeyState').textContent=j.configured?'등록됨':'미등록';
  }catch(e){}
}
loadVmakeKeyState();
loadBasket();
</script>
<script src="/sidebar.js?v=2"></script>
</body>
</html>
