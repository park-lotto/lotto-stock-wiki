<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600;700&family=IBM+Plex+Sans+KR:wght@400;600;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:760px;height:400px;overflow:hidden;
  background:#000;color:#fff;
  font-family:'IBM Plex Mono','IBM Plex Sans KR',monospace;
}
.card{width:760px;height:400px;padding:0;position:relative}

/* 상단 헤더 바 */
.top-bar{
  background:#FF6200;
  padding:10px 20px;
  display:flex;justify-content:space-between;align-items:center;
}
.brand{font-size:13px;font-weight:700;letter-spacing:2px;color:#000}
.stock-title{font-size:15px;font-weight:700;color:#000;letter-spacing:.5px}
.date-str{font-size:12px;color:#000;opacity:.8}

/* 본문 */
.body{padding:18px 24px 0}
.section-label{
  font-size:10px;letter-spacing:2px;color:#FF6200;
  font-weight:700;margin-bottom:14px;
}

/* TOP3 행 */
.row{
  display:flex;align-items:baseline;gap:0;
  padding:10px 0;
  border-bottom:1px solid #222;
}
.row:last-child{border-bottom:none}
.medal{font-size:11px;color:#888;width:22px;flex-shrink:0}
.broker{font-size:13px;color:#ccc;width:140px;flex-shrink:0}
.tp{font-size:28px;font-weight:700;color:#fff;flex:1}
.tp em{font-size:13px;font-weight:400;color:#888;font-style:normal;margin-left:2px}
.chg{font-size:14px;font-weight:600;width:70px;text-align:right;flex-shrink:0}
.up{color:#00d4aa} .dn{color:#ff4444}
.newhigh{font-size:9px;color:#FF6200;font-weight:700;letter-spacing:1px;width:80px;text-align:right;flex-shrink:0}

/* 하단 바 */
.bottom-bar{
  position:absolute;bottom:0;left:0;right:0;
  background:#111;border-top:2px solid #FF6200;
  padding:10px 24px;
  display:flex;align-items:center;gap:32px;
}
.con-item{display:flex;flex-direction:column;gap:2px}
.con-label{font-size:9px;color:#888;letter-spacing:1.5px;text-transform:uppercase}
.con-val{font-size:16px;font-weight:700;color:#FF6200}
.con-val.white{color:#fff}
.divider{width:1px;height:28px;background:#333}
.ticker{margin-left:auto;font-size:10px;color:#555;letter-spacing:1px}
</style>
</head>
<body>
<div class="card">
  <div class="top-bar">
    <span class="brand">BLOOMBERG INTELLIGENCE</span>
    <span class="stock-title">LG이노텍 — 증권사 목표주가 분석</span>
    <span class="date-str">2026-06-02</span>
  </div>
  <div class="body">
    <div class="section-label">▶ 목표주가 TOP 3 / 최근 45일 기준 14개 증권사</div>
    
        <div class="row">
          <span class="medal">①</span>
          <span class="broker">DB증권</span>
          <span class="tp">185<em>만원</em></span>
          <span class="chg up">+185%</span>
          <span class="newhigh">◆ NEW HIGH</span>
        </div>
        <div class="row">
          <span class="medal">②</span>
          <span class="broker">—</span>
          <span class="tp">174<em>만원</em></span>
          <span class="chg up">+19%</span>
          <span class="newhigh"></span>
        </div>
        <div class="row">
          <span class="medal">③</span>
          <span class="broker">KB증권</span>
          <span class="tp">160<em>만원</em></span>
          <span class="chg up">+33%</span>
          <span class="newhigh"></span>
        </div>
  </div>
  <div class="bottom-bar">
    <div class="con-item">
      <span class="con-label">컨센서스 평균</span>
      <span class="con-val">1,175,021원</span>
    </div>
    <div class="divider"></div>
    <div class="con-item">
      <span class="con-label">신고가</span>
      <span class="con-val white">1,850,000원</span>
    </div>
    <div class="divider"></div>
    <div class="con-item">
      <span class="con-label">분석 증권사</span>
      <span class="con-val white">14개사</span>
    </div>
    <span class="ticker">STOCK BRAIN · 2026년 06월 02일</span>
  </div>
</div>
</body></html>
