<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>1·2단계 페이지 틀</title>
<style>
:root{--bg:#0f1420;--card:#161d2c;--line:#263048;--text:#e8ecf5;--dim:#8b96ad;--pick:#2b6cff;--warn:#ffb443;--ok:#3ddc97;--star:#ffd24a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.5 "Malgun Gothic",system-ui,sans-serif}
.wrap{max-width:1500px;margin:0 auto;padding:14px 16px 90px}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.top h1{font-size:19px;margin:0 12px 0 0}.btn{border:1px solid #3a4b73;background:#1d2a45;color:#dfe9ff;border-radius:9px;padding:5px 12px;font-size:13px;cursor:pointer}
.btn.on{background:var(--pick);border-color:var(--pick);color:#fff;font-weight:700}.btn.main{background:var(--pick);border-color:var(--pick);color:#fff;font-weight:700;padding:8px 18px}

.step.on{background:#ff4fa3;color:#fff}.note{color:var(--dim);font-size:12.5px}
.box{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:10px 12px;margin-bottom:12px}.bh{font-weight:700;margin-bottom:8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bh small{font-weight:400;color:var(--dim)}
.strip{display:flex;gap:8px;overflow-x:auto}.vi{width:96px;flex:none}.vi .cap{font-size:11px;color:var(--dim)}
.th{position:relative;flex:none;border-radius:7px;overflow:hidden;background:#2a3550;cursor:pointer;border:2px solid transparent}
.th img{width:100%;display:block;aspect-ratio:9/16;object-fit:cover}.th .sec{position:absolute;right:3px;bottom:3px;background:#000a;color:#fff;font-size:10.5px;border-radius:5px;padding:0 4px}
.th .tg{position:absolute;left:3px;top:3px;display:flex;flex-direction:column;gap:2px}.th .tg span{background:#000b;color:#fff;font-size:10px;border-radius:5px;padding:0 4px}
.th.star{border-color:var(--star)}.th.star:after{content:"⭐";position:absolute;right:3px;top:2px;font-size:14px}
.grps{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:8px}.grp{background:#121a2b;border-radius:11px;padding:8px;border:2px solid transparent}
.grp.star{border-color:var(--star)}.gh{cursor:pointer}.gh b{font-size:14px}.gh span{color:var(--dim);font-size:12px}
.gth{display:flex;gap:4px;margin-top:6px;flex-wrap:wrap}.gth .th{width:66px}.more{font-size:12px;color:#9fc0ff;cursor:pointer;margin-top:4px;display:inline-block}
.missing{background:#2a2112;border:1px solid #5a4520;border-radius:10px;padding:8px 10px;color:#ffd99a}.missing ul{margin:4px 0 6px 18px;padding:0}
.starbar{position:sticky;top:0;z-index:5;background:#1b2440;border:1px solid #3a4b73;border-radius:11px;padding:7px 10px;margin-bottom:10px;font-size:13px}
.opts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.opt{background:#121a2b;border:2px solid #2c3d63;border-radius:12px;padding:9px 10px;cursor:pointer}.opt.on{border-color:var(--pick);background:#152447}
.opt .n{font-weight:700}.opt .s{color:var(--dim);font-size:12px;margin-top:2px}.bar{display:inline-block;width:90px;height:7px;background:#26314c;border-radius:5px;vertical-align:middle}.bar i{display:block;height:100%;background:var(--ok);border-radius:5px}
.badge{font-size:11px;border-radius:7px;padding:0 6px;margin-left:4px}.badge.auto{background:#4a2a5e;color:#f0c8ff}.badge.new{background:#33405f;color:#cfe0ff}
.sb{display:grid;grid-template-columns:1fr 330px;gap:12px}@media(max-width:1000px){.sb{grid-template-columns:1fr}}
.cells{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px}
.cell{background:#121a2b;border:1px solid #2c3d63;border-radius:11px;padding:8px}.cell.weak{border-color:var(--warn)}.cell.hasstar{box-shadow:0 0 0 2px #ffd24a55}
.ch{display:flex;justify-content:space-between;align-items:baseline;gap:6px}.ch span{color:var(--dim);font-size:11.5px;text-align:right}
.cth{display:flex;gap:4px;margin:6px 0}.cth .th{width:60px}
.line{font-size:13.5px;background:#0f1626;border:1px solid #2a3a5c;border-radius:8px;padding:5px 7px;min-height:40px;outline:none}.line:focus{border-color:var(--pick)}
.why{margin-top:5px;color:var(--warn);font-size:12px}.meta{color:var(--dim);font-size:11.5px;margin-top:4px}
.script{background:#121a2b;border:1px solid #2c3d63;border-radius:12px;padding:10px;position:sticky;top:10px}.script ol{margin:6px 0 10px 18px;padding:0}.script li{margin-bottom:5px}
.chips{display:flex;flex-wrap:wrap;gap:2px;margin-top:3px;max-width:80px}.gchips{display:flex;gap:6px;align-items:center;margin-top:4px}.gchips .chips{max-width:none}
.chip{font-size:10.5px;border-radius:7px;padding:0 5px;cursor:pointer;border:1px solid #3a4560;color:#7f8aa3;user-select:none}
.chip.ai{border-color:var(--c);color:var(--c);border-style:dashed}.chip.on{background:var(--c);border-color:var(--c);color:#fff;font-weight:700}
.pc{display:flex;flex-direction:column;align-items:flex-start;min-height:150px}
.pc .chip:not(.ai):not(.on){display:none}.pc:hover .chip{display:inline-block}.pc.picked .th{border-color:#fff}
.vcard{width:112px;flex:none;cursor:pointer;border-radius:10px;padding:3px}.vcard.open{background:#1d2a45}.vcap{font-size:12px;line-height:1.3;margin-top:3px}
.plat{font-size:10.5px;background:#2b3a5e;color:#bcd3ff;border-radius:6px;padding:0 5px}
.adetail{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:8px;margin-top:10px}
.acard{background:#0f1a14;border:1px solid #23402f;border-radius:12px;padding:10px}.ah{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.tag{background:#1f6b4d;color:#c9ffe6;border-radius:8px;padding:0 7px;font-size:12px;font-weight:700}.chip2{font-size:11.5px;background:#1d2a45;border-radius:7px;padding:0 6px;margin-right:3px}
.kv{font-size:12.5px;margin:3px 0}.kv b{color:#9fd4ff;margin-right:4px}
.sline{border-top:1px solid #23402f;padding:6px 0}.kind{font-size:11px;background:#33405f;border-radius:6px;padding:0 5px}.sth{display:flex;gap:4px;margin-top:4px}.sth .pc,.gth .pc{min-height:0}
.rbar{position:sticky;top:0;z-index:6;background:#121a2b;border:1px solid #3a4b73;border-radius:12px;padding:8px 10px;margin-bottom:12px}
.rboxes{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}@media(max-width:900px){.rboxes{grid-template-columns:repeat(2,1fr)}}
.rbox{border:2px dashed #3a4560;border-radius:10px;padding:5px 7px;cursor:pointer;min-height:58px}.rbox.on{border-style:solid;border-color:var(--c);background:#1b2440;box-shadow:0 0 0 2px var(--c)}
.rh{font-size:13px;font-weight:700}.rh b{background:var(--c);color:#111;border-radius:7px;padding:0 6px;margin-left:3px}.rs{font-size:10.5px;color:var(--dim)}
.rth{display:flex;gap:2px;margin-top:3px}.rth img{width:24px;height:42px;object-fit:cover;border-radius:3px}
.pc.armed{cursor:crosshair}.pc.armed:hover .th{border-color:#fff}.aisug{background:#000a!important;color:#cfd8ff!important;font-size:9.5px!important}
.hitb{font-size:11.5px;background:#5a4b12;color:#ffe28a;border-radius:7px;padding:0 6px}
.pickbar{position:sticky;top:0;z-index:6;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#121a2b;border:1px solid #3a4b73;border-radius:12px;padding:8px 12px;margin-bottom:10px}
.pickbar .btn[disabled]{opacity:.45;cursor:default}.fsec{font-weight:700;margin:10px 0 6px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.fcard{background:#0f1a16;border:2px solid #23402f;border-radius:12px;padding:9px;cursor:pointer;position:relative}.fcard.on{border-color:#3ddc97;background:#123024}
.fcard.auto{background:#1c1530;border-color:#4a2a5e}.fcard.auto.on{border-color:#c85cff;background:#2a1a45}
.fh{font-size:13.5px;line-height:1.35}.pf{font-size:10.5px;border-radius:6px;padding:0 6px;color:#fff;font-weight:700}.pf.yt{background:#e0284f}.pf.ig{background:#c13584}.pf.ai{background:#7b3fe4}
.ck{position:absolute;right:8px;top:6px;background:#3ddc97;color:#062;border-radius:50%;width:20px;height:20px;text-align:center;font-weight:900}
.fit{display:flex;gap:3px;flex-wrap:wrap;margin:5px 0}.fit span{font-size:10.5px;border:1px solid #33405f;border-radius:6px;padding:0 5px;color:#aab}
.rec{font-size:11.5px;color:#7ee2b0;margin-bottom:3px}.fq{font-size:13px;margin:3px 0;line-height:1.4}.slotw{border:1px dashed #3ddc97;border-radius:5px;padding:0 3px;color:#7ee2b0}
.fstruct{font-size:11.5px;background:#0b1410;border-radius:8px;padding:6px;margin-top:4px}.busy{color:#ffd24a;font-size:12px;margin-top:4px}.done{color:#3ddc97;font-size:12px;margin-top:4px}
.cc{position:relative;display:flex;flex-direction:column;align-items:center}.cc.off .th{filter:grayscale(1) brightness(.6)}.offt{position:absolute;top:40%;left:0;right:0;text-align:center;font-size:11px;color:#ffd24a;font-weight:700}
.ccb{display:flex;gap:2px;align-items:center;margin-top:2px}.pk{font-size:9.5px;background:#c85cff;color:#fff;border-radius:5px;padding:0 4px}.aik{font-size:9.5px;background:#33405f;color:#cfe0ff;border-radius:5px;padding:0 4px}
.mv{font-size:10px;cursor:pointer;color:#9fc0ff;padding:0 2px}.cth{flex-wrap:wrap}
.recb{display:inline-block;font-size:11.5px;font-weight:800;background:#ffd24a;color:#3a2a00;border-radius:7px;padding:1px 8px;margin-bottom:5px}.recb.ai{background:#c85cff;color:#fff}.fcard.isrec{border-color:#8a7a2a}
.empty{color:var(--dim);padding:30px;text-align:center;border:1px dashed #3a4b73;border-radius:12px}
.cand{margin:4px 0}.cand1{cursor:pointer}.cand1 .th{filter:grayscale(1) brightness(.75)}.cand1:hover .th{filter:none}.ck2{font-size:10px;color:#9fe3b0}
.ch b{white-space:nowrap;flex-shrink:0}.addb{display:inline-block;white-space:nowrap;font-size:11px;background:#2fbf82;color:#fff;border-radius:6px;padding:1px 6px;margin:2px 0 4px}.cell.added{border-color:#2fbf82}
.xpick{margin-top:10px;padding:10px;border:1px dashed #555;border-radius:10px}.xopts{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.xo{cursor:pointer;padding:5px 9px;border:1px solid #555;border-radius:14px;font-size:13px}.xo small{color:#999}.xo.on{background:#2fbf82;border-color:#2fbf82;color:#fff}.xo.on small{color:#eafff3}
.racts{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}.rb{font-size:11px;padding:3px 7px;border-radius:6px;border:1px solid #444;background:#1b2230;color:#cfd8e3;cursor:pointer}
.rb.on{background:#ff6fb1;color:#fff;border-color:#ff6fb1}.rmv button{font-size:11px;padding:2px 6px;margin-left:2px;border-radius:5px;border:1px solid #444;background:#1b2230;color:#cfd8e3;cursor:pointer}
.rmv button:disabled{opacity:.35}.line:empty:before{content:attr(data-ph);color:#6b7686}
.rows{display:flex;flex-direction:column;gap:6px}
.row{display:grid;grid-template-columns:170px minmax(260px,1fr) minmax(300px,1.25fr);gap:10px;align-items:start;background:#121a2b;border:1px solid #2c3d63;border-radius:11px;padding:8px 10px}
.row.weak{border-color:var(--warn)}.row.hasstar{box-shadow:0 0 0 2px #ffd24a55}.row.added{border-color:#2fbf82}
.rl{display:flex;gap:8px}.rn{font-size:18px;font-weight:800;color:#9fc0ff;min-width:20px}.rneed{font-size:11.5px;color:var(--dim);margin:2px 0}
.rsec{font-size:11px;color:var(--dim)}.rsec.bad{color:var(--warn)}.rs .cth{margin:0}
@media(max-width:1000px){.row{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<div class="top"><h1>🎬 숏템메이커 · 1·2단계 페이지 틀 (시안)</h1><span id="jobs"></span><span class="note" id="meta"></span></div>
<div class="steps"><div class="step" id="st1" onclick="go(1)">1 · 영상추출/분석 (재료)</div><div class="step" id="st2" onclick="go(2)">2 · 스토리보드 = 대본</div><div class="step" style="opacity:.5">3 · 장면 디테일 수정</div></div>
<div id="page"></div>
</div>
<script>
const JOBS = /*DATA*/[];
window.FAMS = /*FAMS*/[];
let J = 0, STEP = 1, OPT = 'auto', SHOWALL = {}, STARS = {}, STARG = {}, EDIT = {};
const KO = {hook:'훅',title:'제목',bait:'미끼',fame:'유명세',reveal:'정체 공개',limit:'한계',solve:'해결',more:'더',twist:'반전',land:'마무리',
  price:'가격',power:'성능',easy:'쉬움',extra:'덤',deal:'딜',howto:'사용법',vs:'비교',proof:'증거',react:'반응',what:'정체',good:'좋은 점',
  pain:'불편',how:'어떻게',story:'탄생 이야기',benefit:'효능',escalate:'고조',escalation:'고조',method:'방법',steps:'단계',texture:'식감',usage:'활용',
  witness:'증인',cta:'마무리',situation:'상황',notice:'눈치챔',ask:'물어봄',result:'결과',regret:'후회',origin:'본래 용도',cases:'엉뚱한 쓰임',
  mistake:'실수',authority:'권위',reason:'이유',problem:'문제',mechanism:'원리',ease:'쉬움',context:'맥락',spec:'스펙',bonus:'덤',source:'출처',fit:'맞는 사람',control:'조절'};
function ko(s){ s = String(s||''); const b = s.split('_')[0].toLowerCase(); return KO[s.toLowerCase()] || KO[b] || s; }
const TAGI = {"훅감":"🎣","비포":"😩","애프터":"✨","반전":"🔄","반응":"👥"};
function job(){ return JOBS[J]; }
function key(){ return job().jid; }
function stars(){ return STARS[key()] || (STARS[key()] = new Set(job().star)); }
function starg(){ return STARG[key()] || (STARG[key()] = new Set()); }
function th(id, w){ const p = job().pieces[id]; if (!p) return '';
  const tg = (job().tag_of[id] || []).map(t => `<span>${TAGI[t]||''}${t}</span>`).join('');
  return `<div class="th ${stars().has(id)?'star':''}" style="width:${w||66}px" title="${(p.desc||'').replace(/"/g,'&quot;')}" onclick="tstar('${id}')"><img src="data:image/jpeg;base64,${p.th}"><span class="tg">${tg}</span><span class="sec">${p.sec}초</span></div>`; }
function tstar(id){ const s = stars(); s.has(id) ? s.delete(id) : s.add(id); render(); }
function tgroup(i){ const g = starg(); g.has(i) ? g.delete(i) : g.add(i); render(); }
function go(n){ STEP = n; render(); }
function pick(j){ J = j; OPT = 'auto'; render(); }
// ── 1단계(2026-10-04 사장님): ① 담은 영상 = 출처·제목 카드, 펼치면 영상별 분석(장면 구성·스토리 줄)
//    ② 역할 상자(우리 스타일 칸에서 뽑은 10개) — 상자를 켜고 카드를 누르면 그 상자에 담김. 담긴 카드의 묶음은 대본에 반영 표시
const ROLES = [["훅","🎣","#c85cff","title·hook"],["미끼·궁금증","🪤","#a17bff","bait·notice·situation"],["문제·불편","😩","#ff8a3d","limit·pain·problem·mistake"],
  ["정체 공개","💡","#ffc23d","reveal·origin·what"],["사용법","🔧","#3a9bff","solve·method·steps·how"],["효과·소구점","✨","#2fbf82","escalation·more·benefit·power"],
  ["반전·의외","🔄","#ff4f7b","twist·cases"],["반응·증거","👥","#24c6d6","fame·proof·witness·react"],["결과","🏁","#7ed957","result·land"],["CTA·가격","💬","#ff6fb1","cta·price·deal"]];
const SUG = {"훅감":"훅","비포":"문제·불편","애프터":"결과","반전":"반전·의외","반응":"반응·증거"};
const PLAT = [["xiaohongshu","샤오홍슈"],["douyin","도우인"],["instagram","인스타"],["tiktok","틱톡"],["youtube","유튜브"],["pinterest","핀터레스트"],["naver","네이버"],["threads","쓰레드"]];
let ROLE = {}, ACTIVE = null, OPENV = {};
function plat(id){ const s = String(id||'').toLowerCase(); const m = PLAT.find(([k]) => s.includes(k)); return m ? m[1] : '직접 올림'; }
function asg(){ return ROLE[key()] = ROLE[key()] || {}; }          // 역할 → Set(조각)
function rolesOf(id){ return Object.entries(asg()).filter(([r, s]) => s.has(id)).map(([r]) => r); }
function setActive(r){ ACTIVE = (ACTIVE === r ? null : r); render(); }
function cardClick(id){ if (!ACTIVE){ return; } const s = asg()[ACTIVE] = asg()[ACTIVE] || new Set(); s.has(id) ? s.delete(id) : s.add(id); render(); }
function roleColor(r){ return (ROLES.find(x => x[0] === r) || [,,'#888'])[2]; }
function card1(id, w){ const p = job().pieces[id]; if (!p) return '';
  const mine = rolesOf(id); const sug = [...new Set((job().tag_of[id]||[]).map(t => SUG[t]).filter(Boolean))];
  return `<div class="pc ${mine.length?'picked':''} ${ACTIVE?'armed':''}" onclick="cardClick('${id}')" title="${(p.desc||'').replace(/"/g,'&quot;')}">
    <div class="th" style="width:${w||76}px;${mine.length?'border-color:'+roleColor(mine[0]):''}"><img src="data:image/jpeg;base64,${p.th}"><span class="sec">${p.sec}초</span>
      <span class="tg">${mine.map(r => `<span style="background:${roleColor(r)}">${(ROLES.find(x=>x[0]===r)||[])[1]} ${r}</span>`).join('')}${!mine.length && sug.length ? `<span class="aisug">AI: ${sug.join('·')}</span>` : ''}</span></div></div>`; }
function vidKey(id){ const m = String(id).match(/^(.*)-\d+$/); return m ? m[1] : id; }
function page1(){
  const x = job();
  const byVid = {}; Object.keys(x.pieces).forEach(id => { (byVid[x.pieces[id].vid] = byVid[x.pieces[id].vid] || []).push(id); });
  const gOf = {}; x.groups.forEach((g, i) => g.ids.forEach(id => gOf[id] = i));
  const strip = x.vids.map((v, i) => { const ids = byVid[v.vid] || []; const open = OPENV[key()+i];
    return `<div class="vcard ${open?'open':''}" onclick="OPENV['${key()}${i}']=!${!!open};render()"><div class="th" style="width:104px"><img src="data:image/jpeg;base64,${v.th}"></div>
      <div class="vcap"><span class="plat">${plat(ids[0])}</span> <b>${v.prod||'영상 '+(i+1)}</b></div><div class="note">${open?'▲ 접기':'▼ 분석 보기'}</div></div>`; }).join('');
  const opened = x.vids.map((v, i) => [v, i]).filter(([v, i]) => OPENV[key()+i]);
  const detail = opened.map(([v, i]) => { const ids = byVid[v.vid] || []; const b = v.brief || {};
    const comp = {}; ids.forEach(id => { const g = x.groups[gOf[id]]; if (g) comp[g.name] = (comp[g.name]||0) + 1; });
    const story = (v.story || []).map(L => `<div class="sline"><div><span class="kind">${L.kind||''}</span> <b>${L.text}</b> <span class="note">${L.point||''}</span></div>
      <div class="sth">${(L.cuts||[]).slice(0,4).map(c => card1(c, 52)).join('')}</div></div>`).join('') || '<div class="note">스토리 없음</div>';
    return `<div class="acard"><div class="ah"><span class="tag">영상 ${i+1}</span> <span class="plat">${plat(ids[0])}</span> <b>${v.prod||''}</b>
        <span class="chip2">🗣 말 있음 ${v.talk||0}자</span><span class="chip2">⏱ ${v.dur||'?'}초</span><span class="chip2">조각 ${ids.length}</span></div>
      <div class="kv"><b>핵심</b> ${b.core||''}</div><div class="kv"><b>흐름</b> ${b.flow||''}</div>

function rolesParam(){ return Object.entries(asg()).filter(([r, s]) => s.size).map(([r, s]) => r + '=' + [...s].join(',')).join('|'); }
async function makeBoards(){

  ks.forEach(k => delete BUSY[key()+k]); VIEW[key()] = VIEW[key()] && made()[VIEW[key()]] ? VIEW[key()] : ks.find(k => made()[k]); render();
}

    <div class="fit">${(f.fit||[]).slice(0,4).map(c => `<span>${c}</span>`).join('')}</div>

      <span style="margin-left:auto"></span><span id="msg2" class="note"></span>

      <button class="btn main" ${n&&!busy?'':'disabled'} onclick="makeBoards()">${busy?'⏳ 만드는 중…':'선택한 '+n+'개로 스토리보드 만들기'}</button></div>

// ── 라이브 대본 줄 기능 유지(2026-10-04 사장님 "대본 기능들과 대본 직접 쓰는 것들의 기능도 다 유지"): produce.html 2단계와 같은 버튼
//    [바꾸기](라이브 부품 은행 — 시안에선 자리만) · [📢 CTA](한 줄만) · [🗑 빼기] · [▲▼](칸 이동 — 장면도 같이) · [＋](아래 빈 칸) · [✍ 내가 직접 쓰기]
function bake(ek, bd){      // 손으로 고친 문장·장면 순서를 칸에 굳힌 뒤 구조를 바꾼다(칸 번호로 붙은 기억이 엇갈리지 않게)
  bd.slots.forEach((sl, i) => { sl.ids = ordOf(ek, i, sl).slice(); if (EDIT[ek] && EDIT[ek][i] != null) sl.line = EDIT[ek][i]; });
  [ORD, CAND].forEach(M => Object.keys(M).filter(o => o.startsWith(ek+'#')).forEach(o => delete M[o])); delete EDIT[ek];
}
function tabName(k){ const F = window.FAMS || []; const [base, ...ex] = String(k).split('+');
  const nm = base==='auto'?'AI 자동':base==='mine'?'✍ 내가 직접 쓴 대본':((F.find(f=>String(f.id)===base)||{names:[base]}).names[0]);
  return nm + (ex.length ? ' <span class="addb" style="margin:0">＋' + ex.join('+').split('·')[0].split('+').map(ko).join('·') + '</span>' : ''); }
function curBd(){ const k = VIEW[key()]; return [key()+k, made()[k]]; }
function rowMove(i, d){ const [ek, bd] = curBd(); const t = i + d; if (t < 0 || t >= bd.slots.length) return; bake(ek, bd);
  [bd.slots[i], bd.slots[t]] = [bd.slots[t], bd.slots[i]]; if (bd.check) [bd.check[i], bd.check[t]] = [bd.check[t], bd.check[i]]; render(); }
function rowDel(i){ const [ek, bd] = curBd(); bake(ek, bd); bd.slots.splice(i, 1); if (bd.check) bd.check.splice(i, 1); render(); }
function rowAdd(i){ const [ek, bd] = curBd(); bake(ek, bd); bd.slots.splice(i + 1, 0, {slot: 'free', need: '새 칸', line: '', ids: [], added: true});
  if (bd.check) bd.check.splice(i + 1, 0, {have: 0, need: 0}); render(); }
function rowCta(i){ const [ek, bd] = curBd(); const on = !bd.slots[i].cta_mark; bd.slots.forEach((s, k) => s.cta_mark = on && k === i); render(); }
function rowSwap(i){ alertBox('[바꾸기]는 라이브의 부품 은행(같은 칸의 다른 승인 문장)을 그대로 씁니다 — 시안에선 자리만 보여요'); }
function rowActs(i, n, sl){
  return `<div class="racts"><button class="rb" onclick="rowSwap(${i})">바꾸기</button><button class="rb ${sl.cta_mark?'on':''}" title="이 줄이 CTA — 다시 누르면 해제" onclick="rowCta(${i})">📢 CTA</button>
    <button class="rb" title="이 줄을 대본에서 뺍니다(장면 칸도 같이)" onclick="rowDel(${i})">🗑 빼기</button>
    <span class="rmv"><button ${i===0?'disabled':''} onclick="rowMove(${i},-1)">▲</button><button ${i===n-1?'disabled':''} onclick="rowMove(${i},1)">▼</button><button title="아래에 빈 칸" onclick="rowAdd(${i})">＋</button></span></div>`; }
function mineDraft(){      // ✍ 내가 직접 쓰기 — 지금 보고 있는 안의 칸 구성을 따라간다(없으면 기본 뼈대). AI를 부르지 않는다
  const v = made()[VIEW[key()]]; const roles = v && v.slots ? v.slots.map(s => s.slot) : ['hook', 'problem', 'method', 'proof', 'cta'];
  made()['mine'] = {names: ['내가 직접 쓴 대본'], mine: true, first_line_style: '내가 직접 쓴 대본 — 칸을 채우고, 칸마다 관련 후보에서 장면을 넣으세요',
                    slots: roles.map(r => ({slot: r, need: '', line: '', ids: []})), check: roles.map(() => ({have: 0, need: 0}))};
  VIEW[key()] = 'mine'; render(); }
let ORD = {};
function ordOf(ek, i, sl){ const k = ek + '#' + i; return ORD[k] = ORD[k] || [...(sl.ids||[])]; }
function mv(ek, i, j, d){ const k = ek + '#' + i; const a = ORD[k]; const t = j + d; if (!a || t < 0 || t >= a.length) return; [a[j], a[t]] = [a[t], a[j]]; render(); }
function cellCards(ek, i, sl, ck){
  const ids = ordOf(ek, i, sl); const picked = new Set(sl.picked || []); let acc = 0; const need = Number(ck.need || 0);
  return ids.map((id, j) => { const p = job().pieces[id]; const sec = p ? Number(p.sec) : 0; const show = acc * 1.2 < need - 0.05; acc += sec;
    return `<div class="cc ${show?'':'off'}">${th(id, 60)}<div class="ccb">${picked.has(id)?'<span class="pk">고른 장면</span>':'<span class="aik">AI</span>'}
      <span class="mv" onclick="mv('${ek}',${i},${j},-1)">◀</span><span class="mv" onclick="mv('${ek}',${i},${j},1)">▶</span><span class="mv" title="이 칸에서 빼기" onclick="rmCard('${ek}',${i},${j})">✕</span></div>${show?'':'<div class="offt">안 나옴</div>'}</div>`; }).join(''); }
function upd2(){ const ek = key()+VIEW[key()]; const bd = made()[VIEW[key()]]; if (!bd || !document.getElementById('scr')) return;
  document.getElementById('scr').innerHTML = bd.slots.map((sl,i)=>'<li>'+((EDIT[ek]&&EDIT[ek][i]!=null)?EDIT[ek][i]:sl.line)+'</li>').join(''); }
// ── 칸 후보(2026-10-04 사장님 "한 장짜리 칸에도 관련 카드를 후보로"): 그 칸 장면과 같은 묶음 + AI 쓰임이 맞는 조각 중 아직 어느 칸에도 안 쓰인 것 — 흑백으로 접어 두고, 누르면 그 칸 뒤에 들어간다
const SLOT_TAG = {hook:'훅감',title:'훅감',bait:'훅감',pain:'비포',problem:'비포',limit:'비포',mistake:'비포',regret:'비포',result:'애프터',land:'애프터',twist:'반전',cases:'반전',proof:'반응',react:'반응',witness:'반응',fame:'반응'};
let CAND = {};
function usedAll(ek, bd){ const s = new Set(); bd.slots.forEach((sl, i) => ordOf(ek, i, sl).forEach(id => s.add(id))); return s; }
function candOf(ek, i, sl, bd){
  const x = job(); const used = usedAll(ek, bd); const mine = new Set(ordOf(ek, i, sl)); const a = [];
  x.groups.filter(g => g.ids.some(id => mine.has(id))).forEach(g => g.ids.forEach(id => { if (!used.has(id) && !a.includes(id)) a.push(id); }));
  const tag = SLOT_TAG[String(sl.slot||'').split('_')[0].toLowerCase()];
  if (tag) Object.keys(x.pieces).forEach(id => { if (!used.has(id) && !a.includes(id) && (x.tag_of[id]||[]).includes(tag)) a.push(id); });
  return a.slice(0, 12);
}
function candBox(ek, i, sl, bd){ const cs = candOf(ek, i, sl, bd); if (!cs.length) return ''; const k = ek+'#'+i, open = CAND[k];
  return `<div class="cand"><span class="more" onclick="CAND['${k}']=!${!!open};render()">${open?'▲ 후보 접기':'＋ 관련 후보 '+cs.length+'개 보기'}</span>${open?`<div class="cth">${cs.map(id => `<div class="cc cand1" onclick="addCand('${ek}',${i},'${id}')" title="누르면 이 칸 뒤에 넣어요">${th(id, 52)}<div class="ccb"><span class="ck2">＋ 넣기</span></div></div>`).join('')}</div>`:''}</div>`; }
function addCand(ek, i, id){ const bd = made()[VIEW[key()]]; ordOf(ek, i, bd.slots[i]).push(id); render(); }
function rmCard(ek, i, j){ ORD[ek+'#'+i].splice(j, 1); render(); }
// ── 칸 넣어 다시 쓰기(2026-10-04 사장님 "고조 같은 칸을 고르면 장면과 대본을 추가해서 다시"): 고른 칸을 그 스타일 구조에 끼워 3.6이 장면을 찾고 대본을 처음부터 다시 쓴다
const EXTRA = [['escalation','📈 고조','효능을 한 단계 더 세게'],['twist','🔄 반전','예상 밖 쓰임·충격'],['proof','👥 반응·증거','사람 반응·감탄'],['pain','😩 불편','쓰기 전 답답함'],
  ['how','🔧 사용법','쓰는 과정'],['reveal','💡 정체 공개','제품 첫 등장'],['bait','🪤 미끼','궁금증 한 줄'],['result','🏁 결과','완성·효과 장면']];
let XTRA = {};
function xset(ek){ return XTRA[ek] = XTRA[ek] || new Set(); }
function txtra(ek, r){ const s = xset(ek); s.has(r) ? s.delete(r) : s.add(r); render(); }
function xpick(ek, bd){
  const have = new Set(bd.slots.map(s => String(s.slot||'').split('_')[0].toLowerCase())); const opts = EXTRA.filter(([r]) => !have.has(r));
  if (!opts.length) return ''; const n = xset(ek).size, busy = BUSY[ek];
  return `<div class="xpick"><b>＋ 대본을 더 탄탄하게 — 넣고 싶은 칸을 고르세요</b> <span class="note">지금 대본은 그대로 두고 고른 칸만 끼워요 — 우리 히트 스타일 접속어로 앞 칸에 이어 쓰고, 안 쓴 장면 중 그 문장을 보여 주는 장면을 골라요(약 20초)</span>
    <div class="xopts">${opts.map(([r, nm, d]) => `<span class="xo ${xset(ek).has(r)?'on':''}" onclick="txtra('${ek}','${r}')">${nm} <small>${d}</small></span>`).join('')}</div>
    <button class="btn main" ${n&&!busy?'':'disabled'} onclick="rewrite()">${busy?'⏳ 끼워 넣는 중…':(n?'고른 '+n+'칸 끼워 넣기':'칸을 고르면 끼워 넣어요')}</button></div>`; }
async function rewrite(){
  // 끼워 넣기(2026-10-04 사장님): 대본을 처음부터 다시 쓰지 않는다 — 지금 스토리보드(손으로 고친 문장·장면 순서 포함)를 넘기고 고른 칸만 끼운다
  const k = VIEW[key()], ek = key()+k, bd = made()[k]; if (!bd) return;
  const cur = Object.assign({}, bd, {slots: bd.slots.map((sl, i) => Object.assign({}, sl, {line: (EDIT[ek] && EDIT[ek][i] != null) ? EDIT[ek][i] : sl.line, ids: ordOf(ek, i, sl)}))});
  BUSY[ek] = BUSY[key()+k] = true; render(); const t0 = Date.now();
  try {
    const r = await fetch('/insert', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({jid: key(), board: cur, extra: [...xset(ek)]})});
    const d = await r.json();
    // 원래 탭은 그대로 두고 새 탭으로(2026-10-04 사장님 "추가로 만들어도 미리 만든 탭은 없어지지 않게")
    if (d.slots){ const base = String(k).split('+')[0]; let nk = base + '+' + (d.extra||[]).join('+'); let c = 2; while (made()[nk]) nk = base + '+' + (d.extra||[]).join('+') + '·' + (c++);
      made()[nk] = Object.assign(d, {secs: Math.round((Date.now()-t0)/1000), from: k}); XTRA[ek] = new Set(); VIEW[key()] = nk; }
    else { console.log('[sb] 끼워 넣기 실패', d); alertBox('끼워 넣기 실패 — 다시 눌러 주세요'); }
  } catch(e){ console.log('[sb] 요청 실패', e); alertBox('끼워 넣기 실패 — 시험 서버(127.0.0.1:8790)가 켜져 있어야 해요'); }
  delete BUSY[ek]; delete BUSY[key()+k]; render();
}

function render(){
  document.getElementById('jobs').innerHTML = JOBS.map((x, j) => `<button class="btn ${J===j?'on':''}" onclick="pick(${j})">${x.title}</button>`).join(' ');
  document.getElementById('meta').textContent = `버튼을 누르면 운영 서버에서 gemini-3.6-flash(버텍스)가 실제로 만듭니다 · 사람이 고친 문장 없음`;
  document.getElementById('st1').classList.toggle('on', STEP===1); document.getElementById('st2').classList.toggle('on', STEP===2);
  document.getElementById('page').innerHTML = STEP === 1 ? page1() : page2();
}
render();
</script></body></html>
