# /etc/apache2/sites-available/shopping-shorts.conf → a2ensite로 활성화
# 서버는 nginx가 아니라 Apache(mod_proxy)가 80/443을 담당한다(stockbrain.conf와 동일 패턴,
# 2026-07-09 배포 중 확인 — deploy/README.md의 예전 nginx 안내는 stale docs였음).
# certbot --apache -d shoppingshorts.duckdns.org 실행하면 443(SSL) 버전은 자동 생성됨.
<VirtualHost *:80>
    ServerName shoppingshorts.duckdns.org
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8849/
    ProxyPassReverse / http://127.0.0.1:8849/
    ProxyTimeout 900
RewriteEngine on
RewriteCond %{SERVER_NAME} =shoppingshorts.duckdns.org
RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
