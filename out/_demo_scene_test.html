<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
  width: 1920px; height: 1080px;
  background: #080c14;
  font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  overflow: hidden;
  position: relative;
}

/* ── 배경 그리드 ── */
.grid {
  position: absolute; inset: 0;
  background-image:
    linear-gradient(rgba(0,255,208,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,255,208,0.03) 1px, transparent 1px);
  background-size: 80px 80px;
  animation: gridFade 1s ease-out forwards;
}
@keyframes gridFade { from { opacity:0 } to { opacity:1 } }

/* ── 좌측 포인트 바 ── */
.side-bar {
  position: absolute; left: 80px; top: 160px;
  width: 4px; height: 0;
  background: linear-gradient(to bottom, #00FFD0, transparent);
  animation: barGrow 0.6s 0.3s ease-out forwards;
}
@keyframes barGrow { to { height: 320px; } }

/* ── 레이블 ── */
.label {
  position: absolute; left: 104px; top: 160px;
  font-size: 13px; font-weight: 700; letter-spacing: 4px;
  color: #00FFD0; opacity: 0;
  animation: fadeUp 0.5s 0.5s ease-out forwards;
}

/* ── 메인 타이틀 ── */
.title {
  position: absolute; left: 104px; top: 200px;
  font-size: 72px; font-weight: 900; color: #fff;
  line-height: 1.1; opacity: 0;
  animation: fadeUp 0.6s 0.7s ease-out forwards;
}
.title .mint { color: #00FFD0; }

/* ── 서브 텍스트 ── */
.sub-text {
  position: absolute; left: 104px; top: 370px;
  font-size: 26px; color: #8899aa; opacity: 0;
  animation: fadeUp 0.5s 1.0s ease-out forwards;
}

/* ── 수치 카드들 ── */
.cards {
  position: absolute; left: 104px; top: 460px;
  display: flex; gap: 24px;
}
.card {
  background: rgba(0,255,208,0.05);
  border: 1px solid rgba(0,255,208,0.15);
  border-radius: 12px;
  padding: 20px 28px;
  opacity: 0;
}
.card:nth-child(1) { animation: fadeUp 0.5s 1.2s ease-out forwards; }
.card:nth-child(2) { animation: fadeUp 0.5s 1.4s ease-out forwards; }
.card:nth-child(3) { animation: fadeUp 0.5s 1.6s ease-out forwards; }

.card-label { font-size: 11px; color: #556677; letter-spacing: 2px; margin-bottom: 8px; }
.card-value { font-size: 36px; font-weight: 900; color: #00FFD0; font-family: 'Consolas', monospace; }
.card-value.red { color: #FF4757; }
.card-value.amber { color: #FFA502; }
.card-change { font-size: 13px; color: #445566; margin-top: 4px; }

/* ── 우측 차트 영역 ── */
.chart-area {
  position: absolute; right: 100px; top: 140px;
  width: 780px; height: 640px;
  border: 1px solid rgba(0,255,208,0.1);
  border-radius: 16px;
  background: rgba(0,255,208,0.02);
  opacity: 0;
  animation: fadeIn 0.8s 0.8s ease-out forwards;
  overflow: hidden;
}

.chart-title {
  position: absolute; top: 24px; left: 28px;
  font-size: 12px; letter-spacing: 3px; color: #334455;
}

/* SVG 차트 */
svg.chart {
  position: absolute; bottom: 40px; left: 20px;
  width: calc(100% - 40px); height: 520px;
}

/* 차트 라인 애니메이션 */
.chart-line {
  stroke-dasharray: 1200;
  stroke-dashoffset: 1200;
  animation: drawLine 1.5s 1.2s ease-out forwards;
}
@keyframes drawLine { to { stroke-dashoffset: 0; } }

.chart-area-fill {
  opacity: 0;
  animation: fillFade 0.8s 2.5s ease-out forwards;
}
@keyframes fillFade { to { opacity: 1; } }

/* 차트 글로우 점 */
.glow-dot {
  opacity: 0;
  animation: dotPop 0.4s 2.7s ease-out forwards;
}
@keyframes dotPop {
  0% { opacity:0; r:0; }
  60% { opacity:1; r:10; }
  100% { opacity:1; r:6; }
}

/* ── 탑픽 뱃지 ── */
.topick-badge {
  position: absolute; right: 120px; top: 100px;
  background: linear-gradient(135deg, #00FFD0, #00bfa5);
  color: #080c14; font-size: 11px; font-weight: 900;
  letter-spacing: 3px; padding: 6px 18px; border-radius: 20px;
  opacity: 0;
  animation: badgePop 0.4s 0.4s ease-out forwards;
  box-shadow: 0 0 20px rgba(0,255,208,0.5);
}
@keyframes badgePop {
  0% { opacity:0; transform: scale(0.8); }
  100% { opacity:1; transform: scale(1); }
}

/* ── 수급 빈집 게이지 ── */
.gauge-wrap {
  position: absolute; left: 104px; top: 660px;
  width: 620px; opacity: 0;
  animation: fadeUp 0.5s 1.8s ease-out forwards;
}
.gauge-label { font-size: 11px; color: #445566; letter-spacing: 2px; margin-bottom: 10px; }
.gauge-track {
  height: 8px; background: rgba(255,255,255,0.05); border-radius: 4px; overflow: hidden;
}
.gauge-fill {
  height: 100%; width: 0; border-radius: 4px;
  background: linear-gradient(90deg, #00FFD0, rgba(0,255,208,0.4));
  box-shadow: 0 0 12px rgba(0,255,208,0.6);
  animation: gaugeFill 1s 2.2s ease-out forwards;
}
@keyframes gaugeFill { to { width: 12%; } } /* 하위 12% = 완전빈집 */
.gauge-mark {
  display: flex; justify-content: space-between;
  font-size: 10px; color: #334455; margin-top: 6px;
}
.gauge-tag {
  font-size: 13px; font-weight: 700; color: #00FFD0;
  margin-top: 8px;
}

/* ── 자막 바 ── */
.subtitle-bar {
  position: absolute; bottom: 0; left: 0; right: 0; height: 160px;
  background: linear-gradient(to top, rgba(8,12,20,0.95) 0%, transparent 100%);
  display: flex; align-items: center; justify-content: center;
}
.subtitle {
  font-size: 40px; font-weight: 700; color: #fff;
  text-shadow: 0 2px 12px rgba(0,0,0,0.9);
  opacity: 0;
  animation: fadeIn 0.5s 2.0s ease-out forwards;
}

@keyframes fadeUp {
  from { opacity:0; transform: translateY(20px); }
  to   { opacity:1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity:0; }
  to   { opacity:1; }
}
</style>
</head>
<body>

<div class="grid"></div>
<div class="side-bar"></div>

<div class="topick-badge">🔴 TODAY'S TOPICK</div>

<div class="label">STOCK BRAIN SIGNAL</div>
<div class="title">SK하이닉스<br><span class="mint">수급 빈집</span> 포착</div>
<div class="sub-text">외인·기관이 빠진 자리 — 지금이 재진입 타이밍</div>

<div class="cards">
  <div class="card">
    <div class="card-label">수급 빈집 등급</div>
    <div class="card-value">A</div>
    <div class="card-change">하위 12% (완전빈집)</div>
  </div>
  <div class="card">
    <div class="card-label">탑픽 점수</div>
    <div class="card-value amber">8 / 9</div>
    <div class="card-change">오늘의 탑픽</div>
  </div>
  <div class="card">
    <div class="card-label">목표가 (컨센서스)</div>
    <div class="card-value">₩320,000</div>
    <div class="card-change">현재 +41% 괴리</div>
  </div>
</div>

<div class="gauge-wrap">
  <div class="gauge-label">수급 포지셔닝 (외인+기관 누적 / 1년 범위)</div>
  <div class="gauge-track">
    <div class="gauge-fill"></div>
  </div>
  <div class="gauge-mark">
    <span>완전빈집 ← 하위 10%</span>
    <span>25%</span>
    <span>중립 50%</span>
    <span>75%</span>
    <span>상위 10% → 과매수</span>
  </div>
  <div class="gauge-tag">▶ 현재 하위 12% — A등급 완전빈집</div>
</div>

<!-- 우측 차트 -->
<div class="chart-area">
  <div class="chart-title">HKX 000660 · 60일 수급 흐름</div>
  <svg class="chart" viewBox="0 0 740 500" preserveAspectRatio="none">
    <defs>
      <linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#00FFD0" stop-opacity="0.15"/>
        <stop offset="100%" stop-color="#00FFD0" stop-opacity="0"/>
      </linearGradient>
    </defs>

    <!-- 그리드 수평선 -->
    <line x1="0" y1="100" x2="740" y2="100" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="0" y1="200" x2="740" y2="200" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="0" y1="300" x2="740" y2="300" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>
    <line x1="0" y1="400" x2="740" y2="400" stroke="rgba(255,255,255,0.04)" stroke-width="1"/>

    <!-- 면적 채우기 -->
    <path class="chart-area-fill"
      d="M0,380 C50,360 80,340 120,300 C160,260 180,220 220,200 C260,180 280,220 320,240 C360,260 380,300 420,320 C460,340 480,360 520,380 C560,400 600,420 640,400 C680,380 710,350 740,320 L740,500 L0,500 Z"
      fill="url(#areaGrad)"/>

    <!-- 메인 라인 -->
    <path class="chart-line"
      d="M0,380 C50,360 80,340 120,300 C160,260 180,220 220,200 C260,180 280,220 320,240 C360,260 380,300 420,320 C460,340 480,360 520,380 C560,400 600,420 640,400 C680,380 710,350 740,320"
      fill="none" stroke="#00FFD0" stroke-width="2.5" stroke-linecap="round"/>

    <!-- 현재 포인트 글로우 -->
    <circle class="glow-dot" cx="740" cy="320" r="6" fill="#00FFD0"
      style="filter: drop-shadow(0 0 8px #00FFD0);"/>

    <!-- 빈집 구간 하이라이트 -->
    <rect x="580" y="0" width="160" height="500"
      fill="rgba(0,255,208,0.04)"
      style="opacity:0; animation: fillFade 0.5s 2.8s ease-out forwards;"/>
    <text x="620" y="60" fill="rgba(0,255,208,0.4)" font-size="10" letter-spacing="1">빈집 구간</text>
  </svg>
</div>

<!-- 자막 바 -->
<div class="subtitle-bar">
  <div class="subtitle">빈집에 들어가야 터진다 — 지금이 그 자리입니다</div>
</div>

</body>
</html>
