<!doctype html><html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>섹터 히트맵 — STOCK BRAIN</title>
<script>(function(){try{var t=localStorage.getItem('sb-theme');if(t==='dark'||t==='light')document.documentElement.setAttribute('data-theme',t);}catch(e){}})();</script>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
/* ── DARK (기본, 히트맵 다크골드) ── */
:root{--bg:#0b0b0e;--panel:#131318;--line:#222228;--gold:#d4af37;--up1:#c0392b;--up2:#e74c3c;--up3:#f19090;--dn1:#1a5276;--dn2:#2471a3;--dn3:#7fb3d3;--neu:#2a2a35;
  --m-elev:#1a1a1a;--m-elev2:#262626;--m-bd1:#222;--m-bd2:#333;--m-bd3:#444;
  --m-tx5:#555;--m-tx4:#666;--m-tx3:#888;--m-tx2:#999;--m-tx1:#ccc;--m-tx0:#eee;--m-fg:#fff;}
/* ── LIGHT ── */
:root[data-theme="light"]{--bg:#f6f8fa;--panel:#ffffff;--line:#d0d7de;--gold:#9a7d28;--neu:#e8e8ec;
  --m-elev:#ffffff;--m-elev2:#f0f2f5;--m-bd1:#e1e4e8;--m-bd2:#d8dee4;--m-bd3:#d0d7de;
  --m-tx5:#a0a7b0;--m-tx4:#8b949e;--m-tx3:#6e7781;--m-tx2:#656d76;--m-tx1:#3d434b;--m-tx0:#1f2328;--m-fg:#1f2328;}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){--bg:#f6f8fa;--panel:#ffffff;--line:#d0d7de;--gold:#9a7d28;--neu:#e8e8ec;
    --m-elev:#ffffff;--m-elev2:#f0f2f5;--m-bd1:#e1e4e8;--m-bd2:#d8dee4;--m-bd3:#d0d7de;
    --m-tx5:#a0a7b0;--m-tx4:#8b949e;--m-tx3:#6e7781;--m-tx2:#656d76;--m-tx1:#3d434b;--m-tx0:#1f2328;--m-fg:#1f2328;}
}
.theme-toggle{width:32px;height:32px;flex-shrink:0;background:var(--panel);border:1px solid var(--line);border-radius:50%;font-size:14px;line-height:1;cursor:pointer;color:var(--m-tx0);display:inline-flex;align-items:center;justify-content:center;transition:border-color .15s;}
.theme-toggle:hover{border-color:var(--gold);}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Noto Sans KR',sans-serif;}
body{background:var(--bg);color:var(--m-tx0);min-height:100vh;}

/* ── 상단 바 ── */
.topbar{height:52px;background:var(--panel);border-bottom:1px solid var(--line);
        display:flex;align-items:center;padding:0 24px;gap:16px;}
.topbar .logo{font-size:16px;font-weight:700;color:var(--gold);letter-spacing:1px;}
.topbar .time{margin-left:auto;font-size:13px;color:var(--m-tx3);}
.topbar .badge{font-size:12px;padding:3px 10px;border-radius:20px;background:#1e3a1e;color:#4ade80;}
.nav{display:flex;gap:2px;margin-left:20px;}
.nav a{padding:6px 14px;border-radius:6px;font-size:13px;color:var(--m-tx3);text-decoration:none;transition:background .15s;}
.nav a:hover,.nav a.active{background:var(--line);color:var(--m-tx0);}

/* ── ETF 상단 바 ── */
.etf-bar{background:var(--panel);border-bottom:1px solid var(--line);
         overflow-x:auto;white-space:nowrap;padding:0 16px;scrollbar-width:none;}
.etf-bar::-webkit-scrollbar{display:none;}
.etf-title{display:inline-flex;align-items:center;justify-content:center;
  position:sticky;left:0;z-index:3;vertical-align:top;min-width:54px;align-self:stretch;
  padding:8px 14px;margin-right:2px;border-right:1px solid var(--line);
  background:linear-gradient(90deg,var(--panel) 70%,rgba(19,19,24,0));
  font-size:13px;font-weight:900;color:var(--gold);letter-spacing:1.5px;}
.etf-chip{display:inline-flex;flex-direction:column;gap:2px;padding:8px 14px;
          border-right:1px solid var(--line);min-width:120px;cursor:pointer;
          vertical-align:top;transition:background .15s;}
.etf-chip:hover{background:rgba(255,255,255,.04);}
.etf-chip.active{background:rgba(212,175,55,.12);box-shadow:inset 0 -2px 0 var(--gold,#d4af37);}
/* ETF 편입종목 펼침 팝오버 */
#etf-pop{position:fixed;z-index:200;background:#16161c;border:1px solid var(--m-bd2);border-radius:10px;
  box-shadow:0 12px 34px rgba(0,0,0,.65);padding:6px 0;min-width:560px;max-height:62vh;
  overflow-y:auto;display:none;}
#etf-pop.open{display:block;}
#etf-pop .ep-hd{font-size:13px;font-weight:700;color:var(--m-tx0);padding:4px 14px 8px;
  border-bottom:1px solid var(--m-elev2);margin-bottom:2px;}
#etf-pop .ep-hd small{color:var(--m-tx3);font-weight:400;}
#etf-pop .ep-summary{margin:2px 10px 8px;padding:11px 14px;border-radius:8px;
  background:linear-gradient(135deg,rgba(212,175,55,.08),rgba(212,175,55,.03));
  border:1px solid rgba(212,175,55,.25);font-size:14.5px;color:#e8e2d0;line-height:1.65;}
#etf-pop .ep-summary b{color:#f5d97a;font-weight:700;}
#etf-pop .ep-summary ul{margin:2px 0 2px;padding-left:16px;}
#etf-pop .ep-summary li{margin:1px 0;color:var(--m-tx0);}
#etf-pop .ep-summary .ep-sum-line{margin:3px 0;}
#etf-pop .ep-summary .ep-sum-src{margin-top:6px;font-size:9.5px;color:#8a7f5e;text-align:right;}
#etf-pop .ep-sum-load{color:#b8a24d;font-style:italic;}
#etf-pop .ep-row{display:flex;align-items:center;gap:8px;padding:6px 14px;font-size:12.5px;}
#etf-pop .ep-row:hover{background:var(--m-bd1);}
#etf-pop .ep-nm{flex:1;color:var(--m-tx0);cursor:pointer;white-space:nowrap;}
#etf-pop .ep-nm:hover{color:var(--gold,#d4af37);}
#etf-pop .ep-w{color:var(--m-tx3);font-size:10.5px;width:46px;text-align:right;flex-shrink:0;}
#etf-pop .ep-vac{width:104px;text-align:right;font-weight:700;font-variant-numeric:tabular-nums;flex-shrink:0;}
#etf-pop .ep-empty{padding:10px 14px;color:var(--m-tx3);font-size:12px;}
.etf-chip .etf-name{font-size:11px;color:var(--m-tx2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:140px;}
.etf-chip .etf-rate{font-size:14px;font-weight:700;}
.etf-chip .etf-rate.up{color:#e74c3c;} .etf-chip .etf-rate.dn{color:#3498db;} .etf-chip .etf-rate.neu{color:var(--m-tx3);}
.etf-chip svg{display:block;}
.blink-dot{animation:blink 1.2s ease-in-out infinite;filter:drop-shadow(0 0 2px currentColor);}
@keyframes blink{0%,100%{opacity:1;}50%{opacity:.2;}}
/* 종가(최신 종가) 깜빡임 점 — 차트 끝점 HTML 오버레이 */
.px-blink{position:absolute;border-radius:50%;pointer-events:none;
  margin:-3.5px 0 0 -3.5px;width:7px;height:7px;
  animation:pxblink 1.2s ease-in-out infinite;}
@keyframes pxblink{0%,100%{opacity:1;transform:scale(1);}50%{opacity:.25;transform:scale(.55);}}

/* ── 탭 바 ── */
.tab-bar{display:flex;background:var(--bg);border-bottom:2px solid var(--line);
         overflow-x:auto;scrollbar-width:none;padding:0 8px;}
.tab-bar::-webkit-scrollbar{display:none;}
.tab{background:transparent;border:none;padding:11px 18px;font-size:13px;font-weight:700;
     color:var(--m-tx5);cursor:pointer;white-space:nowrap;font-family:inherit;
     border-bottom:2px solid transparent;margin-bottom:-2px;
     transition:color .15s,border-color .15s;}
.tab:hover{color:var(--m-tx2);}
.tab.active{color:var(--gold);border-bottom-color:var(--gold);}

/* ── 메인 ── */
.main{padding:20px 24px;}
.subbar{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.subbar h1{font-size:17px;font-weight:700;color:#fff;}
.subbar .snap-date{font-size:12px;color:var(--m-tx2);}
.tab-desc{font-size:12px;color:var(--m-tx2);margin-left:4px;}
.subbar .right{display:flex;align-items:center;gap:6px;margin-left:auto;}
.subbar .refresh-btn{padding:6px 14px;border:1px solid var(--gold);
  border-radius:8px;background:transparent;color:var(--gold);font-size:13px;cursor:pointer;transition:background .15s;}
.subbar .refresh-btn:hover{background:rgba(212,175,55,.12);}
.subbar .refresh-btn:disabled{opacity:.4;cursor:wait;}
.interval-btn{padding:5px 10px;border:1px solid var(--m-bd2);border-radius:6px;
  background:transparent;color:var(--m-tx4);font-size:12px;cursor:pointer;
  transition:background .15s,color .15s,border-color .15s;white-space:nowrap;}
.interval-btn:hover{border-color:var(--m-tx5);color:var(--m-tx2);}
.interval-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.08);}

/* ── 4카드 패널 (코스피/코스닥/미국선물/야간선물) ── */
.mkt-card{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:10px;
  padding:12px 14px;min-width:0;display:flex;flex-direction:column;gap:7px;position:relative;
  scrollbar-width:thin;scrollbar-color:var(--m-bd1) transparent;}
.mkt-card::-webkit-scrollbar{width:3px;}
.mkt-card::-webkit-scrollbar-thumb{background:var(--m-bd2);border-radius:2px;}
.mkt-hdr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
.mkt-name{font-size:14px;font-weight:700;color:var(--m-tx1);white-space:nowrap;}
.mkt-price{font-size:26px;font-weight:800;color:#fff;letter-spacing:-.5px;font-variant-numeric:tabular-nums;}
.mkt-rate{font-size:16px;font-weight:700;}
.mkt-rate.up{color:var(--up1);}
.mkt-rate.dn{color:var(--dn1);}
.mkt-rate.neu{color:var(--m-tx2);}
.mkt-sec-label{font-size:11px;color:var(--m-tx1);letter-spacing:.5px;margin-bottom:2px;
  display:flex;justify-content:space-between;align-items:center;}
/* 투자자 발산 바 */
.inv-grid{display:grid;grid-template-columns:30px 1fr 64px 14px;gap:3px 6px;align-items:center;}
.inv-grid.sub-grid{grid-template-columns:44px 1fr 60px;}
.inv-lbl{font-size:12px;color:var(--m-tx1);}
.inv-lbl.sub{font-size:11px;color:var(--m-tx2);}
.div-bar{display:flex;height:9px;border-radius:4px;overflow:hidden;background:var(--m-elev);}
.div-neg{flex:1;display:flex;align-items:stretch;justify-content:flex-end;}
.div-neg-fill{border-radius:3px 0 0 3px;transition:width .5s;}
.div-pos{flex:1;display:flex;align-items:stretch;}
.div-pos-fill{border-radius:0 3px 3px 0;transition:width .5s;}
.inv-num{font-size:12px;font-variant-numeric:tabular-nums;text-align:right;}
.inv-num.up{color:var(--up1);}
.inv-num.dn{color:var(--dn1);}
.inv-num.sub{font-size:11px;}
.inv-trend{font-size:10px;text-align:center;color:var(--m-tx3);}
.inv-trend.up{color:var(--up1);}
.inv-trend.dn{color:var(--dn1);}
/* 프로그램 */
.prog-row{display:flex;align-items:center;gap:8px;}
.prog-total{font-size:19px;font-weight:800;font-variant-numeric:tabular-nums;}
.prog-total.up{color:var(--up1);}
.prog-total.dn{color:var(--dn1);}
.prog-detail{font-size:11px;color:var(--m-tx1);line-height:1.5;}
/* 글로벌 지표 카드 */
.global-row{display:grid;grid-template-columns:100px 1fr auto;gap:5px 8px;align-items:center;margin-bottom:3px;}
.global-name{font-size:12px;color:var(--m-tx2);white-space:nowrap;}
.global-price{font-size:16px;font-weight:700;color:#fff;font-variant-numeric:tabular-nums;text-align:right;}
.global-rate{font-size:14px;font-weight:700;text-align:right;white-space:nowrap;}
.global-rate.up{color:var(--up1);} .global-rate.dn{color:var(--dn1);} .global-rate.neu{color:var(--m-tx2);}
/* 미국시장 카드 / 순위 카드 공용 */
.us-row{display:flex;justify-content:space-between;align-items:center;height:37px;padding:0 2px;border-bottom:1px solid var(--m-elev);box-sizing:border-box;}
.us-row:last-child{border-bottom:none;}
.us-row[onclick]:hover{background:rgba(255,255,255,.05);}
.us-row[onclick]:hover .us-sym{text-decoration:underline;text-underline-offset:2px;}
.us-label{font-size:12px;color:var(--m-tx2);display:block;}
.us-sym{font-size:14px;font-weight:700;color:var(--m-tx0);}
.us-vals{text-align:right;}
.us-price{font-size:16px;font-weight:700;color:#fff;display:block;font-variant-numeric:tabular-nums;}
.us-rate{font-size:13px;font-weight:700;}
.us-rate.up{color:var(--up1);} .us-rate.dn{color:var(--dn1);} .us-rate.neu{color:var(--m-tx2);}

.legend{display:flex;gap:8px;margin-bottom:16px;align-items:center;font-size:12px;color:var(--m-tx2);}
.legend .bar{height:12px;width:80px;border-radius:4px;
  background:linear-gradient(to right,var(--dn1),var(--neu),var(--up1));}

/* ── 즐겨찾기 버튼 (헤더 우측 인라인) ── */
.fav-btn{background:none;border:none;cursor:pointer;flex-shrink:0;
  font-size:16px;color:rgba(255,255,255,.35);line-height:1;padding:0;transition:color .15s;}
.fav-btn:hover,.fav-btn.on{color:#f5c518;}
.tile{position:relative;}
/* 카드 헤더 더보기 버튼 */
.tile .top-more{position:absolute;top:5px;right:26px;background:none;border:none;cursor:pointer;
  font-size:10px;color:rgba(255,255,255,.35);padding:2px 4px;line-height:1;transition:color .15s;z-index:2;white-space:nowrap;}
.tile .top-more:hover{color:rgba(255,255,255,.8);}

.mkt-insight{padding:14px 16px;margin-bottom:8px;border-radius:6px;
  background:linear-gradient(135deg,#2a2410,var(--m-elev));border:1px solid #d4af37;}
.mkt-insight .mi-headline{font-size:19px;font-weight:800;color:#f5d576;line-height:1.4;margin-bottom:8px;}
.mkt-insight .mi-body{font-size:14px;font-weight:400;color:var(--m-tx0);line-height:1.75;}
.mkt-insight .mi-body .mi-para{margin-bottom:9px;}
.mkt-insight .mi-body .mi-para:last-child{margin-bottom:0;}
.mkt-insight .mi-body .ep-sum-line{margin-bottom:9px;}
.mkt-insight .mi-body .ep-sum-line:last-child{margin-bottom:0;}
/* 오늘의 리포트 탑픽 — mkt-below-panel의 독립 카드 */
.mt-title{font-size:15px;font-weight:700;color:#8ab4ff;margin-bottom:8px;}
.mt-item{padding:7px 9px;border-radius:6px;margin-bottom:6px;background:var(--m-elev);
  transition:background .15s;}
.mt-item:hover{background:var(--m-bd1);}
.mt-item:last-child{margin-bottom:0;}
.mt-src{font-size:12px;font-weight:700;color:#9dc0ff;}
.mt-summary-line{font-size:12.5px;color:var(--m-tx1);line-height:1.4;margin-top:3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.mt-detail{margin-top:6px;}
.mt-detail-full{font-size:12.5px;color:var(--m-tx0);line-height:1.6;font-weight:400;}
.mt-link{display:inline-block;margin-top:5px;font-size:11px;color:#8ab4ff;text-decoration:none;}
.mt-link:hover{text-decoration:underline;}
.timeline-strip{display:flex;gap:8px;}
.timeline-strip.tl-strip-fill{overflow-x:hidden;}
.timeline-strip.tl-strip-fill .tl-card{flex:0 0 calc((100% - 56px)/8);min-width:0;}
.timeline-strip.tl-strip-wrap{flex-wrap:wrap;}
.timeline-strip.tl-strip-wrap .tl-card{flex:0 0 190px;}
.tl-card{position:relative;min-height:98px;background:var(--m-elev);border-radius:8px;
  padding:11px 13px;border-left:3px solid var(--m-tx5);cursor:default;transition:background .15s;}
.tl-card[onclick]{cursor:pointer;}
.tl-card[onclick]:hover{background:var(--m-bd1);}
.tl-card.sev-red{border-left-color:#e05252;}
.tl-card.sev-yellow{border-left-color:#d4af37;}
.tl-card.sev-gray{border-left-color:var(--m-tx5);}
.tl-card.sev-event{border-left-color:#6a9fd4;}
.tl-card.tl-selected{background:#242424;outline:1px solid var(--m-bd3);}
@keyframes tl-card-glow{
  0%,100%{box-shadow:0 0 0 0 rgba(106,159,212,.45);border-left-color:#6a9fd4;}
  50%{box-shadow:0 0 16px 4px rgba(106,159,212,.6);border-left-color:#a8cdf0;}
}
.tl-card.tl-latest{background:linear-gradient(135deg,rgba(106,159,212,.16),rgba(106,159,212,.06));
  animation:tl-card-glow 1.8s ease-in-out infinite;}
.tl-latest-badge{position:absolute;top:8px;right:9px;font-size:9px;font-weight:800;color:#fff;
  background:#e05252;padding:1px 6px;border-radius:8px;letter-spacing:.3px;}
.tl-card .tl-ts{font-size:11.5px;color:var(--m-tx2);}
.tl-card .tl-head{font-size:13.5px;font-weight:600;color:#e6e6e6;margin-top:5px;
  display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;}
.tl-card.tl-event .tl-ts{color:#8ab4dd;font-weight:700;}
.tl-card.tl-event .tl-head{font-size:13.5px;font-weight:600;color:#e6e6e6;-webkit-line-clamp:3;}
.tl-detail{margin-top:2px;padding:11px 13px;background:#161616;border-radius:8px;
  font-size:15px;color:#f0f0f0;line-height:1.6;font-weight:600;}
.tl-detail .tl-detail-ts{color:#8ab4dd;font-weight:700;margin-right:6px;}
.tl-detail .bi-body{color:#d6d6d6;margin-top:6px;font-size:14px;font-weight:400;line-height:1.65;}
.tl-sec{display:inline-block;font-size:11px;font-weight:800;color:#0d1520;
  background:#8ab4dd;border-radius:5px;padding:1px 7px;margin-right:5px;letter-spacing:.2px;}
.tl-src{display:inline-block;font-size:10px;font-weight:700;color:#7c8794;
  background:#20242b;border-radius:5px;padding:1px 6px;margin-left:1px;}
.tl-stock{display:inline-block;font-size:10.5px;font-weight:800;color:#0d1520;
  background:#e8c96a;border-radius:5px;padding:1px 6px;margin-right:4px;}
.tl-imp-badge{position:absolute;top:8px;right:9px;font-size:9px;font-weight:800;color:#fff;
  background:linear-gradient(135deg,#e0655a,#c0392b);padding:1px 7px;border-radius:8px;letter-spacing:.3px;
  box-shadow:0 0 10px rgba(224,101,90,.5);}
.tl-extra{display:block;margin-top:2px;font-size:9.5px;font-weight:500;color:var(--m-tx3);}
.card-fold-btn{position:absolute;top:10px;right:12px;z-index:2;font-size:11px;font-weight:500;
  color:var(--m-tx3);cursor:pointer;padding:2px 6px;border-radius:4px;white-space:nowrap;
  background:var(--panel);}
.card-fold-btn:hover{background:var(--m-elev2);color:var(--m-tx1);}

/* ── 히트맵 그리드 (6열·고박스·큰폰트) ── */
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:9px;}
@media(max-width:1500px){.grid{grid-template-columns:repeat(5,1fr);}}
@media(max-width:1200px){.grid{grid-template-columns:repeat(4,1fr);}}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr);}}
@media(max-width:640px){.grid{grid-template-columns:repeat(2,1fr);}}

/* ── 카드 크기 토글 (1=크게 기본 / 2=보통 / 3=작게) ── */
.grid.density-2{grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:7px;}
.grid.density-2 .tile{min-height:112px;padding:10px 10px 8px;gap:4px;}
.grid.density-2 .tile .sec-name{font-size:13px;}
.grid.density-2 .tile .avg-rate{font-size:19px;}
.grid.density-2 .tile .avg-row{gap:6px;}
.grid.density-2 .tile .stocks{gap:4px;margin-top:3px;}
.grid.density-2 .tile .stock-row{font-size:12px;}
.grid.density-2 .tile .stock-sup{font-size:9px;padding:1px 5px;gap:1px 6px;margin:-1px 0 0;}
.grid.density-2 .tile .stock-more{font-size:11px;}
.grid.density-2 .tile .stock-extra{gap:4px;margin-top:1px;}

.grid.density-3{grid-template-columns:repeat(auto-fill,minmax(108px,1fr));gap:5px;}
.grid.density-3 .tile{min-height:60px;padding:7px 8px 6px;gap:2px;}
.grid.density-3 .tile .sec-name{font-size:11px;}
.grid.density-3 .tile .avg-row{gap:5px;}
.grid.density-3 .tile .avg-rate{font-size:14px;}
.grid.density-3 .tile .avg-spark{display:none;}
.grid.density-3 .tile .stocks{display:none;}
.grid.density-3 .tile .top-more{display:none;}

/* ══ 모바일(≤768px) 반응형 ══ */
@media(max-width:768px){
  html,body{overflow-x:hidden;}          /* 페이지 가로 넘침 방지 */
  /* 상단바: 겹침 방지 — 폰트·간격 축소, 시계 숨김, 넘치면 가로스크롤 */
  .topbar{padding:0 8px;gap:4px;height:46px;overflow-x:auto;overflow-y:hidden;
    white-space:nowrap;scrollbar-width:none;}
  .topbar::-webkit-scrollbar{display:none;}
  .topbar .logo{font-size:12px;letter-spacing:0;flex-shrink:0;}
  .nav{margin-left:4px;gap:0;flex-shrink:0;}
  .nav a{padding:5px 7px;font-size:12px;}
  .topbar .badge{font-size:10px;padding:2px 7px;flex-shrink:0;}
  .topbar .time{display:none;}           /* 시계 숨김 */
  #topbar-refresh{flex-shrink:0;}
  .main{padding:10px 8px;}
  /* 서브바: 줄바꿈 허용, 버튼 안 찌부 */
  .subbar{flex-wrap:wrap;gap:6px 8px;}
  .subbar h1{font-size:15px;}
  .subbar .right{margin-left:0;flex-wrap:wrap;}
  .interval-btn,.subbar .refresh-btn{flex-shrink:0;white-space:nowrap;}
  .etf-bar{padding:0 8px;}
  /* 상단 4패널: 가로 스와이프 (카드당 화면폭 85%) */
  #mkt-panel{overflow-x:auto;-webkit-overflow-scrolling:touch;padding:8px 8px 0 !important;
    scroll-snap-type:x mandatory;gap:8px !important;}
  #mkt-panel > .mkt-card{min-width:85vw;scroll-snap-align:start;}
  /* 차트 모달: 전체화면 */
  .chart-box{position:fixed !important;left:0 !important;top:0 !important;
    width:100vw !important;height:100dvh !important;max-width:100vw !important;max-height:100dvh !important;
    border-radius:0 !important;resize:none !important;padding:8px 8px 10px !important;}
  .chart-box::after{display:none;}          /* 리사이즈 그립 숨김 */
  .chart-box .modal-hd .drag-hint{display:none;}
  .chart-tf .tf-btn{padding:5px 10px;}
  /* 차트+지표 세로 스택 */
  .chart-main-row{flex-direction:column;}
  .tk-toggle{display:none;}
  .chart-right{width:auto !important;border-left:none;border-top:1px solid var(--m-elev);}
  .chart-news{max-height:38vh;}
  .taerini-panel{width:auto !important;max-height:42vh;border-left:none;
    border-top:1px solid var(--m-elev);padding:6px 4px 10px;margin-left:0;
    overflow-y:auto;-webkit-overflow-scrolling:touch;}   /* 아래 잘림 방지: 내부 스크롤 */
  .taerini-panel.collapsed{max-height:0;overflow:hidden;}
  /* 종목 검색창 조금 넓게 */
  .cs-input{width:120px;}
  .cs-input:focus{width:150px;}
  /* 시장상황/뉴스이슈 타임라인: 8-up 고정폭이 폰에서 뭉개짐 → 가로스와이프 + 카드 넓게 */
  #mkt-below-panel{padding:8px 8px 0 !important;}
  #mkt-below-panel > div{gap:8px !important;}
  .timeline-strip{overflow-x:auto;-webkit-overflow-scrolling:touch;scroll-snap-type:x mandatory;}
  .timeline-strip.tl-strip-fill .tl-card{flex:0 0 74vw !important;scroll-snap-align:start;}
  .timeline-strip.tl-strip-wrap{flex-wrap:nowrap;}
  .timeline-strip.tl-strip-wrap .tl-card{flex:0 0 74vw !important;scroll-snap-align:start;}
  .tl-card{min-height:auto;}
  .tl-detail{font-size:14px;}
  /* 관심종목: 가로 스와이프 */
  .watch-row,#watchlist-row{overflow-x:auto;-webkit-overflow-scrolling:touch;}
}

.tile{border-radius:12px;padding:14px 14px 12px;min-height:182px;display:flex;flex-direction:column;
      gap:7px;transition:transform .15s,box-shadow .15s;cursor:default;position:relative;overflow:hidden;}
.tile:hover{transform:translateY(-3px);box-shadow:0 12px 32px rgba(0,0,0,.5);}
/* 헤더: 섹터명(윗줄) → 등락률·차트·★(아랫줄) */
.tile .sec-name{font-size:16px;font-weight:800;color:#fff;line-height:1.25;
  text-shadow:0 1px 3px rgba(0,0,0,.5);display:flex;align-items:center;flex-wrap:wrap;gap:3px;}
.tile .avg-row{display:flex;align-items:center;gap:9px;}
.tile .avg-rate{font-size:27px;font-weight:900;line-height:1;white-space:nowrap;}
.tile .avg-spark{display:inline-flex;align-items:center;flex-shrink:0;opacity:.9;}
.tile .avg-spark.no-chart{color:rgba(255,255,255,.25);font-size:15px;}
.tile .stocks{display:flex;flex-direction:column;gap:6px;margin-top:5px;}
/* 종목: 이름+등락률(윗줄) → 수급(아랫줄) */
.tile .stock-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;
  font-size:15px;color:#fff;line-height:1.35;cursor:pointer;}
.tile .stock-row:hover .stock-name{text-decoration:underline;text-underline-offset:2px;}
.tile .stock-name{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:64%;font-weight:600;}
.tile .stock-rate{flex:0 0 auto;font-weight:800;white-space:nowrap;}
.tile .stock-more{font-size:13px;color:var(--gold);margin-top:3px;cursor:pointer;opacity:.75;transition:opacity .15s;user-select:none;}
.tile .stock-more:hover{opacity:1;}
.tile .stock-extra{display:none;flex-direction:column;gap:6px;margin-top:3px;}
.tile .stock-extra.open{display:flex;}
/* 종목 행 수급 — 종목명 아래 줄, 어두운 띠 (좁은 폭이라 자동 줄바꿈) */
.tile .stock-sup{display:flex;flex-wrap:wrap;gap:2px 9px;margin:-2px 0 1px;padding:2px 7px;
  background:rgba(0,0,0,.24);border-radius:5px;font-size:10.5px;line-height:1.4;
  font-variant-numeric:tabular-nums;}
.tile .stock-sup:empty{display:none;padding:0;background:none;margin:0;}
.tile .stock-sup .sp{white-space:nowrap;color:rgba(255,255,255,.55);}
.tile .stock-sup .sp.su{color:#ffcaca;}
.tile .stock-sup .sp.sd{color:#cfe6ff;}
.tile .stock-sup .sp.sn{color:rgba(255,255,255,.4);}
.parent-badge{display:inline-block;font-size:10px;color:rgba(255,255,255,.45);font-weight:400;
              background:rgba(0,0,0,.35);padding:1px 6px;border-radius:10px;
              margin-left:4px;vertical-align:middle;}

.tile.up3{background:linear-gradient(135deg,#7b1c1c,#a93226);}
.tile.up2{background:linear-gradient(135deg,#922b21,#c0392b);}
.tile.up1{background:linear-gradient(135deg,#6b2020,#8b2f2f);}
.tile.neu{background:var(--panel);border:1px solid var(--line);}
.tile.dn1{background:linear-gradient(135deg,#1b2a6b,#1a5276);}
.tile.dn2{background:linear-gradient(135deg,#1a4066,#1f618d);}
.tile.dn3{background:linear-gradient(135deg,#0e2440,#154360);}
.tile.empty{background:var(--panel);border:1px dashed var(--line);opacity:.5;}

.loading{text-align:center;padding:80px;color:var(--m-tx5);font-size:18px;grid-column:1/-1;}
.error{text-align:center;padding:60px;color:#e74c3c;grid-column:1/-1;}

/* ── 편집 탭 ── */
.edit-panel{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
@media(max-width:800px){.edit-panel{grid-template-columns:1fr;}}
.edit-section{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;}
.edit-section h2{font-size:14px;font-weight:700;color:var(--gold);margin-bottom:12px;letter-spacing:.3px;}
.edit-input{width:100%;background:#1a1a22;border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;color:var(--m-tx0);font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;}
.edit-input:focus{border-color:var(--gold);}
.sector-list{margin-top:8px;max-height:280px;overflow-y:auto;display:flex;flex-direction:column;gap:3px;
  scrollbar-width:thin;scrollbar-color:var(--m-bd2) transparent;}
.sector-item{display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;transition:background .1s;}
.sector-item:hover{background:rgba(255,255,255,.04);}
.sector-item input[type=checkbox]{accent-color:#c0392b;width:15px;height:15px;cursor:pointer;flex-shrink:0;}
.sector-item label{font-size:12px;color:var(--m-tx1);flex:1;cursor:pointer;line-height:1.3;}
.sector-item.hidden label{color:var(--m-tx5);text-decoration:line-through;}
.edit-label{font-size:11px;color:var(--m-tx4);margin-bottom:5px;margin-top:10px;display:block;}
.sector-select{width:100%;background:#1a1a22;border:1px solid var(--line);border-radius:8px;
  padding:8px 12px;color:var(--m-tx0);font-size:13px;font-family:inherit;outline:none;box-sizing:border-box;}
.sector-select:focus{border-color:var(--gold);}
.tag-row{display:flex;flex-wrap:wrap;gap:5px;min-height:22px;}
.tag{display:inline-flex;align-items:center;gap:3px;padding:3px 9px;
  background:rgba(212,175,55,.12);border:1px solid rgba(212,175,55,.3);
  border-radius:20px;font-size:11px;color:var(--gold);}
.tag .x{cursor:pointer;color:var(--m-tx3);font-size:10px;margin-left:2px;}
.tag .x:hover{color:#e74c3c;}
.autocomplete-wrap{position:relative;}
.autocomplete-list{position:absolute;top:calc(100% + 2px);left:0;right:0;background:#1e1e28;
  border:1px solid var(--line);border-radius:8px;max-height:160px;overflow-y:auto;
  z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.6);}
.autocomplete-item{padding:7px 12px;font-size:12px;color:var(--m-tx1);cursor:pointer;}
.autocomplete-item:hover{background:rgba(212,175,55,.1);color:var(--gold);}
.custom-sector-list{display:flex;flex-direction:column;gap:6px;}
.custom-sector-row{display:flex;align-items:center;justify-content:space-between;
  padding:7px 10px;background:rgba(255,255,255,.03);border-radius:8px;}
.custom-sector-name{font-size:12px;color:var(--m-tx0);font-weight:700;}
.custom-sector-stocks{font-size:10px;color:var(--m-tx5);margin-top:2px;}
.del-btn{background:none;border:none;color:var(--m-tx5);cursor:pointer;font-size:13px;padding:2px 6px;line-height:1;}
.del-btn:hover{color:#e74c3c;}
.save-bar{margin-top:14px;display:flex;justify-content:flex-end;gap:8px;}
.btn-save{padding:9px 24px;background:var(--gold);color:#111;border:none;border-radius:8px;
  font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;transition:opacity .15s;}
.btn-save:hover{opacity:.85;}
.btn-save:disabled{opacity:.5;cursor:wait;}
.btn-reset{padding:9px 16px;background:none;border:1px solid var(--m-bd3);color:var(--m-tx3);
  border-radius:8px;font-size:12px;cursor:pointer;font-family:inherit;transition:border-color .15s,color .15s;}
.btn-reset:hover{border-color:var(--m-tx2);color:var(--m-tx1);}
#toast{position:fixed;bottom:24px;right:24px;padding:11px 18px;border-radius:10px;
  font-size:13px;z-index:9999;pointer-events:none;transition:opacity .4s;}

/* ── 타일 종목 편집 버튼 + 모달 ── */
.tile .sec-edit-btn{display:inline-block;margin-left:6px;font-size:12px;color:rgba(255,255,255,.45);
  cursor:pointer;vertical-align:middle;transition:color .15s;user-select:none;}
.tile .sec-edit-btn:hover{color:#fff;}
.tile .sec-del-btn{display:inline-block;margin-left:5px;font-size:11px;color:rgba(255,255,255,.35);
  cursor:pointer;vertical-align:middle;transition:color .15s;user-select:none;}
.tile .sec-del-btn:hover{color:#e74c3c;}
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9998;
  display:none;align-items:flex-start;justify-content:center;padding-top:90px;}
.modal-box{background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:440px;max-width:92vw;max-height:78vh;overflow-y:auto;padding:18px 20px;
  box-shadow:0 16px 48px rgba(0,0,0,.6);scrollbar-width:thin;scrollbar-color:var(--m-bd2) transparent;}
.modal-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;
  font-size:14px;font-weight:700;color:var(--gold);}
.modal-x{background:none;border:none;color:var(--m-tx3);font-size:16px;cursor:pointer;line-height:1;padding:2px 4px;}
.modal-x:hover{color:#e74c3c;}
/* 종목 차트 모달 — 떠 있는 창 (드래그 이동 + 크기조절) */
#chart-modal{position:fixed;inset:0;z-index:9998;pointer-events:none;display:none;}
#chart-modal.open{display:block;}
.chart-box{position:absolute;pointer-events:auto;
  background:var(--panel);border:1px solid var(--line);border-radius:14px;
  width:1040px;height:600px;min-width:440px;min-height:360px;max-width:98vw;max-height:95vh;
  display:flex;flex-direction:column;padding:12px 16px 16px;
  box-shadow:0 16px 48px rgba(0,0,0,.65);resize:both;overflow:hidden;}
.chart-box .modal-hd{cursor:move;user-select:none;}
.chart-box .modal-hd .drag-hint{font-size:10px;color:var(--m-tx5);font-weight:400;margin-left:6px;}
/* 차트 상단 종목 검색 */
.cs-wrap{position:relative;}
.cs-input{background:#141418;border:1px solid var(--m-bd2);border-radius:6px;color:var(--m-tx0);font-size:12px;
  padding:5px 10px;width:140px;font-family:inherit;outline:none;transition:width .12s,border-color .12s;}
.cs-input:focus{border-color:var(--gold,#d4af37);width:180px;}
.cs-ac{position:absolute;top:calc(100% + 3px);right:0;min-width:200px;background:#16161c;
  border:1px solid var(--m-bd2);border-radius:7px;max-height:260px;overflow-y:auto;z-index:30;display:none;
  box-shadow:0 8px 24px rgba(0,0,0,.6);}
.cs-ac.open{display:block;}
.cs-ac .cs-item{padding:6px 10px;font-size:12px;color:var(--m-tx1);cursor:pointer;display:flex;
  justify-content:space-between;gap:10px;}
.cs-ac .cs-item:hover,.cs-ac .cs-item.sel{background:#26262e;color:#fff;}
.cs-ac .cs-item .c{color:var(--m-tx3);font-size:11px;}
#tv_chart_container{flex:1;min-height:0;border-radius:8px;overflow:hidden;position:relative;}
/* 크기조절 그립 보강 (우하단) */
.chart-box::after{content:"";position:absolute;right:2px;bottom:2px;width:14px;height:14px;
  pointer-events:none;background:
    linear-gradient(135deg,transparent 50%,rgba(212,175,55,.6) 50%,rgba(212,175,55,.6) 60%,transparent 60%,transparent 72%,rgba(212,175,55,.6) 72%,rgba(212,175,55,.6) 82%,transparent 82%);}
.chart-tf{display:flex;gap:6px;margin:2px 0 10px;}
.chart-tf .tf-btn{padding:5px 13px;border:1px solid var(--m-bd2);border-radius:7px;background:transparent;
  color:var(--m-tx3);font-size:12px;cursor:pointer;font-family:inherit;transition:all .15s;}
.chart-tf .tf-btn:hover{border-color:var(--m-tx5);color:var(--m-tx1);}
.chart-tf .tf-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.1);}
/* 차트 + 투자참고지표 세로 패널 가로 배치 */
.chart-main-row{display:flex;flex:1;min-height:0;gap:0;}
.chart-col{flex:1;min-width:0;display:flex;flex-direction:column;}
.tk-toggle{flex-shrink:0;align-self:stretch;width:15px;display:flex;align-items:center;
  justify-content:center;cursor:pointer;color:var(--m-tx4);background:#101014;
  border:none;border-left:1px solid var(--m-elev);font-size:11px;padding:0;}
.tk-toggle:hover{color:var(--gold,#d4af37);background:#17171c;}
.chart-right{flex-shrink:0;width:460px;display:flex;flex-direction:column;min-height:0;
  border-left:1px solid var(--m-elev);transition:width .12s;}
.chart-right.collapsed{width:0;overflow:hidden;border-left:none;}
.chart-news{flex:0 0 auto;max-height:52%;overflow-y:auto;padding:11px 14px 12px;
  border-bottom:1px solid var(--m-elev);font-size:13.5px;color:var(--m-tx1);}
.chart-news .cn-load{color:var(--m-tx4);font-size:12.5px;padding:6px 0;}
.chart-news .cn-hd{font-size:13.5px;color:#9a9a9a;font-weight:700;margin-bottom:8px;letter-spacing:.3px;}
.chart-news .cn-sum{padding:12px 14px;border-radius:8px;margin-bottom:10px;
  background:linear-gradient(180deg,rgba(212,175,55,.10),rgba(212,175,55,.03));
  border:1px solid rgba(212,175,55,.25);font-size:13.5px;line-height:1.62;color:#e8e2d0;}
.chart-news .cn-sum b{color:#f5d97a;font-weight:700;}
.chart-news .cn-sum ul{margin:3px 0;padding-left:17px;}
.chart-news .cn-sum li{margin:2px 0;color:var(--m-tx0);}
.chart-news .cn-sum .cn-line{margin:4px 0;}
.chart-news .cn-sum .cn-src{margin-top:7px;font-size:10.5px;color:#8a7f5e;text-align:right;}
.chart-news .cn-item{display:block;padding:7px 3px;border-bottom:1px solid #17171c;
  color:#cfcfcf;text-decoration:none;line-height:1.45;}
.chart-news .cn-item:hover{color:#fff;}
.chart-news .cn-item .cn-meta{font-size:11px;color:var(--m-tx3);margin-top:3px;}
.taerini-panel{flex:1;min-height:0;font-size:14px;color:var(--m-tx1);
  padding:2px 4px 2px 16px;overflow-y:auto;line-height:1.6;}
.taerini-panel .tk-hd{font-size:13.5px;color:#9a9a9a;font-weight:700;margin-bottom:9px;
  letter-spacing:.3px;position:sticky;top:0;background:var(--panel);
  padding-bottom:7px;border-bottom:1px solid var(--m-bd1);}
.taerini-panel .tk-row{padding:9px 2px;border-bottom:1px solid #171717;}
.taerini-panel .tk-row:last-child{border-bottom:none;}
.taerini-panel .tk-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
.taerini-panel .tk-lab{color:#8a8a8a;flex-shrink:0;}
.taerini-panel .tk-lab.hint{border-bottom:1px dotted #5a5a5a;cursor:help;}
.taerini-panel .tk-val{text-align:right;color:var(--m-tx0);font-weight:700;font-size:15.5px;font-variant-numeric:tabular-nums;}
.taerini-panel .tk-sub{color:var(--m-tx3);font-size:12px;margin-top:3px;text-align:right;}
.taerini-panel .tk-empty{color:var(--m-tx4);font-size:12.5px;padding-top:6px;}
.taerini-panel .tk-date{color:var(--m-tx5);font-size:11px;margin-top:10px;text-align:right;}
/* 수급빈집 스파크라인 */
.taerini-panel .tk-osc-row{cursor:pointer;}
.taerini-panel .tk-spk-cap{font-size:10.5px;color:var(--m-tx4);display:flex;justify-content:space-between;margin-top:5px;}
.taerini-panel .tk-spk{margin-top:4px;background:#0d0d10;border:1px solid #191919;border-radius:5px;padding:4px;}
.taerini-panel .tk-caret{color:var(--m-tx4);font-size:10px;margin-left:4px;}
/* 컨센흐름 오버레이 컨트롤 */
.cf-ctl{display:flex;align-items:center;gap:4px;margin-left:8px;}
.cf-ctl .cf-btn{padding:2px 7px;border:1px solid #2c2c33;border-radius:5px;background:transparent;
  color:var(--m-tx2);font-size:10.5px;cursor:pointer;font-family:inherit;white-space:nowrap;}
.cf-ctl .cf-btn:hover{border-color:var(--m-tx5);color:var(--m-tx1);}
.cf-ctl .cf-btn.active{border-color:#5b8def;color:#5b8def;background:rgba(91,141,239,.12);}
.cf-ctl .cf-seg{display:none;gap:3px;}
.cf-ctl.on .cf-seg{display:flex;}
/* 컨센 끝점 — 펄스 점 + '컨센' 라벨 (메인 ETF 방식, 라인은 고정) */
@keyframes cfpulse{0%{transform:scale(1);opacity:.9}70%{transform:scale(2.6);opacity:0}100%{opacity:0}}
.cf-end{position:absolute;transform:translate(-3.5px,-50%);z-index:6;pointer-events:none;
  display:flex;align-items:center;gap:7px;}
.cf-end .cf-dot{width:7px;height:7px;border-radius:50%;background:#e74c3c;position:relative;
  box-shadow:0 0 6px 2px rgba(231,76,60,.6);flex-shrink:0;}
.cf-end .cf-dot::after{content:"";position:absolute;inset:0;border-radius:50%;
  background:#e74c3c;animation:cfpulse 1.3s ease-out infinite;}
.cf-end .cf-lab{color:#e74c3c;font-size:11px;font-weight:700;white-space:nowrap;
  text-shadow:0 0 4px rgba(0,0,0,.9);}
.chart-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--m-tx4);font-size:13px;}
.chart-legend{margin-left:auto;font-size:11.5px;color:var(--m-tx1);font-variant-numeric:tabular-nums;white-space:nowrap;align-self:center;}

/* 지표·그리기 도구바 */
.chart-tools{display:flex;align-items:center;flex-wrap:wrap;gap:5px;margin:0 0 8px;}

.ct-btn:hover{border-color:var(--m-tx5);color:var(--m-tx1);}
.ct-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(212,175,55,.12);}
.ct-btn.wbtn{padding:3px 8px;}
.ct-sw{width:16px;height:16px;border-radius:4px;border:1px solid var(--m-tx5);cursor:pointer;padding:0;}
.ct-sw.active{outline:2px solid #fff;outline-offset:1px;}
#tv_chart_container.drawing{cursor:crosshair;}

/* ── 관심종목 패널 ── */
.wl-panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;

.wl-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;}

.wl-add input:focus{border-color:var(--gold);}
.wl-ac{position:absolute;top:calc(100% + 3px);left:0;right:0;background:#1e1e28;

.wl-ac-item:hover,.wl-ac-item.sel{background:rgba(212,175,55,.18);color:var(--gold);}
.wl-ac-item .c{color:var(--m-tx5);font-size:11px;}

.wl-row::-webkit-scrollbar{height:5px;}
.wl-row::-webkit-scrollbar-thumb{background:var(--m-bd2);border-radius:3px;}
.wl-empty{font-size:12px;color:var(--m-tx5);padding:10px 4px;}
.wl-card{flex:0 0 auto;min-width:158px;background:#16161c;border:1px solid var(--line);

.wl-card:hover{border-color:var(--gold-dim,#7a6320);}
.wl-card{cursor:grab;}
.wl-card:active{cursor:grabbing;}
.wl-card.dragging{opacity:.4;}
.wl-card.drop-before{box-shadow:-3px 0 0 var(--gold,#d4af37);}
.wl-card.drop-after{box-shadow:3px 0 0 var(--gold,#d4af37);}
.wl-card .x{position:absolute;top:5px;right:6px;background:none;border:none;color:var(--m-tx5);
  cursor:pointer;font-size:13px;line-height:1;padding:2px;transition:color .15s;}
.wl-card .x:hover{color:#e74c3c;}
.wl-nm{font-size:12.5px;font-weight:700;color:var(--m-tx0);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;max-width:118px;margin-bottom:3px;}
.wl-pr{display:flex;align-items:baseline;gap:6px;margin-bottom:7px;}
.wl-pr .p{font-size:13px;font-weight:800;color:var(--m-tx0);font-variant-numeric:tabular-nums;}
.wl-pr .r{font-size:12px;font-weight:700;}
.wl-pr .r.up{color:var(--up1);} .wl-pr .r.dn{color:var(--dn1);} .wl-pr .r.neu{color:var(--m-tx4);}
.wl-sup{display:grid;grid-template-columns:1fr 1fr;gap:2px 8px;}
.wl-sup .s{display:flex;justify-content:space-between;gap:4px;font-size:10px;font-variant-numeric:tabular-nums;}
.wl-sup .s .k{color:var(--m-tx3);}
.wl-sup .s .v.up{color:var(--up1);} .wl-sup .s .v.dn{color:var(--dn1);} .wl-sup .s .v.neu{color:var(--m-tx5);}
.wl-sup-na{font-size:9px;color:var(--m-bd3);margin-top:4px;}
</style>
</head>

<script>
function sbEffectiveTheme(){var t=document.documentElement.getAttribute('data-theme');if(t==='dark'||t==='light')return t;return (window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches)?'dark':'light';}
function sbSyncThemeBtn(){var b=document.getElementById('sb-theme-btn');if(!b)return;var dark=sbEffectiveTheme()==='dark';b.textContent=dark?'☀️':'🌙';b.title=dark?'라이트 모드로 전환':'다크 모드로 전환';}
function sbToggleTheme(){var next=sbEffectiveTheme()==='dark'?'light':'dark';document.documentElement.setAttribute('data-theme',next);try{localStorage.setItem('sb-theme',next);}catch(e){}sbSyncThemeBtn();}
sbSyncThemeBtn();
if(window.matchMedia){try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',function(){if(!document.documentElement.getAttribute('data-theme'))sbSyncThemeBtn();});}catch(e){}}
</script>

<!-- 트레이딩뷰 Lightweight Charts (오픈소스) — 키움 캔들 렌더용 -->
<script src="https://unpkg.com/lightweight-charts@4/dist/lightweight-charts.standalone.production.js"></script>
<script>
// ── 유틸 ──────────────────────────────────────────────────
function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
// 뉴스 아이템 출처 아이콘 — 텔레그램발이면 종이비행기, 아니면 기존 아이콘 유지
function newsSrcIcon(n,fallback){return (n&&n.source==="telegram")?"✈️":fallback;}
function rateToBg(r){
  if(r>=3)return"up3";if(r>=1)return"up2";if(r>=0.5)return"up1";
  if(r<=-3)return"dn3";if(r<=-1)return"dn2";if(r<=-0.5)return"dn1";
  return"neu";
}
function rateStr(r){
  if(r==null||r===0)return"±0.00%";
  return(r>0?"+":"")+r.toFixed(2)+"%";
}

// ── 시계 ─────────────────────────────────────────────────
setInterval(()=>{
  const now=new Date();
  document.getElementById("clock").textContent=now.toLocaleTimeString("ko-KR");
  const h=now.getHours(),m=now.getMinutes();
  const isMarket=(h>9||(h===9&&m>=0));
  const isClose=(h>15||(h===15&&m>=30));
  const badge=document.getElementById("mkt-status");
  if(isClose){badge.textContent="장마감";badge.style.background="#2a1a1a";badge.style.color="#e74c3c";}
  else if(isMarket){badge.textContent="장중";badge.style.background="#1e3a1e";badge.style.color="#4ade80";}
  else{badge.textContent="장전";badge.style.background="#1a1a2e";badge.style.color="#aaa";}
},1000);

// ── 탭 상태 ──────────────────────────────────────────────
let activeTab="all";

document.getElementById("tab-bar").addEventListener("click",e=>{
  const btn=e.target.closest(".tab");
  if(!btn)return;
  const tab=btn.dataset.tab;
  document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.tab===tab));
  activeTab=tab;
  loadActive();
});

// ★ 클릭 이벤트 위임
document.getElementById("grid").addEventListener("click",e=>{
  const sd=e.target.closest(".sec-del-btn");
  if(sd){ e.stopPropagation(); hideSectorQuick(sd.dataset.secdel); return; }
  const se=e.target.closest(".sec-edit-btn");
  if(se){ e.stopPropagation(); openSectorEdit(se.dataset.secedit); return; }
  // 섹터명 클릭 → 섹터 뉴스+빈집 팝오버
  const sn=e.target.closest(".sec-name");
  if(sn){
    const tile=sn.closest(".tile");
    const rows=[...tile.querySelectorAll(".stock-row")];
    const codes=rows.map(r=>r.dataset.code).filter(Boolean);
    const names=rows.map(r=>r.dataset.name);
    const title=sn.querySelector(".sec-edit-btn")?.dataset.secedit||(sn.textContent||"").replace("✎","").trim();
    if(codes.length) openSectorDetail({codes, names, title, anchor:tile});
    return;
  }
  const btn=e.target.closest(".fav-btn");
  if(!btn){
    // 종목 행 클릭 → 차트 모달 (★/더보기/✎ 아닌 경우)
    const row=e.target.closest(".stock-row");
    if(row && row.dataset.code){ openStockChart(row.dataset.code, row.dataset.name); return; }
  }
  if(btn){
    e.stopPropagation();
    const name=btn.dataset.sector;
    toggleFav(name);
    // 즐겨찾기 탭이면 재렌더(전체 캐시 기준), 아니면 버튼만 토글
    if(activeTab==="fav"){ renderGrid(_allTiles); }
    else { btn.classList.toggle("on"); }
    return;
  }
  // 더보기/접기 — 같은 행 카드 전체 동기화 (하단 버튼 or 상단 버튼 모두 처리)
  const more=e.target.closest(".stock-more,.top-more");
  if(more){
    const thisTile=more.closest(".tile");
    const extra=thisTile.querySelector(".stock-extra");
    if(!extra)return;
    const willOpen=!extra.classList.contains("open");
    const thisTop=thisTile.getBoundingClientRect().top;
    document.querySelectorAll(".grid .tile").forEach(tile=>{
      if(Math.abs(tile.getBoundingClientRect().top-thisTop)>5)return;
      const m=tile.querySelector(".stock-more");
      const tm=tile.querySelector(".top-more");
      const x=tile.querySelector(".stock-extra");
      if(!x)return;
      if(willOpen){
        x.classList.add("open");
        if(m)m.textContent="▲ 접기";
        if(tm){tm.textContent="▲ 접기";tm.style.color="rgba(255,255,255,.7)";}
      }else{
        x.classList.remove("open");
        if(m)m.textContent=`+${m.dataset.count}개 더보기`;
        if(tm){tm.textContent="+ 더보기";tm.style.color="";}
      }
    });
    if(willOpen) refreshTileSupply();  // 펼쳐진 종목 수급 로드
  }
});

function loadActive(){
  if(activeTab==="fav"){
    if(_allTiles.length>0) renderGrid(_allTiles);
    else loadOverview();
  }
  else if(activeTab==="all") loadOverview();
  else if(activeTab==="edit") loadEditTab();
  else if(activeTab==="news") loadNewsTab();
  else loadTab(activeTab);
}

// ── 📰 뉴스 탭 (강한섹터 + 빈집종목 + 뉴스) ──────────────────
function _nfStyle(){
  if(document.getElementById("nf-style"))return;
  const s=document.createElement("style"); s.id="nf-style";
  s.textContent=`
  .nf-card{background:#141419;border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:2px;}
  .nf-hd{font-size:15px;color:#fff;margin-bottom:8px;display:flex;align-items:center;gap:10px;}
  .nf-secnews{display:flex;flex-direction:column;gap:5px;margin-bottom:10px;}
  .nf-hl{color:#cfcfe0;text-decoration:none;font-size:13px;display:flex;gap:8px;align-items:baseline;}
  .nf-hl:hover{color:var(--gold,#d4af37);}
  .nf-hl.sub{color:#aaa;font-size:12.5px;}
  .nf-meta{color:#777;font-size:11px;flex-shrink:0;margin-left:auto;}
  .nf-stocks{display:flex;flex-direction:column;gap:4px;border-top:1px solid #1e1e26;padding-top:8px;}
  .nf-strow{display:flex;align-items:center;gap:10px;font-size:13px;cursor:pointer;padding:4px 0;}
  .nf-strow:hover{background:#1a1a22;}
  .nf-nm{color:#eee;font-weight:600;cursor:pointer;}
  .nf-nm:hover{color:var(--gold,#d4af37);text-decoration:underline;}
  .nf-toggle{margin-left:auto;color:#888;font-size:11.5px;}
  .nf-stnews{display:none;flex-direction:column;gap:4px;padding:4px 0 8px 14px;}
  .nf-stock.open .nf-stnews{display:flex;}
  .nf-stock.open .nf-toggle{color:var(--gold,#d4af37);}
  #etf-pop{width:560px;max-width:92vw;}
  .sec-name{cursor:pointer;}
  .sec-name:hover{color:var(--gold,#d4af37);}`;
  document.head.appendChild(s);
}
async function loadNewsTab(){
  _nfStyle();
  const grid=document.getElementById("grid");
  grid.innerHTML=`<div style="grid-column:1/-1;color:#888;padding:20px">뉴스 불러오는 중…</div>`;
  let d; try{ d=await (await fetch("/api/news_feed")).json(); }catch(_){ d={sectors:[]}; }
  const secs=d.sectors||[];
  if(!secs.length){ grid.innerHTML=`<div style="grid-column:1/-1;color:#888;padding:24px">뉴스 준비중 (백그라운드 20분 주기 수집). 잠시 후 다시 눌러주세요.</div>`; return; }
  grid.innerHTML=secs.map(s=>{
    const rc=s.rate>0?"up":s.rate<0?"dn":"neu";
    const rs=(s.rate>0?"+":"")+(Number(s.rate)||0).toFixed(2)+"%";
    const secNews=(s.news||[]).map(n=>`<a class="nf-hl" href="${n.url}" target="_blank" rel="noopener">${newsSrcIcon(n,"📰")} ${esc(n.title)}<span class="nf-meta">${esc(n.date||"")}</span></a>`).join("");
    const stocks=(s.stocks||[]).map(st=>{
      const nn=st.news||[]; const g=st.group||""; let col="#9a9a9a";
      if(g.includes("완전빈집"))col="#2ecc71"; else if(g.includes("반빈집"))col="#7bd88f"; else if(g.includes("과열"))col="#e74c3c"; else if(g.includes("매수우위"))col="#e0803c";
      const vac=st.pct!=null?`<span style="color:${col};font-size:12px">${g} ${Math.round(st.pct)}%</span>`:"";
      const news=nn.map(n=>`<a class="nf-hl sub" href="${n.url}" target="_blank" rel="noopener">${newsSrcIcon(n,"·")} ${esc(n.title)}<span class="nf-meta">${esc(n.src||"")} ${esc(n.date||"")}</span></a>`).join("");
      return `<div class="nf-stock">
        <div class="nf-strow" onclick="this.parentNode.classList.toggle('open')">
          <span class="nf-nm" onclick="event.stopPropagation();openStockChart('${st.code}','${esc(st.name)}')">${esc(st.name)}</span>
          ${vac}<span class="nf-toggle">${nn.length?('뉴스 '+nn.length+' ▾'):'뉴스없음'}</span>
        </div>
        <div class="nf-stnews">${news||'<span style="color:#666;font-size:11px">뉴스 없음</span>'}</div>
      </div>`;
    }).join("");
    return `<div class="nf-card" style="grid-column:1/-1">
      <div class="nf-hd"><b>${esc(s.etf||"")}</b><span class="etf-rate ${rc}">${rs}</span></div>
      <div class="nf-secnews">${secNews||'<span style="color:#666;font-size:12px">섹터뉴스 없음</span>'}</div>
      <div class="nf-stocks">${stocks}</div>
    </div>`;
  }).join("");
}

// ── 클라이언트 탭 캐시 (세션 내 즉시 렌더) ──────────────────
const _tabCache={};  // {key: {data, ts}}
const _TAB_TTL=180*1000;  // 3분

function _fromCache(key){ const e=_tabCache[key]; return(e&&Date.now()-e.ts<_TAB_TTL)?e.data:null; }
function _toCache(key,data){ _tabCache[key]={data,ts:Date.now()}; }
function _clearCache(key){ delete _tabCache[key]; }

// ── 전체 탭 ──────────────────────────────────────────────
const _LS_VER="v3";  // 올리면 브라우저 캐시 자동 무효화
const _LS_ALL=`__hm_all_${_LS_VER}__`;
const _LS_TAB_PFX=`__hm_tab_${_LS_VER}_`;

function _lsSave(key,data){try{localStorage.setItem(key,JSON.stringify(data));}catch(e){}}
function _lsLoad(key){try{const v=localStorage.getItem(key);return v?JSON.parse(v):null;}catch(e){return null;}}

// ── NXT(애프터아워) 모드 — 정규장 마감가 대비 등락률 토글 ──
let _heatmapMode="regular";   // 'regular'|'nxt' — 세션 전용(새로고침 시 초기화)
function _hmCacheKey(){ return _heatmapMode==="nxt" ? "all_nxt" : "all"; }
function _hmLsKey(){ return _heatmapMode==="nxt" ? _LS_ALL+"_nxt" : _LS_ALL; }
function _hmUrl(base){ return _heatmapMode==="nxt" ? base+"?mode=nxt" : base; }
function toggleHeatmapMode(){
  _heatmapMode=(_heatmapMode==="nxt")?"regular":"nxt";
  const btn=document.getElementById("nxt-toggle");
  if(btn) btn.classList.toggle("active", _heatmapMode==="nxt");
  document.getElementById("main-title").textContent=
    _heatmapMode==="nxt" ? "섹터 히트맵 — NXT 애프터아워(정규장 마감가 대비)" : "섹터 히트맵 — 전체";
  loadOverview(true);
}

async function loadOverview(force=false){
  const cacheKey=_hmCacheKey(), lsKey=_hmLsKey();
  if(!force){
    // 1) 메모리 캐시
    const cached=_fromCache(cacheKey);
    if(cached){ renderOverview(cached); return; }
    // 2) localStorage 즉시 렌더 후 백그라운드 갱신
    const prev=_lsLoad(lsKey);
    if(prev){
      _toCache(cacheKey,prev);
      renderOverview(prev);
      _refreshOverviewBg();   // 스피너 없이 조용히 갱신
      return;
    }
  }
  // 3) 캐시 전혀 없을 때만 로딩 스피너
  const btn=document.getElementById("refresh-btn");
  btn.disabled=true; btn.textContent="로딩중…";
  document.getElementById("main-title").textContent=
    _heatmapMode==="nxt" ? "섹터 히트맵 — NXT 애프터아워(정규장 마감가 대비)" : "섹터 히트맵 — 전체";
  const grid=document.getElementById("grid");
  if(force) grid.innerHTML='<div class="loading">📡 섹터 데이터 갱신 중…</div>';
  try{
    const url=_hmUrl(force?"/api/heatmap/refresh":"/api/heatmap");
    const r=await fetch(url);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const data=await r.json();
    if(data.error)throw new Error(data.error);
    if(data.loading){
      const sec=data.retry_after||5;
      grid.innerHTML=`<div class="loading">⚙️ 서버 데이터 준비 중… <span id="cnt">${sec}</span>초 후 재시도</div>`;
      btn.disabled=false; btn.textContent="↻ 새로고침";
      let n=sec;
      const t=setInterval(()=>{const el=document.getElementById("cnt");if(el)el.textContent=--n;},1000);
      await new Promise(r=>setTimeout(r,sec*1000));
      clearInterval(t);
      return loadOverview(false);
    }
    _toCache(cacheKey,data);
    _lsSave(lsKey,data);
    renderOverview(data);
  }catch(e){
    grid.innerHTML=`<div class="error">❌ ${esc(e.message)}<br><small>장외시간이면 한투 API가 응답하지 않을 수 있습니다</small></div>`;
  }finally{btn.disabled=false;btn.textContent="↻ 새로고침";}
}

async function _refreshOverviewBg(){
  const modeAtStart=_heatmapMode;
  const cacheKey=_hmCacheKey(), lsKey=_hmLsKey();
  try{
    const r=await fetch(_hmUrl("/api/heatmap"));
    if(!r.ok)return;
    const data=await r.json();
    if(data.error||data.loading)return;  // 빌드 중이면 캐시 오염 방지
    _toCache(cacheKey,data);
    _lsSave(lsKey,data);
    if(activeTab==="all"&&_heatmapMode===modeAtStart) renderOverview(data);
  }catch(e){}
}

async function _refreshTabBg(tabId){
  try{
    const r=await fetch(`/api/heatmap_tab?id=${tabId}`);
    if(!r.ok)return;
    const data=await r.json();
    if(data.error||data.loading)return;  // 빌드 중이면 캐시 오염 방지
    _toCache(tabId,data);
    _lsSave(_LS_TAB_PFX+tabId,data);
    if(activeTab===tabId) renderTab(data);
  }catch(e){}
}

function renderOverview(data){
  _allTiles=data.sectors||[];

const TAB_LABELS={
  semi:"반도체",ship:"조선/LNG",def:"방산/우주",robot:"로봇",bio:"바이오",

};

async function loadTab(tabId,force=false){
  if(!force){
    // 메모리 캐시
    const cached=_fromCache(tabId);
    if(cached){ renderTab(cached); return; }
    // localStorage 즉시 렌더 후 백그라운드 갱신
    const prev=_lsLoad(_LS_TAB_PFX+tabId);
    if(prev){
      _toCache(tabId,prev);
      renderTab(prev);
      _refreshTabBg(tabId);
      return;
    }
  }
  const btn=document.getElementById("refresh-btn");
  btn.disabled=true; btn.textContent="로딩중…";
  const label=TAB_LABELS[tabId]||tabId;
  document.getElementById("main-title").textContent=`섹터 히트맵 — ${label}`;
  const grid=document.getElementById("grid");
  if(force) grid.innerHTML=`<div class="loading">📡 ${label} 갱신 중…</div>`;
  try{
    const url=force?`/api/heatmap_tab/refresh?id=${tabId}`:`/api/heatmap_tab?id=${tabId}`;
    const r=await fetch(url);
    if(!r.ok)throw new Error(`HTTP ${r.status}`);
    const data=await r.json();
    if(data.error)throw new Error(data.error);
    if(data.loading){
      const sec=data.retry_after||5;
      grid.innerHTML=`<div class="loading">⚙️ 서버 데이터 준비 중… <span id="cnt">${sec}</span>초 후 재시도</div>`;
      btn.disabled=false; btn.textContent="↻ 새로고침";
      let n=sec;
      const t=setInterval(()=>{const el=document.getElementById("cnt");if(el)el.textContent=--n;},1000);
      await new Promise(r=>setTimeout(r,sec*1000));
      clearInterval(t);
      return loadTab(tabId,false);
    }
    _toCache(tabId,data);
    _lsSave(_LS_TAB_PFX+tabId,data);
    renderTab(data);
  }catch(e){
    grid.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`;
  }finally{btn.disabled=false;btn.textContent="↻ 새로고침";}
}

// ── 즐겨찾기 관리 ──────────────────────────────────────────
function getFavs(){ try{ return JSON.parse(localStorage.getItem("favSectors")||"[]"); }catch{ return []; } }
function setFavs(arr){ localStorage.setItem("favSectors", JSON.stringify(arr)); }

// 타일 데이터 캐시 (새로고침 후에도 즐겨찾기 복원용)
function getFavCache(){ try{ return JSON.parse(localStorage.getItem("favTileCache")||"{}"); }catch{ return {}; } }
function setFavCache(obj){ localStorage.setItem("favTileCache", JSON.stringify(obj)); }

function toggleFav(name){
  const favs=getFavs();
  const cache=getFavCache();
  const idx=favs.indexOf(name);
  if(idx>=0){
    favs.splice(idx,1);
    delete cache[name];

let _lastTiles=[];
let _allTiles=[];   // 전체 탭 캐시 — 즐겨찾기 소스는 항상 이걸 씀

function renderTab(data){
  _lastTiles=data.tiles||[];

// 종목 행 + 수급 자리(비동기 채움)
function stockRowHtml(s){
  return `<div class="stock-row" data-code="${esc(s.code||"")}" data-name="${esc(s.name||"")}">
       <span class="stock-name">${esc(s.name)}</span>

     </div>

// ── 타일 종목 수급 (외인/기관/개인/프로그램) ───────────────
const _supCache={};            // {code:{data,ts}}
const _SUP_TTL=300000;         // 5분 (클라 캐시; 서버는 10분)
function _supLine(sup){
  if(!sup)return"";
  const cls=v=>v>0?"su":v<0?"sd":"sn";
  const cell=(k,v)=>`<span class="sp ${cls(v)}">${k} ${wlAmt(v)}</span>`;
  return cell("외",sup.외인)+cell("기",sup.기관)+cell("개",sup.개인)+cell("프",sup.프로그램);
}
function _applySupply(map){
  Object.entries(map).forEach(([code,sup])=>{
    _supCache[code]={data:sup,ts:Date.now()};
    document.querySelectorAll(`.stock-sup[data-supcode="${code}"]`).forEach(el=>{
      el.innerHTML=_supLine(sup);
    });
  });
}
function _visibleSupCodes(){
  // 상위3(더보기 밖)은 항상 / 더보기 안은 펼쳤을 때만. (빈 placeholder는 :empty로 display:none이라 offsetParent로 판별 불가)
  return [...document.querySelectorAll('#grid .stock-sup[data-supcode]')]
    .filter(el=>{
      if(!el.dataset.supcode) return false;
      const extra=el.closest('.stock-extra');
      if(extra && !extra.classList.contains('open')) return false;
      return true;
    })
    .map(el=>el.dataset.supcode);
}
async function fetchSupplyForCodes(codes){
  codes=[...new Set(codes.filter(Boolean))];
  for(let i=0;i<codes.length;i+=60){
    const chunk=codes.slice(i,i+60);
    try{
      const r=await fetch("/api/stock_supply_batch?codes="+encodeURIComponent(chunk.join(",")));
      const map=await r.json();
      if(map&&!map.error) _applySupply(map);
    }catch(e){}
  }
}
function refreshTileSupply(){
  const codes=_visibleSupCodes();
  if(!codes.length)return;
  const now=Date.now(), fresh={}, need=[];
  codes.forEach(c=>{const e=_supCache[c]; if(e&&now-e.ts<_SUP_TTL)fresh[c]=e.data; else need.push(c);});
  _applySupply(fresh);            // 캐시된 건 즉시 표시
  if(need.length) fetchSupplyForCodes(need);
}

function renderGrid(tiles){
  const grid=document.getElementById("grid");
  const favs=getFavs();
  const isFavTab=(activeTab==="fav");
  // 즐겨찾기 탭: _allTiles에서 필터 + 없으면 localStorage 캐시로 보완
  let toShow;
  if(isFavTab){
    const cache=getFavCache();
    toShow=favs.map(name=>_allTiles.find(t=>t.name===name)||cache[name]).filter(Boolean);
  } else {
    toShow=tiles;
  }

  // 섹터 타일: 등락률 내림차순 정렬 (데이터 없는 것은 맨 뒤)
  toShow=[...toShow].sort((a,b)=>{
    const ae=a.stocks.length===0, be=b.stocks.length===0;
    if(ae&&be) return 0;
    if(ae) return 1;
    if(be) return -1;
    return b.avg_rate - a.avg_rate;
  });

  grid.innerHTML="";
  if(isFavTab && toShow.length===0){
    grid.innerHTML=`<div style="grid-column:1/-1;padding:40px;text-align:center;color:#555;font-size:14px">
      ⭐ 섹터 타일의 ★을 클릭하면 즐겨찾기에 추가됩니다
    </div>`;
    return;
  }
  for(const tile of toShow){
    const cls=tile.stocks.length===0?"empty":rateToBg(tile.avg_rate);
    const avgStr=tile.stocks.length===0?"—":rateStr(tile.avg_rate);
    const parentHtml=tile.parent?`<span class="parent-badge">${esc(tile.parent)}</span>`:"";
    const isFav=favs.includes(tile.name);
    // 섹터 내 종목 등락률 내림차순, 상위 3개만 표시
    const sortedStocks=[...tile.stocks].sort((a,b)=>b.change_rate-a.change_rate);
    const topStocks=sortedStocks.slice(0,3);
    const extraStocks=sortedStocks.slice(3);
    const moreCount=extraStocks.length;
    const extraHtml=extraStocks.map(stockRowHtml).join("");
    const stocksHtml=topStocks.map(stockRowHtml).join("")
      +(moreCount>0?`<div class="stock-more" data-count="${moreCount}">+${moreCount}개 더보기</div><div class="stock-extra">${extraHtml}</div>`:"")
    const el=document.createElement("div");
    el.className=`tile ${cls}`;
    // 스파크라인: 등락률(%) 바로 옆에 인라인 배치
    const barsInline=(tile.bars&&tile.bars.length>=2)?
      `<span class="avg-spark">${sparkline(tile.bars,tile.avg_rate)}</span>`
      :`<span class="avg-spark no-chart">―</span>`;
    el.innerHTML=`<div class="sec-name">${esc(tile.disp||tile.name)}${parentHtml}<span class="sec-edit-btn" data-secedit="${esc(tile.name)}" title="종목 추가/삭제·이름변경">✎</span><span class="sec-del-btn" data-secdel="${esc(tile.name)}" title="전체에서 삭제(편집탭서 복원)">✕</span></div>
      <div class="avg-row">
        <span class="avg-rate">${avgStr}</span>${barsInline}
        <button class="fav-btn${isFav?" on":""}" data-sector="${esc(tile.name)}" title="즐겨찾기" style="margin-left:auto">★</button>
      </div>
      <div class="stocks">${stocksHtml}</div>`;
    grid.appendChild(el);
  }
  refreshTileSupply();   // 보이는 종목(상위3) 수급 채우기
}

// ── ETF 바 ────────────────────────────────────────────────
function sparkline(bars,rate){
  const W=64,H=28;
  const pts_data = (bars && bars.length>=2) ? bars : null;
  if(!pts_data)return`<svg width="${W}" height="${H}"></svg>`;
  const mn=Math.min(...pts_data),mx=Math.max(...pts_data);
  const range=mx-mn||1;
  const xs=pts_data.map((_,i)=>Math.round(i*(W-4)/(pts_data.length-1))+2);
  const ys=pts_data.map(v=>Math.round(H-4-((v-mn)/range)*(H-8))+2);
  const pts=xs.map((x,i)=>`${x},${ys[i]}`).join(" ");
  const col=rate>0?"#e74c3c":rate<0?"#3498db":"#666";
  const lx=xs[xs.length-1],ly=ys[ys.length-1];
  return`<svg width="${W}" height="${H}" style="overflow:visible">
    <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/>
    <circle class="blink-dot" cx="${lx}" cy="${ly}" r="2.5" fill="${col}"/>
  </svg>`;
}
function shortETFName(n){
  return n.replace("KODEX ","").replace("TIGER ","").replace("HANARO ","")
          .replace("액티브","").replace("iSelect","").trim();
}
const _ETF_CACHE_KEY="etf_cache_v2";
const _ETF_CACHE_TTL=300000;

function _fmtAsof(ts){
  if(!ts)return"";
  const d=new Date(ts*1000);
  const mm=d.getMonth()+1,dd=d.getDate();
  const hh=String(d.getHours()).padStart(2,"0"),mi=String(d.getMinutes()).padStart(2,"0");
  return`${mm}/${dd} ${hh}:${mi} 종가`;
}
function _renderEtfBar(etfs,staleInfo){
  if(!Array.isArray(etfs)||etfs.length===0)return;
  // 상승률 내림차순 정렬 (왼쪽=가장 강한 섹터)
  const sorted=etfs.slice().sort((a,b)=>(Number(b.change_rate)||0)-(Number(a.change_rate)||0));
  const asofLabel=(staleInfo&&staleInfo.stale&&staleInfo.asof)?` <span style="color:#888;font-size:10px;font-weight:400;">(${_fmtAsof(staleInfo.asof)})</span>`:"";
  const title=`<div class="etf-title">ETF${asofLabel}</div>`;
  document.getElementById("etf-bar").innerHTML=title+sorted.map(e=>{
    const rc=e.change_rate>0?"up":e.change_rate<0?"dn":"neu";
    const rs=(e.change_rate>0?"+":"")+(e.change_rate||0).toFixed(2)+"%";
    return`<div class="etf-chip" onclick="etfExpand('${e.code}','${esc(shortETFName(e.name))}',this)" title="클릭 → 편입종목·수급빈집">
      <span class="etf-name">${esc(shortETFName(e.name))}</span>
      <span class="etf-rate ${rc}">${rs}</span>
      ${sparkline(e.bars,e.change_rate)}
    </div>`;
  }).join("");
}

// ── ETF칩 클릭 → 편입종목(수급빈집순) 펼침 ──
let _etfPopCode=null;
function _etfPop(){
  let p=document.getElementById("etf-pop");
  if(!p){
    p=document.createElement("div"); p.id="etf-pop"; document.body.appendChild(p);
    document.addEventListener("mousedown",ev=>{
      if(p.classList.contains("open") && !p.contains(ev.target) && !ev.target.closest(".etf-chip")) _etfPopClose();
    });
    window.addEventListener("resize",_etfPopClose);
    window.addEventListener("scroll",_etfPopClose,{passive:true});   // 페이지 스크롤 시 닫기
  }
  return p;
}
function _etfPopClose(){
  const p=document.getElementById("etf-pop"); if(p)p.classList.remove("open");
  _etfPopCode=null;
  document.querySelectorAll(".etf-chip.active").forEach(c=>c.classList.remove("active"));
}
function etfExpand(code, name, chip){ openSectorDetail({etf:code, title:name, anchor:chip}); }

// 섹터 상세 팝오버: 섹터뉴스 + 빈집종목 + 종목뉴스(펼침). ETF칩·히트맵타일 공용
function openSectorDetail({etf, codes, names, title, anchor}){
  _nfStyle();
  const p=_etfPop();
  const key = etf?("etf:"+etf):("codes:"+(codes||[]).join(","));
  if(_etfPopCode===key && p.classList.contains("open")){ _etfPopClose(); return; }
  _etfPopCode=key;
  document.querySelectorAll(".etf-chip.active").forEach(c=>c.classList.remove("active"));
  if(anchor && anchor.classList && anchor.classList.contains("etf-chip")) anchor.classList.add("active");
  const r=(anchor||document.body).getBoundingClientRect();
  const top=Math.min(r.bottom+4, Math.round(window.innerHeight*0.5));
  p.style.left=Math.max(6,Math.min(r.left, window.innerWidth-432))+"px";
  p.style.top=top+"px";
  p.style.maxHeight=(window.innerHeight-top-12)+"px";
  p.style.overflowY="auto";
  p.innerHTML=`<div class="ep-hd">${esc(title||"")} <small>불러오는 중…</small></div>`;
  p.classList.add("open");
  const q = etf?("etf="+encodeURIComponent(etf)):("codes="+encodeURIComponent((codes||[]).join(",")));
  fetch("/api/sector_detail?"+q+"&title="+encodeURIComponent(title||"")).then(r=>r.json()).then(d=>{

function _mdMini(s){
  const lines=String(s||"").split(/\n/).map(l=>l.trim()).filter(Boolean);
  let html="", inList=false;
  for(let ln of lines){
    ln=esc(ln).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
    if(/^[-•]\s*/.test(ln)){ if(!inList){html+="<ul>";inList=true;} html+="<li>"+ln.replace(/^[-•]\s*/,"")+"</li>"; }
    else { if(inList){html+="</ul>";inList=false;} html+="<div class='ep-sum-line'>"+ln+"</div>"; }
  }
  if(inList)html+="</ul>";
  return html;
}

async function loadEtfBar(){
  // B: localStorage 캐시 즉시 표시 (신선하면 정상표기, 오래됐어도 일단 보여주고 라이브 fetch로 갱신 시도)
  let hadCache=false;
  try{
    const raw=localStorage.getItem(_ETF_CACHE_KEY);
    if(raw){
      const {ts,data,stale,asof}=JSON.parse(raw);
      const fresh=Date.now()-ts<_ETF_CACHE_TTL;
      _renderEtfBar(data, fresh?null:{stale:true, asof:asof||ts/1000});
      hadCache=true;
    }
  }catch(_){}
  try{
    const r=await fetch("/api/etf_bar");
    const stale=r.headers.get("X-Etf-Stale")==="1";
    const asof=parseFloat(r.headers.get("X-Etf-Asof")||"0")||null;
    const etfs=await r.json();
    if(!Array.isArray(etfs) || !etfs.length) return;  // 빈/오류 응답 → 직전 렌더 유지(그래프 사라짐 방지)
    _renderEtfBar(etfs, stale?{stale:true, asof}:null);
    try{localStorage.setItem(_ETF_CACHE_KEY,JSON.stringify({ts:Date.now(),data:etfs,stale,asof}));}catch(_){}
  }catch(e){
    // 네트워크 오류(타임아웃 등) — 위에서 이미 캐시를 못 그렸다면(hadCache=false) 최소한의 안내라도 표시

    }
  }
}

function fmtAuk(v){
  const bok=v/100;  // 백만원 → 억원
  const abs=Math.abs(bok);
  if(abs>=10000) return (bok/10000).toFixed(1)+"조";
  if(abs>=1)     return Math.round(bok)+"억";
  return Math.round(v)+"백만";
}

function miniLine(bars, rate, w, h){
  w=w||240; h=h||42;
  if(!bars||bars.length<2){
    return`<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;width:100%;height:${h}px">
      <text x="${w/2}" y="${h/2+4}" fill="#333" font-size="10" text-anchor="middle">장 외 시간</text>
    </svg>`;
  }
  // bars: [{"t":"HHMMSS","price":...}] (실제 체결시각 포함) 또는 구형 숫자배열 — 둘 다 지원
  const vals=bars.map(b=>typeof b==="number"?b:Number(b.price||0));
  const times=bars.map(b=>typeof b==="object"?b.t:null);
  const mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
  // x좌표: 실제 체결시각을 09:00~15:30 고정축에 매핑 (시각 없으면 인덱스 균등분할로 폴백)
  const xsRaw=times.map(t=>_sessionX(t,w));
  const hasTimeB=xsRaw.some(x=>x!==null);
  const xs=hasTimeB
    ? xsRaw.map((x,i)=>x!==null?x:Math.round(2+i*(w-4)/(vals.length-1)))
    : vals.map((_,i)=>Math.round(2+i*(w-4)/(vals.length-1)));
  const ys=vals.map(v=>Math.round(2+(1-((v-mn)/range))*(h-4)));
  const pts=xs.map((x,i)=>`${x},${ys[i]}`).join(" ");
  const col=rate>0?"#e74c3c":rate<0?"#3498db":"#666";
  const fillPts=`${xs[0]},${h} ${pts} ${xs[xs.length-1]},${h}`;
  // 시간 눈금: 왼쪽 09:00 고정, 오른쪽 현재시각(동적, 15:30까지 진행)
  const timeRow=`<div style="display:flex;justify-content:space-between;margin-top:2px">
    <span style="font-size:9px;color:#999">09:00</span>
    <span style="font-size:9px;color:#999">${_fmtMin(_sessionEndMin)}</span>
  </div>`;
  // 종가 깜빡임: 마지막 점 위치(%)에 HTML 점 오버레이 (SVG 늘어남 무관하게 원형 유지)
  const lxp=(xs[xs.length-1]/w*100).toFixed(1), lyp=(ys[ys.length-1]/h*100).toFixed(1);
  return`<div>
    <div style="position:relative">
      <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;width:100%;height:${h}px;border-radius:4px;overflow:hidden">
        <polygon points="${fillPts}" fill="${col}" opacity="0.07"/>
        <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.8" stroke-linejoin="round"/>
      </svg>
      <span class="px-blink" style="left:${lxp}%;top:${lyp}%;background:${col};box-shadow:0 0 5px ${col}"></span>
    </div>
    ${timeRow}
  </div>`;
}

function divBar(val, maxAbs){

// 축: 왼쪽=09:00 고정, 오른쪽=현재(마지막 데이터) 시각(동적, 15:30 상한).
// 시간이 지날수록 _sessionEndMin이 커져 그래프가 오른쪽으로 늘어나며 항상 폭을 꽉 채운다.
const _SESSION_OPEN_MIN=9*60, _SESSION_MAX_MIN=15*60+30;
let _sessionEndMin=_SESSION_MAX_MIN;   // renderMarketFlow에서 매 렌더마다 실데이터 최신시각으로 갱신
function _fmtMin(m){return `${String(Math.floor(m/60)).padStart(2,'0')}:${String(m%60).padStart(2,'0')}`;}
function _sessionX(hhmm, w){
  const digits=String(hhmm||"").replace(/[^0-9]/g,"");
  if(digits.length<4) return null;
  const mins=parseInt(digits.slice(0,2),10)*60+parseInt(digits.slice(2,4),10);
  const span=Math.max(1,_sessionEndMin-_SESSION_OPEN_MIN);
  const clamped=Math.max(_SESSION_OPEN_MIN,Math.min(_sessionEndMin,mins));
  return 2+((clamped-_SESSION_OPEN_MIN)/span)*(w-4);
}
function _sessionMins(t){const d=String(t||"").replace(/[^0-9]/g,"");return d.length<4?null:parseInt(d.slice(0,2),10)*60+parseInt(d.slice(2,4),10);}
// 누적 순매수/프로그램은 장시작 09:00에 값이 0(아직 거래 전). 첫 실데이터가 09:05 이후면
// 09:00=0 기준점을 앞에 붙여 그래프를 왼쪽(09:00)에 앵커한다(서버가 장중 재시작돼 앞부분이
// 비어도 '09:00부터 현재까지' 큰그림이 그려짐). 정상 가동(09:00부터 폴링) 시엔 seed가 안 붙는다.
function _seedOpen(arr, zeroObj){
  if(!arr||!arr.length) return arr;
  const m=_sessionMins(arr[0].ts||arr[0].t);
  return (m!==null && m>545) ? [zeroObj, ...arr] : arr;
}

function invHistoryChart(history, w, h){
  if(!history||history.length<1) return "";
  const single=history.length===1;
  if(single) history=[history[0],history[0]]; // 단일 포인트 → 수평선
  w=w||240; h=h||44;
  const keys=["외인","기관","개인"];
  const cols={"외인":"#e8a030","기관":"#2ecc71","개인":"#888"};
  // x좌표: 인덱스 균등분할이 아니라 09:00~15:30 고정 장중축 위의 실제 시각으로 매핑 (큰그림 고정)
  const xs=history.map(r=>_sessionX(r.ts,w));
  const hasTime=xs.some(x=>x!==null);
  const xsFinal=hasTime
    ? xs.map((x,i)=>x!==null?x:Math.round(2+i*(w-4)/(history.length-1)))
    : history.map((_,i)=>Math.round(2+i*(w-4)/(history.length-1)));
  const lines=keys.map(key=>{
    const vals=history.map(r=>Number(r[key]||0));
    const mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn;
    // range=0(모두 동일값)이면 중앙에 수평선
    const ys=vals.map(v=>range===0?Math.round(h/2):Math.round(2+(1-((v-mn)/range))*(h-4)));
    const pts=xsFinal.map((x,i)=>`${x},${ys[i]}`).join(" ");
    return`<polyline points="${pts}" fill="none" stroke="${cols[key]}" stroke-width="1.4" opacity=".9"/>`;
  }).join("");
  // 레전드는 SVG 밖 HTML로 (SVG stretch 시 텍스트 찌그러짐 방지)
  const legendHtml=keys.map(k=>`<span style="display:inline-flex;align-items:center;gap:3px">
    <span style="display:inline-block;width:10px;height:2px;background:${cols[k]};border-radius:1px;vertical-align:middle"></span>
    <span style="font-size:9px;color:${cols[k]}">${k}</span>
  </span>`).join("");
  // X축 시간 레이블: 왼쪽 09:00 고정, 오른쪽 현재시각(동적)
  const timeBar=`<div style="display:flex;justify-content:space-between;margin-top:2px">
    <span style="font-size:11px;color:#888">09:00</span>
    <span style="font-size:11px;color:#888">${_fmtMin(_sessionEndMin)}</span>
  </div>`;
  return`<div>
    <svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;width:100%;height:${h}px">
      <rect width="${w}" height="${h}" fill="#0e0e0e" rx="3"/>
      ${lines}
    </svg>
    ${timeBar}
    <div style="display:flex;gap:10px;margin-top:2px">${legendHtml}</div>
  </div>`;
}

function _makeSampleHistory(initVals, trends, n=14){
  // initVals: {외인,기관,개인} or {합계,차익,비차익}
  // trends: 각 키 per-step 증분 범위 [min,max]
  const keys=Object.keys(initVals);
  const result=[];
  const cur={...initVals};
  const times=[];
  for(let h=9,m=30;times.length<n;){m+=15;if(m>=60){m-=60;h++;}times.push(`${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`)}
  for(let i=0;i<n;i++){
    const snap={ts:times[i]};
    keys.forEach(k=>{
      const [lo,hi]=trends[k];
      cur[k]+=Math.round(lo+(hi-lo)*Math.random());
      snap[k]=cur[k];
    });
    result.push(snap);
  }
  return result;
}

function renderCandles(bars, W, H){
  if(!bars || bars.length<2) return `<div style="color:#666;font-size:11px;">데이터 없음</div>`;
  const highs=bars.map(b=>b.h), lows=bars.map(b=>b.l);

    const yh=y(b.h).toFixed(1), yl=y(b.l).toFixed(1);
    const yo=y(b.o), yc=y(b.c);
    const bodyTop=Math.min(yo,yc), bodyH=Math.max(1,Math.abs(yo-yc));
    return `<line x1="${cx.toFixed(1)}" y1="${yh}" x2="${cx.toFixed(1)}" y2="${yl}" stroke="${col}" stroke-width="1"/>`+
           `<rect x="${(cx-bodyW/2).toFixed(1)}" y="${bodyTop.toFixed(1)}" width="${bodyW.toFixed(1)}" height="${bodyH.toFixed(1)}" fill="${col}"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;width:100%;height:${H}px;overflow:visible">${parts}</svg>`;
}

function _charBigrams(s){
  const set=new Set();
  const t=(s||"").replace(/\s+/g,"");
  for(let i=0;i<t.length-1;i++) set.add(t.slice(i,i+2));
  return set;
}
function _bigramSim(a,b){
  const A=_charBigrams(a), B=_charBigrams(b);
  if(!A.size||!B.size) return 0;
  let inter=0;
  for(const g of A) if(B.has(g)) inter++;
  return inter/(A.size+B.size-inter);
}
const _TIMELINE_START="07:30";
const _TIMELINE_DUP_SIM=0.28;    // 이 이상이면 사실상 같은 문장 → 제거(중복 완화 위해 하향)
const _TIMELINE_THEME_SIM=0.16;  // 이 이상이면 같은 테마(다른 각도) → 뉴스는 대표1개만 노출
function _dedupBySim(list){
  const kept=[];
  for(const item of list){
    if(kept.some(k=>_bigramSim(k.text,item.text)>=_TIMELINE_DUP_SIM))continue;
    kept.push(item);
  }
  return kept;
}
function _buildTimeline(){
  // 뉴스: 출처 있는 것만(출처 없는 AI요약=신뢰 안 감 → 타임라인서 제외). 섹터 필수.
  const news=(_briefingItems||[]).filter(it=>it.ts>=_TIMELINE_START && (it.source||"").trim() && (it.sector||"").trim())
    .map(it=>({ts:it.ts, text:it.headline, body:it.body||"", type:"news", severity:it.severity, sector:(it.sector||"").trim(), source:it.source||"", stock:it.stock||"", pct:it.pct||0, important:!!it.important}));
  const tps=((_marketInsight&&_marketInsight.turning_points)||[]).filter(t=>t.ts>=_TIMELINE_START)
    .map(t=>({ts:t.ts, text:t.label, body:"", type:(t.type==="circulation"?"circulation":"event"), major:t.major}));

  // 같은 종목(없으면 문장키) 뉴스는 한 카드로 통합 → 최신것만 보이고 예전건 "+N번 더"(펼치면 보임)
  const groups={};
  for(const it of news){
    const k=it.stock || it.text;
    (groups[k]=groups[k]||[]).push(it);
  }
  const stockReps=Object.values(groups).map(arr=>{
    arr.sort((a,b)=>b.ts.localeCompare(a.ts));   // 최신 우선
    const rep={...arr[0]};                        // 최신 뉴스를 대표로
    if(arr.length>1) rep.extra=arr.length-1;      // 같은 종목 예전건 접기
    return rep;
  });
  // 같은 사건(테마)이 여러 종목에 걸쳐 중복(예: 잠수함 불발 = 한화오션·한화시스템·HD현대중공업)
  // → 테마 클러스터로 묶어 대표 1개(중요>상승률>최신)만 노출, 나머지는 "+N번 더"
  const themeCl=[];
  for(const it of stockReps){
    const cl=themeCl.find(c=>c.items.some(x=>_bigramSim(x.text,it.text)>=_TIMELINE_THEME_SIM));
    if(cl) cl.items.push(it); else themeCl.push({items:[it]});
  }
  const newsCapped=themeCl.map(cl=>{
    cl.items.sort((a,b)=>((b.important?1:0)-(a.important?1:0)) || ((b.pct||0)-(a.pct||0)) || b.ts.localeCompare(a.ts));
    const rep={...cl.items[0]};
    const extra=(cl.items.length-1)+cl.items.reduce((s,x)=>s+(x.extra||0),0);
    if(extra>0) rep.extra=extra;
    return rep;
  });
  // 이벤트(시장상황): 완전 동일 문장만 dedup, 테마당 카드 수는 자르지 않는다.
  // (타임라인이라 8개는 채워야 함 — 전체 노출 개수는 아래 _TIMELINE_PREVIEW_N 8개
  // 초과시 접기(펼치기 버튼)로만 제어)
  const evDedup=_dedupBySim(tps.sort((a,b)=>a.ts.localeCompare(b.ts)));
  const eventsKept=evDedup.sort((a,b)=>b.ts.localeCompare(a.ts));   // 최신 우선

  const all=[...newsCapped, ...eventsKept];
  // 중요 뉴스는 맨앞 고정, 그 외엔 최신순(내림차순)
  all.sort((a,b)=>((b.important?1:0)-(a.important?1:0)) || b.ts.localeCompare(a.ts));
  return all;
}

  const _TIMELINE_PREVIEW_N=8;
  // 원본 인덱스(i) 유지 — 상세보기·선택 로직이 merged items 인덱스를 참조
  const mkCard=(it,i,isLatest)=>{
      const isCirc=it.type==="circulation";
      const isEvent=it.type==="event"||isCirc;   // 순환매도 시장상황(이벤트) 스타일 공유
      const sev=isEvent?"sev-event":it.severity==="red"?"sev-red":it.severity==="yellow"?"sev-yellow":"sev-gray";
      const expandable=!!it.body;
      const selected=_selectedTimelineIdx===i;

      const emoji=isCirc?"🔄":(isEvent?(it.major?"⭐":"📍"):(it.severity==="red"?"🔴":it.severity==="yellow"?"🟡":"⚪"));
      return `<div class="tl-card ${sev} ${isEvent?"tl-event":"tl-news"}${isLatest?" tl-latest":""}${selected?" tl-selected":""}"
        ${expandable?`onclick="toggleTimelineSelect(${i})"`:""}>
        ${it.important?`<span class="tl-imp-badge">🔥 중요</span>`:(isLatest?`<span class="tl-latest-badge">NEW</span>`:"")}
        <div class="tl-ts">${/^\d{1,2}:\d{2}$/.test(it.ts)?esc(it.ts):""}${(!isEvent&&it.sector)?` <span class="tl-sec">${esc(it.sector)}</span>`:""}${(!isEvent&&it.stock)?`<span class="tl-stock">${esc(it.stock)}</span>`:""}${(!isEvent&&it.source)?`<span class="tl-src">${esc(it.source)}</span>`:""}</div>
        <div class="tl-head">${emoji} ${esc(it.text)}${extraTag}</div>
      </div>`;
  };
  // 시장상황(이벤트) / 뉴스이슈 두 갈래로 분리
  const mkt=[], nws=[];
  items.forEach((it,i)=>{ ((it.type==="event"||it.type==="circulation")?mkt:nws).push({it,i}); });
  const selectedItem=(_selectedTimelineIdx!=null)?items[_selectedTimelineIdx]:null;
  const timelineDetail=(selectedItem&&selectedItem.body)
    ?`<div class="tl-detail">${selectedItem.sector?`<span class="tl-sec">${esc(selectedItem.sector)}</span> `:""}<span class="tl-detail-ts">${esc(selectedItem.ts)}</span> ${esc(selectedItem.text)}
      <div class="bi-body">${esc(selectedItem.body)}</div></div>`
    :"";
  const strip=(title,emoji,id,list)=>{
    const collapsed=_collapsedCards.has(id);
    const cards=list.map((x,idx)=>mkCard(x.it,x.i,idx===0));   // 각 스트립 맨앞=최신=NEW
    const more=Math.max(0,cards.length-_TIMELINE_PREVIEW_N);
    const body=cards.length
      ?(collapsed?cards.slice(0,_TIMELINE_PREVIEW_N):cards).join("")
      :(_briefingLoaded?`<div style="color:#888;font-size:12px;padding:8px;">아직 없음</div>`
                       :`<div style="color:#888;font-size:12px;padding:8px;">불러오는 중...</div>`);
    return `<div class="mkt-card" style="min-width:0;">
      <div class="card-hd" style="font-size:15px;font-weight:700;color:#ddd;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;">
        <span>${emoji} ${title}</span>
        <span class="card-fold-btn" onclick="toggleCardCollapse('${id}')">${collapsed?(more>0?`▶ 펼치기 (+${more})`:""):"▼ 접기"}</span>
      </div>
      <div class="timeline-strip ${collapsed?"tl-strip-fill":"tl-strip-wrap"}">${body}</div>
    </div>`;
  };
  // 위=시장상황, 아래=뉴스이슈 (컨테이너가 flex-row라 column으로 감싸 위/아래 배치)
  container.innerHTML=`<div style="display:flex;flex-direction:column;gap:10px;width:100%;min-width:0;">
    ${strip("시장상황 타임라인","🕐","tl_market",mkt)}
    ${strip("뉴스이슈 타임라인","📰","tl_news",nws)}
    ${timelineDetail}
  </div>`;
}
