function renderMarketFlow(d){
  try{
    _lastMarketFlowData=d;
    const panel=document.getElementById("mkt-panel");
    // 오른쪽 끝 = 코스피/코스닥 데이터의 마지막(현재) 시각. 시간 지날수록 커져 15:30까지 진행.
    (function(){
      let mx=_SESSION_OPEN_MIN+30;   // 최소 09:30 폭(초반 너무 좁지 않게)
      const grab=t=>{const g=String(t||"").replace(/[^0-9]/g,"");
        if(g.length>=4){const mm=parseInt(g.slice(0,2),10)*60+parseInt(g.slice(2,4),10);
          if(mm>=_SESSION_OPEN_MIN&&mm<=_SESSION_MAX_MIN&&mm>mx)mx=mm;}};
      ["0001","1001"].forEach(c=>{const m=d[c];if(!m)return;
        (m.bars||[]).forEach(b=>grab(b&&b.t));
        (m.investor_history||[]).forEach(x=>grab(x&&x.ts));
        (m.program_history||[]).forEach(x=>grab(x&&x.ts));
        (m.program_series||[]).forEach(x=>grab(x&&x.t));});
      // 장중(평일 09:00~15:35)엔 오른쪽 끝을 '현재 벽시계 시각'으로 제한.
      // grab()은 분(minute-of-day)만 비교하는데, KIS comp-program-trade-today가 장초반에
      // 직전 세션(≈15:30) 버킷을 잠깐 돌려주면 그 값이 최댓값이 돼 오른쪽 끝이 15:30으로 튀고
      // 오늘 데이터가 좌측 일부 구간에 뭉개지던 '장시작 차트 깨짐' 버그를 차단한다.
      // (저녁·주말 동결 표시는 그대로 직전 세션 15:30까지 꽉 채워야 하므로 장중에만 적용)
      const _n=new Date(),_nm=_n.getHours()*60+_n.getMinutes(),_dow=_n.getDay();
      if(_dow>=1&&_dow<=5&&_nm>=_SESSION_OPEN_MIN&&_nm<=_SESSION_MAX_MIN+5)
        mx=Math.min(mx,Math.max(_SESSION_OPEN_MIN+30,_nm));
      _sessionEndMin=Math.min(_SESSION_MAX_MIN,mx);
    })();
    panel.innerHTML=["0001","1001","global","rank_popular","briefing"].map(code=>{
      const m=d[code]; if(code!=="briefing" && !m)return"";

      // ── 실시간 시장 브리핑 카드 (헤드라인+본문만, 뉴스/탑픽은 mkt-below-panel로 분리) ──
      if(code==="briefing"){
        const briefingExpanded=_topPreviewExpanded.has("briefing");
        const insightParts=(()=>{
          const ins=_marketInsight;
          if(!ins)return null;
          // 신규 shape(verdict/narrative/turning_points) 우선
          if(ins.verdict){
            const v=ins.verdict||{};
            const stale=(ins.session_phase==="weekend"||ins.session_phase==="closed");
            const staleTag=stale?` <span style="color:#888;font-size:11px;font-weight:400;">(지난 장 기준)</span>`:"";
            const narrHtml=_mdMini(ins.narrative||"");
            const tps=(ins.turning_points||[]).map(t=>
              `<div style="color:#999;font-size:12px;padding:1px 0;"><span style="color:#ccc;">${esc(t.ts||"")}</span> ${esc(t.label||"")}${t.major?' <span style="color:#d4af37;">★</span>':''}</div>`
            ).join("");
            const verdictLine=`<div style="font-size:15px;font-weight:700;color:#e8c96a;margin-bottom:6px;">${esc(v.tone||"")} · ${esc(v.line||"")}<span style="color:#888;font-size:11px;font-weight:400;margin-left:6px;">${esc(v.ts||"")}${staleTag}</span></div>`;
            // 접힌 상태에도 narrative(짧은 문단 1~2개)까지 보여줘서 한줄 요약보다 풍부하게 —
            // 전환점(turning_points)만 "더보기"로 뺀다.
            const preview=`${verdictLine}<div class="mi-body">${narrHtml}</div>`;
            const extra=tps?`<div style="color:#aaa;font-size:12px;font-weight:600;margin:8px 0 4px;">오늘의 전환점</div>${tps}`:"";
            return {preview, extra};
          }
          // 구 shape 폴백(headline/body)
          const headline=ins.headline||"";
          const bodyRaw=ins.body||ins.comment||"";
          const paragraphs=bodyRaw.split(/\n\s*\n/).map(p=>p.trim()).filter(Boolean);
          const bodyHtml=paragraphs.map(p=>`<div class="mi-para">${esc(p)}</div>`).join("");
          const preview=headline?`<div class="mi-headline">${esc(headline)}</div>`:"";
          return {preview, extra:`<div class="mi-body">${bodyHtml}</div>`};
        })();
        const bodyHtml=insightParts
          ? `<div class="mkt-insight" style="margin-bottom:0;">${insightParts.preview}${briefingExpanded?insightParts.extra:""}</div>`
          : `<div style="color:#888;font-size:13px;padding:8px;">${_briefingLoaded?"아직 브리핑 없음":"불러오는 중..."}</div>`;
        const briefingAlignSelf=briefingExpanded?"":"align-self:flex-start;";
        return `<div class="mkt-card" style="flex:1;min-width:0;${briefingAlignSelf}">
          <div style="font-size:15px;font-weight:700;color:#ddd;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;">
            <span>📡 실시간 브리핑</span>${insightParts&&insightParts.extra?_foldBtn("briefing"):""}
          </div>
          ${bodyHtml}
        </div>`;
      }

      // ── 글로벌 지표 카드 ──
      if(code==="global"){
        const globalExpanded=_topPreviewExpanded.has("global");
        const allItems=m.items||[];
        const _GLOBAL_PREVIEW_N=3;   // 차트 있는 선물 3종만 미리보기, 환율·유가는 더보기
        const visibleItems=globalExpanded?allItems:allItems.slice(0,_GLOBAL_PREVIEW_N);
        const total=visibleItems.length;
        const rows=visibleItems.map((it,idx)=>{
          const noData=(!it.price&&!it.change_rate);
          const rc=noData?"neu":it.change_rate>0?"up":it.change_rate<0?"dn":"neu";
          const rs=noData?"—":(it.change_rate>0?"▲ +":it.change_rate<0?"▼ ":"")+Number(it.change_rate).toFixed(2)+"%";
          const ps=noData?"—":Number(it.price).toLocaleString("ko-KR",{maximumFractionDigits:2});
          const chartBars=(_barTF==="1d"?it.bars_1d:_barTF==="15m"?it.bars_15m:it.bars_1m)||it.bars;
          const hasChart=chartBars&&chartBars.length>=2;
          const borderB=idx<total-1?"border-bottom:1px solid #1a1a1a;":"";
          if(hasChart){
            const svgLine=(()=>{
              const bars=chartBars; const rate=it.change_rate;
              const W=240,H=32;
              if(_isOhlcBars(bars)) return renderCandles(bars,W,H);
              const vals=bars.map(b=>typeof b==="number"?b:(b.close||b.price||0));
              const mn=Math.min(...vals),mx=Math.max(...vals),rng=mx-mn||1;
              const pts=vals.map((v,i)=>`${Math.round(i/(vals.length-1)*(W-2)+1)},${Math.round((1-(v-mn)/rng)*(H-4)+2)}`).join(" ");
              const col=rate>0?"var(--up1)":rate<0?"var(--dn1)":"#888";
              const n=vals.length;
              // 글로벌 지표(나스닥선물·유가·환율 등)는 각기 다른 시간대(24시간 등)에 거래되고
              // bars에 실제 체결시각이 없어, 09:00~15:30 시간 레이블은 근거 없는 추정이라 표시 안 함.
              const gTimeRow="";
              const _lx=((Math.round((n-1)/(n-1||1)*(W-2)+1))/W*100).toFixed(1);
              const _ly=(((1-(vals[n-1]-mn)/rng)*(H-4)+2)/H*100).toFixed(1);
              const _dotcol=rate>0?"#e74c3c":rate<0?"#3498db":"#888";
              return`<div style="position:relative"><svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;width:100%;height:${H}px;overflow:visible">
                <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.5" stroke-linejoin="round"/>
              </svg><span class="px-blink" style="left:${_lx}%;top:${_ly}%;background:${_dotcol};box-shadow:0 0 5px ${_dotcol}"></span></div>${gTimeRow}`;
            })();
            return`<div style="flex:3;min-height:0;display:flex;flex-direction:column;${borderB}padding:4px 0 3px;">
              <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:2px">
                ${_globalNameHtml(it)}
                <div style="text-align:right"><div class="global-price">${ps}</div><div class="global-rate ${rc}">${rs}</div></div>
              </div>
              <div style="flex:1;min-height:0">${svgLine}</div>
            </div>`;
          } else {
            return`<div style="flex:1.5;min-height:0;display:flex;align-items:center;justify-content:space-between;${borderB}padding:3px 0;">
              ${_globalNameHtml(it)}
              <div style="text-align:right"><div class="global-price">${ps}</div><div class="global-rate ${rc}">${rs}</div></div>
            </div>`;
          }
        }).join("");
        return`<div class="mkt-card">
          <div style="font-size:11px;font-weight:700;color:#aaa;margin-bottom:4px;letter-spacing:0.3px;display:flex;justify-content:space-between;align-items:center;">
            <span>글로벌 지표 ${_barTFButtons()}</span>${allItems.length>_GLOBAL_PREVIEW_N?_foldBtn("global"):""}
          </div>
          <div style="flex:1;min-height:0;display:flex;flex-direction:column">${rows}</div>
        </div>`;
      }

      // ── 순위 카드 (인기검색 + 거래대금) ──
      if(code==="rank_popular"){
        _rankPopStocks=m.stocks||[];
        _rankAmtStocks=(d["rank_amt"]||{}).stocks||[];
        return renderRankCard();
      }

      // ── 코스피 / 코스닥 풀 카드 ──
      const idxCardId=code==="0001"?"kospi":"kosdaq";
      const idxExpanded=_topPreviewExpanded.has(idxCardId);
      const noIndex=(!m.price);
      const rc=noIndex?"neu":m.change_rate>0?"up":m.change_rate<0?"dn":"neu";
      const rateStr=noIndex?"—":(m.change_rate>0?"▲ +":m.change_rate<0?"▼ ":"")
                   +Number(m.change_rate).toFixed(2)+"%";
      const priceStr=noIndex?"—":Number(m.price).toLocaleString("ko-KR",{maximumFractionDigits:2});

      const idxBars=(_barTF==="1d"?m.bars_1d:_barTF==="1m"?m.bars_1m:m.bars_15m)||m.bars;
      const barSection=`<div>
        <div class="mkt-sec-label" style="display:flex;align-items:center;justify-content:space-between;">
          <span>${_barTFLabel(_barTF)}</span>${_barTFButtons()}
        </div>
        ${_isOhlcBars(idxBars)?renderCandles(idxBars,240,70):miniLine(idxBars,m.change_rate,240,70)}
      </div>`;

      // 코스피 / 코스닥 — 풀 카드
      const inv=m.investor_now||{외인:0,기관:0,개인:0};
      const invAllZero=!inv.외인&&!inv.기관&&!inv.개인;
      const maxAbs=Math.max(1,Math.abs(inv.외인),Math.abs(inv.기관),Math.abs(inv.개인));
      // 최근 방향성(직전 대비 순매수 늘고 있는지/줄고 있는지) — 오늘 누적 합계와 별개로,
      // 1분폴링 이력의 최근~5분 델타로 지금 이 순간의 매수/매도 압력 전환을 보여줌
      const _rawHist=m.investor_history||[];
      const _trendArrow=(k)=>{
        if(_rawHist.length<2) return `<span class="inv-trend"></span>`;
        const n=Math.min(_rawHist.length,6);
        const cur=Number(_rawHist[_rawHist.length-1][k]||0);
        const prev=Number(_rawHist[_rawHist.length-n][k]||0);
        const d=cur-prev;
        if(Math.abs(d)<100) return `<span class="inv-trend">–</span>`;   // 1억 미만 변화=사실상 정체
        return d>0?`<span class="inv-trend up" title="최근 추세: 순매수 증가">▲</span>`
                  :`<span class="inv-trend dn" title="최근 추세: 순매도 전환/증가">▼</span>`;
      };
      const invRows=["외인","기관","개인"].map(k=>{
          const v=inv[k]||0;
          const vc=invAllZero?"neu":(v>0?"up":v<0?"dn":"neu");
          const vs=invAllZero?"—":(v>0?"+":"")+fmtAuk(v);
          return`<span class="inv-lbl">${k}</span>
                 ${invAllZero?`<span style="flex:1"></span>`:divBar(v,maxAbs)}
                 <span class="inv-num ${vc}">${vs}</span>
                 ${invAllZero?`<span class="inv-trend"></span>`:_trendArrow(k)}`;
        }).join("")
        +(invAllZero?`<span style="font-size:9px;color:#333;display:block;margin-top:2px">KIS API 미구독</span>`:"");

      // 기관 세부 (금투/투신/사모/연기금 등) — 확장 카드에서만 표시
      const _subKeys=["금투","투신","사모","연기금","기타금융"];
      const _hasSub=_subKeys.some(k=>inv[k]!==undefined);
      const subRows=!_hasSub?"":(()=>{
        const maxSub=Math.max(1,..._subKeys.map(k=>Math.abs(inv[k]||0)));
        return _subKeys.map(k=>{
          const v=inv[k]||0;
          const vc=v>0?"up":v<0?"dn":"neu";
          const vs=(v>0?"+":"")+fmtAuk(v);
          return`<span class="inv-lbl sub">${k}</span>${divBar(v,maxSub)}<span class="inv-num sub ${vc}">${vs}</span>`;
        }).join("");
      })();

      const hist=_seedOpen(m.investor_history||[],{외인:0,기관:0,개인:0,ts:"0900"});
      const histSvg=`
        <div class="mkt-sec-label" style="margin-top:2px">누적 추이 (외인/기관/개인)</div>
        ${hist.length>=2
          ? invHistoryChart(hist,240,80)
          : hist.length===1
            ? `<div style="font-size:9px;color:#999;padding:2px 0">아직 1포인트 (1분 후 그래프 생성)</div>${invHistoryChart(hist,240,80)}`
            : `<div style="font-size:9px;color:#999;padding:4px 0">장 중 데이터 없음 (09:00~15:30 1분 폴링)</div>`}`;

      const prog=m.program_now||{합계:0,차익:0,비차익:0};
      const progAllZero=!prog.합계&&!prog.차익&&!prog.비차익;
      const pc=prog.합계>0?"up":prog.합계<0?"dn":"neu";
      const ps=progAllZero?"—":(prog.합계>0?"+":"")+fmtAuk(prog.합계);

      // 프로그램 차트: program_series(KIS 최근 30분 즉시조회) vs program_history(서버 1분폴링 누적, 최대 3시간+)
      // — 둘 중 더 긴(더 큰그림을 보여주는) 쪽 사용. 재시작 직후엔 series, 시간 지나면 history가 앞지름.
      const progSeries=m.program_series||[];
      const progHist=m.program_history||[];
      let progSource=progHist.length>progSeries.length?progHist:progSeries;
      progSource=_seedOpen(progSource,{차익:0,비차익:0,합계:0,ts:"0900"});
      if(progSource.length===1) progSource=[progSource[0],progSource[0]];
      let progChart="";
      if(progSource.length>=2){
        const W=240,H=80;
        const vals=progSource.map(r=>Number(r["합계"]||0));
        const mn=Math.min(...vals),mx=Math.max(...vals),range=mx-mn||1;
        // x좌표: 09:00~15:30 고정 장중축 (progSeries는 "t"=HHMMSS, progHist는 "ts"=HH:MM 둘 다 지원)
        const xsRaw=progSource.map(r=>_sessionX(r.t||r.ts,W));
        const hasTimeP=xsRaw.some(x=>x!==null);
        const xs=hasTimeP
          ? xsRaw.map((x,i)=>x!==null?x:Math.round(2+i*(W-4)/(progSource.length-1)))
          : progSource.map((_,i)=>Math.round(2+i*(W-4)/(progSource.length-1)));
        const ys=vals.map(v=>Math.round(2+(1-((v-mn)/range))*(H-4)));
        const pts=xs.map((x,i)=>`${x},${ys[i]}`).join(" ");
        const col=prog.합계>=0?"#e74c3c":"#3498db";
        const zeroY=Math.round(2+(1-((0-mn)/range))*(H-4));
        const zeroLine=zeroY>=2&&zeroY<=H-2
          ?`<line x1="0" y1="${zeroY}" x2="${W}" y2="${zeroY}" stroke="#333" stroke-width="1" stroke-dasharray="3,3"/>`:"";
        // X축 시간 레이블: 왼쪽 09:00 고정, 오른쪽 현재시각(동적)
        const progTimeRow=`<div style="display:flex;justify-content:space-between;margin-top:2px">
          <span style="font-size:8px;color:#444">09:00</span>
          <span style="font-size:8px;color:#444">${_fmtMin(_sessionEndMin)}</span>
        </div>`;
        progChart=`
          <svg viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" style="display:block;width:100%;height:${H}px;border-radius:4px;overflow:hidden">
            <rect width="${W}" height="${H}" fill="#0e0e0e" rx="3"/>
            ${zeroLine}
            <polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/>
          </svg>
          ${progTimeRow}`;
      }

      return`<div class="mkt-card">
        ${_foldBtn(idxCardId)}
        <div class="mkt-hdr">
          <span class="mkt-name">${esc(m.label)}</span>
          <span class="mkt-price">${priceStr}</span>
          <span class="mkt-rate ${rc}">${rateStr}</span>
        </div>
        ${barSection}
        <div>
          <div class="mkt-sec-label">투자자 순매수 (오늘 누적)</div>
          <div class="inv-grid">${invRows}</div>
          ${histSvg}
        </div>
        ${idxExpanded&&_hasSub?`<div>
          <div class="mkt-sec-label" style="margin-top:2px">기관 세부 (금투/투신/사모/연기금 등)</div>
          <div class="inv-grid sub-grid">${subRows}</div>
        </div>`:""}
        ${idxExpanded?`<div>
          <div class="mkt-sec-label" style="margin-top:2px;display:flex;justify-content:space-between">
            <span>프로그램 순매수</span>
            ${!progChart?"":`<span style="color:${prog.합계>=0?"#e74c3c":"#3498db"};font-weight:700">${ps}</span>`}
          </div>
          ${progChart||`<div style="font-size:9px;color:#333;padding:4px 0">장 중 데이터 없음</div>`}
        </div>`:""}
      </div>`;
    }).join("");
  // 렌더 후 높이 고정: 5개 박스 전부 MKT_CARD_HEIGHT(미리보기는 절반)로 고정, 내용이 넘치면 카드별로 스크롤
  // (콘텐츠양에 따라 계속 늘어나던 것 방지 — 뉴스/탑픽은 mkt-below-panel로 분리해서 나감)
  // innerHTML 대입 직후 동기 실행 — requestAnimationFrame은 백그라운드(비활성) 탭에서
  // 아예 콜백이 안 불려 높이고정이 통째로 안 먹히는 버그가 있었음(대시보드는 백그라운드 탭에
  // 켜두는 경우가 많아 실사용에서 재현됨). offsetHeight 읽기 자체가 동기 리플로우를 강제하므로
  // rAF로 다음 페인트를 기다릴 필요가 없다.
  (()=>{
    const cards=[...document.querySelectorAll('#mkt-panel .mkt-card')];
    if(cards.length<4) return;
    const cardIds=["kospi","kosdaq","global","rank","briefing"];
    cards.forEach(c=>{ c.style.height=''; c.style.overflowY=''; c.style.justifyContent=''; });
    // 미리보기 목표높이 = max(기본 300px, 지금 미리보기 중인 카드들의 실제 내용 높이) —
    // 브리핑 narrative가 길어져 300px을 넘으면 나머지 카드도 그 높이에 맞춰 같이 늘어난다
    // (반대로 브리핑이 짧으면 기본 300px 그대로, 빈 공간도 안 생김).
    const previewNats=cards.map((c,i)=>_topPreviewExpanded.has(cardIds[i])?0:c.offsetHeight);
    const previewTargetH=Math.max(Math.round(MKT_CARD_HEIGHT/2), ...previewNats);
    cards.forEach((c,i)=>{
      const isPreview=!_topPreviewExpanded.has(cardIds[i]);
      const nat=c.offsetHeight;
      const targetH=isPreview?previewTargetH:Math.max(MKT_CARD_HEIGHT,nat);
      c.style.height=targetH+'px';
      if(nat>targetH) c.style.overflowY='auto';                // 내용이 넘치면 스크롤
      else if(i===4) c.style.justifyContent='flex-start';     // 브리핑 카드: 짧으면 위 정렬(늘리지 않음)
      else c.style.justifyContent='space-between';             // 나머지: 짧으면 균등 분산
    });
  })();
  }catch(e){
    console.error("market_flow 오류",e);
  }
}

// ── 자동갱신 인터벌 ─────────────────────────────────────
let _autoTimer=null;
// 자동 새로고침 — 클라이언트 메모리 캐시(180초)를 우회해 서버를 실제로 다시 받아온다.
// (loadActive→loadOverview(false)는 캐시 히트 시 서버를 안 쳐서 updated_at이 멈춤)
function autoRefreshActive(){
  if(activeTab==="all") _refreshOverviewBg();
  else if(activeTab==="fav"){ if(_allTiles.length>0) renderGrid(_allTiles); else _refreshOverviewBg(); }
  else if(activeTab==="edit"){ /* 편집 탭은 자동 갱신 안 함 */ }
  else _refreshTabBg(activeTab);
}
function setIntervalSec(sec){
  if(_autoTimer)clearInterval(_autoTimer);
  _autoTimer=setInterval(()=>{
    autoRefreshActive();
  },sec*1000);
  // 버튼 active 상태 업데이트
  [30,300,600].forEach(s=>{
    const el=document.getElementById(`iv-${s}`);
    if(el)el.classList.toggle("active",s===sec);
  });
}
function refresh(){
  if(activeTab==="fav"){ renderGrid(_allTiles); }
  else if(activeTab==="all") loadOverview(true);
  else if(activeTab==="edit") loadEditTab();
  else loadTab(activeTab,true);
  if(activeTab!=="edit"){loadEtfBar();loadMarketFlow();}
}
function setDensity(d){
  const grid=document.getElementById("grid");
  if(grid) grid.classList.remove("density-2","density-3");
  if(grid && d===2) grid.classList.add("density-2");
  if(grid && d===3) grid.classList.add("density-3");
  [1,2,3].forEach(n=>{
    const el=document.getElementById(`ds-${n}`);
    if(el) el.classList.toggle("active",n===d);
  });
  try{localStorage.setItem("mkt_density",d);}catch(_){}
}
setIntervalSec(600); // 기본 10분
(()=>{ try{
  const d=parseInt(localStorage.getItem("mkt_density")||"1",10);
  if(d===2||d===3) setDensity(d);
}catch(_){} })();

// 세부 탭 백그라운드 프리패치 (전체 로드 완료 후 순차 실행)
async function prefetchTabs(){
  const ids=Object.keys(TAB_LABELS);
  for(const id of ids){
    if(_fromCache(id)) continue;          // 이미 캐시됨
    if(activeTab===id) continue;          // 현재 보고 있는 탭은 건너뜀 (이미 로딩 중)
    try{
      const r=await fetch(`/api/heatmap_tab?id=${id}`);
      if(r.ok){
        const data=await r.json();
        if(data&&!data.error) _toCache(id,data);
      }
    }catch(e){}
    // 탭 하나 완료 후 잠깐 대기 (KIS API 부하 분산)
    await new Promise(r=>setTimeout(r,300));
  }
}

// ── 편집 탭 ──────────────────────────────────────────────
let _editState={hidden_sectors:[],extra_stocks:{},removed_stocks:{},custom_tiles:[]};
let _editSectorNames=[];   // 섹터 이름 목록 (편집 드롭다운용)
let _editSector="";        // 현재 종목 관리 중인 섹터
let _editSectorStocks={base:[],extra:[],removed:[]};  // 선택한 섹터의 종목 목록 (서버에서 로드)
let _newCtStocks=[];       // 커스텀 섹터 추가 중 임시 종목
let _stockSearchTimer=null;

async function loadEditTab(){
  document.getElementById("main-title").textContent="섹터 편집";
  document.getElementById("snap-date").textContent="";
  const grid=document.getElementById("grid");
  grid.innerHTML='<div class="loading">⚙️ 편집 설정 불러오는 중…</div>';
  grid.style.display="block";
  try{
    const [resp, nr]=await Promise.all([
      fetch("/api/sector_custom"),
      fetch("/api/sector_names"),
    ]);
    _editState=await resp.json();
    // 항상 서버에서 전체 섹터 목록 가져옴 (숨겨진 섹터도 표시해야 체크 해제 가능)
    _editSectorNames=await nr.json();
    renderEditUI();
  }catch(e){
    grid.innerHTML=`<div class="error">❌ ${esc(e.message)}</div>`;
  }
}

function renderEditUI(){
  const grid=document.getElementById("grid");
  grid.style.display="block";
  const hidden=_editState.hidden_sectors||[];
  const extra=_editState.extra_stocks||{};
  const customTiles=_editState.custom_tiles||[];

  // 섹터 숨기기 목록
  const sectorListHtml=_editSectorNames.map(name=>{
    const isHidden=hidden.includes(name);
    const sid="h_"+name.replace(/[^\w가-힣]/g,"_");
    return`<div class="sector-item${isHidden?" hidden":""}">
      <input type="checkbox" id="${sid}"${isHidden?" checked":""} onchange="toggleHideSector(this,'${esc(name)}')">
      <label for="${sid}">${esc(name)}</label>
    </div>`;
  }).join("");

  // 종목 관리: 기본+추가 종목 통합 태그
  const removedSet=new Set((_editState.removed_stocks||{})[_editSector]||[]);
  const stocksHtml=_editSector?[
    ..._editSectorStocks.base.filter(s=>!removedSet.has(s.code)).map(s=>
      `<span class="tag" style="background:rgba(255,255,255,.06);border-color:#333">${esc(s.name)}<span class="x" onclick="removeBaseStock('${esc(_editSector)}','${esc(s.code)}')">×</span></span>`
    ),
    ...(_editSectorStocks.extra||[]).map(s=>
      `<span class="tag">${esc(s.name)}<span class="x" onclick="removeExtraStock('${esc(_editSector)}','${esc(s.code)}')">×</span></span>`
    ),
  ].join("")||'<span style="font-size:11px;color:#444">종목 없음</span>'
  :"";

  // 커스텀 섹터 목록
  const ctHtml=customTiles.map((ct,i)=>
    `<div class="custom-sector-row">
      <div>
        <div class="custom-sector-name">${esc(ct.name)}</div>
        <div class="custom-sector-stocks">${(ct.stocks||[]).map(s=>esc(s.name)).join(", ")||"종목 없음"}</div>
      </div>
      <button class="del-btn" onclick="deleteCustomTile(${i})" title="삭제">✕</button>
    </div>`
  ).join("");

  grid.innerHTML=`<div class="edit-panel">

    <!-- 왼쪽: 섹터 숨기기 -->
    <div class="edit-section">
      <h2>🙈 섹터 숨기기</h2>
      <p style="font-size:11px;color:#555;margin-bottom:8px">체크 → 히트맵에서 제외</p>
      <input class="edit-input" placeholder="섹터 검색…" oninput="filterSectorList(this.value)">
      <div class="sector-list">${sectorListHtml||'<span style="font-size:12px;color:#444;padding:8px">섹터 없음</span>'}</div>
    </div>

    <!-- 오른쪽: 종목 추가 + 커스텀 -->
    <div style="display:flex;flex-direction:column;gap:14px">

      <!-- 섹터 종목 관리 -->
      <div class="edit-section">
        <h2>📋 섹터 종목 관리</h2>
        <label class="edit-label" style="margin-top:0">섹터 선택</label>
        <select class="sector-select" onchange="selectEditSector(this.value)">
          <option value="">-- 섹터 선택 --</option>
          ${_editSectorNames.map(n=>`<option value="${esc(n)}"${n===_editSector?" selected":""}>${esc(n)}</option>`).join("")}
        </select>
        ${_editSector?`
          <label class="edit-label" style="margin-top:8px">✏️ 섹터 표시 이름 변경</label>
          <input class="edit-input" id="edit-sector-rename" autocomplete="off"
                 placeholder="${esc(_editSector)}"
                 value="${esc((_editState.sector_rename||{})[_editSector]||_editSector)}">
          <div style="display:flex;justify-content:space-between;align-items:center;margin:8px 0 4px">
            <label class="edit-label" style="margin:0">등록 종목</label>
            <span style="font-size:10px;color:#555">흰색=기본 / 금색=추가</span>
          </div>
          <div class="tag-row" id="stock-manage-row">${stocksHtml}</div>
          <label class="edit-label">종목 추가 검색</label>
          <div class="autocomplete-wrap">
            <input class="edit-input" id="extra-stock-input" placeholder="종목명 입력…"
                   oninput="searchStock(this.value,'extra-stock-list','extra')" autocomplete="off">
            <div class="autocomplete-list" id="extra-stock-list" style="display:none"></div>
          </div>
        `:`<p style="font-size:12px;color:#444;margin-top:4px">섹터를 선택하면 종목을 관리할 수 있습니다</p>`}
      </div>

      <!-- 커스텀 섹터 -->
      <div class="edit-section">
        <h2>✨ 커스텀 섹터</h2>
        <label class="edit-label" style="margin-top:0">섹터 이름</label>
        <input class="edit-input" id="new-ct-name" placeholder="예: 내 관심종목">
        <label class="edit-label">종목 추가</label>
        <div class="autocomplete-wrap">
          <input class="edit-input" id="new-ct-input" placeholder="종목명 입력…"
                 oninput="searchStock(this.value,'new-ct-list','custom')" autocomplete="off">
          <div class="autocomplete-list" id="new-ct-list" style="display:none"></div>
        </div>
        <div class="tag-row" id="new-ct-tags" style="margin-top:8px"></div>
        <button onclick="addCustomTile()" style="margin-top:10px;width:100%;padding:8px;
          background:rgba(212,175,55,.15);border:1px solid rgba(212,175,55,.4);border-radius:8px;
          color:var(--gold);font-size:12px;cursor:pointer;font-family:inherit">+ 커스텀 섹터 추가</button>
        ${customTiles.length?`
          <div style="border-top:1px solid var(--line);margin-top:12px;padding-top:12px">
            <div style="font-size:11px;color:#555;margin-bottom:6px">등록된 커스텀 섹터</div>
            <div class="custom-sector-list">${ctHtml}</div>
          </div>`:""}
      </div>

      <!-- 백업/복원 스냅샷 -->
      <div class="edit-section">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <h2 style="margin:0">🕐 백업 · 복원</h2>
          <button onclick="snapshotNow()" style="padding:6px 12px;background:rgba(212,175,55,.15);
            border:1px solid rgba(212,175,55,.4);border-radius:8px;color:var(--gold);font-size:11px;
            cursor:pointer;font-family:inherit">📸 지금 백업</button>
        </div>
        <p style="font-size:11px;color:#555;margin:6px 0 8px">저장할 때마다 자동 백업됨. 클릭하면 그 시점으로 복원(복원 전 현재상태도 백업).</p>
        <div id="snap-list" style="max-height:220px;overflow-y:auto"><span style="font-size:11px;color:#444">불러오는 중…</span></div>
      </div>

    </div>
  </div>
  <div class="save-bar">
    <button class="btn-reset" onclick="resetEditState()">↺ 초기화</button>
    <button class="btn-save" id="edit-save-btn" onclick="saveEdit()">💾 저장</button>
  </div>`;

  // 커스텀 섹터 추가 임시 태그 복원
  _renderNewCtTags();
  loadSnapshots();
}

function filterSectorList(q){
  q=q.trim().toLowerCase();
  document.querySelectorAll(".sector-item").forEach(el=>{
    const lbl=el.querySelector("label");
    el.style.display=(!q||lbl.textContent.toLowerCase().includes(q))?"":"none";
  });
}

// ── 백업/복원 스냅샷 ──────────────────────────────────────
async function loadSnapshots(){
  const box=document.getElementById("snap-list"); if(!box)return;
  try{
    const snaps=await (await fetch("/api/sector_custom/snapshots")).json();
    if(!snaps.length){ box.innerHTML='<span style="font-size:11px;color:#444">백업 없음 (편집 저장 시 자동 생성)</span>'; return; }
    box.innerHTML=snaps.map(s=>{
      const su=s.summary||{};
      const tag=s.label==="manual"?"📸수동":s.label==="prerestore"?"↩️복원전":"자동";
      return `<div style="display:flex;justify-content:space-between;align-items:center;gap:8px;
        padding:6px 8px;border:1px solid var(--line);border-radius:7px;margin-bottom:5px">
        <div style="font-size:11px;color:#bbb;line-height:1.4">
          <b style="color:#ddd">${esc(s.ts)}</b> <span style="color:#666">${tag}</span><br>
          <span style="color:#777">숨김${su.hidden||0}·이름${su.rename||0}·추가${su.extra||0}·삭제${su.removed||0}</span>
        </div>
        <button onclick="restoreSnapshot('${esc(s.file)}','${esc(s.ts)}')" style="flex-shrink:0;padding:5px 10px;
          background:rgba(255,255,255,.06);border:1px solid #444;border-radius:6px;color:#f5d97a;
          font-size:11px;cursor:pointer;font-family:inherit">복원</button>
      </div>`;
    }).join("");
  }catch(e){ box.innerHTML='<span style="font-size:11px;color:#f87171">목록 로드 실패</span>'; }
}
async function snapshotNow(){
  try{
    const r=await (await fetch("/api/sector_custom/snapshot",{method:"POST"})).json();
    showToast(r.ok?"📸 백업 완료":"백업할 상태 없음", r.ok?"ok":"err");
    loadSnapshots();
  }catch(e){ showToast("백업 실패: "+e.message,"err"); }
}
async function restoreSnapshot(file,ts){
  if(!confirm(`${ts} 시점으로 복원할까요?\n(현재 상태도 자동 백업됩니다)`))return;
  try{
    const r=await (await fetch("/api/sector_custom/restore",{method:"POST",
      headers:{"Content-Type":"application/json"},body:JSON.stringify({file})})).json();
    if(r.ok){
      Object.keys(_tabCache||{}).forEach(k=>delete _tabCache[k]);
      try{ Object.keys(localStorage).filter(k=>k.indexOf("__hm_")===0).forEach(k=>localStorage.removeItem(k)); }catch(_){}
      showToast("↩️ 복원 완료. 갱신 중…");
      loadEditTab();   // 편집탭 새로고침(복원된 상태 반영)
    } else showToast("복원 실패: "+(r.error||""),"err");
  }catch(e){ showToast("복원 실패: "+e.message,"err"); }
}

function toggleHideSector(cb,name){
  const h=_editState.hidden_sectors||[];
  const idx=h.indexOf(name);
  if(cb.checked){ if(idx<0)h.push(name); }
  else { if(idx>=0)h.splice(idx,1); }
  _editState.hidden_sectors=h;
  const item=cb.closest(".sector-item");
  if(item)item.classList.toggle("hidden",cb.checked);
}

async function selectEditSector(name){
  _editSector=name;
  _editSectorStocks={base:[],extra:[],removed:[]};
  if(name){
    try{
      const r=await fetch(`/api/sector_stocks?sector=${encodeURIComponent(name)}`);
      const d=await r.json();
      _editSectorStocks={base:d.base||[],extra:d.extra||[],removed:d.removed||[]};
    }catch(e){}
  }
  renderEditUI();
}

function _refreshStockManageRow(){
  const row=document.getElementById("stock-manage-row");
  if(!row)return;
  const removedSet=new Set((_editState.removed_stocks||{})[_editSector]||[]);
  const html=[
    ..._editSectorStocks.base.filter(s=>!removedSet.has(s.code)).map(s=>
      `<span class="tag" style="background:rgba(255,255,255,.06);border-color:#333">${esc(s.name)}<span class="x" onclick="removeBaseStock('${esc(_editSector)}','${esc(s.code)}')">×</span></span>`
    ),
    ...(_editSectorStocks.extra||[]).map(s=>
      `<span class="tag">${esc(s.name)}<span class="x" onclick="removeExtraStock('${esc(_editSector)}','${esc(s.code)}')">×</span></span>`
    ),
  ].join("")||'<span style="font-size:11px;color:#444">종목 없음</span>';
  row.innerHTML=html;
}

function removeBaseStock(sector,code){
  const rm=_editState.removed_stocks||{};
  if(!rm[sector])rm[sector]=[];
  if(!rm[sector].includes(code))rm[sector].push(code);
  _editState.removed_stocks=rm;
  _refreshStockManageRow();
}

function removeExtraStock(sector,code){
  const ex=_editState.extra_stocks||{};
  if(!ex[sector])return;
  ex[sector]=ex[sector].filter(s=>s.code!==code);
  if(!ex[sector].length)delete ex[sector];
  _editState.extra_stocks=ex;
  _editSectorStocks.extra=(_editSectorStocks.extra||[]).filter(s=>s.code!==code);
  _refreshStockManageRow();
}

function addExtraStock(name,code){
  if(!_editSector)return;
  const ex=_editState.extra_stocks||{};
  if(!ex[_editSector])ex[_editSector]=[];
  if(!ex[_editSector].find(s=>s.code===code)){
    ex[_editSector].push({name,code});
    _editSectorStocks.extra=ex[_editSector];
  }
  _editState.extra_stocks=ex;
  const inp=document.getElementById("extra-stock-input");
  if(inp)inp.value="";
  const lst=document.getElementById("extra-stock-list");
  if(lst)lst.style.display="none";
  _refreshStockManageRow();
}

function addNewCtStock(name,code){
  if(!_newCtStocks.find(s=>s.code===code))_newCtStocks.push({name,code});
  const inp=document.getElementById("new-ct-input");
  if(inp)inp.value="";
  const lst=document.getElementById("new-ct-list");
  if(lst)lst.style.display="none";
  _renderNewCtTags();
}

function removeNewCtStock(code){
  _newCtStocks=_newCtStocks.filter(s=>s.code!==code);
  _renderNewCtTags();
}

function _renderNewCtTags(){
  const row=document.getElementById("new-ct-tags");
  if(!row)return;
  row.innerHTML=_newCtStocks.map(s=>`<span class="tag">${esc(s.name)}<span class="x" onclick="removeNewCtStock('${esc(s.code)}')">×</span></span>`).join("");
}

function addCustomTile(){
  const nameEl=document.getElementById("new-ct-name");
  const name=(nameEl?nameEl.value:"").trim();
  if(!name){showToast("섹터 이름을 입력하세요","err");return;}
  if(!_newCtStocks.length){showToast("종목을 하나 이상 추가하세요","err");return;}
  const ct=_editState.custom_tiles||[];
  if(ct.find(c=>c.name===name)){showToast("이미 존재하는 섹터 이름입니다","err");return;}
  ct.push({name,stocks:[..._newCtStocks]});
  _editState.custom_tiles=ct;
  _newCtStocks=[];
  renderEditUI();
}

function deleteCustomTile(idx){
  const ct=_editState.custom_tiles||[];
  ct.splice(idx,1);
  _editState.custom_tiles=ct;
  renderEditUI();
}

function searchStock(q,listId,target){
  clearTimeout(_stockSearchTimer);
  const lst=document.getElementById(listId);
  if(!q.trim()){if(lst)lst.style.display="none";return;}
  _stockSearchTimer=setTimeout(async()=>{
    try{
      const r=await fetch(`/api/stock_search?q=${encodeURIComponent(q.trim())}`);
      const res=await r.json();
      const el=document.getElementById(listId);
      if(!el)return;
      if(!res.length){el.style.display="none";return;}
      el.innerHTML=res.map(s=>`<div class="autocomplete-item"
        onclick="handleStockSelect('${target}','${esc(s.name)}','${esc(s.code)}')">${esc(s.name)}
        <span style="color:#555;font-size:10px;margin-left:4px">${s.code}</span></div>`).join("");
      el.style.display="block";
    }catch(e){}
  },250);
}

function handleStockSelect(target,name,code){
  if(target==="extra")addExtraStock(name,code);
  else if(target==="secedit")secEditAdd(name,code);
  else addNewCtStock(name,code);
  // 자동완성 리스트 닫기
  const listId=target==="extra"?"extra-stock-list":target==="secedit"?"sec-edit-list":"new-ct-list";
  const el=document.getElementById(listId);
  if(el)el.style.display="none";
}

// ── 타일별 섹터 종목 편집 모달 (#1) — sector_custom 백엔드 재사용 ──
let _secEditSector="";
let _secEditStocks={base:[],extra:[],removed:[]};
let _secEditState=null;       // 전체 sector_custom 오버레이

async function openSectorEdit(name){
  _secEditSector=name;
  try{
    const [cr,sr]=await Promise.all([
      fetch("/api/sector_custom"),
      fetch(`/api/sector_stocks?sector=${encodeURIComponent(name)}`),
    ]);
    _secEditState=await cr.json();
    _secEditStocks=await sr.json();
  }catch(e){ showToast("편집 데이터 로드 실패","err"); return; }
  if(!_secEditState||_secEditState.error) _secEditState={hidden_sectors:[],extra_stocks:{},removed_stocks:{},custom_tiles:[]};
  _renderSecEditModal();
}
function _secDispName(code,orig){ return (_secEditState.stock_rename||{})[code]||orig; }
function _secEditTagsHtml(){
  const removed=new Set((_secEditState.removed_stocks||{})[_secEditSector]||[]);
  const extra=(_secEditState.extra_stocks||{})[_secEditSector]||[];
  const tag=(s,isBase)=>{
    const dn=_secDispName(s.code,s.name);
    const renamed=dn!==s.name;
    const st=isBase?' style="background:rgba(255,255,255,.06);border-color:#333"':'';
    return `<span class="tag"${st}><span class="tnm" title="클릭→이름변경" style="cursor:pointer;border-bottom:1px dashed rgba(245,217,122,.4)"
      onclick="secEditRenameStock('${esc(s.code)}','${esc(s.name)}')">${esc(dn)}${renamed?' ✏️':''}</span><span class="x" onclick="secEditRemove${isBase?'Base':'Extra'}('${esc(s.code)}')">×</span></span>`;
  };
  const baseTags=(_secEditStocks.base||[]).filter(s=>!removed.has(s.code)).map(s=>tag(s,true));
  const extraTags=extra.map(s=>tag(s,false));
  return [...baseTags,...extraTags].join("")||'<span style="font-size:11px;color:#444">종목 없음</span>';
}
function _renderSecEditModal(){
  let m=document.getElementById("sec-edit-modal");
  if(!m){ m=document.createElement("div"); m.id="sec-edit-modal"; m.className="modal-overlay";
    m.addEventListener("click",ev=>{ if(ev.target===m) closeSectorEdit(); }); document.body.appendChild(m); }
  const curDisp=(_secEditState.sector_rename||{})[_secEditSector]||_secEditSector;
  m.innerHTML=`<div class="modal-box">
    <div class="modal-hd"><span>📋 ${esc(_secEditSector)} — 편집</span>
      <button class="modal-x" onclick="closeSectorEdit()">✕</button></div>
    <label class="edit-label" style="margin-top:0">✏️ 표시 이름 변경</label>
    <input class="edit-input" id="sec-edit-rename" placeholder="${esc(_secEditSector)}"
           value="${esc(curDisp)}" autocomplete="off" style="margin-bottom:10px">
    <div style="font-size:11px;color:#666;margin-bottom:6px">흰색=기본 · 금색=추가 · ×로 삭제</div>
    <div class="tag-row" id="sec-edit-tags">${_secEditTagsHtml()}</div>
    <label class="edit-label">종목 추가 검색</label>
    <div class="autocomplete-wrap">
      <input class="edit-input" id="sec-edit-input" placeholder="종목명 입력…" autocomplete="off"
             oninput="searchStock(this.value,'sec-edit-list','secedit')">
      <div class="autocomplete-list" id="sec-edit-list" style="display:none"></div>
    </div>
    <div class="save-bar">
      <button class="btn-reset" onclick="closeSectorEdit()">닫기</button>
      <button class="btn-save" id="sec-edit-save" onclick="saveSectorEdit()">💾 저장</button>
    </div>
  </div>`;
  m.style.display="flex";
}
function _refreshSecEditTags(){ const r=document.getElementById("sec-edit-tags"); if(r)r.innerHTML=_secEditTagsHtml(); }
function secEditRenameStock(code, orig){
  const sr=_secEditState.stock_rename||{};
  const cur=sr[code]||orig;
  const nv=prompt(`종목 표시 이름 변경\n(원래: ${orig})`, cur);
  if(nv===null)return;
  const t=nv.trim();
  if(t && t!==orig) sr[code]=t; else delete sr[code];   // 원래이름과 같거나 빈값 → 변경 해제
  _secEditState.stock_rename=sr; _refreshSecEditTags();
}
function secEditRemoveBase(code){
  const rm=_secEditState.removed_stocks||{};
  if(!rm[_secEditSector])rm[_secEditSector]=[];

let _wlCodes=[];            // 현재 관심종목 [{code,name}]

// 백만원 → 억/조 (부호 포함)
function wlAmt(v){
  v=Number(v)||0;
  if(v===0) return "0";
  const bok=v/100, a=Math.abs(bok);
  let s;
  if(a>=10000) s=(bok/10000).toFixed(1)+"조";
  else if(a>=1) s=Math.round(bok)+"억";
  else s=Math.round(v)+"백만";
  return (v>0?"+":"")+s;
}

let _wlItems=[];            // 마지막 렌더된 종목 전체데이터 (드래그 재정렬용)
const _IS_TOUCH=(window.matchMedia&&window.matchMedia("(hover:none)").matches)||("ontouchstart" in window);
function renderWatchlist(items){
  const row=document.getElementById("wl-row");
  const cnt=document.getElementById("wl-count");
  if(!row)return;
  _wlItems=items.slice();
  if(cnt) cnt.textContent=items.length?`${items.length}종목`:"";
  if(!items.length){ row.innerHTML='<div class="wl-empty">관심종목을 추가하세요.</div>'; return; }
  row.innerHTML=items.map(it=>{
    const rc=it.change_rate>0?"up":it.change_rate<0?"dn":"neu";
    const rs=(it.change_rate>0?"+":"")+Number(it.change_rate||0).toFixed(2)+"%";
    const ps=Number(it.price||0).toLocaleString("ko-KR");
    const sup=it.supply;
    let supHtml;
    if(sup&&(sup.외인||sup.기관||sup.프로그램)){
      const cell=(k,v,span)=>{const c=v>0?"up":v<0?"dn":"neu";
        return`<div class="s"${span?' style="grid-column:1/-1"':''}><span class="k">${k}</span><span class="v ${c}">${wlAmt(v)}</span></div>`;};
      supHtml=`<div class="wl-sup">${cell("외인",sup.외인)}${cell("기관",sup.기관)}${cell("프로그램",sup.프로그램,true)}</div>`;
    } else {
      supHtml=`<div class="wl-sup-na">잠정수급 집계 전</div>`;
    }
    return`<div class="wl-card" draggable="${_IS_TOUCH?'false':'true'}" data-code="${it.code}" data-name="${esc(it.name)}"
      ondragstart="wlDragStart(event,'${it.code}')" ondragover="wlDragOver(event,'${it.code}')"
      ondragleave="wlDragLeave(event)" ondrop="wlDrop(event,'${it.code}')" ondragend="wlDragEnd(event)">
      <button class="x" onclick="event.stopPropagation();wlRemove('${it.code}')" title="삭제">✕</button>
      <div class="wl-nm" title="${esc(it.name)}">${esc(it.name)}</div>
      <div class="wl-pr"><span class="p">${ps}</span><span class="r ${rc}">${rs}</span></div>
      ${supHtml}
    </div>`;
  }).join("");
}

let _wlDragCode=null, _wlJustDragged=false;
function wlCardClick(code,name){
  if(_wlJustDragged) return;   // 드래그 직후 클릭 무시
  openStockChart(code,name);
}
function wlDragStart(e,code){
  _wlDragCode=code;
  e.dataTransfer.effectAllowed="move";
  try{ e.dataTransfer.setData("text/plain",code); }catch(_){}
  const card=e.currentTarget; setTimeout(()=>card.classList.add("dragging"),0);
}
function wlDragOver(e,code){
  e.preventDefault(); e.dataTransfer.dropEffect="move";
  if(code===_wlDragCode) return;
  const card=e.currentTarget;
  // 마우스가 카드 왼/오른 어느쪽인지로 삽입 위치 표시
  const r=card.getBoundingClientRect();
  const after=(e.clientX-r.left)>r.width/2;
  card.classList.remove("drop-before","drop-after");
  card.classList.add(after?"drop-after":"drop-before");
}
function wlDragLeave(e){ e.currentTarget.classList.remove("drop-before","drop-after"); }
function wlDrop(e,targetCode){
  e.preventDefault(); e.stopPropagation();
  const card=e.currentTarget;
  const r=card.getBoundingClientRect();
  const after=(e.clientX-r.left)>r.width/2;
  card.classList.remove("drop-before","drop-after");
  const from=_wlDragCode;
  if(!from || from===targetCode){ return; }
  const arr=_wlItems;
  const fi=arr.findIndex(x=>x.code===from); if(fi<0) return;
  const [m]=arr.splice(fi,1);
  let ti=arr.findIndex(x=>x.code===targetCode); if(ti<0){ arr.push(m); }
  else arr.splice(after?ti+1:ti,0,m);
  _wlCodes=arr.map(it=>({code:it.code,name:it.name}));
  renderWatchlist(arr);          // 즉시 반영
  _wlSave();                     // 서버 저장(순서 영속)
  _wlJustDragged=true; setTimeout(()=>{_wlJustDragged=false;},50);
}
function wlDragEnd(e){
  _wlDragCode=null;
  document.querySelectorAll("#wl-row .wl-card").forEach(c=>
    c.classList.remove("dragging","drop-before","drop-after"));
}

async function loadWatchlist(){

    const items=d.items||[];
    _wlCodes=items.map(it=>({code:it.code,name:it.name}));
    renderWatchlist(items);
  }catch(e){ /* 유지 */ }
}

function wlSearch(q){
  clearTimeout(_wlSearchTimer);
  if(!q.trim()){ wlCloseAc(); return; }
  _wlSearchTimer=setTimeout(async()=>{
    try{
      const r=await fetch("/api/stock_search?q="+encodeURIComponent(q.trim()));
      const list=await r.json();
      if(!Array.isArray(list)||!list.length){ _wlSearchResults=[]; wlCloseAc(); return; }
      _wlSearchResults=list; _wlAcIndex=-1; _wlRenderAc();
    }catch(e){ wlCloseAc(); }
  },220);
}
function _wlRenderAc(){
  const ac=document.getElementById("wl-ac"); if(!ac)return;
  if(!_wlSearchResults.length){ wlCloseAc(); return; }
  ac.innerHTML=_wlSearchResults.map((s,i)=>
    `<div class="wl-ac-item${i===_wlAcIndex?' sel':''}" onmousedown="wlAddIdx(${i})">
      <span>${esc(s.name)}</span><span class="c">${esc(s.code)}</span></div>`).join("");
  ac.classList.add("open");
}
function _wlScrollSel(){
  const ac=document.getElementById("wl-ac");
  const el=ac&&ac.querySelector(".wl-ac-item.sel");
  if(el&&el.scrollIntoView) el.scrollIntoView({block:"nearest"});
}
// 검색창 키보드: ↓/↑ 이동, Enter 추가, Esc 닫기
function wlKey(e){
  const ac=document.getElementById("wl-ac");
  const open=ac&&ac.classList.contains("open")&&_wlSearchResults.length;
  if(e.key==="ArrowDown"){
    if(!open)return; e.preventDefault();
    _wlAcIndex=Math.min(_wlSearchResults.length-1,_wlAcIndex+1); _wlRenderAc(); _wlScrollSel();
  } else if(e.key==="ArrowUp"){
    if(!open)return; e.preventDefault();
    _wlAcIndex=Math.max(0,_wlAcIndex-1); _wlRenderAc(); _wlScrollSel();
  } else if(e.key==="Enter"){
    if(!open)return; e.preventDefault();
    const i=_wlAcIndex>=0?_wlAcIndex:0; const s=_wlSearchResults[i];
    if(s) wlAdd(s.code,s.name);
  } else if(e.key==="Escape"){ wlCloseAc(); }
}
function wlCloseAc(){ const ac=document.getElementById("wl-ac"); if(ac)ac.classList.remove("open"); _wlAcIndex=-1; }
function wlAddIdx(i){ const s=_wlSearchResults[i]; if(s) wlAdd(s.code,s.name); }

async function wlAdd(code,name){

    box.style.left=box.dataset.rl||"40px"; box.style.top=box.dataset.rt||"60px";
    box.style.width=box.dataset.rw||"1040px"; box.style.height=box.dataset.rh||"600px";
    box.dataset.max="0";
  } else {
    box.dataset.rl=box.style.left; box.dataset.rt=box.style.top;
    box.dataset.rw=(box.style.width||box.offsetWidth+"px"); box.dataset.rh=(box.style.height||box.offsetHeight+"px");
    box.style.left="1vw"; box.style.top="1vh"; box.style.width="98vw"; box.style.height="96vh";
    box.dataset.max="1";
  }
}

// 수급빈집 스파크라인 (osc 시계열) — 접기/펼치기
let _oscSpkOpen=(()=>{ try{ return localStorage.getItem("osc_spk")!=="0"; }catch(_){ return true; } })();
function _toggleSpark(){
  _oscSpkOpen=!_oscSpkOpen;
  try{ localStorage.setItem("osc_spk", _oscSpkOpen?"1":"0"); }catch(_){}
  const wrap=document.getElementById("tk-spk-wrap"); if(wrap) wrap.style.display=_oscSpkOpen?"":"none";
  const car=document.getElementById("tk-spk-caret"); if(car) car.textContent=_oscSpkOpen?"▾":"▸";
}
function _sparkSvg(series){
  const w=238, h=46, pad=3;
  const vals=(series||[]).filter(v=>typeof v==="number");
  if(vals.length<2) return '<div style="color:#555;font-size:10px">추세 데이터 없음</div>';
  let mn=Math.min(...vals), mx=Math.max(...vals); if(mn===mx){mn-=1;mx+=1;}
  const X=i=>pad+i*(w-2*pad)/(series.length-1);
  const Y=v=>pad+(h-2*pad)*(1-(v-mn)/(mx-mn));
  const pts=series.map((v,i)=>(typeof v==="number")?`${X(i).toFixed(1)},${Y(v).toFixed(1)}`:null).filter(Boolean).join(" ");
  const lastI=series.length-1, lastV=series[lastI];
  const prevV=series[lastI-1];
  const up=(typeof lastV==="number"&&typeof prevV==="number")?lastV>=prevV:true;
  const col=up?"#2ecc71":"#e74c3c";
  // 0 기준선 (범위 안일 때)
  let zero=""; if(mn<0&&mx>0){ const zy=Y(0).toFixed(1); zero=`<line x1="${pad}" y1="${zy}" x2="${w-pad}" y2="${zy}" stroke="#333" stroke-width="1" stroke-dasharray="2 2"/>`; }
  const cx=X(lastI).toFixed(1), cy=Y(lastV).toFixed(1);
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="display:block;overflow:visible">`
    +zero+`<polyline points="${pts}" fill="none" stroke="${col}" stroke-width="1.6"/>`
    +`<circle cx="${cx}" cy="${cy}" r="3" fill="${col}"/>`
    +`<circle cx="${cx}" cy="${cy}" r="3" fill="${col}" opacity="0.55">`
    +`<animate attributeName="r" values="3;8" dur="1.3s" repeatCount="indefinite"/>`
    +`<animate attributeName="opacity" values="0.55;0" dur="1.3s" repeatCount="indefinite"/>`
    +`</circle></svg>`;
}

function _taeriniHtml(d){
  const H=t=>(t+"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const HD=`<div class="tk-hd">📊 투자 참고지표</div>`;
  const dateLine=d&&d.date?`<div class="tk-date">${H(d.date)}</div>`:"";
  if(!d || !d.found) return HD+`<div class="tk-empty">미수록${d&&d.date?` (${H(d.date)})`:""}</div>`;
  const s=d.stock||{}, rows=[];
  const C=(t,c)=>`<span style="color:${c}">${H(t)}</span>`;
  const R=(lab,val,sub,tip)=>`<div class="tk-row"><div class="tk-top">`
    +`<span class="tk-lab${tip?' hint':''}"${tip?` title="${H(tip)}"`:''}>${lab}</span>`
    +`<span class="tk-val">${val}</span></div>`
    +(sub?`<div class="tk-sub">${H(sub)}</div>`:'')+`</div>`;

  // 수급빈집 — 전 종목 %ile + 추세 스파크라인(접기/펼치기)
  if(s.osc){
    const g=(s.osc.group||"")+""; let col="#9a9a9a";
    if(g.indexOf("완전빈집")>=0)col="#2ecc71";
    else if(g.indexOf("반빈집")>=0)col="#7bd88f";
    else if(g.indexOf("과열")>=0)col="#e74c3c";
    else if(g.indexOf("매수우위")>=0)col="#e0803c";
    const pct=s.osc.pct!=null?` <span style="color:#888">${Math.round(s.osc.pct)}%ile</span>`:"";
    const tr=s.osc.trend||"";  // ↑ 재진입 / ↓ 빈집심화 / → 횡보
    const trCol=tr.indexOf("↑")>=0?"#2ecc71":tr.indexOf("↓")>=0?"#e74c3c":"#888";
    const car=`<span class="tk-caret" id="tk-spk-caret">${_oscSpkOpen?"▾":"▸"}</span>`;
    const tip="수급 오실레이터 백분위(0~100). 낮을수록 빈집=외국인·기관 매수 유입 공백(반등 여지 큼). 완전빈집≤10 · 반빈집≤25 · 중립 · 매수우위≥75 · 과열≥90. 아래 그래프=최근 수급 추세(상승=유입, 하락=이탈)";
    const spk=s.osc.series&&s.osc.series.length>1
      ? `<div id="tk-spk-wrap" style="display:${_oscSpkOpen?"":"none"}">`
        +`<div class="tk-spk">${_sparkSvg(s.osc.series)}</div>`
        +`<div class="tk-spk-cap"><span>← ${d.live?"최근 30일":"30주"}</span><span style="color:${trCol}">${H(tr)}</span></div></div>`
      : "";
    const liveBadge=d.live?` <span style="color:#f0a500;font-size:10px" title="엑셀 미수록 종목 — KIS 일별 외인·기관 순매수로 실시간 계산(엑셀 %ile과 다른 별도 지표)">⚡실시간</span>`:"";
    rows.push(`<div class="tk-row tk-osc-row" onclick="_toggleSpark()"><div class="tk-top">`
      +`<span class="tk-lab hint" title="${H(tip)}">수급빈집${liveBadge}${car}</span>`
      +`<span class="tk-val">${C(g||"-",col)}${pct}</span></div>${spk}</div>`);
  }
  // RS
  if(s.rs){
    const up=s.rs.bucket==="상위";
    rows.push(R("RS",`${s.rs.rs_avg!=null?Number(s.rs.rs_avg).toFixed(1):"-"} ${C(s.rs.bucket||"",up?"#e74c3c":"#3aa0ff")}`,
      s.rs.norm!=null?`정규화 ${s.rs.norm} / 100`:null,
      "상대강도(Mansfield RS). 코스피 대비 초과수익률. 60·120·250일 평균. 상위=코스피보다 강함, 하위=약함"));
  }
  // TP — 증권사 집계
  if(s.tp){
    const up=s.tp.dir==="상향"; const cnt=s.tp.count||0;
    const high=s.tp.high!=null?Math.round(s.tp.high/1000).toLocaleString()+"천":null;
    const head=C((up?"상향":"하향")+" "+cnt+"곳", up?"#e74c3c":"#3aa0ff");
    const sub=[high?`최고 ${high}`:null, s.tp.brokerage, (s.tp.date||"").slice(5)].filter(Boolean).join(" · ");
    rows.push(R("TP", head, sub||null,
      "출처: 태린이 '추정이익 변경' 파일(증권사 목표주가 리비전). 값=목표가를 상/하향한 증권사 수. 아래=최고 목표가·가장 최근 증권사·발표일"));
  }
  // 컨센 — 직관적 라벨
  if(s.consensus){
    const t=s.consensus.type||""; const good=(t==="컨센상향"||t==="서프라이즈");
    const label={"컨센상향":"이익전망 ↑","컨센하향":"이익전망 ↓","서프라이즈":"어닝 서프라이즈","쇼크":"어닝 쇼크"}[t]||t;
    let sub="";
    if((t==="서프라이즈"||t==="쇼크")&&s.consensus.surprise_rate!=null){
      const sr=Math.round(s.consensus.surprise_rate*100);
      sub=`실적이 예상 대비 ${sr>0?"+":""}${sr}% ${t==="서프라이즈"?"상회":"하회"}`;
    } else if(s.consensus.csen_chg!=null){
      sub=`이익전망 ${(s.consensus.csen_chg*100).toFixed(1)}% ${s.consensus.csen_chg>=0?"상향":"하향"}`;
    }
    if(s.consensus.date) sub=(sub?sub+" · ":"")+`${s.consensus.date} 기준`;
    rows.push(R("컨센",C(label,good?"#e74c3c":"#3aa0ff"), sub||null,
      "애널리스트 이익 전망의 방향. '어닝 서프라이즈/쇼크'=실제 실적이 예상을 상회/하회. 아래=정도(%)와 기준일"));
  }
  // 가속 — 등급 + 그룹 설명
  if(s.accel && s.accel.score!=null){
    const sc=Number(s.accel.score);
    const lvl=sc>=0.95?"최상위":sc>=0.8?"상위":sc>=0.5?"중상":"보통";
    const gmap={"추정이익3개+":"영업이익추정 3건+ 상향","추정이익1개+":"영업이익추정 1건+ 상향","시총상위300":"시총상위300 내","주당순이익1개+":"EPS 1건+ 상향(태린이 최우선)"};
    const g=gmap[s.accel.group]||s.accel.group||"";
    rows.push(R("가속",C(lvl,sc>=0.8?"#e74c3c":"#e0b94a")+` <span style="color:#888">${sc.toFixed(2)}</span>`, g||null,
      "가속화모멘텀: 애널리스트 영업이익 추정치 상향이 '가속'되는 강도(0~1, 1.0=최상위). 같은 업종이 여러 개 몰리면 주도업종 신호. 그룹 '추정이익 N건+'=영업이익 추정치를 상향한 리포트가 N건 이상, 'EPS 1건+'=주당순이익 상향(태린이가 가장 중시)"));
  }
  // ETF 비중
  if(s.etf){
    const inc=s.etf.action==="비중증가";
    const diff=s.etf.diff!=null?` <span style="color:#888">${s.etf.diff>0?"+":""}${s.etf.diff}%p</span>`:"";
    rows.push(R("ETF비중",C(inc?"편입확대↑":"축소·편출↓",inc?"#e74c3c":"#3aa0ff")+diff, null,
      "액티브ETF들의 이 종목 편입비중 변화(직전 스냅샷 대비). 확대=매집 / 축소·편출=차익·이탈. 편출 '시점'은 일별 추적 예정"));
  }
  // 실적일정
  if(s.schedule&&s.schedule.dday!=null){ const dd=s.schedule.dday;
    rows.push(R("실적",`D${dd<=0?dd:"+"+dd}`, s.schedule.date||null,
      "다가오는 실적발표·수주 이벤트까지 남은 일수(D-day)")); }

  if(!rows.length) return HD+`<div class="tk-empty">미수록 (${H(d.date||"")})</div>`;
  return HD + rows.join("") + dateLine;
}

async function loadStockNews(code, name){
  const box=document.getElementById("chart-news");
  if(!box) return;
  box.innerHTML='<div class="cn-load">📰 뉴스 불러오는 중…</div>';
  try{
    const d=await (await fetch("/api/stock_summary?code="+encodeURIComponent(code)
      +"&name="+encodeURIComponent(name||""))).json();
    // 다른 종목으로 바뀌었으면 무시
    if(_chartCode!==code) return;
    const news=d.news||[];
    let html='<div class="cn-hd">📰 '+esc(name||code)+' 뉴스</div>';
    if(d.summary){
      html+='<div class="cn-sum">'+_mdSum(d.summary)
        +'<div class="cn-src">🤖 STOCK BRAIN · 뉴스 '+(d.sources||news.length)+'건 종합</div></div>';
    }else if(d.error){
      html+='<div class="cn-load" style="margin-bottom:8px">🤖 '+esc(d.error)+'</div>';
    }
    if(news.length){
      html+=news.map(n=>`<a class="cn-item" href="${esc(n.url||'#')}" target="_blank" rel="noopener">
        ${n.source==="telegram"?"✈️ ":""}${esc(n.title||'')}<div class="cn-meta">${esc(n.src||'')} · ${esc(n.date||'')}${n.related>1?' · 관련'+n.related:''}</div></a>`).join("");
    }else if(!d.summary){
      html+='<div class="cn-load">관련 뉴스가 없습니다.</div>';
    }
    box.innerHTML=html;
  }catch(e){ box.innerHTML='<div class="cn-load">뉴스 로드 실패</div>'; }
}

// ── 컨센흐름 차트 오버레이 (주가 × 영업이익 컨센) ──
let _cfSeries=null, _cfData=null, _cfMode="12mf", _cfOn=false;
let _cfArrowEl=null, _cfArrowTimer=null, _cfLast=null, _cfUp=true;
function _cfClearArrow(){
  if(_cfArrowTimer){ clearInterval(_cfArrowTimer); _cfArrowTimer=null; }
  if(_cfArrowEl){ try{_cfArrowEl.remove();}catch(_){} _cfArrowEl=null; }
}
function _cfPositionArrow(){
  if(!_cfArrowEl||!_cfSeries||!_cfLast||!_chart) return;
  try{
    const x=_chart.timeScale().timeToCoordinate(_cfLast.time);
    const y=_cfSeries.priceToCoordinate(_cfLast.value);
    if(x==null||y==null){ _cfArrowEl.style.display="none"; return; }
    _cfArrowEl.style.display=""; _cfArrowEl.style.left=x+"px"; _cfArrowEl.style.top=y+"px";
  }catch(_){}
}
function _cfMakeArrow(){
  const cont=document.getElementById("tv_chart_container"); if(!cont||!_cfSeries||!_cfLast) return;
  _cfArrowEl=document.createElement("div"); _cfArrowEl.className="cf-end";
  _cfArrowEl.innerHTML='<span class="cf-dot"></span><span class="cf-lab">컨센추이</span>';
  cont.appendChild(_cfArrowEl);
  _cfPositionArrow();
  _cfArrowTimer=setInterval(_cfPositionArrow, 200);   // 팬·줌·시세변화 시 위치만 갱신(라인 불변)
}
function _cfInitState(){
  try{ _cfOn=localStorage.getItem("cf_on")==="1"; _cfMode=localStorage.getItem("cf_mode")||"12mf"; }catch(_){}
  const ctl=document.getElementById("cf-ctl"), tg=document.getElementById("cf-toggle");
  if(ctl) ctl.classList.toggle("on", _cfOn);
  if(tg) tg.classList.toggle("active", _cfOn);
  document.querySelectorAll("#cf-ctl .cf-btn[data-cf]").forEach(b=>b.classList.toggle("active", b.dataset.cf===_cfMode));
}
async function _loadConsensus(code){
  _cfData=null;
  try{
    const r=await fetch("/api/taerini_consensus?code="+encodeURIComponent(code));
    const j=await r.json();
    if(j&&j.found) _cfData=j;
  }catch(_){}
  _cfRender();
}
function _cfRender(){
  _cfClearArrow();
  if(_cfSeries){ try{_chart.removeSeries(_cfSeries);}catch(_){} _cfSeries=null; }
  if(!_cfOn || !_cfData || !_chart || _isIntraday()) return;   // 분봉에선 컨센(주간) 오버레이 생략
  const dates=_cfData.dates||[], arr=(_cfData.series||{})[_cfMode];
  if(!arr || !arr.length) return;
  const data=[];
  for(let i=0;i<dates.length && i<arr.length;i++){ if(arr[i]!=null) data.push({time:dates[i], value:arr[i]}); }
  if(!data.length) return;
  try{
    _cfSeries=_chart.addLineSeries({priceScaleId:"cf", color:"#e74c3c", lineWidth:2,
      priceLineVisible:false, lastValueVisible:false, crosshairMarkerVisible:true});  // 값라벨 숨김
    _chart.priceScale("cf").applyOptions({scaleMargins:{top:0.12,bottom:0.28}, visible:false});
    _cfSeries.setData(data);
    // 라인은 고정 — 끝점에 HTML 화살표만 CSS로 깜빡임
    _cfLast=data[data.length-1]; const prev=data.length>1?data[data.length-2]:null;
    _cfUp=!prev || _cfLast.value>=prev.value;
    _cfMakeArrow();
  }catch(_){ _cfSeries=null; }
}
function _cfToggle(){
  _cfOn=!_cfOn;
  try{ localStorage.setItem("cf_on", _cfOn?"1":"0"); }catch(_){}
  const ctl=document.getElementById("cf-ctl"), tg=document.getElementById("cf-toggle");
  if(ctl) ctl.classList.toggle("on", _cfOn);
  if(tg) tg.classList.toggle("active", _cfOn);
  if(_cfOn && !_cfData && _chartCode) _loadConsensus(_chartCode); else _cfRender();
}
function _cfSel(mode){
  _cfMode=mode;
  try{ localStorage.setItem("cf_mode", mode); }catch(_){}
  document.querySelectorAll("#cf-ctl .cf-btn[data-cf]").forEach(b=>b.classList.toggle("active", b.dataset.cf===mode));
  _cfRender();
}

// ── 차트 상단 종목 검색 ──
let _csResults=[], _csTimer=null, _csIdx=-1;
function _csSearch(q){
  clearTimeout(_csTimer);
  if(!q.trim()){ _csClose(); return; }
  _csTimer=setTimeout(async()=>{
    try{
      const r=await fetch("/api/stock_search?q="+encodeURIComponent(q.trim()));
      const list=await r.json();
      if(!Array.isArray(list)||!list.length){ _csResults=[]; _csClose(); return; }
      _csResults=list; _csIdx=-1; _csRenderAc();
    }catch(e){ _csClose(); }
  },200);
}
function _csRenderAc(){
  const ac=document.getElementById("cs-ac"); if(!ac)return;
  ac.innerHTML=_csResults.map((s,i)=>
    `<div class="cs-item${i===_csIdx?' sel':''}" onmousedown="_csPick(${i})">`
    +`<span>${esc(s.name)}</span><span class="c">${esc(s.code)}</span></div>`).join("");
  ac.classList.add("open");
}
function _csClose(){ const ac=document.getElementById("cs-ac"); if(ac)ac.classList.remove("open"); _csIdx=-1; }
function _csPick(i){
  const s=_csResults[i]; if(!s)return;
  _csClose(); const inp=document.getElementById("cs-input"); if(inp)inp.value="";
  openStockChart(s.code, s.name);
}
function _csKey(e){
  const ac=document.getElementById("cs-ac");
  const open=ac&&ac.classList.contains("open")&&_csResults.length;
  if(e.key==="ArrowDown"){ if(!open)return; e.preventDefault(); _csIdx=Math.min(_csResults.length-1,_csIdx+1); _csRenderAc(); }
  else if(e.key==="ArrowUp"){ if(!open)return; e.preventDefault(); _csIdx=Math.max(0,_csIdx-1); _csRenderAc(); }
  else if(e.key==="Enter"){ if(!open)return; e.preventDefault(); _csPick(_csIdx>=0?_csIdx:0); }
  else if(e.key==="Escape"){ _csClose(); }
}

function openStockChart(code, name){
  if(!code) return;

  }

  _chartCode=code; _chartName=name; _chartTf=saved.tf||"D"; _chartRows=[];

  m.innerHTML=`<div class="chart-box">
    <div class="modal-hd">
      <span>📈 ${esc(name||code)} <span style="color:#666;font-size:12px;font-weight:400">${esc(code)}</span>

      <span style="display:flex;align-items:center;gap:8px" onmousedown="event.stopPropagation()" ondblclick="event.stopPropagation()">
        <span class="cs-wrap">
          <input id="cs-input" class="cs-input" placeholder="🔍 종목 검색…" autocomplete="off"
            oninput="_csSearch(this.value)" onkeydown="_csKey(event)" onblur="setTimeout(_csClose,150)">
          <div id="cs-ac" class="cs-ac"></div>
        </span>
        <button class="modal-x" onclick="closeStockChart()">✕</button>
      </span>
    </div>
    <div class="chart-tf">

      <span id="chart-legend" class="chart-legend"></span>

    <div class="chart-tools">

      <button class="ct-btn" data-ma="20" onclick="toggleMA(20)">20</button>
      <button class="ct-btn" data-ma="60" onclick="toggleMA(60)">60</button>
      <button class="ct-btn" data-ma="120" onclick="toggleMA(120)">120</button>
      <button class="ct-btn" data-ind="boll" onclick="toggleInd('boll')">볼린저</button>
      <button class="ct-btn" data-ind="rsi" onclick="toggleOsc('rsi')">RSI</button>
      <button class="ct-btn" data-ind="macd" onclick="toggleOsc('macd')">MACD</button>
      <span class="ct-sep"></span>
      <span class="ct-label">그리기</span>

      <button class="ct-btn" data-draw="circle" onclick="setDraw('circle')">○ 원</button>
      <button class="ct-btn" data-draw="pen" onclick="setDraw('pen')">✏️ 펜</button>
      <button class="ct-btn" onclick="undoDraw()">↩ 이전 삭제</button>
      <span class="ct-sep"></span>
      <span class="ct-label">색</span>
      <button class="ct-sw active" data-c="#f0c040" style="background:#f0c040" onclick="setDrawColor('#f0c040',this)"></button>
      <button class="ct-sw" data-c="#e74c3c" style="background:#e74c3c" onclick="setDrawColor('#e74c3c',this)"></button>
      <button class="ct-sw" data-c="#3aa0ff" style="background:#3aa0ff" onclick="setDrawColor('#3aa0ff',this)"></button>
      <button class="ct-sw" data-c="#2ecc71" style="background:#2ecc71" onclick="setDrawColor('#2ecc71',this)"></button>
      <button class="ct-sw" data-c="#ffffff" style="background:#ffffff" onclick="setDrawColor('#ffffff',this)"></button>
