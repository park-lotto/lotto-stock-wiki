<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>🧠 브레인 — 채널 사고 복제</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#141416; --panel2:#1b1b1f; --line:#2a2a30;
    --gold:#e8c86a; --gold-dim:#a8904a; --txt:#e8e6e0; --muted:#8a8a92;
    --bull:#e05a5a; --bear:#4a86e8; --neu:#9a9aa2; --risk:#e0a24a;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Malgun Gothic",sans-serif;}
  a{color:inherit;text-decoration:none}
  .nav{display:flex;gap:6px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line);
    background:#0e0e11;position:sticky;top:0;z-index:10}
  .nav .brand{font-family:"Instrument Serif",Georgia,serif;font-size:1.15rem;color:var(--gold);margin-right:14px}
  .nav a{padding:6px 14px;border-radius:7px;font-size:.84rem;color:var(--muted)}
  .nav a.active,.nav a:hover{color:var(--gold);background:var(--panel)}
  .wrap{display:grid;grid-template-columns:300px 1fr;gap:0;height:calc(100vh - 49px)}
  .side{border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px;background:#0e0e11}
  .side h2{font-size:.72rem;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;margin:4px 6px 12px}
  .pcard{padding:12px 13px;border:1px solid var(--line);border-radius:11px;margin-bottom:9px;cursor:pointer;
    background:var(--panel);transition:.12s}
  .pcard:hover{border-color:var(--gold-dim)}
  .pcard.sel{border-color:var(--gold);background:var(--panel2)}
  .pcard .nm{font-size:.98rem;font-weight:600}
  .pcard .meta{font-size:.72rem;color:var(--muted);margin-top:5px;display:flex;gap:9px;flex-wrap:wrap}
  .pcard .badge{color:var(--gold)}
  .addbtn{width:100%;padding:9px;border:1px dashed var(--line);border-radius:10px;background:transparent;
    color:var(--muted);cursor:pointer;font-size:.82rem;margin-top:6px}
  .addbtn:hover{border-color:var(--gold-dim);color:var(--gold)}
  .addform{display:none;margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .addform.open{display:block}
  .addform input{width:100%;margin-bottom:6px;padding:7px 9px;background:#0b0b0d;border:1px solid var(--line);
    border-radius:7px;color:var(--txt);font-size:.8rem}
  .addform .row{display:flex;gap:6px}
  .addform button{flex:1;padding:7px;border-radius:7px;border:1px solid var(--gold-dim);background:var(--gold);
    color:#000;font-weight:600;cursor:pointer;font-size:.8rem}
  .addform .cancel{background:transparent;color:var(--muted);border-color:var(--line)}
  .main{overflow-y:auto;padding:22px 30px}
  .empty{color:var(--muted);text-align:center;margin-top:16vh;font-size:.95rem}
  .phead{display:flex;align-items:baseline;gap:12px;margin-bottom:4px}
  .phead h1{font-family:"Instrument Serif",Georgia,serif;font-size:2rem;margin:0;color:var(--gold)}
  .phead .sub{font-size:.8rem;color:var(--muted)}
  .refresh{margin-left:auto;font-size:.76rem;color:var(--muted);border:1px solid var(--line);background:transparent;
    padding:5px 11px;border-radius:7px;cursor:pointer}
  .refresh:hover{color:var(--gold);border-color:var(--gold-dim)}
  .sec{margin-top:22px}
  .sec > .lbl{font-size:.74rem;letter-spacing:.13em;text-transform:uppercase;color:var(--muted);
    border-bottom:1px solid var(--line);padding-bottom:6px;margin-bottom:11px}
  .sec > .lbl b{color:var(--gold)}
  .stance{padding:10px 13px;border:1px solid var(--line);border-left-width:3px;border-radius:9px;margin-bottom:8px;
    background:var(--panel)}
  .stance .top{display:flex;gap:9px;align-items:center;font-size:.86rem;margin-bottom:4px}
  .stance .asset{font-weight:600}
  .stance .sig{font-size:.68rem;padding:1px 7px;border-radius:20px;border:1px solid currentColor}
  .stance .dt{margin-left:auto;font-size:.7rem;color:var(--muted)}
  .stance .txt{font-size:.85rem;color:#d4d2cc;line-height:1.5}
  .sig.bullish,.stance.bullish{color:var(--bull)} .stance.bullish{border-left-color:var(--bull)}
  .sig.bearish,.stance.bearish{color:var(--bear)} .stance.bearish{border-left-color:var(--bear)}
  .sig.risk,.stance.risk{color:var(--risk)} .stance.risk{border-left-color:var(--risk)}
  .sig.neutral,.stance.neutral,.sig.catalyst{color:var(--neu)} .stance.neutral{border-left-color:var(--neu)}
  .stance .asset,.stance .txt{color:var(--txt)}
  .log{font-size:.82rem;line-height:1.55;color:#cfcdc7;padding:4px 0;border-bottom:1px solid #1a1a1e}
  .log .ldt{color:var(--muted);font-variant-numeric:tabular-nums}
  .log .lct{color:var(--gold-dim);font-size:.7rem}
  details.skel{margin-top:6px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:2px 14px}
  details.skel summary{cursor:pointer;padding:10px 0;font-size:.82rem;letter-spacing:.13em;text-transform:uppercase;
    color:var(--muted)}
  details.skel[open] summary{color:var(--gold)}
  .md h1{font-family:"Instrument Serif",Georgia,serif;color:var(--gold);font-size:1.35rem}
  .md h2{color:var(--gold-dim);font-size:1rem;border-bottom:1px solid var(--line);padding-bottom:4px;margin-top:18px}
  .md b{color:var(--gold)} .md li{margin:3px 0;color:#cfcdc7;font-size:.85rem;line-height:1.5}
  .md p{color:#cfcdc7;font-size:.85rem}
  .cnt{color:var(--muted);font-size:.78rem;font-weight:400}
</style>
</head>
<body>
<div class="nav">
  <span class="brand">🧠 STOCK BRAIN</span>
  <a href="/">홈</a><a href="/market">섹터맵</a><a href="/insights">인사이트</a>
  <a href="/sources">소스</a><a href="/brain" class="active">브레인</a>
</div>

<div class="wrap">
  <aside class="side">
    <h2>추적 채널</h2>
    <div id="people"></div>
    <button class="addbtn" onclick="toggleAdd()">+ 채널 추가</button>
    <div class="addform" id="addform">
      <input id="f_name" placeholder="채널 이름 (예: 태린이아빠)">
      <input id="f_sources" placeholder="atoms source_name들 (쉼표로, 텔레·유튜브)">
      <input id="f_trust" placeholder="신뢰등급 (A/B/C, 기본 B)" value="B">
      <div class="row">
        <button onclick="addPerson()">추가</button>
        <button class="cancel" onclick="toggleAdd()">취소</button>
      </div>
    </div>
  </aside>

  <main class="main" id="main">
    <div class="empty">왼쪽에서 채널을 선택하세요.</div>
  </main>
</div>

<script>
const SIG_KO = {bullish:"긍정",bearish:"부정",neutral:"중립",risk:"리스크",catalyst:"촉매",data:"데이터"};
let SELECTED = null;

function esc(s){return (s||"").replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

// 아주 가벼운 마크다운 → HTML (헤더/볼드/불릿만)
function mdToHtml(md){
  const lines = (md||"").split("\n"); let out=[], inUl=false;
  const closeUl=()=>{if(inUl){out.push("</ul>");inUl=false;}};
  for(let raw of lines){
    let l = esc(raw);
    l = l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>");
    if(/^#\s/.test(raw)){closeUl();out.push("<h1>"+l.replace(/^#\s/,"")+"</h1>");}
    else if(/^##\s/.test(raw)){closeUl();out.push("<h2>"+l.replace(/^##\s/,"")+"</h2>");}
    else if(/^\s*[-*]\s/.test(raw)){if(!inUl){out.push("<ul>");inUl=true;}
      out.push("<li>"+l.replace(/^\s*[-*]\s/,"")+"</li>");}
    else if(/^>\s/.test(raw)){closeUl();out.push("<p style='color:#8a8a92'>"+l.replace(/^>\s/,"")+"</p>");}
    else if(raw.trim()===""){closeUl();}
    else {closeUl();out.push("<p>"+l+"</p>");}
  }
  closeUl(); return out.join("");
}

async function loadPeople(){
  const r = await fetch("/api/brain/people"); const people = await r.json();
  const el = document.getElementById("people");
  if(!people.length){el.innerHTML="<div class='empty' style='margin-top:20px;font-size:.82rem'>채널 없음.<br>아래에서 추가하세요.</div>";return;}
  el.innerHTML = people.map(p=>`
    <div class="pcard ${p.name===SELECTED?'sel':''}" onclick="selectPerson('${encodeURIComponent(p.name)}')">
      <div class="nm">${esc(p.display)}</div>
      <div class="meta">
        <span class="badge">스탠스 ${p.stance_count}</span>
        <span>${p.latest_date||'—'}</span>
        <span>${p.trust||''}${p.has_skeleton?'':' · 골격없음'}</span>
      </div>
    </div>`).join("");
}

async function selectPerson(enc){
  const name = decodeURIComponent(enc); SELECTED = name;
  loadPeople();
  const main = document.getElementById("main");
  main.innerHTML = "<div class='empty'>불러오는 중…</div>";
  const r = await fetch("/api/brain/"+enc);
  if(!r.ok){main.innerHTML="<div class='empty'>불러오기 실패</div>";return;}
  const v = await r.json();
  render(v);
}

function stanceCard(a){
  const sig = a.signal||"neutral";
  const asset = a.asset || a.sector || "";
  return `<div class="stance ${sig}">
    <div class="top"><span class="asset">${esc(asset)}</span>
      <span class="sig ${sig}">${SIG_KO[sig]||sig}</span>
      <span class="dt">${a.date||''}</span></div>
    <div class="txt">${esc(a.content)}</div></div>`;
}

function render(v){
  const main = document.getElementById("main");
  const stances = v.live_stance||[], log = v.speech_log||[];
  main.innerHTML = `
    <div class="phead">
      <h1>${esc(v.display)}</h1>
      <span class="sub">신뢰 ${esc(v.trust)} · 추적 ${esc(v.tracking_since||'')} · 소스 ${v.sources.map(esc).join(', ')}</span>
    </div>

    <div class="sec">
      <div class="lbl">🔴 지금 포지션 <b>${stances.length}</b> <span class="cnt">— 그가 지금 뭘 어떻게 보나 (stance_key 기반)</span></div>
      ${stances.length? stances.map(stanceCard).join("") : "<div class='cnt'>활성 스탠스 없음</div>"}
    </div>

    <div class="sec">
      <div class="lbl">💬 최근 발언 <b>${log.length}</b> <span class="cnt">— 최근 14일</span></div>
      ${log.map(a=>`<div class="log"><span class="ldt">${a.date}</span>
        <span class="lct">[${a.content_type||''}]</span> ${esc((a.sector||'')+'/'+(a.asset||''))}: ${esc(a.content)}</div>`).join("")}
    </div>

    <div class="sec">
      <div class="lbl">📐 사고 골격 <span class="cnt">— 철학·프레임워크·판단규칙 (Obsidian에서 수정)</span></div>
      <details class="skel" open>
        <summary>펼치기 / 접기</summary>
        <div class="md">${v.skeleton_md? mdToHtml(v.skeleton_md) : "<p class='cnt'>골격 미작성 — build_brain 시드 또는 직접 작성</p>"}</div>
      </details>
    </div>`;
}

function toggleAdd(){document.getElementById("addform").classList.toggle("open");}

async function addPerson(){
  const name = document.getElementById("f_name").value.trim();
  const sources = document.getElementById("f_sources").value.split(",").map(s=>s.trim()).filter(Boolean);
  const trust = document.getElementById("f_trust").value.trim() || "B";
  if(!name || !sources.length){alert("이름과 source_name을 입력하세요.");return;}
  const r = await fetch("/api/brain/people/add",{method:"POST",headers:{"Content-Type":"application/json"},
    body:JSON.stringify({name,sources,trust})});
  const res = await r.json();
  if(res.ok){toggleAdd();document.getElementById("f_name").value="";document.getElementById("f_sources").value="";
    loadPeople();} else {alert(res.error||"추가 실패");}
}

loadPeople();
</script>
</body>
</html>
