# 라이브 /etc/apache2/sites-enabled/shopping-shorts-le-ssl.conf 사본(2026-10-26 관제 272 기록용 — 서버가 원본, certbot 이 만든 443 설정)
<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName shoppingshorts.duckdns.org
    ProxyPreserveHost On

    # ── stmaker.kr 로 화면 넘기기(2026-10-25 사장님) — 사람이 보는 GET 만. 확장·유저스크립트 주소는 그대로 ──
    RewriteEngine on
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteCond %{REQUEST_URI} !^/(api/|grab|.*\.user\.js$|\.well-known/)
    RewriteRule ^ https://stmaker.kr%{REQUEST_URI} [END,NE,R=301]

    # 옛 주소로 **창을 여는** /api/ (담기 팝업 /api/grab · 채널추가 · 렌즈 등) 도 새 주소로 — 로그인 쿠키가 stmaker.kr 에만 있어
    # 옛 주소 팝업이 "로그인이 필요해요"로 막혔다(2026-10-26 사장님 제보). 설치된 확장은 옛 주소가 박혀 있어 서버에서 넘긴다.
    # 확장이 뒤에서 부르는 fetch(Sec-Fetch-Mode: cors 등)는 그대로 둔다 — 넘기면 확장 권한 밖 주소라 막힌다.
    RewriteCond %{REQUEST_METHOD} =GET
    RewriteCond %{HTTP:Sec-Fetch-Mode} =navigate
    RewriteCond %{REQUEST_URI} ^/api/
    RewriteRule ^ https://stmaker.kr%{REQUEST_URI} [END,NE,R=302]

    # ── 미리보기 분기(2026-08-26) — 쿠키가 있는 브라우저만 8850으로 ──
    RewriteEngine on
    RewriteCond %{QUERY_STRING} (^|&)pv=1(&|$)
    RewriteRule ^(.*)$ $1? [CO=ssprev:1:shoppingshorts.duckdns.org:480:/,R=302,L]
    RewriteCond %{QUERY_STRING} (^|&)pv=0(&|$)
    RewriteRule ^(.*)$ $1? [CO=ssprev:0:shoppingshorts.duckdns.org:-1:/,R=302,L]
    RewriteCond %{HTTP_COOKIE} (^|;\s*)ssprev=1
    RewriteRule ^/?(.*)$ http://127.0.0.1:8850/$1 [P,L]
    ProxyPassReverse / http://127.0.0.1:8850/
    # ──────────────────────────────────────────────────────────────

        # X-Sendfile(2026-10-01 관제 062): 파이썬이 X-Sendfile 헤더로 경로만 주면 아파치가 파일을 보낸다(Range·HEAD 포함)
    XSendFile On
    XSendFilePath /home/ubuntu/lotto-stock-wiki/shopping_shorts/data
    XSendFilePath /home/ubuntu/lotto-stock-wiki/shopping_shorts/static
    ProxyPass / http://127.0.0.1:8849/
    ProxyPassReverse / http://127.0.0.1:8849/
    ProxyTimeout 3700
RewriteEngine on
# Some rewrite rules in this file were disabled on your HTTPS site,
# because they have the potential to create redirection loops.

# RewriteCond %{SERVER_NAME} =shoppingshorts.duckdns.org
# RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]

SSLCertificateFile /etc/letsencrypt/live/shoppingshorts.duckdns.org/fullchain.pem
SSLCertificateKeyFile /etc/letsencrypt/live/shoppingshorts.duckdns.org/privkey.pem
Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
