<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>영상 즐겨찾기 · 쇼핑쇼츠</title>
<style>
  :root{--bg:#0a0e14;--panel:#111722;--line:#1e2735;--txt:#e6edf3;--sub:#8b98a9;--accent:#2f81f7;--accent2:#6d3bef;--fire:#ff6b35;--ok:#2ea043;}
  *{box-sizing:border-box}
  body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic',system-ui,sans-serif;margin:0;min-height:100vh}
  .main{flex:1;padding:24px 32px;overflow:auto}
  .head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;margin-bottom:18px;flex-wrap:wrap}
  .head h2{margin:0;font-size:22px}
  .head .desc{color:var(--sub);font-size:13px;margin-top:4px}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  .toolbar button{font-family:inherit;border:0;border-radius:9px;padding:9px 16px;cursor:pointer;font-size:13px}
  .btn-ghost{background:var(--panel);border:1px solid var(--line);color:var(--txt)}
  .btn-send{background:linear-gradient(90deg,var(--accent2),#8b5cf6);color:#fff}
  .btn-send:disabled{opacity:.4;cursor:default}
  #selCount{font-size:12px;color:var(--sub)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column;cursor:default}
  .card.sel{border-color:var(--accent2);box-shadow:0 0 0 2px rgba(109,59,239,.35)}
  .thumb{position:relative;cursor:pointer;background:#000}
  .thumb img{width:100%;height:220px;object-fit:cover;display:block}
  .thumb .chk{position:absolute;top:8px;left:8px;font-size:18px;filter:drop-shadow(0 1px 3px rgba(0,0,0,.8))}
  .body{padding:12px;flex:1;display:flex;flex-direction:column}
  .rank{font-size:13px;color:var(--txt)}
  .btns{display:flex;gap:6px;margin-top:auto;padding-top:10px}
  .btns button{flex:1;font-size:11px;padding:7px 4px;border-radius:7px;border:1px solid var(--line);background:#0d131c;color:var(--txt);cursor:pointer}
  .btns button.view{border-color:#2f81f7;color:#7db4ff}
  .empty{color:var(--sub);text-align:center;padding:60px;grid-column:1/-1}
</style>
</head>
<body>
<main class="main">
  <div class="head">
    <div>
      <h2>⭐ 영상 즐겨찾기</h2>
      <div class="desc">담아둔 레퍼런스 영상을 모아보고, 고른 것만 영상 제작으로 보냅니다.</div>
    </div>
    <div class="toolbar">
      <span id="selCount"></span>
      <button class="btn-ghost" onclick="selectAll()">전체선택</button>
      <button class="btn-ghost" onclick="selectNone()">선택해제</button>
      <button class="btn-send" onclick="sendToProduce()">🎬 영상제작으로 보내기</button>
    </div>
  </div>
  <div class="cards" id="cards"></div>
</main>
<script>
function esc(s){ return (s==null?"":String(s)).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
let ITEMS=[];
const SELECTED=new Set();
async function loadItems(){
  try{
    const d=await (await fetch('/api/mix/basket')).json();
    ITEMS=(d.items||[]).slice().reverse();   // 최근에 담은 게 맨 위로
  }catch(e){ ITEMS=[]; }
  render();
}
function toggleSelect(sc){
  SELECTED.has(sc)?SELECTED.delete(sc):SELECTED.add(sc);
  render();
}
function selectAll(){ ITEMS.forEach(i=>SELECTED.add(i.shortcode)); render(); }
function selectNone(){ SELECTED.clear(); render(); }
async function removeItem(sc){
  try{ await fetch('/api/mix/basket/remove',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({shortcode:sc})}); }catch(e){}
  SELECTED.delete(sc);
  loadItems();
}
function sendToProduce(){
  // 영상당 역할(대본용/화면용)을 제작소에서 배정하려면 url뿐 아니라 shortcode·name·
  // thumbnail·caption도 넘겨야 한다(대본 추출은 shortcode로). 최대 5개(2단계 입력 상한).
  const picks=ITEMS.filter(i=>SELECTED.has(i.shortcode)).slice(0,5).map(i=>({
    url:i.url||'', shortcode:i.shortcode||'', name:i.name||'',
    thumbnail:i.thumbnail||'', caption:i.caption||''}));
  if(!picks.length){ alert('보낼 항목을 먼저 선택하세요'); return; }
  // 신규 형식(items)과 구버전 호환(urls) 둘 다 저장.
  sessionStorage.setItem('produce_handoff', JSON.stringify(picks));
  sessionStorage.setItem('produce_mix_urls', JSON.stringify(picks.map(p=>p.url).filter(Boolean)));
  location.href='/produce';
}
// 썸네일 소스: 렌즈 결과(gstatic)는 /api/thumb 프록시가 허용호스트가 아니라 400을
// 주므로(검게 나옴) referrerpolicy=no-referrer로 직접 로드. 인스타·틱톡·유튜브 CDN은
// 핫링크 차단이 있어 프록시 경유해야 뜬다(2026-07-14 버그수정).
function thumbSrc(u){
  if(!u) return '';
  // gstatic(구글렌즈)·중국 CDN(샤오홍슈 xhscdn·도우인 douyinpic)은 핫링크 제한이 없어
  // no-referrer로 직접 로드한다. /api/thumb 프록시는 인스타 referer를 붙여 중국 CDN에서
  // 오히려 400/검게 나오므로 프록시를 태우지 않는다(2026-07-18 모음집 검은썸네일 수정).
  if(/gstatic\.com|xhscdn\.com|douyinpic\.com|xhslink\.com/.test(u)) return u;
  return '/api/thumb?url='+encodeURIComponent(u);
}
function _fmtCount(n){
  if(n==null||isNaN(n)) return '';
  n=Number(n);
  if(n>=100000000) return (n/100000000).toFixed(1).replace(/\.0$/,'')+'억';
  if(n>=10000) return (n/10000).toFixed(1).replace(/\.0$/,'')+'만';
  if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,'')+'천';
  return String(n);
}
function _fmtDur(s){
  if(s==null||isNaN(s)) return '';
  s=Math.round(Number(s)); const m=Math.floor(s/60);
  return m+':'+String(s%60).padStart(2,'0');
}
// 속도(시간당) = 댓글수 ÷ 업로드 후 경과시간(시간). ts(업로드 unixtime) 있어야 계산.
function _speed(comments, ts){
  if(comments==null || !ts) return null;
  const hrs=(Date.now()/1000 - Number(ts))/3600;
  return hrs>0 ? comments/hrs : null;
}
// 레퍼런스 랭킹처럼 영상정보 블록(조회수·좋아요·댓글·팔로워·속도·참여밀도·길이) — 담기 보강메타(m).
// ※가속은 시계열 2회 스냅샷이 필요해 일회성 담기론 불가. 팔로워·참여밀도는 플랫폼이 팔로워를
//   줄 때만(틱톡은 안 줌). 조회수·댓글·좋아요·속도·길이는 대부분 나온다.
function metaLine(m){
  if(!m) return '';
  const row=(label,val)=> (val!=null&&val!=='')
    ? `<div style="display:flex;justify-content:space-between;gap:8px"><span style="color:var(--sub)">${label}</span><b>${val}</b></div>` : '';
  const sp=_speed(m.comments, m.ts);
  const body=[
    m.channel?`<div style="opacity:.85;margin-bottom:2px">👤 ${esc(String(m.channel).slice(0,22))}</div>`:'',
    m.followers?row('팔로워', Number(m.followers).toLocaleString()):'',
    row('조회수', m.views!=null?Number(m.views).toLocaleString():''),
    row('좋아요', m.likes!=null?Number(m.likes).toLocaleString():''),
    row('댓글', m.comments!=null?Number(m.comments).toLocaleString():''),
    sp!=null?row('속도(시간당)', sp.toFixed(1)):'',
    (m.followers&&m.comments!=null)?row('참여밀도', (m.comments/m.followers*100).toFixed(2)+'%'):'',
    m.duration!=null?row('길이', _fmtDur(m.duration)):''
  ].filter(Boolean).join('');
  return body?`<div style="font-size:11px;margin:2px 0 6px;display:flex;flex-direction:column;gap:1px">${body}</div>`:'';
}
// 썸네일 ▶ 재생 — 유튜브는 임베드로 인앱 재생, 그 외(틱톡·샤오홍슈 등)는 원본에서 재생.
function _ytId(u){ const m=String(u||'').match(/(?:youtu\.be\/|[?&]v=|\/shorts\/|\/embed\/)([A-Za-z0-9_-]{6,})/); return m?m[1]:''; }
function playPreview(sc){
  const i=ITEMS.find(x=>x.shortcode===sc); if(!i||!i.url) return;
  const yid=_ytId(i.url);
  if(yid){
    _overlay(`<div style="margin-bottom:8px;font-size:13px">${esc((i.name||'').slice(0,80))}</div>`+
      `<iframe width="100%" height="460" src="https://www.youtube.com/embed/${yid}" frameborder="0" allow="encrypted-media" allowfullscreen style="border-radius:8px"></iframe>`);
  } else {
    window.open(i.url,'_blank');   // 틱톡·샤오홍슈·도우인·인스타는 원본 탭에서 재생
  }
}
function _overlay(html){
  let o=document.getElementById('collOverlay');
  if(!o){ o=document.createElement('div'); o.id='collOverlay';
    o.style.cssText='position:fixed;inset:0;background:rgba(0,0,0,.82);z-index:99999;display:flex;align-items:center;justify-content:center;padding:20px';
    o.addEventListener('click',e=>{ if(e.target===o) _closeOverlay(); }); document.body.appendChild(o); }
  o.innerHTML=`<div style="background:#171717;border:1px solid #333;border-radius:12px;padding:14px;max-width:820px;width:100%;position:relative">`+
    `<button onclick="_closeOverlay()" style="position:absolute;top:2px;right:10px;background:none;border:none;color:#fff;font-size:22px;cursor:pointer">✕</button>${html}</div>`;
  o.style.display='flex';
}
function _closeOverlay(){ const o=document.getElementById('collOverlay'); if(o){ o.innerHTML=''; o.style.display='none'; } }
// 이 영상 하나만 바로 제작소로 (선택 안 해도 카드에서 바로).
function sendOneToProduce(sc){
  const i=ITEMS.find(x=>x.shortcode===sc); if(!i) return;
  const picks=[{url:i.url||'', shortcode:i.shortcode||'', name:i.name||'',
                thumbnail:i.thumbnail||'', caption:i.caption||''}];
  sessionStorage.setItem('produce_handoff', JSON.stringify(picks));
  sessionStorage.setItem('produce_mix_urls', JSON.stringify(picks.map(p=>p.url).filter(Boolean)));
  location.href='/produce';
}
function render(){
  const el=document.getElementById('cards');
  document.getElementById('selCount').textContent = SELECTED.size ? `${SELECTED.size}개 선택` : '';
  if(!ITEMS.length){
    el.innerHTML='<div class="empty">담아둔 영상이 없습니다.<br><small>레퍼런스 랭킹이나 렌즈 결과에서 📥담기를 눌러보세요.</small></div>';
    return;
  }
  el.innerHTML = ITEMS.map(i=>{
    const sel = SELECTED.has(i.shortcode);
    return `
    <div class="card ${sel?'sel':''}">
      <div class="thumb" style="position:relative">
        <span class="chk" onclick="event.stopPropagation();toggleSelect('${i.shortcode}')" style="cursor:pointer;position:absolute;top:6px;left:6px;z-index:2">${sel?'✅':'⬜'}</span>
        ${i.thumbnail?`<img src="${thumbSrc(i.thumbnail)}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.visibility='hidden'" onclick="playPreview('${i.shortcode}')" style="cursor:pointer">`:''}
        <span onclick="playPreview('${i.shortcode}')" title="재생" style="position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:1;background:rgba(0,0,0,.55);color:#fff;width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;cursor:pointer">▶</span>
      </div>
      <div class="body">
        <div class="rank" style="white-space:normal;line-height:1.4;min-height:2.6em">${esc((i.name||i.caption||'').slice(0,60))}</div>
        ${metaLine(i.meta)}
        <div class="btns">
          <button class="view" onclick="window.open('${esc(i.url||'#')}','_blank')">👁 보기</button>
          <button onclick="removeItem('${i.shortcode}')">🗑 빼기</button>
        </div>
        <button onclick="sendOneToProduce('${i.shortcode}')" style="width:100%;margin-top:6px;padding:8px;background:#1f6feb;color:#fff;border:none;border-radius:8px;font-weight:700;cursor:pointer">🎬 제작소로 보내기</button>
      </div>
    </div>`;
  }).join('');
}
loadItems();
</script>
<script src="/sidebar.js?v=2"></script>
</body>
</html>
