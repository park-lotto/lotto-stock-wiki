<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>크리에이티브 라이브러리</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f5f1;color:#20241f;font-family:Arial,'Malgun Gothic',sans-serif}button,input{font:inherit}button{cursor:pointer}header{padding:30px 4vw 24px;border-bottom:1px solid #d9ddd3;background:#fcfcf8;display:flex;justify-content:space-between;align-items:center;gap:20px}.brand{font-size:13px;letter-spacing:2px;color:#547348;font-weight:800}h1{font-size:30px;margin:9px 0}header p{margin:0;color:#6a7165;font-size:14px}.pill{border:1px solid #becbb5;border-radius:24px;padding:10px 16px;white-space:nowrap;color:#4c683b;font-size:13px}.workspace{max-width:1600px;margin:auto;padding:30px 4vw}.tools{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:22px}nav{display:flex;gap:6px;flex-wrap:wrap}nav button{border:0;background:transparent;border-radius:9px;padding:10px 15px;color:#626b5a}nav button.active{background:#263d28;color:white}input{width:min(350px,100%);padding:12px 15px;border:1px solid #d2d8cc;border-radius:10px;background:white;outline-color:#679958}.meta{display:flex;justify-content:space-between;color:#717868;font-size:13px;margin-bottom:18px;gap:12px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.card{border:1px solid #dce0d5;background:white;border-radius:15px;overflow:hidden;display:flex;flex-direction:column}.preview{height:182px;background:#ecf0e7;display:flex;justify-content:center;flex-direction:column;padding:25px;gap:9px;overflow:hidden}.preview.font{background:#182a21;color:#fff;font-size:26px;line-height:1.3}.preview.font .accent{color:#c5ed6c}.preview.voice{background:#e9e6f2}.preview.motion{background:#e7ecf6}.kicker{text-transform:uppercase;letter-spacing:2px;font-size:11px;color:#688066;font-weight:700}.shape{width:100%;height:12px;border-radius:3px;background:#799964;margin-top:12px}.cardbody{padding:18px;flex:1;display:flex;flex-direction:column}.card h2{font-size:17px;margin:0 0 8px}.desc{font-size:12px;color:#798071;min-height:18px;line-height:1.6}.foot{display:flex;justify-content:space-between;align-items:center;margin-top:20px;font-size:12px;color:#807458}.detail{border:1px solid #d5ddce;border-radius:7px;background:#fff;padding:7px 11px;color:#34482d}audio{width:100%;height:36px}.media-link{color:#3d517b;font-size:13px}.empty{padding:60px;text-align:center;color:#777;grid-column:1/-1}.note{font-size:12px;line-height:1.7;color:#747d6c;margin-top:28px}dialog{border:1px solid #d5ddce;border-radius:18px;width:min(760px,94vw);max-height:85vh;padding:26px}dialog::backdrop{background:#10231388}dialog h2{margin-top:0}dialog pre{white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.7 Consolas,monospace;background:#f0f3ed;padding:18px;border-radius:10px}dialog .close{float:right;border:0;background:#edf1e8;border-radius:8px;padding:9px 15px}.reason{padding:14px;background:#fff6de;border-radius:9px;font-size:13px;line-height:1.8}.error{padding:15px;border-radius:10px;background:#ffece7;color:#953f2c;margin-bottom:18px}[hidden]{display:none!important}@media(max-width:650px){header{align-items:flex-start;flex-direction:column}h1{font-size:24px}.tools input{width:100%}.grid{grid-template-columns:1fr}.meta{flex-direction:column}}
</style></head><body>
<header><div><div class="brand">MAKERS LAB · CREATIVE ASSETS</div><h1>크리에이티브 라이브러리</h1><p>글자, 장면, 움직임, 목소리를 한곳에서 살펴보세요.</p></div><span class="pill">회사 공용 자료 · 읽기 전용</span></header>
<main class="workspace"><div id="errors" class="error" hidden></div><div class="tools"><nav id="filters" aria-label="라이브러리 종류"></nav><input id="query" aria-label="라이브러리 검색" placeholder="이름이나 키워드로 검색"></div><div class="meta"><span id="count"></span><span>카드를 눌러 출처와 검수 상태를 확인하세요</span></div><section class="grid" id="grid"></section><p class="note">현재 등록된 파일 기반 자료를 보여주는 열람 화면입니다. 고객 개인 자료와 운영 DB는 포함하지 않습니다.<br>폰트는 실제 파일에서 만든 견본이며, 글꼴·모션·음성의 최종 사용 승인은 별도 검수 단계입니다. 다시 실행하면 최신 목록을 불러옵니다.</p></main>
<dialog id="dialog"><button class="close" id="close">닫기</button><h2 id="detail-title"></h2><p class="reason" id="reasons"></p><pre id="detail-data"></pre></dialog>
<script>
const data=/*CATALOG_DATA*/null;
const labels={all:'전체',font:'폰트',layout:'레이아웃',motion:'모션 · 팩',voice:'음성',scene:'장면',script:'대본'};
const reasons={not_approved:'새 라이브러리 승인 전',rights_unverified:'사용 권리 증빙 확인 필요',commercial_use_not_verified:'상업 사용 범위 확인 필요',review_unverified:'품질 검수 필요',compatibility_unverified:'실제 렌더 호환 확인 필요',constraints_unverified:'추가 적용 조건 확인 필요',artifact_missing:'연결 파일 확인 필요',dependency_not_usable:'구성 자산의 검수 필요',dependency_unresolved:'구성 자산 연결 확인 필요'};
let current='all';const grid=document.getElementById('grid'),query=document.getElementById('query');
function el(tag,cls,text){const node=document.createElement(tag);if(cls)node.className=cls;if(text!==undefined)node.textContent=text;return node}
data.items.forEach((item,i)=>{item.previewIndex=i;if(item.font_preview){const style=document.createElement('style');style.textContent=`@font-face{font-family:preview${i};src:url("${item.font_preview}")}`;document.head.append(style)}});
for(const [domain,label] of Object.entries(labels)){const n=domain==='all'?data.items.length:data.items.filter(i=>i.domain===domain).length;if(!n&&domain!=='all')continue;const b=el('button',domain==='all'?'active':'',`${label} ${n}`);b.dataset.domain=domain;b.onclick=()=>{current=domain;document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()};document.getElementById('filters').append(b)}
function detail(item){document.getElementById('detail-title').textContent=item.name;document.getElementById('reasons').textContent=(item.eligibility.reasons.map(r=>reasons[r]||r).join(' · '))||'사용 조건 확인됨';const {font_preview,local_media,previewIndex,...safe}=item;document.getElementById('detail-data').textContent=JSON.stringify(safe,null,2);document.getElementById('dialog').showModal()}
function render(){grid.replaceChildren();const terms=query.value.toLocaleLowerCase().trim().split(/\s+/).filter(Boolean);const items=data.items.filter(i=>(current==='all'||i.domain===current)&&terms.every(t=>(i.name+' '+i.description+' '+i.tags.join(' ')).toLocaleLowerCase().includes(t)));document.getElementById('count').textContent=`${items.length}개 표시 · 전체 ${data.items.length}개`;for(const item of items){const card=el('article','card');const preview=el('div','preview '+item.domain);if(item.domain==='font'&&item.font_preview){preview.style.fontFamily=`preview${item.previewIndex}`;preview.append(el('div','','일상을 바꾸는 발견'),el('div','accent','놀라운 생활 아이디어'),el('div','','0123456789'))}else if(item.domain==='voice'){preview.append(el('span','kicker','VOICE PRESET'),el('strong','',item.parameters.one_liner||item.name));const media=item.local_media.find(m=>['.mp3','.wav','.m4a','.ogg'].includes(m.suffix));if(media){const audio=el('audio');audio.controls=true;audio.preload='none';audio.src=media.url;audio.addEventListener('play',()=>document.querySelectorAll('audio').forEach(a=>{if(a!==audio)a.pause()}));preview.append(audio)}}else{preview.append(el('span','kicker',labels[item.domain]||item.domain));preview.append(el('strong','',item.name));if(item.domain==='layout'){preview.append(el('span','desc','레이아웃 구조 정보 · 렌더 견본 준비 전'));const swatch=el('div','shape');if(/^#[0-9a-f]{6}$/i.test(item.parameters.bar||''))swatch.style.background=item.parameters.bar;preview.append(swatch)}else{preview.append(el('span','desc',item.kind==='pack'?'구성 자산과 적용 설정이 담긴 팩':'파일과 적용 정보를 확인할 수 있습니다'));const media=item.local_media[0];if(media){const a=el('a','media-link','원본 파일 열기 ↗');a.href=media.url;a.target='_blank';a.rel='noopener';preview.append(a)}}}
const body=el('div','cardbody');body.append(el('h2','',item.name),el('span','desc',(item.tags||[]).slice(0,3).join(' · ')));const foot=el('div','foot');foot.append(el('span','','검수 전 자료'));const b=el('button','detail','상세 보기');b.onclick=()=>detail(item);foot.append(b);body.append(foot);card.append(preview,body);grid.append(card)}if(!items.length)grid.append(el('div','empty','검색 결과가 없습니다. 다른 이름이나 키워드를 입력해 보세요.'))}
query.addEventListener('input',render);document.getElementById('close').onclick=()=>document.getElementById('dialog').close();document.getElementById('dialog').addEventListener('click',e=>{if(e.target===e.currentTarget)e.currentTarget.close()});const errors=data.adapters.filter(a=>a.state==='error');if(errors.length){const box=document.getElementById('errors');box.hidden=false;box.textContent='일부 자료를 읽지 못했습니다: '+errors.map(a=>a.adapter).join(', ')}render();
</script></body></html>
