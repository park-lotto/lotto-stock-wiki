<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>로또의 주식 — 딸깍 대시보드</title>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
  :root { --gold:#d4af37; --gold-dim:#9a7d28; --bg:#0a0a0a; --card:#16161a; --line:#2a2a30; --txt:#e8e6e0; --muted:#8a8a92; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--bg); color:var(--txt); font-family:'Segoe UI','Malgun Gothic',sans-serif; min-height:100vh; }
  header { padding:28px 32px 18px; border-bottom:1px solid var(--line); }
  h1 { font-size:1.35rem; font-weight:700; letter-spacing:-.5px; }
  h1 .gold { color:var(--gold); }
  .sub { color:var(--muted); font-size:.8rem; margin-top:4px; }
  .btn-row { display:flex; gap:14px; padding:24px 32px; flex-wrap:wrap; }
  .btn { flex:1; min-width:200px; padding:22px 24px; background:var(--card); border:1px solid var(--line);
    border-radius:14px; cursor:pointer; transition:.18s; text-align:left; color:var(--txt); }
  .btn:hover { border-color:var(--gold-dim); transform:translateY(-2px); }
  .btn.active { border-color:var(--gold); box-shadow:0 0 0 1px var(--gold); }
  .btn .ico { font-size:1.6rem; }
  .btn .ttl { font-size:1.05rem; font-weight:700; margin:8px 0 3px; }
  .btn .desc { font-size:.78rem; color:var(--muted); }
  .btn .soon { font-size:.68rem; color:var(--gold-dim); margin-top:6px; display:inline-block;
    border:1px solid var(--gold-dim); padding:1px 7px; border-radius:10px; }
  main { padding:8px 32px 60px; }
  .loading { text-align:center; color:var(--muted); padding:60px; font-size:.9rem; }
  .section { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:20px 22px; margin-bottom:16px; }
  .section h2 { font-size:.82rem; color:var(--gold); text-transform:uppercase; letter-spacing:1px; margin-bottom:14px; font-weight:700; }
  .verdict-row { display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .verdict { font-size:1.5rem; font-weight:800; padding:6px 18px; border-radius:10px; }
  .verdict.GO { background:#0d2a14; color:#3ddc6e; border:1px solid #1a5c30; }
  .verdict.CAUTION { background:#2a210d; color:#e0b13d; border:1px solid #5c4a1a; }
  .verdict.NO { background:#2a0d0d; color:#e05050; border:1px solid #5c1a1a; }
  .metric { display:inline-flex; flex-direction:column; gap:2px; margin-right:24px; }
  .metric .v { font-size:1.3rem; font-weight:700; }
  .metric .l { font-size:.72rem; color:var(--muted); }
  .pos { color:#3ddc6e; } .neg { color:#e05050; }
  .reasons { margin-top:14px; display:flex; flex-direction:column; gap:6px; }
  .reason { font-size:.82rem; display:flex; gap:8px; align-items:center; }
  .reason .dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
  .reason .dot.ok { background:#3ddc6e; } .reason .dot.no { background:#e05050; }
  .chips { display:flex; gap:8px; flex-wrap:wrap; }
  .chip { background:#1f1f25; border:1px solid var(--line); padding:5px 13px; border-radius:20px; font-size:.84rem; }
  .chip.gold { border-color:var(--gold-dim); color:var(--gold); }
  .chip .n { color:var(--muted); font-size:.74rem; margin-left:5px; }
  table { width:100%; border-collapse:collapse; font-size:.82rem; }
  th { text-align:left; color:var(--muted); font-weight:600; padding:8px 10px; border-bottom:1px solid var(--line); font-size:.74rem; text-transform:uppercase; }
  td { padding:9px 10px; border-bottom:1px solid #1c1c22; }
  tr:hover td { background:#1c1c22; }
  .stock-name { font-weight:600; }
  .vac { font-size:.7rem; padding:1px 7px; border-radius:8px; font-weight:700; }
  .vac.A { background:#0d2a14; color:#3ddc6e; } .vac.B { background:#2a210d; color:#e0b13d; }
  .score-bar { display:inline-block; height:7px; border-radius:4px; background:var(--gold); vertical-align:middle; }
  .flags { display:flex; gap:4px; flex-wrap:wrap; }
  .flag { font-size:.66rem; background:#1f1f25; color:var(--muted); padding:1px 6px; border-radius:6px; }
  .flag.on { background:var(--gold-dim); color:#000; font-weight:700; }
  details { background:var(--card); border:1px solid var(--line); border-radius:14px; margin-bottom:16px; }
  summary { padding:18px 22px; cursor:pointer; font-size:.82rem; color:var(--gold); text-transform:uppercase; letter-spacing:1px; font-weight:700; }
  .briefing-body { padding:0 26px 24px; font-size:.86rem; line-height:1.7; color:#cfcdc7; }
  .briefing-body h3 { color:var(--gold); margin:18px 0 8px; font-size:1rem; }
  .briefing-body ul { margin:8px 0 8px 20px; } .briefing-body li { margin:3px 0; }
  .briefing-body strong { color:var(--txt); }
  .stale { color:#e0b13d; font-size:.74rem; }
  .placeholder { text-align:center; padding:70px 20px; color:var(--muted); }
  .placeholder .big { font-size:2.4rem; margin-bottom:14px; }
  /* ── 채팅창 ── */
  .chat-wrap { display:flex; gap:18px; align-items:flex-start; }
  .chat-side { width:130px; flex-shrink:0; text-align:center; position:sticky; top:16px; }
  .avatar { width:110px; height:110px; margin:0 auto; border-radius:18px; background:linear-gradient(160deg,#1f1f25,#101014);
    border:1px solid var(--gold-dim); display:flex; align-items:center; justify-content:center; font-size:3.4rem;
    overflow:hidden; transition:box-shadow .2s; }
  .avatar .face { display:inline-block; animation:idle 3s ease-in-out infinite; }
  .avatar img.face { width:96px; height:96px; object-fit:contain; border-radius:12px; }
  /* 평소: 천천히 둥실 */
  @keyframes idle { 0%,100%{ transform:translateY(0) rotate(0); } 50%{ transform:translateY(-6px) rotate(-2deg); } }
  /* 답할 때: 빠르게 들썩 + 테두리 빛남 */
  .avatar.talking { box-shadow:0 0 0 2px var(--gold), 0 0 22px rgba(212,175,55,.45); }
  .avatar.talking .face { animation:talk .5s ease-in-out infinite; }
  @keyframes talk { 0%,100%{ transform:translateY(0) rotate(-4deg) scale(1); } 25%{ transform:translateY(-4px) rotate(3deg) scale(1.08); } 50%{ transform:translateY(1px) rotate(-2deg) scale(.97); } 75%{ transform:translateY(-3px) rotate(4deg) scale(1.05); } }
  .avatar-name { margin-top:10px; font-size:.82rem; font-weight:700; color:var(--gold); }
  .avatar-role { font-size:.68rem; color:var(--muted); margin-top:2px; }
  .chat-main { flex:1; min-width:0; }
  .chat-msgs { display:flex; flex-direction:column; gap:12px; min-height:200px; max-height:60vh; overflow-y:auto;
    padding:6px 4px 14px; }
  .bubble { max-width:82%; padding:11px 15px; border-radius:14px; font-size:.88rem; line-height:1.6; white-space:pre-wrap; word-break:break-word; }
  .bubble.user { align-self:flex-end; background:var(--gold-dim); color:#0a0a0a; border-bottom-right-radius:4px; }
  .bubble.bot { align-self:flex-start; background:var(--card); border:1px solid var(--line); border-bottom-left-radius:4px; color:#dcdad4; }
  .bubble.bot h3 { color:var(--gold); font-size:.98rem; margin:10px 0 6px; }
  .bubble.bot ul { margin:6px 0 6px 18px; } .bubble.bot li { margin:2px 0; }
  .bubble.bot strong { color:var(--txt); }
  .bubble.sys { align-self:center; background:transparent; color:var(--muted); font-size:.76rem; }
  .bubble.err { align-self:flex-start; background:#2a0d0d; border:1px solid #5c1a1a; color:#e88; font-size:.82rem; }
  .chat-input { display:flex; gap:10px; margin-top:8px; }
  .chat-input textarea { flex:1; resize:none; height:50px; background:#1a1a20; color:var(--txt); border:1px solid var(--line);
    border-radius:12px; padding:13px 15px; font-family:inherit; font-size:.9rem; }
  .chat-input textarea:focus { outline:none; border-color:var(--gold-dim); }
  .chat-input button { padding:0 22px; background:var(--gold); color:#0a0a0a; border:none; border-radius:12px; font-weight:700;
    cursor:pointer; font-size:.9rem; }
  .chat-input button:disabled { background:#3a3a3a; color:#777; cursor:not-allowed; }
  .typing { display:inline-flex; gap:4px; }
  .typing i { width:7px; height:7px; border-radius:50%; background:var(--gold-dim); animation:blink 1s infinite; }
  .typing i:nth-child(2){ animation-delay:.2s; } .typing i:nth-child(3){ animation-delay:.4s; }
  @keyframes blink { 0%,60%,100%{opacity:.25;} 30%{opacity:1;} }
</style>
</head>
<body>
<div style="display:flex;align-items:center;gap:6px;padding:10px 28px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:100;background:var(--bg)">
  <span style="font-size:.92rem;font-weight:700;color:var(--gold);letter-spacing:.5px;margin-right:20px">로또의 주식</span>
  <a href="/" style="padding:6px 16px;border-radius:7px;font-size:.84rem;color:var(--gold);text-decoration:none;border-bottom:2px solid var(--gold)">● 딸깍</a>
  <a href="/market" style="padding:6px 16px;border-radius:7px;font-size:.84rem;color:var(--muted);text-decoration:none">섹터맵</a>
  <a href="/insights" style="padding:6px 16px;border-radius:7px;font-size:.84rem;color:var(--muted);text-decoration:none">인사이트</a>
  <a href="/sources" style="padding:6px 16px;border-radius:7px;font-size:.84rem;color:var(--muted);text-decoration:none">소스</a>
  <a href="/brain" style="padding:6px 16px;border-radius:7px;font-size:.84rem;color:var(--muted);text-decoration:none">🧠 브레인</a>
</div>
<header>
  <h1>로또의 주식 — <span class="gold">딸깍 대시보드</span></h1>
  <div class="sub">버튼 하나로 오늘 시장을 정리한다 · AI가 모은 데이터를 한 화면에</div>
</header>

<div class="btn-row">
  <button class="btn" id="b-morning" onclick="loadMorning()">
    <div class="ico">🌅</div>
    <div class="ttl">장 시작 전</div>
    <div class="desc">오늘 뭐 봐야 해? · 간밤 미국장 + 신호 + 주도섹터</div>
  </button>
  <button class="btn" id="b-intraday" onclick="loadStub('intraday')">
    <div class="ico">🔥</div>
    <div class="ttl">장 중</div>
    <div class="desc">지금 왜 이래? · 실시간 수급/프로그램/선물</div>
    <div class="soon">2단계 · 한투 연결 예정</div>
  </button>
  <button class="btn" id="b-close" onclick="loadStub('close')">
    <div class="ico">🌙</div>
    <div class="ttl">장 마감 후</div>
    <div class="desc">오늘 뭐였고 내일은? · 픽 결과 + 내일 일정</div>
    <div class="soon">3단계 · 예정</div>
  </button>
  <button class="btn" id="b-agent" onclick="loadAgent()">
    <div class="ico">🧑‍💼</div>
    <div class="ttl">시황부장 호출</div>
    <div class="desc">AI 에이전트가 오늘 시황 브리핑 초안 작성</div>
    <div class="soon">claude 헤드리스 · 최대 4분</div>
  </button>
</div>

<main id="main">
  <div class="loading">위 버튼을 눌러 시작하세요.</div>
</main>

<script>
const F_LABELS = ['빈집','수출','컨센신고가','어닝서프','판가','미국커플링','정책','D30'];

function setActive(id) {
  document.querySelectorAll('.btn').forEach(b => b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

async function loadMorning() {
  setActive('b-morning');
  const main = document.getElementById('main');
  main.innerHTML = '<div class="loading">데이터 불러오는 중…</div>';
  try {
    const d = await (await fetch('/api/morning')).json();
    main.innerHTML = renderMorning(d);
  } catch (e) {
    main.innerHTML = '<div class="loading">오류: ' + e + '</div>';
  }
}

function renderMorning(d) {
  const s1 = d.stage1 || {}, s2 = d.stage2 || {};
  let html = '';

  // 1. 매크로 게이트
  const v = s1.verdict || '—';
  const mkt = s1.market;
  const mktCls = mkt > 0 ? 'pos' : (mkt < 0 ? 'neg' : '');
  html += '<div class="section"><h2>매크로 게이트 · 오늘 스탠스</h2>';
  html += '<div class="verdict-row">';
  html += '<span class="verdict ' + v + '">' + v + '</span>';
  if (mkt !== undefined) html += '<span class="metric"><span class="v ' + mktCls + '">' + (mkt>0?'+':'') + mkt + '%</span><span class="l">미장(S&P)</span></span>';
  if (s1.vix !== undefined) html += '<span class="metric"><span class="v">' + s1.vix + '</span><span class="l">VIX ' + (s1.vix_chg!==undefined?(s1.vix_chg>0?'+':'')+s1.vix_chg:'') + '</span></span>';
  html += '</div>';
  if (s1.reasons && s1.reasons.length) {
    html += '<div class="reasons">';
    s1.reasons.forEach(r => {
      html += '<div class="reason"><span class="dot ' + (r.ok?'ok':'no') + '"></span><b>' + (r.label||'') + '</b> · ' + (r.detail||'') + '</div>';
    });
    html += '</div>';
  }
  html += '</div>';

  // 2. 주도섹터
  const methods = s2.methods || {};
  html += '<div class="section"><h2>주도 섹터 · Triangulation</h2>';
  const A = methods['A_교집합'] || [], B = methods['B_점수합산'] || [];
  if (A.length) { html += '<div style="margin-bottom:10px"><span class="l" style="color:var(--muted);font-size:.75rem">A. 교집합(가장 강함)</span><div class="chips" style="margin-top:6px">' + A.map(s=>'<span class="chip gold">'+s+'</span>').join('') + '</div></div>'; }
  if (B.length) { html += '<div><span class="l" style="color:var(--muted);font-size:.75rem">B. 점수합산</span><div class="chips" style="margin-top:6px">' + B.map(s=>'<span class="chip">'+s+'</span>').join('') + '</div></div>'; }
  html += '</div>';

  // 3. 종목 9점표
  html += '<div class="section"><h2>종목 9점표 · 상위 ' + (d.top_stocks?d.top_stocks.length:0) + ' / 전체 ' + (d.stock_total||0) + '</h2>';
  html += '<table><thead><tr><th>종목</th><th>섹터</th><th>빈집</th><th>RS</th><th>점수</th><th>플래그</th></tr></thead><tbody>';
  (d.top_stocks||[]).forEach(s => {
    const flags = s.flags || {};
    const flagHtml = F_LABELS.map(f => {
      const on = (flags[f]||0) > 0;
      return '<span class="flag' + (on?' on':'') + '">' + f + (flags[f]>1?('·'+flags[f]):'') + '</span>';
    }).join('');
    html += '<tr><td class="stock-name">' + (s.name||'') + '</td><td style="color:var(--muted)">' + (s.sector||'') + '</td>'
      + '<td>' + (s.vacancy?'<span class="vac '+s.vacancy+'">'+s.vacancy+'</span>':'') + '</td>'
      + '<td>' + (s.rs!=null?s.rs.toFixed(1):'') + '</td>'
      + '<td><span class="score-bar" style="width:' + ((s.score||0)/9*46) + 'px"></span> <b>' + (s.score||0) + '</b></td>'
      + '<td><div class="flags">' + flagHtml + '</div></td></tr>';
  });
  html += '</tbody></table></div>';

  // 4. 미국증시 브리핑
  if (d.briefing_md) {
    html += '<details><summary>🇺🇸 간밤 미국증시 브리핑 ' + (d.briefing_date?('· '+d.briefing_date):'') + '</summary>'
      + '<div class="briefing-body">' + marked.parse(d.briefing_md) + '</div></details>';
  }

  // 데이터 출처/신선도
  html += '<div class="stale">데이터: signal_snapshot ' + (d.snapshot_date||'?') + ' (' + (d.snapshot_mtime||'') + ') · 브리핑 ' + (d.briefing_name||'없음') + '</div>';

  return html;
}

let CHAT_SESSION = null;
let CHAT_BUSY = false;

function loadAgent() {
  setActive('b-agent');
  CHAT_SESSION = null;
  document.getElementById('main').innerHTML =
    '<div class="chat-wrap">'
    + '  <div class="chat-side">'
    + '    <div class="avatar" id="avatar"><img class="face" src="/assets/시황부장.png" alt="시황부장" onerror="faceError(this)"></div>'
    + '    <div class="avatar-name">시황부장</div>'
    + '    <div class="avatar-role">스탁브레인 주식시황팀</div>'
    + '  </div>'
    + '  <div class="chat-main">'
    + '    <div class="chat-msgs" id="msgs">'
    + '      <div class="bubble bot">안녕하세요, 시황팀 부장입니다. 오늘 시장 뭐부터 볼까요? '
    + '예: "오늘 시황 브리핑 써줘", "반도체 지금 어때?"</div>'
    + '    </div>'
    + '    <div class="chat-input">'
    + '      <textarea id="chatbox" placeholder="부장에게 물어보세요…  (Enter 전송 / Shift+Enter 줄바꿈)"></textarea>'
    + '      <button id="sendbtn" onclick="sendChat()">보내기</button>'
    + '    </div>'
    + '  </div>'
    + '</div>';
  const box = document.getElementById('chatbox');
  box.focus();
  box.addEventListener('keydown', e => {
    if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendChat(); }
  });
}

function addBubble(cls, html) {
  const msgs = document.getElementById('msgs');
  const div = document.createElement('div');
  div.className = 'bubble ' + cls;
  div.innerHTML = html;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return div;
}

function setAvatarTalking(on) {
  const a = document.getElementById('avatar');
  if (a) a.classList.toggle('talking', on);
}

// 캐릭터 그림(/assets/시황부장.png)이 없으면 이모지로 대체
function faceError(img) {
  const s = document.createElement('span');
  s.className = 'face';
  s.textContent = '🧑‍💼';
  img.replaceWith(s);
}

async function sendChat() {
  if (CHAT_BUSY) return;
  const box = document.getElementById('chatbox');
  const msg = box.value.trim();
  if (!msg) return;
  box.value = '';
  CHAT_BUSY = true;
  document.getElementById('sendbtn').disabled = true;
  setAvatarTalking(true);

  addBubble('user', msg.replace(/</g,'&lt;'));
  const t0 = Date.now();
  const thinking = addBubble('bot', '<span class="typing"><i></i><i></i><i></i></span> <span id="tk" style="color:var(--muted);font-size:.76rem"></span>');
  const timer = setInterval(() => {
    const el = document.getElementById('tk');
    if (el) el.textContent = Math.round((Date.now()-t0)/1000) + '초';
  }, 1000);

  try {
    const d = await (await fetch('/api/chat', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ role:'시황부장', message: msg, session_id: CHAT_SESSION })
    })).json();
    clearInterval(timer);
    if (d.session_id) CHAT_SESSION = d.session_id;
    if (!d.ok) {
      thinking.className = 'bubble err';
      thinking.innerHTML = '⚠ ' + (d.error || '알 수 없는 오류');
    } else {
      thinking.className = 'bubble bot';
      thinking.innerHTML = marked.parse(d.reply || '(빈 응답)')
        + '<div style="color:var(--muted);font-size:.68rem;margin-top:6px">' + (d.elapsed||'?') + '초</div>';
    }
  } catch (e) {
    clearInterval(timer);
    thinking.className = 'bubble err';
    thinking.innerHTML = '⚠ 통신 오류: ' + e;
  } finally {
    CHAT_BUSY = false;
    const sb = document.getElementById('sendbtn');
    if (sb) sb.disabled = false;
    setAvatarTalking(false);
    document.getElementById('msgs').scrollTop = document.getElementById('msgs').scrollHeight;
  }
}

async function loadStub(kind) {
  setActive('b-' + kind);
  const d = await (await fetch('/api/' + kind)).json();
  document.getElementById('main').innerHTML =
    '<div class="placeholder"><div class="big">' + (kind==='intraday'?'🔥':'🌙') + '</div>'
    + '<div style="font-size:1.1rem;color:var(--txt);margin-bottom:8px">' + d.status + '</div>'
    + '<div>' + d.message + '</div></div>';
}

// 시작 시 자동으로 장전 로드
loadMorning();
</script>
</body>
</html>
