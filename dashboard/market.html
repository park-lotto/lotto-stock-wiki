  box.style.top=saved.top || "60px";
  box.dataset.max="0";
  _dragWindow(box, box.querySelector(".modal-hd"));
  _edgeResize(box);   // 오른쪽·아래쪽 엣지로도 크기조절
  box.querySelector(".modal-hd").addEventListener("dblclick",()=>_toggleMax(box));
  // 차트 컨테이너 마우스 핸들러는 모달당 1회만 부착 (봉 전환에도 유지)
  const cont=box.querySelector("#tv_chart_container");
  cont.addEventListener("mousedown",_chartMouseDown,true);   // 도구=그리기 / 도형위=이동 / 그외=팬
  cont.addEventListener("mousemove",ev=>{
    if(_drawTool){ cont.style.cursor=""; return; }
    const p=_drawPt(ev); cont.style.cursor=(_hitShape(p.x,p.y)>=0)?"move":"grab";
  });
  // 우클릭 = 그리던 도형 취소 + 도구 해제(원래대로)
  cont.addEventListener("contextmenu",ev=>{
    if(_drawTool||_drawCancel){ ev.preventDefault(); _cancelDraw(); }
  });
  // ESC = 그리는 중이면 그리기 취소, 아니면 차트 창 닫기 (전역 1회 바인딩)
  if(!window._chartEscBound){ window._chartEscBound=true;
    document.addEventListener("keydown",ev=>{
      if(ev.key!=="Escape")return;
      const m=document.getElementById("chart-modal");
      if(!m||!m.classList.contains("open"))return;
      if(_drawTool||_drawCancel) _cancelDraw();
      else closeStockChart();
    });
  }
  _initChart();
  loadChartData();
  _loadTaerini(code);
  loadStockNews(code, name);
  _applyTaeriniCollapse();
  _applyMAButtons();
  _cfInitState();
  if(_cfOn) _loadConsensus(code); else _cfRender();
  if(_drawRaf) cancelAnimationFrame(_drawRaf);
  _lastProj=null; _drawRaf=requestAnimationFrame(_drawTick);   // 도형 자동 재계산 루프 시작
}

const _CHART_LAYOUT={layout:{background:{color:"#0b0b0e"},textColor:"#999",fontFamily:"'Noto Sans KR',sans-serif"},
  grid:{vertLines:{color:"#161620"},horzLines:{color:"#161620"}},
  rightPriceScale:{borderColor:"#222"}, crosshair:{mode:0}};

function _initChart(){
  const el=document.getElementById("tv_chart_container");
  if(_chart){ try{_chart.remove();}catch(_){} _chart=null; }
  if(_osc){ try{_osc.remove();}catch(_){} _osc=null; }
  if(_roDraw){ try{_roDraw.disconnect();}catch(_){} _roDraw=null; }
  el.innerHTML="";
  if(!window.LightweightCharts){
    el.innerHTML='<div class="chart-msg">차트 라이브러리 로딩 실패 — 인터넷 연결 확인</div>'; return;
  }
  _chart=LightweightCharts.createChart(el,{autoSize:true,..._CHART_LAYOUT,
    timeScale:{borderColor:"#222",timeVisible:_isIntraday(),secondsVisible:false},
    rightPriceScale:{borderColor:"#222",autoScale:true},
    handleScale:{axisPressedMouseMove:{time:true,price:true}, mouseWheel:true, pinch:true},
    handleScroll:{mouseWheel:true, pressedMouseMove:true, horzTouchDrag:true, vertTouchDrag:true},  // 좌드래그=차트 이동(팬)
    localization:{priceFormatter:p=>Math.round(p).toLocaleString("ko-KR")}});
  _chartCandle=_chart.addCandlestickSeries({
    upColor:"#e74c3c",downColor:"#3498db",borderUpColor:"#e74c3c",borderDownColor:"#3498db",
    wickUpColor:"#e74c3c",wickDownColor:"#3498db"});
  _chartVol=_chart.addHistogramSeries({priceFormat:{type:"volume"},priceScaleId:"vol",color:"#3a3a44"});
  _chart.priceScale("vol").applyOptions({scaleMargins:{top:0.84,bottom:0}});
  const mkLine=(col,w)=>_chart.addLineSeries({color:col,lineWidth:w||1,priceLineVisible:false,lastValueVisible:false,crosshairMarkerVisible:false});
  _maSeries={}; _MA_PERIODS.forEach(p=>{ _maSeries[p]=mkLine(_MA_COLORS[p]); });
  _bollSeries={u:mkLine("#8a909a"),m:mkLine("#b8951f"),l:mkLine("#8a909a")};
  _chart.subscribeCrosshairMove(p=>_updateLegend(p));
  // 드로잉 오버레이 (항상 pointer-events:none → 휠 줌·드래그 팬은 차트로 전달)
  _drawSvg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  _drawSvg.setAttribute("class","draw-svg"); _drawSvg.style.pointerEvents="none";
  el.appendChild(_drawSvg);
  // (mousedown/hover 리스너는 openStockChart에서 1회만 부착 — 봉 전환 시 중복 방지)
  _chart.timeScale().subscribeVisibleLogicalRangeChange(rng=>{
    _redrawDraws();
    if(_osc&&rng&&!_syncing){ _syncing=true; try{_osc.timeScale().setVisibleLogicalRange(rng);}catch(_){} _syncing=false; }
  });
  _roDraw=new ResizeObserver(()=>_redrawDraws()); _roDraw.observe(el);
}

// ── 지표 계산 ──
function _ma(rows, period){
  const out=[]; const q=[]; let sum=0;
  for(const r of rows){ q.push(r.close); sum+=r.close;
    if(q.length>period) sum-=q.shift();
    if(q.length===period) out.push({time:r.time, value:Math.round(sum/period)}); }
  return out;
}
function _bollinger(rows, period, mult){
  const u=[],m=[],l=[]; const q=[]; let sum=0;
  for(const r of rows){ q.push(r.close); sum+=r.close;
    if(q.length>period) sum-=q.shift();
    if(q.length===period){ const mean=sum/period; let v=0; for(const x of q) v+=(x-mean)*(x-mean);
      const sd=Math.sqrt(v/period);
      m.push({time:r.time,value:Math.round(mean)});
      u.push({time:r.time,value:Math.round(mean+mult*sd)});
      l.push({time:r.time,value:Math.round(mean-mult*sd)}); } }
  return {u,m,l};
}
function _rsi(rows, period){
  const out=[]; let gain=0,loss=0;
  for(let i=1;i<rows.length;i++){
    const ch=rows[i].close-rows[i-1].close, g=Math.max(0,ch), ls=Math.max(0,-ch);
    if(i<period){ gain+=g; loss+=ls; }
    else if(i===period){ gain=(gain+g)/period; loss=(loss+ls)/period;
      const rs=loss===0?100:gain/loss; out.push({time:rows[i].time,value:loss===0?100:100-100/(1+rs)}); }
    else { gain=(gain*(period-1)+g)/period; loss=(loss*(period-1)+ls)/period;
      const rs=loss===0?100:gain/loss; out.push({time:rows[i].time,value:loss===0?100:100-100/(1+rs)}); }
  }
  return out.map(o=>({time:o.time,value:Math.round(o.value*100)/100}));
}
function _emaArr(vals, p){
  const k=2/(p+1), out=new Array(vals.length).fill(null); let ema=null;
  for(let i=0;i<vals.length;i++){ if(vals[i]==null)continue;
    ema = ema==null ? vals[i] : vals[i]*k + ema*(1-k); out[i]=ema; }
  return out;
}
function _macd(rows, fast, slow, signal){
  const close=rows.map(r=>r.close);
  const ef=_emaArr(close,fast), es=_emaArr(close,slow);
  const macdArr=close.map((_,i)=> (ef[i]!=null&&es[i]!=null)? ef[i]-es[i] : null);
  const sig=_emaArr(macdArr,signal);
  const macd=[],signalL=[],hist=[];
  for(let i=0;i<rows.length;i++){
    if(macdArr[i]!=null) macd.push({time:rows[i].time,value:Math.round(macdArr[i])});
    if(sig[i]!=null&&macdArr[i]!=null){ signalL.push({time:rows[i].time,value:Math.round(sig[i])});
      hist.push({time:rows[i].time,value:Math.round(macdArr[i]-sig[i])}); }
  }
  return {macd,signal:signalL,hist};
}

function _applyIndicators(){
  const c=_chartRows;
  if(_maSeries){ _MA_PERIODS.forEach(p=>{ _maSeries[p].setData(_maSel.has(p)?_ma(c,p):[]); }); }
  if(_bollSeries){ if(_ind.boll){ const b=_bollinger(c,20,2);
      _bollSeries.u.setData(b.u); _bollSeries.m.setData(b.m); _bollSeries.l.setData(b.l); }
    else { _bollSeries.u.setData([]); _bollSeries.m.setData([]); _bollSeries.l.setData([]); } }
  _applyOsc();
}
function _applyOsc(){
  const oc=document.getElementById("tv_osc_container");
  if(_osc){ try{_osc.remove();}catch(_){} _osc=null; }
  if(!_ind.osc || !_chartRows.length){ oc.style.height="0"; oc.style.marginTop="0"; oc.innerHTML=""; return; }
  oc.innerHTML=""; oc.style.height="146px"; oc.style.marginTop="6px";
  _osc=LightweightCharts.createChart(oc,{autoSize:true,..._CHART_LAYOUT,
    layout:{background:{color:"#0b0b0e"},textColor:"#777",fontFamily:"'Noto Sans KR',sans-serif"},
    timeScale:{borderColor:"#222",timeVisible:_isIntraday(),secondsVisible:false}});
  const c=_chartRows;
  if(_ind.osc==="rsi"){
    const s=_osc.addLineSeries({color:"#d4af37",lineWidth:1,priceLineVisible:false});
    s.setData(_rsi(c,14));
    s.createPriceLine({price:70,color:"#664400",lineStyle:2,lineWidth:1,axisLabelVisible:true,title:"70"});
    s.createPriceLine({price:30,color:"#004455",lineStyle:2,lineWidth:1,axisLabelVisible:true,title:"30"});
  } else {
    const m=_macd(c,12,26,9);
    const h=_osc.addHistogramSeries({priceLineVisible:false});
    h.setData(m.hist.map(x=>({time:x.time,value:x.value,color:x.value>=0?"rgba(231,76,60,.5)":"rgba(52,152,219,.5)"})));
    _osc.addLineSeries({color:"#e0a020",lineWidth:1,priceLineVisible:false,lastValueVisible:false}).setData(m.macd);
    _osc.addLineSeries({color:"#3aa0ff",lineWidth:1,priceLineVisible:false,lastValueVisible:false}).setData(m.signal);
  }
  _osc.timeScale().subscribeVisibleLogicalRangeChange(rng=>{
    if(_chart&&rng&&!_syncing){ _syncing=true; try{_chart.timeScale().setVisibleLogicalRange(rng);}catch(_){} _syncing=false; } });
  try{ const r=_chart.timeScale().getVisibleLogicalRange(); if(r)_osc.timeScale().setVisibleLogicalRange(r); }catch(_){}
}

function toggleInd(k){
  _ind[k]=!_ind[k];
  const b=document.querySelector(`.ct-btn[data-ind="${k}"]`); if(b)b.classList.toggle("active",_ind[k]);
  _applyIndicators();
}
function toggleOsc(which){
  _ind.osc=(_ind.osc===which)?null:which;
  ["rsi","macd"].forEach(o=>{const b=document.querySelector(`.ct-btn[data-ind="${o}"]`); if(b)b.classList.toggle("active",_ind.osc===o);});
  _applyOsc();
}
function toggleMA(p){
  if(_maSel.has(p)) _maSel.delete(p); else _maSel.add(p);
  try{ localStorage.setItem("ma_sel", JSON.stringify([..._maSel])); }catch(_){}
  const b=document.querySelector(`.ct-btn[data-ma="${p}"]`); if(b)b.classList.toggle("active",_maSel.has(p));
  _applyIndicators();
}
function _applyMAButtons(){   // 모달 열 때 저장된 선택 상태를 버튼에 반영
  _MA_PERIODS.forEach(p=>{ const b=document.querySelector(`.ct-btn[data-ma="${p}"]`); if(b)b.classList.toggle("active",_maSel.has(p)); });
}

// ── 그리기 (직선·원=타원) — 누르고 끌어서 놓기 ──
// · 좌표는 logical(가로 인덱스)·price 로 저장 → 빈 공간/축 위에서도 투영, 확대축소 시 따라붙음
// · SVG는 항상 pointer-events:none → 휠 줌·드래그 팬은 차트로 그대로 전달
// · 도구 활성 시에만 container의 capture 단계 mousedown을 가로채 그리기, 한 도형 그리면 자동 해제
function setDraw(tool){
  _drawTool=(_drawTool===tool)?null:tool; _drawPending=null;
  document.querySelectorAll('.ct-btn[data-draw]').forEach(b=>b.classList.toggle("active",b.dataset.draw===_drawTool));
  const el=document.getElementById("tv_chart_container");
  if(el) el.classList.toggle("drawing",!!_drawTool);
}
function setDrawColor(c,btn){ _drawColor=c; document.querySelectorAll('.ct-sw').forEach(b=>b.classList.toggle("active",b===btn)); }
function setDrawWidth(w,btn){ _drawWidth=w; document.querySelectorAll('.ct-btn.wbtn').forEach(b=>b.classList.toggle("active",b===btn)); }
// 저장 좌표 = 날짜(time) 우선, 데이터 밖(미래 투사 공간)만 마지막 봉 기준 상대offset
// · 이유: logical(막대 인덱스) 그대로 저장하면 일봉 API가 매일 "최근 N봉"만 돌려줘서
//   옛 봉이 앞에서 빠질 때마다 인덱스가 통째로 밀려 그림이 엉뚱한 자리로 어긋남(2026-07-08 버그)
function _persistPt(p){
  const idx=Math.round(p.logical);
  if(_chartRows.length && idx>=0 && idx<_chartRows.length) return {t:_chartRows[idx].time, price:p.price};
  return {ofs:p.logical-(_chartRows.length-1), price:p.price};
}
function _logicalOf(p){
  if(p.logical!=null) return p.logical;              // 드래그 중 임시점(런타임 raw)
  if(p.t!=null){ const idx=_chartRows.findIndex(r=>r.time===p.t); return idx>=0?idx:null; }
  return (_chartRows.length-1)+(p.ofs||0);
}
function _proj(p){ const l=_logicalOf(p); if(l==null)return{x:null,y:null}; return {x:_chart.timeScale().logicalToCoordinate(l), y:_chartCandle.priceToCoordinate(p.price)}; }
function _drawOff(){
  _drawTool=null; _drawPending=null;
  document.querySelectorAll('.ct-btn[data-draw]').forEach(b=>b.classList.remove("active"));
  const el=document.getElementById("tv_chart_container"); if(el) el.classList.remove("drawing");
}
function undoDraw(){ _draws.pop(); _drawPending=null; _saveDraws(); _redrawDraws(); }
// 예전(logical만 저장) 도형을 time/ofs 형식으로 1회 변환 — 이후로는 데이터 앞부분이 잘려도 절대 안 밀림
// (단, 이미 어긋난 예전 그림의 "원래 의도했던 자리"까지는 복구 불가 — 지금 보이는 자리에서 고정만 됨)
function _migrateLegacyDraws(){
  let changed=false;
  for(const d of _draws){
    if(d.type==="pen"){
      d.pts=(d.pts||[]).map(p=>{ if(p && p.logical!=null){ changed=true; return _persistPt(p); } return p; });
    } else if(d.a || d.b){
      if(d.a && d.a.logical!=null){ d.a=_persistPt(d.a); changed=true; }
      if(d.b && d.b.logical!=null){ d.b=_persistPt(d.b); changed=true; }
    }
  }
  if(changed) _saveDraws();
}
function _drawPt(e){
  const el=document.getElementById("tv_chart_container");
  const r=el.getBoundingClientRect();
  const x=Math.max(0,Math.min(el.clientWidth, e.clientX-r.left));
  const y=Math.max(0,Math.min(el.clientHeight, e.clientY-r.top));
  return {x,y, logical:_chart.timeScale().coordinateToLogical(x), price:_chartCandle.coordinateToPrice(y)};
}
// 거리 계산 (점→선분)
function _distToSeg(px,py,x1,y1,x2,y2){
  const dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy||1;
  let t=((px-x1)*dx+(py-y1)*dy)/L2; t=Math.max(0,Math.min(1,t));
  return Math.hypot(px-(x1+t*dx), py-(y1+t*dy));
}
// (x,y) 픽셀이 어떤 도형 위인가 → 인덱스 (위에 그린 것 우선), 없으면 -1
function _hitShape(x,y){
  if(!_chart||!_chartCandle)return -1;
  for(let i=_draws.length-1;i>=0;i--){
    const d=_draws[i];
    if(d.type==="pen"){
      const ps=(d.pts||[]).map(_proj);
      for(let k=1;k<ps.length;k++){ const A=ps[k-1],B=ps[k];
        if(A.x==null||B.x==null||A.y==null||B.y==null)continue;
        if(_distToSeg(x,y,A.x,A.y,B.x,B.y)<=6) return i; }
      continue;
    }
    const a=_proj(d.a), b=_proj(d.b);
    if(a.x==null||b.x==null||a.y==null||b.y==null)continue;
    if(d.type==="line"){ if(_distToSeg(x,y,a.x,a.y,b.x,b.y)<=6) return i; }
    else { const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2, rx=Math.abs(b.x-a.x)/2||1, ry=Math.abs(b.y-a.y)/2||1;
      const nx=(x-cx)/rx, ny=(y-cy)/ry; if(nx*nx+ny*ny<=1.15) return i; }
  }
  return -1;
}
// 도형 통째로 이동 (logical·price 평행이동)
function _startMove(idx,p){
  const d=_draws[idx]; const isPen=d.type==="pen";
  // 이동은 logical 공간에서 델타 계산 → 끝나면 다시 time/ofs로 영구화(_persistPt)
  const _lg=q=>{ const l=_logicalOf(q); return l==null?_chartRows.length-1:l; };
  const orig=isPen?(d.pts||[]).map(q=>({logical:_lg(q), price:q.price}))
                  :[{logical:_lg(d.a),price:d.a.price},{logical:_lg(d.b),price:d.b.price}];
  const sl=p.logical, sp=p.price;
  const mv=ev=>{ const q=_drawPt(ev); if(q.logical==null||q.price==null)return;
    const dl=q.logical-sl, dp=q.price-sp;
    if(isPen) d.pts=orig.map(o=>_persistPt({logical:o.logical+dl, price:o.price+dp}));
    else { d.a=_persistPt({logical:orig[0].logical+dl, price:orig[0].price+dp}); d.b=_persistPt({logical:orig[1].logical+dl, price:orig[1].price+dp}); }
    _redrawDraws();
  };
  const up=()=>{ window.removeEventListener("mousemove",mv,true); window.removeEventListener("mouseup",up,true); _saveDraws(); };
  window.addEventListener("mousemove",mv,true);
  window.addEventListener("mouseup",up,true);
}
// capture mousedown 분기: 도구=그리기 / 도형위=이동 / 그외=차트 팬
function _chartMouseDown(e){
  if(!_chart||!_chartCandle)return;
  if(e.button!==0)return;   // 좌클릭만 그리기/이동 (우클릭=취소용)
  if(_drawTool){ _startNewDraw(e); return; }
  const p=_drawPt(e);
  const idx=_hitShape(p.x,p.y);
  if(idx<0) return;                        // 빈 차트 좌드래그 = 차트 이동(팬, lightweight-charts 기본)
  e.preventDefault(); e.stopPropagation();
  _startMove(idx,p);
}
// Shift 시 직선을 수평/수직으로 스냅 (드래그 픽셀 델타로 판정)
function _snapB(a, bRaw, shift){
  if(!shift || _drawTool!=="line") return bRaw;
  const A=_proj(a), B=_proj(bRaw);
  if(A.x==null||B.x==null||A.y==null||B.y==null) return bRaw;
  return (Math.abs(B.x-A.x) >= Math.abs(B.y-A.y))
    ? {logical:bRaw.logical, price:a.price}     // 수평 (가격 고정)
    : {logical:a.logical, price:bRaw.price};    // 수직 (시간 고정)
}
function _cancelDraw(){ if(_drawCancel){ try{_drawCancel();}catch(_){} _drawCancel=null; } _drawOff(); }

function _startNewDraw(e){
  if(!_drawTool||!_chart||!_chartCandle)return;
  const p=_drawPt(e);
  if(p.logical==null||p.price==null)return;
  e.preventDefault(); e.stopPropagation();          // 그릴 때만 차트 팬 차단
  // 펜: 자유 곡선 (드래그 궤적 전체 기록)
  if(_drawTool==="pen"){
    const pts=[{logical:p.logical, price:p.price}];
    const mv=ev=>{ const q=_drawPt(ev); if(q.logical!=null&&q.price!=null){ pts.push({logical:q.logical,price:q.price});
      _previewDraw({type:"pen",pts,color:_drawColor,width:_drawWidth}); } };
    const cleanup=()=>{ window.removeEventListener("mousemove",mv,true); window.removeEventListener("mouseup",up,true); };
    function up(){ cleanup(); _drawCancel=null;
      if(pts.length>1){ _draws.push({type:"pen",pts:pts.map(_persistPt),color:_drawColor,width:_drawWidth}); _saveDraws(); }
      _redrawDraws(); }
    _drawCancel=()=>{ cleanup(); _redrawDraws(); };   // 취소 = 커밋 안 함
    window.addEventListener("mousemove",mv,true); window.addEventListener("mouseup",up,true);
    return;
  }
  // 직선/원: 시작→끝 드래그
  const startX=p.x, startY=p.y;
  _drawPending={logical:p.logical, price:p.price};
  const mv=ev=>{ if(!_drawPending)return; const q=_drawPt(ev); if(q.logical==null||q.price==null)return;
    const b=_snapB(_drawPending,{logical:q.logical,price:q.price},ev.shiftKey);
    _previewDraw({type:_drawTool, a:_drawPending, b, color:_drawColor, width:_drawWidth}); };
  const cleanup=()=>{ window.removeEventListener("mousemove",mv,true); window.removeEventListener("mouseup",up,true); };
  function up(ev){
    cleanup(); _drawCancel=null;
    const q=_drawPt(ev);
    const dist=Math.hypot(q.x-startX, q.y-startY);
    if(_drawPending && q.logical!=null && q.price!=null && dist>=5){
      const b=_snapB(_drawPending,{logical:q.logical,price:q.price},ev.shiftKey);
      _draws.push({type:_drawTool, a:_persistPt(_drawPending), b:_persistPt(b), color:_drawColor, width:_drawWidth});
      _saveDraws();   // 종목·봉별 저장 (도구 유지 → 계속 그리기)
    }
    _drawPending=null; _redrawDraws();
  }
  _drawCancel=()=>{ cleanup(); _drawPending=null; _redrawDraws(); };   // 취소
  window.addEventListener("mousemove",mv,true);
  window.addEventListener("mouseup",up,true);
}
// 도형 1개 → SVG (현재 차트 좌표로 투영, 색·굵기 반영)
function _shapeToSvg(d, dashed){
  const col=d.color||"#f0c040", w=d.width||2, da=dashed?' stroke-dasharray="5 3"':'';
  if(d.type==="pen"){
    const ps=(d.pts||[]).map(_proj).filter(q=>q.x!=null&&q.y!=null);
    if(ps.length<2)return"";
    return `<polyline points="${ps.map(q=>q.x+','+q.y).join(' ')}" fill="none" stroke="${col}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"${da}/>`;
  }
  const a=_proj(d.a), b=_proj(d.b);
  if(a.x==null||b.x==null||a.y==null||b.y==null)return"";
  if(d.type==="line") return `<line x1="${a.x}" y1="${a.y}" x2="${b.x}" y2="${b.y}" stroke="${col}" stroke-width="${w}"${da}/>`;
  const cx=(a.x+b.x)/2, cy=(a.y+b.y)/2, rx=Math.abs(b.x-a.x)/2, ry=Math.abs(b.y-a.y)/2;
  return `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${col}" stroke-width="${w}"${da}/>`;
}
function _previewDraw(d){ _redrawDraws(); const s=_shapeToSvg(d,true); if(s)_drawSvg.insertAdjacentHTML("beforeend",s); }
function _redrawDraws(){
  if(!_drawSvg||!_chart||!_chartCandle)return;
  const el=document.getElementById("tv_chart_container");
  const w=el.clientWidth, h=el.clientHeight;
  _drawSvg.setAttribute("width",w); _drawSvg.setAttribute("height",h); _drawSvg.setAttribute("viewBox",`0 0 ${w} ${h}`);
  _drawSvg.innerHTML=_draws.map(d=>_shapeToSvg(d,false)).join("");
}
// 도형 투영(시간·가격축 둘 다)이 바뀌면만 재계산 — 가격축 줌·초기 레이아웃까지 자동 추적
function _drawTick(){
  if(_drawSvg && _chart && _chartCandle && _draws.length){
    let sig="x";
    try{
      const d=_draws[0];
      const p0=d.type==="pen"?(d.pts&&d.pts[0]):d.a;
      const a=_proj(p0);
      sig=`${a.x},${a.y},${_draws.length}`;
    }catch(_){}
    if(sig!==_lastProj){ _lastProj=sig; _redrawDraws(); }
  }
  _drawRaf=requestAnimationFrame(_drawTick);
}

function _updateLegend(param){
  const el=document.getElementById("chart-legend");
  if(!el||!_chartRows.length)return;
  let idx=-1;
  if(param && param.time!=null) idx=_chartRows.findIndex(r=>r.time===param.time);
  if(idx<0) idx=_chartRows.length-1;
  const row=_chartRows[idx];
  if(!row){ el.textContent=""; return; }
  const f=v=>Math.round(v).toLocaleString("ko-KR");
  const up=row.close>=row.open;
  // 등락률 = 직전 봉 종가 대비(없으면 당봉 시가 대비). 일·분·월·주 모두 동일 로직.
  const prev=idx>0?_chartRows[idx-1].close:row.open;
  const pct=prev?(row.close-prev)/prev*100:0;
  const pcol=pct>0?'#e74c3c':pct<0?'#3498db':'#999';
  el.innerHTML=`<span class="lg">시</span>${f(row.open)} <span class="lg">고</span>${f(row.high)}`+
    ` <span class="lg">저</span>${f(row.low)} <span class="lg">종</span>`+
    `<b style="color:${up?'#e74c3c':'#3498db'}">${f(row.close)}</b>`+
    ` <b style="color:${pcol}">${pct>0?'+':''}${pct.toFixed(2)}%</b>`+
    ` <span class="lg">량</span>${(row.value||0).toLocaleString("ko-KR")}`;
}
async function loadChartData(){
  const el=document.getElementById("tv_chart_container");
  if(!_chartCandle)return;
  _draws=_loadDraws();   // 이 종목·봉종류의 저장된 그림 복원
  _lastProj=null;        // 새 데이터 → 도형 재계산 강제
  try{
    const r=await fetch(`/api/stock_candles?code=${encodeURIComponent(_chartCode)}&tf=${_chartTf}`);
    const d=await r.json();
    const c=(d.candles||[]);
    if(!c.length){
      const msg=document.createElement("div"); msg.className="chart-msg";
      msg.textContent="캔들 데이터 없음 (장외/신규 상장 등)"; el.appendChild(msg); return;
    }
    _chartRows=c;
    _migrateLegacyDraws();   // 예전 logical-only 그림 → time/ofs 로 1회 고정(더 이상 안 밀리게)
    _chartCandle.setData(c.map(x=>({time:x.time,open:x.open,high:x.high,low:x.low,close:x.close})));
    _chartVol.setData(c.map(x=>({time:x.time,value:x.value,
      color:x.close>=x.open?"rgba(231,76,60,.45)":"rgba(52,152,219,.45)"})));
    _applyIndicators();
    // 저장된 보기 범위(줌/스크롤) 복원, 없으면: 분봉=최근 다일치(~180봉), 일/주/월=전체
    const v=_loadView();
    if(v && v.from!=null){ try{ _chart.timeScale().setVisibleLogicalRange(v); }catch(_){ _chart.timeScale().fitContent(); } }
    else if(_isIntraday() && c.length>180){
      try{ _chart.timeScale().setVisibleLogicalRange({from:c.length-180, to:c.length+2}); }
      catch(_){ _chart.timeScale().fitContent(); }
    }
    else _chart.timeScale().fitContent();
    _updateLegend(null); _redrawDraws();
  }catch(e){
    el.insertAdjacentHTML("beforeend",`<div class="chart-msg">차트 로드 실패: ${esc(e.message)}</div>`);
  }
}
function setChartTf(tf){
  _saveView();       // 전환 전 현재 봉의 보기 범위 저장
  _chartTf=tf;
  document.querySelectorAll(".chart-tf .tf-btn").forEach(b=>b.classList.toggle("active",b.dataset.tf===tf));
  _saveChartWin();   // 마지막 봉 종류 저장
  _initChart(); loadChartData();
  if(_cfOn) _cfRender();   // 봉 전환 후 컨센 오버레이 재적용(일봉+만)
}
function _edgeResize(box){
  // 우하단 코너(resize:both)에 더해 오른쪽·아래쪽 엣지로도 크기조절 (헤더/코너와 겹치지 않게 오프셋)
  const mk=css=>{ const h=document.createElement("div");
    h.style.cssText="position:absolute;z-index:6;background:transparent;"+css;
    box.appendChild(h); return h; };
  const right =mk("top:90px;bottom:16px;right:0;width:9px;cursor:ew-resize;");
  const bottom=mk("left:0;right:16px;bottom:0;height:9px;cursor:ns-resize;");
  const drag=(h,axis)=>h.addEventListener("mousedown",e=>{
    e.preventDefault(); e.stopPropagation();
    const x0=e.clientX,y0=e.clientY,w0=box.offsetWidth,h0=box.offsetHeight;
    const mv=ev=>{
      if(axis!=="y") box.style.width =Math.max(440,w0+ev.clientX-x0)+"px";
      if(axis!=="x") box.style.height=Math.max(360,h0+ev.clientY-y0)+"px";
    };
    const up=()=>{ document.removeEventListener("mousemove",mv);
      document.removeEventListener("mouseup",up);
      try{ _saveChartWin(); }catch(_){}
    };
    document.addEventListener("mousemove",mv); document.addEventListener("mouseup",up);
  });
  drag(right,"x"); drag(bottom,"y");
}
function closeStockChart(){
  const m=document.getElementById("chart-modal");
  _cfClearArrow(); _cfSeries=null;
  if(_drawRaf){ cancelAnimationFrame(_drawRaf); _drawRaf=null; }
  _saveView();       // 종료 시 보기 범위 저장
  _saveChartWin();   // 종료 시 봉 종류·창 크기·위치 저장
  if(_osc){ try{_osc.remove();}catch(_){} _osc=null; }
  if(_chart){ try{_chart.remove();}catch(_){} _chart=null; }
  if(_roDraw){ try{_roDraw.disconnect();}catch(_){} _roDraw=null; }
  if(m){ m.classList.remove("open"); m.innerHTML=""; }
}

async function initLoad(){
  await loadOverview();
  prefetchTabs();
  checkPendingBriefing();
}

// 골-루프: 이상징후로 대기 중인 아침 브리핑 있으면 상단 배너 + 수동 발행 버튼
async function checkPendingBriefing(){
  let p; try{ p=await (await fetch("/api/briefing/pending")).json(); }catch(_){ return; }
  if(!p || !p.date) return;
  let el=document.getElementById("pending-briefing-banner");
  if(!el){ el=document.createElement("div"); el.id="pending-briefing-banner"; document.body.appendChild(el); }
  el.style.cssText="position:fixed;left:50%;transform:translateX(-50%);top:10px;z-index:9999;"
    +"background:#2a2216;border:1px solid rgba(240,168,72,.5);border-radius:10px;padding:10px 16px;"
    +"box-shadow:0 6px 24px rgba(0,0,0,.5);font-size:13px;color:#f0d98a;display:flex;align-items:center;gap:14px;max-width:92vw";
  el.innerHTML=`<span>⚠️ <b>${esc(p.date)} 아침 브리핑</b>이 이상징후로 대기 중 — ${esc((p.reasons||[]).join(" / "))}</span>`
    +`<button id="pb-send" style="flex-shrink:0;padding:6px 14px;background:rgba(240,168,72,.15);border:1px solid rgba(240,168,72,.5);border-radius:8px;color:#f0d98a;font-size:12px;cursor:pointer;font-family:inherit;font-weight:600">채널 발행</button>`
    +`<span id="pb-x" style="cursor:pointer;color:#8a7a3f">✕</span>`;
  el.querySelector("#pb-x").onclick=()=>el.remove();
  el.querySelector("#pb-send").onclick=async()=>{
    const b=el.querySelector("#pb-send"); b.disabled=true; b.textContent="발행 중…";
    try{ const r=await (await fetch("/api/briefing/publish_pending",{method:"POST"})).json();
      if(r.ok&&r.sent){ el.innerHTML="<span>✅ 채널 발행 완료</span>"; setTimeout(()=>el.remove(),2500); }
      else { b.disabled=false; b.textContent="채널 발행"; showToast&&showToast("발행 실패: "+(r.error||"전송 실패"),"err"); }
    }catch(e){ b.disabled=false; b.textContent="채널 발행"; }
  };
}

// 관심종목 카드: 위임 클릭 → 차트 오픈 (터치에서도 확실히 동작, 드래그/삭제 제외)
(function(){ const row=document.getElementById("wl-row"); if(row){
  row.addEventListener("click",ev=>{
    if(ev.target.closest(".x")) return;
    const card=ev.target.closest(".wl-card"); if(!card) return;
    if(_wlJustDragged) return;
    openStockChart(card.dataset.code, card.dataset.name);
  });
}})();

// 터치기기: 지표 라벨(점선) 탭 → 설명 툴팁을 토스트로 (hover 대체)
if(window.matchMedia&&window.matchMedia("(hover:none)").matches){
  document.addEventListener("click",ev=>{
    const el=ev.target.closest(".tk-lab.hint[title], .ep-nm[title]");
    if(el&&el.getAttribute("title")) showToast(el.getAttribute("title"));
  });
}

initLoad();
loadEtfBar();
loadMarketFlowSample();   // 즉시 샘플 표시 (빈화면 방지)
loadMarketFlow();          // 실제 API 데이터로 즉시 교체
loadWatchlist();           // 관심종목 + 잠정수급
setInterval(loadEtfBar,    30000);
setInterval(loadMarketFlow, 30000);
renderBelowPanel();         // 즉시 "불러오는 중" 표시 (빈화면 방지)
loadMarketBriefing();
setInterval(loadMarketBriefing, 30000);
setInterval(loadWatchlist,  60000);  // 수급 키움 콜 부하 고려 60초
</script>
