<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>대본 칼카피</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=Black+Han+Sans&display=swap">
<style>
:root{--bg:#f3f2ee;--paper:#fff;--ink:#1d1b18;--muted:#6a655c;--line:#dcd8cf;--frost:#ece9e1;--acc:#0f6e5d;--acc-soft:#e1f1ec;
--fd:"Black Han Sans","IBM Plex Sans KR",sans-serif;--fb:"IBM Plex Sans KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141310;--paper:#1d1b18;--ink:#ebe7df;--muted:#a49e93;--line:#38342d;--frost:#26231e;--acc:#5cc4ab;--acc-soft:#1b3530;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:14.5px;line-height:1.6}
.wrap{max-width:1240px;margin:0 auto;padding:20px 16px 60px}
h1{font-family:var(--fd);font-weight:400;font-size:28px;margin:0 0 4px}h2{font-family:var(--fd);font-weight:400;font-size:23px;margin:0 0 6px}
h3{font-size:14px;margin:12px 0 4px}.mut{color:var(--muted);font-size:12.5px}
section{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:20px}
.tbl{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--frost)}
.chip{display:inline-block;background:var(--frost);border-radius:999px;padding:1px 8px;margin:2px 2px;font-size:12.5px}.chip b{color:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}@media(max-width:800px){.grid2{grid-template-columns:1fr}}
ul,ol{margin:4px 0;padding-left:20px}li{margin:2px 0}.beat{font-size:11px;color:var(--acc);background:var(--acc-soft);border-radius:4px;padding:0 5px;margin-right:4px}
details{margin:4px 0}summary{cursor:pointer}
.recipe{background:var(--acc-soft);border-radius:10px;padding:10px 14px;margin:8px 0 12px}.recipe ol li{margin:4px 0}.rec h3{margin-top:10px}
</style></head><body><div class="wrap">
<h1>대본 칼카피 — @@SLUG@@</h1><p class="mut">@@META@@ · 숫자는 전부 줄별 태그를 센 값</p>
<section><h2>유형 한눈에</h2><div class="tbl"><table><tr><th>유형</th><th>설명</th><th>편수</th><th>조회 중앙</th><th>전개 방식(상위)</th></tr>@@OVER@@</table></div></section>
@@BODY@@
</div></body></html>
