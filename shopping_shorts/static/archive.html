<!doctype html>
<!-- 역대 히트작(채널 아카이브, 2026-08-03) — 관리자 전용.
     백그라운드 크롤러(channel_archive)가 채운 채널 전체 릴스를 조회수순으로 본다.
     매일 수집 랭킹(48h 창)이 못 보는 옛 히트작 발굴용. 담기=기존 /api/mix/basket/toggle.
     ⚠️ 썸네일은 인스타 CDN 만료토큰이라 오래된 건 깨질 수 있음 → onerror로 가리고
     카드 클릭 시 원본 릴스를 새탭으로 연다(재생·확인은 원본에서). -->
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏆 역대 히트작 — 채널 아카이브</title>
<style>
:root{--bg:#0d1117;--card:#161b22;--line:#30363d;--txt:#e6edf3;--sub:#8b98a9;--accent:#58a6ff;--gold:#e3b341}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,'Malgun Gothic',sans-serif}
.wrap{max-width:1200px;margin:0 auto;padding:16px}
h1{font-size:18px;margin:6px 0 12px}
.bar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
select,input,button{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:13px}
button{cursor:pointer}
button.on{border-color:var(--accent);color:var(--accent);font-weight:700}
.stat{font-size:12px;color:var(--sub)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.thumb{position:relative;aspect-ratio:9/16;background:#000;cursor:pointer}
.thumb img{width:100%;height:100%;object-fit:cover}
.views{position:absolute;bottom:6px;left:6px;background:rgba(0,0,0,.7);color:var(--gold);font-weight:700;font-size:12px;padding:2px 8px;border-radius:10px}
.body{padding:8px}
.ch{font-size:12px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:11px;color:var(--sub);margin:3px 0 6px}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.btns button{font-size:12px;padding:6px 4px;white-space:nowrap}
.save.saved{border-color:#1f9d55;color:#1f9d55}
.empty{color:var(--sub);padding:30px;text-align:center}
/* 검색 버튼 2종(2026-08-04) — 색으로 확실히 가른다. 파워검색=외부(구글렌즈, 유료 SerpApi)
   금색 / 내부검색=우리 관리채널 아카이브(무료) 청록. 헛눌러 유료를 태우면 안 된다.
   둘 다 격자 한 줄을 통째로(span 2) 차지해 '원본·담기'와 종류가 다름을 드러낸다. */
.btns .power-btn{grid-column:1/-1;border:1px solid #b8860b;
  background:linear-gradient(90deg,#3a2f0d,#2a2408);color:#ffd76b}
.btns .power-btn:hover{background:linear-gradient(90deg,#4a3d10,#352d0a)}
.btns .power-btn:disabled{opacity:.6;cursor:wait}
.btns .inner-btn{grid-column:1/-1;border:1px solid #1f6f6b;
  background:linear-gradient(90deg,#0e2f2e,#0a2422);color:#5fe3d6}
.btns .inner-btn:hover{background:linear-gradient(90deg,#14403e,#0d2e2b)}
/* 결과 모달 — index.html의 무거운 플로팅 모달을 옮기지 않고, 이 페이지에 필요한 만큼만. */
.modal-bg{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.55)}
.modal-bg.open{display:block}
.modal-box{position:absolute;top:3vh;left:50%;transform:translateX(-50%);
  background:var(--bg);border:1px solid var(--line);border-radius:14px;
  width:min(1040px,96vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;
  box-shadow:0 10px 44px rgba(0,0,0,.6)}
.modal-head{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.modal-head b{font-size:14px;flex:1}
.modal-body{padding:12px 14px;overflow:auto}
.sm-loading{padding:24px;text-align:center;color:var(--sub)}
</style></head><body><div class="wrap">
<h1>🏆 역대 히트작 <span class="stat" id="prog"></span></h1>
<div class="bar" id="catBar"></div>
<div class="bar">
  <select id="chSel"><option value="">전체 채널</option></select>
  <input id="q" placeholder="채널명 검색" style="width:140px">
  <button id="bComments" class="on" onclick="setSort('comments')">💬 댓글순</button>
  <button id="bViews" onclick="setSort('views')">🔥 조회수순</button>
  <button id="bRecent" onclick="setSort('recent')">🕒 최신순</button>
  <button onclick="load()">↻ 새로고침</button>
  <span class="stat">아카이브는 백그라운드로 계속 쌓입니다(팔로워 큰 채널부터) — 새로고침하면 늘어나요.</span>
</div>
<div class="cards" id="cards"><div class="empty">불러오는 중…</div></div>
</div>
<div class="modal-bg" id="modalBg" onclick="if(event.target===this)closeModal()">
  <div class="modal-box">
    <div class="modal-head"><b id="modalTitle"></b><button onclick="closeModal()">✕ 닫기</button></div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>
<script src="/sidebar.js"></script>
<script>
let SORT='comments', SAVED=new Set();   // 기본=댓글순(사장님: 댓글수 기준이 제일 정확)
let CAT='전체', CH_CAT={};              // 채널→카테고리(레퍼런스 채널과 같은 축)
const CATS=['전체','홈템','레시피','뷰티','기타'];
function renderCatBar(){
  document.getElementById('catBar').innerHTML=CATS.map(c=>
    `<button class="${CAT===c?'on':''}" onclick="setCat('${c}')">${c}</button>`).join('');
}
function setCat(c){CAT=c;renderCatBar();fillChSel();document.getElementById('chSel').value='';load();}
// 썸네일 클릭 → 인라인 재생(랭킹 playInstagram과 동일 경로: /api/media가 yt-dlp로 mp4 해석).
// 해석(/api/media→yt-dlp)은 서버에서 2~4초 걸린다. 표시가 없으면 그동안 화면이 죽은 것처럼
// 보여 사장님이 "미리보기가 안 된다"고 느낀다(2026-08-04 제보) → 랭킹의 _thumbLoading과 같은
// 대기 표시를 여기에도 단다. 실패해서 인스타로 나갈 땐 **왜 나가는지** 알려주고 나간다.
function _archLoading(box){
  if(!box) return null;
  const d=document.createElement('div');
  d.textContent='⏳ 영상 불러오는 중…';
  d.style.cssText='position:absolute;inset:0;display:flex;align-items:center;justify-content:center;'
    +'background:rgba(0,0,0,.55);color:#fff;font-size:12px;border-radius:8px;z-index:3';
  if(getComputedStyle(box).position==='static') box.style.position='relative';
  box.appendChild(d); return d;
}
function _archToast(msg){
  const t=document.createElement('div');
  t.textContent=msg;
  t.style.cssText='position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:99999;'
    +'background:rgba(20,20,20,.94);color:#fff;font-size:13px;padding:11px 16px;border-radius:10px;'
    +'box-shadow:0 8px 28px rgba(0,0,0,.45);max-width:88vw;text-align:center';
  document.body.appendChild(t);
  setTimeout(()=>t.remove(), 3200);
}
async function playArch(el, sc, url){
  const box=el.parentElement;
  const old=el; el.style.opacity=.4;
  const load=_archLoading(box);
  try{
    const d=await (await fetch('/api/media?platform=instagram&id='+encodeURIComponent(sc))).json();
    if(d.ok&&d.url){
      if(load) load.remove();
      const v=document.createElement('video');
      v.src=d.url; v.controls=true; v.autoplay=true; v.playsInline=true;
      v.setAttribute('playsinline',''); v.style.cssText='width:100%;height:100%;object-fit:cover';
      v.onerror=()=>{ _archToast('영상 재생이 막혀 원본으로 엽니다'); window.open(url,'_blank'); };
      old.replaceWith(v); return;
    }
  }catch(e){}
  if(load) load.remove();
  el.style.opacity=1;
  // 해석 실패(비공개·삭제·차단) → 원본 새탭. 조용히 나가면 "왜 인스타로 튀지?"가 된다.
  _archToast('이 영상은 인앱 재생이 안 돼요 — 원본으로 엽니다');
  window.open(url,'_blank');
}
function fmt(n){n=n||0;if(n>=1e8)return (n/1e8).toFixed(1)+'억';if(n>=1e4)return (n/1e4).toFixed(1)+'만';return n.toLocaleString()}
function esc(s){return String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function setSort(s){SORT=s;
  document.getElementById('bComments').classList.toggle('on',s==='comments');
  document.getElementById('bViews').classList.toggle('on',s==='views');
  document.getElementById('bRecent').classList.toggle('on',s==='recent');load()}
let CHANNELS=[];
async function loadChannels(){
  const d=await (await fetch('/api/archive/channels')).json();
  if(!d.ok) return;
  CHANNELS=d.channels; CH_CAT={};
  CHANNELS.forEach(c=>CH_CAT[c.username]=c.category||'기타');
  fillChSel();
  document.getElementById('prog').textContent='— 수집된 채널 '+CHANNELS.length+'개';
}
function fillChSel(){
  const list=CHANNELS.filter(c=>CAT==='전체'||(c.category||'기타')===CAT);
  document.getElementById('chSel').innerHTML=
    '<option value="">전체 채널 ('+list.length+')</option>'+
    list.map(c=>`<option value="${esc(c.username)}">@${esc(c.username)} · ${esc(c.category||'기타')} (${c.reels}개 · 최고 ${fmt(c.top_views)})</option>`).join('');
}
async function loadSaved(){
  try{SAVED=new Set((await (await fetch('/api/mix/basket')).json()).shortcodes||[])}catch(e){}
}
// plat/src는 렌즈 결과(유튜브·틱톡·샤오홍슈…)용 — 안 넘기면 아카이브 기본값(인스타).
// 여기를 인스타로 고정해두면 렌즈로 담은 유튜브 영상이 인스타로 잘못 기록돼 믹스에서 깨진다.
async function toggleSave(sc,url,thumb,ch,btn,plat,src){
  const d=await (await fetch('/api/mix/basket/toggle',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({shortcode:sc,url:url,thumbnail:thumb,name:(ch?('@'+ch):''),caption:'',
      meta:{platform:plat||'instagram',source:src||'archive'}})})).json();
  if(d.in){SAVED.add(sc);btn.textContent='🎬 담김✓';btn.classList.add('saved')}
  else{SAVED.delete(sc);btn.textContent='📥 담기';btn.classList.remove('saved')}
}
async function blockCh(u,btn){
  // 영구차단 — 랭킹 화면과 같은 /api/prune/remove 재사용. 아카이브 API가 차단 채널을
  // 걸러내므로 새로고침 후에도 안 뜬다. 이 페이지 자체가 관리자 전용이라 버튼 게이트 불필요.
  if(!confirm('@'+u+' 채널을 영구 차단할까요?\n\n아카이브·랭킹·다음 수집에서 모두 사라집니다.\n(정리 탭 「추적 제외됨」에서 되돌릴 수 있습니다)')) return;
  if(btn){btn.disabled=true;btn.textContent='…';}
  try{
    const r=await fetch('/api/prune/remove?username='+encodeURIComponent(u)+'&name='+encodeURIComponent(u),{method:'POST'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    await loadChannels(); await load();
  }catch(e){ alert('차단 실패: '+e.message); if(btn){btn.disabled=false;btn.textContent='🚫';} }
}
async function load(){
  const u=document.getElementById('chSel').value, q=document.getElementById('q').value.trim();
  const catParam=CAT==='전체'?'':CAT;   // 영상 단위 카테고리는 서버가 비전태그로 판정
  const d=await (await fetch(`/api/archive/items?sort=${SORT}&username=${encodeURIComponent(u)}&q=${encodeURIComponent(q)}&cat=${encodeURIComponent(catParam)}&limit=200`)).json();
  const box=document.getElementById('cards');
  let items=(d.ok&&d.items)||[];
  if(!items.length){box.innerHTML='<div class="empty">아직 없음 — 크롤러가 채우는 중입니다. 잠시 뒤 새로고침해 보세요.</div>';return}
  box.innerHTML=items.map(i=>{
    const saved=SAVED.has(i.shortcode);
    return `<div class="card">
      <div class="thumb">
        <img id="th_${esc(i.shortcode)}" src="/api/thumb?url=${encodeURIComponent(i.thumbnail||'')}" loading="lazy" onerror="this.style.visibility='hidden'" onclick="playArch(this,'${esc(i.shortcode)}','${esc(i.url)}')" title="클릭하면 바로 재생">
        <span class="views">👁 ${fmt(i.views)}</span>
        <span style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.6);color:#fff;font-size:12px;padding:2px 7px;border-radius:10px">▶</span>
      </div>
      <div class="body">
        <div class="ch" style="display:flex;justify-content:space-between;align-items:center">
          <span>@${esc(i.username)}</span>
          <button title="이 채널을 영구 차단 — 아카이브·랭킹·수집에서 모두 사라집니다" onclick="blockCh('${esc(i.username)}',this)" style="padding:1px 7px;font-size:11px">🚫</button>
        </div>
        <div class="meta">❤ ${fmt(i.likes)} · 💬 ${fmt(i.comments)} · ${(i.posted_at||'').slice(0,10)}</div>
        <div class="btns">
          <button onclick="window.open('${esc(i.url)}','_blank')">▶ 원본</button>
          <button class="save${saved?' saved':''}" onclick="toggleSave('${esc(i.shortcode)}','${esc(i.url)}','${esc(i.thumbnail)}','${esc(i.username)}',this)">${saved?'🎬 담김✓':'📥 담기'}</button>
          <button class="power-btn" title="구글렌즈로 유튜브·틱톡·인스타·샤오홍슈·도우인에서 비슷한 영상 찾기 (유료·월 한도)" onclick="lensSearch(this,'${esc(i.shortcode)}')">🔍 숏템파워검색</button>
          <button class="inner-btn" title="우리가 관리하는 채널 아카이브에서 같은 제품·주제의 다른 영상 찾기 (무료·비전태그 매칭)" onclick="archiveSimilar('${esc(i.shortcode)}')">🏠 숏템내부검색</button>
        </div>
      </div></div>`;
  }).join('');
}
// ── 검색 2종(2026-08-04) ────────────────────────────────────────────
// 🔍 파워검색 = 외부(구글렌즈 → 5플랫폼). 유료 SerpApi라 월 한도가 있다.
// 🏠 내부검색 = 우리 관리채널 아카이브 안. 비전태그 겹침이라 무료·즉시.
function openModal(title, html){
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalBody').innerHTML=html;
  document.getElementById('modalBg').classList.add('open');
}
function closeModal(){document.getElementById('modalBg').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

// 결과 카드 공통 렌더 — 담기는 랭킹과 같은 /api/mix/basket/toggle로 간다(믹스로 바로 이어짐).
function resultCards(items, opts){
  const o=opts||{};
  return `<div class="cards">`+items.map(i=>{
    const sc=i.savesc||i.shortcode;
    const isS=(o.saved||new Set()).has(sc);
    const badge=(i.overlap!=null)?`<span style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);color:var(--gold);font-size:11px;padding:2px 8px;border-radius:10px">겹침 ${i.overlap}</span>`
      :(i.platform?`<span style="position:absolute;top:6px;right:6px;background:rgba(0,0,0,.65);color:#fff;font-size:11px;padding:2px 8px;border-radius:10px">${esc(i.platform)}</span>`:'');
    const thumb=i.thumbnail?('/api/thumb?url='+encodeURIComponent(i.thumbnail)):'';
    const meta=(i.views!=null||i.comments!=null)
      ? `❤ ${fmt(i.likes)} · 💬 ${fmt(i.comments)} · 👁 ${fmt(i.views)}` : esc(i.title||'');
    return `<div class="card">
      <div class="thumb" onclick="window.open('${esc(i.url)}','_blank')">
        <img src="${thumb}" referrerpolicy="no-referrer" loading="lazy" onerror="this.style.visibility='hidden'">
        ${badge}
      </div>
      <div class="body">
        <div class="ch">${esc(i.username?('@'+i.username):(i.source||''))}</div>
        <div class="meta">${meta}${i.posted_at?(' · '+(i.posted_at||'').slice(0,10)):''}</div>
        <div class="btns">
          <button onclick="window.open('${esc(i.url)}','_blank')">▶ 원본</button>
          <button class="save${isS?' saved':''}" onclick="toggleSave('${esc(sc)}','${esc(i.url)}','${esc(i.thumbnail||'')}','${esc(i.username||'')}',this,'${esc(i.platform||'instagram')}','${i.overlap!=null?'archive':'lens'}')">${isS?'🎬 담김✓':'📥 담기'}</button>
        </div>
      </div></div>`;
  }).join('')+`</div>`;
}

async function archiveSimilar(sc){
  openModal('🏠 숏템내부검색 — 우리 채널 아카이브','<div class="sm-loading">같은 소재 찾는 중…</div>');
  const body=document.getElementById('modalBody');
  let d; try{ d=await (await fetch('/api/archive/similar?shortcode='+encodeURIComponent(sc)+'&limit=60')).json(); }
  catch(e){ body.innerHTML='<div class="empty">❌ '+esc(e.message)+'</div>'; return; }
  if(d.no_tags){ body.innerHTML='<div class="empty">이 영상은 아직 비전태그가 없어요 — 태거가 채널당 10개씩 돌고 있습니다. 잠시 뒤 다시 눌러주세요.</div>'; return; }
  if(!d.ok){ body.innerHTML='<div class="empty">❌ 조회 실패</div>'; return; }
  if(!(d.items||[]).length){ body.innerHTML='<div class="empty">아카이브에서 같은 소재를 못 찾았어요 — 크롤이 더 쌓이면 늘어납니다(백그라운드 진행 중).</div>'; return; }
  const tagLine=(d.src_tags||[]).slice(0,10).join(' · ');
  body.innerHTML=`<div style="font-size:12px;color:var(--sub);margin-bottom:10px">매칭 태그: ${esc(tagLine)}</div>`
    + resultCards(d.items,{saved:SAVED});
}

// 렌즈는 이미지가 필요하다. 썸네일을 /api/thumb로 받는 이유가 여기 있다 — CDN에서 직접
// 불러오면 canvas가 오염(taint)돼 toBlob이 SecurityError로 죽는다. 프록시는 same-origin이라
// 오염되지 않는다.
// ⚠️ crossorigin="anonymous"를 붙이면 안 된다(2026-08-04 실측: 196장 전부 안 뜸).
// same-origin 요청에 그 속성을 붙이면 브라우저가 CORS 응답으로 취급하는데 /api/thumb는
// Access-Control-Allow-Origin을 안 보내므로 이미지를 통째로 버린다(fetch는 200인데
// naturalWidth=0). same-origin이라 애초에 필요도 없다.
function _archCapture(sc){
  const img=document.getElementById('th_'+sc);
  if(!img||!img.naturalWidth) return null;
  const cv=document.createElement('canvas');
  cv.width=img.naturalWidth; cv.height=img.naturalHeight;
  try{ cv.getContext('2d').drawImage(img,0,0); return cv; }catch(e){ return null; }
}
async function lensSearch(btn, sc){
  const cv=_archCapture(sc);
  if(!cv){ openModal('🔍 숏템파워검색','<div class="empty">썸네일을 준비하지 못했습니다. 이미지가 뜬 뒤 다시 눌러주세요(만료된 썸네일일 수 있어요).</div>'); return; }
  openModal('🔍 숏템파워검색 — 외부 플랫폼','<div class="sm-loading">🔍 구글렌즈 검색 중… (5~15초)</div>');
  const body=document.getElementById('modalBody');
  try{
    const blob=await new Promise(r=>cv.toBlob(r,'image/jpeg',0.85));
    const fd=new FormData(); fd.append('frame',blob,'f.jpg');
    const r=await fetch('/api/lens/search',{method:'POST',body:fd});
    if(r.status===429){ const e=await r.json(); body.innerHTML='<div class="empty" style="color:#e0623d">💰 '+esc(e.error||'렌즈 한도 초과')+'</div>'; return; }
    const d=await r.json();
    if(!d.ok){ body.innerHTML='<div class="empty" style="color:#e0623d">❌ 렌즈 검색 실패</div>'; return; }
    const items=(d.items||[]);
    if(!items.length){ body.innerHTML='<div class="empty">비슷한 영상을 못 찾았어요.</div>'; return; }
    // 렌즈 결과는 우리 DB shortcode가 없다 → URL 기반 합성키(랭킹과 같은 규칙).
    items.forEach(i=>{ i.savesc='lens_'+i.platform+'_'+_hash(i.url); });
    body.innerHTML=resultCards(items,{saved:SAVED});
  }catch(e){ body.innerHTML='<div class="empty" style="color:#e0623d">❌ '+esc(e.message)+'</div>'; }
}
function _hash(s){let h=0;s=String(s||'');for(let i=0;i<s.length;i++){h=((h<<5)-h+s.charCodeAt(i))|0}return (h>>>0).toString(36)}

document.getElementById('chSel').addEventListener('change',load);
document.getElementById('q').addEventListener('keydown',e=>{if(e.key==='Enter')load()});
renderCatBar();
