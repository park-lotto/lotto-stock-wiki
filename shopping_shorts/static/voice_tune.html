<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>보이스 튜닝 작업대</title>
<style>
 body{font-family:system-ui,sans-serif;margin:0;display:flex;height:100vh}
 #left{flex:1;overflow:auto;padding:16px;border-right:1px solid #ddd}
 #right{width:320px;padding:16px;overflow:auto;flex-shrink:0}
 .card{border:1px solid #ddd;border-radius:8px;padding:10px;margin-bottom:10px}
 .orig{color:#333;font-weight:600}
 .conv{color:#0a7;font-size:14px;margin:4px 0;white-space:pre-wrap}
 .diff .sub,.diff .del{color:#e33;font-weight:700}
 .diff .ins{color:#c80;font-weight:700}
 .row{display:flex;align-items:center;gap:8px;margin:6px 0}
 .stage{display:flex;align-items:center;gap:6px;margin:4px 0;font-size:13px}
 .stage input[type=range]{flex:1}
 button{cursor:pointer}
</style></head><body>
<div id="left">
  <div class="card" id="pron-lab" style="border-color:#0a7">
    <b>🩺 발음교정 작업대</b> (전역 — 모든 보이스·영상 적용)
    <textarea id="pl-text" rows="2" style="width:100%;margin:6px 0" placeholder="어색하게 읽히는 문장을 붙여넣으세요"></textarea>
    <div class="row">
      <button onclick="plSynth('orig')">▶ 원본 합성</button>
      <button onclick="plSuggest()">🤖 AI 교정 제안</button>
    </div>
    <div id="pl-suggest" style="font-size:13px;margin:4px 0"></div>
    <div class="row">구절 <input id="pl-phrase" style="flex:1"> → 재표기 <input id="pl-respell" style="flex:1"></div>
    <div class="row">
      <button onclick="plSynth('fixed')">▶ 교정 합성(A/B)</button>
      <button onclick="plSave()">💾 전역 사전에 저장</button>
    </div>
    <audio id="pl-au-orig" controls style="height:32px;width:100%"></audio>
    <audio id="pl-au-fixed" controls style="height:32px;width:100%"></audio>
    <div id="pl-list" style="font-size:12px;margin-top:6px"></div>
    <p id="pl-msg" style="color:#0a7;margin:4px 0"></p>
  </div>
  <div class="row"><select id="preset"></select>
    <button onclick="synthAll()">전체 재합성</button></div>
  <div id="cards"></div>
</div>
<div id="right">
  <h3>프로파일</h3><div id="stages"></div>
  <div class="row">seed <input id="seed" type="number" value="42" style="width:70px">
    N-best <input id="nbest" type="number" value="3" style="width:50px"></div>
  <button onclick="freeze()">💾 이 프로파일 동결</button>
  <p id="msg" style="color:#0a7"></p>
</div>
<script>
const STAGES=[["normalize","정규화"],["spoken_style","구어체"],["pronunciation","연음/발음"],
 ["phrasing","끊어읽기"],["endings","끝음"],["fillers","추임새"],
 ["emotion_arc","감정곡선"],["whisper","속삭임"],["intonation","억양"]];
// 5개 다 value===label이라 짝 배열일 이유가 없다(리뷰 Minor, task-5) — 평범한 배열로.
const WHISPER_ROLES=["훅","페인포인트","반전","실용","CTA"];
let corpus=[], profile={}, presetList=[];

// 엔진 DEFAULT_PROFILE['whisper'](narration_naturalize.py L10~L23)의 프론트 미러.
// 매번 새 객체/배열을 반환한다 — 여러 프로파일이 같은 참조를 공유하면 한쪽 roles를
// 바꿀 때 다른 쪽도 같이 바뀌는 사고가 난다. 값이 엔진과 갈리면 "화면=roles 없음(무시)
// vs 엔진=['반전'](속삭임 실행)" 불일치가 재발한다(리뷰 실측 STALE 버그, task-5 Important1).
// 엔진 값을 바꾸면 여기도 같이 바꿔라.
function whisperDefault(){return {on:true,roles:["반전"]};}

function defaultProfile(){
 // caps는 여기서 하드코딩하지 않는다(Task4 C1) — 서버 merge_profile이
 // DEFAULT_PROFILE(narration_naturalize.py)의 caps를 채워준다. 여기서
 // max_fillers_per_text:1을 박아두면 엔진 기본값을 올려도 작업대만
 // 영원히 캡=1로 남아 "슬라이더를 돌려도 똑같다"가 화면에서 재발한다.
 const p={};
 STAGES.forEach(([k])=>p[k]={on:true,intensity:0.3});
 p.normalize={on:true}; p.pronunciation={on:true,dict:{}};
 p.fillers={on:true,intensity:0.2,bank:["음","아","그","뭐","자"]};
 // 속삭임은 intensity가 없다(설계 §6: 태그는 켜지거나 꺼질 뿐 중간이 없다).
 // 위 forEach가 넣은 intensity를 여기서 걷어내지 않으면 renderStages의
 // ('intensity' in s) 검사에 걸려 있지도 않은 "속삭임 강도" 슬라이더가 뜬다.
 // roles = 속삭일 비트의 role 목록. 전체면 ASMR, 일부면 강조 도구(설계 §3).
 p.whisper=whisperDefault();
 return p;
}
function renderStages(){
 document.getElementById('stages').innerHTML=STAGES.map(([k,label])=>{
  const s=profile[k]||{on:true,intensity:0.3};
  let ctl='';
  if(k==='whisper'){
   // 속삭임은 슬라이더 자리에 role 체크박스 5개를 그린다(intensity 없음 — 설계 §6).
   // 전부 체크=ASMR, 일부만 체크=강조 도구(설계 §3).
   // s.roles가 없으면(예: roles 키를 안 지정한 옛 프로파일) 서버 merge_profile의 얕은
   // 병합(.update)과 같은 결과가 되도록 whisperDefault().roles로 채운다 — loadPreset의
   // 병합과 이중 방어다. 한쪽만 고치면 다른 경로로 같은 불일치가 남는다(task-5 Important1).
   const roles=(s.roles!==undefined)?s.roles:whisperDefault().roles;
   ctl=WHISPER_ROLES.map(v=>`<label style="font-size:11px;margin-right:6px">
     <input type=checkbox ${roles.includes(v)?'checked':''} onchange="setWhisperRole('${v}',this.checked)">${v}</label>`).join('');
  }else if('intensity' in s){
   ctl=`<input type=range min=0 max=1 step=0.05 value=${s.intensity}
     oninput="setInt('${k}',this.value)">`;
  }
  return `<div class="stage"><input type=checkbox ${s.on?'checked':''}
     onchange="setOn('${k}',this.checked)">${label}${ctl}</div>`;
 }).join('');
}
function setOn(k,v){profile[k]=profile[k]||{};profile[k].on=v;previewAll();}
function setInt(k,v){profile[k]=profile[k]||{};profile[k].intensity=parseFloat(v);previewAll();}
function setWhisperRole(role,checked){
 profile.whisper=profile.whisper||{on:true,roles:[]};
 const roles=new Set(profile.whisper.roles||[]);
 if(checked)roles.add(role); else roles.delete(role);
 profile.whisper.roles=Array.from(roles);
 previewAll();
}

// 비트 위치(index/total)는 감정곡선·추임새 스테이지가 쓰는 입력이다. 안 보내면 작업대는
// 항상 추임새 bank[0]("음")만 들려주는데 렌더는 비트마다 순환해 다른 소리가 난다(리뷰 S6).
function beatCtx(c){return {beat_role:c.role, beat_index:corpus.indexOf(c), beat_total:corpus.length};}
async function previewAll(){
 for(const c of corpus){
  const r=await fetch('/api/voice-tune/preview',{method:'POST',headers:{'Content-Type':'application/json'},
   body:JSON.stringify({text:c.text,profile:withMeta(),...beatCtx(c)})});
  const j=await r.json();
  const el=document.getElementById('conv-'+c.id);
  if(el)el.textContent=j.text;
 }
}
function withMeta(){profile.seed=parseInt(seed.value);profile.n_best=parseInt(nbest.value);return profile;}
function renderCards(){
 document.getElementById('cards').innerHTML=corpus.map(c=>`
  <div class="card">
   <div class="orig">${c.role} · ${c.text}</div>
   <div class="conv" id="conv-${c.id}"></div>
   <div class="row"><button onclick="synthOne('${c.id}')">▶ 합성</button>
     <button onclick="synthOne('${c.id}',true)">🎲 재롤</button>
     <audio id="au-${c.id}" controls style="height:32px"></audio></div>
   <div class="diff" id="diff-${c.id}"></div>
  </div>`).join('');
}
let rerolls={};
async function synthOne(id,reroll){
 const c=corpus.find(x=>x.id===id);
 if(reroll)rerolls[id]=(rerolls[id]||0)+1;   // nonce ↑ = 캐시 우회 = 진짜 새 take(리뷰 S9)
 // 성우·감도·속도·무음삭제는 서버가 preset_id로 조회한다(클라 전송 X) — 작업대와 렌더가
 // 같은 값을 쓰도록 단일 소스로 강제(리뷰 S3/S5).
 const i=corpus.indexOf(c);
 const r=await fetch('/api/voice-tune/synth',{method:'POST',headers:{'Content-Type':'application/json'},
  body:JSON.stringify({text:c.text,profile:withMeta(),line_id:id,preset_id:preset.value,
   ...beatCtx(c),nonce:rerolls[id]||0,
   previous_text:i>0?corpus[i-1].text:null, next_text:i<corpus.length-1?corpus[i+1].text:null})});
 const j=await r.json();
 document.getElementById('au-'+id).src=j.audio_url+'?t='+Date.now();
 document.getElementById('conv-'+id).textContent=j.text;
 const d=document.getElementById('diff-'+id);
 if(j.diff.no_asr){d.innerHTML='<span style=color:#999>ASR 미설정</span>';}
 else d.innerHTML=j.diff.ok?'<span style=color:#0a7>✓ 오독없음</span>':
   j.diff.words.map(w=>`<span class="${w.kind}">${w.ref||w.hyp}</span>`).join(' ');
}
async function synthAll(){for(const c of corpus)await synthOne(c.id);}
async function freeze(){
 const r=await fetch('/api/voice-tune/profile/'+preset.value,{method:'POST',
  headers:{'Content-Type':'application/json'},body:JSON.stringify({profile:withMeta(),frozen:true})});
 document.getElementById('msg').textContent=(await r.json()).ok?'동결 완료 ✓':'실패';
}
async function loadPreset(){
 const r=await fetch('/api/voice-tune/profile/'+preset.value);
 const j=await r.json();
 profile=(j.profile&&Object.keys(j.profile).length)?j.profile:defaultProfile();
 // 서버 merge_profile은 whisper 키가 아예 없는 옛 동결 프로파일을 DEFAULT_PROFILE['whisper']
 // (whisperDefault())로 채운 뒤 합성한다. 프론트가 이걸 안 하면 "화면=role 전부 해제(무시)
 // vs 엔진=roles:['반전'](실제 속삭임)"으로 갈리고, 그대로 💾동결하면 그 갈림이 영구화된다
 // (리뷰 실측 STALE 버그, task-5 Important1). renderStages의 표시용 폴백과 별개로 여기서도
 // profile 객체 자체를 채워야 setWhisperRole 등 이후 조작이 옳은 기준 위에서 시작한다.
 if(!profile.whisper)profile.whisper=whisperDefault();
 if(profile.seed)seed.value=profile.seed; if(profile.n_best)nbest.value=profile.n_best;
 renderStages();previewAll();
}
function plApplyFix(t){const p=pl_phrase.value.trim(),r=pl_respell.value.trim();
  return (p&&r)?t.split(p).join(r):t;}
async function plSynth(which){
  const raw=pl_text.value.trim(); if(!raw)return;
  const text=which==='fixed'?plApplyFix(raw):raw;
  const r=await fetch('/api/voice-tune/synth',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text,profile:withMeta(),preset_id:preset.value,line_id:'pl-'+which,nonce:Date.now()})});
  const j=await r.json();
  document.getElementById('pl-au-'+which).src=j.audio_url+'?t='+Date.now();
}
async function plSuggest(){
  const raw=pl_text.value.trim(); if(!raw)return;
  pl_suggest.textContent='분석 중…';
  const r=await fetch('/api/pron/suggest',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({text:raw})});
  const s=(await r.json()).suggestions||[];
  if(!s.length){pl_suggest.textContent='AI 제안 없음 — 직접 입력하세요';return;}
  pl_suggest.innerHTML=s.map(x=>`<a href="#" onclick="pl_phrase.value='${x.phrase}';pl_respell.value='${x.respelling}';return false">
    ${x.phrase} → <b>${x.respelling}</b></a> <span style="color:#999">${x.reason||''}</span>`).join('<br>');
}
async function plSave(){
  const phrase=pl_phrase.value.trim(),respelling=pl_respell.value.trim();
  const r=await fetch('/api/pron/global',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({phrase,respelling})});
  pl_msg.textContent=(r.ok)?'저장 완료 ✓ (이후 모든 영상에 적용)':'실패: '+(await r.json()).error;
  plLoadList();
}
async function plDelete(phrase){
  await fetch('/api/pron/global/'+encodeURIComponent(phrase),{method:'DELETE'});
  plLoadList();
}
async function plLoadList(){
  const e=(await (await fetch('/api/pron/global')).json()).entries||[];
  pl_list.innerHTML='<b>전역 사전('+e.length+')</b><br>'+e.map(x=>
    `${x.phrase} → ${x.respelling} <a href="#" onclick="plDelete('${x.phrase}');return false" style="color:#e33">삭제</a>`).join('<br>');
}
async function init(){
 // /api/voice-presets 실제 응답: {ok, groups:[{group_id,name,variants:{variant:{preset_id,...}}}]}
 // (계획서가 가정한 {presets:[{preset_id,name,variant}]}과 다름 — groups/variants를 평탄화한다.
 const pr=await (await fetch('/api/voice-presets?lang=KR')).json();
 presetList=[];
 for(const g of (pr.groups||[])){
  for(const [variant,v] of Object.entries(g.variants||{})){
   presetList.push({preset_id:v.preset_id, name:g.name, variant});
  }
 }
 preset.innerHTML=presetList.map(p=>`<option value="${p.preset_id}">${p.name}·${p.variant||''}</option>`).join('');
 preset.onchange=loadPreset;
 corpus=(await (await fetch('/api/voice-tune/corpus')).json()).lines;
 renderCards(); await loadPreset();
 plLoadList();
}
init();
</script></body></html>
