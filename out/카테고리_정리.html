<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>카테고리 정리 — 삭제 / 이동</title>
<style>
:root{--bg:#0c1116;--card:#141b23;--line:#243040;--txt:#e6edf3;--sub:#8b9bb0;--ok:#22c55e;--no:#ef4444;--mv:#f59e0b;--acc:#7df5db}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Malgun Gothic",system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;background:#0c1116f2;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 18px}
h1{margin:0 0 4px;font-size:17px}.sub{color:var(--sub);font-size:12.5px}
.bar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:9px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12.5px}
button,select{cursor:pointer;font-family:inherit}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 12px;font-size:13px}
.btn.on{background:#123;border-color:var(--acc);color:var(--acc);font-weight:700}
.btn.acc{background:#123;border-color:var(--acc);color:var(--acc);font-weight:700}
.note{margin:14px 18px 0;padding:10px 14px;border-radius:10px;background:#131c26;border:1px solid var(--line);font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:8px}
.card.del{opacity:.4;border-color:var(--no)}
.card.mov{border-color:var(--mv);box-shadow:0 0 0 1px var(--mv) inset}
.thumb{display:block;border-radius:9px;overflow:hidden;background:#0a0f14;aspect-ratio:16/9;flex:0 0 auto}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ttl{font-weight:700;font-size:13.5px;word-break:keep-all;line-height:1.35;height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{color:var(--sub);font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
.acts{display:flex;gap:6px;margin-top:auto;align-items:center}
.acts button{border-radius:8px;padding:8px 10px;font-size:13px;font-weight:700;border:1px solid var(--line);background:#0f1620;color:var(--sub)}
.acts .del.on{background:var(--no);border-color:var(--no);color:#2b0505}
.acts select{flex:1;background:#0f1620;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px;font-size:13px}
.acts select.on{background:var(--mv);border-color:var(--mv);color:#2b1a02;font-weight:700}
a{color:var(--acc);font-size:12px;text-decoration:none}
textarea{width:100%;height:180px;background:#080d12;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 Consolas,monospace}
dialog{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:14px;max-width:780px;width:92%}
</style></head><body>
<header>
  <h1>카테고리 정리 — 삭제 / 이동</h1>
  <div class="sub">각 카테고리에 <b>섞여 있는 것</b>을 골라내세요. <b>❌ 삭제</b>는 쇼핑 소재가 아예 아닌 것, <b>이동</b>은 다른 칸이 맞는 것. 자동 저장됩니다.</div>
  <div class="bar" id="catbar"></div>
  <div class="bar">
    <span class="pill">삭제 <b id="cD">0</b></span><span class="pill">이동 <b id="cM">0</b></span>
    <button class="btn" onclick="only()">안 찍은 것만</button>
    <button class="btn acc" onclick="save()">📋 결과 내보내기</button>
  </div>
</header>
<div class="note" id="note"></div>
<div class="grid" id="g"></div>
<dialog id="dlg"><h3 style="margin:14px 16px 6px">결과 — 복사해서 클로드에게 붙여넣어 주세요</h3>
 <div style="padding:0 16px 16px"><textarea id="out"></textarea>
 <div style="display:flex;gap:8px;margin-top:10px"><button class="btn acc" onclick="copyOut()">복사</button>
 <button class="btn" onclick="dlg.close()">닫기</button><span id="copied" class="sub"></span></div></div></dialog>

const CATS = ["제품정체형", "오용형", "장비템", "차량템", "홈템", "레시피", "뷰티", "기타"];
const KEY='catclean_v1';
let M={}; try{ M=JSON.parse(localStorage.getItem(KEY)||'{}'); }catch(e){}
let CAT=CATS[0], TODO=false; const PAGE0=30; let PAGE=PAGE0;
const g=document.getElementById('g'), dlg=document.getElementById('dlg');
const esc=s=>String(s==null?'':s).replace(/[<>&"]/g,c=>({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c]));
const age=a=> typeof a!=='number'?'':(a<1?Math.round(a*60)+'분':(a<48?Math.round(a)+'시간':Math.round(a/24)+'일'));
const kk=it=>it.sc||String(it.t).slice(0,20);
document.getElementById('catbar').innerHTML = CATS.map(c=>
  `<button class="btn" id="b_${c}" onclick="go('${c}')">${c} <b>${(DATA[c]||[]).length}</b></button>`).join('');
function go(c){ CAT=c; PAGE=PAGE0; render(); }
function only(){ TODO=!TODO; PAGE=PAGE0; render(); }
let QUEUE=[],BUSY=0;
function pump(){ while(BUSY<6&&QUEUE.length){ const im=QUEUE.shift();
  if(!im||im.dataset.done) continue; im.dataset.done='1'; BUSY++;
  const fin=()=>{BUSY--;pump();}; im.onload=fin;
  im.onerror=()=>{ if(!im.dataset.retry&&im.dataset.sc){im.dataset.retry='1';
    im.src='https://i.ytimg.com/vi/'+im.dataset.sc+'/mqdefault.jpg'; return;} fin(); };
  im.src=im.dataset.src; } }
function render(){
  CATS.forEach(c=>{ const b=document.getElementById('b_'+c); if(b) b.className='btn'+(c===CAT?' on':''); });
  const arr=DATA[CAT]||[];
  document.getElementById('note').innerHTML =
    '지금 <b>'+CAT+'</b>에 들어 있는 '+arr.length+'편(조회수 높은 순)입니다 \u2014 '
    + '<b>여기 있으면 안 되는 것</b>만 골라주세요. 맞는 건 그냥 두시면 됩니다.';
  let shown=0;
  g.innerHTML = arr.map(it=>{
    const k=kk(it), v=M[k]||null;
    if(TODO && v) return '';
    if(++shown>PAGE) return '';
    const cls = v ? (v.act==='del'?'del':'mov') : '';
    const th = it.sc? 'https://i.ytimg.com/vi/'+esc(it.sc)+'/hqdefault.jpg' : '';
    const opts = ['<option value="">➡ 이동…</option>']
      .concat(CATS.filter(c=>c!==CAT).map(c=>`<option value="${c}"${v&&v.act==='mov'&&v.to===c?' selected':''}>➡ ${c}</option>`)).join('');
    return '<div class="card '+cls+'" data-k="'+esc(k)+'">'
      + (th?'<a class="thumb" href="'+esc(it.url||'#')+'" target="_blank" rel="noopener"><img data-src="'+th+'" data-sc="'+esc(it.sc||'')+'" alt=""></a>':'')
      + '<div class="ttl" title="'+esc(it.t)+'">'+esc(String(it.t).split(/\s+#/)[0])+'</div>'
      + '<div class="meta"><span>'+esc(it.n||'')+'</span><span>'+age(it.a)+' 전</span>'
      + '<span>조회 '+((it.v||0).toLocaleString())+'</span></div>'
      + '<div class="acts">'
      + '<button class="del '+(v&&v.act==='del'?'on':'')+'" onclick="mark(\'' + esc(k).replace(/'/g,"\\'") + '\',\'del\')">❌ 삭제</button>'
      + '<select class="'+(v&&v.act==='mov'?'on':'')+'" onchange="moveTo(\'' + esc(k).replace(/'/g,"\\'") + '\',this.value)">'+opts+'</select>'
      + '</div></div>';
  }).join('');
  const rest=arr.filter(it=>!(TODO&&M[kk(it)])).length-PAGE;
  const old=document.getElementById('more'); if(old) old.remove();
  if(rest>0){ const b=document.createElement('button'); b.id='more'; b.className='btn acc';
    b.style.cssText='display:block;margin:4px auto 28px;padding:12px 28px;font-size:14px';
    b.textContent='\uFF0B '+Math.min(30,rest)+'개 더 보기 (남은 '+rest+')';
    b.onclick=function(){PAGE+=30;render();}; g.parentNode.insertBefore(b,g.nextSibling); }
  count();
  document.querySelectorAll('.thumb img[data-src]:not([data-done])').forEach(i=>QUEUE.push(i)); pump();
}
function count(){ const v=Object.values(M);
  document.getElementById('cD').textContent=v.filter(x=>x.act==='del').length;
  document.getElementById('cM').textContent=v.filter(x=>x.act==='mov').length; }
function _save(){ try{ localStorage.setItem(KEY,JSON.stringify(M)); }catch(e){} }
function mark(k,act){
  if(M[k] && M[k].act===act) delete M[k]; else M[k]={act:act, from:CAT};
  _save(); render();
}
function moveTo(k,to){
  if(!to) delete M[k]; else M[k]={act:'mov', to:to, from:CAT};
  _save(); render();
}
function save(){
  const rows=[];
  for(const c of CATS) for(const it of (DATA[c]||[])){
    const v=M[kk(it)]; if(v) rows.push({sc:it.sc, t:it.t, n:it.n, from:c, act:v.act, to:v.to||''});
  }
  document.getElementById('out').value=JSON.stringify(rows); dlg.showModal();
}
function copyOut(){ const t=document.getElementById('out'); t.select();
  try{ document.execCommand('copy'); document.getElementById('copied').textContent='복사됨'; }catch(e){} }
(function(){ let ok=false; try{ localStorage.setItem('__t','1'); localStorage.removeItem('__t'); ok=true;}catch(e){}
  if(!ok){ const d=document.createElement('div');
    d.style.cssText='background:#7f1d1d;color:#fecaca;padding:9px 18px;font-size:13px;font-weight:700';

    document.body.insertBefore(d, document.body.firstChild); } })();
