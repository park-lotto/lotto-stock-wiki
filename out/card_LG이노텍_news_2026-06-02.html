<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700;900&family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{
  width:760px;height:400px;overflow:hidden;
  background:#faf8f3;color:#1a1a1a;
  font-family:'Noto Sans KR',sans-serif;
}
.card{width:760px;height:400px;display:flex;flex-direction:column;border:2px solid #1a1a1a}

/* 신문 헤더 */
.masthead{
  border-bottom:4px double #1a1a1a;
  padding:10px 20px 8px;
  display:flex;align-items:baseline;gap:16px;
}
.pub-name{
  font-family:'Noto Serif KR',serif;
  font-size:11px;font-weight:700;letter-spacing:3px;color:#888;
}
.headline{
  font-family:'Noto Serif KR',serif;
  font-size:18px;font-weight:900;color:#1a1a1a;letter-spacing:-.3px;flex:1;
}
.issue-date{font-size:10px;color:#888;white-space:nowrap}

/* 서브헤드 */
.subhead{
  background:#1a1a1a;color:#faf8f3;
  padding:5px 20px;
  font-size:11px;letter-spacing:1px;
  display:flex;justify-content:space-between;
}

/* 본문 */
.body{padding:14px 20px 10px;flex:1}
.row{display:flex;gap:12px;align-items:stretch;margin-bottom:10px}
.row:last-child{margin-bottom:0}
.rank{
  font-family:'Noto Serif KR',serif;
  font-size:10px;font-weight:900;width:38px;flex-shrink:0;
  padding-top:2px;letter-spacing:.5px;
}
.info{flex:1}
.broker-line{display:flex;align-items:baseline;gap:8px;margin-bottom:5px}
.bname{font-size:12px;font-weight:700;color:#1a1a1a}
.from{font-size:10px;color:#aaa}
.tpval{font-size:22px;font-weight:900;font-family:'Noto Serif KR',serif;letter-spacing:-.5px}
.pct{font-size:12px;font-weight:700}
.up{color:#c0392b} .dn{color:#2471a3}
.bar-track{height:6px;background:#eee;border-radius:0}
.bar-fill{height:6px;transition:width .3s}

/* 하단 */
.footer{
  border-top:2px solid #1a1a1a;
  padding:8px 20px;
  display:flex;align-items:center;gap:24px;
  background:#fff;
}
.foot-item{display:flex;flex-direction:column;gap:1px}
.foot-label{font-size:9px;color:#888;letter-spacing:.5px}
.foot-val{font-size:14px;font-weight:700;font-family:'Noto Serif KR',serif}
.foot-div{width:1px;height:24px;background:#ddd}
.brand-tag{margin-left:auto;font-size:9px;color:#bbb;letter-spacing:1px}
</style>
</head>
<body>
<div class="card">
  <div class="masthead">
    <span class="pub-name">STOCK BRAIN</span>
    <span class="headline">LG이노텍, 증권사 목표주가 분석</span>
    <span class="issue-date">2026년 06월 02일</span>
  </div>
  <div class="subhead">
    <span>■ 최근 45일 기준  14개 증권사 분석</span>
    <span>신고가: 1,850,000원 (DB증권)</span>
  </div>
  <div class="body">
    
        <div class="row">
          <div class="rank" style="color:#c0392b">NO.1</div>
          <div class="info">
            <div class="broker-line">
              <span class="bname">DB증권</span>
              <span class="from">65만→</span>
              <span class="tpval" style="color:#c0392b">185만원</span>
              <span class="pct up">▲+185%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:100%;background:#c0392b22;border-right:3px solid #c0392b"></div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="rank" style="color:#2471a3">NO.2</div>
          <div class="info">
            <div class="broker-line">
              <span class="bname">—</span>
              <span class="from">146만→</span>
              <span class="tpval" style="color:#2471a3">174만원</span>
              <span class="pct up">▲+19%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:94%;background:#2471a322;border-right:3px solid #2471a3"></div>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="rank" style="color:#1a7a4a">NO.3</div>
          <div class="info">
            <div class="broker-line">
              <span class="bname">KB증권</span>
              <span class="from">120만→</span>
              <span class="tpval" style="color:#1a7a4a">160만원</span>
              <span class="pct up">▲+33%</span>
            </div>
            <div class="bar-track">
              <div class="bar-fill" style="width:86%;background:#1a7a4a22;border-right:3px solid #1a7a4a"></div>
            </div>
          </div>
        </div>
  </div>
  <div class="footer">
    <div class="foot-item">
      <span class="foot-label">전문가 평균 목표주가</span>
      <span class="foot-val">1,175,021원</span>
    </div>
    <div class="foot-div"></div>
    <div class="foot-item">
      <span class="foot-label">신고가</span>
      <span class="foot-val" style="color:#c0392b">1,850,000원</span>
    </div>
    <div class="foot-div"></div>
    <div class="foot-item">
      <span class="foot-label">분석 증권사</span>
      <span class="foot-val">14개사</span>
    </div>
    <span class="brand-tag">STOCK BRAIN INTELLIGENCE</span>
  </div>
</div>
</body></html>
