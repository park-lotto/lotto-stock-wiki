<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>롱폼 → 쇼츠 · 숏템메이커</title>
<style>
:root{ --bg:#0B0E14; --card:#141A24; --line:#232C3B; --txt:#E8EDF5; --sub:#AAB6C6;
       --accent:#F5C451; --mint:#3EE0BF; --red:#E23B3B; }
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
     font-family:'Pretendard',system-ui,-apple-system,'Malgun Gothic',sans-serif;font-size:16px}
.wrap{max-width:1120px;margin:0 auto;padding:24px 18px 80px}
h1{font-size:26px;margin:0 0 6px}
.lead{color:var(--sub);font-size:15px;margin:0 0 22px;line-height:1.6}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:20px}
label{display:block;font-weight:700;margin:0 0 8px;font-size:15px}
input[type=text],input[type=number],select{width:100%;padding:12px 14px;border-radius:10px;
  border:1px solid var(--line);background:#0F141C;color:var(--txt);font-size:15px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>div{flex:1;min-width:220px}
.btn{display:inline-flex;align-items:center;gap:8px;padding:13px 22px;border-radius:10px;border:0;
  background:var(--accent);color:#0B0E14;font-weight:800;font-size:16px;cursor:pointer}
.btn:disabled{opacity:.5;cursor:default}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--txt);font-weight:700}
.hint{color:var(--sub);font-size:13.5px;margin-top:8px;line-height:1.6}
.status{margin-top:14px;padding:14px 16px;border-radius:10px;background:#0F141C;
  border:1px solid var(--line);font-size:15px}
.status b{color:var(--accent)}
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
  display:flex;flex-direction:column}
.card img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#000;display:block}
.card .body{padding:16px;display:flex;flex-direction:column;gap:10px;flex:1}
.time{color:var(--sub);font-size:13.5px}
.hook{font-size:20px;font-weight:800;line-height:1.35}
.hook .l2{color:var(--accent)}
.why{color:var(--sub);font-size:14px;line-height:1.6}
.screen{color:var(--mint);font-size:13.5px;line-height:1.6}
.tags{display:flex;gap:6px;flex-wrap:wrap;font-size:12.5px}
.tag{background:#0F141C;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--sub)}
.card .foot{margin-top:auto;display:flex;gap:8px;flex-wrap:wrap}
video{width:100%;border-radius:10px;background:#000;margin-top:10px}
.err{color:#ff8a8a}
</style>
</head>
<body>
<div class="wrap">
  <h1>롱폼 → 쇼츠</h1>
  <p class="lead">긴 영상 하나를 올리면 <b>쇼츠로 터질 구간</b>을 골라 드립니다.
     훅 문구·자막·콜드오픈까지 붙여서 바로 올릴 수 있는 세로 영상으로 만듭니다.</p>

  <div class="panel">
    <div class="row">
      <div>
        <label>영상 파일</label>
        <input type="file" id="file" accept="video/*">
        <div class="hint">또는 아래에 링크를 넣으세요(유튜브·인스타 등)</div>
      </div>
      <div>
        <label>영상 링크</label>
        <input type="text" id="url" placeholder="https://...">
      </div>
      <div style="max-width:160px">
        <label>몇 편</label>
        <input type="number" id="n" value="5" min="1" max="10">
      </div>
    </div>
    <div style="margin-top:16px">
      <button class="btn" id="go">🎬 쇼츠감 찾기</button>
      <span class="hint" style="margin-left:10px">12분 영상 기준 3~6분쯤 걸립니다</span>
    </div>
    <div class="status" id="status" style="display:none"></div>
  </div>

  <div class="panel" id="tplPanel" style="display:none">
    <label>디자인 템플릿</label>
    <div class="row">
      <div><select id="tpl"></select></div>
      <div><input type="text" id="ch" placeholder="채널명 (화면 하단에 들어갑니다)" value="로또의 스탁브레인"></div>
    </div>
  </div>

  <div class="cards" id="cards"></div>
</div>

<script>
let JOB = null, TIMER = null;
const $ = (id) => document.getElementById(id);

function setStatus(html, show = true) {
  const el = $('status');
  el.style.display = show ? 'block' : 'none';
  el.innerHTML = html;
}

$('go').onclick = async () => {
  const f = $('file').files[0], u = $('url').value.trim();
  if (!f && !u) { alert('영상 파일이나 링크를 넣어주세요'); return; }
  const fd = new FormData();
  if (f) fd.append('file', f);
  fd.append('url', u);
  fd.append('n_shorts', $('n').value || 5);
  $('go').disabled = true;
  setStatus('올리는 중…');
  try {
    const r = await fetch('/api/longform/analyze', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || '실패');
    JOB = d.job_id;
    poll();
  } catch (e) {
    setStatus('<span class="err">' + e.message + '</span>');
    $('go').disabled = false;
  }
};

// 진행 상황은 서버가 단계 문자열로 준다 — 화면이 스스로 추측하지 않는다
// (전사 몇 분이 걸리는데 아무 표시가 없으면 멈춘 걸로 오해한다).
function poll() {
  clearTimeout(TIMER);
  TIMER = setTimeout(async () => {
    const r = await fetch('/api/longform/status?job_id=' + JOB);
    const d = await r.json();
    if (d.status === 'ready') {
      setStatus('✅ <b>' + (d.shorts || []).length + '편</b> 찾았어요 — 만들 구간을 고르세요');
      $('go').disabled = false;
      await loadTemplates();
      render(d.shorts || []);
      return;
    }
    if (d.status === 'failed') {
      setStatus('<span class="err">' + (d.message || '실패') + '</span>');
      $('go').disabled = false;
      return;
    }
    setStatus('⏳ ' + (d.message || d.status || '진행 중…'));
    poll();
  }, 3000);
}

async function loadTemplates() {
  if ($('tpl').options.length) return;
  const d = await (await fetch('/api/longform/templates')).json();
  $('tpl').innerHTML = (d.templates || [])
    .map(t => `<option value="${t.id}"${t.id === d.default ? ' selected' : ''}>${t.label}</option>`).join('');
  $('tplPanel').style.display = 'block';
}

const mmss = (s) => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

function render(shorts) {
  $('cards').innerHTML = shorts.map((s, i) => {
    const h = s.headline || ['', ''];
    const co = s.cold_open || {};
    return `<div class="card">
      <img src="/api/longform/thumb?job_id=${JOB}&idx=${i}" alt="" onerror="this.style.visibility='hidden'">
      <div class="body">
        <div class="time">${mmss(s.start)} ~ ${mmss(s.end)} · ${Math.round(s.end - s.start)}초</div>
        <div class="hook">${esc(h[0] || '')}<br><span class="l2">${esc(h[1] || '')}</span></div>
        <div class="why">${esc(s.why || '')}</div>
        ${s.screen ? `<div class="screen">🖥 ${esc(s.screen)}</div>` : ''}
        <div class="tags">
          <span class="tag">콜드오픈 ${mmss(co.start || 0)}~${mmss(co.end || 0)}</span>
          <span class="tag">자막 ${(s.captions || []).length}개</span>
          ${s.cold_open_fixed ? '<span class="tag">콜드오픈 자동교정</span>' : ''}
        </div>
        <div class="foot">
          <button class="btn" onclick="mk(${i}, this)">▶ 이 구간 만들기</button>
        </div>
        <div id="out${i}"></div>
      </div>
    </div>`;
  }).join('');
}

function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

async function mk(idx, btn) {
  btn.disabled = true;
  const old = btn.textContent;
  btn.textContent = '만드는 중…';
  const fd = new FormData();
  fd.append('job_id', JOB); fd.append('idx', idx);
  fd.append('template', $('tpl').value); fd.append('channel_name', $('ch').value);
  try {
    const r = await fetch('/api/longform/render', { method: 'POST', body: fd });
    const d = await r.json();
    if (!r.ok || d.error) throw new Error(d.error || '실패');
    $('out' + idx).innerHTML =
      `<video controls src="${d.download}"></video>
       <div class="hint">${d.seconds}초 (콜드오픈 ${d.cold_open_seconds}초 포함)</div>
       <div class="foot" style="margin-top:8px">
         <a class="btn ghost" href="${d.download}" download>⬇ 내려받기</a>
       </div>`;
  } catch (e) {
    $('out' + idx).innerHTML = '<div class="hint err">' + esc(e.message) + '</div>';
  }
  btn.disabled = false;
  btn.textContent = old;
}
</script>
</body>
</html>
