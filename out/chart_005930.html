// ── 차트 초기화 ─────────────────────────
const container = document.getElementById('chart');
const chart = LightweightCharts.createChart(container, {
  width:  container.offsetWidth,
  height: container.offsetHeight,
  layout: { background: { color: '#0d1117' }, textColor: '#8b949e' },
  grid: {
    vertLines: { color: '#21262d' },
    horzLines: { color: '#21262d' },
  },
  crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
  rightPriceScale: { borderColor: '#30363d' },
  timeScale: { borderColor: '#30363d', timeVisible: true },
});

// 캔들 시리즈
const candleSeries = chart.addCandlestickSeries({
  upColor:          '#26a69a',
  downColor:        '#ef5350',
  borderUpColor:    '#26a69a',
  borderDownColor:  '#ef5350',
  wickUpColor:      '#26a69a',
  wickDownColor:    '#ef5350',
});
candleSeries.setData(CANDLES);

// 거래량 (보조 패널)
const volSeries = chart.addHistogramSeries({
  priceFormat: { type: 'volume' },
  priceScaleId: 'vol',
  scaleMargins: { top: 0.8, bottom: 0 },
});
volSeries.setData(VOLUMES);

// MA5
const ma5Series = chart.addLineSeries({
  color: '#f0c040', lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false,
});
ma5Series.setData(MA5);

// MA20
const ma20Series = chart.addLineSeries({
  color: '#e040fb', lineWidth: 1.5, priceLineVisible: false, lastValueVisible: false,
});
ma20Series.setData(MA20);

// 기본 범위: 최근 3개월
function setRange(days) {
  document.querySelectorAll('.pbtn').forEach(b => b.classList.remove('active'));
  event.target.classList.add('active');
  if (days === 0) {
    chart.timeScale().fitContent();
    return;
  }
  const last = CANDLES[CANDLES.length - 1].time;
  const from = new Date(last);
  from.setDate(from.getDate() - days);
  chart.timeScale().setVisibleRange({
    from: from.toISOString().slice(0,10),
    to:   last
  });
}
setRange(90);

// 크기 자동 맞춤
new ResizeObserver(() => {
  chart.applyOptions({ width: container.offsetWidth, height: container.offsetHeight });
}).observe(container);

// ── 십자선 툴팁 ─────────────────────────
const tooltip = document.getElementById('tooltip');
chart.subscribeCrosshairMove(param => {
  if (!param.time || !param.seriesData.has(candleSeries)) {
    tooltip.style.display = 'none';
    return;
  }
  const c = param.seriesData.get(candleSeries);
  const v = param.seriesData.get(volSeries);
  const isUp = c.close >= c.open;
  const cls  = isUp ? 'up' : 'down';
  const diff = c.close - c.open;
  const pct  = ((diff / c.open) * 100).toFixed(2);
  const fmt  = n => n.toLocaleString();
  const fmtV = n => (n / 1e6).toFixed(1) + 'M';

  tooltip.innerHTML = `
    <div class="tt-date">${param.time}</div>
    <div class="tt-row"><span class="tt-label">시가</span><span class="tt-val">${fmt(c.open)}</span></div>
    <div class="tt-row"><span class="tt-label">고가</span><span class="tt-val up">${fmt(c.high)}</span></div>
    <div class="tt-row"><span class="tt-label">저가</span><span class="tt-val down">${fmt(c.low)}</span></div>
    <div class="tt-row"><span class="tt-label">종가</span><span class="tt-val ${cls}">${fmt(c.close)}</span></div>
    <div class="tt-row"><span class="tt-label">등락</span><span class="tt-val ${cls}">${diff >= 0 ? '+' : ''}${fmt(diff)} (${pct}%)</span></div>
    ${v ? `<div class="tt-row"><span class="tt-label">거래량</span><span class="tt-val">${fmtV(v.value)}</span></div>` : ''}
  `;
  tooltip.style.display = 'block';
});
