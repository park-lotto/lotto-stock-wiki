<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소통 큐 — 쇼핑쇼츠</title>
<style>
  :root{--bg:#0a0e14;--panel:#111722;--line:#1e2735;--txt:#e6edf3;--sub:#8b98a9;--accent:#2f81f7;--ok:#2ea043;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic',system-ui,sans-serif;display:flex;min-height:100vh}
  .sidebar{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:16px;flex-shrink:0}
  .sidebar h1{font-size:14px;color:var(--sub);margin-bottom:16px}
  .menu-item{padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:2px;cursor:pointer}
  .menu-item.active{background:linear-gradient(90deg,#153a6b,#0d2340);color:#7db4ff}
  .main{flex:1;padding:28px 36px;overflow:auto}
  .head h2{font-size:24px;margin-bottom:6px}
  .desc{color:var(--sub);font-size:13px;margin-bottom:18px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  select,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .card.done{opacity:.45}
  .card img{width:100%;height:150px;object-fit:cover;background:#000}
  .card .body{padding:12px}
  .meta{font-size:12px;color:var(--sub)}
  .ch{font-weight:600;font-size:14px;margin:4px 0}
  .cap{font-size:12px;color:var(--sub);margin:6px 0;max-height:34px;overflow:hidden}
  .draft{background:#0d131c;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .draft button{padding:4px 10px;font-size:11px;flex-shrink:0}
  .row{display:flex;gap:8px;margin-top:10px}
  .row button{flex:1}
  .empty{color:var(--sub);text-align:center;padding:60px;grid-column:1/-1}
  .progress-wrap{max-width:560px;margin:0 auto}
  .progress-wrap .card img{height:220px}
  .counter{text-align:center;color:var(--sub);font-size:13px;margin-top:12px}
</style>
</head>
<body>
  <aside class="sidebar">
    <h1>🛍️ 쇼핑쇼츠</h1>
    <div class="menu-item" onclick="location.href='/'">📊 레퍼런스 랭킹</div>
    <div class="menu-item active">💬 소통 큐</div>
  </aside>
  <main class="main">
    <div class="head"><h2>💬 소통 큐</h2></div>
    <div class="desc">레퍼런스 릴스에 직접 댓글을 달아 계정을 키웁니다. 문구는 참고용 — 붙여넣기·전송은 직접.</div>
    <div class="toolbar">
      <select id="sort" onchange="reload()">
        <option value="latest">🆕 최신 업로드순</option>
        <option value="hot">🔥 갓 올라온 터진 영상</option>
        <option value="goldilocks">🎯 골디락스 (선점 효율)</option>
      </select>
      <label class="toggle"><input type="checkbox" id="hideDone" checked onchange="reload()"> 완료 감추기</label>
      <button class="primary" id="modeBtn" onclick="toggleMode()">▶ 진행 시작</button>
      <span id="status" style="color:var(--sub);font-size:12px"></span>
    </div>
    <div id="view"><div class="cards"><div class="empty">불러오는 중…</div></div></div>
  </main>
<script>
let STATE = {items:[], mode:"list", idx:0};

function copyText(t, btn){
  navigator.clipboard.writeText(t).then(()=>{ if(btn){const o=btn.textContent;btn.textContent="복사됨✓";setTimeout(()=>btn.textContent=o,1200);} });
}
function openAndCopy(item){
  if(item.drafts && item.drafts[0]) navigator.clipboard.writeText(item.drafts[0]);
  window.open(item.url, "_blank");
}
async function markDone(sc){
  await fetch(`/api/comment/done?shortcode=${encodeURIComponent(sc)}`, {method:"POST"});
}

function cardHtml(i, idx){
  const drafts = (i.drafts||[]).map(d=>
    `<div class="draft"><span>${d}</span><button onclick="copyText(${JSON.stringify(d).replace(/"/g,'&quot;')}, this)">복사</button></div>`).join("")
    || `<div class="draft" style="color:#c98">문구 생성 실패 — 직접 작성</div>`;
  return `<div class="card ${i.done?'done':''}" id="c_${i.shortcode}">
    <img src="${i.thumbnail||''}" onerror="this.style.display='none'">
    <div class="body">
      <div class="meta">#${idx+1} · ${i.category} · ${Math.round(i.age_hours)}시간 전 · 댓글 ${(i.comments||0).toLocaleString()}</div>
      <div class="ch">${i.name||i.username||''} ${i.done?'✅':''}</div>
      <div class="cap">${(i.caption||'').slice(0,60)}</div>
      ${drafts}
      <div class="row">
        <button class="primary" onclick='openAndCopy(${JSON.stringify(i)})'>🔗 게시물 열기+복사</button>
        <button onclick="doneCard('${i.shortcode}')">✓ 완료</button>
      </div>
    </div></div>`;
}

function renderList(){
  const v=document.getElementById("view");
  if(!STATE.items.length){ v.innerHTML='<div class="cards"><div class="empty">큐가 비었어요. 먼저 레퍼런스 랭킹에서 수집하세요.</div></div>'; return; }
  v.innerHTML = `<div class="cards">${STATE.items.map((i,x)=>cardHtml(i,x)).join("")}</div>`;
}
async function doneCard(sc){
  await markDone(sc);
  const el=document.getElementById("c_"+sc);
  if(document.getElementById("hideDone").checked){ if(el) el.remove(); }
  else if(el){ el.classList.add("done"); }
}

function renderProgress(){
  const v=document.getElementById("view");
  const list=STATE.items.filter(i=>!i.done);
  if(!list.length){ v.innerHTML='<div class="empty">오늘 소통 완료 🎉</div>'; return; }
  if(STATE.idx>=list.length) STATE.idx=list.length-1;
  const i=list[STATE.idx];
  v.innerHTML=`<div class="progress-wrap">${cardHtml(i, STATE.idx).replace("doneCard('", "doneCardProgress('")}
    <div class="counter">${STATE.idx+1} / ${list.length}</div></div>`;
}
async function doneCardProgress(sc){
  await markDone(sc);
  const it=STATE.items.find(x=>x.shortcode===sc); if(it) it.done=true;
  renderProgress();
}
function toggleMode(){
  STATE.mode = STATE.mode==="list" ? "progress" : "list";
  STATE.idx=0;
  document.getElementById("modeBtn").textContent = STATE.mode==="list" ? "▶ 진행 시작" : "☰ 리스트로";
  render();
}
function render(){ STATE.mode==="list" ? renderList() : renderProgress(); }

async function reload(){
  const sort=document.getElementById("sort").value;
  const hide=document.getElementById("hideDone").checked;
  document.getElementById("status").textContent="불러오는 중…";
  const d=await (await fetch(`/api/outreach?sort=${sort}&hide_done=${hide}`)).json();
  STATE.items=d.items||[]; STATE.idx=0;
  document.getElementById("status").textContent=`${d.count}건`;
  render();
}
reload();
</script>
</body>
</html>
