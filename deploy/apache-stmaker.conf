# /etc/apache2/sites-available/stmaker.conf → a2ensite stmaker
#
# 숏템메이커 **정식 도메인** stmaker.kr (2026-10-22 방향 변경: 카페24 해제 → 루트 직결).
#   stmaker.kr                   → 앱(127.0.0.1:8849)
#   www. · app.stmaker.kr        → https://stmaker.kr 로 301
#     (구글 로그인 g_state 쿠키가 도메인별이라 한 주소로 모은다 — app._google_redirect_uri)
# 기존 shoppingshorts.duckdns.org 는 그대로 살려둔다 — 고객 북마크·설치된 확장프로그램·
# 유저스크립트가 그 주소를 물고 있어서, 끊으면 담기가 통째로 죽는다.
#
# 443 블록은 shopping-shorts-le-ssl.conf(duckdns)를 그대로 옮긴 것이다 — X-Sendfile·미리보기 분기가
# 빠지면 파일 전송·?pv=1 이 조용히 죽는다. ★duckdns 쪽을 고치면 여기도 같이 고쳐라.
# (certbot --apache 로 자동 생성하면 80 블록을 복제해 이 둘이 빠진다 → 그래서 손으로 쓴다)
#
# 설치 순서 (서버에서):
#   1) DNS: 닷네임(NS=cloudflare) A  @ · www · app → 서버 IP   (사장님 완료 2026-10-22)
#   2) 이 파일을 sites-available/stmaker.conf 로 복사하되, 인증서가 아직 없으면 443 블록을 빼고 올린다
#      sudo a2ensite stmaker && sudo systemctl reload apache2
#   3) sudo certbot certonly --webroot -w /var/www/html -d stmaker.kr -d www.stmaker.kr -d app.stmaker.kr
#      ※ 000-default 가 80→443 으로 전부 돌려서, 아래 80 블록의 acme 예외가 없으면 검증이 실패한다
#   4) 전체 파일로 교체 → apache2ctl configtest → reload
#   5) /etc/shopping-shorts.env: PUBLIC_BASE_URL=https://stmaker.kr
#      (구글 콜백은 접속 도메인 따라 앱이 고른다 — config.GOOGLE_REDIRECT_URIS)

<VirtualHost *:80>
    ServerName stmaker.kr
    ServerAlias www.stmaker.kr app.stmaker.kr

    # Let's Encrypt 갱신(webroot) — 이것만 http로 둔다
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory /var/www/html/.well-known/acme-challenge/>
        Require all granted
    </Directory>

    RewriteEngine on
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteCond %{HTTP_HOST} ^(www|app)\. [NC]
    RewriteRule ^ https://stmaker.kr%{REQUEST_URI} [END,NE,R=permanent]
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://%{HTTP_HOST}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>

<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName stmaker.kr
    ServerAlias www.stmaker.kr app.stmaker.kr
    ProxyPreserveHost On

    RewriteEngine on
    RewriteCond %{HTTP_HOST} ^(www|app)\. [NC]
    RewriteRule ^ https://stmaker.kr%{REQUEST_URI} [END,NE,R=permanent]

    # ── 미리보기 분기(duckdns와 동일) — 쿠키가 있는 브라우저만 8850으로 ──
    RewriteCond %{QUERY_STRING} (^|&)pv=1(&|$)
    RewriteRule ^(.*)$ $1? [CO=ssprev:1:stmaker.kr:480:/,R=302,L]
    RewriteCond %{QUERY_STRING} (^|&)pv=0(&|$)
    RewriteRule ^(.*)$ $1? [CO=ssprev:0:stmaker.kr:-1:/,R=302,L]
    RewriteCond %{HTTP_COOKIE} (^|;\s*)ssprev=1
    RewriteRule ^/?(.*)$ http://127.0.0.1:8850/$1 [P,L]
    ProxyPassReverse / http://127.0.0.1:8850/

    # X-Sendfile(관제 062): 파이썬이 X-Sendfile 헤더로 경로만 주면 아파치가 파일을 보낸다(Range·HEAD 포함)
    XSendFile On
    XSendFilePath /home/ubuntu/lotto-stock-wiki/shopping_shorts/data
    XSendFilePath /home/ubuntu/lotto-stock-wiki/shopping_shorts/static
    ProxyPass / http://127.0.0.1:8849/
    ProxyPassReverse / http://127.0.0.1:8849/
    # apify_client.fetch_reels 최악 3600초(계정 4개×900) — 그 이상으로 여유
    ProxyTimeout 3700

    SSLCertificateFile /etc/letsencrypt/live/stmaker.kr/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/stmaker.kr/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
