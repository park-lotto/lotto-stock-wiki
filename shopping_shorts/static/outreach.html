<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소통 큐 — 쇼핑쇼츠</title>
<style>
  :root{--bg:#0a0e14;--panel:#111722;--line:#1e2735;--txt:#e6edf3;--sub:#8b98a9;--accent:#2f81f7;--ok:#2ea043;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic',system-ui,sans-serif;display:flex;min-height:100vh}
  .sidebar{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:16px;flex-shrink:0}
  .sidebar h1{font-size:14px;color:var(--sub);margin-bottom:16px}
  .menu-item{padding:8px 12px;border-radius:8px;font-size:13px;margin-bottom:2px;cursor:pointer}
  .menu-item.active{background:linear-gradient(90deg,#153a6b,#0d2340);color:#7db4ff}
  .main{flex:1;padding:28px 36px;overflow:auto}
  .head h2{font-size:24px;margin-bottom:6px}
  .desc{color:var(--sub);font-size:13px;margin-bottom:18px}
  .toolbar{display:flex;gap:10px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  select,button{background:var(--panel);color:var(--txt);border:1px solid var(--line);padding:9px 14px;border-radius:8px;font-size:13px;cursor:pointer}
  button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
  .toggle{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--sub)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .card.done{opacity:.45}
  /* box-shadow는 .card의 overflow:hidden 때문에 크롬에서 시각적으로 클리핑돼 거의 안 보임 —
     outline(+offset)은 클리핑 안 되므로 이걸 주 강조 수단으로 쓴다. 눈에 띄게 두껍게+펄스. */
  .card.focus-highlight{outline:5px solid var(--accent);outline-offset:3px;
    animation:focusPulse 1s ease-in-out 3}
  @keyframes focusPulse{0%,100%{outline-color:var(--accent)}50%{outline-color:#8ec2ff}}
  .card img{width:100%;height:150px;object-fit:cover;background:#000}
  .card .body{padding:12px;flex:1;display:flex;flex-direction:column}
  .meta{font-size:12px;color:var(--sub)}
  .ch{font-weight:600;font-size:14px;margin:4px 0}
  .cap{font-size:12px;color:var(--sub);margin:6px 0;max-height:34px;overflow:hidden}
  .draft{background:#0d131c;border:1px solid var(--line);border-radius:8px;padding:8px;margin:6px 0;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center}
  .draft button{padding:4px 10px;font-size:11px;flex-shrink:0}
  .row{display:flex;gap:8px;margin-top:auto;padding-top:10px}
  .row button{flex:1}
  .empty{color:var(--sub);text-align:center;padding:60px;grid-column:1/-1}
  .progress-wrap{max-width:560px;margin:0 auto}
  .progress-wrap .card img{height:220px}
  .counter{text-align:center;color:var(--sub);font-size:13px;margin-top:12px}
  @media (max-width: 768px){
    body{flex-direction:column;min-height:100vh}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px;
             display:flex;gap:6px;overflow-x:auto;align-items:center;white-space:nowrap}
    .sidebar h1{margin:0 8px 0 0;flex-shrink:0}
    .sidebar .menu-group{margin:0;display:flex;gap:6px;align-items:center}
    .sidebar .menu-group .label{display:none}
    .menu-item{margin:0;padding:6px 10px;flex-shrink:0;font-size:12px}
    .main{padding:16px 14px}
    .cards{grid-template-columns:repeat(2,1fr);gap:10px}
    .head h2{font-size:20px}
    .toolbar{gap:8px}
    .tabs{overflow-x:auto}
    .cats{overflow-x:auto;flex-wrap:nowrap}
    .progress-wrap{max-width:100%}
  }
  @media (max-width: 420px){
    .cards{grid-template-columns:repeat(2,1fr);gap:8px}
    .card .body{padding:8px}
    .stat{font-size:11px}
    .btns button{font-size:10px;padding:6px 2px}
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <h1>🛍️ 쇼핑쇼츠</h1>
    <div class="menu-item" onclick="location.href='/'">📊 레퍼런스 랭킹</div>
    <div class="menu-item" onclick="location.href='/find'">🔍 제품 찾기</div>
    <div class="menu-item active">💬 소통 큐</div>
  </aside>
  <main class="main">
    <div class="head"><h2>💬 소통 큐</h2></div>
    <div class="desc">레퍼런스 릴스에 직접 댓글을 달아 계정을 키웁니다. 문구는 참고용 — 붙여넣기·전송은 직접.</div>
    <div class="toolbar">
      <select id="sort" onchange="reload()">
        <option value="latest">🆕 최신 업로드순</option>
        <option value="hot">🔥 갓 올라온 터진 영상</option>
        <option value="goldilocks">🎯 골디락스 (선점 효율)</option>
      </select>
      <label class="toggle"><input type="checkbox" id="hideDone" checked onchange="reload()"> 완료 감추기</label>
      <button class="primary" id="modeBtn" onclick="toggleMode()">▶ 진행 시작</button>
      <button id="moreDraftsBtn" onclick="generateMoreDrafts()">💬 댓글 더 생성 (+40)</button>
      <a href="/insta_fill_comment.user.js" id="installBtn" title="Tampermonkey 설치 후 클릭하면 자동채우기 설치"
         style="text-decoration:none;background:var(--panel);color:var(--txt);border:1px solid var(--line);padding:9px 14px;border-radius:8px;font-size:13px">🧩 자동채우기 설치</a>
      <span id="status" style="color:var(--sub);font-size:12px"></span>
    </div>
    <div id="view"><div class="cards"><div class="empty">불러오는 중…</div></div></div>
  </main>
<script>
let STATE = {items:[], mode:"list", idx:0};
let SELECTED = {};  // shortcode -> 마지막 선택한 문구
const FOCUS_SC = new URLSearchParams(location.search).get("focus");  // 랭킹 페이지 "댓글참여" 버튼에서 넘어온 대상

function escapeHtml(s){
  // 캡션/댓글문구/채널명은 인스타 원본 텍스트라 <, &, " 등이 그대로 들어있을 수
  // 있다 — 마크업으로 해석돼 레이아웃이 깨지는 걸 방지(2026-07-09, onclick
  // 속성 파손 버그 고치면서 같이 점검).
  return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function generateMoreDrafts(){
  // 고정 배치번호 없음 — 매번 "draft 없고 완료 안 된 상위 40개"를 새로 계산해서
  // 생성하므로, 완료 처리로 큐가 줄거나 이전 시도가 실패했어도 항상 다음
  // 상위권을 채운다(2026-07-09). 큐 노출 범위(RANK_LIMIT)도 함께 40 늘린다.
  const btn = document.getElementById("moreDraftsBtn");
  btn.disabled = true;
  const prevText = btn.textContent;
  btn.textContent = "생성 중…";
  try{
    const r = await fetch(`/api/generate_drafts`, {method:"POST"});
    const d = await r.json();
    if(!d.ok){ btn.textContent = "❌ " + (d.error||"실패"); return; }
    if(d.count === 0){ btn.textContent = "더 생성할 항목 없음"; return; }
    RANK_LIMIT += 40;
    btn.textContent = prevText;
    document.getElementById("status").textContent = `${d.count}건 백그라운드 생성 시작 — 잠시 후 새로고침하면 반영됩니다`;
    await reload();
  }catch(e){ btn.textContent = "❌ " + e.message; }
  finally{ btn.disabled = false; }
}

function copyText(t, btn){
  navigator.clipboard.writeText(t).then(()=>{ if(btn){const o=btn.textContent;btn.textContent="복사됨✓";setTimeout(()=>btn.textContent=o,1200);} });
}
let ITEM_MAP = {};  // shortcode -> item. 캡션/문구를 HTML 속성에 직접 박아넣지
// 않고 shortcode(안전한 URL 형식)만 넘기고 여기서 조회한다 — 캡션에 작은따옴표(')가
// 하나라도 있으면 onclick='...JSON...' 속성이 거기서 깨져 나머지 JSON이 화면에
// 그대로 새어나오던 버그(2026-07-09, "score":0.001,... 텍스트 노출) 수정.

function pickDraft(sc, draftIdx, btn){
  const t = ITEM_MAP[sc]?.drafts?.[draftIdx] || "";
  SELECTED[sc] = t;
  copyText(t, btn);
}
function openAndCopy(sc){
  const item = ITEM_MAP[sc];
  if(!item) return;
  const chosen = SELECTED[sc] || (item.drafts && item.drafts[0]) || "";
  // 폴백: 유저스크립트(insta_fill_comment) 미설치 시 수동 붙여넣기용으로 클립보드에도 복사.
  if(chosen) navigator.clipboard.writeText(chosen);
  let url = item.url;
  if(chosen){
    // 유저스크립트가 이 해시를 읽어 인스타 댓글칸을 자동으로 채운다(전송·팔로우는 사용자가 직접).
    // UTF-8 안전 base64 — 한글·이모지 보존.
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify({c: chosen, sc: sc, o: location.origin}))));
    url += "#lotto_fill=" + encodeURIComponent(b64);
  }
  window.open(url, "_blank");
}
async function markDone(sc){
  await fetch(`/api/comment/done?shortcode=${encodeURIComponent(sc)}`, {method:"POST"});
}

function cardHtml(i, idx){
  ITEM_MAP[i.shortcode] = i;
  const drafts = (i.drafts||[]).map((d, di)=>
    `<div class="draft"><span>${escapeHtml(d)}</span><button onclick="pickDraft('${i.shortcode}', ${di}, this)">복사</button></div>`).join("")
    || `<div class="draft" style="color:#c98">문구 생성 실패 — 직접 작성</div>`;
  return `<div class="card ${i.done?'done':''}" id="c_${i.shortcode}">
    <img src="${i.thumbnail?('/api/thumb?url='+encodeURIComponent(i.thumbnail)):''}" loading="lazy" onerror="this.style.visibility='hidden'">
    <div class="body">
      <div class="meta">#${idx+1} · ${i.category} · ${Math.round(i.age_hours)}시간 전 · 댓글 ${(i.comments||0).toLocaleString()}</div>
      <div class="ch">${escapeHtml(i.name||i.username||'')} ${i.done?'✅':''}</div>
      <div class="cap">${escapeHtml((i.caption||'').slice(0,60))}</div>
      ${drafts}
      <div class="row">
        <button class="primary" onclick="openAndCopy('${i.shortcode}')">🔗 열기+댓글채우기</button>
        <button onclick="doneCard('${i.shortcode}')">✓ 완료</button>
      </div>
    </div></div>`;
}

function renderList(){
  const v=document.getElementById("view");
  if(!STATE.items.length){ v.innerHTML='<div class="cards"><div class="empty">큐가 비었어요. 먼저 레퍼런스 랭킹에서 수집하세요.</div></div>'; return; }
  v.innerHTML = `<div class="cards">${STATE.items.map((i,x)=>cardHtml(i,x)).join("")}</div>`;
}
async function doneCard(sc){
  await markDone(sc);
  const it = STATE.items.find(x=>x.shortcode===sc);
  if(it) it.done = true;
  // 현재 노출된 상위 RANK_LIMIT개를 전부 완료하면 자동으로 다음 40개를
  // 노출 범위에 편입한다(2026-07-09, "다 하거나 버튼 누르면 추가" 요구사항).
  if(STATE.items.length && STATE.items.every(x=>x.done)){
    RANK_LIMIT += 40;
    document.getElementById("status").textContent = "상위 항목 완료 — 다음 40개 노출";
    await reload();
    return;
  }
  const el=document.getElementById("c_"+sc);
  if(document.getElementById("hideDone").checked){ if(el) el.remove(); }
  else if(el){ el.classList.add("done"); }
}

// 인스타 탭(유저스크립트)이 "전송 완료" 신호를 보내면 그 카드를 자동으로 완료처리한다.
// 인스타 탭은 openAndCopy의 window.open으로 열렸으므로 이 탭(window.opener)에 postMessage 가능.
window.addEventListener("message", (e) => {
  if (e.origin !== "https://www.instagram.com") return;      // 인스타에서 온 신호만
  const d = e.data || {};
  if (d.type !== "lotto_done" || !d.sc) return;
  const it = STATE.items.find(x => x.shortcode === d.sc);
  if (it && it.done) return;                                 // 이미 완료면 무시
  doneCard(d.sc);                                            // 동일출처·인증된 완료 API 호출 + UI 갱신
});

// opener가 COOP로 끊겨 postMessage가 안 와도, 유저스크립트가 서버에 완료기록을 남긴다.
// 인스타에서 전송 후 소통큐 탭으로 돌아오면(포커스) 큐를 새로고침해 완료된 카드를 감춘다.
let _focusTimer = null;
window.addEventListener("focus", () => {
  if (STATE.mode !== "list") return;
  reload();                                     // 즉시
  clearTimeout(_focusTimer);                    // + 지연 재조회(완료기록 서버반영 타이밍 커버)
  _focusTimer = setTimeout(() => { if (STATE.mode === "list") reload(); }, 2500);
});

function renderProgress(){
  const v=document.getElementById("view");
  const list=STATE.items.filter(i=>!i.done);
  if(!list.length){ v.innerHTML='<div class="empty">오늘 소통 완료 🎉</div>'; return; }
  if(STATE.idx>=list.length) STATE.idx=list.length-1;
  const i=list[STATE.idx];
  v.innerHTML=`<div class="progress-wrap">${cardHtml(i, STATE.idx).replace("doneCard('", "doneCardProgress('")}
    <div class="counter">${STATE.idx+1} / ${list.length}</div></div>`;
}
async function doneCardProgress(sc){
  await markDone(sc);
  const it=STATE.items.find(x=>x.shortcode===sc); if(it) it.done=true;
  renderProgress();
}
function toggleMode(){
  STATE.mode = STATE.mode==="list" ? "progress" : "list";
  STATE.idx=0;
  document.getElementById("modeBtn").textContent = STATE.mode==="list" ? "▶ 진행 시작" : "☰ 리스트로";
  render();
}
function render(){ STATE.mode==="list" ? renderList() : renderProgress(); }

function bringFocusToFront(sc){
  // 순위가 한참 뒤(예: #273)인 항목이면 스크롤을 아무리 맨위로 해도 "화면이 훅
  // 이동해버리는" 느낌이라 체감이 안 좋았다(2026-07-09) — 스크롤 대신 포커스
  // 항목을 리스트 맨 앞으로 재배치해서 페이지 로드 시 바로 위에서 보이게 한다.
  const idx = STATE.items.findIndex(i=>i.shortcode===sc);
  if(idx>0){ const [it]=STATE.items.splice(idx,1); STATE.items.unshift(it); }
  if(STATE.mode==="progress"){ STATE.idx=0; renderProgress(); return; }
  render();
  const el = document.getElementById("c_"+sc);
  if(el) el.classList.add("focus-highlight");
  setTimeout(()=>{ if(el) el.classList.remove("focus-highlight"); }, 3200);
}

let RANK_LIMIT = 40;  // 레퍼런스랭킹(score) 상위 N개만 큐에 노출(2026-07-09) —
// 373건 전체를 다 띄우면 draft 생성 범위와 화면 노출 범위가 어긋나 "실패"로
// 오인하는 항목이 많았음. "댓글 더 생성" 클릭 또는 현재 노출분 전부 완료 시 +40.

async function reload(isInitial){
  const sort=document.getElementById("sort").value;
  // focus로 들어온 항목은 "완료 감추기"가 켜져있어도 반드시 보이게 함. rank_limit도
  // focus 항목이 상위 40위 밖일 수 있어 이번 요청만 무제한으로 푼다.
  const isFocusLoad = isInitial && FOCUS_SC;
  const hide = isFocusLoad ? false : document.getElementById("hideDone").checked;
  const rankParam = isFocusLoad ? "" : `&rank_limit=${RANK_LIMIT}`;
  document.getElementById("status").textContent="불러오는 중…";
  const d=await (await fetch(`/api/outreach?sort=${sort}&hide_done=${hide}${rankParam}`)).json();
  STATE.items=d.items||[]; STATE.idx=0;
  document.getElementById("status").textContent=`${d.count}건 (상위 ${RANK_LIMIT}위 기준)`;
  render();
  if(isFocusLoad) bringFocusToFront(FOCUS_SC);
}
reload(true);
</script>
</body>
</html>
