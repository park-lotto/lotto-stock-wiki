<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1080, height=1920" />
<!-- 모션그래픽 작업물 템플릿 shop_intro (관제 244) — 1080×1920, 모션그래픽만으로 완성. HyperFrames 0.8.105 규격(CHA 조각과 같은 꼴):
     루트 data-composition-* + 멈춘 GSAP 타임라인 하나를 window.__timelines.main 에 등록. 모든 프레임은 시간 t 만의 함수(Math.random·Date 없음).
     장면표(plan)는 compose.py 가 __PLAN__ 자리에 넣는다 — 미리보기(작업대 iframe)와 렌더(HyperFrames)가 **이 한 파일**을 읽는다(두 벌 금지). -->
<script src="vendor/gsap.min.js"></script>
<style>
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-Regular.otf") format("opentype");font-weight:400}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-SemiBold.otf") format("opentype");font-weight:600}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-Bold.otf") format("opentype");font-weight:700}
@font-face{font-family:"Pretendard";src:url("fonts/Pretendard-ExtraBold.otf") format("opentype");font-weight:800}
html,body{margin:0;background:#000}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Pretendard",sans-serif}
.scene{position:absolute;inset:0;opacity:0}
.blob{position:absolute;border-radius:50%;filter:blur(2px)}
.safe{position:absolute;left:90px;top:260px;width:900px;height:1400px}
.hook{position:absolute;left:90px;right:90px;top:560px;font-size:132px;font-weight:800;line-height:1.08;letter-spacing:-0.03em;word-break:keep-all}
.hook .w{display:inline-block;margin-right:.22em;opacity:0}
.cap{position:absolute;left:90px;right:90px;bottom:300px;text-align:center;font-size:58px;font-weight:700;line-height:1.3;word-break:keep-all;opacity:0}
.cap b{color:var(--accent)}
.tile{position:absolute;left:140px;top:520px;width:800px;height:800px;border-radius:var(--radius);background:linear-gradient(160deg,#182019,#0f1512);border:3px solid #22302a;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:24px;opacity:0}
.tile .name{font-size:96px;font-weight:800;text-align:center;line-height:1.1;letter-spacing:-0.02em;padding:0 40px;word-break:keep-all}
.tile .brand{font-size:40px;color:var(--muted);font-weight:600;letter-spacing:.08em}
.tile .ring{position:absolute;inset:-18px;border-radius:calc(var(--radius) + 18px);border:6px solid var(--accent);opacity:0}
.price{position:absolute;left:90px;right:90px;top:700px;text-align:center}
.scene.price .cap{top:400px;bottom:auto}
.price .was{font-size:84px;color:var(--muted);font-weight:600;position:relative;display:inline-block;opacity:0}
.price .was i{position:absolute;left:0;right:0;top:52%;height:10px;background:#ff5d5d;transform:scaleX(0);transform-origin:left center;border-radius:5px}
.price .pct{display:inline-block;margin:28px 0 0;background:var(--accent);color:#0b0f0d;font-size:76px;font-weight:800;padding:14px 44px;border-radius:999px;opacity:0}
.price .now{font-size:190px;font-weight:800;letter-spacing:-0.04em;line-height:1;margin-top:36px;opacity:0;font-variant-numeric:tabular-nums}
.price .now small{font-size:80px;font-weight:700;margin-left:10px}
.feat{position:absolute;left:120px;right:120px;top:600px;display:flex;flex-direction:column;gap:40px}
.feat .row{display:flex;align-items:center;gap:34px;font-size:72px;font-weight:700;opacity:0;word-break:keep-all;line-height:1.2}
.feat .dot{flex:none;width:64px;height:64px;border-radius:50%;background:var(--accent);display:flex;align-items:center;justify-content:center;color:#0b0f0d;font-size:44px;font-weight:800}
.end{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:44px}
.end .big{font-size:120px;font-weight:800;letter-spacing:-0.03em;opacity:0;text-align:center;line-height:1.1;padding:0 80px;word-break:keep-all}
.end .btn{background:var(--accent);color:#0b0f0d;font-size:72px;font-weight:800;padding:36px 96px;border-radius:999px;opacity:0}
.end .brand{font-size:44px;color:var(--muted);font-weight:600;opacity:0;letter-spacing:.1em}
</style>
</head>
<body>
<div id="stage" data-composition-id="main" data-start="0" data-duration="15" data-width="1080" data-height="1920"></div>
<script>
const PLAN = __PLAN__;
(() => {
  const S = document.getElementById("stage"), D = PLAN.design_ref || {}, M = PLAN.motion_character || {}, P = PLAN.product || {};
  const css = (k, v) => S.style.setProperty(k, v);
  css("--bg", D.bg || "#0B0F0D"); css("--ink", D.ink || "#F4F7F3"); css("--accent", D.accent || "#C8FF4D");
  css("--accent2", D.accent2 || "#38F8EC"); css("--muted", D.muted || "#8FA39A"); css("--radius", (D.radius || 28) + "px");
  S.dataset.duration = String(PLAN.total);
  const EASE = M.ease_in || "expo.out", POP = M.ease_pop || "back.out(1.6)", STAG = M.stagger_s || 0.12, IMP = M.impact_s || 0.55;
  const esc = s => String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const won = n => Number(n || 0).toLocaleString("ko-KR");
  // 씨앗 난수(작업마다 다르되 매 프레임 같다 — 결정적 렌더). 씨앗 = 장면표의 총 길이·글자 수
  let seed = Math.round((PLAN.total || 1) * 1000) + (PLAN.scenes || []).reduce((a, s) => a + s.text.length, 0);
  const rng = () => { seed = (seed + 0x6d2b79f5) >>> 0; let t = seed; t = Math.imul(t ^ (t >>> 15), t | 1); t ^= t + Math.imul(t ^ (t >>> 7), t | 61); return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };

  const scenes = [];
  (PLAN.scenes || []).forEach(sc => {
    const el = document.createElement("div"); el.className = "scene " + sc.type; el.dataset.i = sc.i;
    // 배경 덩어리 2개(라임·민트) — 장면마다 자리만 다르다
    for (let k = 0; k < 2; k++) {
      const b = document.createElement("div"); b.className = "blob";
      const sz = 520 + Math.round(rng() * 360);
      b.style.cssText = `width:${sz}px;height:${sz}px;left:${Math.round(rng() * 900 - 200)}px;top:${Math.round(rng() * 1500 - 200)}px;background:${k ? "var(--accent2)" : "var(--accent)"};opacity:${k ? .10 : .14}`;
      el.appendChild(b);
    }
    if (sc.type === "hook") {
      el.innerHTML += `<div class="hook">${sc.text.split(/\s+/).map(w => `<span class="w">${esc(w)}</span>`).join("")}</div>`;
    } else if (sc.type === "product") {
      el.innerHTML += `<div class="tile"><div class="ring"></div><div class="brand">${esc(P.brand || "")}</div><div class="name">${esc(P.name || sc.text)}</div></div><div class="cap">${esc(sc.text)}</div>`;
    } else if (sc.type === "price") {
      el.innerHTML += `<div class="price"><div class="was">${won(P.price)}원<i></i></div><br><div class="pct">${P.discount_pct}% 할인</div><div class="now"><span class="num">${won(P.price)}</span><small>원</small></div></div><div class="cap">${esc(sc.text)}</div>`;
    } else if (sc.type === "features") {
      const items = (P.features && P.features.length) ? P.features : [sc.text];
      el.innerHTML += `<div class="feat">${items.map((f, i) => `<div class="row"><div class="dot">${i + 1}</div><div>${esc(f)}</div></div>`).join("")}</div><div class="cap">${esc(sc.text)}</div>`;
    } else {
      el.innerHTML += `<div class="end"><div class="big">${esc(sc.text)}</div><div class="btn">${esc(P.cta || "지금 확인하기")}</div><div class="brand">${esc(P.brand || "")}</div></div>`;
    }
    S.appendChild(el); scenes.push({ sc, el });
  });

  const fontsReady = Promise.all(["400", "600", "700", "800"].map(w => document.fonts.load(`${w} 60px "Pretendard"`, "가격 123"))).then(() => document.fonts.ready).catch(() => {});
  fontsReady.then(() => {
    const tl = gsap.timeline({ paused: true });
    scenes.forEach(({ sc, el }) => {
      const t0 = sc.t0, t1 = sc.t0 + sc.dur, q = s => el.querySelectorAll(s);
      // 장면 켜고 끄기 — 자르기(페이드 단독 금지: 내용물이 움직여 들어온다)
      tl.set(el, { opacity: 1 }, t0); tl.set(el, { opacity: 0 }, t1);
      tl.fromTo(q(".blob"), { scale: .6, xPercent: -8 }, { scale: 1.15, xPercent: 8, duration: sc.dur, ease: "sine.inOut", immediateRender: false }, t0);
      if (sc.type === "hook") {
        tl.fromTo(q(".w"), { opacity: 0, y: 90, rotate: -4, scale: .8 }, { opacity: 1, y: 0, rotate: 0, scale: 1, duration: IMP, ease: POP, stagger: STAG, immediateRender: false }, t0 + .05);
      } else if (sc.type === "product") {
        tl.fromTo(q(".tile"), { opacity: 0, y: 160, scale: .86 }, { opacity: 1, y: 0, scale: 1, duration: IMP + .15, ease: EASE, immediateRender: false }, t0 + .05);
        tl.fromTo(q(".ring"), { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: .5, ease: EASE, immediateRender: false }, t0 + .45);
        tl.fromTo(q(".cap"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .5, ease: EASE, immediateRender: false }, t0 + .55);
      } else if (sc.type === "price") {
        tl.fromTo(q(".was"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .45, ease: EASE, immediateRender: false }, t0 + .05);
        tl.fromTo(q(".was i"), { scaleX: 0 }, { scaleX: 1, duration: .35, ease: "power3.inOut", immediateRender: false }, t0 + .5);
        tl.fromTo(q(".pct"), { opacity: 0, scale: .5, rotate: -8 }, { opacity: 1, scale: 1, rotate: 0, duration: .5, ease: POP, immediateRender: false }, t0 + .75);
        tl.fromTo(q(".now"), { opacity: 0, y: 60 }, { opacity: 1, y: 0, duration: .5, ease: EASE, immediateRender: false }, t0 + 1.0);
        // 가격 카운트다운: 정가 → 할인가(할인가는 plan 이 계산한 값만 쓴다 — 숫자 두 번 타이핑 금지)
        const num = el.querySelector(".num"), from = Number(P.price || 0), to = Number(P.sale_price || from), o = { v: from };
        tl.to(o, { v: to, duration: Math.min(1.1, Math.max(.5, sc.dur - 1.3)), ease: "power3.out", immediateRender: false,
                   onUpdate: () => { num.textContent = won(Math.round(o.v / 10) * 10); } }, t0 + 1.05);
        tl.fromTo(q(".cap"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .5, ease: EASE, immediateRender: false }, t0 + .3);
      } else if (sc.type === "features") {
        tl.fromTo(q(".row"), { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: IMP, ease: EASE, stagger: STAG * 1.6, immediateRender: false }, t0 + .05);
        tl.fromTo(q(".cap"), { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: .5, ease: EASE, immediateRender: false }, t0 + .4);
      } else {
        tl.fromTo(q(".big"), { opacity: 0, scale: .7 }, { opacity: 1, scale: 1, duration: IMP, ease: POP, immediateRender: false }, t0 + .05);
        tl.fromTo(q(".btn"), { opacity: 0, y: 80 }, { opacity: 1, y: 0, duration: .5, ease: EASE, immediateRender: false }, t0 + .45);
        tl.fromTo(q(".btn"), { scale: 1 }, { scale: 1.06, duration: .45, ease: "sine.inOut", yoyo: true, repeat: Math.max(1, Math.floor((sc.dur - 1) / .45)), immediateRender: false }, t0 + .95);
        tl.fromTo(q(".brand"), { opacity: 0 }, { opacity: 1, duration: .4, immediateRender: false }, t0 + .7);
      }
    });
    tl.time(0);
    window.__timelines = window.__timelines || {}; window.__timelines["main"] = tl;
  });
})();
</script>
</body>
</html>
