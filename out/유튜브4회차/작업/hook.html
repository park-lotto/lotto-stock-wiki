<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<style>
@font-face{font-family:Pre;src:url("fonts/Pretendard-Black.otf");font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1536px;height:864px;overflow:hidden;background:#faf6ee;font-family:Pre,"Malgun Gothic",sans-serif;color:#1f1e1d}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:900;letter-spacing:-2px}
.chip{position:absolute;left:50%;transform:translateX(-50%);background:#1f1e1d;color:#fff;font-weight:900;border-radius:18px;padding:16px 34px;font-size:52px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.chip b{color:#f0a37f}
.org{color:#d97757}
.panel{position:absolute;border-radius:22px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.panel img{width:100%;height:100%;object-fit:cover;display:block}
.cards{position:absolute;left:0;right:0;top:300px;display:flex;justify-content:center;gap:46px}
.cd{width:400px;height:400px;border-radius:26px;background:#fff;border:4px solid #1f1e1d;position:relative;overflow:hidden;transform-origin:50% 60%}
.cd .no{position:absolute;left:22px;top:14px;font-size:58px;color:#d97757;z-index:2}
.cd .q{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:190px;color:#e4dccb}
.cd img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cd .cap{position:absolute;left:0;right:0;bottom:0;background:rgba(31,30,29,.88);color:#fff;font-size:34px;text-align:center;padding:14px 8px}
.hl{position:absolute;background:rgba(255,214,0,.45);border-radius:6px}
</style></head>
<body>
<!-- A 방금 보신 거, 사람이 친 건 딱 한 줄 -->
<div class="sc" id="A"><img class="full" src="hk/sent.png" style="filter:blur(6px) brightness(.97);transform:scale(1.08)"><div style="position:absolute;inset:0;background:rgba(250,246,238,.55)"></div>
  <div id="Ab" style="position:absolute;left:50%;top:250px;transform:translateX(-50%);background:#f0eee6;border:3px solid #e1ddd0;border-radius:40px;padding:38px 60px;font-family:'Malgun Gothic',sans-serif;font-size:70px;white-space:nowrap;box-shadow:0 18px 50px rgba(0,0,0,.12)"><span style="position:relative"><span class="hl" id="Ahl" style="left:-8px;top:52px;height:34px"></span><span style="position:relative">외국인 한국화장품 영상 만들어줘..</span></span></div>
  <div class="chip" id="Ac" style="top:560px">사람이 친 건 <b>딱 한 줄</b></div></div>
<!-- B 조용히 판이 바뀌고 있다 -->
<div class="sc" id="B"><img class="full" id="Bimg"><div style="position:absolute;inset:0;background:linear-gradient(transparent 55%,rgba(0,0,0,.7))"></div>
  <div class="big" style="bottom:70px;color:#fff;font-size:84px">지금 유튜브, <span style="color:#f0a37f">판이 바뀌는 중</span></div></div>
<!-- C 클로드의 시대 -->
<div class="sc" id="C"><div class="big" id="Ct" style="top:300px;font-size:150px">클로드의 <span class="org">시대</span></div></div>
<!-- D 클로드? 그게 뭔데? -->
<div class="sc" id="D"><div class="big" id="D1" style="top:200px;font-size:160px">클로드<span class="org">?</span></div>
  <div class="big" id="D2" style="top:450px;font-size:110px;color:#5e5a4e">그게 뭔데<span class="org">?</span></div></div>
<!-- E 먼저 알아챈 사람들은 벌써 움직인다 (실제 엔진 실행 기록) -->
<div class="sc" id="E"><div class="panel" id="Ep" style="left:118px;top:70px;width:1300px;height:731px"><img id="Eimg"></div>
  <div class="chip" style="top:720px">먼저 알아챈 사람들은 <b>벌써 움직인다</b></div></div>
<!-- F~I 오늘 보실 3가지 -->
<div class="sc" id="F"><div class="big" id="Ft" style="top:110px;font-size:96px">오늘 끝까지 보시면 <span class="org">3가지</span></div>
  <div class="cards">
    <div class="cd" id="c1" style="background:#fdf3e2"><span class="no">①</span><div class="q">?</div><img id="c1i" src="hk/hero.png" style="display:none;object-fit:contain;object-position:50% 100%;height:330px;top:6px;bottom:auto;mix-blend-mode:multiply;background:transparent"><div class="cap" id="c1c" style="display:none">이메일만 보내던 쉰 살 회원</div></div>
    <div class="cd" id="c2"><span class="no">②</span><div class="q">?</div><img id="c2i" style="display:none"><div class="cap" id="c2c" style="display:none">사람은 못 하는 일</div></div>
    <div class="cd" id="c3"><span class="no">③</span><div class="q">?</div><img id="c3i" style="display:none"><div class="cap" id="c3c" style="display:none">채널 하나가 아니라 수십 개</div></div>
  </div></div>
<!-- J 처음 보셨다면 행운 -->
<div class="sc" id="J"><div class="big" id="Jt" style="top:250px;font-size:120px">이 영상을 처음 보셨다면</div>
  <div class="big" id="J2" style="top:450px;font-size:170px" ><span class="org">운이 좋으신 겁니다</span></div></div>
<script>
// 문장 시각 = voice/s00_v6.mp3 무음 실측(make_open2.py 가 넘겨줌)
var T = {A: 0, B: 3.05, C: 6.9, D: 8.3, D2: 9.0, E: 10.85, F: 14.5, G: 17.75, H: 20.7, I: 23.2, J: 25.35, END: 27.4};
var N = {ph1: 126, ph2: 84, en1: 117, en2: 84};
function fr(d, t) { var i = Math.min(N[d], Math.max(1, Math.floor(t * 30) + 1)); return "hk/" + d + "/" + ("00" + i).slice(-3) + ".jpg"; }
function show(id, a, b, t) { var on = t >= a && t < b; document.getElementById(id).style.display = on ? 'block' : 'none'; return on; }
function pop(e, t0, t) { var p = Math.max(0, Math.min(1, (t - t0) / 0.25)); var s = p < 1 ? 0.6 + 0.55 * p - 0.15 * Math.sin(p * Math.PI) : 1; e.style.opacity = p; e.style.transform = 'scale(' + s + ')'; }
function render(t) {
  if (show('A', T.A, T.B, t)) { pop(document.getElementById('Ab'), 0, t); document.getElementById('Ab').style.transform = 'translateX(-50%) ' + document.getElementById('Ab').style.transform;
    var w = Math.max(0, Math.min(1, (t - 0.9) / 0.6)); document.getElementById('Ahl').style.width = (w * 1090) + 'px';
    var c = document.getElementById('Ac'); c.style.display = t >= 1.3 ? 'block' : 'none'; }
  if (show('B', T.B, T.C, t)) { var img = document.getElementById('Bimg'); img.src = fr('ph1', t - T.B); img.style.transform = 'scale(' + (1.05 + 0.03 * (t - T.B)) + ')'; }
  if (show('C', T.C, T.D, t)) pop(document.getElementById('Ct'), T.C, t);
  if (show('D', T.D, T.E, t)) { pop(document.getElementById('D1'), T.D, t); var d2 = document.getElementById('D2'); d2.style.display = t >= T.D2 ? 'block' : 'none'; pop(d2, T.D2, t); }
  if (show('E', T.E, T.F, t)) { document.getElementById('Eimg').src = fr('en1', t - T.E); document.getElementById('Ep').style.transform = 'scale(' + (1 + 0.012 * (t - T.E)) + ')'; }
  if (show('F', T.F, T.J, t)) {
    pop(document.getElementById('Ft'), T.F, t);
    [['c1', T.G, null], ['c2', T.H, 'en2'], ['c3', T.I, 'ph2']].forEach(function (c, k) {
      var cd = document.getElementById(c[0]); pop(cd, T.F + 0.6 + k * 0.35, t);
      var open = t >= c[1], img = document.getElementById(c[0] + 'i');
      img.style.display = open ? 'block' : 'none'; document.getElementById(c[0] + 'c').style.display = open ? 'block' : 'none';
      cd.querySelector('.q').style.display = open ? 'none' : 'flex';
      if (open && c[2]) img.src = fr(c[2], t - c[1]);
      var act = open && (k === 2 ? t < T.J : t < [T.H, T.I][k]);
      cd.style.borderColor = act ? '#d97757' : '#1f1e1d'; if (t >= T.F + 1.6) cd.style.transform = 'scale(' + (act ? 1.12 : open ? 0.95 : 1) + ')';
    }); }
  if (show('J', T.J, 1e9, t)) { pop(document.getElementById('Jt'), T.J, t); pop(document.getElementById('J2'), T.J + 0.5, t); }
}
window.HT = T; window.render = render; render(0);
</script>
</body></html>
