<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>메이커스랩 · 워커 관제</title><link rel="stylesheet" href="atlas.css"></head>
<body><header><div class="brand"><b class="mark">M</b><strong>MAKERS LAB</strong><span>숏템메이커 / 워커 관제</span></div><span class="demo">예시 배치 · 실제 실행 미연결</span><div class="stats"><span>배치 <b id="total">—</b></span><span>프로젝트 <b id="project-count">—</b></span><span class="mint">실행 <b id="running">—</b></span><span>대기 <b id="waiting">—</b></span><span class="amber">막힘 <b id="blocked">—</b></span></div></header>
<main><canvas id="scene" aria-label="200개 예시 워커 3D 지도. 검색과 목록 버튼으로도 워커를 선택할 수 있습니다."></canvas><div id="labels" aria-hidden="true"></div>
<nav class="toolbar" aria-label="지도 조작"><button id="home">전체 보기</button><button id="open-search">검색·목록</button><button id="orbit" aria-pressed="false">회전</button><button id="zoom-out" aria-label="축소">−</button><span id="zoom">100%</span><button id="zoom-in" aria-label="확대">+</button><span class="hint">드래그 이동 · 휠 확대 · 우클릭 회전</span></nav>
<aside id="finder"><div class="section-head"><strong>업무 찾기</strong><button id="close-search" aria-label="검색 패널 닫기">×</button></div><label for="search">워커 ID · 업무 · 프로젝트</label><input id="search" type="search" autocomplete="off" placeholder="예: W-020, 수집 안정화"><div class="filters"><select id="team" aria-label="부서"><option value="">모든 부서</option></select><select id="status" aria-label="상태"><option value="">모든 상태</option><option value="running">실행</option><option value="waiting">대기</option><option value="blocked">막힘</option></select></div><div class="result-head"><span>일치하는 워커 <b id="matches">200</b></span><span>위치 고정</span></div><div id="results"></div></aside>
<aside id="detail" hidden aria-label="선택 업무 상세"></aside>
<div class="map-caption"><span class="eyebrow">SHORTEM MAKER / WORKER ATLAS</span><h1>일의 위치가 보이는 회사.</h1><p>작은 표식 하나가 개별 워커입니다. 확대해서 업무를 확인하세요.</p></div>
<div id="minimap-wrap"><canvas id="minimap" width="180" height="120" aria-label="부서 미니맵"></canvas><span>숏템메이커 · 전체 배치</span></div>
<section id="log-pane" hidden><div class="section-head"><strong>예시 실행 기록 · 실제 터미널 아님</strong><button id="close-logs" aria-label="기록 닫기">×</button></div><pre id="log-content"></pre></section>
<div id="notice" role="status" aria-live="polite">검토용 고정 데이터 · 실제 명령과 중단은 연결하지 않았습니다.</div></main><script type="module" src="atlas.bundle.js"></script></body></html>
