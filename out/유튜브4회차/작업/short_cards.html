<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<!-- 4회차 세로 쇼츠 나레이션 카드(11-04) — 카드 목록 = cards/<편>.js 의 SC(장면)·END. 모양은 short_hook.html(1편)과 같은 결 -->
<style>
@font-face{font-family:Pre;src:url("fonts/Pretendard-Black.otf");font-weight:900}
*{box-sizing:border-box;margin:0;padding:0}
body{width:1080px;height:1920px;overflow:hidden;background:#faf6ee;font-family:Pre,"Malgun Gothic",sans-serif;color:#1f1e1d}
.sc{position:absolute;inset:0;display:none;overflow:hidden}
.full{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.e{position:absolute;opacity:0}
.big{left:0;right:0;text-align:center;font-weight:900;letter-spacing:-2px;line-height:1.15}
.chip{left:50%;background:#1f1e1d;color:#fff;font-weight:900;border-radius:22px;padding:22px 40px;font-size:66px;white-space:nowrap;box-shadow:0 10px 30px rgba(0,0,0,.25)}
.chip b,.wt b{color:#f0a37f}
.org{color:#d97757}.yel{color:#ffd600}.gry{color:#8c8a86}
.wt{color:#fff}
.bub{left:50%;background:#f0eee6;border:3px solid #e1ddd0;border-radius:44px;padding:44px 50px;font-family:'Malgun Gothic',sans-serif;font-size:60px;white-space:nowrap;box-shadow:0 18px 50px rgba(0,0,0,.12)}
.hl{position:absolute;background:rgba(255,214,0,.45);border-radius:6px;left:-8px;top:44px;height:32px}
.row{left:140px;right:140px;background:#fff;border:4px solid #1f1e1d;border-radius:26px;display:flex;align-items:center;padding-left:40px;font-weight:900}
.row .ck{margin-left:auto;margin-right:34px;width:80px;height:80px;border-radius:50%;background:#2e9e5b;color:#fff;font-size:56px;display:flex;align-items:center;justify-content:center}
.row .x{background:#d9622b}
.pan{left:40px;right:40px;border-radius:28px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.22)}
.pan img{width:100%;height:100%;object-fit:cover;display:block}
.art{left:0;right:0;display:flex;justify-content:center}
.art img{height:100%;mix-blend-mode:multiply}
.tb{left:70px;right:70px;height:240px;background:#fff;border:5px solid #1f1e1d;border-radius:40px;display:flex;align-items:center;padding:0 50px;font-family:'Malgun Gothic',sans-serif;font-size:58px}
.tb .cu{display:inline-block;width:5px;height:70px;background:#1f1e1d;margin-left:6px}
.tb .go{margin-left:auto;width:110px;height:110px;border-radius:24px;background:#d97757;color:#fff;font-size:70px;display:flex;align-items:center;justify-content:center;flex:none}
.box{border:5px solid #1f1e1d;border-radius:30px;background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;text-align:center;line-height:1.15}
</style></head>
<body>
<script>
var _c = new URLSearchParams(location.search).get("c");
document.write('<script src="cards/' + _c + '.js"><\/script>');
</script>
<script>
// SC = [{t: 시작, bg: 'paper'|{blur:src}|{frames:dir, dark:true}, els: [{k, t, ...}]}] — 장면은 다음 장면 t 까지
var N = {ph1: 126, ph2: 84, en1: 117, en2: 84};
function fr(d, t) { var i = Math.min(N[d], Math.max(1, Math.floor(t * 30) + 1)); return "hk/" + d + "/" + ("00" + i).slice(-3) + ".jpg"; }
function pop(e, t0, t, base) { var p = Math.max(0, Math.min(1, (t - t0) / 0.25)); var s = p < 1 ? 0.6 + 0.55 * p - 0.15 * Math.sin(p * Math.PI) : 1; e.style.opacity = p; e.style.transform = (base || '') + ' scale(' + s + ')'; }
var ROOT = [];
SC.forEach(function (S, i) {
  var d = document.createElement('div'); d.className = 'sc'; document.body.appendChild(d); S.d = d; S.t1 = i + 1 < SC.length ? SC[i + 1].t : 1e9;
  if (S.bg && S.bg.blur) d.innerHTML = '<img class="full" src="' + S.bg.blur + '" style="filter:blur(8px) brightness(.97);transform:scale(1.2)"><div style="position:absolute;inset:0;background:rgba(250,246,238,.6)"></div>';
  if (S.bg && S.bg.frames) { d.innerHTML = '<img class="full fr" style="object-position:' + (S.bg.pos || '30% 50%') + '"><div style="position:absolute;inset:0;background:linear-gradient(rgba(0,0,0,.6),transparent 35%,transparent 55%,rgba(0,0,0,.78))"></div>'; S.fr = d.querySelector('.fr'); }
  S.els.forEach(function (E) {
    var e = document.createElement('div'); e.className = 'e ' + ({text: 'big', chip: 'chip', bubble: 'bub', row: 'row', panel: 'pan', art: 'art', type: 'tb', box: 'box'}[E.k] || '');
    e.style.top = E.top + 'px'; if (E.size) e.style.fontSize = E.size + 'px';
    if (E.h) e.style.height = E.h + 'px';
    if (E.left != null) { e.style.left = E.left + 'px'; } if (E.w) e.style.width = E.w + 'px';
    if (E.cls) e.className += ' ' + E.cls;
    if (E.k === 'text' || E.k === 'chip' || E.k === 'box') e.innerHTML = E.html;
    if (E.k === 'bubble') e.innerHTML = '<span style="position:relative"><span class="hl"></span><span style="position:relative">' + E.line + '</span></span>';
    if (E.k === 'row') e.innerHTML = E.html + '<span class="ck' + (E.x ? ' x' : '') + '">' + (E.x ? '✕' : '✓') + '</span>';
    if (E.k === 'panel') e.innerHTML = '<img>';
    if (E.k === 'art') e.innerHTML = '<img src="' + E.src + '">';
    if (E.k === 'type') e.innerHTML = '<span class="tx"></span><span class="cu"></span><span class="go">↑</span>';
    E.base = (E.k === 'chip' || E.k === 'bubble') ? 'translateX(-50%)' : '';
    d.appendChild(e); E.e = e;
  });
});
function render(t) {
  SC.forEach(function (S) {
    var on = t >= S.t && t < S.t1; S.d.style.display = on ? 'block' : 'none'; if (!on) return;
    if (S.fr) { S.fr.src = fr(S.bg.frames, t - S.t + (S.bg.ofs || 0)); S.fr.style.transform = 'scale(' + (1.1 + 0.05 * (t - S.t)) + ')'; }
    S.els.forEach(function (E) {
      var e = E.e, vis = t >= E.t; e.style.display = vis ? '' : 'none'; if (!vis) return;
      pop(e, E.t, t, E.base);
      if (E.k === 'bubble') e.querySelector('.hl').style.width = (Math.max(0, Math.min(1, (t - E.t - 0.75) / 0.6)) * E.hw) + 'px';
      if (E.k === 'panel') { e.querySelector('img').src = fr(E.dir, t - E.t + (E.ofs || 0)); e.style.transform = 'scale(' + (1 + 0.02 * (t - E.t)) + ')'; }
      if (E.k === 'type') { var n = Math.max(0, Math.min(E.line.length, Math.floor((t - E.t - 0.2) / 0.045))); e.querySelector('.tx').textContent = E.line.slice(0, n);
        e.querySelector('.cu').style.opacity = (Math.floor(t * 2) % 2) ? 1 : 0.15; }
    });
  });
}
window.HT = {END: END, POPS: SC.map(function (S) { return S.t; })}; window.render = render; render(0);
</script>
</body></html>
