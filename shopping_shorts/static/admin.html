<!doctype html><html lang=ko><head><meta charset=utf-8>
<meta name=viewport content="width=device-width,initial-scale=1"><title>유료게이트 관리자</title>
<style>
body{margin:0;background:#0b0b0e;color:#e8e8ea;font-family:system-ui,'Noto Sans KR',sans-serif;padding:20px}
h1{color:#4f9dfa;font-size:20px;margin:0 0 4px}.sub{color:#8a8a92;font-size:13px;margin-bottom:18px}
.card{background:#16161c;border:1px solid #2a2a30;border-radius:12px;padding:16px;margin-bottom:16px}
h2{font-size:15px;margin:0 0 12px;color:#cfd2d6}
table{width:100%;border-collapse:collapse;font-size:15px}
th,td{text-align:left;padding:11px 12px;border-bottom:1px solid #23232a}
th{color:#9a9aa2;font-weight:600;font-size:14px}
.badge{padding:3px 9px;border-radius:10px;font-size:13px;font-weight:700}
.filterbar{display:flex;gap:10px;margin:4px 0 14px;flex-wrap:wrap}
.filterbar input{width:280px;max-width:60vw;font-size:15px;padding:9px 12px}
.filterbar select{background:#0e0e12;border:1px solid #333;border-radius:7px;color:#eee;font-size:15px;padding:9px 12px;cursor:pointer}
.pro{background:#1c3d1f;color:#7ee787}.free{background:#3d1c1c;color:#ff9a8a}.trial{background:#1c2f3d;color:#7db4ff}
.admin{background:#3a1c3d;color:#e59aff}
.pending{background:#3d341c;color:#ffd479}
button{border:0;border-radius:7px;padding:7px 13px;font-weight:700;font-size:13px;cursor:pointer;margin-right:4px}
.bpro{background:#2ea043;color:#fff}.bfree{background:#6e2020;color:#fff}.bok{background:#d19b1e;color:#111}.bpay{background:#3a5bd0;color:#fff}
.bedit{background:#5a4bd0;color:#fff}.bdel{background:#8b1a1a;color:#fff}.btrial{background:#1c6a8a;color:#fff}.badm{background:#7a3da8;color:#fff}
.wait{border-color:#5a4a1e;background:#1a1710}.wait h2{color:#ffd479}
.empty{color:#6a6a72;font-size:13px;padding:6px 2px}
input{background:#0e0e12;border:1px solid #333;border-radius:7px;color:#eee;padding:8px 10px;font-size:13px;width:90px}
label{display:inline-block;min-width:120px;color:#a8a8b0;font-size:13px;margin:5px 0}
.save{background:#4f9dfa;color:#111;padding:8px 16px;margin-top:10px}
.msg{color:#7ee787;font-size:12px;margin-left:8px}
.err{color:#ff9a8a}
details.card>summary{cursor:pointer;font-size:15px;font-weight:600;color:#cfd2d6;list-style:none;user-select:none}
details.card>summary::-webkit-details-marker{display:none}
details.card>summary::before{content:'▸';color:#8a8a92;margin-right:6px;font-size:12px}
details.card[open]>summary::before{content:'▾'}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px 20px;margin:14px 0}
.setfield{display:flex;align-items:center;gap:8px}
.setfield label{min-width:92px;margin:0}
.setfield input{flex:1;width:auto}
tbody tr:hover{background:#1b1b22}
</style></head><body>
<h1>🔐 유료게이트 관리자</h1>
<div class=sub>결제 확인된 계정을 <b>pro</b>로 승격 / 체험·크레딧 설정 조정</div>

<details class=card>
  <summary>⚙️ 설정 (체험·크레딧·안내) <span id=setMsg class=msg></span></summary>
  <div id=settings class=setgrid></div>
  <button class=save onclick=saveSettings()>설정 저장</button>
</details>

<div class="card wait">
  <h2>🕓 승인 대기중 (<span id=pcnt>0</span>명) <span id=pMsg class=msg></span></h2>
  <table><thead><tr><th>ID</th><th>이름</th><th>전화</th><th>이메일/아이디</th><th>가입일</th><th>승인</th></tr></thead>
  <tbody id=prows></tbody></table>
</div>

<div class=card>
  <h2>고객 (<span id=cnt>0</span>명) <span id=cMsg class=msg></span></h2>
  <div class=filterbar>
    <input id=custSearch placeholder="🔍 이름·전화·이메일로 찾기" oninput="renderCustomers()">
    <select id=tierFilter onchange="renderCustomers()">
      <option value="">전체 등급</option>
      <option value="pro">pro</option>
      <option value="trial">체험중</option>
      <option value="free">일반회원</option>
    </select>
  </div>
  <table><thead><tr><th>ID</th><th>이름</th><th>전화</th><th>이메일/아이디</th><th>등급</th><th>상태</th><th>시작일</th><th>마감일</th><th>결제</th><th>오늘 사용(렌즈/렌더/대본)</th><th>접속7일(IP/기기)</th><th>접속/활동</th><th>조작</th></tr></thead>
  <tbody id=rows></tbody></table>
</div>

<script>
const SETTING_FIELDS=[
  ['trial_days','체험 기간(일)'],['trial_event_hours','가입 자동체험(시간,0=끔)'],['limit_lens','무료 렌즈/일'],['limit_render','무료 렌더/일'],
  ['limit_script','무료 대본/일'],['limit_lens_pro','pro 렌즈/일'],['limit_render_pro','pro 렌더/일'],
  ['global_cap_lens','전역 렌즈/일'],['contact_kakao','카톡 안내'],['contact_phone','전화 안내'],['pay_url','결제 링크(URL)'],
  ['bank_name','은행'],['bank_account','계좌번호'],['bank_holder','예금주'],['deposit_note','입금 안내문구'],
  ['biz_name','[약관] 상호'],['biz_owner','[약관] 대표자'],['biz_regno','[약관] 사업자등록번호'],['biz_addr','[약관] 주소'],['biz_sales_no','[약관] 통신판매업신고번호'],['biz_email','[약관] 문의 이메일']];
let CURRENT={};
async function load(){
  const r=await fetch('/api/admin/customers');
  if(r.status===403){document.body.innerHTML='<h2>관리자 전용입니다</h2>';return;}
  const d=await r.json(); CURRENT=d.settings||{}; window._CUST=d.customers||[];
  // 설정 폼
  document.getElementById('settings').innerHTML=SETTING_FIELDS.map(([k,label])=>
    `<div class=setfield><label>${label}</label><input id=set_${k} value="${(CURRENT[k]??'').toString().replace(/"/g,'&quot;')}"></div>`).join('');
  // 미승인(approved_at null) = 순수대기 + 이벤트 체험중 → 모두 대기명단(사장님이 승인 가능해야 함).
  const pend=d.customers.filter(c=>c.approved_at==null);
  const rest=d.customers.filter(c=>c.approved_at!=null);
  const esc=s=>(s||'').toString().replace(/</g,'&lt;').replace(/>/g,'&gt;');
  // 승인 대기 표
  document.getElementById('pcnt').textContent=pend.length;
  const nowSec=Math.floor(Date.now()/1000);
  document.getElementById('prows').innerHTML= pend.length ? pend.map(c=>{
    const joined=c.created_at? new Date((''+c.created_at).length>10?c.created_at:c.created_at*1000).toLocaleString('ko-KR'):'-';
    const trialLeft = c.trial_ends_at && c.trial_ends_at>nowSec ? Math.ceil((c.trial_ends_at-nowSec)/3600) : 0;
    const trialBadge = trialLeft ? ` <span class="badge trial">🎁 체험중 ${trialLeft}h</span>` : '';
    return `<tr><td>${c.id}</td><td>${esc(c.name)}${trialBadge}</td><td>${esc(c.phone)}</td><td>${esc(c.email||c.username)}</td>
      <td style="font-size:12px;color:#8a8a92">${joined}</td>
      <td><button class=bok onclick="approveCustomer(${c.id})">✅ 승인</button></td></tr>`;
  }).join('') : '<tr><td colspan=6 class=empty>대기 중인 가입 신청이 없어요</td></tr>';
  // 일반 고객표 — 검색·등급 필터 적용 렌더
  renderCustomers();
}

function _tierOf(c){ return c.level==='full' ? (c.plan==='pro'?'pro':'trial') : 'free'; }
function _ago(s){ if(s<60)return '방금 전'; if(s<3600)return Math.floor(s/60)+'분 전'; if(s<86400)return Math.floor(s/3600)+'시간 전'; return Math.floor(s/86400)+'일 전'; }
// 접속/활동 셀 클릭 → 최근 활동 트레일 팝업
document.addEventListener('click', async (e)=>{
  const el=e.target.closest('.actlink'); if(!el) return;
  const cid=el.dataset.actcid;
  const d=await (await fetch('/api/admin/customer/activity?customer_id='+cid)).json();
  const now=Math.floor(Date.now()/1000);
  const lines=(d.activity||[]).map(a=>`${_ago(now-a.at)}  ·  ${a.action}`).join('\n') || '기록된 활동이 없어요';
  alert('최근 활동\n\n'+lines);
});

function renderCustomers(){
  const esc=s=>(s||'').toString().replace(/</g,'&lt;').replace(/>/g,'&gt;');
  const q=((document.getElementById('custSearch')||{}).value||'').trim().toLowerCase();
  const tier=(document.getElementById('tierFilter')||{}).value||'';
  const rest=(window._CUST||[]).filter(c=>c.approved_at!=null).filter(c=>{
    if(tier && _tierOf(c)!==tier) return false;
    if(q){ const hay=`${c.name||''} ${c.phone||''} ${c.email||''} ${c.username||''}`.toLowerCase();
           if(hay.indexOf(q)<0) return false; }
    return true;
  });
  document.getElementById('cnt').textContent=rest.length;
  document.getElementById('rows').innerHTML= rest.length ? rest.map(c=>{
    const lvl=c.level==='full'?(c.plan==='pro'?'<span class="badge pro">pro</span>':'<span class="badge trial">체험중</span>')
              :'<span class="badge free">일반회원</span>';
    const u=c.usage||{};
    const acc=c.access_7d||{ips:0,devices:0};
    // 돌려쓰기 의심: 최근 7일 고유 IP 3개↑ 또는 기기 3종↑이면 빨간 강조(차단은 안 함, 사장님 눈으로 판단)
    const accSusp = (acc.ips>=3 || acc.devices>=3);
    const accCell = `<span style="color:${accSusp?'#ff6b6b':'#8a8a92'};font-weight:${accSusp?'700':'400'}">${acc.ips}IP/${acc.devices}기기${accSusp?' ⚠️':''}</span>`;
    const adminBadge = c.is_admin ? ' <span class="badge admin">관리자</span>' : '';
    const ls = c.last_seen||0, nowS=Math.floor(Date.now()/1000);
    const online = ls && (nowS-ls) < 300;   // 5분 내 활동 = 접속중
    const seenCell = `<span class=actlink data-actcid=${c.id} title="최근 활동 보기" style="cursor:pointer;color:${online?'#7ee787':'#8ab4f8'}">${online?'🟢 접속중':(ls?'⚪ '+_ago(nowS-ls):'-')}</span>`;
    return `<tr><td>${c.id}</td><td>${esc(c.name)}${adminBadge}</td><td>${esc(c.phone)}</td><td>${esc(c.email||c.username)}</td><td>${c.plan}</td><td>${lvl}</td>
      <td style="color:#8a8a92">${c.approved_at? new Date(c.approved_at*1000).toLocaleDateString('ko-KR'):'-'}</td>
      <td style="color:#8a8a92">${c.full_access_until? new Date(c.full_access_until*1000).toLocaleDateString('ko-KR'):'-'}</td>
      <td>${c.last_payment? `<span class=paylink data-cid=${c.id} style="cursor:pointer;color:#8ab4f8">${c.last_payment.amount.toLocaleString()}원 · ${c.payment_count}건</span>` : '-'}</td>
      <td>${u.lens||0}/${u.render||0}/${u.script||0}</td>
      <td>${accCell}</td>
      <td>${seenCell}</td>
      <td><button class=bpay onclick="addPayment(${c.id})">결제추가</button>
          <button class=bedit onclick="editInfo(${c.id})">정보수정</button>
          <button class=bfree onclick="setPlan(${c.id},'free')">일반회원</button>
          <button class=btrial onclick="grantTrial(${c.id})">체험</button>
          <button class=bpro onclick="setPlan(${c.id},'pro')">pro</button>
          ${c.code_admin?'':(c.is_admin
            ? `<button class=badm onclick="setAdmin(${c.id},false)">관리자해제</button>`
            : `<button class=badm onclick="setAdmin(${c.id},true)">관리자지정</button>`)}
          ${c.is_admin?'':`<button class=bdel onclick="delCustomer(${c.id})">삭제</button>`}</td></tr>`;
  }).join('') : '<tr><td colspan=13 class=empty>조건에 맞는 고객이 없어요</td></tr>';
}
async function approveCustomer(cid){
  const days = prompt('이용일수 (예: 30)', '');
  if(days===null) return;
  const amount = prompt('결제 금액(원)', '');
  if(amount===null) return;
  const method = prompt('결제 수단 (계좌/카드/현금/카톡 등)', '계좌이체') || '';
  const r = await fetch('/api/admin/approve',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({customer_id:cid, period_days:Number(days)||0, amount:Number(amount)||0, method})});
  const m=document.getElementById('pMsg');
  if(r.ok){m.textContent='✅ 승인됨';m.className='msg';load();}else{m.textContent='❌ 실패';m.className='msg err';}
  setTimeout(()=>m.textContent='',2000);
}
async function editInfo(cid){
  const row=(window._CUST||[]).find(c=>c.id===cid)||{};
  const name = prompt('이름', row.name||'');
  if(name===null) return;
  const phone = prompt('전화', row.phone||'');
  if(phone===null) return;
  const r = await fetch('/api/admin/customer/update',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({customer_id:cid, name, phone})});
  const m=document.getElementById('cMsg');
  if(r.ok){m.textContent='✅ 수정됨';m.className='msg';load();}else{m.textContent='❌ 실패';m.className='msg err';}
  setTimeout(()=>m.textContent='',2000);
}
async function delCustomer(cid){
  const row=(window._CUST||[]).find(c=>c.id===cid)||{};
  if(!confirm(`정말 삭제할까요? (${row.email||row.username||cid})\n고객·결제이력·접속기록이 모두 지워지고 되돌릴 수 없어요.`)) return;
  const r = await fetch('/api/admin/customer/delete',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({customer_id:cid})});
  const m=document.getElementById('cMsg');
  if(r.ok){m.textContent='🗑️ 삭제됨';m.className='msg';load();}else{m.textContent='❌ 실패';m.className='msg err';}
  setTimeout(()=>m.textContent='',2000);
}
async function addPayment(cid){
  const days = prompt('연장 이용일수 (예: 30)', '');
  if(days===null) return;
  const amount = prompt('결제 금액(원)', '');
  if(amount===null) return;
  const method = prompt('결제 수단', '계좌이체') || '';
  const r = await fetch('/api/admin/payment',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({customer_id:cid, period_days:Number(days)||0, amount:Number(amount)||0, method})});
  const m=document.getElementById('cMsg');
  if(r.ok){m.textContent='✅ 결제 추가됨';m.className='msg';load();}else{m.textContent='❌ 실패';m.className='msg err';}
  setTimeout(()=>m.textContent='',2000);
}
document.addEventListener('click', async (e)=>{
  const el = e.target.closest('.paylink'); if(!el) return;
  const cid = el.dataset.cid;
  const d = await (await fetch('/api/admin/payments?customer_id='+cid)).json();
  const lines = (d.payments||[]).map(p=>{
    const dt = new Date(p.paid_at*1000).toLocaleDateString('ko-KR');
    return `${dt}  ${Number(p.amount).toLocaleString()}원  ${p.method||''}  ${p.period_days}일`;
  }).join('\n') || '결제 내역 없음';
  alert('결제 이력\n\n'+lines);
});
async function setPlan(cid,plan){
  const r=await fetch('/api/admin/set_plan',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({customer_id:cid,plan})});
  const m=document.getElementById('cMsg');
  if(r.ok){m.textContent='✅ 변경됨';m.className='msg';load();}else{m.textContent='❌ 실패';m.className='msg err';}
  setTimeout(()=>m.textContent='',2000);
}
async function setAdmin(cid,flag){
  const row=(window._CUST||[]).find(c=>c.id===cid)||{};
  const who=row.email||row.username||cid;
  if(flag && !confirm(`${who} 계정에 관리자 권한을 줄까요?\n관리자와 동일하게 모든 관리 기능·삭제까지 쓸 수 있어요.`)) return;
  if(!flag && !confirm(`${who}의 관리자 권한을 회수할까요?`)) return;
  const r=await fetch('/api/admin/customer/set_admin',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({customer_id:cid, admin:flag})});
  const m=document.getElementById('cMsg');
  if(r.ok){m.textContent=flag?'✅ 관리자 지정됨':'✅ 관리자 해제됨';m.className='msg';load();}else{m.textContent='❌ 실패';m.className='msg err';}
  setTimeout(()=>m.textContent='',2000);
}
async function grantTrial(cid){
  const def=(CURRENT.trial_days||'7');
  const days=prompt('체험 며칠 줄까요? (전기능 열림)', def);
  if(days===null) return;
  const r=await fetch('/api/admin/set_plan',{method:'POST',headers:{'Content-Type':'application/json'},
    body:JSON.stringify({customer_id:cid, plan:'free', days:Number(days)||0})});
  const m=document.getElementById('cMsg');
  if(r.ok){m.textContent='✅ 체험 부여됨';m.className='msg';load();}else{m.textContent='❌ 실패';m.className='msg err';}
  setTimeout(()=>m.textContent='',2000);
}
async function saveSettings(){
  const body={}; SETTING_FIELDS.forEach(([k])=>{const v=document.getElementById('set_'+k).value.trim(); if(v!=='')body[k]=v;});
  const r=await fetch('/api/admin/settings',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  const m=document.getElementById('setMsg');
  if(r.ok){m.textContent='✅ 저장됨';m.className='msg';}else{m.textContent='❌ 실패';m.className='msg err';}
  setTimeout(()=>m.textContent='',2000);
}
load();
</script></body></html>
