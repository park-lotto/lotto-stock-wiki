<!doctype html><html lang="ko"><head><meta charset="utf-8">
<title>장비템·차량템 판정 — 넣을 것 / 뺄 것</title>
<style>
:root{--bg:#0c1116;--card:#141b23;--line:#243040;--txt:#e6edf3;--sub:#8b9bb0;--ok:#22c55e;--no:#ef4444;--acc:#7df5db}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--txt);font:14px/1.5 "Malgun Gothic",system-ui,sans-serif}
header{position:sticky;top:0;z-index:9;background:#0c1116f2;backdrop-filter:blur(6px);border-bottom:1px solid var(--line);padding:12px 18px}
h1{margin:0 0 4px;font-size:17px}.sub{color:var(--sub);font-size:12.5px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:9px}
.pill{background:var(--card);border:1px solid var(--line);border-radius:99px;padding:5px 12px;font-size:12.5px}
button{cursor:pointer;font-family:inherit}
.btn{background:var(--card);border:1px solid var(--line);color:var(--txt);border-radius:8px;padding:7px 14px;font-size:13px}
.btn.on{background:#123;border-color:var(--acc);color:var(--acc);font-weight:700}
.btn.acc{background:#123;border-color:var(--acc);color:var(--acc);font-weight:700}
.note{margin:14px 18px 0;padding:10px 14px;border-radius:10px;background:#131c26;border:1px solid var(--line);font-size:13px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;padding:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;display:flex;flex-direction:column;gap:8px}
.card.o{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok) inset}
.card.x{opacity:.42}
.thumb{display:block;border-radius:9px;overflow:hidden;background:#0a0f14;aspect-ratio:16/9;flex:0 0 auto}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.ttl{font-weight:700;font-size:13.5px;word-break:keep-all;line-height:1.35;height:2.7em;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.meta{color:var(--sub);font-size:12px;display:flex;gap:8px;flex-wrap:wrap}
.tag{background:#1b2530;border-radius:6px;padding:1px 7px;font-size:11.5px}
.acts{display:flex;gap:6px;margin-top:auto}
.acts button{flex:1;border-radius:8px;padding:8px 0;font-size:13px;font-weight:700;border:1px solid var(--line);background:#0f1620;color:var(--sub)}
.acts .o.on{background:var(--ok);border-color:var(--ok);color:#04240f}
.acts .x.on{background:var(--no);border-color:var(--no);color:#2b0505}
a{color:var(--acc);font-size:12px;text-decoration:none}
textarea{width:100%;height:180px;background:#080d12;color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:10px;font:12px/1.5 Consolas,monospace}
dialog{background:var(--card);color:var(--txt);border:1px solid var(--line);border-radius:14px;max-width:760px;width:92%}
</style></head><body>
<header>
  <h1>장비템 · 차량템 판정</h1>
  <div class="sub">두 가지를 고릅니다 — <b>넣을 것</b>(빠져 있는 것)과 <b>뺄 것</b>(잘못 들어간 것). 자동 저장됩니다.</div>
  <div class="bar">
    <button class="btn" id="b_gear" onclick="setCat('장비템')">🔧 장비템</button>
    <button class="btn" id="b_car" onclick="setCat('차량템')">🚗 차량템</button>
    <span style="width:14px"></span>
    <button class="btn" id="m_cand" onclick="setMode('cand')">➕ 넣을 것 고르기</button>
    <button class="btn" id="m_have" onclick="setMode('have')">➖ 뺄 것 고르기</button>
    <span style="width:14px"></span>
    <span class="pill">O <b id="cO">0</b></span><span class="pill">X <b id="cX">0</b></span>
    <button class="btn" onclick="only()">안 찍은 것만</button>
    <button class="btn acc" onclick="save()">📋 결과 내보내기</button>
  </div>
</header>
<div class="note" id="note"></div>
<div class="grid" id="g"></div>
<dialog id="dlg"><h3 style="margin:14px 16px 6px">결과 — 복사해서 클로드에게 붙여넣어 주세요</h3>
 <div style="padding:0 16px 16px"><textarea id="out"></textarea>
 <div style="display:flex;gap:8px;margin-top:10px"><button class="btn acc" onclick="copyOut()">복사</button>
 <button class="btn" onclick="dlg.close()">닫기</button><span id="copied" class="sub"></span></div></div></dialog>

const KEY='judge2_v1';

let QUEUE=[],BUSY=0;
function pump(){ while(BUSY<6&&QUEUE.length){ const im=QUEUE.shift();
  if(!im||im.dataset.done) continue; im.dataset.done='1'; BUSY++;
  const fin=()=>{BUSY--;pump();}; im.onload=fin;
  im.onerror=()=>{ if(!im.dataset.retry&&im.dataset.sc){im.dataset.retry='1';
    im.src='https://i.ytimg.com/vi/'+im.dataset.sc+'/mqdefault.jpg'; return;} fin(); };
  im.src=im.dataset.src; } }
function render(){

function count(){ const v=Object.values(M);

function mark(k,v){ if(M[k]===v) delete M[k]; else M[k]=v;

function save(){

}
