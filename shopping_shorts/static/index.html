<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>쇼핑쇼츠 레퍼런스 랭킹</title>
<style>
  :root{--bg:#0a0e14;--panel:#111722;--line:#1e2735;--txt:#e6edf3;--sub:#8b98a9;--accent:#2f81f7;--fire:#ff6b35;}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--txt);font-family:'Malgun Gothic',system-ui,sans-serif;display:flex;min-height:100vh}
  .sidebar{width:230px;background:var(--panel);border-right:1px solid var(--line);padding:16px;flex-shrink:0}
  .sidebar h1{font-size:14px;color:var(--sub);margin-bottom:16px}
  .menu-group{margin-bottom:18px}
  .menu-group .label{font-size:11px;color:var(--sub);text-transform:uppercase;margin-bottom:8px}
  .menu-item{padding:8px 12px;border-radius:8px;font-size:13px;color:var(--txt);cursor:default;margin-bottom:2px}
  .menu-item.active{background:linear-gradient(90deg,#153a6b,#0d2340);color:#7db4ff}
  .main{flex:1;padding:28px 36px;overflow:auto}
  .head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
  .head h2{font-size:24px}
  .desc{color:var(--sub);font-size:13px;margin-bottom:20px}
  .toolbar{display:flex;gap:12px;align-items:center;margin-bottom:18px;flex-wrap:wrap}
  button{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:8px;font-size:13px;cursor:pointer}
  button:disabled{opacity:.5;cursor:wait}
  .tabs{display:flex;gap:8px;border-bottom:1px solid var(--line);margin-bottom:16px}
  .tab{padding:10px 16px;font-size:13px;color:var(--sub);cursor:pointer;border-bottom:2px solid transparent}
  .tab.active{color:var(--txt);border-bottom-color:var(--accent)}
  .cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
  .cat{padding:6px 12px;border:1px solid var(--line);border-radius:20px;font-size:12px;color:var(--sub);cursor:pointer}
  .cat.active{background:var(--accent);color:#fff;border-color:var(--accent)}
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;display:flex;flex-direction:column}
  .card img{width:100%;height:220px;object-fit:cover;background:#000}
  .card .body{padding:12px;flex:1;display:flex;flex-direction:column}
  .card .rank{font-size:12px;color:var(--sub)}
  .card .ch{font-weight:600;font-size:14px;margin:4px 0}
  .stat{display:flex;justify-content:space-between;font-size:12px;color:var(--sub);margin-top:4px}
  .stat b{color:var(--txt)}
  .grade{font-size:14px}
  .delta-up{color:var(--fire)}
  .links{display:flex;gap:8px;margin-top:10px}
  .links a{font-size:12px;color:var(--accent);text-decoration:none}
  .empty{color:var(--sub);text-align:center;padding:60px;grid-column:1/-1}
  .btns{display:flex;gap:6px;margin-top:auto;padding-top:10px}
  .btns button{flex:1;font-size:11px;padding:7px 4px;border-radius:7px;border:1px solid var(--line);background:#0d131c;color:var(--txt);cursor:pointer}
  .btns button.view{border-color:#2f81f7;color:#7db4ff}
  .btns button.comment{background:linear-gradient(90deg,#7b2ff7,#c22ed0);border:none;color:#fff}
  .btns button.save.saved{background:#2ea043;border-color:#2ea043;color:#fff}
  @media (max-width: 768px){
    body{flex-direction:column;min-height:100vh}
    .sidebar{width:100%;border-right:none;border-bottom:1px solid var(--line);padding:10px 12px;
             display:flex;gap:6px;overflow-x:auto;align-items:center;white-space:nowrap}
    .sidebar h1{margin:0 8px 0 0;flex-shrink:0}
    .sidebar .menu-group{margin:0;display:flex;gap:6px;align-items:center}
    .sidebar .menu-group .label{display:none}
    .menu-item{margin:0;padding:6px 10px;flex-shrink:0;font-size:12px}
    .main{padding:16px 14px}
    .cards{grid-template-columns:repeat(2,1fr);gap:10px}
    .head h2{font-size:20px}
    .toolbar{gap:8px}
    .tabs{overflow-x:auto}
    .cats{overflow-x:auto;flex-wrap:nowrap}
    .progress-wrap{max-width:100%}
  }
  @media (max-width: 420px){
    .cards{grid-template-columns:repeat(2,1fr);gap:8px}
    .card .body{padding:8px}
    .stat{font-size:11px}
    .btns button{font-size:10px;padding:6px 2px}
  }
</style>
</head>
<body>
  <aside class="sidebar">
    <h1>🛍️ 쇼핑쇼츠</h1>
    <div class="menu-group">
      <div class="label">트렌드 리서치</div>
      <div class="menu-item active">📊 레퍼런스 랭킹</div>
      <div class="menu-item" onclick="location.href='/discover.html'" style="cursor:pointer">🔎 채널 발굴·정리</div>
      <div class="menu-item" onclick="location.href='/find.html'" style="cursor:pointer">🔍 제품 찾기</div>
      <div class="menu-item">📈 실시간 쇼핑순위</div>
    </div>
    <div class="menu-group">
      <div class="label">채널 &amp; 콘텐츠</div>
      <div class="menu-item">👁 내 모니터링 리스트</div>
      <div class="menu-item">📁 레퍼런스 모음집</div>
      <div class="menu-item" onclick="location.href='/outreach.html'" style="cursor:pointer">💬 소통 큐</div>
    </div>
  </aside>
  <main class="main">
    <div class="head">
      <h2>📊 레퍼런스 랭킹</h2>
    </div>
    <div class="desc">443개 레퍼런스 채널의 48시간 이내 릴스를 강도별로 랭킹합니다.</div>
    <div class="toolbar">
      <button id="collectBtn" onclick="doCollect()">⚡ 지금 수집</button>
      <span id="status" style="color:var(--sub);font-size:12px"></span>
    </div>
    <div class="tabs" id="tabs">
      <div class="tab active" data-tab="comments" title="댓글 수 그대로 정렬">📊 전체</div>
      <div class="tab" data-tab="speed" title="댓글수 ÷ 경과시간(시간) — 시간당 댓글이 얼마나 빨리 쌓이는지">⚡ 속도</div>
      <div class="tab" data-tab="accel" title="이번 수집 Δ(댓글 증가분) − 직전 수집 Δ — 증가세 자체가 빨라지고 있는지(가속도)">📈 가속</div>
      <div class="tab" data-tab="density" title="댓글수 ÷ 팔로워수 — 팔로워 규모 대비 반응이 얼마나 뜨거운지(작은 채널도 상위권 가능)">💥 참여밀도</div>
    </div>
    <div class="cats" id="cats"></div>
    <div class="cards" id="cards">
      <div class="empty">「지금 수집」을 눌러 시작하세요.</div>
    </div>
  </main>
<script>
const CATS = ["전체","인테리어","레시피","생활용품","가전","뷰티","기타"];
let STATE = {items:[], tab:"comments", cat:"전체"};

function renderCats(){
  const el = document.getElementById("cats");
  el.innerHTML = CATS.map(c =>
    `<div class="cat ${c===STATE.cat?'active':''}" onclick="setCat('${c}')">${c}</div>`).join("");
}
function setCat(c){ STATE.cat=c; renderCats(); render(); }
function setTab(t){ STATE.tab=t; document.querySelectorAll('.tab').forEach(x=>
  x.classList.toggle('active', x.dataset.tab===t)); render(); }
document.querySelectorAll('.tab').forEach(x=> x.onclick=()=>setTab(x.dataset.tab));

function sortKey(i){
  return {comments:i.comments, speed:i.speed, accel:(i.accel??-1), density:i.density}[STATE.tab] || 0;
}
function render(){
  let items = STATE.items.slice();
  if(STATE.cat!=="전체") items = items.filter(i=>i.category===STATE.cat);
  items.sort((a,b)=> sortKey(b)-sortKey(a));
  const el = document.getElementById("cards");
  if(!items.length){ el.innerHTML='<div class="empty">결과 없음.</div>'; return; }
  el.innerHTML = items.map((i,idx)=>`
    <div class="card">
      <img src="${i.thumbnail?('/api/thumb?url='+encodeURIComponent(i.thumbnail)):''}" loading="lazy" onerror="this.style.visibility='hidden'">
      <div class="body">
        <div class="rank">#${idx+1} · ${i.category} · ${Math.round(i.age_hours)}시간 전</div>
        <div class="ch">${i.name||i.username} <span class="grade">${i.grade||''}</span></div>
        <div class="rank" style="margin:-4px 0 4px">팔로워 ${(i.followers||0).toLocaleString()}</div>
        <div class="stat" title="댓글 수 그대로"><span>댓글</span><b>${i.comments.toLocaleString()} <span class="delta-up">${i.is_new?'신규':'+'+i.delta}</span></b></div>
        <div class="stat" title="댓글수 ÷ 경과시간(시간)"><span>속도(시간당)</span><b>${i.speed.toFixed(1)}</b></div>
        <div class="stat" title="이번 수집 Δ − 직전 수집 Δ (증가세가 빨라지는 중인지)"><span>가속</span><b>${i.accel==null?'—':(i.accel>0?'+':'')+i.accel}</b></div>
        <div class="stat" title="댓글수 ÷ 팔로워수 (팔로워 대비 반응 비율)"><span>참여밀도</span><b>${(i.density*100).toFixed(2)}%</b></div>
        <div class="btns">
          <button class="view" onclick="window.open('${i.url}','_blank')">👁 보기</button>
          <button class="comment" onclick="goComment('${i.shortcode}')">💬 댓글</button>
          <button class="save" id="save_${i.shortcode}" onclick="doSave('${i.shortcode}', this)">📥 담기</button>
        </div>
        ${i.inpock?`<div style="margin-top:6px"><a href="${i.inpock}" target="_blank" style="font-size:11px;color:var(--accent);text-decoration:none">🛒 판매채널</a></div>`:''}
      </div>
    </div>`).join("");
  markSavedButtons();
}
function fmtTime(iso){
  // collected_at은 UTC로 저장됨 — 브라우저 로컬시간(한국이면 KST)으로 변환해 표시
  // (그냥 슬라이스하면 UTC 그대로 떠서 실제 시각보다 9시간 늦게 보이던 문제, 2026-07-09)
  if(!iso) return '-';
  const d = new Date(iso);
  if(isNaN(d)) return iso.slice(0,16);
  return d.toLocaleString('ko-KR', {year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'});
}
async function doCollect(){
  const btn=document.getElementById("collectBtn"), st=document.getElementById("status");
  btn.disabled=true; st.textContent="수집 중… (수 분 소요)";
  try{
    const r = await fetch("/api/collect", {method:"POST"});
    const d = await r.json();
    if(!d.ok) throw new Error(d.error||"실패");
    STATE.items = d.items; st.textContent=`✅ ${d.count}건 수집 (${fmtTime(d.collected_at)})`;
    render();
  }catch(e){ st.textContent="❌ "+e.message; }
  finally{ btn.disabled=false; }
}
async function loadLast(){
  const d = await (await fetch("/api/reference")).json();
  if(d.items?.length){ STATE.items=d.items; render();
    document.getElementById("status").textContent=`마지막 수집: ${fmtTime(d.collected_at)}`; }
}
function goComment(sc){ location.href = '/outreach.html?focus=' + encodeURIComponent(sc); }
async function doSave(sc, btn){
  await fetch('/api/save?shortcode=' + encodeURIComponent(sc), {method:'POST'});
  btn.textContent = '담김✓'; btn.classList.add('saved');
  // 제품찾기(shopping.tubefactory.kr)로 넘겨서 틱톡·인스타·유튭·더우인·샤오홍슈·
  // 구글에서 같은 영상 소스를 찾는 다음 단계로 이어준다(2026-07-09). 이 도구는
  // SPA라 URL 파라미터로 검색창을 미리 채우는 게 안 될 수 있어 복사+새탭 방식으로
  // 확실하게 — 사용자가 새탭에서 Ctrl+V만 하면 됨.
  const it = STATE.items.find(x=>x.shortcode===sc);
  if(it?.url){
    try{
      await navigator.clipboard.writeText(it.url);
      const st = document.getElementById("status");
      if(st) st.textContent = "🔗 URL 복사됨 — 제품찾기 탭에서 Ctrl+V로 붙여넣으세요";
    }catch(e){}
    window.open('https://shopping.tubefactory.kr', '_blank');
  }
}
async function markSavedButtons(){
  try{
    const d = await (await fetch('/api/saved')).json();
    (d.saved||[]).forEach(sc=>{
      const b=document.getElementById('save_'+sc);
      if(b){ b.textContent='담김✓'; b.classList.add('saved'); }
    });
  }catch(e){}
}
renderCats(); loadLast();
</script>
</body>
</html>
