<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>피드 발굴 채널 판정</title>
<style>
:root{--bg:#0f1115;--card:#171a21;--line:#262b36;--txt:#e8eaf0;--sub:#98a0b3;
      --ok:#2ecc71;--no:#e74c3c;--hold:#e0a33d}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);
     font:14px/1.5 -apple-system,"Malgun Gothic",sans-serif}
header{position:sticky;top:0;background:rgba(15,17,21,.94);backdrop-filter:blur(8px);
       border-bottom:1px solid var(--line);padding:12px 16px;z-index:10}
h1{margin:0 0 6px;font-size:17px}
.bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}
button{background:var(--card);color:var(--txt);border:1px solid var(--line);
       border-radius:8px;padding:7px 13px;cursor:pointer;font-size:13px}
button:hover{border-color:#3a4152}
button.on{background:#2b3244}
.warn{background:#3a1d1d;border:1px solid var(--no);color:#ffb4ab;
      padding:8px 12px;border-radius:8px;margin:8px 16px;display:none}
.wrap{padding:12px 16px 80px}
.ch{background:var(--card);border:1px solid var(--line);border-radius:12px;
    padding:12px;margin-bottom:10px}
.ch.o{border-color:var(--ok)}
.ch.x{border-color:var(--no);opacity:.55}
.ch.h{border-color:var(--hold)}
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
.nm{font-weight:700;font-size:15px}
.meta{color:var(--sub);font-size:12px}
.tag{background:#222836;border-radius:999px;padding:2px 9px;font-size:11px;color:var(--sub)}
.vids{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.v{background:#0e1116;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.v img{width:100%;display:block;aspect-ratio:16/9;object-fit:cover;background:#222}
.v p{margin:0;padding:6px 8px;font-size:12px;color:#cfd4e0;
     display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btns{display:flex;gap:6px;margin-top:9px}
.btns button{flex:0 0 auto;padding:6px 16px;font-weight:700}
.bO.on{background:var(--ok);border-color:var(--ok);color:#04240f}
.bX.on{background:var(--no);border-color:var(--no);color:#2a0b08}
.bH.on{background:var(--hold);border-color:var(--hold);color:#2a1e05}
footer{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,21,.94);
       border-top:1px solid var(--line);padding:10px 16px;
       display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#out{position:fixed;inset:6% 8%;background:#0b0d12;border:1px solid var(--line);
     border-radius:12px;padding:14px;display:none;z-index:20;flex-direction:column}
#out textarea{flex:1;width:100%;background:#05070a;color:#cfd4e0;border:1px solid var(--line);
              border-radius:8px;padding:10px;font:12px/1.4 monospace}
</style></head><body>
<header>
  <h1>피드 발굴 채널 판정 <span class="meta" id="hcount"></span></h1>
  <div class="bar">
    <button onclick="flt('all')"  id="f_all" class="on">전체</button>
    <button onclick="flt('todo')" id="f_todo">안 찍은 것만</button>
    <button onclick="flt('o')"    id="f_o">O만</button>
    <span class="meta" style="margin-left:auto" id="stat"></span>
  </div>
</header>
<div class="warn" id="warn">이 브라우저는 자동저장이 막혀 있습니다 —
  다 찍은 뒤 아래 <b>결과 내보내기</b>로 복사해 주세요.</div>
<div class="wrap" id="wrap"></div>
<footer>
  <button onclick="exportJson()">결과 내보내기</button>
  <span class="meta" id="fstat"></span>
</footer>
<div id="out">
  <div style="margin-bottom:8px">아래 전체를 복사해서 Claude에게 붙여넣어 주세요.</div>
  <textarea id="outta" readonly></textarea>
  <div style="margin-top:8px;display:flex;gap:8px">
    <button onclick="copyOut()">복사</button><button onclick="closeOut()">닫기</button>
  </div>
</div>

var KEY = 'feed_channel_judge_v1';
var mark = {}, filter = 'all', canSave = true;
try { mark = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch(e){ mark = {}; }
try { localStorage.setItem(KEY+'__t','1'); localStorage.removeItem(KEY+'__t'); }
catch(e){ canSave = false; document.getElementById('warn').style.display = 'block'; }

function save(){ if(!canSave) return;
  try { localStorage.setItem(KEY, JSON.stringify(mark)); } catch(e){} }
function nf(n){ return (n||0).toLocaleString(); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g, function(c){
  return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

function set(cid, v){
  if(mark[cid] === v){ delete mark[cid]; } else { mark[cid] = v; }
  save(); render();
}
function flt(f){
  filter = f;
  ['all','todo','o'].forEach(function(x){
    document.getElementById('f_'+x).classList.toggle('on', x === f); });
  render();
}
function render(){
  var rows = DATA.filter(function(r){
    return filter === 'all' ? true
         : filter === 'todo' ? !mark[r.cid]
         : mark[r.cid] === 'o'; });
  document.getElementById('wrap').innerHTML = rows.map(function(r){
    var m = mark[r.cid] || '';
    var vids = (r.vids||[]).map(function(v){
      return '<div class="v"><img src="'+esc(v.th)+'" alt="">'
           + '<p>'+esc(v.t)+'</p></div>'; }).join('');
    return '<div class="ch '+m+'">'
      + '<div class="top"><span class="nm">'+esc(r.title)+'</span>'
      + '<span class="tag">'+esc(r.style)+'</span>'
      + '<span class="meta">구독 '+nf(r.subs)+' · 판정기 '+r.score+'/25 · 썰 '+(r.sul||0)+'편</span></div>'
      + '<div class="vids">'+vids+'</div>'
      + '<div class="btns">'
      + '<button class="bO '+(m==='o'?'on':'')+'" onclick="set(\''+r.cid+'\',\'o\')">쓴다</button>'
      + '<button class="bX '+(m==='x'?'on':'')+'" onclick="set(\''+r.cid+'\',\'x\')">아니다</button>'
      + '<button class="bH '+(m==='h'?'on':'')+'" onclick="set(\''+r.cid+'\',\'h\')">보류</button>'
      + '</div></div>'; }).join('') || '<div class="meta">해당 없음</div>';
  var vals = Object.keys(mark).map(function(k){ return mark[k]; });
  var o = vals.filter(function(v){ return v==='o'; }).length;
  var x = vals.filter(function(v){ return v==='x'; }).length;
  var h = vals.filter(function(v){ return v==='h'; }).length;
  var s = '찍음 '+(o+x+h)+' / '+DATA.length+'   쓴다 '+o+' · 아니다 '+x+' · 보류 '+h;
  document.getElementById('stat').textContent = s;
  document.getElementById('fstat').textContent = s;
  document.getElementById('hcount').textContent = '('+DATA.length+'개)';
}
function exportJson(){
  var out = DATA.map(function(r){
    return {cid:r.cid, title:r.title, subs:r.subs, style:r.style, v: mark[r.cid]||''}; });
  document.getElementById('outta').value = JSON.stringify(out);
  document.getElementById('out').style.display = 'flex';
  document.getElementById('outta').select();
}
function copyOut(){
  var ta = document.getElementById('outta');
  ta.select();
  try { document.execCommand('copy'); } catch(e){}
  if(navigator.clipboard){ navigator.clipboard.writeText(ta.value).catch(function(){}); }
}
function closeOut(){ document.getElementById('out').style.display = 'none'; }
render();
