# /etc/apache2/sites-available/stmaker.conf → a2ensite stmaker
#
# 숏템메이커 서비스의 **정식 도메인** app.stmaker.kr.
# 기존 shoppingshorts.duckdns.org 는 그대로 살려둔다 — 고객 북마크·설치된 확장프로그램·
# 유저스크립트가 그 주소를 물고 있어서, 끊으면 담기가 통째로 죽는다(0순위: 증상 말고 원리).
# 두 도메인이 같은 앱(127.0.0.1:8849)을 가리키므로 어느 쪽으로 들어와도 똑같이 동작한다.
#
# ⚠️ stmaker.kr 루트와 www 는 **건드리지 않는다.** 그쪽은 카페24 쇼핑몰이고
#    카드결제 링크(stmaker.kr/surl/...)가 그 위에서 돈다. 여기로 끌어오면 결제가 죽는다.
#
# 설치 순서 (서버에서):
#   1) DNS: 카페24 DNS 관리에서 A레코드  app → 43.200.48.69   (사장님이 직접)
#      확인:  dig +short app.stmaker.kr   → 43.200.48.69 가 나와야 다음 단계로.
#   2) sudo cp deploy/apache-stmaker.conf /etc/apache2/sites-available/stmaker.conf
#      sudo a2ensite stmaker && sudo systemctl reload apache2
#   3) sudo certbot --apache -d app.stmaker.kr
#      → 443(SSL) VirtualHost가 자동 생성된다. 이 파일은 80만 담당.
#   4) /etc/shopping-shorts.env 에 아래 두 줄을 추가/수정하고 서비스 재시작:
#         PUBLIC_BASE_URL=https://app.stmaker.kr
#         GOOGLE_REDIRECT_URI=https://app.stmaker.kr/auth/google/callback
#      ※ 4)는 구글 콘솔에 새 리디렉션 URI를 **먼저 등록한 뒤**에 해야 한다.
#        등록 전에 바꾸면 redirect_uri_mismatch 로 로그인이 통째로 막힌다.

<VirtualHost *:80>
    ServerName app.stmaker.kr

    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:8849/
    ProxyPassReverse / http://127.0.0.1:8849/

    # duckdns vhost와 같은 값 — apify_client.fetch_reels가 계정 4개를 순환하며
    # 각 900초까지 기다릴 수 있어 최악 3600초. 그 이상으로 여유를 둔다.
    ProxyTimeout 3700

    RewriteEngine on
    RewriteCond %{SERVER_NAME} =app.stmaker.kr
    RewriteRule ^ https://%{SERVER_NAME}%{REQUEST_URI} [END,NE,R=permanent]
</VirtualHost>
